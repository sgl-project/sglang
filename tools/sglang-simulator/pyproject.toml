[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-simulator"
dynamic = ["version"]
description = "A simulation benchmark tool for sglang"
dependencies = [
    "numpy",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
aisimulate = [
    "aisimulate==0.12.1",
]
