[package]
name = "mem_cache"
version = "0.1.0"
edition = "2024"
description = "Rust tree core for the Unified Radix Cache (Full attention component)"
license = "Apache-2.0"
repository = "https://github.com/sgl-project/sglang"

[lib]
name = "mem_cache"
crate-type = ["cdylib"]

# Standalone: not part of the router workspace (links libtorch via tch).
[workspace]

[dependencies]
pyo3 = { version = "0.22", optional = true }
sha2 = "0.10"
tch = { version = "0.22.0" }
thiserror = "1"

# Hardware SHA extensions; identical digests.
[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[features]
# On by default so the loader builds the extension plainly; cargo test runs
# --no-default-features (pyo3's extension-module cannot link test binaries).
default = ["python-extension"]
python-extension = ["dep:pyo3", "pyo3/extension-module", "tch/python-extension"]

