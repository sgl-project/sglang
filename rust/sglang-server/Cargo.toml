[package]
name = "sglang-server"
description = "Sglang server in rust"
version.workspace = true
edition.workspace = true
license.workspace = true

# Consumed by python/setup.py: registers this crate as a PyO3 extension module.
[package.metadata.sglang]
python-module = "sglang.srt.server._core"

[lib]
name = "sglang_server"
# cdylib: the pyo3 module imported by the (embedded) Python scheduler process.
# rlib:   so optional standalone bins / integration tests can link the core.
crate-type = ["cdylib", "rlib"]

[dependencies]
async-stream = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }

axum = { version = "0.8.9", features = ["json", "tokio"] }
core_affinity = "0.8"
dynamo-tokenizers = "1.5.3"
flume = "0.12.0"
# Same major as the workspace pyo3: the zero-copy native MM drain
# (`take_native_mm`) moves Rust vectors into numpy arrays.
numpy = "0.29.0"
regex-syntax = "0.8"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
# The pure-Rust core of the native MM pipeline. `default-features = false`
# drops the pyo3 bindings so the crate links as a plain rlib; the dependency
# is renamed so `use sglang_mm::…` reads naturally while the crate keeps its
# unique `sglang_mm_core` artifact name in the shared workspace target/.
sglang_mm = { package = "sglang-mm", path = "../sglang-mm", default-features = false }
