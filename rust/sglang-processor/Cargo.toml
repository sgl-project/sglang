[package]
name = "sglang-processor"
description = "Shared SGLang wrappers over the Dynamo frontend crates"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["parser", "render", "tokenizer"]
parser = ["dep:dynamo-parsers", "dep:dynamo-protocols"]
render = ["dep:dynamo-protocols", "dep:dynamo-renderer", "dep:minijinja"]
tokenizer = ["dep:dynamo-tokenizers"]

[dependencies]
async-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
# Prompt parity: SGLang serializes tool schemas in their request order.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }

# 9.2.8 moves to dynamo-protocols 7, which dynamo-renderer 7 does not accept yet.
dynamo-parsers = { version = "=9.2.7", optional = true }
dynamo-protocols = { version = "6.1.0", optional = true }
dynamo-renderer = { version = "7.0.0", optional = true }
hf-hub = { version = "0.4", default-features = false }
minijinja = { version = "2.24.0", features = ["unstable_machinery"], optional = true }

# Keep this paired with the server until Dynamo exposes a smaller tokenizer API.
dynamo-tokenizers = { version = "3.0.0", optional = true }

[dev-dependencies]
sha2 = "0.10"
