[package]
name = "sglang-api-types"
description = "Generated SGLang API types: prost structs, tonic services, schema-driven serde"
version.workspace = true
edition.workspace = true
license.workspace = true

# No [package.metadata.sglang]: not a Python extension; wheel builds skip it.

[lib]
name = "sglang_api_types"
crate-type = ["rlib"]

[dependencies]
bytes = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
# preserve_order: raw_json passthrough (custom_params, internal_states, an
# unknown finish reason) re-serializes through serde_json::Value, and the
# contract is "verbatim": key order must not depend on what else links the
# crate.
serde_json = { workspace = true, features = ["preserve_order"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
