[package]
name = "sglang-api-types"
description = "Protobuf messages, tonic gRPC client and server, and JSON serde for SGLang's sglang.api.v1 API"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/sgl-project/sglang"
homepage = "https://docs.sglang.io"
readme = "README.md"
keywords = ["sglang", "grpc", "protobuf", "llm", "inference"]
categories = ["api-bindings"]
# testdata/ is read by the packaged tests.
include = ["src/**", "tests/**", "testdata/**", "README.md"]

# No [package.metadata.sglang]: not a Python extension; wheel builds skip it.

[lib]
name = "sglang_api_types"
crate-type = ["rlib"]

[dependencies]
bytes = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
# preserve_order: raw_json passthrough (custom_params, internal_states, an
# unknown finish reason) re-serializes through serde_json::Value, and the
# contract is "verbatim": key order must not depend on what else links the
# crate.
serde_json = { workspace = true, features = ["preserve_order"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
