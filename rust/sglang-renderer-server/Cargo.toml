[package]
name = "sglang-renderer-server"
description = "Temporary standalone SGLang renderer service with an OpenAI frontend"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sglang-renderer"
path = "src/main.rs"

[dependencies]
sglang-processor = { path = "../sglang-processor" }
async-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

axum = { version = "0.8.9", features = ["json"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dynamo-parsers = "7.0.1"
dynamo-protocols = "5.1.0"
dynamo-renderer = "5.0.0"
dynamo-tokenizers = "1.7.0"
hf-hub = { version = "0.4", default-features = false, features = ["rustls-tls", "tokio"] }

[dev-dependencies]
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
tower = { version = "0.5", features = ["util"] }
