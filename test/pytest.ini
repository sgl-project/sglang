[pytest]
# pytest re-enables DeprecationWarning per test, overriding the filters that
# filter_noisy_warnings (python/sglang/srt/utils/common.py) installs at import.
# Keep these in sync with it.
filterwarnings =
    ignore:builtin type \w+ has no __module__ attribute:DeprecationWarning
    ignore:cutlass\.\S+ is deprecated; use cutlass\.:DeprecationWarning:(flashinfer|quack)(\.|$)
    ignore:Arch from arch\.py is deprecated:DeprecationWarning:(flashinfer|quack)(\.|$)
