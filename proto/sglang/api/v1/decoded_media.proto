syntax = "proto3";
package sglang.api.v1;

// Optional same-host decoded media ingress, enabled by an operator-configured
// private shared root. These are media samples, NOT model-ready features.
// Model resize/normalization/patches/positions remain with existing processors.
message DecodedMediaInput {
  repeated DecodedImage images = 1;
  repeated DecodedVideo videos = 2;
  repeated DecodedAudio audios = 3;
}
message DecodedImage {
  uint32 width = 1;
  uint32 height = 2;
  uint64 row_stride_bytes = 3;
  // Exactly "rgb8": upright interleaved HWC RGB, no alpha or EXIF transform.
  string pixel_format = 4;
  MediaPayloadReference payload = 5;
}
message MediaPayloadReference {
  MountedSharedMemoryRegion mounted_shm = 1;
}
message MountedSharedMemoryRegion {
  // Unique, unpredictable immutable object name under the configured shared
  // root, 16..128 ASCII letters/digits/_/-. Never a URL/path/pointer. Publish
  // complete bytes before Generate, never overwrite/truncate/reuse this name.
  string object_id = 1;
  uint64 offset_bytes = 2;
  uint64 length_bytes = 3;
  // Must match GetServerInfo.instance_id from the receiving native runtime.
  string engine_instance_id = 4;
}
message DecodedVideo {
  // Already sampled: preserve this order; do not perform frame sampling again.
  repeated DecodedVideoFrame frames = 1;
  // Source frame rate and source frame indices preserve temporal provenance.
  // Initial processor bridge requires timestamps consistent with this clock.
  double source_fps = 2;
  uint64 source_frame_count = 3;
}
message DecodedVideoFrame {
  DecodedImage image = 1;
  uint64 timestamp_us = 2;
  uint64 source_frame_index = 3;
}
message DecodedAudio {
  // Interleaved [sample_frames, channels], little-endian IEEE float32 PCM.
  // Finite samples in [-1,1]; the existing loader owns downmix/resampling.
  string sample_format = 1; // Exactly "f32le".
  uint32 sample_rate_hz = 2;
  uint32 channels = 3;
  uint64 sample_frames = 4;
  MediaPayloadReference payload = 5;
}
// gRPC Generate response initial metadata contains
// `sglang-decoded-media-consumed: true` ONLY after all referenced bytes have
// been copied into engine-owned storage. It is a read receipt, not scheduler
// retirement. No metadata/error/cancel/timeout is NOT a receipt. A producer may
// unlink after a receipt; it must never mutate or reuse a published name. An
// unacknowledged object needs producer/supervisor cleanup, not Abort inference.
// The engine never unlinks producer-owned objects. Both containers must mount
// the same memory-backed volume. This is CPU input transport, not GPU IPC/RDMA.
