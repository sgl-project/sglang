// The proto package keeps its wire name, sglang.grpc.encoder, rather than one
// matching this path: gRPC clients and health probes address the service as
// "sglang.grpc.encoder.SglangEncoder".
//
// The Python stubs are checked in under python/sglang/encoder/v1/. After
// changing this file, regenerate them from the repository root:
//
//   pip install grpcio-tools==1.81.1
//   python -m grpc_tools.protoc -I proto --python_out=python \
//     --pyi_out=python --grpc_python_out=python \
//     proto/sglang/encoder/v1/encoder.proto

syntax = "proto3";

package sglang.grpc.encoder;

// Service definition for SGLang encoder server communication
// This protocol enables gRPC-based encoding for EPD (Encode-Prefill-Decode) mode
service SglangEncoder {
  // Encode multimodal items (images/videos/audio)
  rpc Encode(EncodeRequest) returns (EncodeResponse);

  // Send encoded embeddings to prefill server (for mooncake backend)
  rpc Send(SendRequest) returns (SendResponse);

  // Register scheduler receive URL (for zmq_to_scheduler backend)
  rpc SchedulerReceiveUrl(SchedulerReceiveUrlRequest) returns (SchedulerReceiveUrlResponse);

  // Two-phase image handoff for an external router. Stage does not require
  // a receiver. Deliver transfers the already-staged buffer over native ZMQ.
  rpc GetEncoderInfo(GetEncoderInfoRequest) returns (GetEncoderInfoResponse);
  rpc Stage(StageRequest) returns (StageResponse);
  rpc Deliver(DeliverRequest) returns (DeliverResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

message GetEncoderInfoRequest {}
message GetEncoderInfoResponse {
  string model_path = 1;
  string tokenizer_path = 2;
  string served_model_name = 3;
}

message StageRequest {
  string request_id = 1;
  repeated string mm_items = 2; // image URLs in prompt order
}

message ImageLayout {
  uint32 t = 1;
  uint32 h = 2;
  uint32 w = 3;
  string identity = 4; // native full EPD cache key, lowercase hex
}

message StagedImageTransfer {
  uint32 version = 1;
  string request_id = 2;  // router request, shared by E, P and D
  string transfer_id = 3; // unique on each successful stage attempt
  string part_id = 4;     // exact EmbeddingData.req_id on ZMQ
  uint32 part_idx = 5;
  uint32 num_parts = 6;
  uint32 image_count = 7;
  repeated ImageLayout images = 8;
}

message StageResponse { StagedImageTransfer transfer = 1; }
message DeliverRequest {
  StagedImageTransfer transfer = 1;
  string receive_url = 2; // scheduler host:port, IPv6 in brackets
}
message DeliverResponse {}
message ReleaseRequest { string transfer_id = 1; }
message ReleaseResponse {}

// =====================
// Encode Request/Response
// =====================

message EncodeRequest {
  // List of multimodal item URLs (images, videos, audio)
  repeated string mm_items = 1;

  // Unique request identifier
  string req_id = 2;

  // Number of parts for distributed encoding
  uint32 num_parts = 3;

  // Current part index
  uint32 part_idx = 4;

  // Prefill server host for ZMQ transfer
  string prefill_host = 5;

  // Embedding ports for ZMQ transfer (multiple for distributed)
  repeated uint32 embedding_port = 6;
}

message EncodeResponse {
  // Size of embedding in bytes (for mooncake backend)
  uint64 embedding_size = 1;

  // Number of embedding vectors (sequence length)
  uint64 embedding_len = 2;

  // Dimension of each embedding vector
  uint64 embedding_dim = 3;
}

// =====================
// Send Request/Response (mooncake backend)
// =====================

message SendRequest {
  // Request identifier
  string req_id = 1;

  // Prefill server host
  string prefill_host = 2;

  // Embedding port for ZMQ transfer
  uint32 embedding_port = 3;

  // Mooncake session ID
  string session_id = 4;

  // Mooncake buffer address for RDMA transfer
  uint64 buffer_address = 5;
}

message SendResponse {}

// =====================
// Scheduler Receive URL (zmq_to_scheduler backend)
// =====================

message SchedulerReceiveUrlRequest {
  // Request identifier
  string req_id = 1;

  // URL where scheduler expects to receive embeddings
  string receive_url = 2;

  // Expected number of receive endpoints
  uint32 receive_count = 3;
}

message SchedulerReceiveUrlResponse {}
