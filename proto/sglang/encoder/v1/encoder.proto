// The proto package keeps its wire name, sglang.grpc.encoder, rather than one
// matching this path: gRPC clients and health probes address the service as
// "sglang.grpc.encoder.SglangEncoder".
//
// The Python stubs are checked in under python/sglang/encoder/v1/. After
// changing this file, regenerate them from the repository root:
//
//   pip install grpcio-tools==1.81.1
//   python -m grpc_tools.protoc -I proto --python_out=python \
//     --pyi_out=python --grpc_python_out=python \
//     proto/sglang/encoder/v1/encoder.proto

syntax = "proto3";

package sglang.grpc.encoder;

// Service definition for SGLang encoder server communication
// This protocol enables gRPC-based encoding for EPD (Encode-Prefill-Decode) mode
service SglangEncoder {
  // Encode multimodal items (images/videos/audio)
  rpc Encode(EncodeRequest) returns (EncodeResponse);

  // Send encoded embeddings to prefill server (for mooncake backend)
  rpc Send(SendRequest) returns (SendResponse);

  // Register scheduler receive URL (for zmq_to_scheduler backend)
  rpc SchedulerReceiveUrl(SchedulerReceiveUrlRequest) returns (SchedulerReceiveUrlResponse);

  // Two-phase image handoff for an external router. Stage does not require
  // a receiver. For NIXL, Describe sizes the language worker's destination.
  rpc GetEncoderInfo(GetEncoderInfoRequest) returns (GetEncoderInfoResponse);
  rpc Stage(StageRequest) returns (StageResponse);
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Deliver(DeliverRequest) returns (DeliverResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

message GetEncoderInfoRequest {}
message GetEncoderInfoResponse {
  string model_path = 1;
  string tokenizer_path = 2;
  string served_model_name = 3;
  bool supports_staged_video = 4;
  // Source policy applied by the native encoder when fetching remote URLs.
  // A sidecar that fetches bytes on its behalf must honor these bounds.
  StagedMediaPolicy staged_media_policy = 5;
  // Present when this encoder emits the model-specific v3 handoff.
  string native_model_type = 6;
  // Nonempty when this native processor can emit version-4 audio handoffs.
  string staged_audio_model_type = 7;
  // Older encoders that do not set this field are image-capable.
  optional bool supports_staged_images = 8;
  // Random 16-byte UUID for the lifetime of this staged encoder service.
  bytes instance_id = 9;
  // Nonsecret fingerprint and advertised address used to authenticate Stage receipts.
  string handoff_key_id = 10;
  string handoff_peer = 11;
  // Resolved backend used to deliver staged embeddings (nixl or zmq_to_scheduler).
  string staged_transfer_backend = 12;
  // Model and static descriptor layout, independent of available source decoders.
  string staged_layout_id = 13;
}

message StagedMediaPolicy {
  repeated string allowed_domains = 1;
  uint64 max_bytes = 2; // zero means unlimited on the native encoder
  optional double timeout_secs = 3;
}

message StageRequest {
  string request_id = 1;
  repeated string mm_items = 2; // image URLs in prompt order
  repeated string video_urls = 3; // video URLs in prompt order, requires supports_staged_video
  repeated string audio_urls = 4; // audio URLs in prompt order, requires staged_audio_model_type
}

message ImageLayout {
  uint32 t = 1;
  uint32 h = 2;
  uint32 w = 3;
  string identity = 4; // native full EPD cache key, lowercase hex
  uint32 embedding_rows = 5; // v3: exact rows in the packed output
  repeated uint32 original_size = 6; // v3: [width, height] when required by the processor
}

// Grids reflect sampling on the encoder. Each identity covers the embedding
// for one native language-processor item, which can be a clip or a frame group.
message VideoLayout {
  uint32 t = 1;
  uint32 h = 2;
  uint32 w = 3;
  repeated string identities = 4;
  repeated double timestamps = 5;
  optional double second_per_grid_ts = 6;
  uint32 embedding_rows = 7; // v3: exact rows in the packed output
}

message AudioLayout {
  string identity = 1;
  uint32 feature_length = 2; // native EPD audio grid supplied to the language processor
  uint32 embedding_rows = 3; // measured output rows for this clip
  uint32 embedding_width = 4; // native width before padding to the packed visual width
}

message StagedImageTransfer {
  uint32 version = 1;
  string request_id = 2;  // router request, shared by E, P and D
  string transfer_id = 3; // unique on each successful stage attempt
  string part_id = 4;     // exact EmbeddingData.req_id
  uint32 part_idx = 5;
  uint32 num_parts = 6;
  uint32 image_count = 7;
  repeated ImageLayout images = 8;
  // Versions 2 and 3 pack image embedding rows first, followed by video rows.
  // Within each modality, item order matches that of the original prompt.
  repeated VideoLayout videos = 9;
  // Version 3 binds the layout to a native model processor. Grid dimensions are
  // time, height and width. A two-dimensional image grid has t = 1.
  string native_model_type = 10;
  uint32 embedding_width = 11;
  // Version 4 appends audio rows after images and videos. Original prompt
  // token IDs preserve interleaving across modalities.
  repeated AudioLayout audios = 12;
}

message StageResponse {
  StagedImageTransfer transfer = 1;
  // The producing service's GetEncoderInfo.instance_id.
  bytes instance_id = 2;
  // HMAC over the configured endpoint, producer instance and transfer message.
  string handoff_mac = 3;
}
message DescribeRequest { StagedImageTransfer transfer = 1; }
message DescribeResponse {
  repeated uint64 shape = 1; // [tokens, hidden dimensions] of the staged part
  string dtype = 2; // bfloat16, float16 or float32
  // Identity of the process holding this transfer. Only its Release can fence a WRITE.
  bytes instance_id = 3;
}
message DeliverRequest {
  StagedImageTransfer transfer = 1;
  // Supply exactly one destination, matching the encoder transfer backend.
  string receive_url = 2; // ZMQ scheduler host:port, IPv6 in brackets
  bytes nixl_target = 3; // registered NIXL destination descriptor
}
message DeliverResponse {}
// Release also fences a claimed NIXL write before the receiver frees its memory.
message ReleaseRequest { string transfer_id = 1; }
message ReleaseResponse {
  // A replacement at the same endpoint cannot fence the previous process's writes.
  bytes instance_id = 1;
}

// =====================
// Encode Request/Response
// =====================

message EncodeRequest {
  // List of multimodal item URLs (images, videos, audio)
  repeated string mm_items = 1;

  // Unique request identifier
  string req_id = 2;

  // Number of parts for distributed encoding
  uint32 num_parts = 3;

  // Current part index
  uint32 part_idx = 4;

  // Prefill server host for ZMQ transfer
  string prefill_host = 5;

  // Embedding ports for ZMQ transfer (multiple for distributed)
  repeated uint32 embedding_port = 6;
}

message EncodeResponse {
  // Size of embedding in bytes (for mooncake backend)
  uint64 embedding_size = 1;

  // Number of embedding vectors (sequence length)
  uint64 embedding_len = 2;

  // Dimension of each embedding vector
  uint64 embedding_dim = 3;
}

// =====================
// Send Request/Response (mooncake backend)
// =====================

message SendRequest {
  // Request identifier
  string req_id = 1;

  // Prefill server host
  string prefill_host = 2;

  // Embedding port for ZMQ transfer
  uint32 embedding_port = 3;

  // Mooncake session ID
  string session_id = 4;

  // Mooncake buffer address for RDMA transfer
  uint64 buffer_address = 5;
}

message SendResponse {}

// =====================
// Scheduler Receive URL (zmq_to_scheduler backend)
// =====================

message SchedulerReceiveUrlRequest {
  // Request identifier
  string req_id = 1;

  // URL where scheduler expects to receive embeddings
  string receive_url = 2;

  // Expected number of receive endpoints
  uint32 receive_count = 3;
}

message SchedulerReceiveUrlResponse {}
