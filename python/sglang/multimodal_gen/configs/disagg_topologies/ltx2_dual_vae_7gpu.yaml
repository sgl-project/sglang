# SPDX-License-Identifier: Apache-2.0
#
# LTX-2 dual-VAE DAG for a 7-GPU host (e.g. seven H200s).
#
# Put compute where the pipeline bottleneck is: two independent denoiser
# replicas with 2-way SP (4 GPUs total), one GPU per other stage:
#
#   GPU 0: encoder
#   GPU 1-2: denoiser replica 0 (SP2)
#   GPU 3-4: denoiser replica 1 (SP2)
#   GPU 5: vae_video
#   GPU 6: vae_audio
#
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6 MC_FORCE_TCP=1 \\
#     python .../run_ltx2_soak_test.py --gpus 7 --saturate

source: encoder
max_inflight: 16

roles:
  - name: encoder
    stages:
      - InputValidationStage
      - TextEncodingStage
      - LTX2TextConnectorStage
      - LTX2SigmaPreparationStage
      - TimestepPreparationStage
      - LTX2AVLatentPreparationStage
      - LTX2ImageEncodingStage
    modules: [text_encoder, tokenizer, connectors, vae, audio_vae]

  - name: denoiser
    stages: [LTX2AVDenoisingStage]
    modules: [transformer, vae, audio_vae]

  - name: vae_video
    stages: [LTX2VideoDecodingStage]
    modules: [vae]
    terminal: true
    emit: [output]

  - name: vae_audio
    stages: [LTX2AudioDecodingStage]
    modules: [audio_vae, vocoder]
    terminal: true
    emit: [audio, audio_sample_rate]

pools:
  - role: encoder
    urls: ["tcp://0.0.0.0:35010"]
    capacity: 4

  - role: denoiser
    urls: ["tcp://0.0.0.0:35020", "tcp://0.0.0.0:35021"]
    capacity: 2
    parallelism: {sp: 2}

  - role: vae_video
    urls: ["tcp://0.0.0.0:35030"]
    capacity: 4

  - role: vae_audio
    urls: ["tcp://0.0.0.0:35040"]
    capacity: 8

routes:
  - {src: encoder, dst: denoiser}
  - {src: denoiser, dst: vae_video, fields: [latents]}
  - {src: denoiser, dst: vae_audio, when: "generate_audio", fields: [audio_latents]}
