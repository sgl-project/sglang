# SPDX-License-Identifier: Apache-2.0
#
# LTX-2 with the video and audio VAEs on independent pools.
#
# The video VAE is far more expensive than the audio VAE, so the fused
# LTX2AVDecodingStage forces both to the same replica count. Splitting them
# into two terminal nodes lets each scale to its own cost: four sharded video
# decoders against a single audio decoder here.
#
# The denoiser fans out to both, which run concurrently; the orchestrator
# merges their output slices into one response.
#
#   sglang serve --disagg-role server --disagg-dag ltx2_dual_vae.yaml ...
#   sglang serve --disagg-dag ltx2_dual_vae.yaml --dag-node vae_video ...
#
# `modules` only names role-specific weights; the diffusion scheduler and other
# role-agnostic modules load on every node regardless.

source: encoder
max_inflight: 8

roles:
  - name: encoder
    stages:
      - InputValidationStage
      - TextEncodingStage
      - LTX2TextConnectorStage
      - LTX2SigmaPreparationStage
      - TimestepPreparationStage
      - LTX2AVLatentPreparationStage
      - LTX2ImageEncodingStage
    modules: [text_encoder, tokenizer, connectors, vae, audio_vae]

  - name: denoiser
    stages: [LTX2AVDenoisingStage]
    modules: [transformer, vae, audio_vae]

  - name: vae_video
    stages: [LTX2VideoDecodingStage]
    modules: [vae]
    terminal: true
    emit: [output]

  - name: vae_audio
    stages: [LTX2AudioDecodingStage]
    modules: [audio_vae, vocoder]
    terminal: true
    emit: [audio, audio_sample_rate]

pools:
  - role: encoder
    urls: ["tcp://0.0.0.0:35010"]
    capacity: 4

  - role: denoiser
    urls: ["tcp://0.0.0.0:35020", "tcp://0.0.0.0:35021"]
    capacity: 2
    parallelism: {sp: 2}

  - role: vae_video
    urls: ["tcp://0.0.0.0:35030", "tcp://0.0.0.0:35031"]
    capacity: 4
    parallelism: {sp: 2}

  # Audio decoding is cheap; one unsharded replica keeps up with four video ones.
  - role: vae_audio
    urls: ["tcp://0.0.0.0:35040"]
    capacity: 8

routes:
  - {src: encoder, dst: denoiser}
  - {src: denoiser, dst: vae_video, fields: [latents]}
  # The audio branch only needs the audio latents, so the manifest for this
  # edge is filtered down and the video latents never cross the wire twice.
  - {src: denoiser, dst: vae_audio, when: "generate_audio", fields: [audio_latents]}
