# SPDX-License-Identifier: Apache-2.0
#
# LTX-2 dual-VAE DAG for a 3-GPU host (e.g. three H200s).
#
# Logical layout matches ltx2_dual_vae.yaml (fan-out + dual terminals), but
# pools are sized for one replica each so e2e tests can colocate the two VAE
# decoder processes on the same physical GPU:
#
#   GPU 0: encoder
#   GPU 1: denoiser
#   GPU 2: vae_video + vae_audio  (two processes, shared card)
#
# Video and audio still run as separate DAG nodes/pools so fan-out, terminal
# merge, and generate_audio pruning behave the same as the 4-GPU topology.
# Only independent horizontal scaling of the two VAE pools is sacrificed.
#
#   CUDA_VISIBLE_DEVICES=0,1,2 MC_FORCE_TCP=1 \\
#     python .../run_ltx2_3gpu_check.py

source: encoder
max_inflight: 8

roles:
  - name: encoder
    stages:
      - InputValidationStage
      - TextEncodingStage
      - LTX2TextConnectorStage
      - LTX2SigmaPreparationStage
      - TimestepPreparationStage
      - LTX2AVLatentPreparationStage
      - LTX2ImageEncodingStage
    modules: [text_encoder, tokenizer, connectors, vae, audio_vae]

  - name: denoiser
    stages: [LTX2AVDenoisingStage]
    modules: [transformer, vae, audio_vae]

  - name: vae_video
    stages: [LTX2VideoDecodingStage]
    modules: [vae]
    terminal: true
    emit: [output]

  - name: vae_audio
    stages: [LTX2AudioDecodingStage]
    modules: [audio_vae, vocoder]
    terminal: true
    emit: [audio, audio_sample_rate]

pools:
  - role: encoder
    urls: ["tcp://0.0.0.0:35010"]
    capacity: 4

  - role: denoiser
    urls: ["tcp://0.0.0.0:35020"]
    capacity: 2

  - role: vae_video
    urls: ["tcp://0.0.0.0:35030"]
    capacity: 4

  - role: vae_audio
    urls: ["tcp://0.0.0.0:35040"]
    capacity: 4

routes:
  - {src: encoder, dst: denoiser}
  - {src: denoiser, dst: vae_video, fields: [latents]}
  - {src: denoiser, dst: vae_audio, when: "generate_audio", fields: [audio_latents]}
