[graph]
all-features = true

[advisories]
yanked = "warn"
# Unmaintained advisories are checked for direct dependencies only. The
# transitive ones we cannot fix from here (`paste` via tokenizers ->
# dynamo-tokenizers, `number_prefix` via indicatif -> hf-hub, `backoff` and
# `instant` via kube-runtime, `rustls-pemfile` via kube-client) pose no
# security risk; revisit when the upstream crates drop them.
unmaintained = "workspace"
# We want to be notified of new CVEs, so this stays empty except where the
# advisory cannot be fixed from here:
#   * RUSTSEC-2026-0381 (distrusted emSign intermediates in bundled roots)
#     reaches us only through `ureq 2.x` (hf-hub/dynamo-tokenizers downloads);
#     there is no fixed 0.26 release and the fix is the `ureq 3` migration in
#     those upstream crates. Drop this entry once that lands.
ignore = ["RUSTSEC-2026-0381"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Added per the initial license review:
    "CDLA-Permissive-2.0",  # webpki-roots — Linux Foundation permissive license.
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no semver requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
