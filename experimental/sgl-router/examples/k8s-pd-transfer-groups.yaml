# ─────────────────────────────────── router ──────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sgl-router
  namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sgl-router-discovery
  namespace: llm
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sgl-router-discovery
  namespace: llm
subjects:
  - kind: ServiceAccount
    name: sgl-router
    namespace: llm
roleRef:
  kind: Role
  name: sgl-router-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgl-router
  namespace: llm
  labels: { app: sgl-router }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sgl-router }
  template:
    metadata:
      labels: { app: sgl-router }
    spec:
      serviceAccountName: sgl-router
      containers:
        - name: router
          image: <registry>/sgl-router:<tag>     # built from experimental/sgl-router
          args:
            - --host=0.0.0.0
            - --port=30000
            - --model-id=qwen3                  # == engines' --served-model-name
            - --tokenizer-path=/models/Qwen3-32B
            # discovery: PD mode via two label selectors + transfer group label
            - --service-discovery
            - --service-discovery-namespace=llm
            - --prefill-selector
            - app=sglang-qwen3
            - sglang.ai/role=prefill
            - --decode-selector
            - app=sglang-qwen3
            - sglang.ai/role=decode
            - --transfer-group-label=sglang.ai/transfer-group
            # routing: prefill by P2C, decode by least engine-reported load
            - --policy=power_of_two
            - --decode-policy=load_based
            # load monitor (pull mode, GET /v1/loads)
            - --load-monitor
            - --load-monitor-interval-ms=1000
            - --load-monitor-stale-after-ms=3000
            # resilience / observability
            - --cb-threshold=3
            - --cb-cool-down-secs=30
            - --request-timeout-secs=300
            - --log-format=json
          ports:
            - { name: http, containerPort: 30000 }
          readinessProbe:       # 503 until ≥1 complete transfer group is registered
            httpGet: { path: /readyz, port: 30000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 30000 }
            periodSeconds: 10
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }   # tokenizer only
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-weights }
---
apiVersion: v1
kind: Service
metadata:
  name: sgl-router
  namespace: llm
spec:
  selector: { app: sgl-router }
  ports:
    - { name: http, port: 80, targetPort: 30000 }
