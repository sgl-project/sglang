name: Build and Push CI Docker Images

# Publishes docker/ci.Dockerfile, the job container for externally managed CUDA
# runners, next to the dev image: lmsysorg/sglang:dev-ci-<gpu family> plus a dated
# nightly-dev-ci-<gpu family>-<date>-<sha> tag. Nightly builds the scheduled defaults.

on:
  workflow_dispatch:
    inputs:
      gpu_family:
        description: "blackwell (B200, B300, GB300) or hopper (H100, H200)"
        required: false
        type: choice
        options: [blackwell, hopper]
        default: blackwell
      arches:
        description: "Comma-separated architectures: arm64, amd64"
        required: false
        default: "arm64"
      cu_version:
        description: "CU_VERSION the install script uses; keep in step with the fleet"
        required: false
        default: "cu134"
      cuda_version:
        description: "CUDA base image version"
        required: false
        default: "13.4.1"
      tag:
        description: "Custom tag suffix, e.g. 'my-test' -> dev-ci-blackwell-my-test. Empty publishes the rolling and nightly tags."
        required: false
        default: ""
      image_repo:
        description: "Docker Hub repo to push to. Use lmsysorg/sglang-staging for testing."
        required: false
        default: "lmsysorg/sglang"
  schedule:
    # After the 00:00 UTC dev image, so both track the same day of main.
    - cron: "0 3 * * *"

concurrency:
  group: release-docker-ci-${{ inputs.gpu_family || 'blackwell' }}-${{ inputs.tag || 'nightly' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPO: ${{ inputs.image_repo || 'lmsysorg/sglang' }}
  GPU_FAMILY: ${{ inputs.gpu_family || 'blackwell' }}

jobs:
  prepare:
    if: github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Compute build matrix
        id: matrix
        env:
          ARCHES: ${{ inputs.arches || 'arm64' }}
        run: |
          set -euo pipefail
          MATRIX=$(printf '%s' "${ARCHES}" | tr ',' '\n' | tr -d ' ' | jq -R -s -c '
            split("\n") | map(select(length > 0)) | map(
              if . == "amd64" then {arch: ., runner: "x64-docker-build-node"}
              elif . == "arm64" then {arch: ., runner: "arm-docker-build-node"}
              else error("unsupported arch: \(.)") end
            ) | {include: .}')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Cleanup workspace (remove root-owned files from prior runs)
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prune Docker to reclaim disk space
        run: |
          docker buildx prune --filter "until=72h" -f
          docker system prune -af --filter "until=72h"
          docker volume prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        env:
          IS_BLACKWELL: ${{ env.GPU_FAMILY == 'blackwell' && '1' || '0' }}
          CU_VERSION: ${{ inputs.cu_version || 'cu134' }}
          CUDA_VERSION: ${{ inputs.cuda_version || '13.4.1' }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --output type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true \
            -f docker/ci.Dockerfile \
            --build-arg CUDA_VERSION="${CUDA_VERSION}" \
            --build-arg CU_VERSION="${CU_VERSION}" \
            --build-arg IS_BLACKWELL="${IS_BLACKWELL}" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --metadata-file /tmp/metadata-ci.json \
            --no-cache \
            .

          DIGEST=$(python3 -c "import json; print(json.load(open('/tmp/metadata-ci.json'))['containerimage.digest'])")
          echo "Pushed digest: ${DIGEST}"
          mkdir -p /tmp/digests
          printf '%s' "${DIGEST}" > /tmp/digests/${{ matrix.arch }}

      # Matrix legs cannot each set a job output, so the digests travel as artifacts.
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  create-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest
        env:
          TAG_SUFFIX: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SOURCES=()
          for f in /tmp/digests/*; do
            SOURCES+=("${IMAGE_REPO}@$(cat "${f}")")
          done
          BASE="dev-ci-${GPU_FAMILY}"
          if [ -n "${TAG_SUFFIX}" ]; then
            TAGS=(-t "${IMAGE_REPO}:${BASE}-${TAG_SUFFIX}")
          else
            TAGS=(-t "${IMAGE_REPO}:${BASE}" -t "${IMAGE_REPO}:nightly-${BASE}-$(date +%Y%m%d)-${GITHUB_SHA:0:8}")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"
          echo "Published: ${TAGS[*]}"

  cleanup-nightly:
    needs: create-manifest
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/_docker-cleanup-nightly.yml
    with:
      tag_prefixes: '["nightly-dev-ci-blackwell", "nightly-dev-ci-hopper"]'
      image_repo: ${{ inputs.image_repo || 'lmsysorg/sglang' }}
    secrets: inherit
