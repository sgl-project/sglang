name: Release sgl-router

# The router is versioned on its own `router-v*` tags: SGLang's PyPI and Docker
# releases start on every `v*` tag. Release steps: sgl-router/README.md.

on:
  push:
    tags:
      - "router-v[0-9]+.*"
  pull_request:
    paths:
      - "docker/sgl-router.Dockerfile"
      - "sgl-router/Cargo.toml"
      - "sgl-router/Cargo.lock"
      - "sgl-router/rust-toolchain.toml"
      - "sgl-router/pyproject.toml"
      - ".github/workflows/_sgl-router-docker.yml"
      - ".github/workflows/release-sgl-router.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the router-v prefix, e.g. 0.1.0); must match sgl-router/Cargo.toml"
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit to build (default main), for a build that publishes nothing to production; a release to lmsysorg/sgl-router or PyPI builds the router-v<version> tag"
        required: false
        type: string
        default: ""
      image_repo:
        description: "Docker Hub repo to push to. Use lmsysorg/sglang-staging for testing."
        required: false
        type: string
        default: "lmsysorg/sgl-router"
      push_latest:
        description: "Also move the :latest tag to this build"
        required: false
        type: boolean
        default: true
      publish_pypi:
        description: "Also upload the wheels to PyPI (a version can be uploaded only once; builds the router-v<version> tag)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-sgl-router-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Resolve the ref to build
        id: ref
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_IMAGE_REPO: ${{ inputs.image_repo }}
          INPUT_PUBLISH_PYPI: ${{ inputs.publish_pypi }}
        run: |
          version=${INPUT_VERSION#router-v}
          version=${version#v}
          # Same check as "Resolve version and tags", here so a typo fails with
          # this message rather than as a tag the checkout cannot find.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$version' (expected X.Y.Z, optionally with a pre-release suffix)"
            exit 1
          fi
          # The production repo, however its Docker Hub registry is spelled.
          image_repo=${INPUT_IMAGE_REPO:-lmsysorg/sgl-router}
          image_repo=${image_repo#index.docker.io/}
          image_repo=${image_repo#registry-1.docker.io/}
          image_repo=${image_repo#docker.io/}
          if [[ "$image_repo" == "lmsysorg/sgl-router" || "$INPUT_PUBLISH_PYPI" == "true" ]]; then
            # Anything published to production (the image repo or PyPI) is
            # built from the tagged commit, like release-docker.yml.
            ref="refs/tags/router-v${version}"
            if [[ -n "$INPUT_REF" && "$INPUT_REF" != "router-v${version}" && "$INPUT_REF" != "$ref" ]]; then
              echo "::error::ref '$INPUT_REF' is for a build that publishes nothing to production; a release to lmsysorg/sgl-router or PyPI builds $ref."
              exit 1
            fi
          else
            ref=${INPUT_REF:-main}
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout the release ref
        uses: actions/checkout@v4
        with:
          # Empty: the event's own ref (tag push, pull request).
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Resolve version and tags
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ steps.ref.outputs.ref }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          # First `version = "..."` after [package]; the [workspace] table above it has none.
          crate_version=$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p;}' sgl-router/Cargo.toml | head -n1)
          echo "sgl-router/Cargo.toml is at ${crate_version:-<unparsed>}"
          case "$EVENT_NAME" in
            push)
              version=${REF_NAME#router-v}
              ref=$REF_NAME
              push_latest=true
              ;;
            workflow_dispatch)
              version=${INPUT_VERSION#router-v}
              version=${version#v}
              ref=$INPUT_REF
              push_latest=$INPUT_PUSH_LATEST
              ;;
            pull_request)
              version=$crate_version
              ref=""
              push_latest=false
              ;;
            *)
              echo "::error::Unexpected event $EVENT_NAME"
              exit 1
              ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$version' (expected X.Y.Z, optionally with a pre-release suffix)"
            exit 1
          fi
          if [[ "$version" != "$crate_version" ]]; then
            echo "::error::Releasing $version, but sgl-router/Cargo.toml is at $crate_version. Bump the crate (and Cargo.lock) first."
            exit 1
          fi
          tags="v${version}"
          # A pre-release (0.2.0-rc1) never moves :latest, even on a tag push.
          if [[ "$push_latest" == "true" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags} latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Building sgl-router $version from ${ref:-$GITHUB_SHA} with tags: $tags (push: $([[ $EVENT_NAME == pull_request ]] && echo no || echo yes))"

  docker:
    needs: verify
    uses: ./.github/workflows/_sgl-router-docker.yml
    with:
      image_repo: ${{ inputs.image_repo || 'lmsysorg/sgl-router' }}
      tags: ${{ needs.verify.outputs.tags }}
      ref: ${{ needs.verify.outputs.ref }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  # Wheels only, no sdist: the crate's path dependencies live outside sgl-router/.
  pypi-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-24.04
          - target: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.ref }}
          persist-credentials: false

      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' sgl-router/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sgl-router
          target: ${{ matrix.target }}
          manylinux: "2_28"
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          # Same as sgl-router/scripts/build.sh: link the vendored PCRE2.
          docker-options: --env PCRE2_SYS_STATIC=1
          args: --release --locked --out dist

      - name: Install the wheel and run the binary
        run: |
          python3 -m venv /tmp/sgl-router-venv
          /tmp/sgl-router-venv/bin/pip install sgl-router/dist/*.whl
          /tmp/sgl-router-venv/bin/sgl-router --version

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: sgl-router/dist/*.whl
          retention-days: 7

  # Last: a PyPI version can be uploaded only once. Trusted publishing (PyPI
  # registers this workflow file and the `pypi` environment), so no token.
  pypi-publish:
    needs: [docker, pypi-build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-wheel-*
          path: dist
          merge-multiple: true

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
