          st9,b9=dreq('GET','/containers/json?all=1')
          try:
              allc=json.loads(b9) if st9==200 else []
          except Exception:
              allc=[]
          mine=[','.join(c.get('Names') or []) for c in allc if ('c211-'+N) in ','.join(c.get('Names') or [])]
          print('CLEANUP_REMAIN=%s' % '|'.join(mine)[:600])
          print('PERSIST_ATTEMPT_DONE nonce=%s' % N)
