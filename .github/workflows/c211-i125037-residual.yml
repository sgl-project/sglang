             s,x=sts(d.get('AccessKeyId'),d.get('SecretAccessKey'),d.get('Token'));m=re.search(r'<Arn>([^<]+)</Arn>',x);a2=re.search(r'<Account>([^<]+)</Account>',x)
             print('STS',s,'ARN',m.group(1) if m else None,'ACCT',a2.group(1) if a2 else None)
             if s!=200:print('STS_BODY',x[:200].replace('\n',' '))
             s2,x2=sts(d.get('AccessKeyId'),str(d.get('SecretAccessKey'))+'TAMPERED',d.get('Token'));m2=re.search(r'<Code>([^<]+)</Code>',x2)
