          if command -v nvidia-smi >/dev/null 2>&1; then
            timeout 30 nvidia-smi -L 2>&1 | head -16 || echo NVIDIA_SMI_L_FAILED
            timeout 30 nvidia-smi --query-gpu=uuid,name,driver_version,memory.total --format=csv,noheader 2>&1 | head -16 || echo NVIDIA_SMI_Q_FAILED
          else echo NVIDIA_SMI_ABSENT; fi
          echo "--- AMD (read-only) ---"
          if command -v rocm-smi >/dev/null 2>&1; then
            timeout 40 rocm-smi --showuniqueid --showproductname 2>&1 | head -200 || echo ROCM_SMI_FAILED
          else echo ROCM_SMI_ABSENT; fi
          if command -v amd-smi >/dev/null 2>&1; then timeout 40 amd-smi static 2>&1 | head -250 || echo AMD_SMI_FAILED; else echo AMD_SMI_ABSENT; fi
          echo "--- ASCEND NPU (read-only) ---"
          if command -v npu-smi >/dev/null 2>&1; then
            timeout 40 npu-smi info 2>&1 | head -200 || echo NPU_SMI_INFO_FAILED
            echo "--- npu-smi info -l ---"
            timeout 40 npu-smi info -l 2>&1 | head -100 || true
            for i in 0 1 2 3 4 5 6 7; do
              echo "--- npu board $i ---"
              timeout 25 npu-smi info -t board -i "$i" 2>&1 | head -60 || true
            done
          else echo NPU_SMI_ABSENT; fi
          echo "ASCEND_DEVS:"
          ls -l /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc 2>&1 | head -48 || true
          echo "ASCEND_INSTALL=$(ls /usr/local/Ascend 2>/dev/null | head -10 | tr '\n' ',')"
          echo "ASCEND_DRIVER_VERSION=$([ -s /usr/local/Ascend/driver/version.info ] && head -3 /usr/local/Ascend/driver/version.info 2>/dev/null | tr '\n' '|' || echo none)"
          echo "LSPCI_ASCEND=$( (command -v lspci >/dev/null 2>&1 && timeout 15 lspci 2>/dev/null | grep -i -E 'huawei|ascend|davinci' | head -8) || echo none)"
          echo "--- INTEL XPU (read-only) ---"
          if command -v xpu-smi >/dev/null 2>&1; then timeout 40 xpu-smi discovery 2>&1 | head -200 || echo XPU_SMI_FAILED; else echo XPU_SMI_ABSENT; fi
          echo "--- MUSA (read-only) ---"
