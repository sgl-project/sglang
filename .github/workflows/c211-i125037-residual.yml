          echo "C211_MARKER job=npu-800t2-01 label=linux-aarch64-a3-800t-2 nonce=$NONCE host=$(hostname) fqdn=$(hostname -f 2>/dev/null || true) uid=$(id -u) user=$(id -un) ts=$(ts)"
          id 2>&1 || true
