name: ROCm 7.14 GPU visibility diagnostic (AMD)

# Bring-up harness, test branch only.
#
# Established so far: the 7.14 image reports torch device_count()==0 on both
# the mi300 (gfx942) and mi35x (gfx950) runners, while a ROCm 7.2 image in the
# same pod with the same device flags reports 1. rocminfo and amd-smi see the
# GPU from inside the 7.14 container, and HIP emits no kpack log, so the zero
# comes out of HIP's enumeration before any device code is touched. The same
# image sees the GPU locally, on the same amdgpu 6.16.13 driver but kernel 5.15
# instead of the runners' 6.8.
#
# This round asks HIP directly, bypassing torch, and keeps the log unfiltered.
on:
  workflow_dispatch:
  push:
    branches:
      - bingxche/rocm714-ci-test
    paths:
      - .github/workflows/rocm714-gpu-diag.yml
      - scripts/ci/amd/hipprobe.sh

concurrency:
  group: rocm714-gpu-diag-${{ github.sha }}
  cancel-in-progress: true

jobs:
  diag:
    if: github.repository == 'sgl-project/sglang'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: linux-mi300-1gpu-sglang
            image: bingxche/sgl-test:v0.5.17-rocm714-mi30x-20260820
            reference: rocm/sgl-dev:v0.5.8.post1-rocm720-mi30x-20260211-preview
          - runner: linux-mi300-2gpu-sglang
            image: bingxche/sgl-test:v0.5.17-rocm714-mi30x-20260820
            reference: rocm/sgl-dev:v0.5.8.post1-rocm720-mi30x-20260211-preview
    runs-on: ${{ matrix.runner }}
    environment: 'prod'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host view
        run: |
          echo "kernel: $(uname -r)"
          echo "driver: $(cat /sys/module/amdgpu/version 2>/dev/null)"
          echo "podinfo: $(cat /etc/podinfo/gha-render-devices 2>/dev/null)"
          ls -l /dev/dri /dev/kfd

      - name: Ask HIP directly (7.14 image)
        run: |
          DEV=$(cat /etc/podinfo/gha-render-devices 2>/dev/null || echo "--device /dev/dri")
          docker pull ${{ matrix.image }}
          docker run --rm --user root --device=/dev/kfd ${DEV} \
            --group-add video --security-opt seccomp=unconfined --ipc=host \
            -v "$PWD/scripts/ci/amd/hipprobe.sh:/tmp/hipprobe.sh:ro" \
            ${{ matrix.image }} bash -l /tmp/hipprobe.sh 2>&1 || echo "rc=$?"

      - name: Ask HIP directly (ROCm 7.2 image, control)
        if: always()
        run: |
          DEV=$(cat /etc/podinfo/gha-render-devices 2>/dev/null || echo "--device /dev/dri")
          docker pull ${{ matrix.reference }}
          docker run --rm --user root --device=/dev/kfd ${DEV} \
            --group-add video --security-opt seccomp=unconfined --ipc=host \
            -v "$PWD/scripts/ci/amd/hipprobe.sh:/tmp/hipprobe.sh:ro" \
            ${{ matrix.reference }} bash -l /tmp/hipprobe.sh 2>&1 | tail -40 || echo "rc=$?"
