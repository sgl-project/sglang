name: Nightly Test Miles (AMD ROCm 10)

on:
  schedule:
    # Runs after the 12:00 UTC miles image build has pushed the dated image.
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override miles image tag (e.g. miles-rocm10-mi35x-20260901); empty = newest by date"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue on error (do not fail the workflow on test failures)"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  test-miles-mi35x:
    if: github.repository == 'sgl-project/sglang'
    name: test-miles-mi35x (${{ matrix.suite }}, ${{ matrix.runner }}${{ matrix.partition_size && format(', part {0}', matrix.part) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # All suites use the 8-GPU MI35X pool. The 2-GPU suite includes the
        # GLM-5.2 5-layer test, which takes the linux-mi35x-gpu-2 runner down
        # ("runner lost communication") but passes on an 8-GPU runner.
        include:
          - suite: nightly-stage-c-2-gpu-mi350
            runner: linux-mi35x-gpu-2
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub (AMD)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

      - name: Resolve newest miles ROCm 10 image
        run: |
          repo="rocm/sgl-dev"
          base="miles-rocm10-mi35x"
          tag="${{ inputs.image_tag }}"
          if [ -z "${tag}" ]; then
            # Walk back from today; the build job pushes a dated tag at 12:00 UTC.
            # Probe with `manifest inspect` so we don't pull a multi-GB image just
            # to test existence; the real pull happens in amd_ci_start_container.sh.
            for i in $(seq 0 6); do
              d=$(date -u -d "-${i} day" +%Y%m%d)
              candidate="${base}-${d}"
              if docker manifest inspect "${repo}:${candidate}" >/dev/null 2>&1; then
                tag="${candidate}"
                break
              fi
            done
          fi
          if [ -z "${tag}" ]; then
            echo "::error::No ${repo}:${base}-<date> image found on Docker Hub for the last 7 days"
            exit 1
          fi
          echo "MILES_IMAGE=${repo}:${tag}" >> "$GITHUB_ENV"
          echo "Using miles image: ${repo}:${tag}"

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start container from the miles image
        run: bash scripts/ci/amd/amd_ci_start_container.sh --custom-image "${MILES_IMAGE}"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Probe runner pod limits
        run: |
          echo "== cgroup"; cat /proc/self/cgroup
          for f in memory.max memory.current memory.peak memory.events memory/memory.limit_in_bytes memory/memory.usage_in_bytes; do
            [ -r "/sys/fs/cgroup/$f" ] && echo "$f: $(paste -sd' ' "/sys/fs/cgroup/$f")"
          done
          echo "== free"; free -g
          echo "== df (runner)"; df -h / /home/runner /tmp 2>/dev/null || true
          echo "== docker info"; docker info 2>/dev/null | grep -E "Docker Root Dir|Storage Driver|Total Memory|CPUs" || true
          echo "== df (ci_sglang)"; docker exec ci_sglang df -h / /sgl-data /dev/shm 2>/dev/null || true

      - name: Run miles CI suite ${{ matrix.suite }}
        timeout-minutes: 180
        run: |
          touch "${GITHUB_WORKSPACE}/github_summary.md"
          # Resource monitor: one MON line every 15 s, so the last lines before
          # the runner disappears show which resource was climbing.
          (
            while true; do
              mem=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || cat /sys/fs/cgroup/memory/memory.usage_in_bytes 2>/dev/null)
              ev=$(grep -E "^(oom|oom_kill|max) " /sys/fs/cgroup/memory.events 2>/dev/null | paste -sd' ')
              host=$(free -g | awk '/^Mem:/{print "used="$3"G avail="$7"G"}')
              cdf=$(docker exec ci_sglang df -BG --output=used,avail / 2>/dev/null | tail -1 | tr -s ' ')
              rdf=$(df -BG --output=used,avail / 2>/dev/null | tail -1 | tr -s ' ')
              echo "MON $(date -u +%H:%M:%S) pod_mem=$((${mem:-0}/1073741824))G ${ev} host_${host} container_disk_used/avail=${cdf} runner_disk_used/avail=${rdf}"
              sleep 15
            done
          ) &
          TEST_EXIT_CODE=0
          bash scripts/ci/amd/amd_ci_exec.sh -w /root/miles \
            -e PYTHONPATH=/root/miles:/opt/tilelang \
            -e GITHUB_STEP_SUMMARY=/sglang-checkout/github_summary.md \
            python3 tests/ci/run_suite.py --hw rocm --suite ${{ matrix.suite }} --cadence nightly \
            ${{ matrix.partition_size && format('--auto-partition-id {0} --auto-partition-size {1}', matrix.partition_id, matrix.partition_size) || '' }} \
            ${{ (github.event_name != 'workflow_dispatch' || inputs.continue_on_error) && '--continue-on-error' || '' }} || TEST_EXIT_CODE=$?
          cat "${GITHUB_WORKSPACE}/github_summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit ${TEST_EXIT_CODE}
