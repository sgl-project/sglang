name: Build ROCm 10 RC4 + AITER a6d2b564 Images (AMD)

on:
  workflow_dispatch:
    inputs:
      job_select:
        description: 'Select which release job to run'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - publish
  # A new workflow cannot be dispatched until it exists on the default branch,
  # so this isolated test branch builds the AITER variant without disturbing
  # the ROCm 10 RC4 baseline workflow.
  push:
    branches:
      - codex/rocm10-rc4-aiter-a6d2b564

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

env:
  IMAGE_REPO: bingxche/sgl-test
  ROCM_VARIANT: rocm10rc4-aiter-a6d2b564
  AITER_COMMIT: a6d2b564fd671724a3720b8edf70e8d674e4d694

jobs:
  publish:
    if: github.repository == 'sgl-project/sglang' && (github.event_name != 'workflow_dispatch' || inputs.job_select == 'all' || inputs.job_select == 'publish')
    runs-on: amd-docker-scale
    environment: 'prod'
    strategy:
      fail-fast: false
      matrix:
        gpu_arch: ['gfx942-rocm10rc4', 'gfx950-rocm10rc4']
        build_type: ['all']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set date
        run: echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Get version from latest tag
        id: version
        run: |
          VERSION=$(python3 scripts/release/get_version_tag.py --tag-only | sed 's/^v//')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from git tags"
            exit 1
          fi

          COMMIT_HASH=$(git rev-parse --short HEAD)
          PRETEND_VERSION="${VERSION}.dev${{ env.DATE }}+g${COMMIT_HASH}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pretend_version=${PRETEND_VERSION}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub (test)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_AMD_TEST_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TEST_TOKEN }}

      - name: Build and push AITER variant
        run: |
          version=${{ steps.version.outputs.version }}
          pretend_version=${{ steps.version.outputs.pretend_version }}

          case "${{ matrix.gpu_arch }}" in
            gfx942-rocm10rc4) gpu_tag="mi30x" ;;
            gfx950-rocm10rc4) gpu_tag="mi35x" ;;
            *)
              echo "Unsupported gfx arch"
              exit 1
              ;;
          esac

          tag=v${version}-${ROCM_VARIANT}-${gpu_tag}-${{ env.DATE }}
          docker build . -f docker/rocm.Dockerfile \
            --build-arg SGL_BRANCH=${{ github.sha }} \
            --build-arg BUILD_TYPE=${{ matrix.build_type }} \
            --build-arg GPU_ARCH=${{ matrix.gpu_arch }} \
            --build-arg AITER_COMMIT=${AITER_COMMIT} \
            --build-arg ENABLE_MORI=1 \
            --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=${pretend_version} \
            --build-arg UBUNTU_MIRROR=https://archive.ubuntu.com \
            -t ${IMAGE_REPO}:${tag} \
            --no-cache

          stamped_aiter_commit=$(docker run --rm --entrypoint /usr/bin/printenv \
            ${IMAGE_REPO}:${tag} AITER_COMMIT)
          actual_aiter_commit=$(docker run --rm --entrypoint /bin/bash \
            ${IMAGE_REPO}:${tag} \
            -lc 'git -C /sgl-workspace/aiter rev-parse HEAD')
          echo "AITER commit stamped in image: ${stamped_aiter_commit}"
          echo "AITER commit in image: ${actual_aiter_commit}"
          if [[ "${stamped_aiter_commit}" != "${AITER_COMMIT}" || \
                "${actual_aiter_commit}" != "${AITER_COMMIT}" ]]; then
            echo "::error::Expected AITER ${AITER_COMMIT}; stamp=${stamped_aiter_commit}, git=${actual_aiter_commit}"
            exit 1
          fi

          docker push ${IMAGE_REPO}:${tag}

  validate-pr:
    name: Run full AMD PR suite with ROCm 10 RC4 + AITER a6d2b564
    needs: publish
    if: github.event_name == 'push' || inputs.job_select == 'all'
    uses: ./.github/workflows/pr-test-amd-rocm720.yml
    with:
      rocm_version: rocm10rc4-aiter-a6d2b564
      ref: ${{ github.sha }}
      runner_arch: mi300
      run_all_tests: true
      aiter_ref: a6d2b564fd671724a3720b8edf70e8d674e4d694
      continue_on_error: true
    secrets: inherit

  validate-nightly:
    name: Run full AMD nightly suite with ROCm 10 RC4 + AITER a6d2b564
    needs: publish
    if: github.event_name == 'push' || inputs.job_select == 'all'
    uses: ./.github/workflows/nightly-test-amd-rocm720.yml
    with:
      rocm_version: rocm10rc4-aiter-a6d2b564
      ref: ${{ github.sha }}
      aiter_ref: a6d2b564fd671724a3720b8edf70e8d674e4d694
      job_filter: all
      continue_on_error: true
    secrets: inherit
