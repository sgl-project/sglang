name: PR Test (NPU)

on:
  schedule:
    - cron: '0 12 * * *'  # Run daily at 12:00 UTC
  pull_request:
   branches:
     - main
     - 'npu/**'
     - 'npu-*'
  workflow_dispatch:
    inputs:
      coverage_mode:
        description: 'Run in coverage collection mode (uses coverage runners, enables coverage instrumentation, runs setup-covstub)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the event commit SHA.'
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run all tests (for releasing or testing purpose)"
        required: false
        type: boolean
        default: false
      coverage_mode:
        description: 'Run in coverage collection mode (uses coverage runners, enables coverage instrumentation, runs setup-covstub)'
        required: false
        type: boolean
        default: false

concurrency:
  group: pr-test-npu-${{ inputs.coverage_mode == true && 'coverage-' || '' }}${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  # ==================== Check Changes ==================== #
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.filter.outputs.main_package == 'true' || steps.filter.outputs.multimodal_gen == 'true' || steps.run-mode.outputs.run_all_tests == 'true'}}
      main_package: ${{ steps.filter.outputs.main_package == 'true' || steps.run-mode.outputs.run_all_tests == 'true' }}
      multimodal_gen: ${{ steps.filter.outputs.multimodal_gen == 'true' || steps.run-mode.outputs.run_all_tests == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pin to the event SHA (not the branch name) so every job in this run
          # checks out the same commit even if the branch advances mid-run.
          ref: ${{ inputs.ref || github.sha }}

      - name: Determine run mode
        id: run-mode
        run: |
          # Run all tests for scheduled runs and workflow_call (when ref input is provided)
          # Note: github.event_name is inherited from caller, so we detect workflow_call by checking inputs.ref
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.run_all_tests }}" == "true" ]]; then
            echo "run_all_tests=true" >> $GITHUB_OUTPUT
            echo "Run mode: ALL TESTS (schedule=${{ github.event_name == 'schedule' }}, run_all_tests=${{ inputs.run_all_tests }})"
          else
            echo "run_all_tests=false" >> $GITHUB_OUTPUT
            echo "Run mode: FILTERED (triggered by ${{ github.event_name }})"
          fi

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: steps.run-mode.outputs.run_all_tests != 'true'
        with:
          filters: |
            # Everything under python/sglang except multimodal_gen/ and kernels/ops/diffusion/.
            # Exclusions have to be extglobs inside a single pattern: paths-filter ORs the
            # patterns of a filter (predicate-quantifier defaults to "some"), so a standalone
            # "!some/path/**" entry matches every file outside that path and makes the whole
            # filter unconditionally true.
            main_package:
              - "python/sglang/!(*.md)"
              - "python/sglang/!(multimodal_gen|kernels)/**/!(*.md)"
              - "python/sglang/kernels/!(*.md)"
              - "python/sglang/kernels/!(ops)/**/!(*.md)"
              - "python/sglang/kernels/ops/!(*.md)"
              - "python/sglang/kernels/ops/!(diffusion)/**/!(*.md)"
              - "python/pyproject_npu.toml"
              - "scripts/ci/npu/npu_ci_install_dependency.sh"
              - "test/registered/npu/**"
              - "test/registered/unit/npu/**"
              - ".github/workflows/pr-test-npu.yml"
            multimodal_gen:
              - "python/sglang/multimodal_gen/**/!(*.md|*.ipynb)"
              - "python/sglang/kernels/ops/diffusion/**"
              - "python/sglang/srt/**"
              - "python/pyproject_npu.toml"
              - "scripts/ci/npu/npu_ci_install_dependency.sh"
              - ".github/workflows/pr-test-npu.yml"

  # ==================== PR Gate ==================== #
  pr-gate:
    needs: check-changes
    if: ${{ inputs.coverage_mode != true && needs.check-changes.outputs.changes_exist == 'true' }}
    uses: ./.github/workflows/pr-gate.yml
    secrets: inherit

  set-image-config:
    runs-on: ubuntu-latest
    outputs:
      CANN_image_a3: ${{ steps.set-vars.outputs.CANN_image_a3 }}
    steps:
      # When triggered by PR, no inputs parameters are used. The latest community code is tested by default.
      - name: Set image config
        id: set-vars
        run: |
          echo "CANN_image_a3=swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12" >> $GITHUB_OUTPUT

  # Stage-A gate: CPU-only unit tests. The NPU attention-backend UTs stub out
  # torch_npu / sgl_kernel_npu before importing, so a hosted runner suffices.
  base-a-test-npu:
    needs: [check-changes, pr-gate]
    if: ${{ !failure() && !cancelled() && inputs.coverage_mode != true && needs.check-changes.outputs.main_package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SGLANG_IS_IN_CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pin to the event SHA so this job tests the same commit as the rest of the run.
          ref: ${{ inputs.ref || github.sha }}

      # Same gate the NPU stages run first: fail before the NPU jobs are scheduled.
      - uses: ./.github/actions/check-pr-test-health

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'python/pyproject_npu.toml'

      - name: Install dependencies
        timeout-minutes: 30
        env:
          # uv pip targets a venv by default; setup-python has no venv.
          UV_SYSTEM_PYTHON: "1"
        run: |
          # Resolve the same dependency set as the NPU stages, minus Ascend-only wheels.
          rm -f python/pyproject.toml
          mv python/pyproject_npu.toml python/pyproject.toml
          # Versions mirror npu_ci_install_dependency.sh's defaults; keep them in sync.
          # triton: sglang.srt.utils.common imports it unconditionally and the CPU
          # wheel does not pull it in (the NPU image uses triton-ascend instead).
          # unsafe-best-match: --index-url is the lowest-priority index, so the
          # default strategy would resolve PyPI's CUDA torch, not the +cpu build.
          uv pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 triton \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple/ \
            --index-strategy unsafe-best-match
          uv pip install -e "python[dev_npu]" --index-strategy unsafe-best-match

      - name: Run NPU unit tests
        timeout-minutes: 10
        run: |
          cd test
          python3 run_suite.py --hw npu --suite base-a-test-npu

  # Coverage-mode-only counterpart of the base-a PR gate above. Stays on
  # ubuntu-latest like the gate (its UTs mock the NPU stack and need a CPU
  # triton; the NPU image's triton-ascend breaks those mocks), so the shared
  # template (unconditional CANN container:) cannot be used and coverage
  # data reaches setup-covstub via artifact instead of the shared disk.
  base-a-test-npu-cov:
    needs: [set-image-config]
    if: ${{ inputs.coverage_mode == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SGLANG_IS_IN_CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pin to the event SHA so this job tests the same commit as the rest of the run.
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'python/pyproject_npu.toml'

      - name: Install dependencies
        timeout-minutes: 30
        env:
          # uv pip targets a venv by default; setup-python has no venv.
          UV_SYSTEM_PYTHON: "1"
        run: |
          # Same dependency set as the base-a PR gate above (CPU torch + CPU
          # triton, no Ascend wheels); keep the two blocks in sync.
          rm -f python/pyproject.toml
          mv python/pyproject_npu.toml python/pyproject.toml
          uv pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 triton \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple/ \
            --index-strategy unsafe-best-match
          uv pip install -e "python[dev_npu]" --index-strategy unsafe-best-match
          pip install coverage==7.8.*

      - name: Run test with coverage
        timeout-minutes: 15
        run: |
          # Hosted runners cannot write the shared disk, so stage locally;
          # run_tests_with_coverage.sh derives RUN_DIR/date tag from run-level
          # env vars, so the artifact merges 1:1 into the shared-disk layout.
          export PRECISE_TEST_CACHE_ROOT=/tmp/precise-test
          cd test
          python3 ../scripts/ci/npu/precise-test/list_tests.py --hw npu --suite base-a-test-npu \
            -o /tmp/selected_tests.txt
          echo "Selected test files:"
          cat /tmp/selected_tests.txt
          if [ -s /tmp/selected_tests.txt ]; then
            bash ../scripts/ci/npu/precise-test/run_tests_with_coverage.sh $(cat /tmp/selected_tests.txt)
          fi

      - name: Upload coverage outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-outputs-base-a-test-npu
          path: /tmp/precise-test/
          retention-days: 1
          if-no-files-found: warn

  base-b-test-1-npu-a3:
    needs: [check-changes, pr-gate, set-image-config, base-a-test-npu, base-a-test-npu-cov, recommend-tests-from-coverage]
    if: >-
      ${{ !failure() && !cancelled() &&
      (inputs.coverage_mode == true || needs.check-changes.outputs.main_package == 'true') &&
      needs.recommend-tests-from-coverage.outputs.should_run_base_b_test_1_npu_a3 != 'false' }}
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: base-b-test-1-npu-a3
      runner_config: ${{ inputs.coverage_mode == true && 'linux-aarch64-a3-800t-2' || 'linux-aarch64-a3-2-' }}
      image: ${{ needs.set-image-config.outputs.CANN_image_a3 }}
      run_timeout_minutes: '60'
      timeout_per_file: '3600'
      only_tests: ${{ needs.recommend-tests-from-coverage.outputs.only_tests_base_b_test_1_npu_a3 }}
      use_coverage_runner: ${{ inputs.coverage_mode == true }}
    secrets: inherit

  base-b-test-2-npu-a3:
    needs: [check-changes, pr-gate, set-image-config, base-a-test-npu, base-a-test-npu-cov, recommend-tests-from-coverage]
    if: >-
      ${{ !failure() && !cancelled() &&
      (inputs.coverage_mode == true || needs.check-changes.outputs.main_package == 'true') &&
      needs.recommend-tests-from-coverage.outputs.should_run_base_b_test_2_npu_a3 != 'false' }}
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: base-b-test-2-npu-a3
      runner_config: ${{ inputs.coverage_mode == true && 'linux-aarch64-a3-800t-2' || 'linux-aarch64-a3-2-' }}
      image: ${{ needs.set-image-config.outputs.CANN_image_a3 }}
      run_timeout_minutes: '60'
      timeout_per_file: '3600'
      only_tests: ${{ needs.recommend-tests-from-coverage.outputs.only_tests_base_b_test_2_npu_a3 }}
      use_coverage_runner: ${{ inputs.coverage_mode == true }}
    secrets: inherit

  base-b-test-4-npu-a3:
    needs: [check-changes, pr-gate, set-image-config, base-a-test-npu, base-a-test-npu-cov, recommend-tests-from-coverage]
    if: >-
      ${{ !failure() && !cancelled() &&
      (inputs.coverage_mode == true || needs.check-changes.outputs.main_package == 'true') &&
      needs.recommend-tests-from-coverage.outputs.should_run_base_b_test_4_npu_a3 != 'false' }}
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: base-b-test-4-npu-a3
      runner_config: ${{ inputs.coverage_mode == true && 'linux-aarch64-a3-800t-4' || 'linux-aarch64-a3-4-' }}
      image: ${{ needs.set-image-config.outputs.CANN_image_a3 }}
      run_timeout_minutes: '120'
      timeout_per_file: '3600'
      partitions: '{"size":2,"arr":[0, 1]}'
      only_tests: ${{ needs.recommend-tests-from-coverage.outputs.only_tests_base_b_test_4_npu_a3 }}
      use_coverage_runner: ${{ inputs.coverage_mode == true }}
    secrets: inherit

  base-b-test-8-npu-a3:
    needs: [check-changes, pr-gate, set-image-config, base-a-test-npu, base-a-test-npu-cov, recommend-tests-from-coverage]
    if: >-
      ${{ !failure() && !cancelled() &&
      (inputs.coverage_mode == true || needs.check-changes.outputs.main_package == 'true') &&
      needs.recommend-tests-from-coverage.outputs.should_run_base_b_test_8_npu_a3 != 'false' }}
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: base-b-test-8-npu-a3
      runner_config: ${{ inputs.coverage_mode == true && 'linux-aarch64-a3-800t-8' || 'linux-aarch64-a3-8-' }}
      image: ${{ needs.set-image-config.outputs.CANN_image_a3 }}
      run_timeout_minutes: '60'
      timeout_per_file: '3600'
      only_tests: ${{ needs.recommend-tests-from-coverage.outputs.only_tests_base_b_test_8_npu_a3 }}
      use_coverage_runner: ${{ inputs.coverage_mode == true }}
    secrets: inherit

  base-b-test-16-npu-a3:
    needs: [check-changes, pr-gate, set-image-config, base-a-test-npu, base-a-test-npu-cov, recommend-tests-from-coverage]
    if: >-
      ${{ !failure() && !cancelled() &&
      (inputs.coverage_mode == true || needs.check-changes.outputs.main_package == 'true') &&
      needs.recommend-tests-from-coverage.outputs.should_run_base_b_test_16_npu_a3 != 'false' }}
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: base-b-test-16-npu-a3
      runner_config: ${{ inputs.coverage_mode == true && 'linux-aarch64-a3-800t-16' || 'linux-aarch64-a3-16-' }}
      image: ${{ needs.set-image-config.outputs.CANN_image_a3 }}
      run_timeout_minutes: '120'
      timeout_per_file: '3600'
      only_tests: ${{ needs.recommend-tests-from-coverage.outputs.only_tests_base_b_test_16_npu_a3 }}
      use_coverage_runner: ${{ inputs.coverage_mode == true }}
    secrets: inherit

  multimodal-gen-test-1-npu-a3:
    needs: [check-changes, pr-gate, set-image-config, base-a-test-npu, base-a-test-npu-cov]
    if: ${{ !failure() && !cancelled() && (inputs.coverage_mode == true || needs.check-changes.outputs.multimodal_gen == 'true') }}
    runs-on: linux-aarch64-a3-800t-2
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    container:
      image: ${{ needs.set-image-config.outputs.CANN_image_a3 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependencies
        env:
          TORCH_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
          PYPI_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
          UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
          GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
          RUSTUP_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local:8082"
        run: |
          # speed up by using infra cache services
          CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
          sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
          pip config set global.index-url http://${CACHING_URL}/pypi/simple
          pip config set global.trusted-host "${CACHING_URL}"

          bash scripts/ci/npu/npu_ci_install_dependency.sh a3
          # copy required file from our daily cache
          cp ~/.cache/modelscope/hub/datasets/otavia/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json /tmp
          # copy gsm8k dataset from cache
          cp ~/.cache/modelscope/hub/datasets/tmp/test.jsonl /tmp

      - name: Prefetch consistency GT
        env:
          GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
        run: |
          python3 scripts/ci/utils/diffusion/prefetch_consistency_gt.py

      - name: Prefetch image-edit input
        env:
          GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
        run: python3 scripts/ci/utils/diffusion/prefetch_input_image.py

      - name: Run test
        timeout-minutes: ${{ inputs.coverage_mode == true && 150 || 60 }}
        shell: bash
        env:
          SGLANG_USE_MODELSCOPE: true
          SGLANG_IS_IN_CI: true
          HF_ENDPOINT: https://hf-mirror.com
          TORCH_EXTENSIONS_DIR: /tmp/torch_extensions
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          STREAMS_PER_DEVICE: 32
          SGLANG_DIFFUSION_ARTIFACT_DIR: ${{ github.workspace }}/diffusion-failures
        run: |
          # Coverage mode: enumerate this shard's targets with an NPU-only CI
          # helper (it reuses the shared diffusion runner read-only) and run
          # each target in its own `coverage run -m pytest` invocation. The
          # runner normally batches a whole shard into one pytest call, which
          # cannot be attributed per test case by the precise-test selector.
          if [[ "${{ inputs.coverage_mode }}" == "true" ]]; then
            set -euo pipefail
            pip install coverage==7.8.*
            # Coverage tracing slows down the Python glue, which shows up in
            # wall-clock assertions. Relax only the timing tolerances for the
            # collection run; PR runs (no coverage) keep the strict profile and
            # the memory/VRAM checks are untouched.
            export SGLANG_E2E_TOLERANCE=1.0
            export SGLANG_STAGE_TIME_TOLERANCE=1.0
            export SGLANG_NON_DENOISE_STAGE_TIME_TOLERANCE=2.0
            export SGLANG_DENOISE_STEP_TOLERANCE=1.0
            export SGLANG_DENOISE_AGG_TOLERANCE=1.0
            python3 scripts/ci/npu/precise-test/list_multimodal_tests.py \
              --suite 1-npu \
              --partition-id ${{ matrix.part }} \
              --total-partitions 2 \
              -o /tmp/selected_tests.txt
            echo "Selected test targets:"
            cat /tmp/selected_tests.txt
            if [ -s /tmp/selected_tests.txt ]; then
              bash scripts/ci/npu/precise-test/run_tests_with_coverage.sh $(cat /tmp/selected_tests.txt)
            fi
            exit 0
          fi

          cd python
          python3 sglang/multimodal_gen/test/run_suite.py \
            --suite 1-npu \
            --partition-id ${{ matrix.part }} \
            --total-partitions 2

      - name: Upload diffusion failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-failures-npu-1-part${{ matrix.part }}-${{ github.run_attempt }}
          path: diffusion-failures/
          if-no-files-found: ignore
          retention-days: 7

  multimodal-gen-test-4-npu-a3:
    needs: [check-changes, pr-gate, set-image-config, base-a-test-npu, base-a-test-npu-cov]
    if: ${{ !failure() && !cancelled() && (inputs.coverage_mode == true || needs.check-changes.outputs.multimodal_gen == 'true') }}
    runs-on: linux-aarch64-a3-800t-4
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    container:
      image: ${{ needs.set-image-config.outputs.CANN_image_a3 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependencies
        env:
          TORCH_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
          PYPI_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
          UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
          GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
          RUSTUP_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local:8082"
        run: |
          # speed up by using infra cache services
          CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
          sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
          pip config set global.index-url http://${CACHING_URL}/pypi/simple
          pip config set global.trusted-host "${CACHING_URL}"

          bash scripts/ci/npu/npu_ci_install_dependency.sh a3
          # copy required file from our daily cache
          cp ~/.cache/modelscope/hub/datasets/otavia/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json /tmp
          # copy gsm8k dataset
          cp ~/.cache/modelscope/hub/datasets/tmp/test.jsonl /tmp

      - name: Prefetch consistency GT
        env:
          GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
        run: |
          python3 scripts/ci/utils/diffusion/prefetch_consistency_gt.py

      - name: Run test
        timeout-minutes: ${{ inputs.coverage_mode == true && 150 || 60 }}
        shell: bash
        env:
          SGLANG_USE_MODELSCOPE: true
          SGLANG_IS_IN_CI: true
          HF_ENDPOINT: https://hf-mirror.com
          TORCH_EXTENSIONS_DIR: /tmp/torch_extensions
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          STREAMS_PER_DEVICE: 32
          SGLANG_DIFFUSION_ARTIFACT_DIR: ${{ github.workspace }}/diffusion-failures
        run: |
          # Coverage mode: enumerate this shard's targets with an NPU-only CI
          # helper (it reuses the shared diffusion runner read-only) and run
          # each target in its own `coverage run -m pytest` invocation. The
          # runner normally batches a whole shard into one pytest call, which
          # cannot be attributed per test case by the precise-test selector.
          if [[ "${{ inputs.coverage_mode }}" == "true" ]]; then
            set -euo pipefail
            pip install coverage==7.8.*
            # Coverage tracing slows down the Python glue, which shows up in
            # wall-clock assertions. Relax only the timing tolerances for the
            # collection run; PR runs (no coverage) keep the strict profile and
            # the memory/VRAM checks are untouched.
            export SGLANG_E2E_TOLERANCE=1.0
            export SGLANG_STAGE_TIME_TOLERANCE=1.0
            export SGLANG_NON_DENOISE_STAGE_TIME_TOLERANCE=2.0
            export SGLANG_DENOISE_STEP_TOLERANCE=1.0
            export SGLANG_DENOISE_AGG_TOLERANCE=1.0
            python3 scripts/ci/npu/precise-test/list_multimodal_tests.py \
              --suite 2-npu \
              --partition-id ${{ matrix.part }} \
              --total-partitions 2 \
              -o /tmp/selected_tests.txt
            echo "Selected test targets:"
            cat /tmp/selected_tests.txt
            if [ -s /tmp/selected_tests.txt ]; then
              bash scripts/ci/npu/precise-test/run_tests_with_coverage.sh $(cat /tmp/selected_tests.txt)
            fi
            exit 0
          fi

          cd python
          python3 sglang/multimodal_gen/test/run_suite.py \
            --suite 2-npu \
            --partition-id ${{ matrix.part }} \
            --total-partitions 2

      - name: Upload diffusion failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-failures-npu-2-part${{ matrix.part }}-${{ github.run_attempt }}
          path: diffusion-failures/
          if-no-files-found: ignore
          retention-days: 7

  base-c-test-acc-2-npu-a3:
