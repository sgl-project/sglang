  # ==================== Recommend Tests from Coverage ==================== #
  # Recommends PR-affected test cases from the pre-built coverage baseline.
  # continue-on-error so it never blocks the PR gate.
  recommend-tests-from-coverage:
    name: Recommend tests from coverage
    needs: pr-gate
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && inputs.coverage_mode != true }}
    outputs:
      should_run_base_b_test_1_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_1_npu_a3 }}
      only_tests_base_b_test_1_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_1_npu_a3 }}
      should_run_base_b_test_2_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_2_npu_a3 }}
      only_tests_base_b_test_2_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_2_npu_a3 }}
      should_run_base_b_test_4_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_4_npu_a3 }}
      only_tests_base_b_test_4_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_4_npu_a3 }}
      should_run_base_b_test_8_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_8_npu_a3 }}
      only_tests_base_b_test_8_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_8_npu_a3 }}
      should_run_base_b_test_16_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_16_npu_a3 }}
      only_tests_base_b_test_16_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_16_npu_a3 }}
      should_run_base_c_test_acc_2_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_c_test_acc_2_npu_a3 }}
      only_tests_base_c_test_acc_2_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_c_test_acc_2_npu_a3 }}
      should_run_base_c_test_acc_16_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_c_test_acc_16_npu_a3 }}
      only_tests_base_c_test_acc_16_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_c_test_acc_16_npu_a3 }}
      should_run_base_c_test_perf_2_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_c_test_perf_2_npu_a3 }}
      only_tests_base_c_test_perf_2_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_c_test_perf_2_npu_a3 }}
      should_run_base_c_test_perf_16_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_c_test_perf_16_npu_a3 }}
      only_tests_base_c_test_perf_16_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_c_test_perf_16_npu_a3 }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Every step carries step-level continue-on-error so the job conclusion
      # is ALWAYS 'success' — the fast-fail health check in other jobs filters
      # by job conclusion, and job-level continue-on-error still reports
      # 'failure' via the API. Failed steps stay visible (red ✗ + annotation)
      # but never cascade to test jobs.
      - name: Checkout sglang scripts
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          # test/registered + python/sglang/test/ci are needed by
          # list_tests.py to enumerate each suite's test files for bucketing.
          sparse-checkout: |
            scripts
            test/registered
            python/sglang/test/ci
          sparse-checkout-cone-mode: false

      - name: Download test case map
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://sglang-npu.obs.cn-southwest-2.myhuaweicloud.com/coverage/test_case_map.json" \
            -o test_case_map.json
          test -s test_case_map.json
          echo "Downloaded test_case_map.json"
          du -h test_case_map.json

      - name: Download coverage package and extract covstub
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://sglang-npu.obs.cn-southwest-2.myhuaweicloud.com/coverage/outputs.tar.gz" \
            -o outputs.tar.gz
          test -s outputs.tar.gz
          echo "Downloaded outputs.tar.gz"
          du -h outputs.tar.gz
          tar xzf outputs.tar.gz outputs/covstub
          test -d outputs/covstub
          echo "Extracted outputs/covstub"
          find outputs/covstub -maxdepth 2 -type d | head -20 || true

      - name: Recommend tests for current PR
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! python3 -c "import regex" >/dev/null 2>&1; then
            echo "regex not found for $(python3 -V); bootstrapping pip and installing regex"
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3 get-pip.py --break-system-packages
            python3 -m pip install --break-system-packages regex
          fi
          python3 -c "import regex; print('regex ok:', regex.__file__)"
          PR_SPEC="${{ github.repository }}#${{ github.event.pull_request.number }}"
          echo "Selecting tests for PR: ${PR_SPEC}"
          # test_selector.py resolves relative paths against the script's own dir,
          # so pass absolute paths for files downloaded to the workspace root.
          python3 scripts/ci/npu/precise-test/test_selector.py \
            --github-pr "${PR_SPEC}" \
            --source-dir "$PWD/outputs/covstub" \
            --map-file "$PWD/test_case_map.json"

      # Bucket the recommended tests per suite. Downstream jobs consume two
      # outputs per suite: should_run_<suite> ('false' -> skip the job, e.g.
      # empty bucket/recommendation) and only_tests_<suite> (non-empty only in
      # precision mode, gated inside the script). On failure outputs stay
      # empty -> callers run full suites.
      - name: Bucket recommended tests per suite
        id: bucket-tests
        continue-on-error: true
        if: always()
        env:
          # Precision-test switch: 'true' = the a3 suites run only the
          # recommended subset, 'false' = full suites.
          PRECISION_MODE: 'true'
        run: |
          set -euo pipefail
          python3 scripts/ci/npu/precise-test/bucket_recommended_tests.py \
            --recommended scripts/ci/npu/precise-test/recommended_pytest_paths.txt \
            --changed-files scripts/ci/npu/precise-test/pr_changed_files.txt \
            --suites "base-b-test-1-npu-a3,base-b-test-2-npu-a3,base-b-test-4-npu-a3,base-b-test-8-npu-a3,base-b-test-16-npu-a3,base-c-test-acc-2-npu-a3,base-c-test-acc-16-npu-a3,base-c-test-perf-2-npu-a3,base-c-test-perf-16-npu-a3" \
            --precision-mode "${PRECISION_MODE}" \
            --github-output "${GITHUB_OUTPUT}" \
            --github-summary "${GITHUB_STEP_SUMMARY:-}" \
            --report-file recommended-tests-report.md

      # Same report as the step summary, downloadable from the run page.
      - name: Upload recommended tests report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommended-tests-report
          path: recommended-tests-report.md
          if-no-files-found: warn
          retention-days: 7

  # ==================== Coverage Assembly & Publish ==================== #
  # Assembles coverage data and publishes the baseline to the shared disk.
  # !failure() && !cancelled() (not success()): skipped upstream poisons success().
  setup-covstub:
    needs:
      [
        base-a-test-npu-cov,
        base-b-test-1-npu-a3,
        base-b-test-2-npu-a3,
        base-b-test-4-npu-a3,
        base-b-test-8-npu-a3,
        base-b-test-16-npu-a3,
        base-c-test-acc-2-npu-a3,
        base-c-test-acc-16-npu-a3,
        base-c-test-perf-2-npu-a3,
        base-c-test-perf-16-npu-a3,
        multimodal-gen-test-1-npu-a3,
        multimodal-gen-test-4-npu-a3,
      ]
    if: ${{ !failure() && !cancelled() && inputs.coverage_mode == true }}
    runs-on: linux-amd64-cpu-4
    container:
      image: swr.ap-southeast-1.myhuaweicloud.com/base_image/ascend-ci/sglang:main-x86
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pin to the event SHA (not the branch name) so every job in this run
          # checks out the same commit even if the branch advances mid-run.
          ref: ${{ inputs.ref || github.sha }}

      - name: Collect base-a coverage artifact
        # Runs on ubuntu-latest (no shared disk) — hence the artifact relay.
        uses: actions/download-artifact@v4
        with:
          name: coverage-outputs-base-a-test-npu
          path: /tmp/base-a-coverage

      - name: Merge base-a coverage into shared run dir
        run: |
          # Artifact stages {RUN_DIR}/outputs/... — merges 1:1 into the shared layout.
          CACHE_ROOT="/root/.cache/tests/precise-test"
          mkdir -p "${CACHE_ROOT}"
          cp -a /tmp/base-a-coverage/. "${CACHE_ROOT}/"
          echo "Merged base-a coverage into ${CACHE_ROOT}:"
          find "${CACHE_ROOT}" -maxdepth 3 -type d | head -20

      - name: Copy sglang source to covstub
        run: |
          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          COVSTUB="${RUN_DIR}/outputs/covstub"
          mkdir -p "${COVSTUB}"
          cp -r python/sglang "${COVSTUB}/"
          # _version.py is build-generated (git-ignored); the placeholder keeps
          # coverage html from failing on a missing recorded source file.
          echo '__version__ = "0.0.0"' > "${COVSTUB}/sglang/_version.py"

      - name: Build test case map
        shell: bash
        run: |
          set -euo pipefail

          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          # Must match run_tests_with_coverage.sh: GITHUB_RUN_STARTED_AT may be
          # unset on the k8s runner (only explicitly-set envs are injected), so
          # fall back to local date the same way.
          if [ -n "${GITHUB_RUN_STARTED_AT:-}" ]; then
            COV_DATE_TAG="${GITHUB_RUN_STARTED_AT:0:10}"
            COV_DATE_TAG="${COV_DATE_TAG//-/}"
          else
            COV_DATE_TAG="$(date +%Y%m%d)"
          fi
          COV_ROOT="${RUN_DIR}/outputs/sglang@${COV_DATE_TAG}"
          COVSTUB="${RUN_DIR}/outputs/covstub"
          # Standalone top-level deliverable, never packed inside outputs/.
          MAP_FILE="${RUN_DIR}/test_case_map.json"

          echo "Coverage dir: ${COV_ROOT}"
          echo "Source dir: ${COVSTUB}"

          # Coverage data may be absent when no test targets were enumerated
          # (run_tests_with_coverage.sh never ran). Skip map building then.
          if [ ! -d "${COV_ROOT}" ]; then
            echo "::warning::Coverage dir not found: ${COV_ROOT}, skip building test case map"
            exit 0
          fi

          COVERAGE_FILE_COUNT=$(find "${COV_ROOT}" -name 'coverage.*' -type f | wc -l)
          echo "Found ${COVERAGE_FILE_COUNT} coverage files"
          if [ "${COVERAGE_FILE_COUNT}" -eq 0 ]; then
            echo "::warning::No coverage files found under ${COV_ROOT}, skip building test case map"
            exit 0
          fi

          if ! python3 -c "import regex" 2>/dev/null; then
            python3 -m pip install regex \
              -i http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple \
              --trusted-host cache-service.nginx-pypi-cache.svc.cluster.local \
              --retries 3 --timeout 60 \
              || python3 -m pip install regex -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
          fi

          python3 scripts/ci/npu/precise-test/test_selector.py \
            --build-map \
            --coverage-dir "${COV_ROOT}" \
            --source-dir "${COVSTUB}" \
            --map-file "${MAP_FILE}"
          test -s "${MAP_FILE}"
          du -h "${MAP_FILE}"

      - name: Generate HTML coverage report
        # Best-effort add-on: continue-on-error keeps the job green and later
        # steps running, while a failed generation still shows a red ✗ in the UI.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          # Date tag derivation must match run_tests_with_coverage.sh.
          if [ -n "${GITHUB_RUN_STARTED_AT:-}" ]; then
            COV_DATE_TAG="${GITHUB_RUN_STARTED_AT:0:10}"
            COV_DATE_TAG="${COV_DATE_TAG//-/}"
          else
            COV_DATE_TAG="$(date +%Y%m%d)"
          fi
          COV_ROOT="${RUN_DIR}/outputs/sglang@${COV_DATE_TAG}"
          COVSTUB="${RUN_DIR}/outputs/covstub"
          # Standalone top-level dir, packaged into htmlcov.tar.gz at publish.
          REPORT_DIR="${RUN_DIR}/htmlcov"

          # Same skip conditions as map building: no data -> nothing to report.
          if [ ! -d "${COV_ROOT}" ] \
            || [ "$(find "${COV_ROOT}" -name 'coverage.*' -type f | wc -l)" -eq 0 ]; then
            echo "::warning::No coverage data found, skip HTML report"
            exit 0
          fi

          # Failures below exit non-zero (errexit) — red ✗, job stays green.
          # Do NOT convert failures to exit 0 behind an `if ! ( set -e; ... )`
          # guard: bash ignores -e inside a subshell in a condition context,
          # which silently swallowed three failures in run 38713909169.

          # Pin matches the test jobs' coverage==7.8.* so combine can read
          # their SQLite data.
          if ! python3 -c "import coverage" 2>/dev/null; then
            python3 -m pip install coverage==7.8.* \
              -i http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple \
              --trusted-host cache-service.nginx-pypi-cache.svc.cluster.local \
              --retries 3 --timeout 60 \
              || python3 -m pip install coverage==7.8.* -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
          fi

          # Alias runner-specific source paths onto covstub; first entry must
          # be a real local path (no wildcards).
          {
            echo "[run]"
            echo "branch = True"
            echo "[paths]"
            echo "sglang ="
            echo "    ${COVSTUB}/sglang/"
            echo "    */python/sglang/"
          } > /tmp/report-rc

          # --keep preserves the per-test raw coverage files: coverage-data.tar.gz
          # archives them after this step for manual map rebuilds.
          COVERAGE_FILE=/tmp/.coverage-all \
            python3 -m coverage combine --rcfile=/tmp/report-rc --keep \
            $(find "${COV_ROOT}" -name 'coverage.*' -type f)

          rm -rf "${REPORT_DIR}"
          COVERAGE_FILE=/tmp/.coverage-all \
            python3 -m coverage html --rcfile=/tmp/report-rc \
            --directory="${REPORT_DIR}"

          # NPU-only view: [run] source does not filter at report time (a
          # source-based rcfile yields the full report), so instead touch the
          # unexecuted npu .py files into a data copy (os.walk, so the PEP 420
          # namespace tree counts) and filter with --include, which works.
          cp /tmp/.coverage-all /tmp/.coverage-npu
          python3 - "${COVSTUB}" <<'PYEOF'
          import os
          import sys
          from coverage import CoverageData

          npu_root = os.path.join(sys.argv[1], "sglang", "srt", "hardware_backend", "npu")
          data = CoverageData(basename="/tmp/.coverage-npu")
          data.read()
          measured = set(data.measured_files())
          added = 0
          for root, _, files in os.walk(npu_root):
              for f in files:
                  if f.endswith(".py"):
                      p = os.path.join(root, f)
                      if p not in measured:
                          data.touch_file(p)
                          added += 1
          data.write()
          print(f"NPU view: {len(measured)} measured, touched {added} unexecuted files")
          PYEOF
          rm -rf "${REPORT_DIR}-npu"
          COVERAGE_FILE=/tmp/.coverage-npu \
            python3 -m coverage html --rcfile=/tmp/report-rc \
            --include='*/sglang/srt/hardware_backend/npu/*' \
            --directory="${REPORT_DIR}-npu"

          # Surface the totals directly on the run page.
          # GITHUB_STEP_SUMMARY may be unset on the k8s runner pool.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Coverage"
              echo '```'
              echo "python/sglang (measured files only):"
              COVERAGE_FILE=/tmp/.coverage-all \
                python3 -m coverage report --rcfile=/tmp/report-rc | tail -n 1
              echo "python/sglang/srt/hardware_backend/npu (full-tree denominator):"
              COVERAGE_FILE=/tmp/.coverage-npu \
                python3 -m coverage report --rcfile=/tmp/report-rc \
                --include='*/sglang/srt/hardware_backend/npu/*' | tail -n 1
              echo '```'
              echo "Full line-by-line report: download the \`coverage-html-report\` artifact and open \`htmlcov/index.html\` (NPU-only view: \`htmlcov-npu/index.html\`)."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "HTML coverage report: ${REPORT_DIR}"
          echo "NPU-only HTML coverage report: ${REPORT_DIR}-npu"

      - name: Upload HTML coverage report
        # Report upload must never block the baseline publish pipeline.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          # Two paths -> artifact root becomes the run dir, so the archive
          # holds htmlcov/ and htmlcov-npu/ side by side.
          path: |
            /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/htmlcov
            /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/htmlcov-npu
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive outputs
        run: |
          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          # Source-only baseline: recommend mode needs covstub only, and it
          # shrinks the package from ~300MB to a few MB.
          tar -czf "${RUN_DIR}/outputs.tar.gz" -C "${RUN_DIR}" outputs/covstub
          # Raw coverage data for manual map rebuilds: extract both archives
          # under one root to reconstruct outputs/. Absent when no data.
          # Date tag derivation must match run_tests_with_coverage.sh.
          if [ -n "${GITHUB_RUN_STARTED_AT:-}" ]; then
            COV_DATE_TAG="${GITHUB_RUN_STARTED_AT:0:10}"
            COV_DATE_TAG="${COV_DATE_TAG//-/}"
          else
            COV_DATE_TAG="$(date +%Y%m%d)"
          fi
          if [ -d "${RUN_DIR}/outputs/sglang@${COV_DATE_TAG}" ]; then
            tar -czf "${RUN_DIR}/coverage-data.tar.gz" -C "${RUN_DIR}" "outputs/sglang@${COV_DATE_TAG}"
          fi

      - name: Upload outputs and test case map
        # Never blocks the publish pipeline; must run before publish mv's
        # the files to the fixed PUBLISH_DIR (races with concurrent runs).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: precise-test-outputs
          # Two paths -> artifact root becomes RUN_DIR, so the archive
          # holds outputs.tar.gz and test_case_map.json side by side.
          path: |
            /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/outputs.tar.gz
            /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/test_case_map.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload raw coverage data
        # Separate artifact keeps the ~300MB bulk out of the baseline package;
        # must run before publish mv's the file to the fixed PUBLISH_DIR.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: precise-test-coverage-data
          path: /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/coverage-data.tar.gz
          # Absent when all test jobs were skipped (no coverage data).
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish outputs and map to shared disk
        shell: bash
        run: |
          set -euo pipefail

          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          # Fixed-name copy for manual use; the recommend job's baseline lives
          # in OBS (upload outputs.tar.gz + test_case_map.json manually after
          # each run). coverage-data.tar.gz has no automatic consumer — no OBS
          # copy, only this dir and the precise-test-coverage-data artifact.
          PUBLISH_DIR="/root/.cache/tests/precise-test/coverage"

          # Skip publish when no coverage data this run — never overwrite
          # the historical baseline with an incomplete one.
          if [ ! -s "${RUN_DIR}/test_case_map.json" ]; then
            echo "::warning::test_case_map.json missing (no coverage data this run), skip publish"
            exit 0
          fi

          mkdir -p "${PUBLISH_DIR}"

          # Same-filesystem mv is atomic per file, so readers never see a
          # partial file (files from two concurrent publishes can interleave).
          mv "${RUN_DIR}/outputs.tar.gz" "${PUBLISH_DIR}/outputs.tar.gz"
          mv "${RUN_DIR}/test_case_map.json" "${PUBLISH_DIR}/test_case_map.json"
          # Guarded: absent in the unlikely case this run collected no
          # coverage data while still producing a map.
          if [ -f "${RUN_DIR}/coverage-data.tar.gz" ]; then
            mv "${RUN_DIR}/coverage-data.tar.gz" "${PUBLISH_DIR}/coverage-data.tar.gz"
          fi

          # HTML reports too, fixed names — latest wins, like the baseline.
          # [ -d ] guards the continue-on-error generation step. A tar failure
          # aborts red after the baseline mv completed; Cleanup stays skipped,
          # keeping RUN_DIR for recovery.
          if [ -d "${RUN_DIR}/htmlcov" ]; then
            tar -czf "${PUBLISH_DIR}/htmlcov.tar.gz" -C "${RUN_DIR}" htmlcov
          fi
          if [ -d "${RUN_DIR}/htmlcov-npu" ]; then
            tar -czf "${PUBLISH_DIR}/htmlcov-npu.tar.gz" -C "${RUN_DIR}" htmlcov-npu
          fi

          echo "Published baseline to ${PUBLISH_DIR}"
          ls -lh "${PUBLISH_DIR}" | tail -n +2

      - name: Clean up per-run directory
        # Skipped on publish failure, keeping RUN_DIR for manual recovery.
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          rm -rf "${RUN_DIR}"
          echo "Removed ${RUN_DIR}"

  pr-test-npu-finish:
    needs:
      [
        check-changes,

        base-a-test-npu,
        base-a-test-npu-cov,
        base-b-test-1-npu-a3,
        base-b-test-2-npu-a3,
        base-b-test-4-npu-a3,
        base-b-test-8-npu-a3,
        base-b-test-16-npu-a3,

        multimodal-gen-test-1-npu-a3,
        multimodal-gen-test-4-npu-a3,

        base-c-test-acc-2-npu-a3,
        base-c-test-acc-16-npu-a3,
        base-c-test-perf-2-npu-a3,
        base-c-test-perf-16-npu-a3,

        setup-covstub,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          # Convert the 'needs' context to a JSON string
          json_needs='${{ toJson(needs) }}'

          # Get a list of all job names from the JSON keys
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')

          for job in $job_names; do
            # For each job, extract its result
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')

            # Print the job name and its result
            echo "$job: $result"

            # Check for failure or cancellation and exit if found
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done
          # If the loop completes, all jobs were successful
          echo "All jobs completed successfully"
          exit 0
