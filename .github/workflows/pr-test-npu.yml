name: PR Test (NPU)

on:
  schedule:
    - cron: '0 12 * * *'  # Run daily at 12:00 UTC
  pull_request:
    branches:
      - main
      - 'npu/**'
      - 'npu-*'
  workflow_dispatch:
    inputs:
      coverage_mode:
        description: 'Run in coverage collection mode (uses coverage runners, enables coverage instrumentation, runs setup-covstub)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the event commit SHA.'
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run all tests (for releasing or testing purpose)"
        required: false
        type: boolean
        default: false
      coverage_mode:
        description: 'Run in coverage collection mode (uses coverage runners, enables coverage instrumentation, runs setup-covstub)'
        required: false
        type: boolean
        default: false

concurrency:
  group: pr-test-npu-${{ inputs.coverage_mode == true && 'coverage-' || '' }}${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  # ==================== Check Changes ==================== #
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.filter.outputs.main_package == 'true' || steps.filter.outputs.multimodal_gen == 'true' || steps.run-mode.outputs.run_all_tests == 'true'}}
      main_package: ${{ steps.filter.outputs.main_package == 'true' || steps.run-mode.outputs.run_all_tests == 'true' }}
      multimodal_gen: ${{ steps.filter.outputs.multimodal_gen == 'true' || steps.run-mode.outputs.run_all_tests == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pin to the event SHA (not the branch name) so every job in this run
          # checks out the same commit even if the branch advances mid-run.
          ref: ${{ inputs.ref || github.sha }}

      - name: Determine run mode
        id: run-mode
        run: |
          # Run all tests for scheduled runs and workflow_call (when ref input is provided)
          # Note: github.event_name is inherited from caller, so we detect workflow_call by checking inputs.ref
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.run_all_tests }}" == "true" ]]; then
            echo "run_all_tests=true" >> $GITHUB_OUTPUT
            echo "Run mode: ALL TESTS (schedule=${{ github.event_name == 'schedule' }}, run_all_tests=${{ inputs.run_all_tests }})"
          else
            echo "run_all_tests=false" >> $GITHUB_OUTPUT
            echo "Run mode: FILTERED (triggered by ${{ github.event_name }})"
          fi

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: steps.run-mode.outputs.run_all_tests != 'true'
        with:
          filters: |
            # Everything under python/sglang except multimodal_gen/ and kernels/ops/diffusion/.
            # Exclusions have to be extglobs inside a single pattern: paths-filter ORs the
            # patterns of a filter (predicate-quantifier defaults to "some"), so a standalone
            # "!some/path/**" entry matches every file outside that path and makes the whole
            # filter unconditionally true.
            main_package:
              - "python/sglang/!(*.md)"
              - "python/sglang/!(multimodal_gen|kernels)/**/!(*.md)"
              - "python/sglang/kernels/!(*.md)"
              - "python/sglang/kernels/!(ops)/**/!(*.md)"
              - "python/sglang/kernels/ops/!(*.md)"
              - "python/sglang/kernels/ops/!(diffusion)/**/!(*.md)"
              - "python/pyproject_npu.toml"
              - "scripts/ci/npu/npu_ci_install_dependency.sh"
              - "test/registered/npu/**"
              - "test/registered/unit/npu/**"
              - ".github/workflows/pr-test-npu.yml"
            multimodal_gen:
              - "python/sglang/multimodal_gen/**/!(*.md|*.ipynb)"
              - "python/sglang/kernels/ops/diffusion/**"
              - "python/sglang/srt/**"
              - "python/pyproject_npu.toml"
              - "scripts/ci/npu/npu_ci_install_dependency.sh"
              - ".github/workflows/pr-test-npu.yml"

  # ==================== PR Gate ==================== #
  pr-gate:
    needs: check-changes
    if: ${{ inputs.coverage_mode != true && needs.check-changes.outputs.changes_exist == 'true' }}
    uses: ./.github/workflows/pr-gate.yml
    secrets: inherit

  set-image-config:
    runs-on: ubuntu-latest
    outputs:
      CANN_image_a3: ${{ steps.set-vars.outputs.CANN_image_a3 }}
    steps:
      # When triggered by PR, no inputs parameters are used. The latest community code is tested by default.
      - name: Set image config
        id: set-vars
        run: |
          echo "CANN_image_a3=swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12" >> $GITHUB_OUTPUT

  base-c-test-perf-16-npu-a3:
    name: base-c-test-perf-16-npu-a3
    needs: [ check-changes, pr-gate, set-image-config, recommend-tests-from-coverage ]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/_npu-single-node-test-stage.yml
    with:
      runner: linux-aarch64-a3-800t-16
      test_type: 'perf'
      test_suite: base-c-test-perf-16-npu-a3
      image: ${{ needs.set-image-config.outputs.CANN_image_a3 }}
      install_sglang_deps: true
      device_type_for_deps: 'a3'
      test_timeout_minutes: '180'
      only_tests: ${{ needs.recommend-tests-from-coverage.outputs.only_tests_base_c_test_perf_16_npu_a3 }}
      use_coverage_runner: ${{ inputs.coverage_mode == true }}


  # ==================== Recommend Tests from Coverage ==================== #
  # Recommends PR-affected test cases from the pre-built coverage baseline.
  recommend-tests-from-coverage:
    name: Recommend tests from coverage
    needs: [check-changes, pr-gate]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      ${{ !failure() && !cancelled() &&
      github.event_name == 'pull_request' &&
      inputs.coverage_mode != true &&
      needs.check-changes.outputs.changes_exist == 'true' }}
    outputs:
      should_run_base_b_test_1_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_1_npu_a3 }}
      only_tests_base_b_test_1_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_1_npu_a3 }}
      should_run_base_b_test_2_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_2_npu_a3 }}
      only_tests_base_b_test_2_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_2_npu_a3 }}
      should_run_base_b_test_4_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_4_npu_a3 }}
      only_tests_base_b_test_4_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_4_npu_a3 }}
      should_run_base_b_test_8_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_8_npu_a3 }}
      only_tests_base_b_test_8_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_8_npu_a3 }}
      should_run_base_b_test_16_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_b_test_16_npu_a3 }}
      only_tests_base_b_test_16_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_b_test_16_npu_a3 }}
      should_run_base_c_test_acc_2_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_c_test_acc_2_npu_a3 }}
      only_tests_base_c_test_acc_2_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_c_test_acc_2_npu_a3 }}
      should_run_base_c_test_acc_16_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_c_test_acc_16_npu_a3 }}
      only_tests_base_c_test_acc_16_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_c_test_acc_16_npu_a3 }}
      should_run_base_c_test_perf_2_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_c_test_perf_2_npu_a3 }}
      only_tests_base_c_test_perf_2_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_c_test_perf_2_npu_a3 }}
      should_run_base_c_test_perf_16_npu_a3: ${{ steps.bucket-tests.outputs.should_run_base_c_test_perf_16_npu_a3 }}
      only_tests_base_c_test_perf_16_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_base_c_test_perf_16_npu_a3 }}
      should_run_multimodal_gen_test_1_npu_a3: ${{ steps.bucket-tests.outputs.should_run_multimodal_gen_test_1_npu_a3 }}
      only_tests_multimodal_gen_test_1_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_multimodal_gen_test_1_npu_a3 }}
      should_run_multimodal_gen_test_4_npu_a3: ${{ steps.bucket-tests.outputs.should_run_multimodal_gen_test_4_npu_a3 }}
      only_tests_multimodal_gen_test_4_npu_a3: ${{ steps.bucket-tests.outputs.only_tests_multimodal_gen_test_4_npu_a3 }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout sglang scripts
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          # test/registered + python/sglang/test/ci are needed by
          # list_tests.py to enumerate each suite's test files for bucketing.
          # The diffusion case config is read (AST only) by
          # bucket_recommended_tests.py to enumerate multimodal cases.
          sparse-checkout: |
            scripts
            test/registered
            python/sglang/test/ci
            python/sglang/multimodal_gen/test/server/ascend/testcase_configs_npu.py
          sparse-checkout-cone-mode: false

      - name: Download test case map
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://sglang-npu.obs.cn-southwest-2.myhuaweicloud.com/coverage/test_case_map.json" \
            -o test_case_map.json
          test -s test_case_map.json
          echo "Downloaded test_case_map.json"
          du -h test_case_map.json

      - name: Download coverage package and extract covstub
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://sglang-npu.obs.cn-southwest-2.myhuaweicloud.com/coverage/outputs.tar.gz" \
            -o outputs.tar.gz
          test -s outputs.tar.gz
          echo "Downloaded outputs.tar.gz"
          du -h outputs.tar.gz
          tar xzf outputs.tar.gz outputs/covstub
          test -d outputs/covstub
          echo "Extracted outputs/covstub"
          find outputs/covstub -maxdepth 2 -type d | head -20 || true

      - name: Recommend tests for current PR
        continue-on-error: true
        uses: lb-actions/precision-test@v1.0.9
        with:
          repo: sglang
          github-pr: ${{ github.repository }}#${{ github.event.pull_request.number }}
          source-dir: ${{ github.workspace }}/outputs/covstub
          map-file: ${{ github.workspace }}/test_case_map.json

      - name: Export changed-file list for bucketing
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if test -f recommended_pytest_paths.txt; then
            # Paginated files API instead of `gh pr diff --name-only`: the
            # diff endpoint may truncate large PRs, which would silently
            # drop a changed pipeline-config path from the full-run gate.
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename' > "$PWD/pr_changed_files.txt"
            test -s "$PWD/pr_changed_files.txt"
            echo "Changed files: $(wc -l < "$PWD/pr_changed_files.txt")"
          else
            echo "::warning::Precision selector produced no recommendation; dropping the changed-file list so all suites run in full."
            rm -f pr_changed_files.txt
          fi

      # Bucket the recommended tests per suite. Downstream jobs consume two
      # outputs per suite: should_run_<suite> ('false' -> skip the job, e.g.
      # empty bucket in precision mode) and only_tests_<suite> (non-empty only
      # in precision mode, gated inside the script). On failure outputs stay
      # empty -> callers run full suites.
      - name: Bucket recommended tests per suite
        id: bucket-tests
        continue-on-error: true
        if: always()
        env:
          # Precision-test switch: 'true' = the a3 suites run only the
          # recommended subset, 'false' = full suites.
          PRECISION_MODE: 'true'
        run: |
          set -euo pipefail
          python3 scripts/ci/npu/precise-test/bucket_recommended_tests.py \
            --recommended recommended_pytest_paths.txt \
            --changed-files pr_changed_files.txt \
            --suites "base-b-test-1-npu-a3,base-b-test-2-npu-a3,base-b-test-4-npu-a3,base-b-test-8-npu-a3,base-b-test-16-npu-a3,base-c-test-acc-2-npu-a3,base-c-test-acc-16-npu-a3,base-c-test-perf-2-npu-a3,base-c-test-perf-16-npu-a3" \
            --diffusion-suites "multimodal-gen-test-1-npu-a3:1-npu,multimodal-gen-test-4-npu-a3:2-npu" \
            --case-map "$PWD/test_case_map.json" \
            --precision-mode "${PRECISION_MODE}" \
            --github-output "${GITHUB_OUTPUT}" \
            --github-summary "${GITHUB_STEP_SUMMARY:-}" \
            --report-file recommended-tests-report.md

      # Same report as the step summary, downloadable from the run page.
      - name: Upload recommended tests report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommended-tests-report
          path: recommended-tests-report.md
          if-no-files-found: warn
          retention-days: 7

  pr-test-npu-finish:
    needs:
      [
        pr-gate,
        check-changes,
        base-c-test-perf-16-npu-a3,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          # Convert the 'needs' context to a JSON string
          json_needs='${{ toJson(needs) }}'

          # Get a list of all job names from the JSON keys
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')

          for job in $job_names; do
            # For each job, extract its result
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')

            # Print the job name and its result
            echo "$job: $result"

            # Check for failure or cancellation and exit if found
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done
          # If the loop completes, all jobs were successful
          echo "All jobs completed successfully"
          exit 0
