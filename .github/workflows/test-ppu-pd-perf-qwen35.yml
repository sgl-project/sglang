name: Qwen3.5 PD Perf Test 16-PPU (PPU K8s)

on:
  # Dispatch only, and deliberately not wired into any nightly caller: this entry
  # claims two whole ZW-M890P boards and has never had a measured run. It becomes
  # a scheduled line once one has passed, not before -- the same rule the GLM-5.2
  # 16-board PD entry follows.
  #
  # One suite, two checkpoints: the fp8-channelwise and mxfp4-fp8 Qwen3.5 cases the
  # btv1.5 PD plan measures at 1p1d differ in nothing the run's shape cares about,
  # so they share a workflow and a suite. Each checkpoint is a job of its own
  # rather than a single job told which one to serve by an input, because
  # ppu-distributed-action builds both its NAS staging path and its K8s job name
  # out of $GITHUB_JOB: two invocations of one job key, whichever checkpoint each
  # carried, would stage source to the same path and race on the tar. Distinct job
  # keys give each checkpoint its own path, its own pod name and its own artifact,
  # which is what lets a caller run both in one run. The 'all' default runs both;
  # a dispatch can narrow to one, and mxfp4-fp8 is the class default when it does.
  # 手动运行统一走 main 的 nightly 入口，避免绕过全局锁。
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
      pd_config:
        description: 'Which reviewed Qwen3.5 checkpoint(s) to serve.'
        required: false
        type: string
        default: 'all'

concurrency:
  group: test-ppu-qwen35-pd-perf-k8s-${{ inputs.ref || github.ref }}-${{ inputs.pd_config }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312
  PERF_SUITE: nightly-pd-perf-16-qwen35-ppu

jobs:
  # =============================================== mxfp4-fp8 ===============================================
  pd-perf-16-qwen35-mxfp4:
    name: nightly-pd-perf-16-qwen35-mxfp4-ppu (btv1.5)
    # Gated so a dispatch can narrow to one checkpoint; 'all' (the workflow_call
    # default) runs both this and the fp8-channelwise job below, each under its own
    # job key so their NAS staging paths never collide.
    if: inputs.pd_config == 'all' || inputs.pd_config == 'mxfp4-fp8'
    # The orchestration shell is CPU-only and holds no device; the action
    # gang-schedules two worker pods, each onto a board carrying the label.
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # Bounded by the config's own 5400s startup budget per role -- the two loads
    # proceed in parallel, so it is one budget, not two -- plus the endpoint
    # exchange, one measurement of 80 requests at 4096 in / 1500 out, and the
    # dependency install. The first measured run is what should replace this.
    timeout-minutes: 270
    env:
      PD_CONFIG: test/registered/ppu/pd_perf_eval/configs/qwen3.5/397b-a17b-mxfp4-fp8-144g-pd-1p1d-4k-1500.json
      # Same NAS-as-transport arrangement as the colocated multi-board workflow:
      # the pods write under /mnt/wl_nas and this shell reads the same bytes under
      # /wl_nas. Here that directory carries a second load -- it is how the two
      # nodes exchange their HTTP endpoints, their device inventories and rank 0's
      # completion -- so it has to be the same path in every pod, which is why the
      # suite refuses a relative one. $GITHUB_JOB is part of the path, so the two
      # checkpoint jobs never share it.
      PERF_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/perf-results/nightly-pd-perf-16-qwen35-ppu
      PERF_RESULTS_IN_POD: /mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/perf-results/nightly-pd-perf-16-qwen35-ppu
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # fetch-depth 2: ppu_install_dependency.sh detects sgl-kernel source
          # changes via `git diff HEAD~1`.
          fetch-depth: 2
      # Second attempt only if the first failed; see the note on the github.com
      # egress in test-ppu-answer.yml.
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      # What the tag resolves to now, and what the pods are then pinned to. The
      # script's header records why a digest recorded without pinning to it would
      # name an image the measurement need not have used, and why it never fails.
      - name: Resolve the base image digest
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Observe compute Pod environment
        continue-on-error: true
        shell: bash
        env:
          PPU_ENV_JOB: ${{ github.job }}
          PPU_ENV_EXPECTED_PODS: "2"
          PPU_ENV_OUTPUT: ${{ env.PERF_RESULTS_ON_RUNNER }}/environment-pods.tsv
        run: bash scripts/ci/ppu/observe_pod_environment.sh start "$PPU_ENV_OUTPUT"
      - name: Run nightly-pd-perf-16-qwen35-ppu (mxfp4-fp8) via K8s
        uses: flytiger-eco/ppu-distributed-action@caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          # Two nodes of eight, gang-scheduled: the action turns nnodes > 1 into a
          # PodGroup with minMember 2, so the group either gets both boards or
          # waits. That guarantee matters more here than on the colocated line: a
          # prefill server whose decode peer never arrives holds a board for the
          # whole peer-wait budget and then reports nothing. Eight per node is the
          # whole board, which is what each role's tp 8 needs.
          nnodes: 2
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          # The board body is a script rather than an inline command, as on the
          # single-board entries: it is the same body on both nodes, and which role
          # a node serves is decided from the rank the action injects, not here.
          command: bash /workspace/source/scripts/ci/ppu/run_pd_perf_suite_node.sh
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "SGLANG_PPU_DISTRIBUTED_ACTION_SHA=caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9,SGLANG_PPU_WORKFLOW_SHA=${{ github.workflow_sha }},SGLANG_PPU_POD_METADATA=${{ env.PERF_RESULTS_IN_POD }}/environment-pods.tsv,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},GITHUB_REPOSITORY=${{ github.repository }},GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},GITHUB_SERVER_URL=${{ github.server_url }},PERF_SUITE=${{ env.PERF_SUITE }},PERF_TIMEOUT_PER_FILE=13800,SGLANG_PPU_PD_PERF_TEST_CONFIG=/workspace/source/${{ env.PD_CONFIG }},SGLANG_PPU_PD_PERF_RESULTS_DIR=${{ env.PERF_RESULTS_IN_POD }}"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 240

      # Read, not moved: the pods write as root and this shell is a different,
      # non-root uid, so an rm here fails with EPERM on every file and turns the
      # step red even when the suite passed. What the copy brings back is rank 0's
      # report plus, under ranks/, the endpoint each node published, one device
      # inventory per node, each node's own log and each node's exit code. The
      # report is the same schema the colocated line produces, which is why the
      # collector needs no PD-specific variant.
      - name: Collect PD Perf evidence
        if: always()
        shell: bash
        env:
          ENTRY: nightly-pd-perf-16-qwen35-ppu
          PERF_RESULTS_ON_RUNNER: ${{ env.PERF_RESULTS_ON_RUNNER }}
        run: bash scripts/ci/ppu/collect_perf_evidence.sh

      # Best effort with one retry; see the note on the artifact egress in
      # test-ppu-answer.yml. The artifact name carries the checkpoint so the two
      # jobs never claim one name, and the publishing job's glob still gathers both.
      - name: Upload PD Perf evidence
        id: upload_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pd-perf-k8s-16-qwen35-mxfp4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_evidence.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload PD Perf evidence (second attempt)
        id: upload_evidence_2
        if: always() && steps.upload_evidence.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pd-perf-k8s-16-qwen35-mxfp4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          # The first attempt can be reset after it has created the artifact, and
          # v4 refuses a name it already holds.
          overwrite: true
          retention-days: 30
      # Both attempts above fell inside forty-five seconds of each other in run
      # 34548547824 and both were reset: the first while finalising an artifact
      # whose content had already landed, the second before it could create one at
      # all. A third attempt this much later is what covers a congestion window
      # that outlasts a thirty-second wait.
      - name: Wait out a longer artifact egress congestion
        if: always() && steps.upload_evidence_2.outcome == 'failure'
        shell: bash
        run: sleep 120
      - name: Upload PD Perf evidence (third attempt)
        id: upload_evidence_3
        if: always() && steps.upload_evidence_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pd-perf-k8s-16-qwen35-mxfp4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      # Reached only when the third attempt was reset too, because a skipped step
      # has outcome 'skipped' rather than 'failure'. Best effort itself: saying
      # that nothing arrived must not be the thing that turns this job red.
      - name: Report the lost PD Perf evidence
        if: always() && steps.upload_evidence_3.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          ENTRY: nightly-pd-perf-16-qwen35-ppu
          PERF_RESULTS_ON_RUNNER: ${{ env.PERF_RESULTS_ON_RUNNER }}
        run: bash scripts/ci/ppu/report_lost_perf_artifact.sh

  # ============================================ fp8-channelwise ============================================
  pd-perf-16-qwen35-fp8chan:
    name: nightly-pd-perf-16-qwen35-fp8chan-ppu (btv1.5)
    if: inputs.pd_config == 'all' || inputs.pd_config == 'fp8-channelwise'
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 270
    env:
      PD_CONFIG: test/registered/ppu/pd_perf_eval/configs/qwen3.5/397b-a17b-fp8-channelwise-144g-pd-1p1d-4k-1500.json
      PERF_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/perf-results/nightly-pd-perf-16-qwen35-ppu
      PERF_RESULTS_IN_POD: /mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/perf-results/nightly-pd-perf-16-qwen35-ppu
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Resolve the base image digest
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Observe compute Pod environment
        continue-on-error: true
        shell: bash
        env:
          PPU_ENV_JOB: ${{ github.job }}
          PPU_ENV_EXPECTED_PODS: "2"
          PPU_ENV_OUTPUT: ${{ env.PERF_RESULTS_ON_RUNNER }}/environment-pods.tsv
        run: bash scripts/ci/ppu/observe_pod_environment.sh start "$PPU_ENV_OUTPUT"
      - name: Run nightly-pd-perf-16-qwen35-ppu (fp8-channelwise) via K8s
        uses: flytiger-eco/ppu-distributed-action@caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          nnodes: 2
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          command: bash /workspace/source/scripts/ci/ppu/run_pd_perf_suite_node.sh
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "SGLANG_PPU_DISTRIBUTED_ACTION_SHA=caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9,SGLANG_PPU_WORKFLOW_SHA=${{ github.workflow_sha }},SGLANG_PPU_POD_METADATA=${{ env.PERF_RESULTS_IN_POD }}/environment-pods.tsv,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},GITHUB_REPOSITORY=${{ github.repository }},GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},GITHUB_SERVER_URL=${{ github.server_url }},PERF_SUITE=${{ env.PERF_SUITE }},PERF_TIMEOUT_PER_FILE=13800,SGLANG_PPU_PD_PERF_TEST_CONFIG=/workspace/source/${{ env.PD_CONFIG }},SGLANG_PPU_PD_PERF_RESULTS_DIR=${{ env.PERF_RESULTS_IN_POD }}"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 240

      - name: Collect PD Perf evidence
        if: always()
        shell: bash
        env:
          ENTRY: nightly-pd-perf-16-qwen35-ppu
          PERF_RESULTS_ON_RUNNER: ${{ env.PERF_RESULTS_ON_RUNNER }}
        run: bash scripts/ci/ppu/collect_perf_evidence.sh

      - name: Upload PD Perf evidence
        id: upload_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pd-perf-k8s-16-qwen35-fp8chan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_evidence.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload PD Perf evidence (second attempt)
        id: upload_evidence_2
        if: always() && steps.upload_evidence.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pd-perf-k8s-16-qwen35-fp8chan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Wait out a longer artifact egress congestion
        if: always() && steps.upload_evidence_2.outcome == 'failure'
        shell: bash
        run: sleep 120
      - name: Upload PD Perf evidence (third attempt)
        id: upload_evidence_3
        if: always() && steps.upload_evidence_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pd-perf-k8s-16-qwen35-fp8chan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Report the lost PD Perf evidence
        if: always() && steps.upload_evidence_3.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          ENTRY: nightly-pd-perf-16-qwen35-ppu
          PERF_RESULTS_ON_RUNNER: ${{ env.PERF_RESULTS_ON_RUNNER }}
        run: bash scripts/ci/ppu/report_lost_perf_artifact.sh

  # =============================================== the trend series ===============================================
  # File the rows this run measured on the nightly-test-data branch, so that the
  # series outlives the thirty-day artifact retention above. See the note on the
  # same job in test-ppu-perf.yml for why it runs on always(), why the write is
  # confined to this one job, and what a `workflow_call` caller has to grant for it.
  #
  # One publishing job for both checkpoints: it needs both measuring jobs, and its
  # download glob gathers every checkpoint's artifact this run produced. stage_trend_rows.py
  # walks every trend.jsonl under the download and files each under its own test_id,
  # so two checkpoints file two series from the one job; a checkpoint that was gated
  # off or died simply contributes no artifact for the glob to find.

  publish-trend-rows:
    name: 归档趋势原始行（CPU）
    needs: [pd-perf-16-qwen35-mxfp4, pd-perf-16-qwen35-fp8chan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    env:
      TREND_TOOL_SHA: ${{ vars.PPU_TREND_TOOL_SHA }}
    steps:
      - name: 校验维护者配置的工具版本
        id: tool-version
        shell: bash
        run: |
          if [[ ! "$TREND_TOOL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::必须配置PPU_TREND_TOOL_SHA为已审核工具的完整commit SHA'
            exit 1
          fi
          printf 'TREND_OUTPUT_DIR=%s/trend-publication\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout the publishing script
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TREND_TOOL_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: source
      - name: 核验工具checkout身份
        id: trusted
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$TREND_TOOL_SHA"
      - name: Checkout the data branch
        uses: actions/checkout@v4
        with:
          ref: nightly-test-data
          fetch-depth: 0
          path: series
      - name: Download this run's reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ppu-pd-perf-k8s-16-qwen35-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - name: File the rows on the data branch
        if: steps.download.outcome == 'success'
        shell: bash
        working-directory: series
        env:
          INCOMING_DIR: ../incoming
        run: bash ../source/scripts/ci/ppu/publish_trend_rows.sh
      - name: Account for the reports that did not arrive
        if: ${{ !cancelled() && steps.trusted.outcome == 'success' }}
        shell: bash
        env:
          INCOMING_DIR: incoming
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          mkdir -p "$TREND_OUTPUT_DIR"
          python3 source/scripts/ci/ppu/account_for_trend_reports.py | tee "$TREND_OUTPUT_DIR/accounting.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: 保存发布状态与对账
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-trend-rows-pd-perf-qwen35-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TREND_OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: 30
