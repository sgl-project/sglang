name: PR Test (sgl-kv-indexer)

on:
  push:
    branches: [main]
    paths:
      - "experimental/sgl-kv-indexer/**"
      - ".github/workflows/pr-test-sgl-kv-indexer.yml"
  pull_request:
    branches: [main]
    paths:
      - "experimental/sgl-kv-indexer/**"
      - ".github/workflows/pr-test-sgl-kv-indexer.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Must match experimental/sgl-kv-indexer/rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  test:
    name: fmt, clippy, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experimental/sgl-kv-indexer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: experimental/sgl-kv-indexer -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test
