name: Answer Test (PPU K8s)

on:
  # No schedule. GitHub only honours cron from the repository's default branch,
  # and this file lives on a version branch, so a cron here would never fire
  # and would misdescribe the workflow as scheduled. The btv1.5 line is
  # therefore dispatched: by hand, or by a caller through workflow_call.
  # 手动运行统一走 main 的 nightly 入口，避免绕过全局锁。
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: test-ppu-answer-k8s-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# One job per entry, and the entries that share a board queue behind each other
# through `needs` rather than through a matrix. This is not a style choice.
# flytiger-eco/ppu-distributed-action builds both the NAS path it stages the
# source to, /wl_nas/devops/<run>-<attempt>/$GITHUB_JOB/, and the name of the
# K8s job it submits, ppu-<owner>-<run>-<attempt>-<job>, out of the job id --
# which every leg of one matrix shares, since a matrix leg is not a separate
# job id. At max-parallel 1 that is harmless, because the action cleans both up
# before the next leg starts, and that is how the first three entries were
# verified. At max-parallel 8 all twelve legs staged into one directory and
# every one of them failed inside two minutes: git's pack files are mode 444,
# so the second leg to copy one hit EPERM (run 34082162222). Even had the copy
# succeeded they would have submitted twelve pods under one K8s job name and
# each leg's cleanup would have deleted the others' pods. A job-level `env:`
# entry cannot paper over it: GITHUB_JOB is set by the runner and a workflow
# env of the same name does not win (measured, run 34084233664), and the K8s
# job name comes from an expression the action fixes at step level, which no
# caller can reach. So the entries that run at the same time have to be
# different jobs, and eight lanes give the same eight-wide cluster request the
# matrix was asking for. `needs` plus `!cancelled()` is the fail-fast: false of
# this shape -- a lane's second entry runs on its predecessor's verdict, good or
# bad, so one model's failure never suppresses another's evidence, while a
# cancelled run stops claiming boards.
#
# The lanes pair a long entry with a short one where they can. `entry` is what
# keeps configs apart -- in the job name, in the report path and in the artifact
# name -- because `suite` no longer identifies one: three GLM configs and three
# Qwen3.5 configs each share a suite, differing only in which checkpoint the
# config names. A suite is what `--suite` selects, so configs of one model share
# a suite and different models never do; see the docstring of each registered
# file.
#
# Every job body is the same three steps, and a local composite action would be
# the natural place to keep them, but it is not available to these jobs: this
# runner group drives the job through a container hook, so `actions/checkout`
# populates a workspace inside the container while the runner resolves
# `uses: ./` against its own filesystem, where nothing was written. All twelve
# jobs failed on `Can't find 'action.yml' ... under
# /home/runner/_work/sglang-for-sail/sglang-for-sail/.github/actions/...`
# immediately after a checkout that reported success into
# /__w/sglang-for-sail/sglang-for-sail (run 34085102675). A `uses:` of a
# published repository is unaffected -- the runner downloads that itself -- which
# is why the K8s action below works. So the two long shell bodies live in
# scripts/ci/ppu/, which both sides read out of their own checkout, and what is
# left here per entry is the K8s action's inputs.
#
# Every job checks out twice, the second time only if the first failed, because
# the fetch to github.com is the least reliable step in the run and a lost one
# takes the entry down with it. Half the jobs of each eight-wide run so far lost
# at least one `git fetch` inside the window where the lanes start together --
# five of ten in run 34085800820, five of eight in run 34091089985 -- and two of
# those exhausted the three attempts `actions/checkout` makes on its own, so the
# suite step was skipped and the model was never asked anything. Our own traffic
# is not the cause: a depth-2 fetch of this repository is 23 MiB, eight of them
# 190 MiB, and the same pods that could not reach github.com installed their
# whole dependency set from an internal mirror minutes later. The fault is
# specific to that egress path and it clears by itself -- the identical fetch
# took five seconds once the window passed -- and the infrastructure side is
# being asked about the path separately. What this file can do is keep a
# self-clearing fault from judging a model: three attempts with 12 and 19 second
# backoffs span about five minutes, short of the six to eight observed, and a
# second checkout after a 90 second wait roughly doubles what an entry survives.
env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312

jobs:
  # Lane A: the single-card entry first, so a break in the shared serving path
  # shows up in minutes rather than after a 116 GiB load.
  qwen38-27b-bf16:
    name: qwen3.8-27b-bf16 (btv1.5)
    # The orchestration shell is CPU-only and holds no device; the action
    # submits a worker pod onto a board that carries the requested label.
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 150
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # fetch-depth 2: ppu_install_dependency.sh detects sgl-kernel source
          # changes via `git diff HEAD~1`.
          fetch-depth: 2
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Observe compute Pod environment
        continue-on-error: true
        shell: bash
        env:
          PPU_ENV_JOB: ${{ github.job }}
          PPU_ENV_EXPECTED_PODS: "1"
          PPU_ENV_OUTPUT: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/qwen3.8-27b-bf16/environment-pods.tsv
        run: bash scripts/ci/ppu/observe_pod_environment.sh start "$PPU_ENV_OUTPUT"
      - name: Run qwen3.8-27b-bf16 via K8s
        uses: flytiger-eco/ppu-distributed-action@caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9
        with:
          image: ${{ env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          command: bash /workspace/source/scripts/ci/ppu/run_answer_suite_board.sh
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "SGLANG_PPU_DISTRIBUTED_ACTION_SHA=caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9,SGLANG_PPU_WORKFLOW_SHA=${{ github.workflow_sha }},SGLANG_PPU_POD_METADATA=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/qwen3.8-27b-bf16/environment-pods.tsv,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},GITHUB_REPOSITORY=${{ github.repository }},GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},GITHUB_SERVER_URL=${{ github.server_url }},ANSWER_SUITE=nightly-answer-1-ppu,ANSWER_TIMEOUT_PER_FILE=2400,SGLANG_PPU_ANSWER_TEST_CONFIG=/workspace/source/test/registered/ppu/answer_eval/configs/qwen3.8/27b-bf16-144g.json,SGLANG_PPU_ANSWER_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/qwen3.8-27b-bf16"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 120
      - name: Collect Answer evidence
        if: always()
        shell: bash
        env:
          ENTRY: qwen3.8-27b-bf16
          ANSWER_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/answer-results/qwen3.8-27b-bf16
        run: bash scripts/ci/ppu/collect_answer_evidence.sh
      # Best effort, and deliberately so: the verdict has already left this job
      # over the annotations the step above prints, so a reset on the github
      # egress here must not turn a passing suite red. Measured on run
      # 34132812028, whose two-node entry passed all ten cases and was still
      # reported failed because CreateArtifact was reset four seconds in, with
      # no retry of its own. What a lost upload costs is the machine-readable
      # copy -- result.json, junit.xml, and the logs of every rank but rank 0 --
      # which exists nowhere else; the counts and each failing case stay in the
      # job log either way.
      - name: Upload Answer evidence
        id: upload_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-answer-k8s-qwen3.8-27b-bf16-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-answer-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_evidence.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload Answer evidence (second attempt)
        if: always() && steps.upload_evidence.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-answer-k8s-qwen3.8-27b-bf16-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-answer-artifacts/
          if-no-files-found: warn
          # The first attempt can be reset after it has created the
          # artifact, and v4 refuses a name it already holds.
          overwrite: true
          retention-days: 30

