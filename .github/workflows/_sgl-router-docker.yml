name: Build sgl-router Docker Image

# Reusable: builds docker/sgl-router.Dockerfile for amd64 and arm64, each
# natively (no QEMU emulation), pushes both by digest, then stitches them into
# one multi-arch manifest per requested tag so `docker pull` resolves the right
# arch automatically. Callers: nightly-sgl-router-docker.yml (`:nightly` from
# main) and release-sgl-router-docker.yml (`:v<version>` + `:latest` from a
# `router-v*` tag).

on:
  workflow_call:
    inputs:
      image_repo:
        description: "Docker Hub repo to push to (e.g. lmsysorg/sglang-staging for testing)"
        required: false
        type: string
        default: "lmsysorg/sgl-router"
      tags:
        description: "Space-separated image tags to publish (e.g. 'v0.1.0 latest')"
        required: true
        type: string
      ref:
        description: "Git ref to build (empty for the caller's ref)"
        required: false
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        env:
          IMAGE_REPO: ${{ inputs.image_repo }}
        run: |
          docker buildx build . -f docker/sgl-router.Dockerfile \
            --platform ${{ matrix.platform }} \
            --output "type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json
          DIGEST=$(python3 -c "import json; print(json.load(open('/tmp/metadata.json'))['containerimage.digest'])")
          echo "Pushed ${{ matrix.platform }} digest: ${DIGEST}"
          mkdir -p /tmp/digests
          echo "${DIGEST}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  create-manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          IMAGE_REPO: ${{ inputs.image_repo }}
          TAGS: ${{ inputs.tags }}
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/amd64)
          ARM64_DIGEST=$(cat /tmp/digests/arm64)
          tag_args=()
          for tag in ${TAGS}; do
            tag_args+=(-t "${IMAGE_REPO}:${tag}")
          done
          docker buildx imagetools create "${tag_args[@]}" \
            "${IMAGE_REPO}@${AMD64_DIGEST}" \
            "${IMAGE_REPO}@${ARM64_DIGEST}"

      - name: Inspect manifests
        env:
          IMAGE_REPO: ${{ inputs.image_repo }}
          TAGS: ${{ inputs.tags }}
        run: |
          for tag in ${TAGS}; do
            docker buildx imagetools inspect "${IMAGE_REPO}:${tag}"
          done
