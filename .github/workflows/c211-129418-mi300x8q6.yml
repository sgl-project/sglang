name: c211-129418-mi300x8q6
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  mi300-8gpu-01:
    name: probe-job-mi300-8gpu-01
    runs-on: linux-mi300-8gpu-sglang
    timeout-minutes: 12
    steps:
      - name: amd-device-identity
        env:
          NONCE: c211-129418-8a8a26775c9dcdef
        run: |
          set -u
          NONCE='c211-129418-8a8a26775c9dcdef'
          echo "C211_JOB=mi300-8gpu-01 NONCE=$NONCE"
          echo "C211_MARKER job=mi300-8gpu-01 nonce=$NONCE host=$(hostname 2>/dev/null || true) uid=$(id -u) user=$(id -un 2>/dev/null || true)"
          uname -srm 2>&1 || true
          if [ -e /dev/kfd ]; then echo KFD_PRESENT=PRESENT; else echo KFD_PRESENT=ABSENT; fi
          ls -l /dev/kfd 2>&1 | head -5 || true
          if command -v rocm-smi >/dev/null 2>&1; then
            echo "--- ROCM_SMI_UNIQUEID ---"
            rocm-smi --showuniqueid --showproductname 2>&1 | head -200 || echo ROCM_SMI_UNIQUEID_FAILED
            echo "--- ROCM_SMI_DRVVER ---"
            rocm-smi --showdriverversion 2>&1 | head -20 || echo ROCM_SMI_DRVVER_FAILED
          else
            echo ROCM_SMI_ABSENT
          fi
          if command -v amd-smi >/dev/null 2>&1; then
            echo "--- AMD_SMI_STATIC_ASIC_SERIAL ---"
            _ams=$(amd-smi static 2>&1) || echo AMD_SMI_FAILED
            printf '%s\n' "$_ams" | grep -i 'ASIC_SERIAL' | head -20 || true
            if ! printf '%s\n' "$_ams" | grep -qi 'ASIC_SERIAL'; then echo AMD_SMI_ASIC_SERIAL_ABSENT; fi
          else
            echo AMD_SMI_ABSENT
          fi
          echo "--- UNIQUEID_NORMALIZED ---"
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi --showuniqueid 2>&1 | grep -ioE '0x[0-9a-f]{16}' | sort -u | sed 's/^/C211_UNIQUEID=/' || true
          fi
          if [ -r /sys/module/amdgpu/version ]; then echo "AMDGPU_MODULE_VERSION=$(cat /sys/module/amdgpu/version)"; else echo AMDGPU_MODULE_VERSION_ABSENT; fi
          echo "C211_PROBE_END job=mi300-8gpu-01 nonce=$NONCE"
          exit 0
