name: c211-i124681-inv
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  inv-8xh200:
    runs-on: 8-gpu-h200
    timeout-minutes: 15
    steps:
      - name: inventory
        run: |
          set +e
          export NONCE="c211-i124681-8ef3685ac23b321d"
          JOB="inv-8xh200"
          echo "C211_INV_BEGIN job=$JOB nonce=$NONCE"
          echo "C211_MARKER job=$JOB nonce=$NONCE host=$(hostname) fqdn=$(hostname -f 2>/dev/null) uid=$(id -u) user=$(id -un) date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          id
          uname -a
          head -6 /etc/os-release 2>/dev/null
          echo "--- host/users/slurm context ---"
          timeout 10 ls -la /home 2>&1 | head -15
          command -v sinfo squeue srun enroot pyxis 2>&1
          timeout 10 ls -la /opt/slurm /etc/slurm 2>&1 | head -20
          echo "--- gpu ---"
          timeout 30 nvidia-smi -L 2>&1 || echo NVIDIA_SMI_L_FAILED
          timeout 30 nvidia-smi --query-gpu=index,uuid,name,driver_version,memory.total --format=csv,noheader 2>&1 || echo NVIDIA_SMI_Q_FAILED
          echo "--- G1 docker.sock ---"
          for s in /var/run/docker.sock /run/docker.sock; do timeout 10 stat -c 'DOCKER_SOCK %A %a %U:%G %n' "$s" 2>&1 || echo "DOCKER_SOCK_ABSENT $s"; done
          timeout 10 ls -la /var/run/docker.sock /run/docker.sock 2>&1
          timeout 10 readlink -f /var/run/docker.sock 2>&1
          timeout 10 grep -F 'docker.sock' /proc/self/mountinfo 2>/dev/null | head -5
          timeout 10 sh -c 'command -v docker; systemctl show docker.socket -p SocketMode 2>/dev/null | head -3'
          timeout 10 sh -c 'grep -R "SocketMode" /etc/systemd/system /usr/lib/systemd/system /lib/systemd/system 2>/dev/null | head -10'
          echo "--- G1b nonroot socket test ---"
          timeout 20 setpriv --reuid=65534 --regid=65534 --clear-groups sh -c 'id; if [ -S /var/run/docker.sock ]; then test -w /var/run/docker.sock && echo NONROOT_SOCK_WRITABLE || echo NONROOT_SOCK_NOT_WRITABLE; else echo NONROOT_NO_SOCK; fi' 2>&1 || echo SETPRIV_FAILED
          echo "--- G2 gcsfuse ---"
          timeout 10 sh -c 'grep -iE "gcsfuse" /proc/mounts 2>/dev/null | head -20 || echo NO_GCSFUSE_MOUNT'
          timeout 10 sh -c 'grep -E "dir_mode=0?777|file_mode=0?777" /proc/mounts 2>/dev/null | head -10 || echo NO_777_MOUNT_OPTS'
          timeout 10 sh -c 'mount 2>/dev/null | grep -iE "gcs|fuse" | head -20'
          timeout 10 sh -c 'ps -eo pid,user,args 2>/dev/null | grep -i gcsfuse | grep -v grep | head -10'
          timeout 10 ls -la /usr/bin/gcsfuse /usr/local/bin/gcsfuse 2>&1
          timeout 10 stat -c 'ASAPD %A %a %U:%G %n' /var/lib/google/asapd-lite 2>&1 || echo NO_ASAPD
          timeout 10 grep -i gcs /etc/fstab 2>/dev/null
          echo "--- NA1 /fsx /enroot ---"
          for d in /fsx /fsx/enroot /enroot /usr/share/enroot /var/lib/enroot /run/enroot /root/.cache/enroot; do timeout 10 stat -c 'PATHSTAT %A %a %U:%G %n' "$d" 2>&1 || echo "PATH_ABSENT $d"; done
          timeout 10 ls -la /fsx 2>&1 | head -20
          timeout 10 ls -la /enroot 2>&1 | head -20
          timeout 10 sh -c 'mount 2>/dev/null | grep -E "/fsx|/enroot|squashfuse" | head -20'
          timeout 10 sh -c 'grep -vE "^#|^$" /etc/enroot/enroot.conf 2>/dev/null | head -20'
          timeout 10 enroot version 2>&1 | head -5
          timeout 10 sh -c 'env | grep -i ENROOT | head -10'
          timeout 20 sh -c 'find /usr/share/enroot /var/lib/enroot /enroot /root/.cache/enroot /fsx -maxdepth 3 \( -name "*.sqsh" -o -name "*.squashfs" \) 2>/dev/null | head -20'
          echo "--- NA1b nonroot write test (nonce-tagged, self-cleaned) ---"
          timeout 20 setpriv --reuid=65534 --regid=65534 --clear-groups sh -c 'for d in /fsx /enroot /fsx/enroot; do if [ -d "$d" ]; then if test -w "$d"; then f="$d/.c211_probe_$NONCE"; if echo "c211 nonroot probe nonce=$NONCE" > "$f" 2>/dev/null; then echo "NONROOT_WRITE_OK $d $f"; cat "$f"; rm -f "$f" && echo "CLEANED $f"; else echo "NONROOT_WRITE_FAIL $d"; fi; else echo "NONROOT_NOT_WRITABLE $d"; fi; fi; done' 2>&1 || echo SETPRIV_WRITE_FAILED
          echo "--- M3 TCPStore :29500 ---"
          timeout 10 sh -c 'ss -ltnp 2>/dev/null | grep -E ":29500" || echo NO_29500_SS'
          timeout 10 sh -c 'netstat -ltnp 2>/dev/null | grep -E ":29500" || echo NO_29500_NETSTAT'
          timeout 10 sh -c 'grep -iE ":733C" /proc/net/tcp /proc/net/tcp6 2>/dev/null | head -10 || echo NO_PROC_TCP_29500'
          timeout 10 sh -c 'ps -eo pid,user,args 2>/dev/null | grep -iE "torchrun|TCPStore|rendezvous" | grep -v grep | head -10 || echo NO_TORCH_PROC'
          echo "--- general listeners ---"
          timeout 10 sh -c 'ss -ltnp 2>/dev/null | head -40 || netstat -ltnp 2>/dev/null | head -40'
          echo "--- mounts ---"
          timeout 10 df -hT 2>/dev/null | head -25
          timeout 10 sh -c 'cat /proc/mounts | awk "{print \$2, \$3, \$4}" | head -60'
          echo "C211_INV_END job=$JOB nonce=$NONCE"
