# Weekly CUDA tests. Same organisation as nightly, one stage down: a test joins
# the weekly run by declaring `stage="weekly"` plus a runner_config.
name: Weekly Test (Nvidia)

on:
  schedule:
    - cron: '0 0 * * 0'  # Run every Sunday at midnight UTC
  workflow_dispatch:
    inputs:
      runner_filter:
        description: 'Select which runner_config to run (leave empty or "all" to run all)'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - '8-gpu-h200'
      full_parallel:
        description: 'Run all shards of a job at once (faster, but competes with per-commit CI for machines). Off by default: one shard at a time.'
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-test-nvidia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-8-gpu-h200:
    if: github.repository == 'sgl-project/sglang' && (inputs.runner_filter == '' || inputs.runner_filter == 'all' || inputs.runner_filter == '8-gpu-h200')
    uses: ./.github/workflows/_scheduled-test-stage.yml
    with:
      stage: weekly
      runner_config: 8-gpu-h200
      runs_on: 8-gpu-h200
      run_timeout_minutes: 240
      full_parallel: ${{ inputs.full_parallel || false }}
    secrets: inherit
