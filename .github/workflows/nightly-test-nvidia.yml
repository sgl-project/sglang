# Nightly CUDA tests. One job per runner_config; the test list for each comes
# from the `nightly-test-{runner_config}` suite in the registry, so a test
# reaches a machine by declaring `runner_config=` on register_cuda_ci and never
# by editing this file. Machine details live in scripts/ci/runner_configs.yml.
#
# Everything scheduled onto one machine type shares a job and is split by
# auto_partition; per-file time budgets come from each test's own est_time
# (--timeout-from-est-time), so a slow test no longer sets the cap for the
# fast ones sharing its job.
name: Nightly Test (Nvidia)

on:
  schedule:
    - cron: '0 14 */2 * *'
  workflow_dispatch:
    inputs:
      runner_filter:
        description: 'Select which runner_config to run (leave empty or "all" to run all)'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - '1-gpu-large'
          - '2-gpu-large'
          - '4-gpu-h100'
          - '4-gpu-b200'
          - '4-gpu-gb300'
          - '8-gpu-h200'
          - '8-gpu-b200'
          - 'diffusion'
      force_baseline_update:
        description: 'Refresh the precision rolling baseline instead of comparing (sets SGLANG_PRECISION_FORCE_UPDATE=1). Dispatch once after an intentional forward-path dtype/precision change stales the baseline; later scheduled runs compare against it and go green.'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      runner_filter:
        description: 'Select which runner_config to run (leave empty or "all" to run all)'
        required: false
        type: string
        default: 'all'

concurrency:
  group: nightly-test-nvidia-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  # Partition counts target roughly 2.5-3h per partition, from the summed
  # est_time of each suite. max_parallel reflects how many machines of that
  # type the pool can give us at once.
  nightly-1-gpu-large:
    if: github.repository == 'sgl-project/sglang' && (inputs.runner_filter == '' || inputs.runner_filter == 'all' || inputs.runner_filter == '1-gpu-large')
    uses: ./.github/workflows/_scheduled-test-stage.yml
    with:
      stage: nightly
      runner_config: 1-gpu-large
      runs_on: 1-gpu-h100
      partition_ids: '[0, 1]'
      partition_count: 2
      max_parallel: 2
      run_timeout_minutes: 180
      ref: ${{ inputs.ref }}
    secrets: inherit

  nightly-2-gpu-large:
    if: github.repository == 'sgl-project/sglang' && (inputs.runner_filter == '' || inputs.runner_filter == 'all' || inputs.runner_filter == '2-gpu-large')
    uses: ./.github/workflows/_scheduled-test-stage.yml
    with:
      stage: nightly
      runner_config: 2-gpu-large
      runs_on: 2-gpu-h100
      # Two 2h tests (VLM eval + VLM perf) dominate; 3 partitions splits them
      # apart, 2 would leave one partition carrying both.
      partition_ids: '[0, 1, 2]'
      partition_count: 3
      max_parallel: 2
      run_timeout_minutes: 240
      ref: ${{ inputs.ref }}
    secrets: inherit

  nightly-4-gpu-h100:
    if: github.repository == 'sgl-project/sglang' && (inputs.runner_filter == '' || inputs.runner_filter == 'all' || inputs.runner_filter == '4-gpu-h100')
    uses: ./.github/workflows/_scheduled-test-stage.yml
    with:
      stage: nightly
      runner_config: 4-gpu-h100
      runs_on: 4-gpu-h100
      run_timeout_minutes: 120
      ref: ${{ inputs.ref }}
    secrets: inherit

  nightly-4-gpu-b200:
    if: github.repository == 'sgl-project/sglang' && (inputs.runner_filter == '' || inputs.runner_filter == 'all' || inputs.runner_filter == '4-gpu-b200')
    uses: ./.github/workflows/_scheduled-test-stage.yml
    with:
      stage: nightly
      runner_config: 4-gpu-b200
      runs_on: 4-gpu-b200
      run_timeout_minutes: 300
      ref: ${{ inputs.ref }}
    secrets: inherit

  nightly-4-gpu-gb300:
    if: github.repository == 'sgl-project/sglang' && (inputs.runner_filter == '' || inputs.runner_filter == 'all' || inputs.runner_filter == '4-gpu-gb300')
    uses: ./.github/workflows/_scheduled-test-stage.yml
    with:
      stage: nightly
      runner_config: 4-gpu-gb300
      # Nightly keeps its own GB300 pool, separate from the per-commit
      # `4-gpu-gb300` label used by base-c.
      runs_on: 4-gpu-gb300-nightly
      partition_ids: '[0, 1, 2, 3]'
      partition_count: 4
      max_parallel: 4
      run_timeout_minutes: 300
      ref: ${{ inputs.ref }}
    secrets: inherit

  nightly-8-gpu-h200:
    if: github.repository == 'sgl-project/sglang' && (inputs.runner_filter == '' || inputs.runner_filter == 'all' || inputs.runner_filter == '8-gpu-h200')
    uses: ./.github/workflows/_scheduled-test-stage.yml
    with:
      stage: nightly
      runner_config: 8-gpu-h200
      runs_on: 8-gpu-h200
      partition_ids: '[0, 1, 2, 3]'
      partition_count: 4
      max_parallel: 2
      run_timeout_minutes: 300
      ref: ${{ inputs.ref }}
      force_baseline_update: ${{ inputs.force_baseline_update || false }}
    secrets: inherit

  nightly-8-gpu-b200:
    if: github.repository == 'sgl-project/sglang' && (inputs.runner_filter == '' || inputs.runner_filter == 'all' || inputs.runner_filter == '8-gpu-b200')
    uses: ./.github/workflows/_scheduled-test-stage.yml
    with:
      stage: nightly
      runner_config: 8-gpu-b200
      runs_on: 8-gpu-b200
      partition_ids: '[0, 1, 2, 3]'
      partition_count: 4
      max_parallel: 2
      run_timeout_minutes: 300
      ref: ${{ inputs.ref }}
    secrets: inherit

  # SGLang-Diffusion nightly benchmark. Not a registry suite: it drives
  # run_comparison.py and publishes a dashboard rather than running test files,
  # so it stays a hand-written job.
  nightly-test-diffusion:
    if: github.repository == 'sgl-project/sglang' && (inputs.runner_filter == '' || inputs.runner_filter == 'all' || inputs.runner_filter == 'diffusion')
    runs-on: 4-gpu-h100
    timeout-minutes: 300
    env:
      SGLANG_IS_IN_CI: true
      SGLANG_ENABLE_ASYNC_ASSERT: true
      SGLANG_CUDA_COREDUMP: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: 300
      HF_HUB_ETAG_TIMEOUT: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install dependencies
        run: |
          bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run diffusion benchmark
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 210
        run: |
          python3 -u scripts/ci/utils/diffusion/run_comparison.py \
            --output comparison-results.json

      - name: Generate dashboard
        if: always()
        env:
          GH_PAT_FOR_NIGHTLY_CI_DATA: ${{ secrets.GH_PAT_FOR_NIGHTLY_CI_DATA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/utils/diffusion/generate_diffusion_dashboard.py \
            --results comparison-results.json \
            --output dashboard.md \
            --charts-dir comparison-charts \
            --fetch-history \
            --step-summary

      - name: Publish to sglang-ci-data
        if: always()
        env:
          GH_PAT_FOR_NIGHTLY_CI_DATA: ${{ secrets.GH_PAT_FOR_NIGHTLY_CI_DATA }}
        run: |
          python3 scripts/ci/utils/diffusion/publish_comparison_results.py \
            --results comparison-results.json \
            --dashboard dashboard.md \
            --charts-dir comparison-charts

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-benchmark-${{ github.run_id }}
          path: |
            comparison-results.json
            dashboard.md
            comparison-charts/
            comparison-logs/
          retention-days: 90
          if-no-files-found: ignore

      - uses: ./.github/actions/upload-cuda-coredumps
        if: failure()

  # Consolidate performance metrics from all jobs
  consolidate-metrics:
    if: github.repository == 'sgl-project/sglang' && always()
    needs:
      - nightly-8-gpu-h200
      - nightly-8-gpu-b200
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download all partition metrics
        uses: actions/download-artifact@v4
        with:
          pattern: "*metrics-*"
          path: metrics/
          merge-multiple: true

      - name: List downloaded metrics
        run: |
          echo "Downloaded metrics files:"
          find metrics/ -name "*.json" -type f 2>/dev/null || echo "No metrics files found"

      - name: Merge metrics
        run: |
          python3 scripts/ci/utils/merge_metrics.py \
            --input-dir metrics/ \
            --output consolidated-metrics-${{ github.run_id }}.json \
            --run-id ${{ github.run_id }} \
            --commit-sha ${{ github.sha }} \
            --branch ${{ github.ref_name }}

      - name: Upload consolidated metrics
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-metrics-${{ github.run_id }}
          path: consolidated-metrics-${{ github.run_id }}.json
          retention-days: 90
          if-no-files-found: warn

  # Final check job
  check-all-jobs:
    if: github.repository == 'sgl-project/sglang' && always()
    needs:
      - nightly-1-gpu-large
      - nightly-2-gpu-large
      - nightly-4-gpu-h100
      - nightly-4-gpu-b200
      - nightly-4-gpu-gb300
      - nightly-8-gpu-h200
      - nightly-8-gpu-b200
      - nightly-test-diffusion
      - consolidate-metrics
    runs-on: ubuntu-latest
    steps:
      - name: Check if any job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more nightly test jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more nightly test jobs were cancelled"
            exit 1
          fi
          echo "All nightly test jobs passed"
