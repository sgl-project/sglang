# One-time recovery branch only. Do not merge this workflow into main.
name: Nightly Test (Nvidia)
run-name: Backfill diffusion results for September 13, 15, and 17

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: diffusion-nightly-token-recovery-20260918
  cancel-in-progress: false

jobs:
  backfill-diffusion-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download original successful benchmark artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 34761767207 34979805212 35231805157; do
            gh run download "$run_id" --repo sgl-project/sglang \
              --name "diffusion-benchmark-$run_id" --dir "backfill/$run_id"
          done

      - name: Install dashboard chart dependency
        run: python3 -m pip install matplotlib

      - name: Validate new token and restore historical results
        env:
          GH_PAT_FOR_NIGHTLY_CI_DATA: ${{ secrets.GH_PAT_FOR_NIGHTLY_CI_DATA }}
        run: python3 scripts/ci/utils/diffusion/backfill_20260918.py
