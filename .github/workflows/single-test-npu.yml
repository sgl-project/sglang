name: Single Test (NPU)
# test round 1: <测试用例描述>

on:
  pull_request:
    branches:
      - testcases
      - testcases-260813
    paths:
      - ".github/workflows/single-test-npu.yml"

concurrency:
  group: single-test-npu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-node-poc:
    name: single-node-poc
    runs-on: linux-aarch64-a3-16
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-a3-B100
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check npu info
        run: |
          npu-smi info

      - name: Run test
        timeout-minutes: 500
        env:
          SGLANG_USE_MODELSCOPE: true
          HF_ENDPOINT: https://hf-mirror.com
          SGLANG_IS_IN_CI: true
        shell: bash
        run: |
          sglang_source_path=$(pwd)
          echo "Source code path: ${sglang_source_path}"
          ln -sf ${sglang_source_path} /root/sglang

          # Test cases - 使用时替换为实际的测试用例路径
          test_cases=(
            "test/registered/npu/performance/qwen3_5_397b/test_npu_qwen3_5_397b_w4a8_8p_in128k_out1k_50ms.py"
            "test/registered/npu/performance/qwen3_5_397b/test_npu_qwen3_5_397b_w4a8_8p_in128k_out1k_20ms.py"
            #"test/registered/npu/accuracy/glm4_7_flash/test_npu_glm4_7_flash_1p_aime25_gpqa.py"
            #"test/registered/npu/basic_function/malpo/test_npu_mlapo.py"
            #"test/registered/npu/accuracy/qwen3_5_397b/test_npu_qwen3_5_397b_8p_gpqa.py"
            #"test/registered/npu/accuracy/deepseek_v3_2/test_npu_deepseek_v3_2_8p_aime25.py"
            #"test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_low_latency_qwen3_480b.py"
            #"test/registered/npu/accuracy/minimax_m2_5/test_npu_minimax_m2_5_w8a8_8p_in3k5_out1k5_50ms_gpqa.py"
            #"test/registered/npu/basic_function/runtime_options/test_npu_disaggregation_pp.py"
            #"test/registered/npu/accuracy/deepseek_v4_flash/test_npu_deepseek_v4_flash_w8a8_8p_gpqa.py"
            #"test/registered/npu/performance/qwen3_30b_a3b/test_npu_qwen3_30b_w8a8_1p_in3k5_out1k5_10ms.py"
            #"test/registered/npu/basic_function/test_npu_lora_hf_sgl_logprob_diff.py"
            #"test/registered/npu/basic_function/speculative_inference/test_npu_speculative_draft_attention_backend.py"
            #"test/registered/npu/basic_function/lora/test_npu_lora_qwen3_6_27b_logprob_diff.py"
            #"test/registered/npu/basic_function/rl/test_npu_rl_release_memory_occupation.py"
            #"test/registered/npu/basic_function/Multi-Modal/test_npu_mm_limit.py"
            #"test/registered/npu/basic_function/api_related/test_npu_api_related_tool_call.py"
            #"test/registered/npu/basic_function/logging/test_npu_tracing_disaggregation.py"
            #"test/registered/npu/basic_function/mambacache/test_npu_qwen3_next_models_mtp.py"
          )

          for test_case in "${test_cases[@]}"; do
            if [ ! -f "${sglang_source_path}/${test_case}" ]; then
              echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
              exit 1
            fi
          done
          
          pip install websocket-client websockets uvicorn==0.49.0 peft
          # copy required file from our daily cache
          cp ~/.cache/modelscope/hub/datasets/otavia/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json /tmp
          cp ~/.cache/modelscope/hub/datasets/tmp/test.jsonl /tmp

          echo "scaling_governor performance num: \
            $(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | grep performance | wc -l)"
          echo "swappiness: $(cat /proc/sys/vm/swappiness)"
          echo "numa_balancing: $(cat /proc/sys/kernel/numa_balancing)"
          echo "sched_migration_cost_ns: $(cat /proc/sys/kernel/sched_migration_cost_ns)"

          export SGLANG_TEST_MAX_RETRY=0
          export SGLANG_SET_CPU_AFFINITY=1
          EAGLE_WEIGHT_DIR="/root/.cache/modelscope/hub/models/sgl-npu/MiniMax-M2.5-eagel-model-0318"

          export PYTHONPATH=${EAGLE_WEIGHT_DIR}:$PYTHONPATH
          export SGLANG_EXTERNAL_MODEL_PACKAGE=custom_eagle3
          echo "SGLANG_SET_CPU_AFFINITY: $SGLANG_SET_CPU_AFFINITY"

          echo "Use sglang from image"
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r ${sglang_source_path}/python/sglang/test/ascend ${ascend_test_util_path}

          # Install sgl-eval (required by run_eval for mmlu/gsm8k scoring)
          # shellcheck source=scripts/ci/utils/sgl_eval_ref.sh
          . "${sglang_source_path}/scripts/ci/utils/sgl_eval_ref.sh"
          # latex2sympy2 pins antlr==4.7.2 which breaks sgl-eval; restore 4.9.3
          pip install "antlr4-python3-runtime==4.9.3" --force-reinstall --no-deps
          pip install "$SGL_EVAL_SPEC"

          # Set environment of cann
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true
          source /usr/local/Ascend/ascend-toolkit/latest/opp/vendors/customize/bin/set_env.bash || true
          source /usr/local/Ascend/ascend-toolkit/latest/opp/vendors/custom_transformer/bin/set_env.bash || true

          current_date=$(date +%Y%m%d)
          log_path="/root/.cache/tests/logs/log/${current_date}/${HOSTNAME}"
          rm -rf ${log_path}
          mkdir -p ${log_path}
          echo "Log path: ${log_path}"

          for test_case in "${test_cases[@]}"; do
            tc_name=$(basename ${test_case} .py)
            echo "Running test case ${test_case}"
            python -u ${sglang_source_path}/${test_case}
            echo "Finished test case ${test_case}"
          done

          plog_path="/root/ascend/log/debug/plog"
          if [ -d "$plog_path" ];then
            echo "Plog files found. Begin to backup them."
            target_plog_path="/root/.cache/tests/logs/plog/${HOSTNAME}"
            echo "Save path: ${target_plog_path}"
            rm -rf ${target_plog_path}
            mkdir -p ${target_plog_path}
            cp ${plog_path}/* ${target_plog_path}
          fi
