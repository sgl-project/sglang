name: Single Test (NPU)
# test round 1: <测试用例描述>

on:
  pull_request:
    branches:
      - main
      - testcases
      - testcases-260813
    paths:
      - ".github/workflows/single-test-npu.yml"

concurrency:
  group: single-test-npu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-node-poc:
    name: single-node-poc
    runs-on: linux-amd64-a5-4
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-950-B072
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check npu info
        run: |
          npu-smi info

      - name: Run test
        timeout-minutes: 120
        env:
          SGLANG_USE_MODELSCOPE: true
          HF_ENDPOINT: https://hf-mirror.com
          SGLANG_IS_IN_CI: true
          ASCEND_USE_FIA: "1"
        shell: bash
        run: |
          sglang_source_path=$(pwd)
          echo "Source code path: ${sglang_source_path}"
          ln -sf ${sglang_source_path} /root/sglang

          # Test cases - 使用时替换为实际的测试用例路径
          test_cases=(
            #"test/registered/npu/basic_function/runtime_options/test_npu_skip_tokenizer_init.py"
            #"test/registered/npu/basic_function/Multi-Modal/test_npu_mm_limit.py"
            #"test/registered/npu/basic_function/api_related/test_npu_api_related_tool_call.py"
            "test/registered/npu/basic_function/logging/test_npu_tracing_disaggregation.py"
            #"test/registered/npu/basic_function/mambacache/test_npu_qwen3_next_models_mtp.py"
          )

          for test_case in "${test_cases[@]}"; do
            if [ ! -f "${sglang_source_path}/${test_case}" ]; then
              echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
              exit 1
            fi
          done
          
          pip install websocket-client websockets uvicorn==0.49.0
          # copy required file from our daily cache

          echo "scaling_governor performance num: \
            $(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | grep performance | wc -l)"
          echo "swappiness: $(cat /proc/sys/vm/swappiness)"
          echo "numa_balancing: $(cat /proc/sys/kernel/numa_balancing)"
          echo "sched_migration_cost_ns: $(cat /proc/sys/kernel/sched_migration_cost_ns)"

          export SGLANG_TEST_MAX_RETRY=0
          export SGLANG_SET_CPU_AFFINITY=1
          echo "SGLANG_SET_CPU_AFFINITY: $SGLANG_SET_CPU_AFFINITY"

          echo "Use sglang from image"
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r ${sglang_source_path}/python/sglang/test/ascend ${ascend_test_util_path}

          # Set environment of cann
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true

          current_date=$(date +%Y%m%d)
          log_path="/root/.cache/tests/logs/log/${current_date}/${HOSTNAME}"
          rm -rf ${log_path}
          mkdir -p ${log_path}
          echo "Log path: ${log_path}"

          overall_status=0
          for test_case in "${test_cases[@]}"; do
            tc_name=$(basename ${test_case} .py)
            echo "Running test case ${test_case}"
            set -o pipefail
            if python -u ${sglang_source_path}/${test_case} 2>&1 | tee /tmp/${tc_name}.log; then
              echo "Finished test case ${test_case}"
            else
              echo "Test case ${test_case} FAILED"
              overall_status=1
            fi
          done

          # Print server-side error context for failed cases (step logs are not
          # retrievable from the custom container runner, so surface key errors
          # in the console output explicitly)
          if [ "${overall_status}" -ne 0 ]; then
            for test_case in "${test_cases[@]}"; do
              tc_name=$(basename ${test_case} .py)
              if [ -f "/tmp/${tc_name}.log" ]; then
                echo "===== error context: ${tc_name} ====="
                grep -n -A 20 "Traceback (most recent call last)" /tmp/${tc_name}.log | head -n 150 || true
              fi
            done
          fi

          plog_path="/root/ascend/log/debug/plog"
          if [ -d "$plog_path" ];then
            echo "Plog files found. Begin to backup them."
            target_plog_path="/root/.cache/tests/logs/plog/${HOSTNAME}"
            echo "Save path: ${target_plog_path}"
            rm -rf ${target_plog_path}
            mkdir -p ${target_plog_path}
            cp ${plog_path}/* ${target_plog_path}
          fi

          # Compact diagnostics printed LAST so they survive annotation tail truncation
          if [ "${overall_status}" -ne 0 ]; then
            echo "===== MODEL CACHE CHECK ====="
            for m in \
              "LLM-Research/Llama-3.2-1B-Instruct" \
              "Qwen/Qwen3-0.6B" \
              "Qwen/Qwen3.5-27B" \
              "Qwen/Qwen3-32B" \
              "Qwen3-Coder-480B-A35B-Instruct-w8a8-QuaRot"; do
              if [ -d "/root/.cache/modelscope/hub/models/${m}" ]; then
                echo "CACHED: ${m}"
              else
                echo "MISSING: ${m}"
              fi
            done

            echo "===== UNIQUE ERROR SUMMARY (root cause candidates) ====="
            cat /tmp/*.log \
              | grep -E "Error|ERROR|Exception|failed|Failed|not found|No such|EZ[0-9]{4}|OOM|out of memory" \
              | grep -vE "ERR99999|scheduler died|Check server logs|error_msg|last_error" \
              | sed 's/^[0-9]*[-:]//' | sort | uniq -c | sort -rn | head -n 15 || true
          fi

          exit ${overall_status}

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-test-npu-logs
          path: /tmp/*.log
          if-no-files-found: ignore
