name: Nightly Test Miles (AMD ROCm 7.2)

on:
  schedule:
    # Runs after the 12:00 UTC miles image build has pushed the dated image.
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override miles image tag (e.g. miles-rocm720-mi35x-20260621); empty = newest by date"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue on error (do not fail the workflow on test failures)"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  test-miles-mi35x:
    if: github.repository == 'sgl-project/sglang'
    strategy:
      fail-fast: false
      matrix:
        include:
          # VERIFICATION BRANCH. The strategy probe only needs the ROCm image, so it
          # runs on the smaller pool and reports long before the 8-GPU pool frees up;
          # the checkpoint test the nightly fails on needs all 8.
          - mode: probe
            runner: linux-mi35x-gpu-2
          - mode: e2e
            runner: linux-mi35x-gpu-8
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub (AMD)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

      - name: Resolve newest miles ROCm 7.2 image
        run: |
          repo="rocm/sgl-dev"
          base="miles-rocm720-mi35x"
          tag="${{ inputs.image_tag }}"
          age=""
          if [ -z "${tag}" ]; then
            # Walk back from today; the build job pushes a dated tag at 12:00 UTC.
            # Probe with `manifest inspect` so we don't pull a multi-GB image just
            # to test existence; the real pull happens in amd_ci_start_container.sh.
            for i in $(seq 0 6); do
              d=$(date -u -d "-${i} day" +%Y%m%d)
              candidate="${base}-${d}"
              if docker manifest inspect "${repo}:${candidate}" >/dev/null 2>&1; then
                tag="${candidate}"
                age="${i}"
                break
              fi
            done
          fi
          if [ -z "${tag}" ]; then
            echo "::error::No ${repo}:${base}-<date> image found on Docker Hub for the last 7 days"
            exit 1
          fi
          echo "MILES_IMAGE=${repo}:${tag}" >> "$GITHUB_ENV"
          echo "Using miles image: ${repo}:${tag}"
          echo "Miles image: \`${repo}:${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          # Falling back to an older tag means the 12:00 UTC build failed, so this run
          # reports on code that was never built. Without an annotation that reads as a
          # normal green nightly and the build outage goes unnoticed for days.
          if [ -n "${age}" ] && [ "${age}" -gt 0 ]; then
            echo "::warning::Newest ${base} image is ${age} day(s) old (${tag}); the nightly image build has been failing since then, so these results do not cover the last ${age} day(s) of commits"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Image is **${age} day(s) old**: the newer \`${base}\` builds failed, so these results do not cover the last ${age} day(s) of commits." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start container from the miles image
        run: bash scripts/ci/amd/amd_ci_start_container.sh --custom-image "${MILES_IMAGE}"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      # ----------------------------------------------------------------------
      # VERIFICATION BRANCH for radixark/miles#2816. Not for merge: the miles
      # checkout inside the image is patched from a PR ref before the test runs.
      # ----------------------------------------------------------------------
      - name: Reproduce the nvrx failure on the unpatched image
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w /root/miles \
            -e PYTHONPATH=/root/miles:/opt/tilelang \
            python3 /sglang-checkout/scripts/ci/amd/verify_async_ckpt_strategy.py nvrx

      - name: Apply miles PR 2816 to the in-image checkout
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w /root/miles bash -c '
            set -eux
            git fetch --no-tags --depth=1 origin refs/pull/2816/head
            git checkout FETCH_HEAD -- \
              miles/backends/megatron_utils/arguments.py \
              tests/fast/backends/megatron_utils/test_arguments_async_strategy.py
            git --no-pager diff --stat HEAD
          '

      - name: Run the new unit test against the real megatron
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w /root/miles \
            -e PYTHONPATH=/root/miles:/opt/tilelang \
            python3 -m pytest -v --no-header -p no:cacheprovider \
            tests/fast/backends/megatron_utils/test_arguments_async_strategy.py

      - name: Confirm the fix on the patched image
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w /root/miles \
            -e PYTHONPATH=/root/miles:/opt/tilelang \
            python3 /sglang-checkout/scripts/ci/amd/verify_async_ckpt_strategy.py mcore

      - name: Run the checkpoint test that the nightly fails on
        if: matrix.mode == 'e2e'
        timeout-minutes: 90
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w /root/miles \
            -e PYTHONPATH=/root/miles:/opt/tilelang \
            python3 tests/e2e/ckpt/test_qwen3_4B_ckpt.py
