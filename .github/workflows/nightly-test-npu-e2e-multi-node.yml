name: 'Nightly Test (NPU) Multi Node Template'

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the event commit SHA.'
        required: false
        type: string
        default: ''
      runner:
        required: false
        type: string
        default: linux-amd64-cpu-8
      test_type:
        required: false
        type: string
        default: perf
        description: perf or accuracy
      test_config_name:
        required: true
        type: string
        description: test config name
      prefill_size:
        required: false
        type: number
        default: 0
        description: number of prefill nodes for pd-separation
      decode_size:
        required: false
        type: number
        default: 0
        description: number of decode nodes for pd-separation
      router_size:
        required: false
        type: number
        default: 0
        description: number of router nodes for pd-separation
      node_size:
        required: false
        type: number
        default: 0
        description: number of nodes for pd-mix
      test_case:
        required: true
        type: string
        description: path of test case file
      test_method:
        required: false
        type: string
        default: ''
        description: "Single test method to run inside test_case, formatted as Class.method. Empty runs every test in the file."
      image:
        required: false
        type: string
        description: image for pods
        default: "swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann8.5.0-a3"
      prefill_decode_deployment:
        required: true
        type: string
        description: "The deployment of prefill and decode nodes. ['separation', 'mix']"
      transformers_version:
        required: false
        type: string
        default: ""
        description: "The transformers version number for running sglang. Use default version in image if keep empty."
      run_start_metadata:
        required: false
        type: string
        default: '{}'
        description: 'JSON run metadata {branch_label, workflow_name, create_time}, recorded once at workflow start'
      container_patches:
        required: false
        type: string
        default: ""
        description: "Comma separated https URLs of container patch zip archives. This workflow downloads and extracts them into the mounted checkout, and each pod runs the install.sh shipped in its archive, which also owns dependency installation (including any package mirror). Empty keeps the image untouched."
      accuracy_dataset:
        required: false
        type: string
        default: ''
        description: 'Accuracy dataset injected into pods as NPU_ACCURACY_DATASET (gsm8k on weekdays, gpqa_diamond on weekends)'
      use_image_sglang:
        required: false
        type: string
        default: ''
        description: "If 'true', pods import sglang from the image's site-packages instead of the checkout mounted at /root/sglang/python. Empty/false uses the checkout (nightly default)."
      sgl_router_artifact:
        required: false
        type: string
        default: ''
        description: "sgl-router-build's aarch64 artifact for the router pod; empty uses the image's sgl-router."

concurrency:
  group: ascend-nightly-multi-node-${{ github.workflow_ref }}-${{ github.ref }}-${{ inputs.test_config_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ inputs.test_config_name }}
    runs-on: ${{ inputs.runner }}
    container:
      image: swr.ap-southeast-1.myhuaweicloud.com/base_image/ascend-ci/sglang:main-x86
      env:
        KUBECONFIG: /root/.cache/.cache/kb.yaml
        KUBECTL: /root/.cache/.cache/kubectl
        NAMESPACE: sgl-project
        KUBE_JOB_NAME: ascend-${{ github.run_id }}
        SGLANG_IS_IN_CI: true
        ASCEND_E2E_TEST_CONFIG_PATH: python/sglang/test/ascend/e2e
        SGLANG_USE_MODELSCOPE: true
        HF_ENDPOINT: https://hf-mirror.com
        TRANSFORMERS_VERBOSITY: "error"
        GDN_ATTN_BACKEND_TRITON: 1
    steps:
      - name: Install dependencies
        run: |
          pip3 install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple jinja2
          pip3 install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple psutil
          # Install kubernetes
          pip3 install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple kubernetes
          cp $KUBECTL /usr/local/sbin/

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # continue-on-error: the artifact expires in a day, and the router pod falls
      # back to the image's sgl-router.
      - name: Download prebuilt sgl-router
        if: inputs.sgl_router_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.sgl_router_artifact }}
          path: sgl-router-bin

      - name: Prepare container patches
        id: container_patches
        if: inputs.container_patches != ''
        env:
          CONTAINER_PATCHES: ${{ inputs.container_patches }}
        run: |
          set -euo pipefail
          mkdir -p container-patches
          dirs=""
          while IFS= read -r url; do
            url="$(echo "${url}" | tr -d '[:space:]')"
            if [ -z "${url}" ]; then
              continue
            fi

            # Only plain https .zip URLs: the archive path ends up in a pod
            # command, so reject anything with shell metacharacters.
            if ! echo "${url}" | grep -Eq '^https://[A-Za-z0-9._~:/@%+=-]+\.zip$'; then
              echo "Invalid container patch url: ${url}"
              exit 1
            fi

            slug="$(printf '%s' "${url}" | sha256sum | awk '{print $1}')"
            dest="container-patches/${slug}"
            # A repeated URL would otherwise install twice in the pods.
            case ",${dirs}," in
              *",${dest},"*) continue ;;
            esac
            rm -rf "${dest}"
            mkdir -p "${dest}"
            archive="/tmp/container-patch-${slug}.zip"

            # OBS lives in the same region as the cluster; bypass any proxy.
            if command -v curl >/dev/null 2>&1; then
              ( unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY; curl -fsSL -o "${archive}" "${url}" )
            elif command -v wget >/dev/null 2>&1; then
              ( unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY; wget -q -O "${archive}" "${url}" )
            else
              echo "Neither curl nor wget is available to download ${url}"
              exit 1
            fi

            python3 -m zipfile -e "${archive}" "${dest}"
            if [ -z "$(find "${dest}" -type f -name install.sh -print -quit)" ]; then
              echo "install.sh not found in ${url}"
              exit 1
            fi

            dirs="${dirs:+${dirs},}${dest}"
          done <<< "$(echo "${CONTAINER_PATCHES}" | tr ',' '\n')"
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"
          echo "Container patch dirs: ${dirs}"

      # This payload belongs to the workflow definition, not the checkout under
      # test. It also works when that checkout is main and runtime code is from
      # the published image: no PR Python sources or diagnostic downloads.
      - name: Prepare inline K3 image-code diagnostics
        id: k3_pin_diagnostics
        if: inputs.test_case == 'test/registered/npu/accuracy/kimi_k3/test_npu_kimi_k3_w4a8_32p_gpqa.py' && inputs.use_image_sglang == 'true'
        run: |
          set -euo pipefail
          patch_dir="container-patches/k3-pin-diagnostics"
          mkdir -p "${patch_dir}"
          cat > "${patch_dir}/install.sh" <<'K3_PIN_INSTALL_SH'
          #!/usr/bin/env bash
          set -euo pipefail

          patch_dir="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          python_bin="${PYTHON_FOR_SGLANG:-python}"

          # The Nightly hook runs before it configures PYTHONPATH. Match its later choice
          # of checkout versus image code, without importing torch or initializing NPU.
          if [ "$#" -gt 0 ]; then
              package_root="$1"
          elif [ "${SGLANG_USE_IMAGE:-}" = "true" ] || [ "${SGLANG_USE_IMAGE:-}" = "True" ]; then
              package_root="$("${python_bin}" -c 'import importlib.util, pathlib; print(pathlib.Path(importlib.util.find_spec("sglang").origin).parent)')"
          else
              package_root="/root/sglang/python/sglang"
          fi

          "${python_bin}" "${patch_dir}/install.py" --package-root "${package_root}"
          # Nightly runs this hook before sourcing the SDK. This process only reads
          # metadata; actual loaded-library identity is captured again on the failure.
          "${python_bin}" "${package_root}/srt/mem_cache/pool_host/npu_pin_diagnostics.py" --environment
          K3_PIN_INSTALL_SH
          cat > "${patch_dir}/install.py" <<'K3_PIN_INSTALL_PY'
          """Install the reference prints into the package selected by the Nightly pod."""

          import argparse
          import fcntl
          import hashlib
          import os
          import subprocess
          import tempfile
          from pathlib import Path


          def _atomic_write(path, content, mode=0o644):
              descriptor, temporary = tempfile.mkstemp(prefix=f".{path.name}.", dir=path.parent)
              try:
                  with os.fdopen(descriptor, "wb") as stream:
                      stream.write(content)
                      os.fchmod(stream.fileno(), mode)
                  os.replace(temporary, path)
              finally:
                  Path(temporary).unlink(missing_ok=True)


          def install(package_root):
              payload = Path(__file__).resolve().parent
              target = package_root.resolve() / "srt/mem_cache/pool_host"
              mamba = target / "mamba.py"
              helper = target / "npu_pin_diagnostics.py"
              helper_content = (payload / helper.name).read_bytes()
              patch = payload / "mamba-pin-diagnostics.patch"

              # The mounted checkout is shared by four pods. Serialize check/apply/write
              # and publish each file atomically; repeat installs must not append hooks.
              with (target / ".k3-pin-diagnostics.lock").open("a") as lock:
                  fcntl.flock(lock, fcntl.LOCK_EX)
                  original = mamba.read_bytes()
                  if helper.exists() and helper.read_bytes() != helper_content:
                      raise RuntimeError(
                          f"A different diagnostic helper already exists: {helper}"
                      )
                  with tempfile.TemporaryDirectory(prefix="k3-pin-patch-") as temporary:
                      root = Path(temporary)
                      staged = root / "python/sglang/srt/mem_cache/pool_host/mamba.py"
                      staged.parent.mkdir(parents=True)
                      staged.write_bytes(original)
                      command = ["git", "apply", "--check", str(patch)]
                      check = subprocess.run(
                          command, cwd=root, capture_output=True, text=True, check=False
                      )
                      if check.returncode == 0:
                          subprocess.run(["git", "apply", str(patch)], cwd=root, check=True)
                          updated = staged.read_bytes()
                          status = "applied"
                      else:
                          reverse = subprocess.run(
                              ["git", "apply", "--reverse", "--check", str(patch)],
                              cwd=root,
                              capture_output=True,
                              text=True,
                              check=False,
                          )
                          if reverse.returncode:
                              raise RuntimeError(f"Patch does not match {mamba}: {check.stderr}")
                          updated = original
                          status = "already applied"
                  compile(updated, str(mamba), "exec")
                  compile(helper_content, str(helper), "exec")
                  if updated != original:
                      backup = mamba.with_name("mamba.py.k3-pin-original")
                      if backup.exists():
                          raise RuntimeError(f"Refusing to replace an existing backup: {backup}")
                      _atomic_write(backup, original, mamba.stat().st_mode & 0o777)
                  # Publish the dependency first, so another pod can safely import mamba.
                  _atomic_write(helper, helper_content)
                  if updated != original:
                      _atomic_write(mamba, updated, mamba.stat().st_mode & 0o777)
                  print(
                      f"K3_PIN_PATCH {status}: {mamba} "
                      f"sha256={hashlib.sha256(updated).hexdigest()}",
                      flush=True,
                  )


          if __name__ == "__main__":
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--package-root", required=True, type=Path)
              install(parser.parse_args().package_root)
          K3_PIN_INSTALL_PY
          cat > "${patch_dir}/mamba-pin-diagnostics.patch" <<'K3_PIN_MAMBA_PATCH'
          diff --git a/python/sglang/srt/mem_cache/pool_host/mamba.py b/python/sglang/srt/mem_cache/pool_host/mamba.py
          index 0418a3cdf9..d14e704c15 100644
          --- a/python/sglang/srt/mem_cache/pool_host/mamba.py
          +++ b/python/sglang/srt/mem_cache/pool_host/mamba.py
          @@ -695,13 +695,25 @@ class MambaPoolHost(HostKVCache):
                           # NPU: mirror the load path — the dedicated kernel transfers all
                           # layers at once via a single 2D strided copy
                           # (device layer-first -> host page-first).
          -                transfer_mamba_state(
          -                    device_buf=src_layers,
          -                    host_buf=dst,
          -                    device_indices=src_indices,
          -                    host_indices=dst_indices,
          -                    direction=TransferDirection.D2H,
          -                )
          +                try:
          +                    transfer_mamba_state(
          +                        device_buf=src_layers,
          +                        host_buf=dst,
          +                        device_indices=src_indices,
          +                        host_indices=dst_indices,
          +                        direction=TransferDirection.D2H,
          +                    )
          +                except RuntimeError as exc:
          +                    if "host buffer must use pinned memory" in str(exc):
          +                        try:
          +                            from sglang.srt.mem_cache.pool_host.npu_pin_diagnostics import (
          +                                dump_mamba_pin_failure,
          +                            )
          +
          +                            dump_mamba_pin_failure(dst, src_layers, exc)
          +                        except Exception:
          +                            logger.exception("Mamba pinned-memory diagnostics failed")
          +                    raise
                       else:
                           # Per-layer fallback when the dedicated kernel is unavailable.
                           device_indices = src_indices.to(
          K3_PIN_MAMBA_PATCH
          cat > "${patch_dir}/npu_pin_diagnostics.py" <<'K3_PIN_HELPER_PY'
          """Reference diagnostics for Kimi K3's Nightly NPU HiCache failure.

          The environment CLI uses only the standard library. In particular, it does not
          initialize torch_npu or prime its process-local compatibility caches.
          """

          import ast
          import ctypes
          import hashlib
          import importlib.metadata
          import json
          import os
          import socket
          import sys
          import time
          from pathlib import Path
          from urllib.parse import unquote, urlsplit


          def _observe(function):
              """Keep probe errors as data so they cannot replace the original failure."""
              try:
                  return function()
              except Exception as exc:  # noqa: BLE001
                  return {"diagnostic_error": f"{type(exc).__name__}: {exc}"}


          def _sha256(path):
              digest = hashlib.sha256()
              with Path(path).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def _version_source(path):
              values = {}
              for node in ast.parse(path.read_text()).body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id in (
                              "__version__",
                              "git_version",
                          ):
                              values[target.id] = ast.literal_eval(node.value)
              return values


          def collect_environment_metadata():
              """Collect image/package identity without importing torch or torch_npu."""
              row = {
                  "hostname": socket.gethostname(),
                  "pid": os.getpid(),
                  "time_ns": time.time_ns(),
                  "python": sys.executable,
                  "packages": {},
                  "library_hashes": {},
              }
              for name in ("torch", "torch-npu", "sgl-kernel-npu", "sglang"):
                  row["packages"][name] = _observe(
                      lambda name=name: importlib.metadata.version(name)
                  )
              for package in ("torch", "torch_npu"):

                  def version_source(package=package):
                      distribution = importlib.metadata.distribution(package)
                      return _version_source(
                          Path(distribution.locate_file(f"{package}/version.py"))
                      )

                  row[f"{package}_version_source"] = _observe(version_source)
              for package, relative in (
                  ("torch-npu", "torch_npu/lib/libtorch_npu.so"),
                  ("sgl-kernel-npu", "sgl_kernel_npu/lib/libsgl_kernel_npu.so"),
              ):

                  def library_identity(package=package, relative=relative):
                      path = Path(
                          importlib.metadata.distribution(package).locate_file(relative)
                      ).resolve()
                      return {"path": str(path), "sha256": _sha256(path)}

                  row["library_hashes"][package] = _observe(library_identity)

              def kernel_wheel():
                  raw = importlib.metadata.distribution("sgl-kernel-npu").read_text(
                      "direct_url.json"
                  )
                  data = json.loads(raw)
                  # Keep the build-tagged filename, without URL credentials or signed queries.
                  return {
                      "filename": Path(unquote(urlsplit(data["url"]).path)).name,
                      "archive_info": data.get("archive_info"),
                  }

              row["kernel_wheel"] = _observe(kernel_wheel)
              cann = Path(
                  os.environ.get("ASCEND_HOME_PATH", "/usr/local/Ascend/ascend-toolkit/latest")
              ).resolve()
              row["cann_version_files"] = {}
              for path in (
                  cann / "aarch64-linux/ascend_toolkit_install.info",
                  cann / "share/info/runtime/version.info",
                  Path("/usr/local/Ascend/driver/version.info"),
              ):
                  row["cann_version_files"][str(path)] = _observe(
                      lambda path=path: path.read_text()
                  )
              for name in ("libascendcl.so", "libruntime.so"):
                  path = cann / "lib64" / name
                  row["library_hashes"][name] = _observe(
                      lambda path=path: {"path": str(path.resolve()), "sha256": _sha256(path)}
                  )
              mamba_path = Path(__file__).with_name("mamba.py")
              row["checkout_mamba_source"] = {
                  "path": str(mamba_path),
                  "sha256": _observe(lambda: _sha256(mamba_path)),
              }
              return row


          def _emit(row, event):
              row["event"] = event
              metrics = os.environ.get("METRICS_DATA_FILE")
              if metrics:
                  try:
                      directory = Path(metrics) / "npu_pin_diagnostics"
                      directory.mkdir(parents=True, exist_ok=True)
                      output = (
                          directory
                          / f"{event}-{row['hostname']}-{row['pid']}-{row['time_ns']}.json"
                      )
                      row["artifact_path"] = str(output)
                      output.write_text(json.dumps(row, indent=2))
                  except (OSError, TypeError, ValueError) as exc:
                      row["artifact_error"] = f"{type(exc).__name__}: {exc}"
              print("NPU_PIN_DIAGNOSTIC " + json.dumps(row), file=sys.stderr, flush=True)
              return row


          def _read_known_branch_cache(library_path):
              """Read a verified ELF's static cache, without invoking C++ through ctypes."""
              if (
                  _sha256(library_path)
                  != "6557790a35e6cabf6300e91b8eda3944bc30d8ac834fff48161cf72d0c6e6b39"
              ):
                  return {"available": False, "reason": "unrecognized torch_npu ELF"}
              library = ctypes.CDLL(str(library_path))
              symbol = library._ZN6at_npu6native29CachingHostAllocator_isPinnedEPv
              address = ctypes.cast(symbol, ctypes.c_void_p).value
              # Confirm the call site as well as the file hash before reading known offsets.
              if int.from_bytes(ctypes.string_at(address + 0x34, 4), "little") != 0x9409ABE0:
                  return {"available": False, "reason": "unexpected function address"}
              base = address - 0x1706D50
              guard = ctypes.c_uint64.from_address(base + 0x4E22398).value
              return {
                  "available": True,
                  "guard": guard,
                  "AclrtPointerGetAttributesExist": (
                      ctypes.c_bool.from_address(base + 0x4E223A0).value if guard & 1 else None
                  ),
              }


          def _pointer_attributes(pointer):
              class Location(ctypes.Structure):
                  _fields_ = [("id", ctypes.c_uint32), ("type", ctypes.c_int)]

              class Attributes(ctypes.Structure):
                  _fields_ = [
                      ("location", Location),
                      ("page_size", ctypes.c_uint32),
                      ("reserved", ctypes.c_uint32 * 4),
                  ]

              library = ctypes.CDLL("libascendcl.so")
              query = library.aclrtPointerGetAttributes
              query.argtypes = [ctypes.c_void_p, ctypes.POINTER(Attributes)]
              query.restype = ctypes.c_int
              attributes = Attributes()
              ret = query(pointer, ctypes.byref(attributes))
              return {
                  "ret": ret,
                  "location_type": attributes.location.type if ret == 0 else None,
                  "location_id": attributes.location.id if ret == 0 else None,
              }


          def dump_mamba_pin_failure(host, device, error):
              """Observe the original failed buffer; never register or replace it."""
              import torch
              import torch_npu

              data_ptr = host.data_ptr()
              storage_ptr = host.untyped_storage().data_ptr()
              row = {
                  "hostname": socket.gethostname(),
                  "pid": os.getpid(),
                  "time_ns": time.time_ns(),
                  "error": str(error),
                  "npu_python_initialized": torch.npu.is_initialized(),
                  "host": {
                      "data_ptr": hex(data_ptr),
                      "storage_ptr": hex(storage_ptr),
                      "storage_offset": host.storage_offset(),
                      "shape": list(host.shape),
                      "stride": list(host.stride()),
                      "dtype": str(host.dtype),
                      "bytes": host.numel() * host.element_size(),
                      "contiguous": host.is_contiguous(),
                  },
                  "device": {
                      "device": str(device.device),
                      "shape": list(device.shape),
                      "stride": list(device.stride()),
                      "dtype": str(device.dtype),
                  },
                  "tls_include": str(torch._C._dispatch_tls_local_include_set()),
                  "tls_exclude": str(torch._C._dispatch_tls_local_exclude_set()),
                  "environment": {
                      key: os.environ.get(key)
                      for key in (
                          "ASCEND_VISIBLE_DEVICES",
                          "ASCEND_RT_VISIBLE_DEVICES",
                          "SGLANG_ONE_VISIBLE_DEVICE_PER_PROCESS",
                          "SGLANG_HICACHE_HOST_MEM_BACKEND",
                          "SGLANG_NPU_HICACHE_MAMBA_IO",
                          "PYTORCH_NPU_ALLOC_CONF",
                      )
                  },
              }
              # Capture the cache before issuing new pinned/version queries. Unknown ELF
              # builds still produce all other metadata; no offsets are read for them.
              library_path = Path(torch_npu.__file__).parent / "lib/libtorch_npu.so"
              row["pinned_branch_cache_before_queries"] = _observe(
                  lambda: _read_known_branch_cache(library_path)
              )
              registry = sys.modules.get(
                  "sgl_kernel_npu.operators.mem_cache.memfabric.host_memory"
              )
              row["matching_registrations"] = []
              for pointer, length, mapping in getattr(registry, "_G_MAPPINGS", ()):
                  if (
                      pointer <= data_ptr < pointer + length
                      or pointer <= storage_ptr < pointer + length
                  ):
                      row["matching_registrations"].append(
                          {
                              "base": hex(pointer),
                              "bytes": length,
                              "covers_data": pointer <= data_ptr < pointer + length,
                              "covers_storage": pointer <= storage_ptr < pointer + length,
                              "kind": getattr(mapping, "kind", None),
                              "owned": getattr(mapping, "owned", None),
                          }
                      )
              acl_rt = sys.modules.get("acl.rt")
              if acl_rt is not None:
                  row["acl_device_before_queries"] = _observe(acl_rt.get_device)
                  row["acl_context_before_queries"] = _observe(acl_rt.get_context)
              row["acl_attributes_data"] = _observe(lambda: _pointer_attributes(data_ptr))
              row["acl_attributes_storage"] = _observe(lambda: _pointer_attributes(storage_ptr))
              row["python_is_pinned"] = _observe(host.is_pinned)
              row["aten_is_pinned"] = _observe(lambda: torch.ops.aten.is_pinned.default(host))
              row["cann_versions_seen_by_torch_npu"] = {
                  key: _observe(lambda key=key: torch_npu._C._get_cann_version(key))
                  for key in ("CANN", "DRIVER", "RUNTIME")
              }
              row["aten_dispatch"] = _observe(lambda: torch._C._dispatch_dump("aten::is_pinned"))
              row["mamba_dispatch"] = _observe(
                  lambda: torch._C._dispatch_dump("npu::transfer_mamba_state")
              )
              row["mapped_libraries"] = sorted(
                  {
                      line.split()[-1]
                      for line in Path("/proc/self/maps").read_text().splitlines()
                      if any(
                          name in line
                          for name in (
                              "libtorch_npu.so",
                              "libtorch_cpu.so",
                              "libascendcl.so",
                              "libruntime.so",
                              "libsgl_kernel_npu",
                          )
                      )
                  }
              )
              row["loaded_library_hashes"] = {
                  path: _observe(lambda path=path: _sha256(path))
                  for path in row["mapped_libraries"]
                  if "libtorch_cpu.so" not in path
              }
              mamba = sys.modules.get("sglang.srt.mem_cache.pool_host.mamba")
              source = getattr(mamba, "__file__", None)
              row["loaded_mamba_source"] = {
                  "path": source,
                  "sha256": _observe(lambda: _sha256(source)),
              }
              row["environment_metadata"] = collect_environment_metadata()
              return _emit(row, "mamba-pin-failure")


          if __name__ == "__main__":
              import argparse

              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--environment", action="store_true", required=True)
              parser.parse_args()
              _emit(collect_environment_metadata(), "environment")
          K3_PIN_HELPER_PY
          echo "dir=${patch_dir}" >> "$GITHUB_OUTPUT"

      - name: Prepare code for testing
        timeout-minutes: 15
        run: |
          # Sweep orphaned sglang-{run_id} dirs left by jobs killed before Post process.
          # Backgrounded and capped: the shared PVC is slow, and a pre-existing backlog
          # must not block the critical path. fds are redirected so the runner does not
          # wait on the background job's stdout.
          ( find /root/.cache/tests -regextype posix-extended -maxdepth 1 -type d \
              -regex '.*/sglang-[0-9]+$' -mtime +7 -print 2>/dev/null \
            | head -n 5 | xargs -r rm -rf ) >/dev/null 2>&1 </dev/null &

          # The download drops the executable bit; cp keeps it for the pods.
          chmod +x sgl-router-bin/sgl-router 2>/dev/null || true
          if [ "${{ inputs.prefill_decode_deployment }}" = "separation" ] && [ ! -x sgl-router-bin/sgl-router ]; then
            echo "::warning::No prebuilt sgl-router; the router pod falls back to sgl-router on the image's PATH."
          fi

          # copy source code to shared-disk
          # Append run_id to isolate concurrent runs sharing the same PVC.
          current_path=$(pwd)
          target_path=/root/.cache/tests/sglang-${{ github.run_id }}
          rm -rf ${target_path}
          mkdir -p ${target_path}
          cp -r ${current_path}/* ${target_path}/

      - name: Clear resources
        run: |
          cd ${ASCEND_E2E_TEST_CONFIG_PATH}
          kubectl delete -f ./k8s_multi_pd_*.yaml --ignore-not-found=true || true

          pod_name_prefix="${KUBE_JOB_NAME}-"
          echo "kube name space: $NAMESPACE, pod name prefix: ${pod_name_prefix}"
          while true; do
            if kubectl get po -A -n $NAMESPACE | grep -q "${pod_name_prefix}"; then
              echo "Found exist sglang job, sleeping for 30 seconds..."
              sleep 30
              kubectl get pods | grep "${pod_name_prefix}" | awk '{print $1}' | xargs kubectl delete pod -n $NAMESPACE || true
            else
              echo "No sglang job exist, start test case..."
              break
            fi
          done

      - name: Run test
        timeout-minutes: 300
        env:
          CONTAINER_PATCH_DIRS: ${{ steps.container_patches.outputs.dirs }}
          K3_PIN_PATCH_DIR: ${{ steps.k3_pin_diagnostics.outputs.dir }}
        run: |
          # sglang_source_relative_path is shared-disk path
          # Append run_id so concurrent runs do not overwrite each other on the shared PVC.
          sglang_source_relative_path=tests/sglang-${{ github.run_id }}
          sglang_source_path=/root/.cache/${sglang_source_relative_path}
          echo "Source code path: ${sglang_source_path}"

          test_case="${{ inputs.test_case }}"
          if [ ! -f "${sglang_source_path}/${test_case}" ]; then
            echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
            exit 1
          fi

          # prepare for output data
          tc_name=${test_case##*/}
          tc_name=${tc_name%.*}

          # Provided automatically by the GitHub server.
          # run_id is the unique identifier for the workflow run,
          # attempt represents the re‑run attempt count of the job.
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}

          # Parse run metadata (branch_label / workflow_name / create_time)
          # from run_start_metadata JSON input using GitHub fromJson expression, same as partitions input.
          branch_label=$(echo "${{ fromJson(inputs.run_start_metadata).branch_label }}" | tr '/:' '--')
          workflow_name=$(echo "${{ fromJson(inputs.run_start_metadata).workflow_name }}" | tr ' ' '_' | tr -d '()')
          create_time="${{ fromJson(inputs.run_start_metadata).create_time }}"
          if [ -z "${create_time}" ]; then create_time=$(date -u -d '+8 hours' +%Y%m%d-%H%M); fi
          # Append the image tag to the workflow-name segment so that runs with
          # different images (CANN 9.0.0/9.1.0, a3/a5) persist into distinct,
          # image-tagged output/log directories.
          image_label=$(echo "${{ inputs.image }}" | sed 's#.*[/:]##')
          workflow_name="${workflow_name}--${image_label}"

          # Print persistence‑directory‑prefix variables
          echo "Persistence prefix: run_id=${run_id} run_attempt=${run_attempt} branch_label=${branch_label} workflow_name=${workflow_name} create_time=${create_time}"

          sglang_test_results_output_path=/root/.cache/tests/output/${branch_label}-${create_time}-${run_id}-${run_attempt}/${workflow_name}/${{ inputs.test_type }}/${tc_name}
          mkdir -p ${sglang_test_results_output_path}
          echo "Metrics file path: ${sglang_test_results_output_path}"

          prefill_decode_deployment="${{ inputs.prefill_decode_deployment }}"
          kube_job_type=""
          if [ "$prefill_decode_deployment" = "separation" ];then
            kube_job_type=multi-pd-separation
          elif [ "$prefill_decode_deployment" = "mix" ];then
            kube_job_type=multi-pd-mix
          else
            echo "Unsupported deployment type: ${prefill_decode_deployment}"
            exit 1
          fi

          transformers_version="${{ inputs.transformers_version }}"
          cd ${ASCEND_E2E_TEST_CONFIG_PATH}
          CMD="python3 -u run_npu_e2e_test.py \
            --env ci \
            --image ${{ inputs.image }} \
            --sglang-source-relative-path ${sglang_source_relative_path} \
            --metrics-data-file ${sglang_test_results_output_path} \
            --test-case ${test_case} \
            --kube-name-space ${NAMESPACE} \
            --kube-job-type ${kube_job_type} \
            --kube-job-name-prefix ${KUBE_JOB_NAME} \
            --run-id ${{ github.run_id }}"

          container_patches="${CONTAINER_PATCH_DIRS:-}"
          if [ -n "${K3_PIN_PATCH_DIR:-}" ]; then
            container_patches="${container_patches:+${container_patches},}${K3_PIN_PATCH_DIR}"
          fi
          if [ -n "${container_patches}" ]; then
            echo "Container patch dirs: ${container_patches}"
            CMD="${CMD} --container-patches ${container_patches}"
          fi

          accuracy_dataset="${{ inputs.accuracy_dataset }}"
          case "${accuracy_dataset}" in
            ""|gsm8k|gpqa_diamond) ;;
            *) echo "Unsupported accuracy dataset: ${accuracy_dataset}"; exit 1 ;;
          esac
          if [ -n "${accuracy_dataset}" ]; then
            CMD="${CMD} --accuracy-dataset ${accuracy_dataset}"
          fi

          use_image_sglang="${{ inputs.use_image_sglang }}"
          case "${use_image_sglang}" in
            ""|true|false) ;;
            *) echo "Unsupported use_image_sglang: ${use_image_sglang}"; exit 1 ;;
          esac
          if [ -n "${use_image_sglang}" ]; then
            CMD="${CMD} --use-image-sglang ${use_image_sglang}"
          fi

          # Restrict the run to one unittest method inside test_case. The value
          # ends up in the pod's env, so only plain dotted identifiers pass.
          test_method="${{ inputs.test_method }}"
          if [ -n "${test_method}" ]; then
            if ! echo "${test_method}" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$'; then
              echo "Invalid test_method: ${test_method}"
              exit 1
            fi
            echo "Test method: ${test_method}"
            CMD="${CMD} --test-method ${test_method}"
          fi

          if [ "$prefill_decode_deployment" = "separation" ];then
            CMD="${CMD} \
              --prefill-size ${{ inputs.prefill_size }} \
              --decode-size ${{ inputs.decode_size }} \
              --router-size ${{ inputs.router_size }}"
          elif [ "$prefill_decode_deployment" = "mix" ];then
            CMD="${CMD} --node-size ${{ inputs.node_size }}"
          else
            echo "Unsupported deployment type: ${prefill_decode_deployment}"
            exit 1
          fi

          if [ "$SGLANG_IS_IN_CI" = "true" ] || [ "$SGLANG_IS_IN_CI" = "True" ];then
            echo "Run test in ci."
            CMD="${CMD} --sglang-is-in-ci"
          fi

          echo "commit id: ${{ github.sha }}" > "$(dirname "${sglang_test_results_output_path}")/commit_id"

          if [ "$transformers_version" != "" ];then
            CMD="${CMD} --transformers-version ${transformers_version}"
          else
            echo "Use default transformers version in image."
          fi

          echo "Run command: ${CMD}"
          eval "${CMD}"

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-metrics-${{ inputs.test_config_name }}
          # output/<branch>-<create_time>-<run_id>-<run_attempt>/<workflow>/<test_type>/<case>
          path: /root/.cache/tests/output/*-${{ github.run_id }}-${{ github.run_attempt }}/*/${{ inputs.test_type }}/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Post process
        if: always()
        run: |
          cd ${ASCEND_E2E_TEST_CONFIG_PATH}
          kubectl get pods -n $NAMESPACE | grep $KUBE_JOB_NAME
          kubectl delete -f ./k8s_multi_pd_*.yaml --ignore-not-found=true || true

          pod_name_prefix="${KUBE_JOB_NAME}-"
          echo "kube name space: $NAMESPACE, pod name prefix: ${pod_name_prefix}"
          while true; do
            if kubectl get po -A -n $NAMESPACE | grep -q "${pod_name_prefix}"; then
              echo "Found exist sglang job, sleeping for 30 seconds..."
              sleep 30
              kubectl get pods | grep "${pod_name_prefix}" | awk '{print $1}' | xargs kubectl delete pod -n $NAMESPACE || true
            else
              echo "No sglang job exist, start test case..."
              break
            fi
          done
          # Cleanup the run-scoped source code directory on the shared PVC.
          rm -rf /root/.cache/tests/sglang-${{ github.run_id }} || true
