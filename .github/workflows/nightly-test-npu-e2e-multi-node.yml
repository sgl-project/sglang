name: 'Nightly Test (NPU) Multi Node Template'

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the event commit SHA.'
        required: false
        type: string
        default: ''
      runner:
        required: false
        type: string
        default: linux-amd64-cpu-8
      test_type:
        required: false
        type: string
        default: perf
        description: perf or accuracy
      test_config_name:
        required: true
        type: string
        description: test config name
      prefill_size:
        required: false
        type: number
        default: 0
        description: number of prefill nodes for pd-separation
      decode_size:
        required: false
        type: number
        default: 0
        description: number of decode nodes for pd-separation
      router_size:
        required: false
        type: number
        default: 0
        description: number of router nodes for pd-separation
      node_size:
        required: false
        type: number
        default: 0
        description: number of nodes for pd-mix
      test_case:
        required: true
        type: string
        description: path of test case file
      test_method:
        required: false
        type: string
        default: ''
        description: "Single test method to run inside test_case, formatted as Class.method. Empty runs every test in the file."
      image:
        required: false
        type: string
        description: image for pods
        default: "swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann8.5.0-a3"
      prefill_decode_deployment:
        required: true
        type: string
        description: "The deployment of prefill and decode nodes. ['separation', 'mix']"
      transformers_version:
        required: false
        type: string
        default: ""
        description: "The transformers version number for running sglang. Use default version in image if keep empty."
      run_start_metadata:
        required: false
        type: string
        default: '{}'
        description: 'JSON run metadata {branch_label, workflow_name, create_time}, recorded once at workflow start'
      container_patches:
        required: false
        type: string
        default: ""
        description: "Comma separated https URLs of container patch zip archives. This workflow downloads and extracts them into the mounted checkout, and each pod runs the install.sh shipped in its archive, which also owns dependency installation (including any package mirror). Empty keeps the image untouched."
      accuracy_dataset:
        required: false
        type: string
        default: ''
        description: 'Accuracy dataset injected into pods as NPU_ACCURACY_DATASET (gsm8k on weekdays, gpqa_diamond on weekends)'
      use_image_sglang:
        required: false
        type: string
        default: ''
        description: "If 'true', pods import sglang from the image's site-packages instead of the checkout mounted at /root/sglang/python. Empty/false uses the checkout (nightly default)."
      sgl_router_artifact:
        required: false
        type: string
        default: ''
        description: "sgl-router-build's aarch64 artifact for the router pod; empty uses the image's sgl-router."

concurrency:
  group: ascend-nightly-multi-node-${{ github.workflow_ref }}-${{ github.ref }}-${{ inputs.test_config_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ inputs.test_config_name }}
    runs-on: ${{ inputs.runner }}
    container:
      image: swr.ap-southeast-1.myhuaweicloud.com/base_image/ascend-ci/sglang:main-x86
      env:
        KUBECONFIG: /root/.cache/.cache/kb.yaml
        KUBECTL: /root/.cache/.cache/kubectl
        NAMESPACE: sgl-project
        KUBE_JOB_NAME: ascend-${{ github.run_id }}
        SGLANG_IS_IN_CI: true
        ASCEND_E2E_TEST_CONFIG_PATH: python/sglang/test/ascend/e2e
        SGLANG_USE_MODELSCOPE: true
        HF_ENDPOINT: https://hf-mirror.com
        TRANSFORMERS_VERBOSITY: "error"
        GDN_ATTN_BACKEND_TRITON: 1
    steps:
      - name: Install dependencies
        run: |
          pip3 install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple jinja2
          pip3 install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple psutil
          # Install kubernetes
          pip3 install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple kubernetes
          cp $KUBECTL /usr/local/sbin/

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # continue-on-error: the artifact expires in a day, and the router pod falls
      # back to the image's sgl-router.
      - name: Download prebuilt sgl-router
        if: inputs.sgl_router_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.sgl_router_artifact }}
          path: sgl-router-bin

      - name: Prepare container patches
        id: container_patches
        if: inputs.container_patches != ''
        env:
          CONTAINER_PATCHES: ${{ inputs.container_patches }}
        run: |
          set -euo pipefail
          mkdir -p container-patches
          dirs=""
          while IFS= read -r url; do
            url="$(echo "${url}" | tr -d '[:space:]')"
            if [ -z "${url}" ]; then
              continue
            fi

            # Only plain https .zip URLs: the archive path ends up in a pod
            # command, so reject anything with shell metacharacters.
            if ! echo "${url}" | grep -Eq '^https://[A-Za-z0-9._~:/@%+=-]+\.zip$'; then
              echo "Invalid container patch url: ${url}"
              exit 1
            fi

            slug="$(printf '%s' "${url}" | sha256sum | awk '{print $1}')"
            dest="container-patches/${slug}"
            # A repeated URL would otherwise install twice in the pods.
            case ",${dirs}," in
              *",${dest},"*) continue ;;
            esac
            rm -rf "${dest}"
            mkdir -p "${dest}"
            archive="/tmp/container-patch-${slug}.zip"

            # OBS lives in the same region as the cluster; bypass any proxy.
            if command -v curl >/dev/null 2>&1; then
              ( unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY; curl -fsSL -o "${archive}" "${url}" )
            elif command -v wget >/dev/null 2>&1; then
              ( unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY; wget -q -O "${archive}" "${url}" )
            else
              echo "Neither curl nor wget is available to download ${url}"
              exit 1
            fi

            python3 -m zipfile -e "${archive}" "${dest}"
            if [ -z "$(find "${dest}" -type f -name install.sh -print -quit)" ]; then
              echo "install.sh not found in ${url}"
              exit 1
            fi

            dirs="${dirs:+${dirs},}${dest}"
          done <<< "$(echo "${CONTAINER_PATCHES}" | tr ',' '\n')"
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"
          echo "Container patch dirs: ${dirs}"

      - name: Prepare code for testing
        timeout-minutes: 15
        run: |
          # Sweep orphaned sglang-{run_id} dirs left by jobs killed before Post process.
          # Backgrounded and capped: the shared PVC is slow, and a pre-existing backlog
          # must not block the critical path. fds are redirected so the runner does not
          # wait on the background job's stdout.
          ( find /root/.cache/tests -regextype posix-extended -maxdepth 1 -type d \
              -regex '.*/sglang-[0-9]+$' -mtime +7 -print 2>/dev/null \
            | head -n 5 | xargs -r rm -rf ) >/dev/null 2>&1 </dev/null &

          # The download drops the executable bit; cp keeps it for the pods.
          chmod +x sgl-router-bin/sgl-router 2>/dev/null || true
          if [ "${{ inputs.prefill_decode_deployment }}" = "separation" ] && [ ! -x sgl-router-bin/sgl-router ]; then
            echo "::warning::No prebuilt sgl-router; the router pod falls back to sgl-router on the image's PATH."
          fi

          # copy source code to shared-disk
          # Append run_id to isolate concurrent runs sharing the same PVC.
          current_path=$(pwd)
          target_path=/root/.cache/tests/sglang-${{ github.run_id }}
          rm -rf ${target_path}
          mkdir -p ${target_path}
          cp -r ${current_path}/* ${target_path}/

      - name: Clear resources
        run: |
          cd ${ASCEND_E2E_TEST_CONFIG_PATH}
          kubectl delete -f ./k8s_multi_pd_*.yaml --ignore-not-found=true || true

          pod_name_prefix="${KUBE_JOB_NAME}-"
          echo "kube name space: $NAMESPACE, pod name prefix: ${pod_name_prefix}"
          while true; do
            if kubectl get po -A -n $NAMESPACE | grep -q "${pod_name_prefix}"; then
              echo "Found exist sglang job, sleeping for 30 seconds..."
              sleep 30
              kubectl get pods | grep "${pod_name_prefix}" | awk '{print $1}' | xargs kubectl delete pod -n $NAMESPACE || true
            else
              echo "No sglang job exist, start test case..."
              break
            fi
          done

      - name: Run test
        id: run_test
        timeout-minutes: 300
        env:
          CONTAINER_PATCH_DIRS: ${{ steps.container_patches.outputs.dirs }}
        run: |
          # sglang_source_relative_path is shared-disk path
          # Append run_id so concurrent runs do not overwrite each other on the shared PVC.
          sglang_source_relative_path=tests/sglang-${{ github.run_id }}
          sglang_source_path=/root/.cache/${sglang_source_relative_path}
          echo "Source code path: ${sglang_source_path}"

          test_case="${{ inputs.test_case }}"
          tc_name=${test_case##*/}
          tc_name=${tc_name%.*}
          echo "name=${tc_name}" >> "$GITHUB_OUTPUT"

          if [ ! -f "${sglang_source_path}/${test_case}" ]; then
            echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
            exit 1
          fi

          # Provided automatically by the GitHub server.
          # run_id is the unique identifier for the workflow run,
          # attempt represents the re‑run attempt count of the job.
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}

          # Parse run metadata (branch_label / workflow_name / create_time)
          # from run_start_metadata JSON input using GitHub fromJson expression, same as partitions input.
          branch_label=$(echo "${{ fromJson(inputs.run_start_metadata).branch_label }}" | tr '/:' '--')
          workflow_name=$(echo "${{ fromJson(inputs.run_start_metadata).workflow_name }}" | tr ' ' '_' | tr -d '()')
          create_time="${{ fromJson(inputs.run_start_metadata).create_time }}"
          if [ -z "${create_time}" ]; then create_time=$(date -u -d '+8 hours' +%Y%m%d-%H%M); fi
          # Append the image tag to the workflow-name segment so that runs with
          # different images (CANN 9.0.0/9.1.0, a3/a5) persist into distinct,
          # image-tagged output/log directories.
          image_label=$(echo "${{ inputs.image }}" | sed 's#.*[/:]##')
          workflow_name="${workflow_name}--${image_label}"

          # Print persistence‑directory‑prefix variables
          echo "Persistence prefix: run_id=${run_id} run_attempt=${run_attempt} branch_label=${branch_label} workflow_name=${workflow_name} create_time=${create_time}"

          sglang_test_results_output_path=/root/.cache/tests/output/${branch_label}-${create_time}-${run_id}-${run_attempt}/${workflow_name}/${{ inputs.test_type }}/${tc_name}
          mkdir -p ${sglang_test_results_output_path}
          echo "Metrics file path: ${sglang_test_results_output_path}"

          prefill_decode_deployment="${{ inputs.prefill_decode_deployment }}"
          kube_job_type=""
          if [ "$prefill_decode_deployment" = "separation" ];then
            kube_job_type=multi-pd-separation
          elif [ "$prefill_decode_deployment" = "mix" ];then
            kube_job_type=multi-pd-mix
          else
            echo "Unsupported deployment type: ${prefill_decode_deployment}"
            exit 1
          fi

          transformers_version="${{ inputs.transformers_version }}"
          cd ${ASCEND_E2E_TEST_CONFIG_PATH}
          CMD="python3 -u run_npu_e2e_test.py \
            --env ci \
            --image ${{ inputs.image }} \
            --sglang-source-relative-path ${sglang_source_relative_path} \
            --metrics-data-file ${sglang_test_results_output_path} \
            --test-case ${test_case} \
            --kube-name-space ${NAMESPACE} \
            --kube-job-type ${kube_job_type} \
            --kube-job-name-prefix ${KUBE_JOB_NAME} \
            --run-id ${{ github.run_id }}"

          container_patches="${CONTAINER_PATCH_DIRS:-}"
          if [ -n "${container_patches}" ]; then
            echo "Container patch dirs: ${container_patches}"
            CMD="${CMD} --container-patches ${container_patches}"
          fi

          accuracy_dataset="${{ inputs.accuracy_dataset }}"
          case "${accuracy_dataset}" in
            ""|gsm8k|gpqa_diamond) ;;
            *) echo "Unsupported accuracy dataset: ${accuracy_dataset}"; exit 1 ;;
          esac
          if [ -n "${accuracy_dataset}" ]; then
            CMD="${CMD} --accuracy-dataset ${accuracy_dataset}"
          fi

          use_image_sglang="${{ inputs.use_image_sglang }}"
          case "${use_image_sglang}" in
            ""|true|false) ;;
            *) echo "Unsupported use_image_sglang: ${use_image_sglang}"; exit 1 ;;
          esac
          if [ -n "${use_image_sglang}" ]; then
            CMD="${CMD} --use-image-sglang ${use_image_sglang}"
          fi

          # Restrict the run to one unittest method inside test_case. The value
          # ends up in the pod's env, so only plain dotted identifiers pass.
          test_method="${{ inputs.test_method }}"
          if [ -n "${test_method}" ]; then
            if ! echo "${test_method}" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$'; then
              echo "Invalid test_method: ${test_method}"
              exit 1
            fi
            echo "Test method: ${test_method}"
            CMD="${CMD} --test-method ${test_method}"
          fi

          if [ "$prefill_decode_deployment" = "separation" ];then
            CMD="${CMD} \
              --prefill-size ${{ inputs.prefill_size }} \
              --decode-size ${{ inputs.decode_size }} \
              --router-size ${{ inputs.router_size }}"
          elif [ "$prefill_decode_deployment" = "mix" ];then
            CMD="${CMD} --node-size ${{ inputs.node_size }}"
          else
            echo "Unsupported deployment type: ${prefill_decode_deployment}"
            exit 1
          fi

          if [ "$SGLANG_IS_IN_CI" = "true" ] || [ "$SGLANG_IS_IN_CI" = "True" ];then
            echo "Run test in ci."
            CMD="${CMD} --sglang-is-in-ci"
          fi

          echo "commit id: ${{ github.sha }}" > "$(dirname "${sglang_test_results_output_path}")/commit_id"

          if [ "$transformers_version" != "" ];then
            CMD="${CMD} --transformers-version ${transformers_version}"
          else
            echo "Use default transformers version in image."
          fi

          echo "Run command: ${CMD}"
          eval "${CMD}"

      - name: Collect node logs
        if: ${{ always() && steps.run_test.outcome != 'success' }}
        continue-on-error: true
        run: |
          tc_name="${{ inputs.test_case }}"
          tc_name="${tc_name##*/}"
          tc_name="${tc_name%.*}"

          collected=0
          for out_dir in /root/.cache/tests/output/*-${{ github.run_id }}-${{ github.run_attempt }}/*/${{ inputs.test_type }}/${tc_name}; do
            [ -d "${out_dir}" ] || continue
            for src_dir in /root/.cache/tests/logs/log/*-${{ github.run_id }}-${{ github.run_attempt }}/*/${tc_name}/*; do
              [ -d "${src_dir}" ] || continue
              [ -f "${src_dir}/${tc_name}.log" ] || continue
              pod_name="$(basename "${src_dir}")"
              dest_dir="${out_dir}/node_logs/${pod_name}"
              # Same name as the pod-side copy and dump_pod_logs: keep whichever
              # archive landed first so each pod ends up with a single log.
              if [ -f "${dest_dir}/${pod_name}.log" ]; then
                continue
              fi
              mkdir -p "${dest_dir}"
              cp -a "${src_dir}/${tc_name}.log" "${dest_dir}/${pod_name}.log"
              collected=$((collected + 1))
            done
          done
          echo "Collected ${collected} pod log dir(s)"
          if [ "${collected}" -eq 0 ]; then
            echo "No pod-side log dir matched; entries under /root/.cache/tests/logs/log:"
            ls -1 /root/.cache/tests/logs/log 2>/dev/null | head -n 20 || true
          fi

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-metrics-${{ inputs.test_config_name }}-attempt-${{ github.run_attempt }}
          path: |
            /root/.cache/tests/output/*-${{ github.run_id }}-${{ github.run_attempt }}/*/${{ inputs.test_type }}/${{ steps.run_test.outputs.name }}
            /root/.cache/tests/output/*-${{ github.run_id }}-${{ github.run_attempt }}/*/${{ inputs.test_type }}/commit_id
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Post process
        if: always()
        run: |
          cd ${ASCEND_E2E_TEST_CONFIG_PATH}
          kubectl get pods -n $NAMESPACE | grep $KUBE_JOB_NAME
          kubectl delete -f ./k8s_multi_pd_*.yaml --ignore-not-found=true || true

          pod_name_prefix="${KUBE_JOB_NAME}-"
          echo "kube name space: $NAMESPACE, pod name prefix: ${pod_name_prefix}"
          while true; do
            if kubectl get po -A -n $NAMESPACE | grep -q "${pod_name_prefix}"; then
              echo "Found exist sglang job, sleeping for 30 seconds..."
              sleep 30
              kubectl get pods | grep "${pod_name_prefix}" | awk '{print $1}' | xargs kubectl delete pod -n $NAMESPACE || true
            else
              echo "No sglang job exist, start test case..."
              break
            fi
          done
          # Cleanup the run-scoped source code directory on the shared PVC.
          rm -rf /root/.cache/tests/sglang-${{ github.run_id }} || true
