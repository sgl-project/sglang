name: PR Test Extra
# Extra CI, opted into per PR: needs run-ci, a run-ci approval of the head commit (unless
# its author may approve), and the run-ci-nv-extra label. pr-gate.yml reads them from the API,
# because an event payload does not refresh on rerun.
#
# Stages: extra-a (1-/2-gpu) and extra-b (4-/8-gpu) caller stubs reuse
# `_pr-test-stage.yml` and `_pr-test-check-changes.yml` from pr-test.yml.

on:
  # No `labeled` trigger: a label event would join the concurrency group and
  # cancel the run in progress. Adding `run-ci-nv-extra` after a push takes a
  # rerun (/run-extra-ci nv, or a manual rerun), which the live label
  # gate in pr-gate.yml then passes.
  # Workflow file from the base branch, never the PR.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      force_continue_on_error:
        description: "Force continue-on-error (test scheduled CI behavior)"
        required: false
        type: boolean
        default: false
      test_parallel_dispatch:
        description: "Test parallel dispatch behavior (simulates scheduled run)"
        required: false
        type: boolean
        default: false
      run_all_tests:
        description: "Run all tests — bypasses paths-filter (needed when dispatching against long-lived branches whose diff against main can't resolve a merge-base in a shallow clone)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run all tests (for releasing or testing purpose)"
        required: false
        type: boolean
        default: false
      skip_pr_test_health_check:
        description: "Skip PR test health check fail-fast (e.g. for release branch cuts)"
        required: false
        type: boolean
        default: false

concurrency:
  # Keys on the PR number: two forks can share a head_ref and would cancel each other.
  group: pr-test-extra-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || 'default' }}-${{ inputs.git_ref || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  SGLANG_IS_IN_CI: true
  SGLANG_CUDA_COREDUMP: "1"
  SGLANG_JIT_DEEPGEMM_FAST_WARMUP: true
  SKIP_PR_TEST_HEALTH_CHECK: ${{ (inputs.skip_pr_test_health_check == true || inputs.run_all_tests == true) && 'true' || 'false' }}
  PR_TEST_BYPASS_MAINTENANCE_ON_MAIN: ${{ github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
  USE_VENV: false

# Read-only for every job that runs PR code; called workflows inherit it.
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

jobs:
  # =============================================== check changes ====================================================
  check-changes:
    # PR runs: nothing from the PR checkout runs until the gate approved this commit.
    needs: call-gate
    if: >-
      always() && !cancelled() && (needs.call-gate.result == 'skipped'
      || needs.call-gate.result == 'success' && needs.call-gate.outputs.opted-in != 'false')
    uses: ./.github/workflows/_pr-test-check-changes.yml
    with:
      git_ref: ${{ inputs.git_ref || '' }}
      run_all_tests: ${{ inputs.run_all_tests == true }}
      force_continue_on_error: ${{ inputs.force_continue_on_error == true }}
      pr_test_yml: '.github/workflows/pr-test-extra.yml'
    secrets: inherit

  # =============================================== PR Gate ====================================================
  # Runtime live-fetch gate. Mirrors pr-test.yml's call-gate, but additionally
  # opts in on `run-ci-nv-extra`. Without it the gate passes with
  # opted-in=false and every test job skips, so the run is green and
  # consumes no runner.
  # Live labels and approval from the API: a rerun after /run-extra-ci must see them.
  call-gate:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/pr-gate.yml
    with:
      require-label: run-ci-nv-extra
      approval-mode: commit
    secrets: inherit

  # =============================================== sgl-kernel ====================================================
  sgl-kernel-build-wheels:
    needs: [check-changes, call-gate]
    if: |
      needs.check-changes.result == 'success' &&
      (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped') &&
      needs.check-changes.outputs.sgl_kernel == 'true'
      && needs.call-gate.outputs.opted-in != 'false'
    uses: ./.github/workflows/_pr-test-sgl-kernel-build.yml
    with:
      runs_on: x64-kernel-build-node
      job_display_name: Build Wheel
      git_ref: ${{ inputs.git_ref || '' }}
      skip_pr_test_health_check: ${{ inputs.skip_pr_test_health_check == true }}
    secrets: inherit

  # =============================================== Rust extensions ====================================================

  # Own build job because artifacts are per-run: a standalone `run-ci-nv-extra` run
  # cannot reach the base run's. Only artifact_name is suffixed; the cache prefix
  # stays at the default so the two workflows share one cache entry.
  rust-ext-build:
    needs: [check-changes, call-gate]
    if: &build-gate |
      !cancelled() &&
      needs.check-changes.result == 'success' &&
      (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
      && needs.call-gate.outputs.opted-in != 'false'
    uses: ./.github/workflows/_pr-test-rust-ext-build.yml
    with:
      runs_on: ubuntu-22.04
      artifact_name: rust-ext-x86_64-extra
      git_ref: ${{ inputs.git_ref || '' }}
    secrets: inherit

  # Own build job for the same reason as rust-ext-build above.
  sgl-router-build:
    needs: [check-changes, call-gate]
    if: *build-gate
    uses: ./.github/workflows/_pr-test-sgl-router-build.yml
    with:
      runs_on: ubuntu-22.04
      artifact_name: sgl-router-x86_64-extra
      git_ref: ${{ inputs.git_ref || '' }}
    secrets: inherit

  # For the GB300 rows.
  sgl-router-build-aarch64:
    needs: [check-changes, call-gate]
    if: *build-gate
    uses: ./.github/workflows/_pr-test-sgl-router-build.yml
    with:
      runs_on: ubuntu-22.04-arm
      artifact_name: sgl-router-aarch64-extra
      git_ref: ${{ inputs.git_ref || '' }}
    secrets: inherit

  simulator-test-cpu:
    needs: [check-changes, call-gate, rust-ext-build]
    if: ${{ !failure() && !cancelled() && needs.check-changes.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped') && needs.call-gate.outputs.opted-in != 'false' }}
    uses: ./.github/workflows/_pr-test-simulator-cpu.yml
    with:
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
    # No `secrets: inherit`: this hosted CPU job has no secret consumer.

  simulator-test-gpu:
    needs: [check-changes, call-gate, sgl-kernel-build-wheels, rust-ext-build]
    if: ${{ !failure() && !cancelled() && needs.check-changes.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped') && needs.call-gate.outputs.opted-in != 'false' }}
    uses: ./.github/workflows/_pr-test-simulator-gpu.yml
    with:
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}

  # =============================================== extra-a / extra-b ===============================================
  # `name:` keeps the job names wait-for-jobs and check-pr-test-health match on.
  extra-test:
    name: ${{ matrix.stage }}-test-${{ matrix.runner_config }}
    needs: [check-changes, call-gate, sgl-kernel-build-wheels, rust-ext-build, sgl-router-build, sgl-router-build-aarch64]
    if: ${{ !failure() && !cancelled() && needs.check-changes.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped') && needs.call-gate.outputs.opted-in != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: extra-a, runner_config: 1-gpu-small, timeout_per_file: '' }
          - { stage: extra-a, runner_config: 1-gpu-large, timeout_per_file: '1800' }
          - { stage: extra-a, runner_config: 2-gpu-large, timeout_per_file: '' }
          - {
              stage: extra-b,
              runner_config: 4-gpu-h100,
              timeout_per_file: '3600',
              warmup_deep_gemm_models: 'lmsys/sglang-ci-dsv3-test:4',
              warmup_server_models: 'lmsys/sglang-ci-dsv3-test:4',
            }
          - { stage: extra-b, runner_config: 4-gpu-b200, timeout_per_file: '1800' }
          - {
              stage: extra-b,
              runner_config: 8-gpu-h200,
              timeout_per_file: '1800',
              warmup_deep_gemm_models: 'deepseek-ai/DeepSeek-V3-0324:8 deepseek-ai/DeepSeek-V3.2:8 XiaomiMiMo/MiMo-V2-Flash:4 XiaomiMiMo/MiMo-V2.5:8',
              warmup_timeout: '60',
            }
          - { stage: extra-b, runner_config: 8-gpu-h20, timeout_per_file: '3600' }
          - { stage: extra-b, runner_config: 8-gpu-b300, timeout_per_file: '3600' }
          - { stage: extra-b, runner_config: 2-gpu-gb300, timeout_per_file: '1800', arch: aarch64 }
          - { stage: extra-b, runner_config: 4-gpu-gb300, timeout_per_file: '1800', arch: aarch64 }
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: ${{ matrix.stage }}-test-${{ matrix.runner_config }}
      runner_config: ${{ matrix.runner_config }}
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      run_timeout_minutes: '60'
      timeout_per_file: ${{ matrix.timeout_per_file }}
      warmup_deep_gemm_models: ${{ matrix.warmup_deep_gemm_models || '' }}
      warmup_server_models: ${{ matrix.warmup_server_models || '' }}
      warmup_timeout_minutes: ${{ matrix.warmup_timeout || '25' }}
      # The artifact is built for x86_64. An aarch64 row passes none, so it
      # restores the aarch64 cache that pr-test.yml's aarch64 build seeds.
      rust_ext_artifact: ${{ matrix.arch != 'aarch64' && needs.rust-ext-build.outputs.artifact_name || '' }}
      # Each row takes its own arch's build; an empty name restores that arch's cache.
      sgl_router_artifact: ${{ matrix.arch == 'aarch64' && needs.sgl-router-build-aarch64.outputs.artifact_name || matrix.arch != 'aarch64' && needs.sgl-router-build.outputs.artifact_name || '' }}
    secrets: inherit

  # =============================================== aggregator ====================================================
  # Mirrors pr-test.yml's `pr-test-finish`: fails if any dependent failed/cancelled.
  pr-test-extra-finish:
    needs:
      [
        check-changes,
        call-gate,
        sgl-kernel-build-wheels,
        rust-ext-build,
        sgl-router-build,
        sgl-router-build-aarch64,
        simulator-test-cpu,
        simulator-test-gpu,
        extra-test,
      ]
    if: always() && needs.call-gate.outputs.opted-in != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS_JSON"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$NEEDS_JSON" >/dev/null; then
            echo "::error::A dependent job failed or was cancelled."
            exit 1
          fi
