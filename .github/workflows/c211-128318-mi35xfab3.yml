name: c211-128318-mi35xfab3
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  fab-01:
    name: probe-job-fab-01
    runs-on: linux-mi35x-gpu-8.fabric
    timeout-minutes: 12
    steps:
      - name: amd-device-identity
        env:
          NONCE: c211-128318-df9104289468182c
        run: |
          set -u
          NONCE='c211-128318-df9104289468182c'
          echo "C211_JOB=fab-01 NONCE=$NONCE"
          echo "C211_MARKER job=fab-01 nonce=$NONCE host=$(hostname 2>/dev/null) fqdn=$(hostname -f 2>/dev/null || true) uid=$(id -u) user=$(id -un)"
          id 2>&1 || true
          uname -a 2>&1 || true
          echo "OS=$(. /etc/os-release 2>/dev/null && echo $PRETTY_NAME)"
          echo "DMI=$(cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>/dev/null | tr '\n' ' ')"
          echo "--- AMD DEVICES (read-only) ---"
          if [ -e /dev/kfd ]; then echo KFD_PRESENT=PRESENT; else echo KFD_PRESENT=ABSENT; fi
          ls -l /dev/kfd /dev/dri 2>&1 | head -30 || true
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi --showuniqueid --showproductname 2>&1 | head -300 || echo ROCM_SMI_FAILED
            rocm-smi --showdriverversion 2>&1 | head -40 || echo ROCM_SMI_DRVVER_FAILED
          else echo ROCM_SMI_ABSENT; fi
          if command -v amd-smi >/dev/null 2>&1; then
            echo "--- AMD_SMI_STATIC ---"
            amd-smi static 2>&1 | head -400 || echo AMD_SMI_FAILED
            echo "--- AMD_SMI_ASIC_SERIAL ---"
            amd-smi static 2>&1 | grep -i 'ASIC_SERIAL' | head -40 || echo AMD_SMI_ASIC_SERIAL_ABSENT
          else echo AMD_SMI_ABSENT; fi
          if [ -r /sys/module/amdgpu/version ]; then echo "AMDGPU_MODULE_VERSION=$(cat /sys/module/amdgpu/version)"; else echo AMDGPU_MODULE_VERSION_ABSENT; fi
          if command -v lspci >/dev/null 2>&1; then lspci 2>/dev/null | grep -iE 'amd|ati|instinct|display|3d controller' | head -30 || true; fi
          echo "C211_PROBE_END job=fab-01 nonce=$NONCE"
          exit 0
