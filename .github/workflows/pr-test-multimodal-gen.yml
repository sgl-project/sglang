name: PR Test - Multimodal Gen

on:
  workflow_call:
    inputs:
      multimodal_gen:
        required: true
        type: string
      sgl_kernel:
        required: true
        type: string
      runner_config:
        required: true
        type: string
      runs_on_map:
        required: true
        type: string
      continue_on_error:
        required: false
        type: string
        default: 'false'
      git_ref:
        required: false
        type: string
        default: ''
      test_parallel_dispatch:
        required: false
        type: string
        default: 'false'
      caller_needs_failure:
        required: false
        type: string
        default: 'false'
      skip_pr_test_health_check:
        required: false
        type: string
        default: 'false'

# Workflow-level env is NOT inherited from the caller in reusable workflows.
# The github context (including github.event_name) IS inherited from the caller.
env:
  SGLANG_IS_IN_CI: true
  NCCL_NVLS_ENABLE: "0"
  SGLANG_CUDA_COREDUMP: "1"
  PR_TEST_BYPASS_MAINTENANCE_ON_MAIN: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
  SKIP_PR_TEST_HEALTH_CHECK: ${{ inputs.skip_pr_test_health_check == 'true' }}

jobs:
  compute-diffusion-partitions:
    if: false  # DEBUG: only the qwen and ltx_2_5 debug jobs run
    runs-on: ubuntu-latest
    outputs:
      matrix-1gpu: ${{ steps.compute.outputs.matrix-1gpu }}
      matrix-2gpu: ${{ steps.compute.outputs.matrix-2gpu }}
      partition-count-1gpu: ${{ steps.compute.outputs['partition-count-1gpu'] }}
      partition-count-2gpu: ${{ steps.compute.outputs['partition-count-2gpu'] }}
      plan-1gpu: ${{ steps.compute.outputs.plan-1gpu }}
      plan-2gpu: ${{ steps.compute.outputs.plan-2gpu }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compute partitions
        id: compute
        run: |
          python scripts/ci/utils/diffusion/compute_diffusion_partitions.py --min-time 1200 --target-time 1800 --max-time 2400 --max-partitions 10

  multimodal-gen-test-1-gpu:
    # DEBUG round 2: qwen is done; only the ltx_2_5 job runs.
    if: false
    runs-on: 1-gpu-h100
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        part: [0]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - uses: ./.github/actions/check-maintenance

      - name: Apply debug instrumentation (env-gated, this job's checkout only)
        run: |
          echo "$DEBUG_PATCH_B64" | base64 -d > /tmp/debug_instrument.patch
          git apply /tmp/debug_instrument.patch
          git diff --stat
        env:
          DEBUG_PATCH_B64: 

      - name: Download artifacts
        if: inputs.sgl_kernel == 'true'
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.10-cuda*

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          CUSTOM_BUILD_SGL_KERNEL=${{inputs.sgl_kernel}} bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run qwen cache-dit step-timing debug
        timeout-minutes: 55
        # No -e: a failing launch must not stop the remaining launches.
        shell: bash --noprofile --norc {0}
        env:
          RUNAI_STREAMER_MEMORY_LIMIT: 0
          OUT: ${{ github.workspace }}/qwen-debug
        run: |
          set -u
          mkdir -p "$OUT"
          NODE="sglang/multimodal_gen/test/server/test_server_1_gpu.py::TestDiffusionServerOneGpu::test_diffusion_generation[qwen_image_t2i_cache_dit_enabled]"
          {
            echo "runner=${RUNNER_NAME:-} host=$(hostname) nproc=$(nproc)"
            free -g; cat /proc/loadavg; lscpu | head -20
            nvidia-smi; nvidia-smi topo -m
            python3 -c "import sys,torch; print(sys.version); print('torch', torch.__version__)"
          } > "$OUT/host.txt" 2>&1
          cat "$OUT/host.txt"
          nvidia-smi dmon -s pucvmet -d 1 -o T > "$OUT/dmon.txt" 2>&1 &
          DMON_PID=$!
          ( while true; do echo "== $(date -u +%FT%TZ) load=$(cut -d' ' -f1-3 /proc/loadavg)"; nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader; sleep 15; done ) > "$OUT/host_samples.txt" 2>&1 &
          HOST_PID=$!
          cleanup() {
            kill "$DMON_PID" "$HOST_PID" 2>/dev/null || true
            pkill -f "sglang serve" 2>/dev/null || true
          }
          trap cleanup EXIT
          printf "launch\tarm\tfused\tsync\tprof\trc\twall_s\te2e_ms\n" > "$OUT/summary.tsv"
          i=0
          # F = fused QK-norm/RoPE epilogue on/off, S = synchronized step timing on/off, P = profiler launch (unsynced).
          for ARM in F1S0 F0S0 F1S1 F0S1 F1S0 F0S0 F1S1 F0S1 F1S0 F0S0 F1S1 F0S1 P1 P0; do
            i=$((i+1))
            FUSED=1; SYNC=0; PROF=0
            case "$ARM" in F0*|P0) FUSED=0;; esac
            case "$ARM" in *S1) SYNC=1;; esac
            case "$ARM" in P*) PROF=1;; esac
            PROF_ENV=""
            if [ "$PROF" = 1 ]; then PROF_ENV="SGLANG_DEBUG_PROFILE_STEPS=8-12 SGLANG_DEBUG_PROFILE_DIR=$OUT/prof_${i}_${ARM}"; fi
            rm -f /tmp/sgl_server_*.log python/diffusion-results.json
            echo "::group::launch $i arm $ARM"
            t0=$(date +%s)
            (cd python && env SGLANG_ENABLE_FUSED_QKNORM_ROPE=$FUSED SGLANG_DIFFUSION_SYNC_STAGE_PROFILING=$SYNC \
              SGLANG_DEBUG_STEP_TRACE_DIR="$OUT/steps_${i}_${ARM}" $PROF_ENV timeout 600 \
              python3 -m pytest -q -s "$NODE") > "$OUT/launch_${i}_${ARM}.log" 2>&1
            rc=$?
            wall=$(( $(date +%s) - t0 ))
            cp /tmp/sgl_server_*.log "$OUT/server_${i}_${ARM}.log" 2>/dev/null || true
            cp python/diffusion-results.json "$OUT/results_${i}_${ARM}.json" 2>/dev/null || true
            e2e=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); r=d if isinstance(d,list) else d.get('results',d); r=r[0] if isinstance(r,list) else r; print(round(r.get('e2e_ms',0),1))" "$OUT/results_${i}_${ARM}.json" 2>/dev/null)
            printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n" "$i" "$ARM" "$FUSED" "$SYNC" "$PROF" "$rc" "$wall" "${e2e:-NA}" | tee -a "$OUT/summary.tsv"
            grep -h "\[DBG\]" "$OUT/launch_${i}_${ARM}.log" "$OUT/server_${i}_${ARM}.log" 2>/dev/null | sort | uniq -c
            echo "::endgroup::"
          done
          echo "=== summary (runner ${RUNNER_NAME:-}) ==="; cat "$OUT/summary.tsv"
          exit 0

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-debug-${{ matrix.part }}
          path: qwen-debug/
          retention-days: 7

  multimodal-gen-test-1-5090:
    if: false  # DEBUG: only the qwen and ltx_2_5 debug jobs run
    runs-on: 1-gpu-5090
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - uses: ./.github/actions/check-pr-test-health

      - uses: ./.github/actions/check-maintenance

      - name: Download artifacts
        if: inputs.sgl_kernel == 'true'
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.10-cuda*

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          CUSTOM_BUILD_SGL_KERNEL=${{inputs.sgl_kernel}} bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run 5090 diffusion canary tests
        timeout-minutes: 120
        env:
          RUNAI_STREAMER_MEMORY_LIMIT: 0
          DIFFUSION_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          SGLANG_DIFFUSION_ARTIFACT_DIR: ${{ github.workspace }}/diffusion-failures
        run: |
          python3 test/run_suite.py \
            --hw cuda \
            --suite base-b-test-diffusion-1-gpu-5090 \
            --timeout-per-file 7200

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-5090-report-${{ github.run_attempt }}
          path: |
            python/sglang/multimodal_gen/test/execution_report_*.json
            python/diffusion-results.json
          retention-days: 7

      - name: Upload diffusion failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-failures-5090-${{ github.run_attempt }}
          path: diffusion-failures/
          if-no-files-found: ignore
          retention-days: 7

      - uses: ./.github/actions/upload-cuda-coredumps
        if: failure()
        with:
          artifact-suffix: 1-gpu-5090

  bcg-diffusion:
    if: false  # DEBUG: only the qwen and ltx_2_5 debug jobs run
    runs-on: 1-gpu-h100
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - uses: ./.github/actions/check-pr-test-health

      - uses: ./.github/actions/check-maintenance

      - name: Download artifacts
        if: inputs.sgl_kernel == 'true'
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.10-cuda*

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          CUSTOM_BUILD_SGL_KERNEL=${{inputs.sgl_kernel}} bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run BCG diffusion tests
        timeout-minutes: 60
        env:
          RUNAI_STREAMER_MEMORY_LIMIT: 0
          DIFFUSION_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          SGLANG_DIFFUSION_ARTIFACT_DIR: ${{ github.workspace }}/diffusion-bcg-artifacts
        run: |
          python3 test/run_suite.py \
            --hw cuda \
            --suite base-b-test-diffusion-bcg-1-gpu-h100 \
            --timeout-per-file 3600

      - name: Upload BCG diffusion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-bcg-artifacts-${{ github.run_attempt }}
          path: diffusion-bcg-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - uses: ./.github/actions/upload-cuda-coredumps
        if: failure()
        with:
          artifact-suffix: bcg-diffusion

  multimodal-gen-test-2-gpu:
    # DEBUG ltx_2_5 component-offload slow mode: two runners, fixed matrix.
    if: inputs.multimodal_gen == 'true'
    runs-on: 2-gpu-h100
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - uses: ./.github/actions/check-maintenance

      - name: Apply debug instrumentation (env-gated, this job's checkout only)
        run: |
          echo "$DEBUG_PATCH_B64" | base64 -d > /tmp/debug_instrument.patch
          git apply /tmp/debug_instrument.patch
          git diff --stat
        env:
          DEBUG_PATCH_B64: 

      - name: Download artifacts
        if: inputs.sgl_kernel == 'true'
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.10-cuda*

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          CUSTOM_BUILD_SGL_KERNEL=${{inputs.sgl_kernel}} bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run ltx_2_5 host-CPU debug (round 2)
        timeout-minutes: 62
        # No -e: a failing (slow) launch must not stop the remaining launches.
        shell: bash --noprofile --norc {0}
        env:
          HF_TOKEN: ${{ secrets.SGLANG_DIFFUSION_CI_HF_TOKEN || secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.SGLANG_DIFFUSION_CI_HF_TOKEN || secrets.HF_TOKEN }}
          RUNAI_STREAMER_MEMORY_LIMIT: 0
          OUT: ${{ github.workspace }}/ltx25-debug
          DEBUG_SAMPLER_B64: 
        run: |
          set -u
          mkdir -p "$OUT"
          NODE="sglang/multimodal_gen/test/server/test_server_2_gpu.py::TestDiffusionServerTwoGpu::test_diffusion_generation[ltx_2_5_diffusion_decoder_2gpus]"
          CASES_FILE=python/sglang/multimodal_gen/test/server/gpu_cases.py
          GPU_NODE=$(nvidia-smi topo -m | awk '/^GPU0/{print $(NF-1)}')
          case "$GPU_NODE" in ''|*[!0-9]*) GPU_NODE=0;; esac
          NODE_CPUS=$(cat /sys/devices/system/node/node${GPU_NODE}/cpulist)
          if ! command -v numactl >/dev/null; then (apt-get install -y -qq numactl || sudo apt-get install -y -qq numactl) >/dev/null 2>&1; fi
          if command -v numactl >/dev/null; then BIND="numactl --cpunodebind=$GPU_NODE --membind=$GPU_NODE"; else BIND="taskset -c $NODE_CPUS"; fi
          {
            echo "runner=${RUNNER_NAME:-} host=$(hostname) nproc=$(nproc) gpu_numa_node=$GPU_NODE node_cpus=$NODE_CPUS bind='$BIND'"
            free -g; cat /proc/loadavg; lscpu | head -24
            nvidia-smi; nvidia-smi topo -m
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null
            cat /proc/sys/kernel/numa_balancing /proc/sys/vm/zone_reclaim_mode 2>/dev/null
            numactl -H 2>/dev/null
            python3 -c "import sys,torch; print(sys.version); print('torch', torch.__version__)"
          } > "$OUT/host.txt" 2>&1
          cat "$OUT/host.txt"
          echo "$DEBUG_SAMPLER_B64" | base64 -d > /tmp/cpu_sampler.py
          python3 /tmp/cpu_sampler.py "$OUT/cpu_samples.jsonl" "$GPU_NODE" > "$OUT/cpu_sampler.err" 2>&1 &
          SAMPLER_PID=$!
          nvidia-smi dmon -s pucvmet -d 1 -o T > "$OUT/dmon.txt" 2>&1 &
          DMON_PID=$!
          cleanup() {
            kill "$SAMPLER_PID" "$DMON_PID" 2>/dev/null || true
            git checkout -- "$CASES_FILE" || true
            pkill -f "sglang serve" 2>/dev/null || true
            sleep 5
            echo "GPU processes left:"; nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv
          }
          trap cleanup EXIT
          printf "launch\tarm\trc\twall_s\tstart_epoch\tend_epoch\n" > "$OUT/summary.tsv"
          i=0
          # A = CI config (component-offload, pinned host copies). U = same with --pin-cpu-memory false.
          # N = A bound to the GPU's NUMA node (CPU + memory). C = transformer and text encoder resident.
          for ARM in A U N C A U N C; do
            i=$((i+1))
            git checkout -- "$CASES_FILE"
            PREFIX=""
            if [ "$ARM" = U ]; then
              sed -i 's/text_encoder=component-offload",/text_encoder=component-offload --pin-cpu-memory false",/' "$CASES_FILE"
            fi
            if [ "$ARM" = C ]; then
              sed -i 's/transformer=component-offload,text_encoder=component-offload/transformer=resident,text_encoder=resident/' "$CASES_FILE"
            fi
            if [ "$ARM" = N ]; then PREFIX="$BIND"; fi
            git diff --stat -- "$CASES_FILE"
            rm -f /tmp/sgl_server_*.log python/diffusion-results.json
            echo "::group::launch $i arm $ARM"
            t0=$(date +%s)
            (cd python && $PREFIX env SGLANG_DEBUG_STEP_TRACE_DIR="$OUT/steps_${i}_${ARM}" timeout 840 \
              python3 -m pytest -q -s "$NODE") > "$OUT/launch_${i}_${ARM}.log" 2>&1
            rc=$?
            t1=$(date +%s)
            cp /tmp/sgl_server_*.log "$OUT/server_${i}_${ARM}.log" 2>/dev/null || true
            cp python/diffusion-results.json "$OUT/results_${i}_${ARM}.json" 2>/dev/null || true
            printf "%s\t%s\t%s\t%s\t%s\t%s\n" "$i" "$ARM" "$rc" "$((t1-t0))" "$t0" "$t1" | tee -a "$OUT/summary.tsv"
            for f in "$OUT/steps_${i}_${ARM}"/steps_rank*.jsonl; do echo "$f"; tail -n 8 "$f"; done 2>/dev/null
            echo "::endgroup::"
          done
          echo "=== summary (runner ${RUNNER_NAME:-}) ==="; cat "$OUT/summary.tsv"
          exit 0

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltx25-debug-${{ matrix.part }}
          path: ltx25-debug/
          retention-days: 7

  multimodal-gen-component-accuracy:
    if: false  # DEBUG: only the qwen and ltx_2_5 debug jobs run
    runs-on: 2-gpu-h100
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - uses: ./.github/actions/check-pr-test-health

      - uses: ./.github/actions/check-maintenance

      - name: Download artifacts
        if: inputs.sgl_kernel == 'true'
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.10-cuda*

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          CUSTOM_BUILD_SGL_KERNEL=${{inputs.sgl_kernel}} bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run diffusion component accuracy tests
        timeout-minutes: 240
        env:
          RUNAI_STREAMER_MEMORY_LIMIT: 0
          DIFFUSION_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
        run: |
          python3 test/run_suite.py \
            --hw cuda \
            --suite base-b-test-diffusion-component-2-gpu-h100 \
            --timeout-per-file 14400

      - uses: ./.github/actions/upload-cuda-coredumps
        if: always()
        with:
          artifact-suffix: component-accuracy

  multimodal-gen-test-1-b200:
    if: false  # DEBUG: only the qwen and ltx_2_5 debug jobs run
    runs-on: ${{ fromJson(inputs.runs_on_map)[inputs.runner_config] }}
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - uses: ./.github/actions/check-pr-test-health

      - uses: ./.github/actions/check-maintenance

      - name: Download artifacts
        if: inputs.sgl_kernel == 'true'
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.10-cuda*

      - name: Install dependencies
        timeout-minutes: 20
        env:
          SGLANG_CI_EARLY_LD_LIBRARY_PATH: "1"
        run: |
          CUSTOM_BUILD_SGL_KERNEL=${{inputs.sgl_kernel}} bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run diffusion server tests
        timeout-minutes: 240
        env:
          RUNAI_STREAMER_MEMORY_LIMIT: 0
          DIFFUSION_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          SGLANG_DIFFUSION_ARTIFACT_DIR: ${{ github.workspace }}/diffusion-failures
        run: |
          python3 test/run_suite.py \
            --hw cuda \
            --suite base-b-test-diffusion-1-gpu-b200 \
            --timeout-per-file 14400

      - name: Upload diffusion failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-failures-${{ github.job }}-${{ github.run_attempt }}
          path: diffusion-failures/
          if-no-files-found: ignore

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-report-1gpu-b200-${{ github.run_attempt }}
          path: |
            python/sglang/multimodal_gen/test/execution_report_*.json
            python/diffusion-results.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: ./.github/actions/upload-cuda-coredumps
        if: failure()

  multimodal-gen-unit-test:
    if: false  # DEBUG: only the qwen and ltx_2_5 debug jobs run
    runs-on: 1-gpu-h100
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - uses: ./.github/actions/check-pr-test-health

      - uses: ./.github/actions/check-maintenance

      - name: Download artifacts
        if: inputs.sgl_kernel == 'true'
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.10-cuda*

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          CUSTOM_BUILD_SGL_KERNEL=${{inputs.sgl_kernel}} bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run diffusion unit tests
        timeout-minutes: 60
        run: |
          python3 test/run_suite.py \
            --hw cuda \
            --suite base-b-test-diffusion-unit-1-gpu-h100 \
            --timeout-per-file 3600

  diffusion-coverage-check:
    if: false  # DEBUG: only the qwen and ltx_2_5 debug jobs run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download all execution reports
        uses: actions/download-artifact@v4
        with:
          path: reports/
          pattern: diffusion-report-*
          merge-multiple: true

      - name: Verify coverage
        run: |
          python scripts/ci/utils/diffusion/verify_diffusion_coverage.py --reports-dir reports/
