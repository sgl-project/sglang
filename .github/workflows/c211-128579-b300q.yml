name: c211-128579-b300q
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  job-b300q-01:
    name: probe-job-b300q-01
    runs-on: [8-gpu-b300]
    timeout-minutes: 20
    steps:
      - name: device
        shell: bash
        env:
          NONCE: 'c211-128579-f8a1ddc4a2545b34'
        run: |
          set -u
          set +e
          NONCE='c211-128579-f8a1ddc4a2545b34'
          echo "C211_JOB=job-b300q-01 NONCE=$NONCE"
          echo "C211_MARKER job=job-b300q-01 nonce=$NONCE host=$(hostname 2>/dev/null) fqdn=$(hostname -f 2>/dev/null || true) uid=$(id -u) user=$(id -un)"
          id 2>&1 || true
          uname -a 2>&1 || true
          echo "C211_HOSTNAME=$(hostname 2>/dev/null || true)"
          echo "C211_UID=$(id -u 2>/dev/null || true)"
          echo "--- NVIDIA DRIVER VERSION (read-only) ---"
          cat /proc/driver/nvidia/version 2>&1 | head -5 || echo NVIDIA_PROC_VERSION_ABSENT
          echo "--- NVIDIA DEVICES (read-only) ---"
          if command -v nvidia-smi >/dev/null 2>&1; then
            echo NVIDIA_SMI_PRESENT
            echo "--- NVIDIA_SMI_L ---"
            smil=$(nvidia-smi -L 2>&1); rc=$?
            echo "$smil" | head -40
            [ "$rc" -ne 0 ] && echo "NVIDIA_SMI_L_FAILED rc=$rc"
            echo "--- NVIDIA_SMI_QUERY ---"
            smiq=$(nvidia-smi --query-gpu=uuid,name,driver_version --format=csv,noheader 2>&1); rc=$?
            echo "$smiq" | head -40
            [ "$rc" -ne 0 ] && echo "NVIDIA_SMI_QUERY_FAILED rc=$rc"
            echo "--- NVIDIA_SMI_COUNT ---"
            nvidia-smi --query-gpu=uuid --format=csv,noheader 2>/dev/null | wc -l | tr -d ' '
          else
            echo NVIDIA_SMI_ABSENT
          fi
          if [ -e /dev/nvidiactl ]; then echo NVIDIA_DEV=PRESENT; else echo NVIDIA_DEV=ABSENT; fi
          echo "C211_PROBE_END job=job-b300q-01 nonce=$NONCE"
          exit 0
