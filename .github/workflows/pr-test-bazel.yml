name: Bazel

on:
  push:
    branches: [main]
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "**/BUILD.bazel"
      - "bazel/**"
      - "python/pyproject*.toml"
      - "python/sglang/*.py"
      - "python/sglang/cli/**"
      - "python/sglang/kernels/**"
      - "python/sglang/lang/**"
      - "python/sglang/srt/**"
      - "rust/Cargo.*"
      - "rust/sglang-grpc/**"
      - "rust/sglang-mm/**"
      - "proto/sglang/runtime/v1/sglang.proto"
      - ".github/workflows/pr-test-bazel.yml"
  pull_request:
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "**/BUILD.bazel"
      - "bazel/**"
      - "python/pyproject*.toml"
      - "python/sglang/*.py"
      - "python/sglang/cli/**"
      - "python/sglang/kernels/**"
      - "python/sglang/lang/**"
      - "python/sglang/srt/**"
      - "rust/Cargo.*"
      - "rust/sglang-grpc/**"
      - "rust/sglang-mm/**"
      - "proto/sglang/runtime/v1/sglang.proto"
      - ".github/workflows/pr-test-bazel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: bazel-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Validate module and target graphs
        run: |
          bazel mod graph
          bazel query //...

      - name: Build independent components
        run: bazel build --config=cpu //:bazel_components

      - name: Run CPU foundation tests
        run: bazel test --config=cpu --config=ci //:bazel_smoke

      - name: Check generated locks
        run: |
          git diff --exit-code -- \
            MODULE.bazel.lock \
            bazel/python/hf_management.requirements.lock.txt \
            bazel/python/runtime_import.requirements.lock.txt \
            bazel/python/srt_empty_bootstrap.requirements.lock.txt \
            bazel/rust/sglang-crates.lock.json
