name: Bazel

on:
  push:
    branches: [main]
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "**/BUILD.bazel"
      - "bazel/**"
      - "python/pyproject*.toml"
      - "python/sglang/*.py"
      - "python/sglang/cli/**"
      - "python/sglang/kernels/**"
      - "python/sglang/lang/**"
      - "python/sglang/srt/**"
      - "rust/Cargo.*"
      - "rust/sglang-grpc/**"
      - "rust/sglang-mm/**"
      - "rust/sglang-server/**"
      - "sgl-model-gateway/**"
      - "proto/sglang/runtime/v1/sglang.proto"
      - ".github/workflows/_pr-test-check-changes.yml"
      - ".github/workflows/pr-test-amd-rocm720.yml"
      - ".github/workflows/pr-test-extra.yml"
      - ".github/workflows/pr-test-bazel.yml"
  pull_request:
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "**/BUILD.bazel"
      - "bazel/**"
      - "python/pyproject*.toml"
      - "python/sglang/*.py"
      - "python/sglang/cli/**"
      - "python/sglang/kernels/**"
      - "python/sglang/lang/**"
      - "python/sglang/srt/**"
      - "rust/Cargo.*"
      - "rust/sglang-grpc/**"
      - "rust/sglang-mm/**"
      - "rust/sglang-server/**"
      - "sgl-model-gateway/**"
      - "proto/sglang/runtime/v1/sglang.proto"
      - ".github/workflows/_pr-test-check-changes.yml"
      - ".github/workflows/pr-test-amd-rocm720.yml"
      - ".github/workflows/pr-test-extra.yml"
      - ".github/workflows/pr-test-bazel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: bazel-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Validate module and target graphs
        run: |
          bazel mod graph
          bazel query //...

      - name: Analyze accelerator migration targets
        run: |
          bazel build --nobuild --config=ci --config=cuda \
            //bazel/integration:dummy_model_e2e \
            //bazel/integration:qwen2_real_weight_e2e \
            //python/sglang/kernels/aot:cuda_wheel

          bazel build --nobuild --config=ci --config=rocm \
            //python/sglang/kernels/aot:rocm_wheel

      - name: Build independent components
        run: |
          bazel build --config=cpu //:bazel_components
          bazel build --config=cpu \
            --define=SGLANG_WHEEL_VERSION=0.0.0.dev0 \
            //bazel/packaging:main_wheel

      - name: Run CPU foundation tests
        run: |
          bazel test --config=cpu --config=ci \
            //:bazel_smoke \
            //bazel/rust:sgl_model_gateway_lock_parity_test \
            //sgl-model-gateway:internal_tests

      - name: Check generated locks
        run: |
          git diff --exit-code -- \
            MODULE.bazel.lock \
            bazel/python/hf_management.requirements.lock.txt \
            bazel/python/runtime_import.requirements.lock.txt \
            bazel/python/srt_empty_bootstrap.requirements.lock.txt \
            bazel/rust/sgl-model-gateway-crates.lock.json \
            bazel/rust/sglang-crates.lock.json
