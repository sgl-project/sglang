name: Auto Label PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Beam label exists
        uses: actions/github-script@v8
        with:
          script: |
            const label = 'beam';
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: label,
                  color: '5319e7',
                  description: 'Reflection Beam model support',
                });
              } catch (error) {
                // Another labeling run may have created it concurrently.
                const alreadyExists = error.status === 422 &&
                  error.response?.data?.errors?.some(e => e.code === 'already_exists');
                if (!alreadyExists) throw error;
              }
            }

      - name: Auto-label by file changes
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: false
