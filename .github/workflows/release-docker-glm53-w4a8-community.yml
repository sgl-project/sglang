name: Build GLM 5.3 W4A8 Community Image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable task image tag
        required: true
        type: string
      source_commit:
        description: Exact SGLang source commit embedded in the image
        required: true
        type: string

concurrency:
  group: glm53-w4a8-community-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bytedance-iaas/sglang'
    environment: prod
    runs-on: x64-docker-build-node
    env:
      IMAGE_REPO: iaas-gpu-cn-beijing.cr.volces.com/serving/sglang
      REGISTRY_HOST: iaas-gpu-cn-beijing.cr.volces.com
      # This image already contains the exact SM90-only wheel built from the
      # AOT tree below. Reuse is allowed only while the requested source has
      # the same tree; the workflow and Dockerfile both fail closed otherwise.
      KERNEL_BASE_IMAGE: iaas-gpu-cn-beijing.cr.volces.com/serving/sglang:glm53-w4a8-community-704c7a96f6-legacy-seed-eager-v2@sha256:426d84c888e8988f5e2e1fad0126a689aa4e941cfdbd8def56710b1c75349b49
      KERNEL_SOURCE_COMMIT: 704c7a96f6c133a3e92cf67883b0f9d4a334b024
      KERNEL_SOURCE_TREE: c1fb7595d0e43d523ad853fefa62d9fd402755a3
      KERNEL_AOT_TREE: 6471f67908ae0c8d5324d628f695123ba59e2f78
      SGL_DEEP_GEMM_COMMIT: aee79a715951a3d47dbbbdbd5387d8be8a131d53
      SGLANG_KERNEL_VERSION: 0.4.6.post1
      SGLANG_KERNEL_BUILD_TORCH: 2.11.0+cu130
      VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
      VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Cleanup workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Prune stale Docker data
        shell: bash
        run: |
          set -euo pipefail
          docker buildx prune --filter "until=72h" -f
          docker system prune -af --filter "until=72h"
          df -h /

      - name: Checkout build recipe
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pin low-disk build recipe
        id: recipe
        shell: bash
        run: |
          set -euo pipefail
          workflow_commit="$(git rev-parse HEAD)"
          install -m 0644 docker/glm53-w4a8-community-kernel-reuse.Dockerfile \
            /tmp/glm53-w4a8-community-kernel-reuse.Dockerfile
          echo "workflow_commit=${workflow_commit}" >> "$GITHUB_OUTPUT"
          printf 'BUILD_WORKFLOW_COMMIT=%s\n' "$workflow_commit"

      - name: Checkout exact source commit
        shell: bash
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_commit must be a full lowercase commit SHA" >&2
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$REQUESTED_SOURCE_COMMIT"
          git checkout --detach "$REQUESTED_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compute source provenance
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git write-tree)"
          test "$source_commit" = "${{ inputs.source_commit }}"
          kernel_aot_tree="$(git rev-parse HEAD:python/sglang/kernels/aot)"
          test "$kernel_aot_tree" = "$KERNEL_AOT_TREE"
          expected_tag_prefix="glm53-w4a8-community-${source_commit:0:10}-"
          case "${{ inputs.image_tag }}" in
            "${expected_tag_prefix}"*) ;;
            *)
              echo "image_tag must start with ${expected_tag_prefix}" >&2
              exit 1
              ;;
          esac
          echo "source_commit=${source_commit}" >> "$GITHUB_OUTPUT"
          echo "source_tree=${source_tree}" >> "$GITHUB_OUTPUT"
          echo "kernel_aot_tree=${kernel_aot_tree}" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_COMMIT=%s\nSOURCE_TREE=%s\nKERNEL_AOT_TREE=%s\n' \
            "$source_commit" "$source_tree" "$kernel_aot_tree"

      - name: Stage exact shallow source tree
        id: archive
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
        run: |
          set -euo pipefail
          rm -rf /tmp/glm53-source /tmp/glm53-build-context
          mkdir -p /tmp/glm53-build-context
          git clone --depth 1 --no-local \
            "file://${GITHUB_WORKSPACE}" /tmp/glm53-source
          test "$(git -C /tmp/glm53-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C /tmp/glm53-source write-tree)" = "$SOURCE_TREE"
          test -z "$(git -C /tmp/glm53-source status --porcelain=v1 --untracked-files=all)"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf /tmp/glm53-build-context/source.tar -C /tmp/glm53-source .
          source_archive_sha256="$(sha256sum /tmp/glm53-build-context/source.tar | awk '{print $1}')"
          echo "source_archive_sha256=${source_archive_sha256}" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_ARCHIVE_SHA256=%s\n' "$source_archive_sha256"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.NO_PROXY=iaas-gpu-cn-beijing.cr.volces.com
            env.no_proxy=iaas-gpu-cn-beijing.cr.volces.com
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["127.0.0.1:5000"]

      - name: Login to Volcengine CR
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VOLCENGINE_CR_USERNAME"
          test -n "$VOLCENGINE_CR_PASSWORD"
          echo "$VOLCENGINE_CR_PASSWORD" | docker login "$REGISTRY_HOST" \
            --username "$VOLCENGINE_CR_USERNAME" --password-stdin

      - name: Build and publish immutable community image
        id: image
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          SOURCE_ARCHIVE_SHA256: ${{ steps.archive.outputs.source_archive_sha256 }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPO}:${{ inputs.image_tag }}"
          build_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          docker buildx build \
            --platform linux/amd64 \
            --file /tmp/glm53-w4a8-community-kernel-reuse.Dockerfile \
            --build-arg BASE_IMAGE="$KERNEL_BASE_IMAGE" \
            --build-arg KERNEL_SOURCE_COMMIT="$KERNEL_SOURCE_COMMIT" \
            --build-arg KERNEL_SOURCE_TREE="$KERNEL_SOURCE_TREE" \
            --build-arg KERNEL_AOT_TREE="$KERNEL_AOT_TREE" \
            --build-arg SGL_DEEP_GEMM_COMMIT="$SGL_DEEP_GEMM_COMMIT" \
            --build-arg SGLANG_KERNEL_VERSION="$SGLANG_KERNEL_VERSION" \
            --build-arg SGLANG_KERNEL_BUILD_TORCH="$SGLANG_KERNEL_BUILD_TORCH" \
            --build-arg SGLANG_BUILD_COMMIT="$SOURCE_COMMIT" \
            --build-arg SGLANG_SOURCE_TREE="$SOURCE_TREE" \
            --build-arg SGLANG_SOURCE_ARCHIVE_SHA256="$SOURCE_ARCHIVE_SHA256" \
            --build-arg SGLANG_BUILD_WORKFLOW_COMMIT="${{ steps.recipe.outputs.workflow_commit }}" \
            --build-arg SGLANG_BUILD_URL="$build_url" \
            --build-arg SGLANG_IMAGE_TAG="$image_ref" \
            --metadata-file /tmp/glm53-w4a8-image-metadata.json \
            --push \
            --tag "$image_ref" \
            /tmp/glm53-build-context
          digest="$(python3 -c 'import json; print(json.load(open("/tmp/glm53-w4a8-image-metadata.json"))["containerimage.digest"])')"
          test -n "$digest"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_REF=%s\nIMAGE_DIGEST=%s\n' "$image_ref" "$digest"

      - name: Verify published digest and provenance
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          SOURCE_ARCHIVE_SHA256: ${{ steps.archive.outputs.source_archive_sha256 }}
          BUILD_WORKFLOW_COMMIT: ${{ steps.recipe.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}@${IMAGE_DIGEST}"
          docker pull "${IMAGE_REF}@${IMAGE_DIGEST}"
          test "$(docker image inspect "${IMAGE_REF}@${IMAGE_DIGEST}" \
            --format '{{ index .Config.Labels "ai.sglang.build.source-archive-sha256" }}')" \
            = "$SOURCE_ARCHIVE_SHA256"
          test "$(docker image inspect "${IMAGE_REF}@${IMAGE_DIGEST}" \
            --format '{{ index .Config.Labels "ai.sglang.build.workflow-commit" }}')" \
            = "$BUILD_WORKFLOW_COMMIT"
          docker run --rm "${IMAGE_REF}@${IMAGE_DIGEST}" bash -ceu '
            test "$(git -C /glm53-community/sglang rev-parse HEAD)" = "$1"
            test "$(git -C /glm53-community/sglang write-tree)" = "$2"
            git -C /glm53-community/sglang diff --quiet -- .
            git -C /glm53-community/sglang diff --cached --quiet -- .
            test -z "$(git -C /glm53-community/sglang status --porcelain=v1 --untracked-files=all)"
            test "$(readlink -f /sgl-workspace/sglang)" = /glm53-community/sglang
            test "$(cat /opt/sgl-deep-gemm/source-commit)" = "$3"
            test "$(cat /opt/sglang-source-archive-sha256)" = "$4"
            test "$(python3 -c '"'"'from importlib.metadata import version; print(version("sglang-kernel"))'"'"')" = "$5"
            test "$(git -C /glm53-community/sglang rev-parse HEAD:python/sglang/kernels/aot)" = "$6"
            test "$(python3 -c '"'"'import torch; print(torch.__version__)'"'"')" = "2.11.0+cu130"
            test "$(python3 -c '"'"'from importlib.metadata import requires; print(next(x.split("==", 1)[1] for x in requires("sglang-kernel") if x.startswith("torch==")))'"'"')" = "2.11.0+cu130"
            python3 -c '"'"'from importlib.metadata import distribution; files = tuple(map(str, distribution("sglang-kernel").files or ())); assert any(path.startswith("sgl_kernel/sm90/common_ops.") and path.endswith(".so") for path in files), files; assert not any(path.startswith("sgl_kernel/sm100/common_ops.") for path in files), files; assert any(path.startswith("sgl_kernel/flash_ops.") and path.endswith(".so") for path in files), files; assert any(path.startswith("sgl_kernel/flashmla_ops.") and path.endswith(".so") for path in files), files'"'"'
            python3 -c '"'"'import torch; from importlib.metadata import distribution; from importlib.util import module_from_spec, spec_from_file_location; dist = distribution("sglang-kernel"); path = next(dist.locate_file(item) for item in dist.files or () if str(item).startswith("sgl_kernel/flashmla_ops.") and str(item).endswith(".so")); spec = spec_from_file_location("flashmla_ops", path); module = module_from_spec(spec); spec.loader.exec_module(module)'"'"'
            PYTHONPATH=/glm53-community/sglang/python python3 -c '"'"'import importlib.machinery, pathlib; expected = pathlib.Path("/glm53-community/sglang/python/sglang/__init__.py"); actual = pathlib.Path(importlib.machinery.PathFinder.find_spec("sglang").origin).resolve(); assert actual == expected'"'"'
            python3 -c '"'"'import deep_gemm; assert callable(getattr(deep_gemm, "fp8_fp4_mega_moe", None)); assert callable(getattr(deep_gemm, "mega_moe_pre_dispatch_sm90", None)); assert callable(getattr(deep_gemm._C, "fp8_fp4_mega_moe_sm90", None))'"'"'
            PYTHONPATH=/glm53-community/sglang/python python3 -m pytest -q /glm53-community/sglang/test/registered/unit/model_loader/test_mxfp4_packed_expert_names.py
            PYTHONPATH=/glm53-community/sglang/python python3 -m pytest -q /glm53-community/sglang/test/registered/unit/models/test_deepseek_nextn_embedding_loading.py
            PYTHONPATH=/glm53-community/sglang/python python3 -m pytest -q /glm53-community/sglang/test/registered/unit/layers/quantization/test_compressed_tensors_mixed_precision.py
            PYTHONPATH=/glm53-community/sglang/python python3 -m pytest -q /glm53-community/sglang/test/registered/unit/layers/moe/test_mega_moe_deepgemm_api.py
            PYTHONPATH=/glm53-community/sglang/python python3 -m pytest -q /glm53-community/sglang/test/registered/unit/model_executor/model_runner_components/test_cuda_graph_setup.py
            PYTHONPATH=/glm53-community/sglang/python python3 -m pytest -q /glm53-community/sglang/test/registered/unit/test_model_overrides.py::TestGoldenModelOverrides::test_deepseek_family_order_safe_declarations
            PYTHONPATH=/glm53-community/sglang/python python3 -m pytest -q \
              /glm53-community/sglang/test/registered/unit/managers/test_pp_output_channel.py \
              /glm53-community/sglang/test/registered/unit/managers/test_scheduler_pp_transport.py \
              /glm53-community/sglang/test/registered/unit/managers/test_pp_cp_rank_offsets.py \
              /glm53-community/sglang/test/registered/unit/spec/test_pp_eagle_raw.py \
              /glm53-community/sglang/test/registered/unit/disaggregation/test_disaggregation_wire.py \
              /glm53-community/sglang/test/registered/unit/disaggregation/test_pp_hybrid_kv_transfer.py \
              /glm53-community/sglang/test/registered/unit/disaggregation/test_pp_eagle_prebuilt_merge.py \
              /glm53-community/sglang/test/registered/unit/model_executor/runner/test_pp_proxy_num_tokens.py \
              /glm53-community/sglang/test/registered/unit/layers/attention/test_dsa_padding.py \
              /glm53-community/sglang/test/registered/unit/layers/attention/test_dsa_multistep_decode.py \
              /glm53-community/sglang/test/registered/unit/model_executor/test_cuda_graph_buffer_registry.py \
              /glm53-community/sglang/test/registered/unit/managers/scheduler_components/test_dp_attn.py \
              /glm53-community/sglang/test/registered/unit/spec/test_eagle_draft_dp_padding.py \
              /glm53-community/sglang/test/registered/unit/spec/test_eagle_worker_v2_topk1_fastpath.py \
              /glm53-community/sglang/test/registered/unit/spec/test_eagle_draft_cuda_graph_runner.py \
              /glm53-community/sglang/test/registered/kernels/ops/attention/test_dsa_transform_index.py::TestDSATransformIndexReference
          ' -- "$SOURCE_COMMIT" "$SOURCE_TREE" "$SGL_DEEP_GEMM_COMMIT" "$SOURCE_ARCHIVE_SHA256" "$SGLANG_KERNEL_VERSION" "$KERNEL_AOT_TREE"
