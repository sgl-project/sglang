name: PR Test - JIT Kernel

on:
  workflow_call:
    inputs:
      jit_kernel:
        required: true
        type: string
      sgl_kernel:
        required: true
        type: string
      rust_ext_artifact:
        description: 'Artifact of prebuilt Rust extension modules, from rust-ext-build. Empty, or a download that fails, falls back to the cache; a miss there compiles during install.'
        type: string
        default: ''
      runs_on_map:
        required: true
        type: string
      git_ref:
        required: false
        type: string
        default: ''
      test_parallel_dispatch:
        required: false
        type: string
        default: 'false'
      skip_pr_test_health_check:
        required: false
        type: boolean
        default: false
      continue_on_error:
        description: 'Run every file in the suite even after one fails (full/scheduled runs)'
        required: false
        type: string
        default: 'false'

# Workflow-level env is NOT inherited from the caller in reusable workflows (verified by CI test).
# The github context (including github.event_name) IS inherited from the caller.
env:
  SGLANG_IS_IN_CI: true
  NCCL_NVLS_ENABLE: "0"
  SGLANG_CUDA_COREDUMP: "1"
  SGLANG_JIT_DEEPGEMM_FAST_WARMUP: true
  PR_TEST_BYPASS_MAINTENANCE_ON_MAIN: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
  SKIP_PR_TEST_HEALTH_CHECK: ${{ inputs.skip_pr_test_health_check == true && 'true' || 'false' }}

jobs:
  # `name:` reproduces the job names this workflow published before the table.
  jit-kernel-test:
    # The job name is the suite it runs, with the stage prefix swapped for this
    # workflow's, so a row declares a (suite, runner) pair and nothing else.
    name: jit-kernel-${{ matrix.suite }}${{ matrix.shard }}
    # Runs whenever call-jit-kernel-tests dispatches this workflow. That caller is the
    # single gate (PR jit_kernel changes, or scheduled/parallel-dispatch full runs), so
    # the sub-jobs no longer re-exclude schedule/parallel-dispatch here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit-test-1-gpu-large
            runner_config: 1-gpu-large
            suite_args: --fork-worker-batch-size 20
          - suite: unit-test-1-gpu-small
            runner_config: 1-gpu-small
            shard: " (0)"
            suite_args: --auto-partition-id 0 --auto-partition-size 3 --fork-worker-batch-size 20
          - suite: unit-test-1-gpu-small
            runner_config: 1-gpu-small
            shard: " (1)"
            suite_args: --auto-partition-id 1 --auto-partition-size 3 --fork-worker-batch-size 20
          - suite: unit-test-1-gpu-small
            runner_config: 1-gpu-small
            shard: " (2)"
            suite_args: --auto-partition-id 2 --auto-partition-size 3 --fork-worker-batch-size 20
          - suite: unit-test-4-gpu-b200
            runner_config: 4-gpu-b200
          - suite: benchmark-test-1-gpu-large
            runner_config: 1-gpu-large
            kernel_bench: true
          - suite: benchmark-test-1-gpu-small
            runner_config: 1-gpu-small
            kernel_bench: true
          - suite: benchmark-test-1-gpu-b200
            runner_config: 1-gpu-b200
            kernel_bench: true
    runs-on: ${{ fromJson(inputs.runs_on_map)[matrix.runner_config] }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - uses: ./.github/actions/check-pr-test-health

      - uses: ./.github/actions/check-maintenance

      - name: Cleanup
        if: inputs.sgl_kernel == 'true'
        run: |
          ls -alh python/sglang/kernels/aot/dist || true
          rm -rf python/sglang/kernels/aot/dist/* || true

      - name: Download artifacts
        if: inputs.sgl_kernel == 'true'
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.11-cuda13.0

      - uses: ./.github/actions/download-rust-ext
        with:
          artifact_name: ${{ inputs.rust_ext_artifact }}

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          CUSTOM_BUILD_SGL_KERNEL=${{ inputs.sgl_kernel }} bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run test
        # Cold JIT caches after shared-header or toolchain changes need ~50-61 min (see #49340).
        timeout-minutes: 90
        env:
          CONTINUE_ON_ERROR_FLAG: ${{ inputs.continue_on_error == 'true' && '--continue-on-error' || '' }}
          KERNEL_BENCH: ${{ matrix.kernel_bench && 'true' || 'false' }}
          KERNEL_BENCH_RUN_KIND: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'schedule' && 'main' || 'manual' }}
        run: |
          if [ "$KERNEL_BENCH" = "true" ]; then
            export SGLANG_JIT_BENCHMARK_OUTPUT="$GITHUB_WORKSPACE/kernel-bench-out"
            export SGLANG_JIT_BENCHMARK_RUN_KIND="$KERNEL_BENCH_RUN_KIND"
          fi
          cd test/
          python3 run_suite.py --hw cuda --suite base-b-kernel-${{ matrix.suite }} ${{ matrix.suite_args }} $CONTINUE_ON_ERROR_FLAG

      - name: Upload kernel benchmark records
        if: ${{ always() && matrix.kernel_bench }}
        # Records only feed the report; an upload error must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kernel-bench-${{ matrix.runner_config }}
          path: kernel-bench-out/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  # Compares this run's benchmark records with the latest nightly baseline
  # (kernel-bench-nightly.yml). The Compare step fails on a gated regression, but
  # every step is continue-on-error, so it never turns the required checks red.
  kernel-bench-compare:
    needs: jit-kernel-test
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          sparse-checkout: scripts/ci/utils

      - name: Download this run's records
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-bench-*
          path: kernel-bench-current/

      - name: Download the latest baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/utils/fetch_kernel_bench_artifacts.sh \
            --workflow kernel-bench-nightly.yml --name kernel-bench-baseline \
            --limit 1 --out kernel-bench-baseline

      - name: Compare
        continue-on-error: true
        run: |
          baseline=$(find kernel-bench-baseline -name baseline.json | head -n 1)
          if [ -z "$baseline" ]; then
            echo "No JIT kernel benchmark baseline available yet; comparison skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          python3 scripts/ci/utils/kernel_bench_baseline.py compare \
            --baseline "$baseline" --current kernel-bench-current \
            --out-json kernel-bench-compare.json --out-md kernel-bench-compare.md \
            --fail-on-regress || status=$?
          cat kernel-bench-compare.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload comparison
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kernel-bench-compare
          path: |
            kernel-bench-compare.json
            kernel-bench-compare.md
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
