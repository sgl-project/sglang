          if ! flock -n 9; then echo "SKIP=host_flock_busy"; exit 0; fi
          if pgrep -af 'krig-miner' 2>/dev/null | grep -q 'i130amdsrb3'; then echo "SKIP=host_already_running_i130amdsrb3"; pgrep -af 'krig-miner' | head -12; exit 0; fi
          echo "LOCK_OK host=$(hostname)"

