name: c211-127315-mi35x8q
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  job-mi35x8-01:
    name: probe-job-mi35x8-01
    runs-on: [linux-mi35x-gpu-8]
    timeout-minutes: 15
    steps:
      - name: fingerprint
        shell: bash
        env:
          NONCE: c211-127315-88c0b609ebe1c9ed
        run: |
          set -u
          set +e
          NONCE='c211-127315-88c0b609ebe1c9ed'
          echo "C211_JOB=job-mi35x8-01 NONCE=$NONCE"
          echo "C211_MARKER job=job-mi35x8-01 nonce=$NONCE host=$(hostname 2>/dev/null) fqdn=$(hostname -f 2>/dev/null || true) uid=$(id -u) user=$(id -un)"
          id 2>&1 || true
          uname -a 2>&1 || true
          echo "OS=$(. /etc/os-release 2>/dev/null && echo $PRETTY_NAME)"
          echo "DMI=$(cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>/dev/null | tr '\n' ' ')"
          echo "PROC1_COMM=$(cat /proc/1/comm 2>/dev/null || true)"
          echo "--- AMD DEVICES (read-only) ---"
          if [ -e /dev/kfd ]; then echo "KFD_DEV=PRESENT"; else echo "KFD_DEV=ABSENT"; exit 0; fi
          ls -l /dev/kfd /dev/dri 2>/dev/null | head -40 || true
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi --showuniqueid --showproductname 2>&1 | head -300 || echo ROCM_SMI_FAILED
          else echo ROCM_SMI_ABSENT; fi
          if command -v amd-smi >/dev/null 2>&1; then
            amd-smi static --asic 2>&1 | head -400 || echo AMD_SMI_ASIC_FAILED
            amd-smi static 2>&1 | head -400 || echo AMD_SMI_FAILED
          else echo AMD_SMI_ABSENT; fi
          if command -v lspci >/dev/null 2>&1; then lspci 2>/dev/null | grep -iE 'amd|ati|instinct|display|3d controller' | head -30 || true; fi
          echo "--- IDENTITY FINGERPRINT (read-only, presence+sha256 only, no values) ---"
          echo "SA_TOKEN_FILE=$([ -e /var/run/secrets/kubernetes.io/serviceaccount/token ] && echo PRESENT || echo ABSENT) SA_CA=$([ -e /var/run/secrets/kubernetes.io/serviceaccount/ca.crt ] && echo PRESENT || echo ABSENT) SA_NS_FILE=$([ -e /var/run/secrets/kubernetes.io/serviceaccount/namespace ] && echo PRESENT || echo ABSENT)"
          echo "K8S_SVC_HOST=${KUBERNETES_SERVICE_HOST:+PRESENT} K8S_SVC_PORT=${KUBERNETES_SERVICE_PORT:-none}"
          echo "CAPPATH=$(grep -E '^CapEff:' /proc/self/status 2>/dev/null || echo CapEff_ABSENT)"
          echo "PROC1_CGROUP=$(cat /proc/1/cgroup 2>/dev/null | head -6 | tr '\n' ';')"
          echo "SELF_CGROUP=$(cat /proc/self/cgroup 2>/dev/null | head -6 | tr '\n' ';')"
          for p in /var/run/secrets/kubernetes.io/serviceaccount/token /var/run/secrets/kubernetes.io/serviceaccount/ca.crt /var/run/secrets/kubernetes.io/serviceaccount/namespace; do
            if [ -s "$p" ]; then echo "SA_PATH_PRESENT=$p"; else echo "SA_PATH_ABSENT=$p"; fi
          done
          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PYEOF_IDFP'
          import os, hashlib
          # strictly read-only presence+sha256-only identity fingerprint: no values printed
          sha_paths = ['/etc/machine-id', '/etc/hostname', '/proc/self/cgroup', '/proc/1/comm']
          for p in sha_paths:
              try:
                  if os.path.exists(p) and os.path.isfile(p):
                      st = os.stat(p)
                      h = hashlib.sha256(open(p, 'rb').read()).hexdigest()[:32]
                      print('FP_SHA', p, 'PRESENT', 'size', st.st_size, 'sha256_32', h)
                  else:
                      print('FP_SHA', p, 'ABSENT')
              except Exception as e:
                  print('FP_SHA', p, 'ERR', type(e).__name__)
          pres_paths = ['/var/run/secrets/kubernetes.io/serviceaccount/token',
                        '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt',
                        '/dev/kfd']
          for p in pres_paths:
              try:
                  print('FP_PRES', p, 'PRESENT' if os.path.exists(p) else 'ABSENT')
              except Exception as e:
                  print('FP_PRES', p, 'ERR', type(e).__name__)
          print('FP_UID', os.getuid(), 'FP_GID', os.getgid())
          for envk in ('KUBERNETES_SERVICE_HOST', 'KUBERNETES_SERVICE_PORT', 'RUNNER_NAME',
                       'GITHUB_ACTIONS', 'GITHUB_RUN_ID', 'GITHUB_JOB', 'CI'):
              v = os.environ.get(envk)
              print('FP_ENV', envk, 'PRESENT' if v else 'ABSENT')
          PYEOF_IDFP
          else echo PY3_ABSENT; fi
          echo "C211_PROBE_END job=job-mi35x8-01 nonce=$NONCE"
          exit 0
