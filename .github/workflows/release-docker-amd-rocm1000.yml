name: Build ROCm 10.0.0 GA + AITER a6d2b564 Images (AMD)
on:
  workflow_dispatch:
    inputs:
      job_select:
        description: 'Select which release job to run'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - publish
  # Keep the AITER comparison isolated from the GA baseline branch.
  push:
    branches:
      - codex/rocm1000-ga-aiter-a6d2b564

concurrency:
  # Tags are date-based, so only the newest build for a ref may publish them.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The full PR workflow chains the AMD extra suite, which needs these scopes.
# Reusable workflows cannot elevate permissions granted by their caller.
permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

env:
  # Scratch registry and unique tag namespace for the AITER comparison images.
  IMAGE_REPO: bingxche/sgl-test
  ROCM_VARIANT: rocm1000-aiter-a6d2b564
  AITER_COMMIT: a6d2b564fd671724a3720b8edf70e8d674e4d694

jobs:
  publish:
    if: github.repository == 'sgl-project/sglang' && (github.event_name != 'workflow_dispatch' || inputs.job_select == 'all' || inputs.job_select == 'publish')
    runs-on: amd-docker-scale
    environment: 'prod'
    strategy:
      fail-fast: false
      matrix:
        gpu_arch: ['gfx942-rocm1000', 'gfx950-rocm1000']
        build_type: ['all']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe to find tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Set Date"
        run: |
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Get version from latest tag
        id: version
        run: |
          # Use the shared helper so stable/post releases sort above rc tags.
          VERSION=$(python3 scripts/release/get_version_tag.py --tag-only | sed 's/^v//')

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from git tags"
            exit 1
          fi

          # Get short commit hash of current HEAD
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Compose pretend version for setuptools_scm: e.g., 0.5.8.post1.dev20260211+g1a2b3c4
          PRETEND_VERSION="${VERSION}.dev${{ env.DATE }}+g${COMMIT_HASH}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pretend_version=${PRETEND_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"
          echo "Pretend version for pip: ${PRETEND_VERSION}"

      - name: Login to Docker Hub (test)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_AMD_TEST_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TEST_TOKEN }}

      - name: Build and push AITER comparison image
        run: |
          version=${{ steps.version.outputs.version }}
          pretend_version=${{ steps.version.outputs.pretend_version }}
          echo "Version: ${version}"
          echo "Pretend version: ${pretend_version}"

          case "${{ matrix.gpu_arch }}" in
            gfx942-rocm1000) gpu_tag="mi30x" ;;
            gfx950-rocm1000) gpu_tag="mi35x" ;;
            *)
              echo "Unsupported gfx arch"
              exit 1
              ;;
          esac

          tag=v${version}-${ROCM_VARIANT}-${gpu_tag}

          # remove --build-arg NIC_BACKEND=ainic for auto detection nic support in mori
          # UBUNTU_MIRROR forces apt over HTTPS to dodge port-80 reachability flakes
          # to Canonical's archive.ubuntu.com mirror IPs from the build runner.
          docker build . -f docker/rocm.Dockerfile --build-arg SGL_BRANCH=${{ github.sha }} --build-arg BUILD_TYPE=${{ matrix.build_type }} --build-arg GPU_ARCH=${{ matrix.gpu_arch }} --build-arg AITER_COMMIT=${AITER_COMMIT} --build-arg ENABLE_MORI=1 --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=${pretend_version} --build-arg UBUNTU_MIRROR=https://archive.ubuntu.com -t ${IMAGE_REPO}:${tag}-${{ env.DATE }} --no-cache

          stamped_aiter_commit=$(docker run --rm --entrypoint /usr/bin/printenv \
            ${IMAGE_REPO}:${tag}-${{ env.DATE }} AITER_COMMIT)
          actual_aiter_commit=$(docker run --rm --entrypoint /bin/bash \
            ${IMAGE_REPO}:${tag}-${{ env.DATE }} \
            -lc 'git -C /sgl-workspace/aiter rev-parse HEAD')
          echo "AITER commit stamped in image: ${stamped_aiter_commit}"
          echo "AITER commit in image: ${actual_aiter_commit}"
          if [[ "${stamped_aiter_commit}" != "${AITER_COMMIT}" || \
                "${actual_aiter_commit}" != "${AITER_COMMIT}" ]]; then
            echo "::error::Expected AITER ${AITER_COMMIT}; stamp=${stamped_aiter_commit}, git=${actual_aiter_commit}"
            exit 1
          fi

          docker push ${IMAGE_REPO}:${tag}-${{ env.DATE }}

  validate-pr:
    name: Run full AMD PR suite with ROCm 10.0.0 GA + AITER a6d2b564
    needs: publish
    if: github.event_name == 'push' || inputs.job_select == 'all'
    uses: ./.github/workflows/pr-test-amd-rocm720.yml
    with:
      rocm_version: rocm1000-aiter-a6d2b564
      ref: ${{ github.sha }}
      runner_arch: mi300
      run_all_tests: true
      aiter_ref: a6d2b564fd671724a3720b8edf70e8d674e4d694
      continue_on_error: true
    secrets: inherit

  validate-nightly:
    name: Run full AMD nightly suite with ROCm 10.0.0 GA + AITER a6d2b564
    needs: publish
    if: github.event_name == 'push' || inputs.job_select == 'all'
    uses: ./.github/workflows/nightly-test-amd-rocm720.yml
    with:
      rocm_version: rocm1000-aiter-a6d2b564
      ref: ${{ github.sha }}
      aiter_ref: a6d2b564fd671724a3720b8edf70e8d674e4d694
      job_filter: all
      continue_on_error: true
    secrets: inherit
