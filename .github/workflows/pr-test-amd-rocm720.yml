name: PR Test ROCm 7.2 (AMD) - Local Registry Pull Test

# Temporary stress test: fan out the existing MI300 PR-test slots without a
# concurrency cap. Each matrix leg only pulls one image from the local registry.
run-name: Local registry pull test - ${{ inputs.amd_ci_image || 'rocm/sgl-dev:v0.5.18-rocm724-mi30x-20260824' }}

on:
  pull_request:
    paths:
      - ".github/workflows/pr-test-amd-rocm720.yml"
  workflow_dispatch:
    inputs:
      amd_ci_image:
        description: 'Image to pull through 10.44.14.109:5000'
        required: false
        type: string
        default: 'rocm/sgl-dev:v0.5.18-rocm724-mi30x-20260824'

permissions:
  contents: read

env:
  LOCAL_DOCKER_REGISTRY: 10.44.14.109:5000
  AMD_CI_IMAGE: ${{ inputs.amd_ci_image || 'rocm/sgl-dev:v0.5.18-rocm724-mi30x-20260824' }}

jobs:
  pull-local-registry-image:
    name: ${{ format('{0} (MI300, {1}, part {2})', matrix.source_job, matrix.runner, matrix.part) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Preserve the original PR-test MI300 fan-out: 36 concurrent pulls.
          - source_job: sgl-kernel-unit-test-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: all
          - source_job: sgl-kernel-unit-test-2-gpu-amd-rocm720
            runner: linux-mi300-2gpu-sglang
            part: all
          - source_job: stage-a-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: all
          - source_job: jit-kernel-unit-test-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: all
          - source_job: jit-kernel-benchmark-test-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: all
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 0
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 1
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 2
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 3
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 4
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 5
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 6
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 7
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 8
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 9
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 10
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 11
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 12
          - source_job: stage-b-test-1-gpu-small-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 13
          - source_job: stage-b-test-1-gpu-small-amd-nondeterministic-rocm720
            runner: linux-mi300-1gpu-sglang
            part: all
          - source_job: stage-b-test-1-gpu-large-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 0
          - source_job: stage-b-test-1-gpu-large-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 1
          - source_job: stage-b-test-1-gpu-large-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 2
          - source_job: stage-b-test-2-gpu-large-amd-rocm720
            runner: linux-mi300-2gpu-sglang
            part: 0
          - source_job: stage-b-test-2-gpu-large-amd-rocm720
            runner: linux-mi300-2gpu-sglang
            part: 1
          - source_job: multimodal-gen-test-1-gpu-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 0
          - source_job: multimodal-gen-test-1-gpu-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 1
          - source_job: multimodal-gen-test-1-gpu-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 2
          - source_job: multimodal-gen-test-1-gpu-amd-rocm720
            runner: linux-mi300-1gpu-sglang
            part: 3
          - source_job: multimodal-gen-test-2-gpu-amd-rocm720
            runner: linux-mi300-2gpu-sglang
            part: 0
          - source_job: multimodal-gen-test-2-gpu-amd-rocm720
            runner: linux-mi300-2gpu-sglang
            part: 1
          - source_job: stage-c-test-4-gpu-amd-rocm720
            runner: linux-mi300-4gpu-sglang
            part: 0
          - source_job: stage-c-test-large-8-gpu-amd-rocm720
            runner: linux-mi300-8gpu-sglang
            part: 0
          - source_job: stage-c-test-large-8-gpu-amd-rocm720
            runner: linux-mi300-8gpu-sglang
            part: 1
          - source_job: stage-c-test-large-8-gpu-amd-rocm720
            runner: linux-mi300-8gpu-sglang
            part: 2
          - source_job: stage-c-test-large-8-gpu-amd-rocm720
            runner: linux-mi300-8gpu-sglang
            part: 3
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Pull image from local registry
        shell: bash
        run: |
          set -euo pipefail
          image="${AMD_CI_IMAGE#${LOCAL_DOCKER_REGISTRY}/}"
          docker pull "${LOCAL_DOCKER_REGISTRY}/${image}"
