name: Release Docker Images Nightly ROCm7.2 (AMD)
on:
  workflow_dispatch:
    inputs:
      job_select:
        description: 'Select which release job to run'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - publish
          - verify_profiling
      probe_image:
        description: 'With job_select=verify_profiling, qualify this image instead of building one, e.g. rocm/sgl-dev:v0.5.17-rocm724-mi35x-20260820. Pair it with gpu_arch to pick the GPU it runs on.'
        required: false
        type: string
        default: ''
      gpu_arch:
        description: 'Select which ROCm 7.2 GPU arch to build'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - gfx942-rocm724
          - gfx950-rocm724
          - gfx942-rocm720
          - gfx950-rocm720
  schedule:
    - cron: '0 12 * * *'

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: True

jobs:
  publish:
    if: github.repository == 'sgl-project/sglang' && (github.event_name != 'workflow_dispatch' || inputs.job_select == 'all' || inputs.job_select == 'publish')
    runs-on: amd-docker-scale
    environment: 'prod'
    strategy:
      fail-fast: false
      matrix:
        gpu_arch: ${{ fromJson((github.event_name == 'workflow_dispatch' && inputs.gpu_arch != 'all' && inputs.gpu_arch != '') && format('["{0}"]', inputs.gpu_arch) || '["gfx942-rocm720", "gfx950-rocm720", "gfx942-rocm724", "gfx950-rocm724"]') }}
        build_type: ['all']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe to find tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Set Date"
        run: |
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Get version from latest tag
        id: version
        run: |
          # Use the shared helper so stable/post releases sort above rc tags.
          VERSION=$(python3 scripts/release/get_version_tag.py --tag-only | sed 's/^v//')

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from git tags"
            exit 1
          fi

          # Get short commit hash of current HEAD
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Compose pretend version for setuptools_scm: e.g., 0.5.8.post1.dev20260211+g1a2b3c4
          PRETEND_VERSION="${VERSION}.dev${{ env.DATE }}+g${COMMIT_HASH}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pretend_version=${PRETEND_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"
          echo "Pretend version for pip: ${PRETEND_VERSION}"

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

      - name: Build and Push to rocm/sgl-dev
        run: |
          version=${{ steps.version.outputs.version }}
          pretend_version=${{ steps.version.outputs.pretend_version }}
          echo "Version: ${version}"
          echo "Pretend version: ${pretend_version}"

          if [ "${{ matrix.gpu_arch }}" = "gfx942-rocm724" ]; then
            rocm_tag="rocm724-mi30x"
          elif [ "${{ matrix.gpu_arch }}" = "gfx950-rocm724" ]; then
            rocm_tag="rocm724-mi35x"
          elif [ "${{ matrix.gpu_arch }}" = "gfx942-rocm720" ]; then
            rocm_tag="rocm720-mi30x"
          elif [ "${{ matrix.gpu_arch }}" = "gfx950-rocm720" ]; then
            rocm_tag="rocm720-mi35x"
          else
            echo "Unsupported gfx arch"
            exit 1
          fi

          tag=v${version}-${rocm_tag}
          echo "IMAGE_TAG=${tag}-${{ env.DATE }}" >> $GITHUB_ENV

          # remove --build-arg NIC_BACKEND=ainic for auto detection nic support in mori
          # UBUNTU_MIRROR forces apt over HTTPS to dodge port-80 reachability flakes
          # to Canonical's archive.ubuntu.com mirror IPs from the amd-docker-scale runner.
          docker build . -f docker/rocm.Dockerfile --build-arg SGL_BRANCH=${{ github.ref_name }} --build-arg BUILD_TYPE=${{ matrix.build_type }} --build-arg GPU_ARCH=${{ matrix.gpu_arch }} --build-arg ENABLE_MORI=1 --build-arg ENABLE_NIXL=1 --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=${pretend_version} --build-arg UBUNTU_MIRROR=https://archive.ubuntu.com -t rocm/sgl-dev:${tag}-${{ env.DATE }} --no-cache
          docker push rocm/sgl-dev:${tag}-${{ env.DATE }}

      # Persist the tag right after rocm/sgl-dev push succeeds so the local
      # registry mirror can run even if a later step in this job (lmsys push)
      # fails. By default this step only runs when the previous step succeeded,
      # so the artifact only exists when an image actually landed on Docker Hub.
      - name: Save published image tag
        run: |
          mkdir -p image-tag
          echo "${{ env.IMAGE_TAG }}" > "image-tag/${{ matrix.gpu_arch }}.txt"

      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag-${{ matrix.gpu_arch }}
          path: image-tag/${{ matrix.gpu_arch }}.txt
          retention-days: 1

      - name: Login to Docker Hub (lmsys)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to lmsysorg/sglang-rocm
        run: |
          docker tag rocm/sgl-dev:${{ env.IMAGE_TAG }} lmsysorg/sglang-rocm:${{ env.IMAGE_TAG }}
          docker push lmsysorg/sglang-rocm:${{ env.IMAGE_TAG }}

  # The rocm724 flavors exist to restore torch.profiler under HIP graph replay,
  # which ROCm 7.2.0 drops (ROCm/ROCm#6102, fixed in 7.2.2). Nothing else notices
  # if that regresses: the loss is partial, so an under-reported trace still looks
  # like a successful profile, and the profiling suite runs without CUDA graphs on
  # ROCm (#34452), so it never exercises the replay path. Each flavor is checked on
  # the GPU it targets, since the behaviour lives in the HIP runtime.
  #
  # Two runs per image, because installing the fixed ROCm is not the same as
  # loading it: the default records what users get, and the preloaded run is what
  # the image can do and is the one that has to pass.
  #
  # Runs after publish rather than gating it: the images should not wait on a GPU
  # runner queue. A red leg here means the day's rocm724 image traces nothing
  # under graph replay and should not be recommended for profiling.
  verify_profiling:
    # Per leg, like the mirror job below: a rocm720 leg failing in publish must
    # not stop the rocm724 images from being checked, and a rocm724 leg that
    # never published has no artifact and fails at the download.
    if: |
      always() && !cancelled() && github.repository == 'sgl-project/sglang' &&
      needs.publish.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' ||
       ((inputs.job_select == 'all' || inputs.job_select == 'verify_profiling') &&
        (inputs.gpu_arch == 'all' || inputs.gpu_arch == '' ||
         contains(inputs.gpu_arch, 'rocm724'))))
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        gpu_arch: ${{ fromJson((github.event_name == 'workflow_dispatch' && contains(inputs.gpu_arch, 'rocm724')) && format('["{0}"]', inputs.gpu_arch) || '["gfx942-rocm724", "gfx950-rocm724"]') }}
    runs-on: ${{ matrix.gpu_arch == 'gfx942-rocm724' && 'linux-mi300-1gpu-sglang' || 'linux-mi35x-gpu-1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image tag artifact
        if: inputs.probe_image == ''
        uses: actions/download-artifact@v4
        with:
          name: image-tag-${{ matrix.gpu_arch }}

      - name: Resolve image
        env:
          PROBE_IMAGE: ${{ inputs.probe_image }}
        run: |
          if [ -n "${PROBE_IMAGE}" ]; then
            image="${PROBE_IMAGE}"
          else
            image_tag=$(tr -d '[:space:]' < "${{ matrix.gpu_arch }}.txt")
            if [ -z "${image_tag}" ]; then
              echo "::error::Image tag artifact is empty"
              exit 1
            fi
            image="rocm/sgl-dev:${image_tag}"
          fi
          echo "IMAGE=${image}" >> $GITHUB_ENV
          echo "Verifying ${image}"

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        run: bash scripts/ci/amd/amd_ci_start_container.sh --custom-image "${IMAGE}"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DOCKERHUB_AMD_USERNAME: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
          DOCKERHUB_AMD_TOKEN: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

      # No dependency install: this checks the image's own torch and HIP runtime,
      # which is what was just published.
      # Out of the box the torch wheel loads the HIP and roctracer it vendors in
      # torch/lib, which are 7.2.0, so this records what a user gets by default
      # rather than what the image is capable of. It is expected to fail until
      # torch stops shadowing the ROCm install, so it does not fail the job.
      - name: Probe HIP-graph profiling (image default)
        id: default_probe
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          docker exec -w /sglang-checkout ci_sglang \
            python3 scripts/ci/amd/check_hip_graph_profiling.py 2>&1 | tee probe-default.log

      # The image's own 7.2.4 HIP and roctracer, which is the configuration that
      # traces graph replay in full. LD_PRELOAD has to be set before the process
      # starts, so it goes on docker exec rather than inside the probe.
      - name: Probe HIP-graph profiling (ROCm runtime preloaded)
        timeout-minutes: 20
        run: |
          set -o pipefail
          preload=$(docker exec ci_sglang \
            python3 /sglang-checkout/scripts/ci/amd/check_hip_graph_profiling.py --print-ld-preload)
          echo "LD_PRELOAD=${preload}"
          docker exec -w /sglang-checkout -e LD_PRELOAD="${preload}" ci_sglang \
            python3 scripts/ci/amd/check_hip_graph_profiling.py 2>&1 | tee probe-preloaded.log

      - name: Summarize
        if: always()
        run: |
          {
            echo "### ${{ matrix.gpu_arch }}"
            echo "- **Image:** \`${IMAGE}\`"
            echo ""
            echo "**Image default** (\`${{ steps.default_probe.outcome }}\`)"
            echo '```'
            cat probe-default.log 2>/dev/null || echo "no probe output"
            echo '```'
            echo "**ROCm runtime preloaded**"
            echo '```'
            cat probe-preloaded.log 2>/dev/null || echo "no probe output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # These runners are shared with the AMD test suites, and the container
      # holds VRAM until something reclaims it.
      - name: Stop CI container
        if: always()
        run: docker rm -f ci_sglang || true

  # Mirror the freshly published rocm/sgl-dev image to the in-network Docker
  # registry so AMD CI runners can pull without hitting Docker Hub rate limits.
  # The tag is read verbatim from the publish job's artifact so this job uses
  # exactly the same tag that publish pushed (only the registry prefix differs).
  # `!cancelled()` lets us still mirror successful matrix legs when other legs
  # of publish failed; legs without an artifact will fail at download and be
  # the only ones marked red.
  push_local_registry:
    if: ${{ false }}
    runs-on: linux-mi300-1gpu-sglang
    environment: 'prod'
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        gpu_arch: ${{ fromJson((github.event_name == 'workflow_dispatch' && inputs.gpu_arch != 'all' && inputs.gpu_arch != '') && format('["{0}"]', inputs.gpu_arch) || '["gfx942-rocm720", "gfx950-rocm720", "gfx942-rocm724", "gfx950-rocm724"]') }}
    steps:
      - name: Download image tag artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tag-${{ matrix.gpu_arch }}

      - name: Read image tag
        run: |
          image_tag=$(tr -d '[:space:]' < "${{ matrix.gpu_arch }}.txt")
          if [ -z "${image_tag}" ]; then
            echo "::error::Image tag artifact is empty"
            exit 1
          fi
          echo "IMAGE_TAG=${image_tag}" >> $GITHUB_ENV
          echo "Resolved IMAGE_TAG=${image_tag}"

      - name: Login to Docker Hub (AMD)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

      - name: Mirror rocm/sgl-dev to local registry
        run: |
          src="rocm/sgl-dev:${{ env.IMAGE_TAG }}"
          dst="10.44.14.109:5000/rocm/sgl-dev:${{ env.IMAGE_TAG }}"
          docker pull "${src}"
          docker tag "${src}" "${dst}"
          docker push "${dst}"
