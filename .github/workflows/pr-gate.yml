on:
  workflow_call:
    inputs:
      require-label:
        description: "Opt-in tier label (run-ci-<tier>), required besides run-ci (empty = none)"
        type: string
        default: ''
      cool-down-minutes:
        description: "Cooldown period in minutes for low-permission users; 0 disables rate limiting"
        type: number
        default: 120
      approval-mode:
        description: >-
          'label' (default): the run-ci label on the PR opts it in.
          'commit' (run_ci_approval.APPROVAL_WORKFLOWS): a run passes only if the PR has
          run-ci now and, unless its author may approve, its head commit carries a ci/run-ci-approved
          status, which an approver's slash command records
          (scripts/ci/utils/run_ci_approval.py). Every push needs a new approval.
          The caller's job must grant statuses: read.
        type: string
        default: label
    outputs:
      opted-in:
        description: "'false' for a draft PR or one lacking run-ci (approval-mode commit: also an approval of its head commit, unless its author may approve) or require-label; callers skip their test jobs instead of failing"
        value: ${{ jobs.pr-gate.outputs.opted-in }}

jobs:
  pr-gate:
    # 1. for commits on main: no gating needed
    # 2. for workflow_dispatch: this can only be triggered by users with write access
    # 3. for pull_request and pull_request_target: apply the checks below.
    #    This job only reads PR metadata through the API and never checks out
    #    or executes PR code, so it is safe for pull_request_target callers.
    runs-on: ubuntu-latest
    outputs:
      opted-in: ${{ steps.skip.outcome == 'success' && 'false' || 'true' }}
    env:
      IS_PR_EVENT: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
    steps:
      - name: Fetch latest PR info
        if: env.IS_PR_EVENT == 'true'
        id: pr
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput("labels", JSON.stringify(pr.data.labels.map(l => l.name)));
            core.setOutput("draft", pr.data.draft);
            core.setOutput("user", pr.data.user.login);

      - name: Log PR info
        if: env.IS_PR_EVENT == 'true'
        run: |
          echo "===== PR Info ====="
          echo "PR Event: ${{ github.event_name }}"
          echo "PR Labels: ${{ steps.pr.outputs.labels }}"
          echo "PR Draft: ${{ steps.pr.outputs.draft }}"
          echo "PR User: ${{ steps.pr.outputs.user }}"
          echo "Require label: ${{ inputs.require-label }}"
          echo "Cool down minutes: ${{ inputs.cool-down-minutes }}"
          echo "==================="

      # 'commit' mode: the live run-ci label and, unless the author may approve, a
      # ci/run-ci-approved status on the payload's head commit.
      # run_ci_approval.is_approved is the Python twin; keep the two in step.
      - name: Check run-ci approval
        id: approval
        if: env.IS_PR_EVENT == 'true'
        uses: actions/github-script@v8
        env:
          APPROVAL_MODE: ${{ inputs.approval-mode }}
          LABELS: ${{ steps.pr.outputs.labels }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labeled = JSON.parse(process.env.LABELS).includes("run-ci");
            if (process.env.APPROVAL_MODE !== "commit") {
              core.setOutput("approved", labeled ? "true" : "false");
              return;
            }
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const author = context.payload.pull_request.user.login;
            async function authorMayApprove() {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: author });
                if (["admin", "maintain", "write"].includes(data.permission)) return true;
              } catch (e) {
                if (e.status !== 403 && e.status !== 404) throw e;
              }
              try {
                const { data } = await github.rest.repos.getContent({
                  owner, repo, path: ".github/CI_PERMISSIONS.json", ref: context.payload.repository.default_branch,
                });
                const perms = JSON.parse(Buffer.from(data.content, data.encoding).toString());
                return Boolean(perms[author] && perms[author].can_tag_run_ci_label);
              } catch (e) {
                core.warning(`Could not read CI_PERMISSIONS.json: ${e.message}`);
                return false;
              }
            }
            async function headApproved() {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner, repo, ref: sha, per_page: 100 });
              return statuses.some(s => s.context === "ci/run-ci-approved" && s.state === "success"
                && s.creator && s.creator.login === "github-actions[bot]");
            }
            const ok = labeled && (await headApproved() || await authorMayApprove());
            core.setOutput("approved", ok ? "true" : "false");
            core.info(ok ? `${sha} may run CI.`
              : !labeled ? `The PR lacks run-ci; a maintainer must comment /tag-and-rerun-ci, which adds it and approves ${sha}.`
              : `${sha} has no run-ci approval; a maintainer must approve this commit with /tag-and-rerun-ci.`);

      # Live labels: event-payload expressions do not refresh on rerun. The slash handler
      # and pr-states.yml find these runs by this step's name.
      - name: Skip tests
        id: skip
        if: >-
          env.IS_PR_EVENT == 'true' && (
            fromJson(steps.pr.outputs.draft)
            || steps.approval.outputs.approved != 'true'
            || inputs.require-label != '' && !contains(fromJson(steps.pr.outputs.labels), inputs.require-label)
          )
        env:
          REQUIRED_LABEL: ${{ inputs.require-label }}
          APPROVAL: ${{ inputs.approval-mode == 'commit' && '''run-ci'' and, unless its author may approve, a maintainer''s approval of this commit' || '''run-ci''' }}
        run: echo "::notice::Tests skipped. To run them, the PR must not be a draft and needs ${APPROVAL}${REQUIRED_LABEL:+ and '$REQUIRED_LABEL'}."

      - name: Enforce rate limit for low-permission actors (optional)
        if: env.IS_PR_EVENT == 'true' && inputs.cool-down-minutes > 0 && steps.skip.outcome != 'success'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DEFAULT_MINUTES = Number("${{ inputs.cool-down-minutes }}");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            // pr-test.yml's runs are pull_request_target, whatever workflow called the gate.
            const rateLimitEventName = "pull_request_target";
            const curRun = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId
            });
            let triggeringActor = curRun.data.triggering_actor?.login || context.actor;
            if (triggeringActor === "github-actions[bot]") {
              triggeringActor = `${{ steps.pr.outputs.user }}`;
              core.info(
                `triggering_actor is github-actions[bot]; substituting PR author '${triggeringActor}'.`
              );
            }

            async function hasHighPermission(username) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
                const perm = data.permission || 'none';
                return perm === 'write' || perm === 'maintain' || perm === 'admin';
              } catch (e) {
                if (e.status === 404 || e.status === 403) return false;
                throw e;
              }
            }

            if (await hasHighPermission(triggeringActor)) {
              core.info(`Triggering user '${triggeringActor}' has high permission. No rate limit applied.`);
              return;
            }

            let effectiveCooldownMinutes = DEFAULT_MINUTES;
            let perUserCooldownMinutes = null;

            try {
              const contentResp = await github.rest.repos.getContent({
                owner,
                repo,
                path: ".github/CI_PERMISSIONS.json",
                ref: "main",
              });

              if (!Array.isArray(contentResp.data) && contentResp.data && "content" in contentResp.data) {
                const raw = Buffer.from(
                  contentResp.data.content,
                  contentResp.data.encoding || "base64"
                ).toString();
                const ciPermissions = JSON.parse(raw);

                const userPerm = ciPermissions[triggeringActor];
                if (userPerm && typeof userPerm.cooldown_interval_minutes === "number") {
                  perUserCooldownMinutes = userPerm.cooldown_interval_minutes;
                  core.info(
                    `Per-user cooldown for '${triggeringActor}' from CI_PERMISSIONS.json: ${perUserCooldownMinutes} minutes.`
                  );
                } else {
                  core.info(`No per-user cooldown found for '${triggeringActor}' in CI_PERMISSIONS.json.`);
                }
              } else {
                core.info("CI_PERMISSIONS.json content response is not a file; skipping per-user cooldown.");
              }
            } catch (e) {
              core.info(`CI_PERMISSIONS.json not found or unreadable: ${e.message}. Using default rate limit only.`);
            }

            if (perUserCooldownMinutes !== null) {
              effectiveCooldownMinutes = Math.min(effectiveCooldownMinutes, perUserCooldownMinutes);
            }

            if (effectiveCooldownMinutes <= 0) {
              core.info(
                `Effective cooldown for '${triggeringActor}' is 0 minutes; no rate limit enforced for this user.`
              );
              return;
            }

            const cutoff = new Date(Date.now() - effectiveCooldownMinutes * 60 * 1000);
            core.info(
              `Checking for workflow runs since ${cutoff.toISOString()} (last ${effectiveCooldownMinutes} minutes) for event '${rateLimitEventName}'.`
            );

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'pr-test.yml',
              event: rateLimitEventName,
              per_page: 100,
            });

            const runs = data.workflow_runs || [];

            // Rate Limiting Logic:
            // A run passes the gate if a job beyond the gate jobs (detect-changes, check-changes,
            // pr-gate, call-gate, finish and notify) executed. A PR skipped at the gate (no run-ci)
            // must not rate-limit the user's other PRs.
            // Helper function to check if a run passed the gate (i.e., actually consumed CI resources)
            async function didRunPassGate(run) {
              try {
                // Note: Fetching up to 100 jobs (API maximum). If a workflow has >100 jobs,
                // we may miss some, but this is unlikely in practice.
                const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                  owner, repo, run_id: run.id, per_page: 100
                });
                const jobs = jobsData.jobs || [];

                // If no jobs exist yet, the run hasn't started consuming resources
                if (jobs.length === 0) {
                  core.info(`Run ${run.id} has no jobs yet; not counting against rate limit.`);
                  return false;
                }

                // Gate jobs that don't consume significant CI resources
                const gateJobs = ['detect-changes', 'check-changes', 'pr-gate', 'call-gate', 'pr-test-finish', 'notify-pr-states'];
                const jobsBeyondGate = jobs.filter(j => !gateJobs.some(g => j.name === g || j.name.startsWith(g + ' ')));

                // A job "ran" if it reached a terminal conclusion state that indicates actual execution
                const ranStates = ['success', 'failure', 'timed_out', 'action_required'];
                const hasJobsThatRan = jobsBeyondGate.some(j => j.conclusion && ranStates.includes(j.conclusion));
                return hasJobsThatRan;
              } catch (e) {
                core.warning(`Could not check jobs for run ${run.id}: ${e.message}`);

                // If it's a rate limit error, count it conservatively to prevent abuse
                if (e.status === 429) {
                  core.warning(`Hit rate limit checking run ${run.id}; counting it to be safe.`);
                  return true;
                }

                // For cancelled/skipped runs, they likely didn't consume resources
                if (run.conclusion === 'cancelled' || run.conclusion === 'skipped') {
                  return false;
                }

                // Default to counting it to prevent abuse
                return true;
              }
            }

            // Limit the number of runs we'll check in detail to avoid API rate limits
            const MAX_RUNS_TO_CHECK = 5;
            let runsChecked = 0;
            let runsSkippedAtGate = 0;
            let recentFound = null;

            for (const run of runs) {
              if (String(run.id) === String(context.runId)) continue;
              if (new Date(run.created_at) < cutoff) continue;
              const isUserRun = (run.actor?.login === triggeringActor) || (run.triggering_actor?.login === triggeringActor);
              if (!isUserRun) continue;

              runsChecked++;
              core.info(`Checking run ${run.id} (created: ${run.created_at}, conclusion: ${run.conclusion})`);

              // Safety limit: if we've checked too many runs, assume the next one passed to be conservative
              if (runsChecked > MAX_RUNS_TO_CHECK) {
                core.warning(`Checked ${MAX_RUNS_TO_CHECK} runs; assuming this one passed gate to avoid API limits.`);
                recentFound = run;
                break;
              }

              // Only count runs that actually passed the gate and consumed CI resources
              if (await didRunPassGate(run)) {
                recentFound = run;
                core.info(`Found recent run ${run.id} that passed gate.`);
                break;
              } else {
                runsSkippedAtGate++;
                core.info(`Run ${run.id} stopped at gate; not counting against rate limit.`);
              }
            }

            core.info(`Rate limit check summary: checked ${runsChecked} runs, ${runsSkippedAtGate} stopped at gate.`);

            if (recentFound) {
              core.setFailed(
                `User '${triggeringActor}' already triggered '${context.workflow}' via '${eventName}' at ${recentFound.created_at}. ` +
                `Please wait ${effectiveCooldownMinutes} minutes before triggering again.`
              );
            } else {
              core.info(
                `No recent runs detected for '${triggeringActor}' within the last ${effectiveCooldownMinutes} minutes; proceeding.`
              );
            }
