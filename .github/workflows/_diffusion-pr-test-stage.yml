name: PR Test Stage (Diffusion)

# One diffusion lane: run the `base-b-test-<runner_config>` suite on the runner
# and with the install that scripts/ci/runner_configs.yml gives runner_config.
# Called by pr-test-multimodal-gen.yml, which owns the per-lane gating.

on:
  workflow_call:
    inputs:
      runner_config:
        description: 'Key in scripts/ci/runner_configs.yml; the suite run is base-b-test-<runner_config>. Also names the lane in artifact names.'
        required: true
        type: string
      runs_on_map:
        required: true
        type: string
      sgl_kernel:
        required: true
        type: string
      continue_on_error:
        required: false
        type: string
        default: 'false'
      git_ref:
        required: false
        type: string
        default: ''
      skip_pr_test_health_check:
        required: false
        type: string
        default: 'false'
      job_timeout_minutes:
        required: true
        type: number
      run_timeout_minutes:
        required: true
        type: number
      timeout_per_file:
        required: true
        type: number
      partition_matrix:
        description: 'Matrix JSON with a `part` field; a single part 0 by default.'
        required: false
        type: string
        default: '{"include":[{"part":0}]}'
      partition_count:
        description: 'Total partitions, set together with partition_plan; empty for an unpartitioned lane.'
        required: false
        type: string
        default: ''
      partition_plan:
        required: false
        type: string
        default: ''
      pre_test_command:
        description: 'Commands run from the repo root after install, before the suite.'
        required: false
        type: string
        default: ''
      pre_test_timeout_minutes:
        required: false
        type: number
        default: 30
      retry_deadline_seconds:
        description: 'Seconds from job start after which diffusion case retries stop; 0 for none.'
        required: false
        type: number
        default: 0
      early_ld_library_path:
        description: 'Set SGLANG_CI_EARLY_LD_LIBRARY_PATH=1 for the install.'
        required: false
        type: boolean
        default: false

# Workflow-level env is NOT inherited from the caller in reusable workflows.
env:
  SGLANG_IS_IN_CI: true
  NCCL_NVLS_ENABLE: "0"
  SGLANG_CUDA_COREDUMP: "1"
  PR_TEST_BYPASS_MAINTENANCE_ON_MAIN: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
  SKIP_PR_TEST_HEALTH_CHECK: ${{ inputs.skip_pr_test_health_check == 'true' }}

jobs:
  run:
    name: ${{ inputs.runner_config }} (${{ matrix.part }})
    runs-on: ${{ fromJson(inputs.runs_on_map)[inputs.runner_config] }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.partition_matrix) }}
    steps:
      - name: Record retry deadline
        if: inputs.retry_deadline_seconds > 0
        run: echo "SGLANG_DIFFUSION_RETRY_DEADLINE=$(( $(date +%s) + ${{ inputs.retry_deadline_seconds }} ))" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Resolve runner_config
        id: rc
        run: python3 scripts/ci/runner_configs.py '${{ inputs.runner_config }}' >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/check-pr-test-health

      - uses: ./.github/actions/check-maintenance

      - name: Download artifacts (v4)
        if: inputs.sgl_kernel == 'true' && steps.rc.outputs.artifact_version == 'v4'
        uses: actions/download-artifact@v4
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.11-cuda*

      - name: Download artifacts (v6)
        if: inputs.sgl_kernel == 'true' && steps.rc.outputs.artifact_version == 'v6'
        uses: actions/download-artifact@v6
        with:
          path: python/sglang/kernels/aot/dist/
          merge-multiple: true
          pattern: wheel-python3.11-cuda*

      - name: Install dependencies
        timeout-minutes: ${{ fromJson(steps.rc.outputs.install_timeout) }}
        env:
          SGLANG_CI_EARLY_LD_LIBRARY_PATH: ${{ inputs.early_ld_library_path && '1' || '' }}
        run: |
          CUSTOM_BUILD_SGL_KERNEL=${{ inputs.sgl_kernel }} bash ${{ steps.rc.outputs.install }}

      - name: Run pre-test commands
        if: inputs.pre_test_command != ''
        timeout-minutes: ${{ inputs.pre_test_timeout_minutes }}
        run: ${{ inputs.pre_test_command }}

      - name: Run diffusion suite
        timeout-minutes: ${{ inputs.run_timeout_minutes }}
        env:
          HF_TOKEN: ${{ secrets.SGLANG_DIFFUSION_CI_HF_TOKEN || secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.SGLANG_DIFFUSION_CI_HF_TOKEN || secrets.HF_TOKEN }}
          RUNAI_STREAMER_MEMORY_LIMIT: 0
          DIFFUSION_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          # An unpartitioned lane passes empty values, which the suite bridge
          # skips. format() keeps part 0 from reading as false.
          DIFFUSION_PARTITION_ID: ${{ inputs.partition_count != '' && format('{0}', matrix.part) || '' }}
          DIFFUSION_TOTAL_PARTITIONS: ${{ inputs.partition_count }}
          DIFFUSION_PARTITION_PLAN_JSON: ${{ inputs.partition_plan }}
          SGLANG_DIFFUSION_ARTIFACT_DIR: ${{ github.workspace }}/diffusion-failures
        run: |
          python3 test/run_suite.py \
            --hw cuda \
            --suite base-b-test-${{ inputs.runner_config }} \
            --timeout-per-file ${{ inputs.timeout_per_file }}

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-report-${{ inputs.runner_config }}-${{ matrix.part }}-${{ github.run_attempt }}
          path: |
            python/sglang/multimodal_gen/test/execution_report_*.json
            python/diffusion-results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload diffusion failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-failures-${{ inputs.runner_config }}-${{ matrix.part }}-${{ github.run_attempt }}
          path: diffusion-failures/
          if-no-files-found: ignore
          retention-days: 7

      - uses: ./.github/actions/upload-cuda-coredumps
        if: failure()
        with:
          artifact-suffix: ${{ inputs.runner_config }}-${{ matrix.part }}
