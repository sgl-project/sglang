name: PR Test (Megakernel)
run-name: "Megakernel: sgl-nvidia-mega#${{ inputs.mega_pr }} ${{ inputs.mega_sha }} (${{ inputs.dispatch_id }})"

# Runs an sgl-nvidia-mega PR's end-to-end tests on reviewed per-model GPU runners.
# A maintainer starts it by adding the run-ci-sglang label to the PR in
# sgl-project/sgl-nvidia-mega, whose run-ci-sglang.yml dispatches this workflow,
# waits for this run and reports its outcome on the PR. This workflow uses no
# secrets; the run name carries dispatch_id so the caller can find this run.

on:
  workflow_dispatch:
    inputs:
      mega_repo:
        description: "Repository holding the sgl-nvidia-mega PR's head (owner/name)"
        type: string
        required: true
      mega_sha:
        description: "Full commit SHA of the PR's head"
        type: string
        required: true
      mega_pr:
        description: "sgl-nvidia-mega PR number"
        type: string
        required: true
      dispatch_id:
        description: "Caller's ID for this dispatch, shown in the run name"
        type: string
        required: true
      models:
        description: "Space-separated model names from test/e2e/ci_models.yaml; empty runs every model"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pr-test-megakernel-${{ inputs.mega_pr }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Validate inputs
        env:
          MEGA_REPO: ${{ inputs.mega_repo }}
          MEGA_SHA: ${{ inputs.mega_sha }}
          MEGA_PR: ${{ inputs.mega_pr }}
          MODELS: ${{ inputs.models }}
        run: |
          [[ "$MEGA_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "bad mega_repo: $MEGA_REPO"; exit 1; }
          [[ "$MEGA_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad mega_sha: $MEGA_SHA"; exit 1; }
          [[ "$MEGA_PR" =~ ^[0-9]+$ ]] || { echo "bad mega_pr: $MEGA_PR"; exit 1; }
          [[ "$MODELS" =~ ^[a-z0-9_\ ]*$ ]] || { echo "bad models: $MODELS"; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the sgl-nvidia-mega PR
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mega_repo }}
          ref: ${{ inputs.mega_sha }}
          path: sgl-nvidia-mega
          persist-credentials: false

      - name: Select model runners
        id: select
        env:
          MODELS: ${{ inputs.models }}
        run: |
          python3 -m pip install PyYAML
          python3 -m unittest discover -s scripts/ci -p test_megakernel_matrix.py
          read -ra models <<< "$MODELS"
          python3 scripts/ci/megakernel_matrix.py sgl-nvidia-mega/test/e2e --models "${models[@]}"

  test:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: ${{ matrix.models }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/check-maintenance

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          bash scripts/ci/cuda/ci_install_dependency.sh

      - name: Check out the sgl-nvidia-mega PR
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mega_repo }}
          ref: ${{ inputs.mega_sha }}
          path: sgl-nvidia-mega
          persist-credentials: false

      - name: Install sgl-nvidia-mega
        run: python3 -m pip install --no-deps -e ./sgl-nvidia-mega

      - name: Run end-to-end tests
        timeout-minutes: 180
        working-directory: sgl-nvidia-mega
        env:
          TESTS: ${{ matrix.tests }}
          MEGA_E2E_OUTPUT_DIR: ${{ runner.temp }}/megakernel-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          read -ra paths <<< "$TESTS"
          python3 -m pytest -v -rfE -s "${paths[@]}"

      - name: Save megakernel comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megakernel-e2e-${{ matrix.runner }}
          path: ${{ runner.temp }}/megakernel-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
