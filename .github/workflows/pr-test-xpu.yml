name: PR Test (XPU)

on:
  schedule:
    # Full run on main every 6 hours from 10:00 UTC (04/10/16/22 UTC).
    - cron: '0 4,10,16,22 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run all tests (for releasing or testing purpose)"
        required: false
        type: boolean
        default: false

concurrency:
  # Scheduled runs get a group of their own so pushes to main never cancel them.
  group: pr-test-xpu-${{ github.event_name == 'schedule' && format('schedule-{0}', github.run_id) || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && github.event_name != 'schedule' }}

jobs:
  # ==================== Check Changes ==================== #
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.filter.outputs.main_package == 'true' || steps.filter.outputs.multimodal_gen == 'true' || steps.xpu-tests.outputs.changed == 'true' || steps.run-mode.outputs.run_all_tests == 'true' }}
      main_package: ${{ steps.filter.outputs.main_package == 'true' || steps.xpu-tests.outputs.changed == 'true' || steps.run-mode.outputs.run_all_tests == 'true' }}
      multimodal_gen: ${{ steps.filter.outputs.multimodal_gen == 'true' || steps.run-mode.outputs.run_all_tests == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Determine run mode
        id: run-mode
        run: |
          # Run all tests for scheduled runs and workflow_call (when ref input is provided)
          # Note: github.event_name is inherited from caller, so we detect workflow_call by checking inputs.ref
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.run_all_tests }}" == "true" ]]; then
            echo "run_all_tests=true" >> $GITHUB_OUTPUT
            echo "Run mode: ALL TESTS (schedule=${{ github.event_name == 'schedule' }}, run_all_tests=${{ inputs.run_all_tests }})"
          else
            echo "run_all_tests=false" >> $GITHUB_OUTPUT
            echo "Run mode: FILTERED (triggered by ${{ github.event_name }})"
          fi
      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: steps.run-mode.outputs.run_all_tests != 'true'
        with:
          list-files: json
          filters: |
            # Baseline list below; any other changed test/registered/ file with a
            # per-commit register_xpu_ci is also picked up by the next step.
            registered_tests:
              - "test/registered/**/*.py"
            main_package:
              - "python/sglang/!(multimodal_gen|kernels|cli|test)/**/!(*.md)"
              - "python/sglang/test/*.py"
              - "python/sglang/test/!(ascend|observability|mock_model|manual|external_models|kernels)/**/!(*.md)"
              - "python/pyproject_xpu.toml"
              - "python/sglang/kernels/ops/speculative/@(reconstruct_tree|ngram_corpus).py"
              - "python/sglang/kernels/jit/csrc/ngram_corpus/**"
              - "test/registered/xpu/**/!(*.md)"
              - "test/registered/e2e/xpu/**/!(*.md)"
              - "test/registered/attention/test_chunk_gated_delta_rule.py"
              - "test/registered/attention/test_deterministic.py"
              - "test/registered/disaggregation/test_disaggregation_xpu.py"
              - "test/registered/kernels/ops/kvcache/test_hisparse.py"
              - "test/registered/kv_canary/test_self_unit_future_tensor.py"
              - "test/registered/kv_canary/test_self_unit_plan_input.py"
              - "test/registered/kv_canary/test_self_unit_req_to_expected_token_ids_manager.py"
              - "test/registered/kv_canary/test_self_unit_runner_swa_divergence.py"
              - "test/registered/layers/mamba/test_mamba_slot_fused.py"
              - "test/registered/unit/lora/test_moe_lora_info.py"
              - "test/registered/kernels/ops/lora/test_virtual_experts_kernels.py"
              - "test/registered/unit/layers/test_mamba_state_scatter_triton.py"
              - "test/registered/unit/managers/test_hisparse_unit.py"
              - "test/registered/unit/mem_cache/test_mamba_unittest.py"
              - "test/registered/unit/sampling/test_sampling_params.py"
              - "test/registered/unit/spec/test_adaptive_spec_params.py"
              - "test/registered/unit/spec/test_ngram_corpus.py"
              - "test/run_suite.py"
              - "test/pytest.ini"
              - ".github/workflows/pr-test-xpu.yml"
              - "docker/xpu.Dockerfile"
              - "scripts/ci/xpu/**"
            multimodal_gen:
              # Only paths imported by the 1-gpu-xpu suite; other-vendor and off-suite files are excluded.
              - "python/sglang/multimodal_gen/*.py"
              - "python/sglang/multimodal_gen/runtime/!(pipelines)/**/!(*.md|*.ipynb)"
              - "python/sglang/multimodal_gen/runtime/*.py"
              - "python/sglang/multimodal_gen/runtime/pipelines/__init__.py"
              - "python/sglang/multimodal_gen/runtime/pipelines/@(zimage_pipeline|flux_2_klein|flux_2|wan_pipeline|diffusers_pipeline).py"
              - "python/sglang/multimodal_gen/configs/**/!(*.md|*.ipynb)"
              - "python/sglang/multimodal_gen/apps/webui/**/!(*.md|*.ipynb)"
              - "python/sglang/multimodal_gen/benchmarks/compare_perf.py"
              - "python/sglang/multimodal_gen/test/*.py"
              - "python/sglang/multimodal_gen/test/runner/**/!(*.md|*.ipynb)"
              - "python/sglang/multimodal_gen/test/server/!(test_server_1_gpu_5090|test_server_4_gpu_h100|test_server_b200|test_server_2_gpu|test_request_logger).py"
              - "python/sglang/multimodal_gen/test/server/common/**/!(*.md|*.ipynb)"
              - "python/sglang/multimodal_gen/test/server/perf_baselines/xpu_b60.json"
              - "python/sglang/multimodal_gen/test/server/perf_baselines/xpu_b70.json"
              - "python/pyproject_xpu.toml"
              - ".github/workflows/pr-test-xpu.yml"
              - "docker/xpu.Dockerfile"
              - "scripts/ci/xpu/**"

      - name: Detect changed per-commit XPU tests
        id: xpu-tests
        if: steps.filter.outputs.registered_tests == 'true'
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.registered_tests_files }}
        run: echo "changed=$(python3 scripts/ci/xpu/detect_xpu_test_changes.py)" >> "$GITHUB_OUTPUT"

  # ==================== PR Gate ==================== #
  pr-gate:
    needs: check-changes
    if: needs.check-changes.outputs.changes_exist == 'true'
    uses: ./.github/workflows/pr-gate.yml
    with:
      require-label: run-ci-xpu-extra
    secrets: inherit

  # Runs the entire per-commit XPU test suite in one job (single install, single queue).
  extra-test-1-gpu-xpu:
    needs: [check-changes, pr-gate]
    if: needs.check-changes.outputs.main_package == 'true' && needs.pr-gate.outputs.opted-in != 'false'
    # Scheduled runs need the pool label and sgl-ci-post-merge.
    runs-on: ${{ github.event_name == 'schedule' && fromJSON('["intel-bmg", "sgl-ci-post-merge"]') || 'intel-bmg' }}
    env:
      # Per-job name so parallel runners on one host never touch each other's container.
      CONTAINER_NAME: ci_sglang_xpu_${{ github.run_id }}_${{ github.run_attempt }}_${{ github.job }}
      DOCKERHUB_INTEL_USERNAME: ${{ secrets.DOCKERHUB_INTEL_USERNAME }}
      DOCKERHUB_INTEL_TOKEN: ${{ secrets.DOCKERHUB_INTEL_TOKEN }}
    steps:
      - name: Reset workspace ownership
        run: |
          # Prior runs install sglang as root inside the CI container against
          # the bind-mounted workspace, leaving root-owned egg-info on the host.
          # actions/checkout's pre-clean step can't unlink those as the runner
          # user, so reset ownership before checkout runs.
          docker run --rm -v "${{ github.workspace }}:/w" busybox:latest \
            chown -R "$(id -u):$(id -g)" /w || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Start CI container
        run: |
          export HF_TOKEN="$(cat ~/huggingface_token.txt)"
          bash scripts/ci/xpu/xpu_ci_start_container.sh --container-name "${CONTAINER_NAME}"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install Dependency
        timeout-minutes: 60
        run: |
          # Bridge fix: install libssl-dev in the running container so the
          # JIT build of hicache_hash_cpp (needs <openssl/sha.h>) succeeds.
          # Can be dropped once intel/sglang-dev:latest is rebuilt from a
          # docker/xpu.Dockerfile that already ships libssl-dev.
          docker exec -e DEBIAN_FRONTEND=noninteractive "${CONTAINER_NAME}" apt-get update
          docker exec -e DEBIAN_FRONTEND=noninteractive "${CONTAINER_NAME}" apt-get install -y libssl-dev
          # Pin the image's torch so test deps (e.g. lmcache) cannot swap in a CUDA build.
          docker exec "${CONTAINER_NAME}" bash -c "uv pip freeze --python /opt/venv/bin/python3 | grep -iE '^(torch|torchvision|torchaudio|triton-xpu)==' > /tmp/image-pins.txt"
          docker exec "${CONTAINER_NAME}" uv pip install --python /opt/venv/bin/python3 -c /tmp/image-pins.txt pytest expecttest ray huggingface_hub tabulate "lmcache>=0.3.9" accelerate
          docker exec "${CONTAINER_NAME}" uv pip uninstall --python /opt/venv/bin/python3 flashinfer-python sgl-kernel sglang
          docker exec "${CONTAINER_NAME}" cp /sglang-checkout/python/pyproject_xpu.toml /sglang-checkout/python/pyproject.toml
          # Fetch tags so setuptools_scm resolves a real version instead of
          # falling back to 0.0.0 on a shallow/tag-less checkout.
          docker exec -w /sglang-checkout "${CONTAINER_NAME}" git fetch origin '+refs/tags/*:refs/tags/*' --force
          docker exec -w /sglang-checkout/python "${CONTAINER_NAME}" uv pip install --python /opt/venv/bin/python3 --no-cache .
          docker exec "${CONTAINER_NAME}" uv pip install --python /opt/venv/bin/python3 --no-cache --no-deps xgrammar==0.1.33
          docker exec "${CONTAINER_NAME}" /bin/bash -c '/opt/venv/bin/hf auth login --token ${HF_TOKEN}'

      - name: Install checkpoint-engine extra (optional; tests skip if unavailable)
        continue-on-error: true
        run: |
          docker exec -w /sglang-checkout/python "${CONTAINER_NAME}" uv pip install --python /opt/venv/bin/python3 --no-cache ".[checkpoint-engine]"

      - name: Run tests
        # Old stage-a (30) + stage-b (120) = 150; +20% headroom for --enable-retry.
        timeout-minutes: 180
        env:
          # Files that intermittently hang silently on XPU; fail fast so --enable-retry reruns them.
          XPU_TIMEOUT_OVERRIDES: >-
            --timeout-override xpu/test_xpu_basic.py=180
            --timeout-override xpu/test_layernorm_xpu.py=120
            --timeout-override xpu/test_intel_xpu_backend.py=360
            --timeout-override e2e/xpu/test_xpu_fp8_linear.py=240
            --timeout-override kv_canary/test_self_unit_req_to_expected_token_ids_manager.py=120
            --timeout-override kv_canary/test_self_unit_plan_input.py=120
            --timeout-override kernels/ops/kvcache/test_hisparse.py=120
        run: |
          docker exec -e SGLANG_IS_IN_CI=true "${CONTAINER_NAME}" bash -c "source /opt/venv/bin/activate && cd /sglang-checkout/test && python3 run_suite.py --hw xpu --suite extra-test-1-gpu-xpu --timeout-per-file 600 --retry-timeout-increase 0 --enable-retry ${XPU_TIMEOUT_OVERRIDES} ${{ github.event_name == 'schedule' && '--continue-on-error' || '' }}"

      - name: Cleanup container
        if: always()
        run: |
          # pip install ran as root inside the container against the
          # bind-mounted workspace, so build artifacts are root-owned on
          # the host. Chown them back before rm to avoid Permission denied.
          docker run --rm -v "${{ github.workspace }}:/w" busybox:latest \
            chown -R "$(id -u):$(id -g)" /w || true
          # Wipe everything the run wrote into the workspace so the next
          # job starts from a clean tree.
          rm -rf \
            python/build \
            python/dist \
            python/sglang.egg-info \
            python/sglang/*.egg-info \
            test/result.jsonl \
            test/results \
            test/.pytest_cache \
            .pytest_cache || true
          find . -type d -name "__pycache__" -prune -exec rm -rf {} + || true
          find . -type f -name "*.pyc" -delete || true
          # SIGTERM sglang and drain GPU context before `docker rm -f`;
          # SIGKILL leaves the xe/GuC exec queue registered and triggers a
          # GT reset (+ devcoredump) on B580.
          if docker ps --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
            docker exec "${CONTAINER_NAME}" bash -c '
              pkill -TERM -f "sglang|run_suite|python3.*test_" 2>/dev/null || true
              for _ in $(seq 1 30); do
                pgrep -f "sglang::|sglang.launch_server" >/dev/null || break
                sleep 1
              done
              pkill -KILL -f "sglang|run_suite" 2>/dev/null || true
            ' || true
          fi
          docker rm -f "${CONTAINER_NAME}" || true
          if [[ -n "${CI_SGLANG_XPU_IMAGE:-}" ]]; then
            docker rmi -f "${CI_SGLANG_XPU_IMAGE}" || true
          fi

  # ==================== Multimodal Gen ==================== #
  multimodal-gen-test-1-gpu-xpu:
    needs: [check-changes, pr-gate]
    if: needs.check-changes.outputs.multimodal_gen == 'true' && needs.pr-gate.outputs.opted-in != 'false'
    # Scheduled runs need the pool label and sgl-ci-post-merge.
    runs-on: ${{ github.event_name == 'schedule' && fromJSON('["bmg-multigen-models", "sgl-ci-post-merge"]') || 'bmg-multigen-models' }}
    env:
      # Per-job name so parallel runners on one host never touch each other's container.
      CONTAINER_NAME: ci_sglang_xpu_${{ github.run_id }}_${{ github.run_attempt }}_${{ github.job }}
      DOCKERHUB_INTEL_USERNAME: ${{ secrets.DOCKERHUB_INTEL_USERNAME }}
      DOCKERHUB_INTEL_TOKEN: ${{ secrets.DOCKERHUB_INTEL_TOKEN }}
    steps:
      - name: Reset workspace ownership
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" busybox:latest \
            chown -R "$(id -u):$(id -g)" /w || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Start CI container
        run: |
          export HF_TOKEN="$(cat ~/huggingface_token.txt)"
          bash scripts/ci/xpu/xpu_ci_start_container.sh --container-name "${CONTAINER_NAME}"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install Dependency
        timeout-minutes: 60
        run: |
          # Bridge fix: install libssl-dev in the running container so the
          # JIT build of hicache_hash_cpp (needs <openssl/sha.h>) succeeds.
          # Can be dropped once intel/sglang-dev:latest is rebuilt from a
          # docker/xpu.Dockerfile that already ships libssl-dev.
          docker exec -e DEBIAN_FRONTEND=noninteractive "${CONTAINER_NAME}" apt-get update
          docker exec -e DEBIAN_FRONTEND=noninteractive "${CONTAINER_NAME}" apt-get install -y libssl-dev
          # Pin the image's torch so test deps (e.g. lmcache) cannot swap in a CUDA build.
          docker exec "${CONTAINER_NAME}" bash -c "uv pip freeze --python /opt/venv/bin/python3 | grep -iE '^(torch|torchvision|torchaudio|triton-xpu)==' > /tmp/image-pins.txt"
          docker exec "${CONTAINER_NAME}" uv pip install --python /opt/venv/bin/python3 -c /tmp/image-pins.txt pytest expecttest ray huggingface_hub tabulate "lmcache>=0.3.9"
          docker exec "${CONTAINER_NAME}" uv pip uninstall --python /opt/venv/bin/python3 flashinfer-python sgl-kernel sglang
          docker exec "${CONTAINER_NAME}" cp /sglang-checkout/python/pyproject_xpu.toml /sglang-checkout/python/pyproject.toml
          # Fetch tags so setuptools_scm resolves a real version instead of
          # falling back to 0.0.0 on a shallow/tag-less checkout.
          docker exec -w /sglang-checkout "${CONTAINER_NAME}" git fetch origin '+refs/tags/*:refs/tags/*' --force
          docker exec -w /sglang-checkout/python "${CONTAINER_NAME}" uv pip install --python /opt/venv/bin/python3 --no-cache .
          docker exec "${CONTAINER_NAME}" uv pip install --python /opt/venv/bin/python3 --no-cache --no-deps xgrammar==0.1.33
          docker exec "${CONTAINER_NAME}" /bin/bash -c '/opt/venv/bin/hf auth login --token ${HF_TOKEN}'

      - name: Run diffusion server tests (1-GPU)
        timeout-minutes: 60
        run: |
          # xpu_b60.json is seeded with this flag on; without it the SYCL queue
          # is deep enough that step timings record host enqueue, not device time.
          docker exec -e SGLANG_IS_IN_CI=true -e SGLANG_DIFFUSION_SYNC_STAGE_PROFILING=1 "${CONTAINER_NAME}" bash -c "source /opt/venv/bin/activate && cd /sglang-checkout/python && python3 sglang/multimodal_gen/test/run_suite.py --suite 1-gpu-xpu ${{ github.event_name == 'schedule' && '--continue-on-error' || '' }}"

      - name: Cleanup container
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" busybox:latest \
            chown -R "$(id -u):$(id -g)" /w || true
          rm -rf \
            python/build \
            python/dist \
            python/sglang.egg-info \
            python/sglang/*.egg-info \
            test/result.jsonl \
            test/results \
            test/.pytest_cache \
            .pytest_cache || true
          find . -type d -name "__pycache__" -prune -exec rm -rf {} + || true
          find . -type f -name "*.pyc" -delete || true
          # SIGTERM sglang and drain GPU context before `docker rm -f`;
          # SIGKILL leaves the xe/GuC exec queue registered and triggers a
          # GT reset (+ devcoredump) on B580.
          if docker ps --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
            docker exec "${CONTAINER_NAME}" bash -c '
              pkill -TERM -f "sglang|run_suite|python3.*test_" 2>/dev/null || true
              for _ in $(seq 1 30); do
                pgrep -f "sglang::|sglang.launch_server" >/dev/null || break
                sleep 1
              done
              pkill -KILL -f "sglang|run_suite" 2>/dev/null || true
            ' || true
          fi
          docker rm -f "${CONTAINER_NAME}" || true
          if [[ -n "${CI_SGLANG_XPU_IMAGE:-}" ]]; then
            docker rmi -f "${CI_SGLANG_XPU_IMAGE}" || true
          fi

  finish:
    if: always() && needs.pr-gate.outputs.opted-in != 'false'
    needs: [extra-test-1-gpu-xpu, multimodal-gen-test-1-gpu-xpu, pr-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS_JSON"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$NEEDS_JSON" >/dev/null; then
            echo "::error::A dependent job failed or was cancelled."
            exit 1
          fi
