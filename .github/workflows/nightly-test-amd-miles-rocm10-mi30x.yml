name: Nightly Test Miles (AMD ROCm 10 MI30X)

on:
  schedule:
    # Runs after the 12:00 UTC miles image build has pushed the dated image,
    # and after the 17:30 UTC sglang MI300 nightly has claimed its runners.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override miles image tag (e.g. miles-rocm10-mi30x-20260930); empty = newest by date"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue on error (do not fail the workflow on test failures)"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  test-miles-mi30x:
    if: github.repository == 'sgl-project/sglang'
    strategy:
      fail-fast: false
      matrix:
        # Miles registers its ROCm nightly suites under the MI350 names; run the same suites on MI300.
        # skip_tests: files left out on MI300, which they cannot run on or do not finish on.
        include:
          - suite: nightly-stage-c-2-gpu-mi350
            runner: linux-mi300-2gpu-sglang
            timeout: 180
            # Single-request decode of Qwen3.8-27B-FP8 runs at ~20 tok/s on MI300X, so long
            # generations outlast the test client's 180 s request timeout.
            skip_tests: tests/e2e/sglang/test_session_server_multi_role/test_qwen38small.py
          # The 4-GPU suite takes ~155 min on MI355X and over 180 min on MI300X.
          - suite: nightly-stage-c-4-gpu-mi350
            runner: linux-mi300-4gpu-sglang
            timeout: 300
            # Its tilelang indexer kernel needs 98 KiB of LDS per block; gfx942 has 64 KiB.
            skip_tests: tests/e2e/megatron/model_scripts/test_glm5_2_744b_a40b_5layer_ci.py
          - suite: nightly-stage-c-8-gpu-mi350
            runner: linux-mi300-8gpu-sglang
            timeout: 180
            skip_tests: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub (AMD)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

      - name: Resolve newest miles ROCm 10 MI30X image
        run: |
          repo="rocm/sgl-dev"
          base="miles-rocm10-mi30x"
          tag="${{ inputs.image_tag }}"
          if [ -z "${tag}" ]; then
            # Walk back from today; the build job pushes a dated tag at 12:00 UTC.
            # Probe with `manifest inspect` so we don't pull a multi-GB image just
            # to test existence; the real pull happens in amd_ci_start_container.sh.
            for i in $(seq 0 6); do
              d=$(date -u -d "-${i} day" +%Y%m%d)
              candidate="${base}-${d}"
              if docker manifest inspect "${repo}:${candidate}" >/dev/null 2>&1; then
                tag="${candidate}"
                break
              fi
            done
          fi
          if [ -z "${tag}" ]; then
            echo "::error::No ${repo}:${base}-<date> image found on Docker Hub for the last 7 days"
            exit 1
          fi
          echo "MILES_IMAGE=${repo}:${tag}" >> "$GITHUB_ENV"
          echo "Using miles image: ${repo}:${tag}"

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start container from the miles image
        run: bash scripts/ci/amd/amd_ci_start_container.sh --custom-image "${MILES_IMAGE}"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Skip tests left out on MI300
        if: matrix.skip_tests != ''
        run: bash scripts/ci/amd/amd_ci_exec.sh -w /root/miles rm -v ${{ matrix.skip_tests }}

      - name: Run miles CI suite ${{ matrix.suite }}
        timeout-minutes: ${{ matrix.timeout }}
        run: |
          touch "${GITHUB_WORKSPACE}/github_summary.md"
          TEST_EXIT_CODE=0
          bash scripts/ci/amd/amd_ci_exec.sh -w /root/miles \
            -e PYTHONPATH=/root/miles:/opt/tilelang \
            -e GITHUB_STEP_SUMMARY=/sglang-checkout/github_summary.md \
            python3 tests/ci/run_suite.py --hw rocm --suite ${{ matrix.suite }} --cadence nightly \
            ${{ (github.event_name != 'workflow_dispatch' || inputs.continue_on_error) && '--continue-on-error' || '' }} || TEST_EXIT_CODE=$?
          cat "${GITHUB_WORKSPACE}/github_summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit ${TEST_EXIT_CODE}
