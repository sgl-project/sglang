          name: ppu-perf-k8s-minimax2.7-fp8-channelwise-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      # Reached only when the third attempt was reset too, because a skipped step
      # has outcome 'skipped' rather than 'failure'. Best effort itself: saying
      # that nothing arrived must not be the thing that turns this job red.
      - name: Report the lost Perf evidence
        if: always() && steps.upload_evidence_3.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          ENTRY: minimax2.7-fp8-channelwise
          PERF_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/perf-results/minimax2.7-fp8-channelwise
        run: bash scripts/ci/ppu/report_lost_perf_artifact.sh

  # ============================================== the trend series ===============================================
  # Move the rows the entries above already wrote onto the nightly-test-data
  # branch. Nothing is measured, judged or recomputed here: write_report_files put
  # a trend.jsonl next to each report, and this job only files those bytes where
  # they outlive the thirty-day artifact retention that would otherwise erase the
  # series. The other perf workflows carry the same job and refer back to this note.
  #
  # `always()`, and every entry in `needs`, because a night that could not measure
  # is a point in the series too: a failed measurement is filed with null metrics
  # and its reason code, and dropping it would leave a gap indistinguishable from a
  # night on which nothing was scheduled.
  #
  # This is the only job in the file granted write. The workflow-level grant stays
  # read-only, so nothing that launches a server or runs a benchmark can push, and
  # the write is confined to a job that touches no model and no board.
  #
  # A caller matters here: a `workflow_call` invocation cannot be granted more than
  # its caller holds, so whoever eventually wires this workflow into a parent has to
  # grant `contents: write` and `actions: read` there as well, or this job will run
  # with the read-only default and every push will 403.

  publish-trend-rows:
    name: 归档趋势原始行（CPU）
    needs: [glm52-fp8chan-4k, glm52-fp8chan-64k, kimi26-mxfp4, kimi26-w4a8, glm52-mxfp4-4k, glm52-mxfp4-64k, qwen35-mxfp4, qwen35-fp8chan, minimax27-mxfp4, minimax27-fp8chan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    env:
      TREND_TOOL_SHA: ${{ vars.PPU_TREND_TOOL_SHA }}
    steps:
      - name: 校验维护者配置的工具版本
        id: tool-version
        shell: bash
        run: |
          if [[ ! "$TREND_TOOL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::必须配置PPU_TREND_TOOL_SHA为已审核工具的完整commit SHA'
            exit 1
          fi
          printf 'TREND_OUTPUT_DIR=%s/trend-publication\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout the publishing script
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TREND_TOOL_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: source
      - name: 核验工具checkout身份
        id: trusted
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$TREND_TOOL_SHA"
      - name: Checkout the data branch
        uses: actions/checkout@v4
        with:
          ref: nightly-test-data
          fetch-depth: 0
          path: series
      - name: Download this run's reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ppu-perf-k8s-[a-z]*-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - name: File the rows on the data branch
        if: steps.download.outcome == 'success'
        shell: bash
        working-directory: series
        env:
          INCOMING_DIR: ../incoming
        run: bash ../source/scripts/ci/ppu/publish_trend_rows.sh
      - name: Account for the reports that did not arrive
        if: ${{ !cancelled() && steps.trusted.outcome == 'success' }}
        shell: bash
        env:
          INCOMING_DIR: incoming
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          mkdir -p "$TREND_OUTPUT_DIR"
          python3 source/scripts/ci/ppu/account_for_trend_reports.py | tee "$TREND_OUTPUT_DIR/accounting.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: 保存发布状态与对账
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-trend-rows-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trend-publication/
          if-no-files-found: warn
          retention-days: 30
