name: Nightly Benchmark (AMD)

# Serving benchmarks on MI35x against sglang main, reported rather than gated.
# Each point holds a whole perf-bench node so nothing shares it while it is
# measured. The runner sits on the cluster's login node and submits one job per
# point through scripts/ci/slurm/launch_amd_ci_mi35x.sh; cluster settings come
# from the runner's environment (see the launcher's header).
#
# - DeepSeek-V4.1-Flash: InferenceX's AgentX curve. The points must be the
#   matrix row of the test's INFERENCEX_COMMIT.
# - Qwen3.5 MXFP4 + MTP: the AgentX coding-agent replay and eval, with sglang's
#   own replay harness.
on:
  schedule:
    # With PR Test (AMD)'s rocm10 run, after the rocm10 MI35x image lands
    # (about 12:00 UTC).
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to benchmark. Defaults to the default branch.'
        required: false
        type: string
        default: ''
      benchmark_select:
        description: 'Select a benchmark to run from dropdown (choose "all" to run all benchmarks)'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - dsv41-flash-agentx-mi35x
          - qwen35-mxfp4-agentic-mtp-mi35x
      point:
        description: 'DeepSeek-V4.1-Flash point to run'
        required: false
        default: 'all'
        type: choice
        options: [all, tp2-c1, tp2-c2, tp2-c4, tp2-c8, tp2-c16, tp2-c32, tp4-c1, tp4-c2, tp4-c4, tp4-c8, tp4-c16, tp2-dpa-c32, tp2-dpa-c64]
      rocm_version:
        description: 'ROCm image version for the Qwen3.5 benchmark ("all" runs rocm10, rocm724, and rocm720)'
        required: false
        type: choice
        default: 'rocm10'
        options:
          - rocm10
          - rocm724
          - rocm720
          - 'all'
      workload_env:
        description: 'Optional Qwen3.5 workload overrides, space separated (e.g. "AGENTIC_NUM_CONVERSATIONS=128 AGENTIC_MAX_TURNS=20")'
        required: false
        type: string
        default: ''
      continue_on_error:
        description: 'Keep running the remaining Qwen3.5 benchmarks after one fails'
        required: false
        type: boolean
        default: true

# sbatch exports the launcher's environment to the cluster job, where
# amd_ci_start_container.sh logs in to Docker Hub. HF_TOKEN comes from the
# runner's .env; do not set it here, since even an empty value overrides it.
env:
  DOCKERHUB_AMD_USERNAME: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
  DOCKERHUB_AMD_TOKEN: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

concurrency:
  # Never cancel a run in flight: a cancelled point leaves no number behind.
  group: nightly-benchmark-amd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dsv41-flash-agentx-mi35x:
    name: dsv41-flash-agentx-mi35x ${{ matrix.point }}
    if: github.repository == 'sgl-project/sglang' && (!inputs.benchmark_select || inputs.benchmark_select == 'all' || inputs.benchmark_select == 'dsv41-flash-agentx-mi35x')
    strategy:
      fail-fast: false
      matrix:
        point: ${{ fromJson(inputs.point && inputs.point != 'all' && format('["{0}"]', inputs.point) || '["tp2-c1", "tp2-c2", "tp2-c4", "tp2-c8", "tp2-c16", "tp2-c32", "tp4-c1", "tp4-c2", "tp4-c4", "tp4-c8", "tp4-c16", "tp2-dpa-c32", "tp2-dpa-c64"]') }}
    runs-on: linux-sglang-mi35x-perf-bench
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # Model load, up to an hour of AgentX warmup and the one-hour window.
      - name: Run point on a cluster node
        timeout-minutes: 350
        env:
          AGENTX_POINT: ${{ matrix.point }}
          MATRIX_CONFIG_NAME: ${{ matrix.point }}
          TIME_LIMIT: '05:00:00'
        run: |
          bash scripts/ci/slurm/launch_amd_ci_mi35x.sh \
            --suite nightly-perf-8-gpu-mi35x-dsv41-flash-agentx \
            --env "AGENTX_POINT=$AGENTX_POINT" \
            -- --nightly --timeout-per-file 16800

      - name: Summarize
        if: always()
        run: cat ci_artifacts/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentx-dsv41flash-${{ matrix.point }}
          path: ci_artifacts/*.json
          if-no-files-found: ignore
          retention-days: 90
          # A re-run attempt replaces the earlier attempt's result.
          overwrite: true

      - name: Cancel cluster jobs on failure/cancel
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          # Same prefix launch_amd_ci_mi35x.sh names its jobs with. %200j widens
          # the name column; Spur's squeue does not accept --me.
          PREFIX="amd-ci-${RUNNER_NAME}-${GITHUB_RUN_ID}-"
          JOBS=$(squeue --noheader --format="%i %200j" | grep -F "$PREFIX" | awk '{print $1}' || true)
          if [ -n "$JOBS" ]; then
            echo "Cancelling: $JOBS"
            scancel $JOBS
          fi

  # ==============================================================================
  # Qwen3.5-397B-A17B MXFP4 + EAGLE MTP, AgentX coding-agent replay and eval
  # ==============================================================================
  qwen35-mxfp4-agentic-mtp-mi35x:
    name: ${{ format('qwen35-mxfp4-agentic-mtp-mi35x {0} ({1})', matrix.point.name, matrix.rocm_version) }}
    strategy:
      fail-fast: false
      matrix:
        # One image per run by default -- the schedule measures the current
        # ROCm lane, and sweeping three of them would hold the nodes for hours
        # to produce three sets of numbers nobody compares.
        rocm_version: ${{ fromJson(inputs.rocm_version == 'all' && '["rocm10", "rocm724", "rocm720"]' || format('["{0}"]', inputs.rocm_version || 'rocm10')) }}
        # The recipe's own tp2 sweep, plus its eval pass. Each point holds a
        # whole 8-GPU node, so the recipe's tp4 points can be added here
        # without a different runner.
        point:
          - { name: tp2-gpu-kv-c1, tp: 2, concurrency: 1, kv_offloading: none, mode: replay }
          - { name: tp2-gpu-kv-c4, tp: 2, concurrency: 4, kv_offloading: none, mode: replay }
          - { name: tp2-gpu-kv-c8, tp: 2, concurrency: 8, kv_offloading: none, mode: replay }
          - { name: tp2-gpu-kv-c12, tp: 2, concurrency: 12, kv_offloading: none, mode: replay }
          - { name: tp2-gpu-kv-c16, tp: 2, concurrency: 16, kv_offloading: none, mode: replay }
          - { name: tp2-gpu-kv-c20, tp: 2, concurrency: 20, kv_offloading: none, mode: replay }
          - { name: tp2-hicache-c20, tp: 2, concurrency: 20, kv_offloading: hicache, mode: replay }
          - { name: tp2-hicache-c24, tp: 2, concurrency: 24, kv_offloading: hicache, mode: replay }
          - { name: tp2-hicache-c28, tp: 2, concurrency: 28, kv_offloading: hicache, mode: replay }
          - { name: tp2-hicache-c32, tp: 2, concurrency: 32, kv_offloading: hicache, mode: replay }
          # AgentX scores one configuration rather than the whole sweep: the top
          # of the HiCache row, which is c32 at tp2.
          - { name: tp2-eval-gsm8k, tp: 2, concurrency: 32, kv_offloading: hicache, mode: eval }
    if: github.repository == 'sgl-project/sglang' && (!inputs.benchmark_select || inputs.benchmark_select == 'all' || inputs.benchmark_select == 'qwen35-mxfp4-agentic-mtp-mi35x')
    runs-on: linux-sglang-mi35x-perf-bench
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # A replay point converts the published AgentX corpus on first use and
      # caches it under the node's persistent /sgl-data alongside the weights,
      # so only the first run on each node pays for the download.
      - name: Qwen3.5-MXFP4 agentic MTP (${{ matrix.point.name }})
        timeout-minutes: 290
        env:
          WORKLOAD_ENV: ${{ inputs.workload_env }}
          MATRIX_CONFIG_NAME: ${{ matrix.point.name }}-${{ matrix.rocm_version }}
          # Cluster time limit for one point, under the step timeout.
          TIME_LIMIT: '04:30:00'
        run: |
          ENV_ARGS=()
          for override in $WORKLOAD_ENV; do
            ENV_ARGS+=(--env "$override")
          done
          bash scripts/ci/slurm/launch_amd_ci_mi35x.sh \
            --suite nightly-perf-mi35x-qwen35-mxfp4-agentic-mtp \
            --rocm-version "${{ matrix.rocm_version }}" \
            --gpus 8 \
            --env SGLANG_MOE_COPY_WEIGHT_VIEWS_BEFORE_H2D=1 \
            --env AGENTIC_TP=${{ matrix.point.tp }} \
            --env AGENTIC_CONCURRENCY=${{ matrix.point.concurrency }} \
            --env AGENTIC_KV_OFFLOADING=${{ matrix.point.kv_offloading }} \
            --env AGENTIC_MODE=${{ matrix.point.mode }} \
            "${ENV_ARGS[@]}" \
            -- --nightly --timeout-per-file 12600 ${{ (github.event_name == 'schedule' || inputs.continue_on_error) && '--continue-on-error' || '' }}

      - name: Cancel cluster jobs on failure/cancel
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          # Same prefix launch_amd_ci_mi35x.sh names its jobs with. %200j widens
          # the name column; Spur's squeue does not accept --me.
          PREFIX="amd-ci-${RUNNER_NAME}-${GITHUB_RUN_ID}-"
          JOBS=$(squeue --noheader --format="%i %200j" | grep -F "$PREFIX" | awk '{print $1}' || true)
          if [ -n "$JOBS" ]; then
            echo "Cancelling: $JOBS"
            scancel $JOBS
          fi

  # One JSON list of the points' records per run, read by the sglang-ci-bot daily report.
  dsv41-flash-agentx-summary:
    needs: dsv41-flash-agentx-mi35x
    if: always() && github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-latest
    steps:
      # A night on which no point got as far as a result still writes an empty
      # list. The pattern stops at the point so the summary itself is not merged
      # back in on a re-run.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: agentx-dsv41flash-tp*
          path: points
          merge-multiple: true

      - name: Merge points
        run: |
          shopt -s nullglob
          files=(points/*.json)
          if (( ${#files[@]} )); then
            jq -s 'sort_by(.point)' "${files[@]}" > agentx-dsv41flash-summary.json
          else
            echo '[]' > agentx-dsv41flash-summary.json
          fi
          echo "Merged ${#files[@]} points"

      - uses: actions/upload-artifact@v4
        with:
          name: agentx-dsv41flash-summary
          path: agentx-dsv41flash-summary.json
          retention-days: 90
          overwrite: true
