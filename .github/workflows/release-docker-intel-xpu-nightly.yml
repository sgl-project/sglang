name: Release Docker Images Nightly (Intel XPU)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build from, e.g. main, release/v0.5.20, v0.5.20.'
        required: false
        default: 'main'
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || 'main' }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'sgl-project/sglang'
    runs-on: intel-bmg
    environment: 'prod'
    strategy:
      fail-fast: false
      matrix:
        # wheel: prebuilt sglang-kernel-xpu pinned in pyproject_xpu.toml (feeds CI via :latest).
        # main: sgl-kernel-xpu built from source at its main branch.
        kernel: [wheel, main]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Scheduled runs always build main; manual runs may pick a release branch or tag.
          ref: ${{ inputs.branch || 'main' }}
          path: sglang-nightly-build
          fetch-depth: 0

      - name: Set date and commit hash
        id: image_meta
        env:
          SG_LANG_BRANCH: ${{ inputs.branch || 'main' }}
          KERNEL_VARIANT: ${{ matrix.kernel }}
        run: |
          cd sglang-nightly-build
          date_tag=$(date +%Y%m%d)
          commit_hash=$(git rev-parse --short=7 HEAD)
          if [ -z "${commit_hash}" ]; then
            echo "::error::Could not resolve commit hash"
            exit 1
          fi
          if [ "${SG_LANG_BRANCH}" = "main" ]; then
            image_tag="nightly-dev-xpu-bmg-${date_tag}-${commit_hash}"
          else
            # Slugify the ref so it is usable in a Docker tag (e.g. release/v0.5.20 -> release-v0.5.20).
            branch_slug=$(echo "${SG_LANG_BRANCH}" | sed 's#[^a-zA-Z0-9._-]#-#g')
            image_tag="nightly-dev-xpu-bmg-${branch_slug}-${date_tag}-${commit_hash}"
          fi
          if [ "${KERNEL_VARIANT}" = "wheel" ]; then
            kernel_source=wheel
            kernel_ref=main
            latest_tag=latest
          else
            # Pin the kernel commit so the tag names exactly what was built.
            kernel_ref=$(git ls-remote https://github.com/sgl-project/sgl-kernel-xpu.git refs/heads/main | cut -f1)
            if [ -z "${kernel_ref}" ]; then
              echo "::error::Could not resolve sgl-kernel-xpu main"
              exit 1
            fi
            kernel_source=source
            latest_tag=latest-kernel-main
            image_tag="${image_tag}-kernel-main-${kernel_ref:0:7}"
          fi
          echo "DATE=${date_tag}" >> $GITHUB_ENV
          echo "commit_hash=${commit_hash}" >> $GITHUB_OUTPUT
          echo "SG_LANG_BRANCH=${SG_LANG_BRANCH}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${image_tag}" >> $GITHUB_ENV
          echo "LATEST_TAG=${latest_tag}" >> $GITHUB_ENV
          echo "KERNEL_SOURCE=${kernel_source}" >> $GITHUB_ENV
          echo "KERNEL_REF=${kernel_ref}" >> $GITHUB_ENV
          echo "Building ref ${SG_LANG_BRANCH} at ${commit_hash} (kernel: ${KERNEL_VARIANT})"
          echo "Image tag: ${image_tag}"

      - name: Login to Docker Hub (Intel)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_INTEL_USERNAME }}
          password: ${{ secrets.DOCKERHUB_INTEL_TOKEN }}

      - name: Build intel/sglang-dev
        run: |
          echo "Building intel/sglang-dev:${IMAGE_TAG} from ${SG_LANG_BRANCH} (kernel: ${KERNEL_SOURCE} ${KERNEL_REF})"
          # Only main advances the rolling tag (`latest` for wheel, `latest-kernel-main` for source).
          latest_tag=()
          if [ "${SG_LANG_BRANCH}" = "main" ]; then
            latest_tag=(-t "intel/sglang-dev:${LATEST_TAG}")
          fi
          docker build sglang-nightly-build \
            -f sglang-nightly-build/docker/xpu.Dockerfile \
            --build-arg SG_LANG_REPO=https://github.com/sgl-project/sglang.git \
            --build-arg SG_LANG_BRANCH="${SG_LANG_BRANCH}" \
            --build-arg SG_LANG_KERNEL_REPO=https://github.com/sgl-project/sgl-kernel-xpu.git \
            --build-arg SG_LANG_KERNEL_BRANCH="${KERNEL_REF}" \
            --build-arg SG_LANG_KERNEL_SOURCE="${KERNEL_SOURCE}" \
            --no-cache --progress=plain \
            -t "intel/sglang-dev:${IMAGE_TAG}" \
            "${latest_tag[@]}"

      - name: Push intel/sglang-dev
        run: |
          push_with_retry() {
            for i in 1 2 3 4 5; do
              docker push "$1" && return 0
              echo "push failed (attempt $i), retrying in $((i*15))s..."
              sleep $((i*15))
            done
            return 1
          }
          push_with_retry "intel/sglang-dev:${IMAGE_TAG}"
          if [ "${SG_LANG_BRANCH}" = "main" ]; then
            push_with_retry "intel/sglang-dev:${LATEST_TAG}"
          fi
