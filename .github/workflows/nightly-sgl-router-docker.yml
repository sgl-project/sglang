name: Nightly sgl-router Docker Image

# Builds lmsysorg/sgl-router:nightly from main every night. Versioned
# releases (`router-v*` tags) go through release-sgl-router-docker.yml; both
# share the multi-arch build in _sgl-router-docker.yml.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'sgl-project/sglang'
    uses: ./.github/workflows/_sgl-router-docker.yml
    with:
      image_repo: lmsysorg/sgl-router
      tags: nightly
    secrets: inherit
