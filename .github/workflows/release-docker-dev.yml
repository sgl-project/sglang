name: Build and Push Development Docker Images

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build from (leave empty to use current branch)"
        required: false
        default: ""
      tag:
        description: "Custom tag suffix"
        required: false
        default: ""
      image_repo:
        description: "Docker Hub repo to push to. Use lmsysorg/sglang-staging for testing."
        required: false
        default: "lmsysorg/sglang"
      build_only:
        description: "Build and validate one Linux AMD64 CUDA 13 image locally on the runner without logging in or pushing."
        required: false
        type: boolean
        default: false
      overlay_dockerfile:
        description: "Optional extra Dockerfile lines appended after FROM <base> to build a layered image (e.g. 'RUN pip install ...'). Note: this job has no repo checkout, so only FROM + RUN work — you cannot COPY files from this repo. Leave empty to skip overlay."
        required: false
        default: ""
      overlay_cudas:
        description: "Comma-separated cuda variants to overlay onto (cu12, cu13). Default 'cu13'."
        required: false
        default: "cu13"
      overlay_tag_suffix:
        description: "Overlay output suffix appended to the base tag. EMPTY = overwrite the base tag(s); non-empty = append (e.g. 'msa')."
        required: false
        default: ""
      compile_kernel:
        description: "Build sgl-kernel from source (Volcengine fork only)"
        required: false
        type: boolean
        default: true
      private_debug_base_only:
        description: "Volcengine fork only: build and publish exactly one AMD64 CUDA 13 base image, without compiling a kernel wheel or building SBO/W4A8 variants."
        required: false
        type: boolean
        default: false
      private_debug_verify_image:
        description: "Volcengine fork only: verify an existing private debug image by immutable digest (repo@sha256:...), without rebuilding it."
        required: false
        default: ""
      private_debug_image_formats:
        description: "Volcengine fork only: CSV of image formats for the debug base build (oci, zstd, nydus). Applies only when private_debug_base_only is set."
        required: false
        default: "oci,zstd,nydus"
      private_debug_docker_target:
        description: "Volcengine fork only: Dockerfile target stage for the debug base build (framework_final or runtime). Applies only when private_debug_base_only is set."
        required: false
        default: "framework_final"
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: release-docker-dev-${{ inputs.private_debug_verify_image != '' && format('verify-{0}', github.run_id) || inputs.tag || inputs.pr_number || 'nightly' }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.config.outputs.checkout_ref }}
      extra_build_args: ${{ steps.config.outputs.extra_build_args }}
      tag_config: ${{ steps.config.outputs.tag_config }}
      overlay_cudas_json: ${{ steps.config.outputs.overlay_cudas_json }}
      overlay_tags_json: ${{ steps.config.outputs.overlay_tags_json }}
    steps:
      - name: Compute build configuration
        id: config
        env:
          # Inject multi-line/free-text inputs via env to avoid ${{ }} injection
          # breaking the bash script on quotes or $ in the Dockerfile snippet.
          OVERLAY_DOCKERFILE_INPUT: ${{ inputs.overlay_dockerfile }}
          OVERLAY_CUDAS_INPUT: ${{ inputs.overlay_cudas }}
          OVERLAY_SUFFIX_INPUT: ${{ inputs.overlay_tag_suffix }}
        run: |
          # Determine checkout ref
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "checkout_ref=refs/pull/${{ inputs.pr_number }}/head" >> $GITHUB_OUTPUT
          else
            echo "checkout_ref=" >> $GITHUB_OUTPUT
          fi

          # Determine extra build args
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "extra_build_args=--build-arg USE_LATEST_SGLANG=1 --build-arg CMAKE_BUILD_PARALLEL_LEVEL=\$(nproc)" >> $GITHUB_OUTPUT
          else
            echo "extra_build_args=--build-arg BRANCH_TYPE=local --build-arg CMAKE_BUILD_PARALLEL_LEVEL=\$(nproc)" >> $GITHUB_OUTPUT
          fi

          # Determine tag suffix
          SUFFIX=""
          if [ -n "${{ inputs.tag }}" ]; then
            SUFFIX="-${{ inputs.tag }}"
          elif [ -n "${{ inputs.pr_number }}" ]; then
            SUFFIX="-pr-${{ inputs.pr_number }}"
          fi

          # Build tag config. Development images are CUDA 13 only.
          if [ -z "${SUFFIX}" ]; then
            # Nightly: include dated tags
            TAG_CONFIG='[{"cuda":"cu130","tags":["dev","dev-cu13","nightly-dev-{date}-{short_sha}","nightly-dev-cu13-{date}-{short_sha}"]}]'
          else
            TAG_CONFIG="[{\"cuda\":\"cu130\",\"tags\":[\"dev${SUFFIX}\",\"dev-cu13${SUFFIX}\"]}]"
          fi
          echo "tag_config=${TAG_CONFIG}" >> $GITHUB_OUTPUT

          # Overlay configuration (optional). When overlay_dockerfile is set,
          # build one or more layered images on top of the just-built base.
          # SUFFIX was computed above from inputs.tag / inputs.pr_number.
          if [ -n "${OVERLAY_DOCKERFILE_INPUT}" ]; then
            # Refuse to overlay without a tag/pr_number: SUFFIX would be empty,
            # so base would point at the moving 'dev'/'dev-cu12'/'dev-cu13'
            # latest tags and overwrite mode would clobber them.
            if [ -z "${SUFFIX}" ]; then
              echo "overlay_dockerfile is set but neither 'tag' nor 'pr_number' was given." >&2
              echo "Set one so the overlay targets a specific tag, not the moving 'dev' latest." >&2
              exit 1
            fi
            CUDAS_INPUT="${OVERLAY_CUDAS_INPUT}"
            [ -z "${CUDAS_INPUT}" ] && CUDAS_INPUT="cu13"
            OVERLAY_TAGS='{}'
            IFS=',' read -ra CUDAS <<< "${CUDAS_INPUT}"
            for C in "${CUDAS[@]}"; do
              C="$(echo "${C}" | xargs)"
              if [ "${C}" = "cu13" ]; then
                BASES='["dev'"${SUFFIX}"'","dev-cu13'"${SUFFIX}"'"]'
              elif [ "${C}" = "cu12" ]; then
                BASES='["dev-cu12'"${SUFFIX}"'"]'
              else
                echo "Unknown overlay cuda variant: ${C} (expected cu12 or cu13)" >&2
                exit 1
              fi
              if [ -n "${OVERLAY_SUFFIX_INPUT}" ]; then
                # Append mode: primary base tag + suffix.
                PRIMARY="$(echo "${BASES}" | jq -r '.[0]')"
                OUTS='["'"${PRIMARY}-${OVERLAY_SUFFIX_INPUT}"'"]'
              else
                # Overwrite mode: replace every base alias.
                OUTS="${BASES}"
              fi
              OVERLAY_TAGS="$(echo "${OVERLAY_TAGS}" | jq -c \
                --arg c "${C}" --argjson b "${BASES}" --argjson o "${OUTS}" \
                '.[$c] = {bases:$b, outs:$o}')"
            done
            CUDAS_JSON="$(echo "${CUDAS_INPUT}" | jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')"
            echo "overlay_cudas_json=${CUDAS_JSON}" >> $GITHUB_OUTPUT
            echo "overlay_tags_json=${OVERLAY_TAGS}" >> $GITHUB_OUTPUT
          else
            echo "overlay_cudas_json=[]" >> $GITHUB_OUTPUT
            echo "overlay_tags_json={}" >> $GITHUB_OUTPUT
          fi

  build-and-publish:
    needs: prepare
    if: ${{ github.repository == 'sgl-project/sglang' && !inputs.build_only }}
    uses: ./.github/workflows/_docker-build-and-publish.yml
    with:
      docker_target: framework_final
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
      extra_build_args: ${{ needs.prepare.outputs.extra_build_args }}
      tag_config: ${{ needs.prepare.outputs.tag_config }}
      image_repo: ${{ inputs.image_repo || 'lmsysorg/sglang' }}
    secrets: inherit

  build-only:
    needs: prepare
    if: ${{ inputs.build_only && github.repository == 'sgl-project/sglang' }}
    runs-on: x64-docker-build-node
    env:
      IMAGE: sglang-diffusion-build-only:${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_DIR: source-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref || github.ref }}
          path: ${{ env.SOURCE_DIR }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CUDA 13 diffusion image locally (no push)
        run: |
          cd "$SOURCE_DIR"
          docker buildx build \
            --target framework_final \
            --platform linux/amd64 \
            --load \
            -t "$IMAGE" \
            -f docker/Dockerfile \
            --build-arg CUDA_VERSION=13.0.1 \
            --build-arg BUILD_TYPE=all \
            --build-arg GRACE_BLACKWELL=0 \
            --build-arg INSTALL_FLASHINFER_JIT_CACHE=1 \
            ${{ needs.prepare.outputs.extra_build_args }} \
            --no-cache \
            .

      - name: Verify diffusion dependencies
        run: |
          docker run --rm "$IMAGE" python3 -c '
          import importlib
          modules = (
              "av",
              "cache_dit",
              "cv2",
              "diffusers",
              "imageio_ffmpeg",
              "moviepy",
              "msgpack",
              "sglang.multimodal_gen",
              "soundfile",
              "trimesh",
          )
          for module in modules:
              importlib.import_module(module)
          print("diffusion dependency smoke check passed")
          '

      - name: Remove local test image
        if: always()
        run: docker image rm "$IMAGE" || true

  cleanup-nightly:
    needs: build-and-publish
    if: ${{ github.repository == 'sgl-project/sglang' && !inputs.build_only && !inputs.tag && !inputs.pr_number }}
    uses: ./.github/workflows/_docker-cleanup-nightly.yml
    with:
      tag_prefixes: '["nightly-dev", "nightly-dev-cu13"]'
      image_repo: ${{ inputs.image_repo || 'lmsysorg/sglang' }}
    secrets: inherit

  build-overlay:
    needs: [prepare, build-and-publish]
    if: ${{ !inputs.build_only && inputs.overlay_dockerfile != '' && github.repository == 'sgl-project/sglang' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: ${{ fromJson(needs.prepare.outputs.overlay_cudas_json) }}
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push overlay image (amd64 + arm64)
        env:
          REPO: ${{ inputs.image_repo || 'lmsysorg/sglang' }}
          TAGS: ${{ needs.prepare.outputs.overlay_tags_json }}
          CUDA: ${{ matrix.cuda }}
          # Injected via env to keep Dockerfile quotes/$ verbatim.
          SNIPPET: ${{ inputs.overlay_dockerfile }}
        run: |
          set -euo pipefail
          BASE="$(printf '%s' "$TAGS" | jq -r --arg c "$CUDA" '.[$c].bases[0]')"
          mapfile -t OUTS < <(printf '%s' "$TAGS" | jq -r --arg c "$CUDA" '.[$c].outs[]')
          {
            printf 'FROM %s:%s\n' "$REPO" "$BASE"
            printf '%s\n' "$SNIPPET"
          } > Dockerfile.overlay
          echo "::group::overlay Dockerfile ($CUDA)"
          cat Dockerfile.overlay
          echo "::endgroup::"
          OUT_ARGS=""
          for o in "${OUTS[@]}"; do OUT_ARGS="$OUT_ARGS -t $REPO:$o"; done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.overlay \
            $OUT_ARGS \
            --push .

  build-dev-kernel-wheel:
    if: ${{ github.repository == 'bytedance-iaas/sglang' && !inputs.private_debug_base_only && inputs.private_debug_verify_image == '' && (github.event_name == 'schedule' || inputs.compile_kernel) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_tag: x86-cu13
            cuda_version: "13.0"
    uses: ./.github/workflows/release-whl-kernel.yml
    with:
      checkout_ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
      cuda_version: ${{ matrix.cuda_version }}
      artifact_name: sgl-kernel-${{ matrix.arch_tag }}

  build-dev:
    needs: [build-dev-kernel-wheel]
    if: ${{ github.repository == 'bytedance-iaas/sglang' && !inputs.private_debug_base_only && inputs.private_debug_verify_image == '' && always() && (needs.build-dev-kernel-wheel.result == 'success' || needs.build-dev-kernel-wheel.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_key: cu130
            cuda_version: 13.0.1
            cuda_suffix: cu130
            publish_default_cuda_alias: true
            hopper_sbo: 0
            w4a8_per_tensor_transfer: 0
            variant_suffix: ""
            artifact_name: sgl-kernel-x86-cu13
          - cuda_key: cu130
            cuda_version: 13.0.1
            cuda_suffix: cu130
            publish_default_cuda_alias: true
            hopper_sbo: 1
            w4a8_per_tensor_transfer: 0
            variant_suffix: sbo
            artifact_name: sgl-kernel-x86-cu13
          - cuda_key: cu130
            cuda_version: 13.0.1
            cuda_suffix: cu130
            publish_default_cuda_alias: true
            hopper_sbo: 0
            w4a8_per_tensor_transfer: 1
            variant_suffix: w4a8
            artifact_name: sgl-kernel-x86-cu13
    uses: ./.github/workflows/_docker-build-and-publish.yml
    with:
      docker_target: framework_final
      checkout_ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
      cuda_key: ${{ matrix.cuda_key }}
      cuda_version: ${{ matrix.cuda_version }}
      cuda_suffix: ${{ matrix.cuda_suffix }}
      publish_default_cuda_alias: ${{ matrix.publish_default_cuda_alias }}
      variant_suffix: ${{ matrix.variant_suffix }}
      tag_mode: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
      use_environment: prod
      artifact_name: ${{ (github.event_name == 'schedule' || inputs.compile_kernel) && matrix.artifact_name || '' }}
      extra_build_args: >-
        --build-arg BRANCH_TYPE=local
        --build-arg CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
        --build-arg INSTALL_LOCAL_SGL_KERNEL_WHEEL=${{ (github.event_name == 'schedule' || inputs.compile_kernel) && '1' || '0' }}
        --build-arg HOPPER_SBO=${{ matrix.hopper_sbo }}
        --build-arg W4A8_PER_TENSOR_TRANSFER=${{ matrix.w4a8_per_tensor_transfer }}
        --build-arg HTTP_PROXY=http://100.68.162.211:3128
        --build-arg HTTPS_PROXY=http://100.68.162.211:3128
        --build-arg ALL_PROXY=http://100.68.162.211:3128
        --build-arg NO_PROXY=localhost,127.0.0.1,::1,mirrors.ivolces.com,.ivolces.com,.volceapi.com,.byted.org,eic-sdk-release.tos-cn-beijing.ivolces.com,scqq9isgq31i0fb8nt4eg.apigateway-cn-beijing.volceapi.com,bytedpypi.byted.org,mirrors.byted.org,iaas-gpu-cn-beijing.cr.volces.com
        --build-arg BYTED_INTERNAL_EXTRA_TOOLS_APT_URL=${{ vars.BYTED_INTERNAL_EXTRA_TOOLS_APT_URL || 'http://mirrors.ivolces.com/extra-tools/ubuntu' }}
        --build-arg BYTED_INTERNAL_EXTRA_TOOLS_GPG_URL=${{ vars.BYTED_INTERNAL_EXTRA_TOOLS_GPG_URL || 'https://mirrors.ivolces.com/extra-tools/ubuntu/GPG-KEY-system' }}
    secrets: inherit

  build-dev-debug-base:
    if: ${{ github.repository == 'bytedance-iaas/sglang' && inputs.private_debug_base_only && inputs.private_debug_verify_image == '' }}
    uses: ./.github/workflows/_docker-build-and-publish.yml
    with:
      docker_target: ${{ inputs.private_debug_docker_target || 'framework_final' }}
      checkout_ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
      cuda_key: cu130
      cuda_version: 13.0.1
      cuda_suffix: cu130
      publish_default_cuda_alias: false
      image_formats: ${{ inputs.private_debug_image_formats || 'oci,zstd,nydus' }}
      image_tag_override: ${{ format('debug-{0}-{1}-{2}', inputs.tag || 'servingkit', github.run_id, github.run_attempt) }}
      use_environment: prod
      extra_build_args: >-
        --build-arg BRANCH_TYPE=local
        --build-arg CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
        --build-arg INSTALL_LOCAL_SGL_KERNEL_WHEEL=0
        --build-arg HOPPER_SBO=0
        --build-arg W4A8_PER_TENSOR_TRANSFER=0
        --build-arg HTTP_PROXY=http://100.68.162.211:3128
        --build-arg HTTPS_PROXY=http://100.68.162.211:3128
        --build-arg ALL_PROXY=http://100.68.162.211:3128
        --build-arg NO_PROXY=localhost,127.0.0.1,::1,mirrors.ivolces.com,.ivolces.com,.volceapi.com,.byted.org,eic-sdk-release.tos-cn-beijing.ivolces.com,scqq9isgq31i0fb8nt4eg.apigateway-cn-beijing.volceapi.com,bytedpypi.byted.org,mirrors.byted.org,iaas-gpu-cn-beijing.cr.volces.com
        --build-arg BYTED_INTERNAL_EXTRA_TOOLS_APT_URL=${{ vars.BYTED_INTERNAL_EXTRA_TOOLS_APT_URL || 'http://mirrors.ivolces.com/extra-tools/ubuntu' }}
        --build-arg BYTED_INTERNAL_EXTRA_TOOLS_GPG_URL=${{ vars.BYTED_INTERNAL_EXTRA_TOOLS_GPG_URL || 'https://mirrors.ivolces.com/extra-tools/ubuntu/GPG-KEY-system' }}
    secrets: inherit

  verify-private-debug-image:
    if: ${{ github.repository == 'bytedance-iaas/sglang' && inputs.private_debug_verify_image != '' }}
    environment: prod
    runs-on: x64-docker-build-node
    env:
      IMAGE_REF: ${{ inputs.private_debug_verify_image }}
      VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
      VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4

      - name: Login to Volcengine CR
        run: |
          set -euo pipefail
          REGISTRY_HOST="${IMAGE_REF%%/*}"
          echo "${VOLCENGINE_CR_PASSWORD}" | docker login "${REGISTRY_HOST}" --username "${VOLCENGINE_CR_USERNAME}" --password-stdin

      - name: Verify existing AMD64 image and source provenance
        run: |
          set -euo pipefail
          case "${IMAGE_REF}" in
            *@sha256:*) ;;
            *) echo "private_debug_verify_image must be an immutable repo@sha256:... reference" >&2; exit 1 ;;
          esac
          docker buildx imagetools inspect "${IMAGE_REF}"
          docker pull "${IMAGE_REF}"

          python3 - "${IMAGE_REF}" <<'PY'
          import json
          import subprocess
          import sys

          inspect = json.loads(
              subprocess.check_output(["docker", "image", "inspect", sys.argv[1]])
          )[0]
          if inspect["Architecture"] != "amd64":
              raise SystemExit(f"unexpected architecture: {inspect['Architecture']}")
          labels = inspect["Config"].get("Labels") or {}
          required = (
              "ai.sglang.build.commit",
              "ai.sglang.build.tree",
              "ai.sglang.build.python-manifest-sha256",
              "org.opencontainers.image.source",
          )
          missing = [key for key in required if not labels.get(key)]
          if missing:
              raise SystemExit(f"missing image provenance labels: {missing}")
          if labels["org.opencontainers.image.source"] != "https://github.com/bytedance-iaas/sglang":
              raise SystemExit("unexpected image source label")
          print(json.dumps({"architecture": inspect["Architecture"], **{key: labels[key] for key in required}}))
          PY

          docker run --rm -i --entrypoint python3 "${IMAGE_REF}" - < scripts/ci/verify_private_image_runtime.py
          docker run --rm --entrypoint bash "${IMAGE_REF}" -lc '
            set -euo pipefail
            command -v oniond
            python3 -m py_compile scripts/eic_integration_check.py
            python3 -m pytest -q test/registered/unit/test_runtime_context.py -k TestMoeFlagsGroup
            python3 -m pytest -q test/registered/unit/test_model_overrides.py -k deepseek_spec_moe_resolution
          '
