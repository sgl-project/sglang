name: Build and Push Development Docker Images

# Branch nvidia/qwen35-gb300-sub only: publish the Qwen3.5 GB300 submission image without the self-hosted
# docker build runners. The 2026-11-20 nightly's arm64 image (SGLang 03fde9cc, sgl-nvidia-mega 7101de97,
# Dynamo 1.8.0.dev20261119, FlashInfer 0.7.4) gets one appended layer that moves both editable checkouts to
# SGLang 617bd6014a and sgl-nvidia-mega fe8163cc (docker/q35-gb300-sub-overlay-layer.sh); the base layers
# stay in place on Docker Hub, so nothing large is pulled.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag in lmsysorg/sglang"
        required: false
        default: "qwen35-gb300-sub-617bd60"
      push:
        description: "Push to Docker Hub (false: build the layer only)"
        required: false
        type: boolean
        default: true

concurrency:
  group: q35-gb300-sub-image
  cancel-in-progress: false

env:
  BASE_IMAGE: index.docker.io/lmsysorg/sglang@sha256:a6214cb2047c6494c60e33827cd66c1776ac6fe8cffa7ad0f3abdfff9e2ccc74
  BASE_INDEX: lmsysorg/sglang:nightly-dev-cu13-20261120-03fde9cc@sha256:d6f6d9720febe26aad1e40649a401cddd8504feb1d70de6b7ea374ff71785931
  SGLANG_COMMIT: 617bd6014ae3e2a2d234400d2c7371dcc9101796
  MEGA_COMMIT: fe8163cc788817ab6dd0f9ea09add97d7ac59004
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

jobs:
  append-layer:
    if: github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout SGLang (base and submission commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
          path: sglang

      - name: Fetch sgl-nvidia-mega
        run: |
          set -euo pipefail
          git init -q mega
          git -C mega fetch -q --depth 2 https://github.com/sgl-project/sgl-nvidia-mega.git "$MEGA_COMMIT"
          git -C mega cat-file -e 7101de977e2c25686d79d472661bdf0d9e8324d6
          git -C sglang cat-file -e 03fde9cc392a5f84a54a365635ffed0061cdf1b8
          git -C sglang cat-file -e "$SGLANG_COMMIT"

      - name: Build the layer
        run: bash sglang/docker/q35-gb300-sub-overlay-layer.sh sglang mega layer.tar.gz

      - name: Install crane
        run: |
          set -euo pipefail
          curl -fsSL -o crane.tgz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tgz" | sha256sum -c -
          tar -xzf crane.tgz crane && sudo install crane /usr/local/bin/crane && crane version

      - name: Append, label and push
        if: ${{ inputs.push }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | crane auth login index.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          TMP="lmsysorg/sglang:${TAG}-unlabelled"
          crane append -b "$BASE_IMAGE" -f layer.tar.gz -t "$TMP"
          crane mutate "$TMP" -t "lmsysorg/sglang:${TAG}" \
            -e SGLANG_BUILD_COMMIT="$SGLANG_COMMIT" \
            -e SGLANG_IMAGE_TAG="lmsysorg/sglang:${TAG}" \
            -e SGLANG_BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -l org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -l org.opencontainers.image.revision="$SGLANG_COMMIT" \
            -l org.opencontainers.image.version="lmsysorg/sglang:${TAG}" \
            -l ai.sglang.build.commit="$SGLANG_COMMIT" \
            -l ai.sglang.build.branch="${GITHUB_REF_NAME}" \
            -l ai.sglang.build.workflow_commit="${GITHUB_SHA}" \
            -l ai.sglang.build.url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -l ai.sglang.image.tag="lmsysorg/sglang:${TAG}" \
            -l ai.sglang.base.image="$BASE_INDEX" \
            -l ai.sglang.nvidia_mega.commit="$MEGA_COMMIT"
          DIGEST=$(crane digest "lmsysorg/sglang:${TAG}")
          echo "lmsysorg/sglang:${TAG}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
          crane config "lmsysorg/sglang:${TAG}" | python3 -c 'import json,sys; c=json.load(sys.stdin); print(c["architecture"], c["os"]); print({k: v for k, v in c["config"]["Labels"].items() if "sglang" in k or "opencontainers" in k})'
