name: Build and Push Development Docker Images

# Branch qwen38-fn-rubin only: publish the Qwen3.8-Flash-Next GB300 image without the self-hosted docker build
# runners (idle since 11-22). lmsysorg/sglang:qwen38-fn-rubin-a89019e (arm64, the cu134 build of this branch at
# a89019e3) gets one appended layer that moves its editable /sgl-workspace/sglang checkout to SGLANG_COMMIT
# (docker/q38fn-gb300-overlay-layer.sh refuses deletes, renames and compiled sources); the base layers stay on
# Docker Hub, so nothing large is pulled.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "qwen38-fn-rubin commit to publish (full sha)"
        required: true
      tag:
        description: "Image tag in lmsysorg/sglang, e.g. qwen38-fn-gb300-<short sha>"
        required: true
      push:
        description: "Push to Docker Hub (false: build the layer only)"
        required: false
        type: boolean
        default: true

concurrency:
  group: q38fn-gb300-image
  cancel-in-progress: false

env:
  BASE_IMAGE: index.docker.io/lmsysorg/sglang@sha256:3b08340eb9690ab29ba223bc91f6cdd7bc62b7191fd54ed3a9489fa36e28e189
  BASE_TAG: lmsysorg/sglang:qwen38-fn-rubin-a89019e@sha256:3b08340eb9690ab29ba223bc91f6cdd7bc62b7191fd54ed3a9489fa36e28e189
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

jobs:
  append-layer:
    if: github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout SGLang
        uses: actions/checkout@v4
        with:
          fetch-depth: 200
          persist-credentials: false
          path: sglang

      - name: Check commits
        env:
          SGLANG_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git -C sglang cat-file -e a89019e3c6118be44d820516aaeab3056433e7ea
          git -C sglang cat-file -e "$SGLANG_COMMIT"
          git -C sglang merge-base --is-ancestor a89019e3c6118be44d820516aaeab3056433e7ea "$SGLANG_COMMIT"

      - name: Build the layer
        run: bash sglang/docker/q38fn-gb300-overlay-layer.sh sglang "${{ inputs.commit }}" layer.tar.gz

      - name: Install crane
        run: |
          set -euo pipefail
          curl -fsSL -o crane.tgz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tgz" | sha256sum -c -
          tar -xzf crane.tgz crane && sudo install crane /usr/local/bin/crane && crane version

      - name: Append, label and push
        if: ${{ inputs.push }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SGLANG_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | crane auth login index.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          TMP="lmsysorg/sglang:${TAG}-unlabelled"
          crane append -b "$BASE_IMAGE" -f layer.tar.gz -t "$TMP"
          crane mutate "$TMP" -t "lmsysorg/sglang:${TAG}" \
            -e SGLANG_BUILD_COMMIT="$SGLANG_COMMIT" \
            -e SGLANG_IMAGE_TAG="lmsysorg/sglang:${TAG}" \
            -e SGLANG_BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -l org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -l org.opencontainers.image.revision="$SGLANG_COMMIT" \
            -l org.opencontainers.image.version="lmsysorg/sglang:${TAG}" \
            -l ai.sglang.build.commit="$SGLANG_COMMIT" \
            -l ai.sglang.build.branch="${GITHUB_REF_NAME}" \
            -l ai.sglang.build.workflow_commit="${GITHUB_SHA}" \
            -l ai.sglang.build.url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -l ai.sglang.image.tag="lmsysorg/sglang:${TAG}" \
            -l ai.sglang.base.image="$BASE_TAG"
          DIGEST=$(crane digest "lmsysorg/sglang:${TAG}")
          echo "lmsysorg/sglang:${TAG}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
          crane config "lmsysorg/sglang:${TAG}" | python3 -c 'import json,sys; c=json.load(sys.stdin); print(c["architecture"], c["os"]); print({k: v for k, v in c["config"]["Labels"].items() if "sglang" in k or "opencontainers" in k})'
