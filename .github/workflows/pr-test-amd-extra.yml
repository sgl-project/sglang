name: PR Test Extra (AMD)
# Label-gated AMD extra CI workflow — the AMD mirror of pr-test-extra.yml.
#
# Adds AMD runtime to a PR only when the author opts in: the PR must carry
# `run-ci` plus `run-ci-amd-extra` (AMD Extra opt-in).
# The label check happens at runtime in pr-gate.yml via a live
# `gh pr view`-style fetch, so reruns after adding the labels (e.g. via a
# slash command) pick up the new label set — a workflow-level `if` would read
# the frozen event payload, which never updates on rerun. The job graph also
# runs unconditionally on workflow_dispatch / workflow_call so it can be
# triggered manually or chained from the AMD scheduler.
#
# Stages: extra-a and extra-b. Each job mirrors the container bring-up of
# pr-test-amd.yml and dispatches `run_suite.py --hw amd --suite
# {stage}-test-{runner_config}`:
#   - extra-a 1-gpu-small: mock-model / kv_canary unit + single-GPU canary e2e
#                          tests, plus LoRA eviction/drainer, priority
#                          scheduling, torch-native attention
#   - extra-a 1-gpu-large: single-GPU model e2e tests (quant fp8kv-triton,
#                          sessions, spec standalone triton, basic_perf
#                          throughput/latency, torch.compile, VLM models)
#   - extra-a 2-gpu-large: multi-GPU (TP/PP/PD) mock-model + kv_canary e2e
#                          tests, PP/MoE throughput, distributed weight update
#   - extra-b 4-gpu:       PP extra configs, gpt-oss-20b LoRA logprob diff
# Everything here is in CUDA's extra tier too.
# kv_canary e2e is registered to the same extra-a stage as its CUDA siblings
# (it now exercises the ROCm canary kernels end-to-end).

on:
  # No `labeled` trigger, as in pr-test-extra.yml: a label event would cancel
  # the run in progress. Adding the labels after a push takes a rerun.
  pull_request:
  workflow_dispatch:
    inputs:
      runner_arch:
        description: 'AMD runner pool to dispatch GPU jobs to'
        required: false
        type: choice
        default: mi300
        options:
          - mi300
          - mi325
      rocm_version:
        description: 'ROCm container variant (ROCm 10 by default)'
        required: false
        type: choice
        default: rocm10
        options:
          - rocm10
          - rocm724
          - rocm720
      aiter_ref:
        description: 'Override AITER commit (optional, leave empty to use Dockerfile default)'
        required: false
        type: string
        default: ''
      amd_ci_image:
        description: 'Override AMD CI Docker image (optional, e.g. rocm/sgl-dev:tag)'
        required: false
        type: string
        default: ''
      continue_on_error:
        description: 'Continue on error (do not fail the workflow on test failures)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      runner_arch:
        description: 'AMD runner pool to dispatch GPU jobs to'
        required: false
        type: string
        default: mi300
      rocm_version:
        description: 'ROCm container variant (ROCm 10 by default)'
        required: false
        type: string
        default: rocm10
      aiter_ref:
        description: 'Override AITER commit (optional, leave empty to use Dockerfile default)'
        required: false
        type: string
        default: ''
      amd_ci_image:
        description: 'Override AMD CI Docker image (optional, e.g. rocm/sgl-dev:tag)'
        required: false
        type: string
        default: ''
      continue_on_error:
        description: 'Continue on error (do not fail the workflow on test failures)'
        required: false
        type: boolean
        default: false

env:
  AITER_COMMIT_OVERRIDE: ${{ inputs.aiter_ref }}
  AMD_CI_IMAGE: ${{ inputs.amd_ci_image }}
  DOCKERHUB_AMD_USERNAME: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
  DOCKERHUB_AMD_TOKEN: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

concurrency:
  # Schedule/dispatch runs key on run_id plus ROCm version so the three
  # scheduled reusable-workflow matrix calls cannot replace each other's
  # pending runs. PR runs still share a per-branch group so pushes cancel stale
  # runs. In a reusable workflow github.event_name is the originating event.
  group: pr-test-amd-extra-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('full-{0}-{1}', github.run_id, inputs.rocm_version || 'rocm10') || github.head_ref || github.ref_name || inputs.ref || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  # =============================================== PR Gate ====================================================
  # Runtime live-fetch label gate (mirrors pr-test-extra.yml's call-gate):
  # requires `run-ci` and `run-ci-amd-extra`. A failure cascades to
  # every test job via `needs`, so a PR without the labels ends in one red
  # ~30s gate job plus a row of skipped jobs instead of consuming AMD runners.
  call-gate:
    uses: ./.github/workflows/pr-gate.yml
    with:
      require-run-ci: true
      require-label: run-ci-amd-extra
    secrets: inherit

  # runs-on labels and container env per runner_config, from the
  # amd_runner_configs section of scripts/ci/runner_configs.yml.
  amd-runner-map:
    needs: call-gate
    if: ${{ !cancelled() && needs.call-gate.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      runs_on_map: ${{ steps.map.outputs.runs_on_map }}
      extra_envs_map: ${{ steps.map.outputs.extra_envs_map }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Build AMD runs_on_map (resolves $amd_arch sentinel)
        id: map
        env:
          AMD_ARCH: ${{ inputs.runner_arch || 'mi300' }}
        run: python3 scripts/ci/runner_configs.py --amd-map "$AMD_ARCH" >> "$GITHUB_OUTPUT"

  # =============================================== extra-a (1-gpu-small) ===============================================
  # ~1.9h of tests in total; four shards keep each well under the step timeout.
  extra-a-test-1-gpu-small-mi30x:
    name: ${{ format('extra-a-test-1-gpu-small-mi30x ({0}, {1}, {2})', inputs.rocm_version || 'rocm10', fromJson(needs.amd-runner-map.outputs.runs_on_map)['1-gpu-small-mi30x'], matrix.part) }}
    needs: [call-gate, amd-runner-map]
    if: ${{ !cancelled() && needs.call-gate.result == 'success' && needs.amd-runner-map.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    runs-on: ${{ fromJson(needs.amd-runner-map.outputs.runs_on_map)['1-gpu-small-mi30x'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        # `inputs` is empty on pull_request events, so fall back explicitly to
        # the ROCm 10 PR default. Reusable callers can request another variant.
        run: bash scripts/ci/amd/amd_ci_start_container.sh --rocm-version ${{ inputs.rocm_version || 'rocm10' }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install dependencies
        run: bash scripts/ci/amd/amd_ci_install_dependency.sh

      - name: Run test
        timeout-minutes: 75
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w "/sglang-checkout/test" python3 run_suite.py --hw amd --suite extra-a-test-1-gpu-small-mi30x --auto-partition-id ${{ matrix.part }} --auto-partition-size 4 --timeout-per-file 1800 ${{ inputs.continue_on_error == true && '--continue-on-error' || '' }}

  # =============================================== extra-a (1-gpu-large) ===============================================
  # Single-GPU lora / spec / quant / perf model e2e tests. Runs on the same
  # 1-gpu pool as small (AMD GPUs carry enough VRAM that "large" here is a
  # CUDA memory-tier label, not a separate AMD runner pool). ~90 min in total;
  # three shards keep each well under the step timeout.
  extra-a-test-1-gpu-large-mi30x:
    name: ${{ format('extra-a-test-1-gpu-large-mi30x ({0}, {1}, {2})', inputs.rocm_version || 'rocm10', fromJson(needs.amd-runner-map.outputs.runs_on_map)['1-gpu-large-mi30x'], matrix.part) }}
    needs: [call-gate, amd-runner-map]
    if: ${{ !cancelled() && needs.call-gate.result == 'success' && needs.amd-runner-map.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    runs-on: ${{ fromJson(needs.amd-runner-map.outputs.runs_on_map)['1-gpu-large-mi30x'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        run: bash scripts/ci/amd/amd_ci_start_container.sh --rocm-version ${{ inputs.rocm_version || 'rocm10' }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install dependencies
        run: bash scripts/ci/amd/amd_ci_install_dependency.sh

      - name: Run test
        timeout-minutes: 60
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w "/sglang-checkout/test" python3 run_suite.py --hw amd --suite extra-a-test-1-gpu-large-mi30x --auto-partition-id ${{ matrix.part }} --auto-partition-size 3 --timeout-per-file 1800 ${{ inputs.continue_on_error == true && '--continue-on-error' || '' }}

  # =============================================== extra-a (2-gpu-large) ===============================================
  # Multi-GPU TP / PP / PD mock-model + kv_canary e2e tests and PP/MoE
  # throughput. Mirrors CUDA's extra-a 2-gpu-large stage; runs on the 2-GPU
  # AMD pool.
  extra-a-test-2-gpu-large-mi30x:
    name: ${{ format('extra-a-test-2-gpu-large-mi30x ({0}, {1}, {2})', inputs.rocm_version || 'rocm10', fromJson(needs.amd-runner-map.outputs.runs_on_map)['2-gpu-large-mi30x'], matrix.part) }}
    needs: [call-gate, amd-runner-map]
    if: ${{ !cancelled() && needs.call-gate.result == 'success' && needs.amd-runner-map.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    runs-on: ${{ fromJson(needs.amd-runner-map.outputs.runs_on_map)['2-gpu-large-mi30x'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        run: bash scripts/ci/amd/amd_ci_start_container.sh --rocm-version ${{ inputs.rocm_version || 'rocm10' }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install dependencies
        run: bash scripts/ci/amd/amd_ci_install_dependency.sh

      - name: Run test
        timeout-minutes: 60
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w "/sglang-checkout/test" python3 run_suite.py --hw amd --suite extra-a-test-2-gpu-large-mi30x --auto-partition-id ${{ matrix.part }} --auto-partition-size 2 --timeout-per-file 1800 ${{ inputs.continue_on_error == true && '--continue-on-error' || '' }}

  # =============================================== extra-b (4-gpu) ===============================================
  # 4-GPU tests that CUDA runs in extra-b.
  extra-b-test-4-gpu-mi30x:
    name: ${{ format('extra-b-test-4-gpu-mi30x ({0}, {1})', inputs.rocm_version || 'rocm10', fromJson(needs.amd-runner-map.outputs.runs_on_map)['4-gpu-mi30x']) }}
    needs: [call-gate, amd-runner-map]
    if: ${{ !cancelled() && needs.call-gate.result == 'success' && needs.amd-runner-map.result == 'success' }}
    runs-on: ${{ fromJson(needs.amd-runner-map.outputs.runs_on_map)['4-gpu-mi30x'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        run: bash scripts/ci/amd/amd_ci_start_container.sh --rocm-version ${{ inputs.rocm_version || 'rocm10' }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install dependencies
        run: bash scripts/ci/amd/amd_ci_install_dependency.sh

      - name: Run test
        timeout-minutes: 60
        env:
          EXTRA_ENVS: ${{ fromJson(needs.amd-runner-map.outputs.extra_envs_map)['4-gpu-mi30x'] }}
        run: |
          extra_envs=()
          for kv in $EXTRA_ENVS; do extra_envs+=(-e "$kv"); done
          bash scripts/ci/amd/amd_ci_exec.sh \
            "${extra_envs[@]}" \
            -w "/sglang-checkout/test" \
            python3 run_suite.py --hw amd --suite extra-b-test-4-gpu-mi30x --timeout-per-file 1800 ${{ inputs.continue_on_error == true && '--continue-on-error' || '' }}

  # =============================================== aggregator ====================================================
  # Single fan-in job so branch protection / notifications depend on one job
  # rather than every matrix leg. Fails if any dependent failed or was
  # cancelled; `skipped` (e.g. PR without the opt-in labels) is not a failure.
  pr-test-amd-extra-finish:
    needs:
      [
        call-gate,
        amd-runner-map,
        extra-a-test-1-gpu-small-mi30x,
        extra-a-test-1-gpu-large-mi30x,
        extra-a-test-2-gpu-large-mi30x,
        extra-b-test-4-gpu-mi30x,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')
          for job in $job_names; do
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')
            echo "$job: $result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done
          echo "All jobs completed successfully"
          exit 0
