name: Release Docker Images Nightly ROCm10 (AMD)
on:
  workflow_dispatch:
    inputs:
      job_select:
        description: 'Select which release job to run'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - publish
      publish_target:
        description: 'Where to push the image. Keep "test" while the ROCm 10 SDK pin is a nightly alpha.'
        required: false
        type: choice
        default: 'test'
        options:
          - test
          - lmsys
          - none
      image_repo:
        description: 'Docker Hub repo used when publish_target=test'
        required: false
        type: string
        default: 'bingxche/sgl-test'
  # No schedule yet: the ROCm 10 stages pin a nightly SDK build
  # (rocm==10.0.0a20260730) rather than a GA release, because the 10.0.0
  # release's only torch builds are named +devrocm10.0.0.dev0.<sha>. Publishing
  # that on a cron is premature, so this stays dispatch-only until ROCm 10 GA
  # lets the Dockerfile pin a plain version.
  # schedule:
  #   - cron: '0 12 * * *'

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sgl-project/sglang' && (github.event_name != 'workflow_dispatch' || inputs.job_select == 'all' || inputs.job_select == 'publish')
    runs-on: amd-docker-scale
    environment: 'prod'
    strategy:
      fail-fast: false
      matrix:
        gpu_arch: ['gfx942-rocm10', 'gfx950-rocm10']
        build_type: ['all']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe to find tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Set Date"
        run: |
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      # Resolve the destination before building: a missing secret or an
      # unpushable target should fail in seconds, not after an hour of build.
      - name: Resolve publish target
        id: target
        env:
          PUBLISH_TARGET: ${{ inputs.publish_target || 'test' }}
          TEST_IMAGE_REPO: ${{ inputs.image_repo || 'bingxche/sgl-test' }}
          TEST_USERNAME: ${{ secrets.DOCKERHUB_AMD_TEST_USERNAME }}
          TEST_TOKEN: ${{ secrets.DOCKERHUB_AMD_TEST_TOKEN }}
          LMSYS_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          LMSYS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${PUBLISH_TARGET}" in
            test)
              if [ -z "${TEST_USERNAME}" ] || [ -z "${TEST_TOKEN}" ]; then
                echo "::error::publish_target=test needs DOCKERHUB_AMD_TEST_USERNAME and DOCKERHUB_AMD_TEST_TOKEN"
                exit 1
              fi
              echo "image_repo=${TEST_IMAGE_REPO}" >> $GITHUB_OUTPUT
              echo "push=true" >> $GITHUB_OUTPUT
              ;;
            lmsys)
              if [ -z "${LMSYS_USERNAME}" ] || [ -z "${LMSYS_TOKEN}" ]; then
                echo "::error::publish_target=lmsys needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"
                exit 1
              fi
              echo "image_repo=lmsysorg/sglang-rocm" >> $GITHUB_OUTPUT
              echo "push=true" >> $GITHUB_OUTPUT
              ;;
            none)
              echo "image_repo=rocm/sgl-dev" >> $GITHUB_OUTPUT
              echo "push=false" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unknown publish_target '${PUBLISH_TARGET}'"
              exit 1
              ;;
          esac
          echo "target=${PUBLISH_TARGET}" >> $GITHUB_OUTPUT
          echo "Publish target: ${PUBLISH_TARGET}"

      - name: Get version from latest tag
        id: version
        run: |
          # Use the shared helper so stable/post releases sort above rc tags.
          VERSION=$(python3 python/tools/get_version_tag.py --tag-only | sed 's/^v//')

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from git tags"
            exit 1
          fi

          # Get short commit hash of current HEAD
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Compose pretend version for setuptools_scm: e.g., 0.5.8.post1.dev20260211+g1a2b3c4
          PRETEND_VERSION="${VERSION}.dev${{ env.DATE }}+g${COMMIT_HASH}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pretend_version=${PRETEND_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"
          echo "Pretend version for pip: ${PRETEND_VERSION}"

      # Pushing to rocm/sgl-dev is deliberately not wired up: an image built on
      # an alpha ROCm SDK does not belong in the registry the AMD CI pulls from.
      - name: Login to Docker Hub (AMD test registry)
        if: steps.target.outputs.target == 'test'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_AMD_TEST_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TEST_TOKEN }}

      - name: Login to Docker Hub (lmsys)
        if: steps.target.outputs.target == 'lmsys'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ROCm 10 image
        run: |
          version=${{ steps.version.outputs.version }}
          pretend_version=${{ steps.version.outputs.pretend_version }}
          echo "Version: ${version}"
          echo "Pretend version: ${pretend_version}"

          # rocm10, not rocm10.0: amd_ci_start_container.sh composes its image tags
          # as v<version>-<rocm>-<arch>-<date> with the rocm700 / rocm720 spelling,
          # so a dotted tag here could never be looked up by the AMD suites.
          if [ "${{ matrix.gpu_arch }}" = "gfx942-rocm10" ]; then
            rocm_tag="rocm10-mi30x"
          elif [ "${{ matrix.gpu_arch }}" = "gfx950-rocm10" ]; then
            rocm_tag="rocm10-mi35x"
          else
            echo "Unsupported gfx arch"
            exit 1
          fi

          image="${{ steps.target.outputs.image_repo }}:v${version}-${rocm_tag}-${{ env.DATE }}"
          echo "IMAGE=${image}" >> $GITHUB_ENV
          echo "Building ${image}"

          # remove --build-arg NIC_BACKEND=ainic for auto detection nic support in mori
          # UBUNTU_CODENAME=noble because the ROCm 10 stages build on ubuntu:24.04
          # while the Dockerfile defaults to jammy for the 22.04 bases; MORI's apt
          # step interpolates it into the amdainic repo URL.
          # ENABLE_NIXL=0 because Ubuntu 24.04's Abseil is too old for absl_log,
          # the same wall the ROCm 7.15 stage hit (#32079).
          # UBUNTU_MIRROR forces apt over HTTPS to dodge port-80 reachability flakes
          # to Canonical's archive.ubuntu.com mirror IPs from the amd-docker-scale runner.
          docker build . -f docker/rocm.Dockerfile --build-arg SGL_BRANCH=${{ github.sha }} --build-arg BUILD_TYPE=${{ matrix.build_type }} --build-arg GPU_ARCH=${{ matrix.gpu_arch }} --build-arg ENABLE_MORI=1 --build-arg ENABLE_NIXL=0 --build-arg UBUNTU_CODENAME=noble --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=${pretend_version} --build-arg UBUNTU_MIRROR=https://archive.ubuntu.com -t "${image}" --no-cache

      - name: Push image
        if: steps.target.outputs.push == 'true'
        run: |
          docker push "${{ env.IMAGE }}"
          echo "Published ${{ env.IMAGE }}" >> $GITHUB_STEP_SUMMARY
