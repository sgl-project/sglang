name: NVIDIA GB300 runner sanity

# Review candidate: native pr-gate blocks drafts; confirm the Ready/rerun plan.
# For a fork PR, use its PR-event run and an authorized maintainer rerun;
# adding run-ci alone is not this workflow's trigger.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/nvidia-gb300-runner-sanity.yml']

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: nvidia-gb300-sanity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  call-gate:
    if: github.repository == 'sgl-project/sglang'
    uses: sgl-project/sglang/.github/workflows/pr-gate.yml@e0187268f64165fa6969fb166dd5c11f05462e3c
    with:
      require-run-ci: true

  sanity:
    needs: call-gate
    permissions: {}
    runs-on: nvoss-sg-l-gb300-4-a
    # Job budget includes startup; ARC's pod-readiness timeout is separate.
    timeout-minutes: 20
    container:
      image: lmsysorg/sglang@sha256:9b524a335866163c89d28652f1c9a0fc603bc386143e47659fb5dfcb611479b3
      options: --user 1001
    steps:
      - name: Check user, architecture and GPU inventory
        # Keep the inventory probe short after startup.
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner: %s\n' "$RUNNER_NAME"
          id
          uname -sm
          test "$(id -u)" = 1001
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          nvidia-smi
          inventory="$(nvidia-smi --query-gpu=uuid,name --format=csv,noheader)"
          printf '%s\n' "$inventory"
          printf '%s\n' "$inventory" | awk -F, '
            NF != 2 || $1 !~ /^GPU-/ ||
              $2 !~ /(^|[[:space:]])GB300([[:space:]]|$)/ { bad = 1 }
            { if (seen[$1]++) bad = 1 }
            END { exit (NR != 4 || bad) }
          '
          echo 'PASS: UID1001, Linux ARM64, four distinct GB300 GPUs visible.'
