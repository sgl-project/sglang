name: CI Auto Bisect

on:
  workflow_run:
    workflows: ["PR Test Base", "PR Test (XPU)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Scheduled workflow to analyze"
        required: false
        type: choice
        options: [nvidia, xpu]
        default: nvidia

permissions:
  contents: read
  actions: read

jobs:
  auto-bisect:
    # Only run for scheduled pr-test completions (not PR-triggered), or manual dispatch
    if: >
      github.repository == 'sgl-project/sglang' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'schedule' &&
         github.event.workflow_run.conclusion != 'cancelled')
      )
    # Job-level so skipped push completions never join (and cancel) the group;
    # one key per platform, shared by scheduled and manual runs.
    concurrency:
      group: ci-auto-bisect-${{ (github.event.workflow_run.name == 'PR Test (XPU)' || inputs.target == 'xpu') && 'xpu' || 'nvidia' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git log between SHAs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests anthropic

      - name: Select workflow
        id: target
        env:
          RUN_NAME: ${{ github.event.workflow_run.name }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$RUN_NAME" == "PR Test (XPU)" || "$TARGET" == "xpu" ]]; then
            echo "workflow_file=pr-test-xpu.yml" >> "$GITHUB_OUTPUT"
            echo "hardware=Intel XPU" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_file=pr-test.yml" >> "$GITHUB_OUTPUT"
            echo "hardware=Nvidia" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Auto Bisect
        id: bisect
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_FOR_NIGHTLY_CI_DATA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: 1
          PYTHONIOENCODING: utf-8
          WORKFLOW_FILE: ${{ steps.target.outputs.workflow_file }}
          HARDWARE: ${{ steps.target.outputs.hardware }}
        run: |
          cd scripts/ci_monitor
          python ci_auto_bisect.py \
            --github-token $GITHUB_TOKEN \
            --anthropic-api-key $ANTHROPIC_API_KEY \
            --output bisect_results.json \
            --max-failures 10 \
            --workflow-file "$WORKFLOW_FILE" \
            --hardware "$HARDWARE"

      - name: Upload Bisect Results
        if: always() && hashFiles('scripts/ci_monitor/bisect_results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-auto-bisect-${{ github.run_number }}
          path: scripts/ci_monitor/bisect_results.json
          retention-days: 14
