name: AMD Image Cache Probe

# Measures how `scripts/ci/amd/amd_ci_start_container.sh` behaves when many jobs
# acquire the image at the same instant.
#
# The regular test stages cannot answer that: they cap the matrix with
# `max-parallel` (4 for stage-b-test-1-gpu-small-amd), so no amount of
# dispatching drives more than 4 concurrent image acquisitions. This workflow
# drops the cap and stops right after the container starts, so a job costs one
# image acquisition instead of a full test shard.
#
# Dispatch only. Grep the run for `[amd-ci-setup]` and pair each line with its
# `Start CI container` step window to get per-job concurrency.

on:
  workflow_dispatch:
    inputs:
      fanout:
        description: "How many jobs to start at once"
        required: false
        type: choice
        default: "16"
        options: ["4", "8", "16", "24", "32"]
      runner_arch:
        description: "AMD runner pool"
        required: false
        type: choice
        default: mi300
        options: [mi300, mi325]
      rocm_version:
        description: "ROCm version for image lookup"
        required: false
        type: string
        default: rocm724
      tarball_cache:
        description: "AMD_CI_IMAGE_TARBALL_CACHE (empty = default for the pool)"
        required: false
        type: choice
        default: ""
        options: ["", "1", "0"]

concurrency:
  group: amd-image-cache-probe-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fanout:
    name: amd-image-cache-probe-fanout
    runs-on: ubuntu-latest
    outputs:
      indexes: ${{ steps.build.outputs.indexes }}
    steps:
      - name: Build the matrix
        id: build
        run: |
          n="${{ inputs.fanout }}"
          indexes=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$n")
          echo "indexes=${indexes}" >> "$GITHUB_OUTPUT"
          echo "Fanning out to ${n} concurrent image acquisitions: ${indexes}"

  acquire:
    name: ${{ format('amd-image-cache-probe ({0}, {1})', inputs.rocm_version || 'rocm724', matrix.idx) }}
    needs: [fanout]
    runs-on: ${{ format('linux-{0}-1gpu-sglang', inputs.runner_arch || 'mi300') }}
    timeout-minutes: 60
    strategy:
      # Deliberately no max-parallel: driving every job at once is the point.
      fail-fast: false
      matrix:
        idx: ${{ fromJson(needs.fanout.outputs.indexes) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        run: bash scripts/ci/amd/amd_ci_start_container.sh --rocm-version "${{ inputs.rocm_version || 'rocm724' }}"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          AMD_CI_IMAGE_TARBALL_CACHE: ${{ inputs.tarball_cache }}

      - name: Report
        if: always()
        run: |
          echo "probe idx=${{ matrix.idx }} runner=${RUNNER_NAME:-unknown}"
          docker images --format '  {{.Repository}}:{{.Tag}} {{.Size}}' | head -n 20
          df -h /home/runner/sglang-data 2>/dev/null | tail -n 1 || true

      - name: Release the container
        if: always()
        run: |
          docker stop ci_sglang 2>/dev/null || true
          docker rm -f ci_sglang 2>/dev/null || true
