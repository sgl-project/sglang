  check-all-jobs:
    if: ${{ !cancelled() }}
    needs:
      - nightly-poc-single-node-a2-tests
      - nightly-poc-single-node-tests
      - nightly-poc-multi-node-tests
      - nightly-poc-multi-node-mix-tests
      - nightly-1-npu-a2
      - nightly-2-npu-a2
      - nightly-1-npu-a3
      - nightly-2-npu-a3
      - nightly-4-npu-a3
      - nightly-8-npu-a3
      - nightly-16-npu-a3
    runs-on: ubuntu-latest
    steps:
      - name: Download all metrics
        uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          path: /tmp/metrics
          merge-multiple: false

      - name: Generate results table
        run: |
          status_emoji() {
            case "$1" in
              pass)   echo "✅" ;;
              fail)   echo "❌" ;;
              *)      echo "❓" ;;
            esac
          }

          single_result_a2="${{ needs.nightly-poc-single-node-a2-tests.result }}"
          single_result="${{ needs.nightly-poc-single-node-tests.result }}"
          multi_result="${{ needs.nightly-poc-multi-node-tests.result }}"
          mix_result="${{ needs.nightly-poc-multi-node-mix-tests.result }}"
          nightly_1_a2_result="${{ needs.nightly-1-npu-a2.result }}"
          nightly_2_a2_result="${{ needs.nightly-2-npu-a2.result }}"
          nightly_1_result="${{ needs.nightly-1-npu-a3.result }}"
          nightly_2_result="${{ needs.nightly-2-npu-a3.result }}"
          nightly_4_result="${{ needs.nightly-4-npu-a3.result }}"
          nightly_8_result="${{ needs.nightly-8-npu-a3.result }}"
          nightly_16_result="${{ needs.nightly-16-npu-a3.result }}"

          group_icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⏭️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          echo "## Nightly Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Group | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| single-node-poc-a2 | $(group_icon ${single_result_a2}) ${single_result_a2} |" >> $GITHUB_STEP_SUMMARY
          echo "| single-node-poc | $(group_icon ${single_result}) ${single_result} |" >> $GITHUB_STEP_SUMMARY
          echo "| multi-node-poc | $(group_icon ${multi_result}) ${multi_result} |" >> $GITHUB_STEP_SUMMARY
          echo "| multi-node-mix-poc | $(group_icon ${mix_result}) ${mix_result} |"
          echo "| nightly-1-npu-a2 | $(group_icon ${nightly_1_a2_result}) ${nightly_1_a2_result} |"
          echo "| nightly-2-npu-a2 | $(group_icon ${nightly_2_a2_result}) ${nightly_2_a2_result} |"
          echo "| nightly-1-npu-a3 | $(group_icon ${nightly_1_result}) ${nightly_1_result} |"
          echo "| nightly-2-npu-a3 | $(group_icon ${nightly_2_result}) ${nightly_2_result} |"
          echo "| nightly-4-npu-a3 | $(group_icon ${nightly_4_result}) ${nightly_4_result} |"
          echo "| nightly-8-npu-a3 | $(group_icon ${nightly_8_result}) ${nightly_8_result} |"
          echo "| nightly-16-npu-a3 | $(group_icon ${nightly_16_result}) ${nightly_16_result} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Per-Test Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          has_metrics=false
          for dir in /tmp/metrics/metrics-*/; do
            file="${dir}metrics.json"
            if [ -f "$file" ]; then
              has_metrics=true
              echo "import json" > /tmp/parse_metrics.py
              echo "with open('$file') as f:" >> /tmp/parse_metrics.py
              echo "    d = json.load(f)" >> /tmp/parse_metrics.py
              echo "tc = d.get('test_case', '-')" >> /tmp/parse_metrics.py
              echo "tp = d.get('test_type', '-')" >> /tmp/parse_metrics.py
              echo "st = d.get('status', 'unknown')" >> /tmp/parse_metrics.py
              echo "icon = '✅' if st == 'pass' else '❌'" >> /tmp/parse_metrics.py
              echo "metrics = d.get('metrics', {})" >> /tmp/parse_metrics.py
              echo "baselines = d.get('baselines', {})" >> /tmp/parse_metrics.py
              echo "mstr = ', '.join(f'{k}={v}' for k,v in metrics.items()) if metrics else '-'" >> /tmp/parse_metrics.py
              echo "bstr = ', '.join(f'{k}={v}' for k,v in baselines.items()) if baselines else '-'" >> /tmp/parse_metrics.py
              echo "print(f'| {tc} | {tp} | {icon} {st} | {mstr} | {bstr} |')" >> /tmp/parse_metrics.py
              python3 /tmp/parse_metrics.py
            fi
          done > /tmp/metrics_table.txt

          if [ "${has_metrics}" = "true" ]; then
            echo "| Test Case | Type | Status | Metrics | Baseline |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|------|--------|---------|----------|" >> $GITHUB_STEP_SUMMARY
            cat /tmp/metrics_table.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No per-test metrics available (artifacts not found)." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          FAIL=0
          if [ "${single_result}" != "success" ] && [ "${single_result}" != "skipped" ]; then FAIL=1; fi
          if [ "${nightly_1_a2_result}" != "success" ] && [ "${nightly_1_a2_result}" != "skipped" ]; then FAIL=1; fi
          if [ "${nightly_2_a2_result}" != "success" ] && [ "${nightly_2_a2_result}" != "skipped" ]; then FAIL=1; fi
          if [ "${nightly_1_result}" != "success" ] && [ "${nightly_1_result}" != "skipped" ]; then FAIL=1; fi
          if [ "${nightly_2_result}" != "success" ] && [ "${nightly_2_result}" != "skipped" ]; then FAIL=1; fi
          if [ "${nightly_4_result}" != "success" ] && [ "${nightly_4_result}" != "skipped" ]; then FAIL=1; fi
          if [ "${nightly_8_result}" != "success" ] && [ "${nightly_8_result}" != "skipped" ]; then FAIL=1; fi
          if [ "${nightly_16_result}" != "success" ] && [ "${nightly_16_result}" != "skipped" ]; then FAIL=1; fi
          exit $FAIL
