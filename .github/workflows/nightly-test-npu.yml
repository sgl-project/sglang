          - name: qwen3_30b_w8a8_1p_in3k5_out1k5_50ms_aime25
            runner: linux-aarch64-a3-2
            test_case: test/registered/npu/accuracy/qwen3_30b_a3b/test_npu_qwen3_30b_w8a8_1p_in3k5_out1k5_50ms_aime25.py
