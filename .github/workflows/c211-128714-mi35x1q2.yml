name: c211-128714-mi35x1q2
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  job-mi35x1-01:
    name: probe-job-mi35x1-01
    runs-on: [linux-mi35x-gpu-1]
    timeout-minutes: 15
    steps:
      - name: devices
        shell: bash
        env:
          NONCE: c211-128714-5b859ff7d593b3e4
        run: |
          set -u
          set +e
          NONCE='c211-128714-5b859ff7d593b3e4'
          echo "C211_JOB=job-mi35x1-01 NONCE=$NONCE"
          echo "C211_MARKER job=job-mi35x1-01 nonce=$NONCE host=$(hostname 2>/dev/null) uid=$(id -u) user=$(id -un 2>/dev/null)"
          id 2>&1 || true
          uname -a 2>&1 || true
          echo "OS=$(. /etc/os-release 2>/dev/null && echo $PRETTY_NAME)"
          echo "--- KFD ---"
          if [ -e /dev/kfd ]; then echo "KFD_DEV=PRESENT"; else echo "KFD_DEV=ABSENT"; echo "C211_PROBE_END job=job-mi35x1-01 nonce=$NONCE"; exit 0; fi
          ls -l /dev/kfd 2>/dev/null || true
          ls -l /dev/dri 2>/dev/null | head -20 || true
          echo "--- ROCM-SMI ---"
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi --showuniqueid --showproductname 2>&1 | head -300 || echo ROCM_SMI_FAILED
          else echo ROCM_SMI_ABSENT; fi
          echo "--- AMD-SMI ---"
          if command -v amd-smi >/dev/null 2>&1; then
            amd-smi static --asic 2>&1 | head -400 || echo AMD_SMI_ASIC_FAILED
            amd-smi static 2>&1 | head -400 || echo AMD_SMI_FAILED
          else echo AMD_SMI_ABSENT; fi
          echo "C211_PROBE_END job=job-mi35x1-01 nonce=$NONCE"
          exit 0
