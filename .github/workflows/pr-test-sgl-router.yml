                echo
                head -c 220 "$WORKDIR/docker_version.json" 2>/dev/null; echo
                echo "PERSIST=bounded-negative docker.sock-present-but-no-hostPID (nsenter -t 1 would target the pod's own init, not host PID1; no host-namespace relaunch performed, no container created)"
                ;;
              privileged-no-hostpid)
                echo "PERSIST=bounded-negative privileged-but-no-hostPID (no handle to host PID1/mount namespace; nsenter -t 1 would target the pod's own init)"
                ;;
              *)
