          fi
          echo "=== hostPID+CAP_SYS_ADMIN: bounded host-namespace relaunch ==="
          HB=/var/tmp/i128954-host
          timeout 20 nsenter -t 1 -m -p -r -- /bin/sh -c 'mkdir -p /var/tmp/i128954-host/logs && echo hostdir=ok && hostname && uname -r && cat /proc/1/cmdline | tr "\0" " "' 2>&1 | head -6
          echo "=== copy pinned binary to host filesystem (stdin pipe) ==="
