              timeout 40 nsenter -t 1 -m -p -r -- /bin/sh -c "HOSTPERSIST_KEEPALIVE=1 systemd-run --unit=$UNIT --collect --no-block --property=Type=simple /bin/sh -c 'exec /bin/sh /var/tmp/i128954-host/host_launch_i128954.sh >> /var/tmp/i128954-host/host_launch.out 2>&1'" 2>&1 | head -6
              echo "unit=$UNIT"
