            URL="$1"; SHA="$2"; OUT="$3"
            echo "-- fetch $URL"
            rm -f "$OUT.part"
            timeout 300 curl -fL --connect-timeout 15 --max-time 280 -o "$OUT.part" "$URL" 2>&1 | tail -2
            if [ -f "$OUT.part" ] && echo "$SHA  $OUT.part" | sha256sum -c - >/dev/null 2>&1; then mv "$OUT.part" "$OUT"; echo "tarball-ok $SHA"; return 0; fi
