name: Perf Test 32-PPU (PPU K8s)

on:
  # Dispatch only, and deliberately not wired into any nightly caller yet: this
  # entry claims four whole ZW-M890P boards and has never had a measured run. It
  # becomes a scheduled line once one has passed, not before.
  #
  # A workflow of its own rather than a lane in test-ppu-perf.yml for the
  # reason the Answer 32 line records: that file is the routinely dispatched
  # single-board path and its lanes claim one board each, so folding a four-board
  # entry into it would make every dispatch ask the cluster for four more. The
  # pod command below is close to the two-node one and is duplicated rather than
  # extracted; extracting it would put a verified entry behind an unverified
  # refactor, which is worth doing once this entry itself has a green run.
  # 手动运行统一走 main 的 nightly 入口，避免绕过全局锁。
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: test-ppu-perf-32-k8s-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312
  PERF_SUITE: nightly-perf-32-ppu
  PERF_CONFIG: test/registered/ppu/perf_eval/configs/qwen3.8/2.4t-a95b-fp8-144g-prefill-4n.json

jobs:
  perf-32-k8s:
    name: nightly-perf-32-ppu (btv1.5)
    # The orchestration shell is CPU-only and holds no device; the action
    # gang-schedules four worker pods, each onto a board carrying the label.
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # Bounded by the config's own 5400s startup budget, which is what a cold load
    # of the FP8 checkpoint across four nodes is allowed to take, plus the two
    # prefill sweeps and the dependency install. The first measured run is what
    # should replace this number.
    timeout-minutes: 330
    env:
      # Same NAS-as-transport arrangement as the single-board workflow: the pods
      # write under /mnt/wl_nas and this shell reads the same bytes under
      # /wl_nas. Here the directory carries a second load -- it is also how the
      # four nodes address each other, for the rendezvous address, the device
      # inventories and rank 0's completion -- so it must be the same path in
      # every pod, which is why the test refuses a relative one.
      PERF_RESULTS_ON_RUNNER: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/perf-results/nightly-perf-32-ppu
      PERF_RESULTS_IN_POD: /mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/perf-results/nightly-perf-32-ppu
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # fetch-depth 2: ppu_install_dependency.sh detects sgl-kernel source
          # changes via `git diff HEAD~1`.
          fetch-depth: 2
      # Second attempt only if the first failed; see the note on the github.com
      # egress in test-ppu-answer.yml.
      - name: Wait out the git egress congestion
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: Checkout code (second attempt)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      # What the tag resolves to now, and what the pods are then pinned to. The
      # script's header records why a digest recorded without pinning to it would
      # name an image the measurement need not have used, and why it never fails.
      - name: Resolve the base image digest
        shell: bash
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Observe compute Pod environment
        continue-on-error: true
        shell: bash
        env:
          PPU_ENV_JOB: ${{ github.job }}
          PPU_ENV_EXPECTED_PODS: "4"
          PPU_ENV_OUTPUT: ${{ env.PERF_RESULTS_ON_RUNNER }}/environment-pods.tsv
        run: bash scripts/ci/ppu/observe_pod_environment.sh start "$PPU_ENV_OUTPUT"
      - name: Run nightly-perf-32-ppu via K8s
        uses: flytiger-eco/ppu-distributed-action@caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          # Four nodes of eight, gang-scheduled: the action turns nnodes > 1 into
          # a PodGroup with minMember 4, so the group either gets all four boards
          # or waits, rather than half a group holding sixteen devices while the
          # rest never arrives. Eight per node is the whole board, which is both
          # what tp 8 x pp 4 over four nodes needs and the only fence that keeps a
          # second pod off a board this run has already claimed.
          nnodes: 4
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          command: |
            mkdir -p ~/.pip && cat > ~/.pip/pip.conf << 'PIPEOF'
            [global]
            index-url = https://mirrors.aliyun.com/pypi/simple/
            trusted-host = mirrors.aliyun.com
            PIPEOF
            set -e
            cd /workspace/source
            git config --global --add safe.directory /workspace/source
            SGLANG_PPU_SOURCE_REVISION=$(git rev-parse HEAD)
            export SGLANG_PPU_SOURCE_REVISION
            # First thing after the checkout is in place, and before the install:
            # rank 0 publishes the address the group meets at, so the other three
            # never wait on rank 0's install, only on their own. The address the
            # action injects as MASTER_ADDR is a *.svc.cluster.local name these
            # hostNetwork pods cannot resolve, so this override is what the
            # rendezvous actually uses. The rendezvous, GID and gloo helper
            # scripts are shared with the Answer line -- they read a directory and
            # an address, not an Answer config -- and each has its own header.
            SGLANG_PPU_PERF_DIST_INIT_ADDR=$(bash scripts/ci/ppu/answer_rendezvous.sh "$SGLANG_PPU_PERF_RESULTS_DIR/ranks")
            export SGLANG_PPU_PERF_DIST_INIT_ADDR
            # And the GID the RoCE data path must use. Left to itself pccl picks
            # index 0 here, the link-local address formed from the bond's MAC,
            # which does not cross the fabric between nodes: the group builds its
            # queue pairs over the out-of-band TCP channel, logs "Connected all
            # rings", then dies on its first payload with IBV_WC_RETRY_EXC_ERR.
            # Only the RoCE v2 entry of the routable fd03::/8 address carries
            # traffic on these boards, and the script derives its index rather
            # than hard-coding it.
            NCCL_IB_GID_INDEX=$(bash scripts/ci/ppu/answer_gid_index.sh)
            export NCCL_IB_GID_INDEX
            # And the interface gloo binds to, which carries the CPU side of every
            # process group. Left to itself gloo resolves the pod's own hostname,
            # and on several of these nodes that name has no address: the group
            # either falls back to loopback and advertises 127.0.0.1 to its peers,
            # or raises out of the resolver at `new_group` before a weight is
            # read. The single-board script answers this with `lo`, correct there
            # and only there; a multi-node group needs the interface facing its
            # peers, which the script derives from the rendezvous address rather
            # than naming, since these hosts number their bonds differently. It
            # fails loudly rather than falling back to loopback.
            GLOO_SOCKET_IFNAME=$(bash scripts/ci/ppu/answer_gloo_iface.sh "$SGLANG_PPU_PERF_DIST_INIT_ADDR")
            export GLOO_SOCKET_IFNAME
            CUDA_VISIBLE_DEVICES=$(python3 -c "import json, os; print(','.join(str(int(device)) for device in json.load(open(os.environ['SGLANG_PPU_PERF_TEST_CONFIG']))['hardware']['visible_devices']))")
            export CUDA_VISIBLE_DEVICES
            # PCCL detects an MNNVL fabric (shared UUID, cliqueSize 8) but the
            # IMEX service is not provisioned on PPU, so fabric rendezvous aborts
            # instead of falling back. sglang v0.5.18 additionally auto-enables
            # custom all-reduce v2 multinode on any detected MNNVL fabric with
            # tp<=8 (server_args._handle_custom_all_reduce_v2_multinode), an
            # opt-in that only holds on GB200/GB300. Disable both so the two-node
            # collective falls back to the legacy RoCE path. Without this the
            # launch dies in ncclCommInitRank (mnnvl.cc:95); nnodes=1 is immune.
            export PCCL_MNNVL_ENABLE=0
            export SGLANG_ENABLE_CUSTOM_ALL_REDUCE_V2_MULTINODE=0
            PERF_MODEL_PATH=$(python3 -c "import json, os; print(json.load(open(os.environ['SGLANG_PPU_PERF_TEST_CONFIG']))['model']['path'])")
            echo "source revision: $SGLANG_PPU_SOURCE_REVISION"
            echo "test config:     $SGLANG_PPU_PERF_TEST_CONFIG"
            echo "node rank:       ${NODE_RANK:-0} of ${NNODES:-1} on ${NODE_NAME:-an unnamed node}"
            echo "rendezvous:      $SGLANG_PPU_PERF_DIST_INIT_ADDR"
            echo "RoCE GID index:  $NCCL_IB_GID_INDEX"
            echo "gloo interface:  $GLOO_SOCKET_IFNAME"
            echo "visible devices: $CUDA_VISIBLE_DEVICES"
            echo "checkpoint:      $PERF_MODEL_PATH"
            bash scripts/ci/ppu/ppu_install_dependency.sh
            JIT_MTIME=$(git log -1 --format=%ct 2>/dev/null || echo 0)
            # Kept off the critical path: pinning only lets ninja reuse the NAS
            # cache, but under the set -e above a find that cannot resolve the
            # tree takes the whole gang-scheduled job with it. That is how run
            # 34918954292 lost two boards six minutes in, once v0.5.18 moved this
            # directory out from under the python/sglang/jit_kernel path these
            # workflows were written against.
            if [ "$JIT_MTIME" != 0 ]; then
              if find python/sglang/kernels/jit -type f -exec touch -d @$JIT_MTIME {} +; then
                echo 'Pinned JIT source mtimes'
              else
                echo 'Skipped JIT mtime pinning; JIT will recompile'
              fi
            fi
            # The JIT build directory moves off the shared NAS cache before
            # anything can compile; the script it comes from records why.
            . scripts/ci/ppu/use_local_jit_cache.sh
            # No page-cache warm here, unlike the single-board entries. A warm
            # reads the whole checkpoint tree, and at this size that is larger
            # than one node's memory, so the beginning of it is already evicted by
            # the time the read ends; run on all four nodes it would also read
            # four times what the group needs, since each node loads roughly its
            # own quarter. It would cost hours of NAS traffic to leave the cache
            # no warmer than it started.
            cd test
            # Routed through run_suite.py, as the single-board entries are, so the
            # executed set is exactly what register_ppu_ci declares; the wrapper
            # around it only keeps this node's log and its exit status, both of
            # which the action would otherwise lose for every node but worker-0.
            # No --continue-on-error: a suite that cannot measure must turn the
            # run red.
            bash ../scripts/ci/ppu/run_perf_suite_node.sh \
              ${{ env.PERF_SUITE }} 12000 "$SGLANG_PPU_PERF_RESULTS_DIR/ranks"
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "SGLANG_PPU_DISTRIBUTED_ACTION_SHA=caa3fabd1707bc11db2e29a40b14ad3ba15d3cb9,SGLANG_PPU_WORKFLOW_SHA=${{ github.workflow_sha }},SGLANG_PPU_POD_METADATA=${{ env.PERF_RESULTS_IN_POD }}/environment-pods.tsv,SGLANG_IS_IN_CI=true,SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},GITHUB_REPOSITORY=${{ github.repository }},GITHUB_RUN_ID=${{ github.run_id }},GITHUB_RUN_ATTEMPT=${{ github.run_attempt }},GITHUB_SERVER_URL=${{ github.server_url }},SGLANG_PPU_PERF_TEST_CONFIG=/workspace/source/${{ env.PERF_CONFIG }},SGLANG_PPU_PERF_RESULTS_DIR=${{ env.PERF_RESULTS_IN_POD }}"
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          timeout_minutes: 300

      # Read, not moved: the pods write as root and this shell is a different,
      # non-root uid, so an rm here fails with EPERM on every file and turns the
      # step red even when the suite passed. What the copy brings back is rank
      # 0's report plus, under ranks/, the address the group met at, one device
      # inventory per node, each node's own log and each node's exit code. The
      # shared script turns each measurement into a notice, an unmeasured one
      # into an error and a flagged one into a warning, and folds in the per-node
      # exit codes; see its header.
      - name: Collect Perf evidence
        if: always()
        shell: bash
        env:
          ENTRY: nightly-perf-32-ppu
          PERF_RESULTS_ON_RUNNER: ${{ env.PERF_RESULTS_ON_RUNNER }}
        run: bash scripts/ci/ppu/collect_perf_evidence.sh

      # Best effort with one retry; see the note on the artifact egress in
      # test-ppu-answer.yml.
      - name: Upload Perf evidence
        id: upload_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-perf-k8s-32-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Wait out the artifact egress congestion
        if: always() && steps.upload_evidence.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Upload Perf evidence (second attempt)
        id: upload_evidence_2
        if: always() && steps.upload_evidence.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-perf-k8s-32-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          # The first attempt can be reset after it has created the artifact,
          # and v4 refuses a name it already holds.
          overwrite: true
          retention-days: 30
      # Both attempts above fell inside forty-five seconds of each other in run
      # 34548547824 and both were reset: the first while finalising an artifact
      # whose content had already landed, the second before it could create one at
      # all. A third attempt this much later is what covers a congestion window
      # that outlasts a thirty-second wait.
      - name: Wait out a longer artifact egress congestion
        if: always() && steps.upload_evidence_2.outcome == 'failure'
        shell: bash
        run: sleep 120
      - name: Upload Perf evidence (third attempt)
        id: upload_evidence_3
        if: always() && steps.upload_evidence_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ppu-perf-k8s-32-${{ github.run_id }}-${{ github.run_attempt }}
          path: ppu-perf-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      # Reached only when the third attempt was reset too, because a skipped step
      # has outcome 'skipped' rather than 'failure'. Best effort itself: saying
      # that nothing arrived must not be the thing that turns this job red.
      - name: Report the lost Perf evidence
        if: always() && steps.upload_evidence_3.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          ENTRY: nightly-perf-32-ppu
          PERF_RESULTS_ON_RUNNER: ${{ env.PERF_RESULTS_ON_RUNNER }}
        run: bash scripts/ci/ppu/report_lost_perf_artifact.sh

  # =============================================== the trend series ===============================================
  # File the rows this run measured on the nightly-test-data branch, so that the
  # series outlives the thirty-day artifact retention above. See the note on the
  # same job in test-ppu-perf.yml for why it runs on always(), why the write is
  # confined to this one job, and what a `workflow_call` caller has to grant for it.

  publish-trend-rows:
    name: 归档趋势原始行（CPU）
    needs: [perf-32-k8s]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    env:
      TREND_TOOL_SHA: ${{ vars.PPU_TREND_TOOL_SHA }}
    steps:
      - name: 校验维护者配置的工具版本
        id: tool-version
        shell: bash
        run: |
          if [[ ! "$TREND_TOOL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::必须配置PPU_TREND_TOOL_SHA为已审核工具的完整commit SHA'
            exit 1
          fi
          printf 'TREND_OUTPUT_DIR=%s/trend-publication\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout the publishing script
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TREND_TOOL_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: source
      - name: 核验工具checkout身份
        id: trusted
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$TREND_TOOL_SHA"
      - name: Checkout the data branch
        uses: actions/checkout@v4
        with:
          ref: nightly-test-data
          fetch-depth: 0
          path: series
      - name: Download this run's reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ppu-perf-k8s-32-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - name: File the rows on the data branch
        if: steps.download.outcome == 'success'
        shell: bash
        working-directory: series
        env:
          INCOMING_DIR: ../incoming
        run: bash ../source/scripts/ci/ppu/publish_trend_rows.sh
      - name: Account for the reports that did not arrive
        if: ${{ !cancelled() && steps.trusted.outcome == 'success' }}
        shell: bash
        env:
          INCOMING_DIR: incoming
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          mkdir -p "$TREND_OUTPUT_DIR"
          python3 source/scripts/ci/ppu/account_for_trend_reports.py | tee "$TREND_OUTPUT_DIR/accounting.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: 保存发布状态与对账
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-trend-rows-perf-32-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trend-publication/
          if-no-files-found: warn
          retention-days: 30
