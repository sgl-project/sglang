name: Slash Command Handler Test

on:
  pull_request:
    paths:
      - ".github/workflows/slash-command-handler-test.yml"
      - ".github/workflows/*-test-npu.yml"
      - "scripts/ci/utils/*slash_command_handler.py"
      - "scripts/ci/npu_suites.py"
      - "scripts/ci/partition_rerun_tests.py"
      - "scripts/ci/runner_configs.*"
      - "python/sglang/test/ci/ci_register.py"

permissions: {}

jobs:
  slash-command-handler-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - run: python -m unittest discover -s scripts/ci/utils -p 'test_slash_command_handler.py'
