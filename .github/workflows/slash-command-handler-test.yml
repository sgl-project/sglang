name: Slash Command Handler Test

on:
  pull_request:
    paths:
      - ".github/workflows/slash-command-handler-test.yml"
      - "scripts/ci/utils/slash_command_handler.py"
      - "scripts/ci/utils/test_slash_command_handler.py"
      - "scripts/ci/partition_rerun_tests.py"
      - "scripts/ci/runner_configs.py"
      - "scripts/ci/runner_configs.yml"
      - "scripts/ci/npu_suites.py"
      - "scripts/ci/amd_suites.py"
      - "python/sglang/test/ci/ci_register.py"
      - ".github/workflows/rerun-test.yml"
      - ".github/workflows/pr-test-npu.yml"
      - ".github/workflows/nightly-test-npu.yml"
      - ".github/workflows/full-test-npu.yml"
      - ".github/workflows/_npu-pr-test-stage.yml"
      - ".github/workflows/_npu-single-node-test-stage.yml"
      - ".github/workflows/pr-test-amd.yml"
      - ".github/workflows/pr-test-amd-extra.yml"
      - ".github/actions/setup-amd-ci/action.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: slash-command-handler-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  slash-command-handler-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Test the /rerun-test handler
        run: python -m unittest discover -s scripts/ci/utils -p 'test_slash_command_handler.py'
