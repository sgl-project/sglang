name: PR gate isolation proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  proof:
    name: PR-controlled gate proof
    runs-on: ubuntu-latest
    steps:
      - name: Emit proof marker
        run: |
          echo "SGLANG_PR_GATE_PROOF=${{ github.event.pull_request.head.sha }}"
          echo "This workflow intentionally defines no self-hosted or GPU jobs."
