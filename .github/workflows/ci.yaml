name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  # The GITHUB_TOKEN's scopes narrow down the workflow_call chain, so the
  # pr-gate job inside pr-test-ppu.yml needs this declared here to list
  # workflow runs for its cooldown check.
  actions: read

concurrency:
  # Metadata events never preempt active CI. A run-ci grant queues in the PR
  # group; other label events and reviews are isolated and do not run PPU work.
  group: >-
    ci-${{ github.event.pull_request.number }}-${{ github.event_name }}-${{
    ((github.event_name == 'pull_request_review' &&
    (github.event.review.state != 'approved' || github.event.review.user.type == 'Bot')) ||
    (github.event_name == 'pull_request' &&
    (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
    !(github.event.action == 'labeled' && github.event.label.name == 'run-ci'))) && github.run_id || 'active' }}
  # Only code-affecting events preempt active CI; metadata transitions such as
  # ready_for_review/converted_to_draft must not cancel running jobs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && github.run_attempt == 1 }}

jobs:
  # Stage 1: 密钥扫描预检（组织级 reusable workflow）
  precheck:
    name: Pre-check
    if: >-
      (github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-ci'))) ||
      (github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' && github.event.review.user.type != 'Bot')
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  # Stage 2: 注册完整性校验与 AI 评审并行
  registration-validation:
    name: Registration Validation
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registered tests
        run: python3 scripts/lint/check_registered_tests.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CI filter test dependencies
        run: |
          python3 -m pip install PyYAML==6.0.3 pytest==8.3.5
          npm install --prefix "$RUNNER_TEMP/ppu-ci-filter-tests" \
            --ignore-scripts --no-save --no-package-lock --no-audit --no-fund \
            picomatch@2.3.1 minimatch@9.0.5
      - name: Validate CI path filters and authorization contracts
        env:
          NODE_PATH: ${{ runner.temp }}/ppu-ci-filter-tests/node_modules
        run: python3 -m unittest discover -s scripts/ci/utils/tests -p 'test_run_ci_*.py' -v

  # CPU validation runs without run-ci or private worker credentials. Reuse the
  # same path selector as hardware CI so documentation-only PRs skip the suite.
  e2e-selection:
    name: PPU E2E Selection
    needs: precheck
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-ci'))
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.select.outputs.requested }}
      ready: ${{ steps.select.outputs.ready }}
      authorized: ${{ steps.select.outputs.authorized }}
      plan_hash: ${{ steps.select.outputs.plan_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate authorized immutable E2E plan
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ppu/select_pr_e2e.py plan --plan selection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-e2e-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: selection.json
          if-no-files-found: error
          # Phases run serially, so a maximal plan can need ~16 days of wall
          # time; retention must outlive the worst-case selectable budget.
          retention-days: 30

  cpu-precheck:
    name: CPU Shortlist
    needs: [precheck, e2e-selection]
    if: github.event_name == 'pull_request' && needs.e2e-selection.outputs.ready == 'true'
    uses: ./.github/workflows/pr-test-ppu.yml
    with:
      cpu_only: true
      e2e_requested: ${{ needs.e2e-selection.outputs.requested == 'true' }}
      e2e_plan_hash: ${{ needs.e2e-selection.outputs.plan_hash }}

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # Stage 3: 人工审批门禁
  human-review:
    name: Human Review Gate
    needs: [registration-validation, ai-code-review]
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # Stage 4: Full PPU CI. The run-ci label authorizes PPU consumption;
  # Registration Validation remains the technical prerequisite. Human Review
  # is an independent merge gate and does not delay PPU feedback.
  # For labeled events, only adding run-ci starts Full CI; adding another label
  # to a PR that already has run-ci must not create a duplicate run.
  # The selected CPU suite must also pass, including evidence validation. Only
  # reuse its result from this workflow run; do not trust a previous PR revision.
  ci:
    name: Full CI
    needs: [registration-validation, cpu-precheck, e2e-selection]
    if: >-
      github.event_name == 'pull_request' &&
      needs.e2e-selection.outputs.authorized == 'true'
    uses: ./.github/workflows/pr-test-ppu.yml
    with:
      cpu_precheck_result: ${{ needs.cpu-precheck.result }}
      cpu_precheck_evidence_ok: ${{ needs.cpu-precheck.outputs.cpu_evidence_ok }}
      cpu_precheck_identity: ${{ needs.cpu-precheck.outputs.cpu_identity }}
      e2e_requested: ${{ needs.e2e-selection.outputs.requested == 'true' }}
      e2e_plan_hash: ${{ needs.e2e-selection.outputs.plan_hash }}
    secrets: inherit

  e2e-gate:
    # An irrelevant event must not create a competing successful required check.
    name: >-
      ${{ github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-ci')) &&
      'PPU E2E Gate' || 'PPU E2E Ignored Event' }}
    needs: [precheck, e2e-selection, cpu-precheck, ci]
    if: >-
      always() && github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-e2e-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require requested E2E completion even if Full CI was skipped
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ppu/pr_e2e_report.py outer --plan selection.json
