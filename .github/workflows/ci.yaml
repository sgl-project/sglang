name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Reviews need separate groups: they cannot replace Full CI runs they cancel.
  group: >-
    ci-${{ github.event.pull_request.number }}-${{
    (github.event_name == 'pull_request_review' ||
    (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
    github.event.label.name != 'run-ci')) && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  # Stage 1: 密钥扫描预检（组织级 reusable workflow）
  precheck:
    name: Pre-check
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'approved' && github.event.review.user.type != 'Bot')
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  # Stage 2: 注册完整性校验与 AI 评审并行
  registration-validation:
    name: Registration Validation
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registered tests
        run: python3 scripts/lint/check_registered_tests.py

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # Stage 3: 人工审批门禁
  human-review:
    name: Human Review Gate
    needs: [registration-validation, ai-code-review]
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # Stage 4: Full PPU CI. The run-ci label authorizes PPU consumption;
  # Registration Validation remains the technical prerequisite. Human Review
  # is an independent merge gate and does not delay PPU feedback.
  # For labeled events, only adding run-ci starts Full CI; adding another label
  # to a PR that already has run-ci must not create a duplicate run.
  ci:
    name: Full CI
    needs: registration-validation
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'run-ci')
    uses: ./.github/workflows/pr-test-ppu.yml
    secrets: inherit
