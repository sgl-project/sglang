name: c211-i124384-probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  probe-4xh100:
    runs-on: 4-gpu-h100
    timeout-minutes: 12
    steps:
      - name: fingerprint
        env:
          NONCE: c211-i124384-23f7daf57dee7230
        run: |
          set -u
          echo "C211_PROBE_BEGIN job=probe-4xh100 nonce=$NONCE"
          echo "C211_MARKER job=probe-4xh100 nonce=$NONCE host=$(hostname) uid=$(id -u) user=$(id -un)"
          id
          uname -a
          echo "--- nvidia-smi -L ---"
          nvidia-smi -L 2>&1 || echo "NVIDIA_SMI_L_FAILED"
          echo "--- nvidia-smi query ---"
          nvidia-smi --query-gpu=index,uuid,name,driver_version,memory.total --format=csv,noheader 2>&1 || echo "NVIDIA_SMI_Q_FAILED"
          echo "--- dev nodes ---"
          ls -l /dev/nvidia* 2>&1 | head -30 || true
          echo "--- IMDSv2/STS fingerprint ---"
          python3 -c "import base64;exec(base64.b64decode('').decode())" || echo "PY_PROBE_FAILED"
          echo "C211_PROBE_END job=probe-4xh100 nonce=$NONCE"
