name: Slash Command Handler

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write # Required to add labels and reactions
  actions: write       # Required to rerun workflows
  issues: write        # Required for comment reactions in some contexts
  statuses: write      # Required to record the per-commit run-ci approval

jobs:
  slash_command:
    # Only run if it is a PR and the comment contains a recognized command
    # Use contains() since startsWith() can't handle leading whitespace/newlines
    #
    # The trailing startsWith() namespace clauses admit *unrecognized* commands
    # so the script can answer them; they are startsWith() because
    # contains('/run-') would fire on any comment quoting `scripts/run-tests.sh`.
    if: >
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/tag-run-ci-label') ||
       contains(github.event.comment.body, '/rerun-failed-ci') ||
       contains(github.event.comment.body, '/tag-and-rerun-ci') ||
       contains(github.event.comment.body, '/run-ci') ||
       contains(github.event.comment.body, '/run-full-ci') ||
       contains(github.event.comment.body, '/run-extra-ci') ||
       contains(github.event.comment.body, '/run-cpu-ci') ||
       contains(github.event.comment.body, '/rerun-group') ||
       contains(github.event.comment.body, '/rerun-test') ||
       startsWith(github.event.comment.body, '/tag-') ||
       startsWith(github.event.comment.body, '/rerun-') ||
       startsWith(github.event.comment.body, '/run-'))
    runs-on: ubuntu-latest

    steps:
      # SECURITY: This workflow runs on issue_comment with a write token
      # (pull-requests, actions, issues). Every file it executes or trusts
      # (this handler, scripts/ci/*, .github/CI_PERMISSIONS.json) must come from
      # the default branch, never from the PR: a PR can edit any of them, and a
      # routine maintainer comment would otherwise run that code with this token.
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # /rerun-test and /rerun-group resolve test paths under test/, so new
      # tests in the PR must be visible. Bring in the PR's test/ tree as plain
      # files only; nothing below imports or executes anything from it.
      - name: Overlay PR test files (data only)
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          if git cat-file -e refs/remotes/pr/head:test 2>/dev/null; then
            rm -rf test
            git checkout refs/remotes/pr/head -- test
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install PyGithub PyYAML

      - name: Handle Slash Command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          USER_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ACTION: ${{ github.event.action }}
        run: |
          python scripts/ci/utils/slash_command_handler.py
