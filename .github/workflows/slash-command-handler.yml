name: Slash Command Handler

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write # Required to add labels and reactions
  actions: write       # Required to rerun workflows
  issues: write        # Required for comment reactions in some contexts

jobs:
  slash_command:
    # Only run if it is a PR and the comment contains a recognized command
    # Use contains() since startsWith() can't handle leading whitespace/newlines
    #
    # The trailing startsWith() namespace clauses admit *unrecognized* commands
    # so the script can answer them; they are startsWith() because
    # contains('/run-') would fire on any comment quoting `scripts/run-tests.sh`.
    if: >
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/tag-run-ci-label') ||
       contains(github.event.comment.body, '/rerun-failed-ci') ||
       contains(github.event.comment.body, '/tag-and-rerun-ci') ||
       contains(github.event.comment.body, '/run-full-ci') ||
       contains(github.event.comment.body, '/run-extra-ci') ||
       contains(github.event.comment.body, '/rerun-full-ci') ||
       contains(github.event.comment.body, '/rerun-extra-ci') ||
       contains(github.event.comment.body, '/rerun-group') ||
       contains(github.event.comment.body, '/rerun-test') ||
       startsWith(github.event.comment.body, '/tag-') ||
       startsWith(github.event.comment.body, '/rerun-') ||
       startsWith(github.event.comment.body, '/run-'))
    runs-on: ubuntu-latest

    steps:
      # SECURITY: issue_comment runs with pull-requests/actions write access.
      # Always execute handler code from the trusted default branch; never run
      # a PR head with this token, including same-repository PR heads.
      - name: Checkout trusted handler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install PyGithub PyYAML

      - name: Handle Slash Command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          USER_LOGIN: ${{ github.event.comment.user.login }}
        run: |
          python scripts/ci/utils/slash_command_handler.py
