name: PR Gate Approve
# Its own workflow, not a labeled trigger on pr-test.yml: a label event there would join
# the run's concurrency group and cancel a GPU run in progress.

on:
  pull_request_target:
    types: [labeled]
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  approve:
    if: github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write # re-run the gated runs of run_ci_approval.APPROVAL_WORKFLOWS
      contents: read
      pull-requests: read
      statuses: write # record ci/run-ci-approved
    steps:
      # The default ref of pull_request_target is the base branch; the PR is never checked out.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts/ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyGithub

      - name: Approve the head commit and run CI on it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: python scripts/ci/utils/run_ci_approval.py
