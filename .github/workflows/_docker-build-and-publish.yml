name: Build and Publish Volcengine Docker Image

# Reusable workflow: builds one amd64 CUDA image variant and publishes the
# matching Volcengine CR tag. Callers use a matrix when multiple variants are
# needed, so the Docker build command stays in one file.

on:
  workflow_call:
    inputs:
      docker_target:
        description: "Dockerfile target stage"
        required: true
        type: string
      cuda_key:
        description: "Logical CUDA tag key, e.g. cu130"
        required: false
        type: string
        default: "cu130"
      cuda_version:
        description: "CUDA_VERSION build arg"
        required: false
        type: string
        default: "13.0.1"
      sgl_version:
        description: "Version string passed as SGL_VERSION build arg"
        required: false
        type: string
        default: ""
      extra_build_args:
        description: "Additional --build-arg flags appended to docker buildx build"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      tag_config:
        description: "Deprecated compatibility input; Volcengine tags are generated from tag_mode."
        required: false
        type: string
        default: ""
      tag_mode:
        description: "Tag mode passed to scripts/ci/get_volcengine_image_tag.py"
        required: false
        type: string
        default: "version"
      tag_value:
        description: "Tag value passed for version-mode Volcengine tags"
        required: false
        type: string
        default: ""
      image_tag_override:
        description: "Optional fully resolved image tag to publish instead of generating one"
        required: false
        type: string
        default: ""
      variant_suffix:
        description: "Optional variant suffix appended before CUDA suffix"
        required: false
        type: string
        default: ""
      cuda_suffix:
        description: "Optional CUDA suffix appended to Volcengine tags"
        required: false
        type: string
        default: ""
      publish_default_cuda_alias:
        description: "Also publish an unsuffixed default tag for this CUDA variant"
        required: false
        type: boolean
        default: false
      use_environment:
        description: "GitHub environment name (e.g. prod) or empty for none"
        required: false
        type: string
        default: ""
      registry_host:
        description: "Volcengine CR registry host"
        required: false
        type: string
        default: ""
      image_repo:
        description: "Full Volcengine CR image repository"
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Optional local sgl-kernel wheel artifact name"
        required: false
        type: string
        default: ""
      image_formats:
        description: "CSV of image formats to build and push. Default builds all three (oci,zstd,nydus); pass a subset to narrow."
        required: false
        type: string
        default: "oci,zstd,nydus"
      verify_image:
        description: "Run in-container provenance/runtime verification after each pushed image. Default true. Callers that build a source tree without the ep_main runtime smoke tests (e.g. the deepseek_v4 nightly) pass false; provenance labels/env are still baked into the image regardless."
        required: false
        type: boolean
        default: true

jobs:
  build-and-publish:
    if: github.repository == 'bytedance-iaas/sglang'
    environment: ${{ inputs.use_environment || null }}
    runs-on: x64-docker-build-node
    env:
      CUDA_KEY: ${{ inputs.cuda_key }}
      CUDA_SUFFIX: ${{ inputs.cuda_suffix }}
      IMAGE_FORMATS: ${{ inputs.image_formats }}
      IMAGE_REPO: ${{ inputs.image_repo }}
      PUBLISH_DEFAULT_CUDA_ALIAS: ${{ inputs.publish_default_cuda_alias }}
      REGISTRY_HOST: ${{ inputs.registry_host }}
      SGL_VERSION: ${{ inputs.sgl_version }}
      TAG_MODE: ${{ inputs.tag_mode }}
      TAG_VALUE: ${{ inputs.tag_value }}
      IMAGE_TAG_OVERRIDE: ${{ inputs.image_tag_override }}
      VARIANT_SUFFIX: ${{ inputs.variant_suffix }}
      VOLCENGINE_CR_REGISTRY: ${{ vars.VOLCENGINE_CR_REGISTRY }}
      VOLCENGINE_CR_NAMESPACE: ${{ vars.VOLCENGINE_CR_NAMESPACE }}
      VOLCENGINE_CR_REPOSITORY: ${{ vars.VOLCENGINE_CR_REPOSITORY || 'sglang' }}
      VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
      VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Cleanup workspace (remove root-owned files from prior runs)
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve Volcengine publish target
        run: |
          set -euo pipefail

          if [ -z "${IMAGE_REPO}" ]; then
            if [ -z "${VOLCENGINE_CR_REGISTRY}" ] || [ -z "${VOLCENGINE_CR_NAMESPACE}" ]; then
              echo "::error::Volcengine CR variables are required: VOLCENGINE_CR_REGISTRY and VOLCENGINE_CR_NAMESPACE"
              exit 1
            fi
            IMAGE_REPO="${VOLCENGINE_CR_REGISTRY}/${VOLCENGINE_CR_NAMESPACE}/${VOLCENGINE_CR_REPOSITORY:-sglang}"
          fi

          if [ -z "${REGISTRY_HOST}" ] && [ -n "${VOLCENGINE_CR_REGISTRY}" ] && [[ "${IMAGE_REPO}" == "${VOLCENGINE_CR_REGISTRY}/"* ]]; then
            REGISTRY_HOST="${VOLCENGINE_CR_REGISTRY}"
          fi

          if [ -z "${IMAGE_REPO}" ] || [[ "${IMAGE_REPO}" == /* ]] || [[ "${IMAGE_REPO}" == *'//'* ]]; then
            echo "::error::Invalid image repository: '${IMAGE_REPO}'"
            exit 1
          fi

          echo "IMAGE_REPO=${IMAGE_REPO}" >> "${GITHUB_ENV}"
          echo "REGISTRY_HOST=${REGISTRY_HOST}" >> "${GITHUB_ENV}"
          echo "Resolved image repository ${IMAGE_REPO}"

      - name: Resolve Volcengine image tag
        id: image-tag
        run: |
          set -euo pipefail
          resolve_tag() {
            local cuda_suffix="$1"
            local tag_cmd=(python3 scripts/ci/get_volcengine_image_tag.py --mode "${TAG_MODE}")
            if [ -n "${TAG_VALUE}" ]; then
              tag_cmd+=(--tag-value "${TAG_VALUE}")
            fi
            if [ -n "${VARIANT_SUFFIX}" ]; then
              tag_cmd+=(--variant-suffix "${VARIANT_SUFFIX}")
            fi
            if [ -n "${cuda_suffix}" ]; then
              tag_cmd+=(--cuda-suffix "${cuda_suffix}")
            fi
            "${tag_cmd[@]}"
          }

          IMAGE_TAGS=()
          if [ -n "${IMAGE_TAG_OVERRIDE}" ]; then
            IMAGE_TAGS+=("${IMAGE_TAG_OVERRIDE}")
          elif [ "${PUBLISH_DEFAULT_CUDA_ALIAS}" = "true" ]; then
            IMAGE_TAGS+=("$(resolve_tag "")")
            IMAGE_TAGS+=("$(resolve_tag "${CUDA_SUFFIX}")")
          else
            IMAGE_TAGS+=("$(resolve_tag "${CUDA_SUFFIX}")")
          fi

          {
            echo "image-tags<<EOF"
            printf '%s\n' "${IMAGE_TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate requested image formats
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          raw = os.environ.get("IMAGE_FORMATS", "oci,zstd,nydus")
          tokens = [token.strip() for token in raw.split(",") if token.strip()]
          if not tokens:
              tokens = ["oci", "zstd", "nydus"]
          allowed = {"oci", "zstd", "nydus"}
          unknown = [token for token in tokens if token not in allowed]
          if unknown:
              print(
                  f"::error::unknown image_formats tokens: {unknown}; "
                  f"allowed: {sorted(allowed)}"
              )
              sys.exit(1)
          print(f"Requested image formats: {tokens}")
          PY

      - name: Compute Docker build metadata args
        id: build-metadata
        env:
          IMAGE_TAGS: ${{ steps.image-tag.outputs.image-tags }}
        run: |
          set -euo pipefail
          BUILD_COMMIT="$(git rev-parse HEAD)"
          BUILD_TREE="$(git rev-parse HEAD^{tree})"
          PYTHON_MANIFEST_SHA256="$(python3 - <<'PY'
          import hashlib
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "python"]
          ).split(b"\0")
          digest = hashlib.sha256()
          for raw_path in sorted(path for path in paths if path):
              digest.update(raw_path)
              digest.update(b"\0")
              with open(raw_path, "rb") as source_file:
                  digest.update(hashlib.sha256(source_file.read()).digest())
          print(digest.hexdigest())
          PY
          )"
          BUILD_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TAG_CONFIG="$(CUDA_KEY="${CUDA_KEY}" IMAGE_TAGS="${IMAGE_TAGS}" python3 -c 'import json, os; tags = [tag for tag in os.environ["IMAGE_TAGS"].splitlines() if tag]; print(json.dumps([{"cuda": os.environ["CUDA_KEY"], "tags": tags}], separators=(",", ":")))')"
          python3 scripts/ci/utils/docker_build_metadata_args.py \
            --cuda "${CUDA_KEY}" \
            --tag-config "${TAG_CONFIG}" \
            --image-repo "${IMAGE_REPO}" \
            --sgl-version "${SGL_VERSION}" \
            --build-commit "${BUILD_COMMIT}" \
            --build-tree "${BUILD_TREE}" \
            --python-manifest-sha256 "${PYTHON_MANIFEST_SHA256}" \
            --build-source "${BUILD_SOURCE}" \
            --build-url "${BUILD_URL}" \
            > /tmp/docker-metadata.args
          {
            echo "build-commit=${BUILD_COMMIT}"
            echo "build-tree=${BUILD_TREE}"
            echo "python-manifest-sha256=${PYTHON_MANIFEST_SHA256}"
            echo "build-source=${BUILD_SOURCE}"
          } >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Prune Docker to reclaim disk space
        run: |
          docker buildx prune --filter "until=72h" -f
          docker system prune -af --filter "until=72h"
          docker volume prune -af

      - name: Download local sgl-kernel wheel
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: .ci-artifacts/sgl-kernel

      - name: Set up Docker Buildx with local Docker Hub mirror
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["127.0.0.1:5000"]

      - name: Login to Volcengine CR
        run: |
          set -euo pipefail
          echo "${VOLCENGINE_CR_PASSWORD}" | docker login "${REGISTRY_HOST}" --username "${VOLCENGINE_CR_USERNAME}" --password-stdin

      - name: Build and push AMD64 image
        id: build
        env:
          IMAGE_TAGS: ${{ steps.image-tag.outputs.image-tags }}
        run: |
          set -euo pipefail
          VERSION_ARG=""
          if [ -n "${SGL_VERSION}" ]; then
            VERSION_ARG="--build-arg SGL_VERSION=${SGL_VERSION}"
          fi
          mapfile -t METADATA_ARGS < /tmp/docker-metadata.args

          # When a zstd re-export will follow, export a full (mode=max) registry
          # build cache so the zstd step can re-use these freshly built layers
          # instead of recompiling from scratch. The heavy intermediate stages
          # (torch_deps/framework/deepep) reach the final image via COPY --from,
          # so mode=max is required to cache them; mode=min/inline would not.
          # The cache ref is keyed to the resolved primary tag (unique per
          # variant+cuda+run) to avoid collisions across concurrent matrix jobs.
          CACHE_ARGS=()
          if printf '%s' "${IMAGE_FORMATS}" | tr ',' '\n' | grep -qx "zstd"; then
            PRIMARY_TAG=$(printf '%s\n' "${IMAGE_TAGS}" | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
            CACHE_REF="${IMAGE_REPO}:buildcache-${PRIMARY_TAG}"
            echo "cache-ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
            CACHE_ARGS+=(--cache-to "type=registry,ref=${CACHE_REF},mode=max,image-manifest=true,oci-mediatypes=true")
          fi

          docker buildx build \
            --target ${{ inputs.docker_target }} \
            --platform linux/amd64 \
            --output type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true \
            -f docker/Dockerfile \
            --build-arg CUDA_VERSION=${{ inputs.cuda_version }} \
            --build-arg BUILD_TYPE=all \
            --build-arg GRACE_BLACKWELL=0 \
            --build-arg INSTALL_FLASHINFER_JIT_CACHE=1 \
            "${METADATA_ARGS[@]}" \
            ${VERSION_ARG} \
            ${{ inputs.extra_build_args }} \
            "${CACHE_ARGS[@]}" \
            --metadata-file /tmp/metadata.json \
            --no-cache \
            .

          DIGEST=$(python3 -c "import json; print(json.load(open('/tmp/metadata.json'))['containerimage.digest'])")
          echo "Pushed digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Create Volcengine image tag
        env:
          IMAGE_TAGS: ${{ steps.image-tag.outputs.image-tags }}
        run: |
          set -euo pipefail
          mapfile -t image_tags <<< "${IMAGE_TAGS}"
          tag_args=()
          for image_tag in "${image_tags[@]}"; do
            [ -n "${image_tag}" ] || continue
            tag_args+=(-t "${IMAGE_REPO}:${image_tag}")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${IMAGE_REPO}@${{ steps.build.outputs.digest }}"
          for image_tag in "${image_tags[@]}"; do
            [ -n "${image_tag}" ] || continue
            echo "Published ${IMAGE_REPO}:${image_tag}"
          done

      - name: Verify pushed AMD64 image and source provenance
        if: ${{ inputs.verify_image }}
        env:
          EXPECTED_BUILD_COMMIT: ${{ steps.build-metadata.outputs.build-commit }}
          EXPECTED_BUILD_SOURCE: ${{ steps.build-metadata.outputs.build-source }}
          EXPECTED_BUILD_TREE: ${{ steps.build-metadata.outputs.build-tree }}
          EXPECTED_PYTHON_MANIFEST_SHA256: ${{ steps.build-metadata.outputs.python-manifest-sha256 }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_REPO}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "${IMAGE_REF}"
          docker pull "${IMAGE_REF}"

          python3 - "${IMAGE_REF}" <<'PY'
          import json
          import os
          import subprocess
          import sys

          inspect = json.loads(
              subprocess.check_output(["docker", "image", "inspect", sys.argv[1]])
          )[0]
          if inspect["Architecture"] != "amd64":
              raise SystemExit(f"unexpected architecture: {inspect['Architecture']}")
          labels = inspect["Config"].get("Labels") or {}
          expected = {
              "ai.sglang.build.commit": os.environ["EXPECTED_BUILD_COMMIT"],
              "ai.sglang.build.tree": os.environ["EXPECTED_BUILD_TREE"],
              "ai.sglang.build.python-manifest-sha256": os.environ[
                  "EXPECTED_PYTHON_MANIFEST_SHA256"
              ],
              "org.opencontainers.image.source": os.environ["EXPECTED_BUILD_SOURCE"],
          }
          mismatches = {
              key: (labels.get(key), value)
              for key, value in expected.items()
              if labels.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"image provenance mismatch: {mismatches}")
          print(json.dumps({"architecture": inspect["Architecture"], **expected}))
          PY

          docker run --rm \
            -e EXPECTED_BUILD_COMMIT \
            -e EXPECTED_BUILD_TREE \
            -e EXPECTED_PYTHON_MANIFEST_SHA256 \
            --entrypoint bash "${IMAGE_REF}" -lc '
              set -euo pipefail
              test "$SGLANG_BUILD_COMMIT" = "$EXPECTED_BUILD_COMMIT"
              test "$SGLANG_BUILD_TREE" = "$EXPECTED_BUILD_TREE"
              test "$SGLANG_PYTHON_MANIFEST_SHA256" = "$EXPECTED_PYTHON_MANIFEST_SHA256"
              command -v oniond
              python3 scripts/ci/verify_private_image_runtime.py
              python3 -m py_compile scripts/eic_integration_check.py
              python3 -m pytest -q test/registered/unit/test_runtime_context.py -k TestMoeFlagsGroup
              python3 -m pytest -q test/registered/unit/test_model_overrides.py -k deepseek_spec_moe_resolution
            '

      # --- zstd format: re-export the just-built layers with zstd compression,
      # then reuse the same provenance/runtime verification. It pulls the
      # mode=max registry build cache written by the base step (--cache-from),
      # so all intermediate stages are cache hits and only layer compression is
      # redone. The config stays identical to base; only layer compression
      # changes. (Without --cache-from the local BuildKit cache can be evicted
      # between steps by the large image + verify pull, forcing a full rebuild.)
      - name: Build and push AMD64 zstd image
        id: build-zstd
        if: ${{ contains(inputs.image_formats, 'zstd') }}
        run: |
          set -euo pipefail
          VERSION_ARG=""
          if [ -n "${SGL_VERSION}" ]; then
            VERSION_ARG="--build-arg SGL_VERSION=${SGL_VERSION}"
          fi
          mapfile -t METADATA_ARGS < /tmp/docker-metadata.args

          CACHE_FROM_ARGS=()
          if [ -n "${{ steps.build.outputs.cache-ref }}" ]; then
            CACHE_FROM_ARGS+=(--cache-from "type=registry,ref=${{ steps.build.outputs.cache-ref }}")
          fi

          docker buildx build \
            --target ${{ inputs.docker_target }} \
            --platform linux/amd64 \
            --output type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true \
            -f docker/Dockerfile \
            --build-arg CUDA_VERSION=${{ inputs.cuda_version }} \
            --build-arg BUILD_TYPE=all \
            --build-arg GRACE_BLACKWELL=0 \
            --build-arg INSTALL_FLASHINFER_JIT_CACHE=1 \
            "${METADATA_ARGS[@]}" \
            ${VERSION_ARG} \
            ${{ inputs.extra_build_args }} \
            "${CACHE_FROM_ARGS[@]}" \
            --metadata-file /tmp/metadata-zstd.json \
            .

          DIGEST=$(python3 -c "import json; print(json.load(open('/tmp/metadata-zstd.json'))['containerimage.digest'])")
          echo "Pushed zstd digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Create Volcengine zstd image tag
        if: ${{ contains(inputs.image_formats, 'zstd') }}
        env:
          IMAGE_TAGS: ${{ steps.image-tag.outputs.image-tags }}
        run: |
          set -euo pipefail
          mapfile -t image_tags <<< "${IMAGE_TAGS}"
          tag_args=()
          for image_tag in "${image_tags[@]}"; do
            [ -n "${image_tag}" ] || continue
            tag_args+=(-t "${IMAGE_REPO}:${image_tag}-zstd")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${IMAGE_REPO}@${{ steps.build-zstd.outputs.digest }}"
          for image_tag in "${image_tags[@]}"; do
            [ -n "${image_tag}" ] || continue
            echo "Published ${IMAGE_REPO}:${image_tag}-zstd"
          done

      - name: Verify pushed AMD64 zstd image and source provenance
        if: ${{ inputs.verify_image && contains(inputs.image_formats, 'zstd') }}
        env:
          EXPECTED_BUILD_COMMIT: ${{ steps.build-metadata.outputs.build-commit }}
          EXPECTED_BUILD_SOURCE: ${{ steps.build-metadata.outputs.build-source }}
          EXPECTED_BUILD_TREE: ${{ steps.build-metadata.outputs.build-tree }}
          EXPECTED_PYTHON_MANIFEST_SHA256: ${{ steps.build-metadata.outputs.python-manifest-sha256 }}
          IMAGE_DIGEST: ${{ steps.build-zstd.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_REPO}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "${IMAGE_REF}"

          # zstd-compressed layers require Docker Engine >= 23 / containerd >= 1.5
          # to pull and run. If this daemon cannot, degrade to manifest-only
          # inspection (media-type + provenance labels) instead of failing.
          if docker pull "${IMAGE_REF}"; then
            python3 - "${IMAGE_REF}" <<'PY'
          import json
          import os
          import subprocess
          import sys

          inspect = json.loads(
              subprocess.check_output(["docker", "image", "inspect", sys.argv[1]])
          )[0]
          if inspect["Architecture"] != "amd64":
              raise SystemExit(f"unexpected architecture: {inspect['Architecture']}")
          labels = inspect["Config"].get("Labels") or {}
          expected = {
              "ai.sglang.build.commit": os.environ["EXPECTED_BUILD_COMMIT"],
              "ai.sglang.build.tree": os.environ["EXPECTED_BUILD_TREE"],
              "ai.sglang.build.python-manifest-sha256": os.environ[
                  "EXPECTED_PYTHON_MANIFEST_SHA256"
              ],
              "org.opencontainers.image.source": os.environ["EXPECTED_BUILD_SOURCE"],
          }
          mismatches = {
              key: (labels.get(key), value)
              for key, value in expected.items()
              if labels.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"image provenance mismatch: {mismatches}")
          print(json.dumps({"architecture": inspect["Architecture"], **expected}))
          PY

            docker run --rm \
              -e EXPECTED_BUILD_COMMIT \
              -e EXPECTED_BUILD_TREE \
              -e EXPECTED_PYTHON_MANIFEST_SHA256 \
              --entrypoint bash "${IMAGE_REF}" -lc '
                set -euo pipefail
                test "$SGLANG_BUILD_COMMIT" = "$EXPECTED_BUILD_COMMIT"
                test "$SGLANG_BUILD_TREE" = "$EXPECTED_BUILD_TREE"
                test "$SGLANG_PYTHON_MANIFEST_SHA256" = "$EXPECTED_PYTHON_MANIFEST_SHA256"
                command -v oniond
                python3 scripts/ci/verify_private_image_runtime.py
              '
          else
            echo "::warning::daemon cannot pull zstd image; degrading to manifest-only check"
            python3 - "${IMAGE_REF}" <<'PY'
          import json
          import subprocess
          import sys

          raw = subprocess.check_output(
              ["docker", "buildx", "imagetools", "inspect", "--raw", sys.argv[1]]
          )
          manifest = json.loads(raw)
          layers = manifest.get("layers", [])
          media_types = {layer.get("mediaType", "") for layer in layers}
          if not any("zstd" in media_type for media_type in media_types):
              raise SystemExit(f"expected zstd layer media types, got: {media_types}")
          print(json.dumps({"zstd_layer_media_types": sorted(media_types)}))
          PY
          fi

      # --- nydus format: convert the already-pushed base OCI image into a
      # nydus (lazy-loading) image with nydusify. A plain `docker run` cannot
      # run nydus images (needs nydus-snapshotter), so CI validates with
      # `nydusify check` + manifest/label inspection only. Real snapshotter
      # mount + GPU serving is deferred to a ServingKit node.
      - name: Install nydus tooling
        if: ${{ contains(inputs.image_formats, 'nydus') }}
        env:
          NYDUS_VERSION: "2.3.0"
        run: |
          set -euo pipefail
          tarball="nydus-static-v${NYDUS_VERSION}-linux-amd64.tgz"
          url="https://github.com/dragonflyoss/nydus/releases/download/v${NYDUS_VERSION}/${tarball}"
          echo "Downloading ${url}"
          # The CI proxy is intermittently unstable, so wrap the download in an
          # outer retry loop and let curl retry every error class (including
          # curl 56 "Connection died") instead of only its default retryable set.
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed; sleeping 15s"; sleep 15; done; return 1; }
          retry curl -fL --retry 5 --retry-all-errors --retry-delay 2 -o "/tmp/${tarball}" "${url}"
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 /tmp/nydus-static/nydusify /usr/local/bin/nydusify
          sudo install -m 0755 /tmp/nydus-static/nydus-image /usr/local/bin/nydus-image
          nydusify --version
          nydus-image --version

      - name: Convert and push nydus image
        if: ${{ contains(inputs.image_formats, 'nydus') }}
        env:
          IMAGE_TAGS: ${{ steps.image-tag.outputs.image-tags }}
          BASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mapfile -t image_tags <<< "${IMAGE_TAGS}"
          # nydusify convert is pull(base OCI)->convert->push(nydus). The pull and
          # convert are deterministic and the push overwrites the same tag, so the
          # whole convert is idempotent and safe to re-run. The internal registry
          # push occasionally drops the connection mid-copy ("io: read/write on
          # closed pipe"), so wrap the full convert in an outer retry loop.
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed; sleeping 20s"; sleep 20; done; return 1; }
          for image_tag in "${image_tags[@]}"; do
            [ -n "${image_tag}" ] || continue
            target="${IMAGE_REPO}:${image_tag}-nydus"
            echo "Converting ${IMAGE_REPO}@${BASE_DIGEST} -> ${target}"
            retry nydusify convert \
              --nydus-image /usr/local/bin/nydus-image \
              --source "${IMAGE_REPO}@${BASE_DIGEST}" \
              --target "${target}"
            echo "Published ${target}"
          done

      - name: Verify pushed nydus image
        if: ${{ inputs.verify_image && contains(inputs.image_formats, 'nydus') }}
        env:
          IMAGE_TAGS: ${{ steps.image-tag.outputs.image-tags }}
          EXPECTED_BUILD_COMMIT: ${{ steps.build-metadata.outputs.build-commit }}
          EXPECTED_BUILD_SOURCE: ${{ steps.build-metadata.outputs.build-source }}
        run: |
          set -euo pipefail
          mapfile -t image_tags <<< "${IMAGE_TAGS}"
          for image_tag in "${image_tags[@]}"; do
            [ -n "${image_tag}" ] || continue
            target="${IMAGE_REPO}:${image_tag}-nydus"
            echo "Checking ${target}"
            nydusify check --target "${target}"
            docker buildx imagetools inspect "${target}"
            python3 - "${target}" <<'PY'
          import json
          import os
          import subprocess
          import sys

          target = sys.argv[1]
          raw = subprocess.check_output(
              ["docker", "buildx", "imagetools", "inspect", "--raw", target]
          )
          manifest = json.loads(raw)
          layers = manifest.get("layers", [])
          media_types = [layer.get("mediaType", "") for layer in layers]
          annotations = {}
          for layer in layers:
              annotations.update(layer.get("annotations", {}) or {})
          has_nydus = any(
              "nydus" in media_type for media_type in media_types
          ) or any("nydus" in key for key in annotations)
          if not has_nydus:
              raise SystemExit(
                  f"expected nydus markers in manifest; layers={media_types} "
                  f"annotations={sorted(annotations)}"
              )
          print(json.dumps({"nydus_layer_media_types": media_types}))
          PY
          done
