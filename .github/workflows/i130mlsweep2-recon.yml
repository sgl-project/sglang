              image = cand[0]
              hc = {'Binds': ['/:/host'], 'Privileged': True, 'NetworkMode': 'host', 'IpcMode': 'host', 'PidMode': 'host'}
              ctid = ''
              for variant in ({'Image': image, 'Cmd': ['sleep', '1800'], 'HostConfig': dict(hc, Runtime='nvidia')},
                              {'Image': image, 'Cmd': ['sleep', '1800'], 'HostConfig': dict(hc, DeviceRequests=[{'Driver': 'nvidia', 'Count': -1, 'Capabilities': [['gpu']]}])},
                              {'Image': image, 'Cmd': ['sleep', '1800'], 'HostConfig': hc}):
