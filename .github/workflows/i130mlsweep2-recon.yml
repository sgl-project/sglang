                      idle.append((idx, uid, name, f1, f2))
              print('I130MLS2_GATE ip=%s idle=%d [%s]' % (a, len(idle), ' '.join('%s:%s' % (i, n) for i, u, n, f1, f2 in idle)))
              if not idle:
