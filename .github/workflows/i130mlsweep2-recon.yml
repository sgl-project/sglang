                  print('I130MLS2_EXEC ip=%s pool=%s:%d reachable=%s' % (a, hp, pp, 'yes' if 'TCPOPEN' in (_t or '') else 'no'))
                  if 'TCPOPEN' in (_t or ''):
                      pool = '%s:%d' % (hp, pp)
