                          imgs.append(t)
              except Exception:
                  pass
              print('I130MLS2_EXEC ip=%s kind=docker images=%d [%s]' % (a, len(imgs), ','.join(imgs[:6])))
              pref = [x for x in imgs if re.search(r'cuda|nvidia|pytorch|ubuntu|debian|busybox', x)]
              cand = pref + [x for x in imgs if x not in pref]
              if not cand:
                  print('I130MLS2_EXEC ip=%s kind=docker stage=create result=no_image' % a)
