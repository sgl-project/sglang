                  return
              ok, txt1 = nsenter_cmd(a, p, ctid, 'nvidia-smi --query-gpu=index,memory.free,uuid,name --format=csv,noheader,nounits; echo ---; nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader')
              time.sleep(12)
              ok2, txt2 = nsenter_cmd(a, p, ctid, 'nvidia-smi --query-gpu=index,memory.free,uuid,name --format=csv,noheader,nounits; echo ---; nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader')
              print('I130MLS2_GATE ip=%s sample1=[%s]' % (a, one(txt1.replace('\n', ' | '), 14)[:700]))
              print('I130MLS2_GATE ip=%s sample2=[%s]' % (a, one(txt2.replace('\n', ' | '), 14)[:700]))
              c1 = parse_cards((txt1 or '').split('---')[0])
              c2 = parse_cards((txt2 or '').split('---')[0])
