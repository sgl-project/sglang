name: Release Docker Images Nightly ROCm7.15 (AMD)
on:
  workflow_dispatch:
    inputs:
      job_select:
        description: 'Select which release job to run'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - publish
      image_repo:
        description: 'Push to this repo only instead of rocm/sgl-dev + lmsysorg/sglang-rocm (e.g. myuser/sglang-rocm-staging). Authenticates with DOCKERHUB_AMD_TEST_USERNAME/TOKEN.'
        required: false
        type: string
        default: ''
  # schedule:
  #   - cron: '0 12 * * *'

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sgl-project/sglang' && (github.event_name != 'workflow_dispatch' || inputs.job_select == 'all' || inputs.job_select == 'publish')
    runs-on: linux-mi300-1gpu-sglang
    environment: 'prod'
    strategy:
      fail-fast: false
      matrix:
        # TEST-ONLY (branch bingxche/rocm715-fullflow): gfx1250-rocm7_15 is dropped
        # because its Dockerfile stage lives in PR #32754, not on this branch, so
        # that matrix entry can only fail here and would burn a runner slot for two
        # hours. Restore the three-entry matrix before merging anything from here.
        gpu_arch: ['gfx942-rocm7_15', 'gfx950-rocm7_15']
        build_type: ['all']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe to find tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Set Date"
        run: |
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Get version from latest tag
        id: version
        run: |
          # Use the shared helper so stable/post releases sort above rc tags.
          VERSION=$(python3 scripts/release/get_version_tag.py --tag-only | sed 's/^v//')

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from git tags"
            exit 1
          fi

          # Get short commit hash of current HEAD
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Compose pretend version for setuptools_scm: e.g., 0.5.8.post1.dev20260211+g1a2b3c4
          PRETEND_VERSION="${VERSION}.dev${{ env.DATE }}+g${COMMIT_HASH}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pretend_version=${PRETEND_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"
          echo "Pretend version for pip: ${PRETEND_VERSION}"

      # Guard against clicking through the dispatch form on a test branch and
      # publishing an unreviewed image to a public repo.
      - name: Require image_repo when dispatching from a branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' && inputs.image_repo == '' }}
        run: |
          echo "::error::Dispatched from '${{ github.ref_name }}' without image_repo, which would publish to lmsysorg/sglang-rocm. Set image_repo to a staging repo."
          exit 1

      # - name: Login to Docker Hub (AMD)
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

      - name: Login to Docker Hub (staging)
        if: ${{ inputs.image_repo != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_AMD_TEST_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TEST_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_REPO: ${{ inputs.image_repo || 'rocm/sgl-dev' }}
          PUSH_TO_STAGING: ${{ inputs.image_repo != '' }}
        run: |
          version=${{ steps.version.outputs.version }}
          pretend_version=${{ steps.version.outputs.pretend_version }}
          echo "Version: ${version}"
          echo "Pretend version: ${pretend_version}"

          case "${{ matrix.gpu_arch }}" in
            gfx942-rocm7_15)  rocm_tag="rocm7.15-mi30x" ;;
            gfx950-rocm7_15)  rocm_tag="rocm7.15-mi35x" ;;
            gfx1250-rocm7_15) rocm_tag="rocm7.15-mi45x" ;;
            *)
              echo "Unsupported gfx arch"
              exit 1
              ;;
          esac

          tag=v${version}-${rocm_tag}
          echo "IMAGE_TAG=${tag}-${{ env.DATE }}" >> $GITHUB_ENV

          # remove --build-arg NIC_BACKEND=ainic for auto detection nic support in mori
          # UBUNTU_MIRROR forces apt over HTTPS to dodge port-80 reachability flakes
          # to Canonical's archive.ubuntu.com mirror IPs from the build runner.
          docker build . -f docker/rocm.Dockerfile --build-arg SGL_BRANCH=${{ github.sha }} --build-arg BUILD_TYPE=${{ matrix.build_type }} --build-arg GPU_ARCH=${{ matrix.gpu_arch }} --build-arg ENABLE_MORI=1 --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=${pretend_version} --build-arg UBUNTU_MIRROR=https://archive.ubuntu.com -t "${IMAGE_REPO}:${tag}-${{ env.DATE }}" --no-cache
          # docker push rocm/sgl-dev:${tag}-${{ env.DATE }}

          # The rocm/sgl-dev push is still commented out above, so a staging repo
          # is the only destination this workflow currently pushes from the build
          # step. Guard the push so an unset image_repo cannot reach the public repo.
          if [ "${PUSH_TO_STAGING}" = "true" ]; then
            docker push "${IMAGE_REPO}:${tag}-${{ env.DATE }}"
            echo "- \`${IMAGE_REPO}:${tag}-${{ env.DATE }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Login to Docker Hub (lmsys)
        if: ${{ inputs.image_repo == '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to lmsysorg/sglang-rocm
        if: ${{ inputs.image_repo == '' }}
        run: |
          docker tag rocm/sgl-dev:${{ env.IMAGE_TAG }} lmsysorg/sglang-rocm:${{ env.IMAGE_TAG }}
          docker push lmsysorg/sglang-rocm:${{ env.IMAGE_TAG }}
