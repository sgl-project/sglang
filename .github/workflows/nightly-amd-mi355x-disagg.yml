name: Nightly Test (AMD MI355X 2N 1P1D Disagg)

# A self-hosted runner on the amd-sglang login node salloc's the MI355X nodes a
# recipe asks for and runs the Docker harness (prefill + decode over MORI, a
# standalone load balancer, then an sglang.bench_serving concurrency sweep) via
# scripts/ci/slurm/launch_mi355x.sh. Each leg is one call of
# _nightly-amd-mi355x-disagg-leg.yml.
#
# Legs are split into two groups by allocation size because the partition is 4
# nodes and salloc takes whole nodes: 1P1D recipes take 2 and run two at a time,
# wide-EP16 recipes take all 4 and run alone. GitHub hands a job to any idle
# runner carrying the label without knowing the cluster is busy, so a leg
# dispatched while its nodes are held just blocks in salloc until the step
# timeout fires and reports a benchmark failure that never ran. Sizing the
# groups here is what keeps that from happening.
on:
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC
  workflow_dispatch:
    inputs:
      image:
        description: 'Optional. ROCm SGLang Docker image to benchmark. Leave empty for the recipe default.'
        required: false
        default: ''
      configs:
        description: 'Optional. Comma-separated names to run only a subset. Leave empty to run all. Available names are listed in the setup job log.'
        required: false
        default: ''

concurrency:
  group: nightly-test-mi355x
  cancel-in-progress: false

env:
  SGLANG_IS_IN_CI: true

jobs:
  # ---------------------------------------------------------------------------
  # Reads scripts/ci/slurm/nightly-configs.yaml and generates one matrix entry
  # per recipe YAML for runner=mi355x, split into the paired and solo groups by
  # the allocation size generate_matrix.py reads out of each recipe. To
  # add/remove configs, edit nightly-configs.yaml only -- a new recipe lands in
  # the right group on its own.
  # ---------------------------------------------------------------------------
  setup:
    if: github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-latest
    outputs:
      matrix_paired: ${{ steps.generate.outputs.matrix_paired }}
      matrix_solo: ${{ steps.generate.outputs.matrix_solo }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve latest MI35x nightly image
        id: image
        # Track the newest published image so the nightly actually catches
        # regressions instead of re-testing one pinned build. We resolve on the
        # GitHub-hosted runner (clean Docker Hub access, no rate limits) and pass
        # the tag to the self-hosted runner. Scope is deliberately tight: only
        # the clean main MI35x ROCm 7.2 line
        # `lmsysorg/sglang-rocm:v*-rocm720-mi35x-YYYYMMDD` (excludes -test-,
        # miles-, mori-, vllm-, rocm7_14 variants). On any failure we emit an
        # empty string and the launcher falls back to the recipe's pinned
        # `runtime.image`.
        run: |
          set -o pipefail
          RESOLVED=$(curl -fsSL "https://hub.docker.com/v2/repositories/lmsysorg/sglang-rocm/tags?page_size=100&ordering=last_updated" \
            | python3 -c "import json,re,sys;p=re.compile(r'^v[0-9][0-9A-Za-z.]*-rocm720-mi35x-([0-9]{8})\$');c=sorted((m.group(1),t['name']) for t in json.load(sys.stdin).get('results',[]) for m in [p.match(t.get('name',''))] if m);print(c[-1][1] if c else '')" || true)
          if [ -n "$RESOLVED" ]; then
            echo "Resolved latest MI35x image: lmsysorg/sglang-rocm:$RESOLVED"
            echo "image=lmsysorg/sglang-rocm:$RESOLVED" >> $GITHUB_OUTPUT
          else
            echo "Could not resolve a latest image; launcher will use recipe default."
            echo "image=" >> $GITHUB_OUTPUT
          fi

      - name: Generate benchmark matrix
        id: generate
        env:
          CONFIGS_FILTER: ${{ inputs.configs }}
        run: |
          pip install pyyaml -q

          ALL_MATRIX=$(python3 scripts/ci/slurm/generate_matrix.py \
            scripts/ci/slurm/nightly-configs.yaml --runner mi355x)
          echo "Available config names for runner mi355x:"
          echo "$ALL_MATRIX" | python3 -c "import json,sys; [print(f'  - {e[\"name\"]} ({e[\"nodes\"]} nodes)') for e in json.load(sys.stdin)]"

          FILTER_ARG=()
          if [ -n "$CONFIGS_FILTER" ]; then
            echo ""
            echo "Filtering to: $CONFIGS_FILTER"
            FILTER_ARG=(--filter "$CONFIGS_FILTER")
          fi

          # 2 is half of the partition's 4 nodes: at most two of these fit at
          # once, and anything larger has to have the cluster to itself. Bump
          # both numbers together if the partition grows.
          PAIRED=$(python3 scripts/ci/slurm/generate_matrix.py \
            scripts/ci/slurm/nightly-configs.yaml --runner mi355x \
            "${FILTER_ARG[@]}" --nodes-max 2)
          SOLO=$(python3 scripts/ci/slurm/generate_matrix.py \
            scripts/ci/slurm/nightly-configs.yaml --runner mi355x \
            "${FILTER_ARG[@]}" --nodes-min 3)
          COUNT='import json,sys; print(len(json.load(sys.stdin)))'
          echo ""
          echo "paired (<=2 nodes, 2 at a time): $(echo "$PAIRED" | python3 -c "$COUNT") leg(s)"
          echo "solo   (>2 nodes, 1 at a time):  $(echo "$SOLO" | python3 -c "$COUNT") leg(s)"
          echo "matrix_paired=$PAIRED" >> $GITHUB_OUTPUT
          echo "matrix_solo=$SOLO" >> $GITHUB_OUTPUT

  # <=2-node legs. Two of these fit on the partition at once, so the group runs
  # 2-up and a second runner on the label is what actually doubles throughput.
  benchmark-paired:
    name: ${{ matrix.config.name }}
    needs: setup
    if: |
      always() && github.repository == 'sgl-project/sglang'
      && needs.setup.result == 'success'
      && needs.setup.outputs.matrix_paired != '[]'
    strategy:
      fail-fast: false
      # In steady state the number of runners carrying the label already caps
      # this. The explicit cap is what holds during a runner migration, when a
      # third runner is briefly registered against the same label.
      max-parallel: 2
      matrix:
        config: ${{ fromJson(needs.setup.outputs.matrix_paired) }}
    uses: ./.github/workflows/_nightly-amd-mi355x-disagg-leg.yml
    with:
      config: ${{ toJson(matrix.config) }}
      # Manual dispatch input wins; otherwise the image the setup job resolved;
      # otherwise empty, and the launcher falls back to the recipe default.
      image: ${{ inputs.image != '' && inputs.image || needs.setup.outputs.image }}

  # >2-node legs take the whole partition, so they run one at a time and only
  # after the paired group has released the cluster. always() keeps a failed leg
  # over there from skipping this group, since fail-fast is off and one bad
  # recipe should not cost the rest of the nightly.
  benchmark-solo:
    name: ${{ matrix.config.name }}
    needs: [setup, benchmark-paired]
    if: |
      always() && github.repository == 'sgl-project/sglang'
      && needs.setup.result == 'success'
      && needs.setup.outputs.matrix_solo != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        config: ${{ fromJson(needs.setup.outputs.matrix_solo) }}
    uses: ./.github/workflows/_nightly-amd-mi355x-disagg-leg.yml
    with:
      config: ${{ toJson(matrix.config) }}
      image: ${{ inputs.image != '' && inputs.image || needs.setup.outputs.image }}

  collect-results:
    needs: [benchmark-paired, benchmark-solo]
    if: github.repository == 'sgl-project/sglang' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: results/
          pattern: mi355x-*

      - name: Print summary
        run: |
          pip install tabulate -q
          python3 scripts/ci/slurm/summarize.py results/ >> $GITHUB_STEP_SUMMARY
