      - name: Resolve the base image digest
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      # Resolve the artifact's digest separately under the PPU_TEST_IMAGE prefix, so
      # the base image's digest is never recorded as the artifact's and the
      # performance trend keeps its attribution.
      # A failure here is not an error: ghcr may withhold an anonymous token, and
      # the pod is still pinned to an immutable tag, which names exactly one image.
      - name: Resolve the image under test
        if: ${{ needs.prepare.outputs.test_image != '' }}
        env:
          PPU_RESOLVE_INPUT: ${{ needs.prepare.outputs.test_image }}
          PPU_RESOLVE_PREFIX: PPU_TEST_IMAGE
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run 4-GPU PPU nightly tests via K8s
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_TEST_IMAGE_REF || env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 4
          node_selector: board-type=ZW-810E
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "PPU_EXPECTED_DEVICES=4,SGLANG_IS_IN_CI=true,SGLANG_JIT_KERNEL_RUN_FULL_TESTS=1,SGL_KERNEL_WHEEL_CACHE_DIR=/nas_aisw/cache/sgl-kernel-wheels,PPU_TEST_MODE=${{ needs.prepare.outputs.test_image != '' && 'image' || 'source' }},PPU_TEST_IMAGE_REF=${{ env.PPU_TEST_IMAGE_REF }},PPU_TEST_IMAGE_DIGEST=${{ env.PPU_TEST_IMAGE_DIGEST }},PPU_EXPECTED_COMMIT=${{ needs.prepare.outputs.ref }},PPU_BASE_IMAGE_REF=${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PIP_INDEX_URL=https://pypi.org/simple"
          command: |
            set -euo pipefail
            cd /workspace/source
            export GITHUB_WORKSPACE=/workspace/source
            git config --global --add safe.directory /workspace/source
            ulimit -l unlimited
            ulimit -s 65536
            export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:?Assigned devices are unavailable}"
            bash scripts/ci/warm_page_cache.sh \
              /nas_aisw/datasets/checkpoints/LLM/Llama/v3.2/Llama-3.2-1B-Instruct
            export PPU_EVIDENCE_DIR="/wl_nas/devops/ppu-nightly-evidence/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}"
            mkdir -p "$PPU_EVIDENCE_DIR"
            bash scripts/ci/ppu/ppu_install_dependency.sh 2>&1 | tee "$PPU_EVIDENCE_DIR/setup.log"
            export PPU_JIT_CACHE_SHARED=/root/.cache/tvm-ffi
            export PPU_JIT_CACHE_LOCAL="/tmp/ppu-nightly-tvm-ffi-${{ github.job }}"
            source scripts/ci/ppu/use_local_jit_cache.sh
            bash scripts/ci/ppu/run_nightly_suite.sh nightly-4-ppu "" "$PPU_EVIDENCE_DIR" 9300
          container_options: |
            privileged: true
            host_ipc: true
            host_network: false
            shm_size: 8Gi
          timeout_minutes: 170
          cleanup_policy: always
      - name: Export sanitized PPU nightly evidence
        if: always()
        env:
          PPU_EVIDENCE_DIR: /wl_nas/devops/ppu-nightly-evidence/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}
          PPU_ARTIFACTORY_USER: ${{ secrets.PPU_ARTIFACTORY_USER }}
          PPU_ARTIFACTORY_PASSWORD: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
        run: |
          python3 scripts/ci/ppu/pr_report.py export \
            --directory "$PPU_EVIDENCE_DIR" \
            --destination "/tmp/ppu-nightly-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
      - name: Upload PPU nightly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: /tmp/ppu-nightly-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error
          retention-days: 14

  # Restore the 8-PPU job only after real 8-PPU registrations pass hardware validation.
  nightly-test-ppu-finish:
    needs: [prepare, nightly-1a-ppu, nightly-1b-ppu, nightly-2-ppu, nightly-4-ppu]
    # When the build fails, prepare holds this whole line back and the red run is
    # the build's own, already tracked by the issue. Turning this red as well only
    # reads as "the tests broke", so summarise only when tests actually ran.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result != 'success':
                  failed.append(f'{job} ({result})')
          if failed:
              print(f"Failed jobs: {','.join(failed)}")
              sys.exit(1)
          print('All jobs completed successfully')
          PY
