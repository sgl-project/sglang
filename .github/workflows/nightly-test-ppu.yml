name: Nightly Test (PPU K8s)

# This nightly starts at the build, not here. release-docker-ppu-nightly.yml pushes
# the image to ghcr at 00:00 Beijing time; this file waits for that to succeed and
# then tests the very same artifact.
#
# The old '0 16 * * *' schedule is gone: it started at the same moment as the
# build, knew nothing about the outcome, so "which image was actually tested" had
# no answer. workflow_run now carries that link.
#
# A non-empty test_image switches to "test the artifact": the pod runs on that
# image (it already ships sglang and sgl-kernel, so the source install is skipped)
# after image_healthcheck.sh has looked at it. Empty keeps the previous behaviour
# exactly: fixed PPU base image plus a source install.
#
# Only the scheduled build is auto-linked. A manually dispatched build may carry
# push=false and then finish with nothing to pull. To test a manual rebuild,
# dispatch this file and point test_image at that build's tag.
on:
  workflow_run:
    workflows: ["Release Docker Images Nightly (PPU)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
      test_image:
        description: 'Image under test (tag or image@sha256:...). Empty keeps the fixed PPU base image and installs sglang from source.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
      test_image:
        description: 'Image under test (tag or image@sha256:...). Empty keeps the fixed PPU base image and installs sglang from source.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-test-ppu-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  prepare:
    # workflow_run fires on every completed build: the failed ones, and the
    # push-triggered runs the build file keeps for debugging. Only the scheduled
    # build on the default branch is what this test line covers; nothing else
    # enters.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      test_image: ${{ steps.image.outputs.tag }}
    steps:
      - name: Validate the requested source ref
        id: source
        env:
          # There are no inputs under workflow_run, and github.sha is the head of
          # the default branch rather than the commit that was built and is under
          # test. Only head_sha answers that.
          REQUESTED_REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            :
          elif [[ "$REQUESTED_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] &&
            git check-ref-format --allow-onelevel "$REQUESTED_REF" >/dev/null; then
            :
          else
            echo 'ref must be a full commit SHA or a valid branch/tag ref' >&2
            exit 1
          fi
          printf 'ref=%s\n' "$REQUESTED_REF" >> "$GITHUB_OUTPUT"

      # Settle "which image is under test" once, in prepare, so all four test jobs
      # work from the same answer. The tag rule has to match Compute image metadata
      # in release-docker-ppu-nightly.yml character for character: lowercased owner,
      # / turned into - in the branch, UTC date, first 7 of the sha. Get it wrong
      # and the tag does not exist in the registry, which the pod reports as
      # ImagePullBackOff.
      - name: Derive the image under test
        id: image
        env:
          REQUESTED_IMAGE: ${{ inputs.test_image }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BUILD_STARTED: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_IMAGE" ]; then
            printf 'tag=%s\n' "$REQUESTED_IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BUILD_SHA" ]; then
            # Manual dispatch with no test_image: keep the fixed base image and
            # the source install.
            echo 'no build run behind this dispatch and no test_image given; keeping the source path'
            printf 'tag=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          owner_lc=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          branch=$(printf '%s' "$BUILD_BRANCH" | sed 's|/|-|g; s/[^A-Za-z0-9._-]/-/g')
          short_sha="${BUILD_SHA:0:7}"
          # The build runs at most 300 minutes from 16:00 UTC and normally does not
          # cross midnight. If it ever does, the date composed here is one day
          # behind the build's own and the symptom is a failed image pull -- check
          # this line first.
          start_day=$(printf '%s' "$BUILD_STARTED" | cut -c1-10 | tr -d '-')
          tag="${branch}-${start_day}-cuda13.0.0-sdk2.2.0-${short_sha}"
          echo "image under test: ghcr.io/${owner_lc}/sglang-ppu-nightly:${tag}"
          printf 'tag=ghcr.io/%s/sglang-ppu-nightly:%s\n' "$owner_lc" "$tag" >> "$GITHUB_OUTPUT"

  # Run independent workers concurrently. Separate jobs keep GITHUB_JOB unique,
  # so cluster-task staging directories, K8s Job names, and evidence stay isolated.
  nightly-1a-ppu:
    needs: [prepare]
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 2
      - name: Resolve the base image digest
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      # Resolve the artifact's digest separately under the PPU_TEST_IMAGE prefix, so
      # the base image's digest is never recorded as the artifact's and the
      # performance trend keeps its attribution.
      # A failure here is not an error: ghcr may withhold an anonymous token, and
      # the pod is still pinned to an immutable tag, which names exactly one image.
      - name: Resolve the image under test
        if: ${{ needs.prepare.outputs.test_image != '' }}
        env:
          PPU_RESOLVE_INPUT: ${{ needs.prepare.outputs.test_image }}
          PPU_RESOLVE_PREFIX: PPU_TEST_IMAGE
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run PPU nightly tests (1-GPU, partition 1/2) via K8s
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_TEST_IMAGE_REF || env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: board-type=ZW-810E
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "PPU_EXPECTED_DEVICES=1,SGLANG_IS_IN_CI=true,SGLANG_JIT_KERNEL_RUN_FULL_TESTS=1,SGL_KERNEL_WHEEL_CACHE_DIR=/nas_aisw/cache/sgl-kernel-wheels,PPU_TEST_MODE=${{ needs.prepare.outputs.test_image != '' && 'image' || 'source' }},PPU_TEST_IMAGE_REF=${{ env.PPU_TEST_IMAGE_REF }},PPU_TEST_IMAGE_DIGEST=${{ env.PPU_TEST_IMAGE_DIGEST }},PPU_EXPECTED_COMMIT=${{ needs.prepare.outputs.ref }},PPU_BASE_IMAGE_REF=${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PIP_INDEX_URL=https://pypi.org/simple"
          command: |
            set -euo pipefail
            cd /workspace/source
            export GITHUB_WORKSPACE=/workspace/source
            git config --global --add safe.directory /workspace/source
            ulimit -l unlimited
            ulimit -s 65536
            export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:?Assigned devices are unavailable}"
            bash scripts/ci/warm_page_cache.sh \
              /nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct \
              /nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-30B-A3B \
              /nas_aisw/datasets/checkpoints/LLM/deepseek/v2/DeepSeek-V2-Lite-Chat \
              /nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-0.6B
            export PPU_EVIDENCE_DIR="/wl_nas/devops/ppu-nightly-evidence/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}"
            mkdir -p "$PPU_EVIDENCE_DIR"
            bash scripts/ci/ppu/ppu_install_dependency.sh 2>&1 | tee "$PPU_EVIDENCE_DIR/setup.log"
            export PPU_JIT_CACHE_SHARED=/root/.cache/tvm-ffi
            export PPU_JIT_CACHE_LOCAL="/tmp/ppu-nightly-tvm-ffi-${{ github.job }}"
            source scripts/ci/ppu/use_local_jit_cache.sh
            JIT_MTIME=$(git log -1 --format=%ct 2>/dev/null || echo 0)
            if [ "$JIT_MTIME" != 0 ]; then
              find python/sglang/kernels/jit -type f -exec touch -d "@$JIT_MTIME" {} + ||
                echo 'JIT mtime pinning failed; JIT will recompile'
            else
              echo 'Skipped JIT mtime pinning; JIT will recompile'
            fi
            # In image mode, look at the artifact before running any case: the
            # commit baked into it, whether it imports, whether the tested code
            # really comes from the image rather than this checkout, the kernel op
            # surface, and one server brought up for /health plus one request. If
            # any of that fails, more cases cannot change the conclusion.
            # In source mode the script exits 0 and behaviour is unchanged.
            bash scripts/ci/ppu/image_healthcheck.sh "$PPU_EVIDENCE_DIR"
            bash scripts/ci/ppu/run_nightly_suite.sh nightly-1-ppu 0 "$PPU_EVIDENCE_DIR" 6600
          container_options: |
            privileged: true
            host_ipc: true
            host_network: false
            shm_size: 8Gi
          timeout_minutes: 110
          cleanup_policy: always
      - name: Export sanitized PPU nightly evidence
        if: always()
        env:
          PPU_EVIDENCE_DIR: /wl_nas/devops/ppu-nightly-evidence/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}
          PPU_ARTIFACTORY_USER: ${{ secrets.PPU_ARTIFACTORY_USER }}
          PPU_ARTIFACTORY_PASSWORD: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
        run: |
          python3 scripts/ci/ppu/pr_report.py export \
            --directory "$PPU_EVIDENCE_DIR" \
            --destination "/tmp/ppu-nightly-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
      - name: Upload PPU nightly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: /tmp/ppu-nightly-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error
          retention-days: 14

