name: Nightly Test (PPU K8s)

on:
  schedule:
    - cron: '0 16 * * *'  # 00:00 Beijing Time (UTC+8) every day
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test.'
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-test-ppu-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.17-py312-20261001
  PPU_SDK_VERSION: 2.2.0

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.source.outputs.ref }}
    steps:
      - name: Validate the requested source ref
        id: source
        env:
          REQUESTED_REF: ${{ inputs.ref || github.sha }}
        run: |
          if [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            :
          elif [[ "$REQUESTED_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] &&
            git check-ref-format --allow-onelevel "$REQUESTED_REF" >/dev/null; then
            :
          else
            echo 'ref must be a full commit SHA or a valid branch/tag ref' >&2
            exit 1
          fi
          printf 'ref=%s\n' "$REQUESTED_REF" >> "$GITHUB_OUTPUT"

  # Keep separate jobs rather than a matrix: cluster-task derives its staging
  # directory and K8s Job name from GITHUB_JOB, which concurrent matrix legs share.
  nightly-1a-ppu:
    needs: [prepare]
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 2
      - name: Resolve the base image digest
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run PPU nightly tests (1-GPU, partition 1/2) via K8s
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "PPU_EXPECTED_DEVICES=1,SGLANG_IS_IN_CI=true,SGLANG_JIT_KERNEL_RUN_FULL_TESTS=1,SGL_KERNEL_WHEEL_CACHE_DIR=/nas_aisw/cache/sgl-kernel-wheels,PPU_BASE_IMAGE_REF=${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PIP_INDEX_URL=https://pypi.org/simple"
          command: |
            set -euo pipefail
            cd /workspace/source
            export GITHUB_WORKSPACE=/workspace/source
            git config --global --add safe.directory /workspace/source
            ulimit -l unlimited
            ulimit -s 65536
            export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:?Assigned devices are unavailable}"
            bash scripts/ci/warm_page_cache.sh \
              /nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct \
              /nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-30B-A3B \
              /nas_aisw/datasets/checkpoints/LLM/deepseek/v2/DeepSeek-V2-Lite-Chat \
              /nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-0.6B
            bash scripts/ci/ppu/ppu_install_dependency.sh
            JIT_MTIME=$(git log -1 --format=%ct 2>/dev/null || echo 0)
            if [ "$JIT_MTIME" != 0 ]; then
              find python/sglang/kernels/jit -type f -exec touch -d "@$JIT_MTIME" {} + ||
                echo 'JIT mtime pinning failed; JIT will recompile'
            else
              echo 'Skipped JIT mtime pinning; JIT will recompile'
            fi
            cd test
            python3 run_suite.py --hw ppu --suite nightly-1-ppu --nightly --require-nonempty --continue-on-error --auto-partition-id 0 --auto-partition-size 2
          container_options: |
            privileged: true
            host_ipc: true
            host_network: false
            shm_size: 8Gi
          timeout_minutes: 110
          cleanup_policy: always

  nightly-1b-ppu:
    needs: [prepare, nightly-1a-ppu]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # This partition owns test_marlin_moe, whose JIT preload can cost about 18
    # minutes on a cache miss and therefore needs a larger timeout than partition A.
    timeout-minutes: 135
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 2
      - name: Resolve the base image digest
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run PPU nightly tests (1-GPU, partition 2/2) via K8s
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "PPU_EXPECTED_DEVICES=1,SGLANG_IS_IN_CI=true,SGLANG_JIT_KERNEL_RUN_FULL_TESTS=1,SGL_KERNEL_WHEEL_CACHE_DIR=/nas_aisw/cache/sgl-kernel-wheels,PPU_BASE_IMAGE_REF=${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PIP_INDEX_URL=https://pypi.org/simple"
          command: |
            set -euo pipefail
            cd /workspace/source
            export GITHUB_WORKSPACE=/workspace/source
            git config --global --add safe.directory /workspace/source
            ulimit -l unlimited
            ulimit -s 65536
            export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:?Assigned devices are unavailable}"
            bash scripts/ci/warm_page_cache.sh \
              /nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct \
              /nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-30B-A3B \
              /nas_aisw/datasets/checkpoints/LLM/deepseek/v2/DeepSeek-V2-Lite-Chat \
              /nas_aisw/datasets/checkpoints/LLM/qwen/v3/Qwen3-0.6B
            bash scripts/ci/ppu/ppu_install_dependency.sh
            JIT_MTIME=$(git log -1 --format=%ct 2>/dev/null || echo 0)
            if [ "$JIT_MTIME" != 0 ]; then
              find python/sglang/kernels/jit -type f -exec touch -d "@$JIT_MTIME" {} + ||
                echo 'JIT mtime pinning failed; JIT will recompile'
            else
              echo 'Skipped JIT mtime pinning; JIT will recompile'
            fi
            echo 'Preloading Marlin JIT outside the per-test watchdog'
            timeout -k 30 1500 python3 -c 'import torch; from sglang.kernels.ops.moe.moe_wna16_marlin import _jit_moe_wna16_marlin_module; _jit_moe_wna16_marlin_module(torch.float16, False, False); _jit_moe_wna16_marlin_module(torch.bfloat16, False, False); print("Marlin JIT ready")' ||
              echo 'Marlin JIT preload did not finish; the test watchdog still applies'
            cd test
            python3 run_suite.py --hw ppu --suite nightly-1-ppu --nightly --require-nonempty --continue-on-error --auto-partition-id 1 --auto-partition-size 2
          container_options: |
            privileged: true
            host_ipc: true
            host_network: false
            shm_size: 8Gi
          timeout_minutes: 125
          cleanup_policy: always

  nightly-2-ppu:
    needs: [prepare, nightly-1b-ppu]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 2
      - name: Resolve the base image digest
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run 2-GPU PPU nightly tests via K8s
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 2
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "PPU_EXPECTED_DEVICES=2,SGLANG_IS_IN_CI=true,SGLANG_JIT_KERNEL_RUN_FULL_TESTS=1,SGL_KERNEL_WHEEL_CACHE_DIR=/nas_aisw/cache/sgl-kernel-wheels,PPU_BASE_IMAGE_REF=${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PIP_INDEX_URL=https://pypi.org/simple"
          command: |
            set -euo pipefail
            cd /workspace/source
            export GITHUB_WORKSPACE=/workspace/source
            git config --global --add safe.directory /workspace/source
            ulimit -l unlimited
            ulimit -s 65536
            export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:?Assigned devices are unavailable}"
            bash scripts/ci/warm_page_cache.sh \
              /nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct \
              /nas_aisw/datasets/checkpoints/LLM/Llama/v3.2/Llama-3.2-1B-Instruct
            bash scripts/ci/ppu/ppu_install_dependency.sh
            cd test
            python3 run_suite.py --hw ppu --suite nightly-2-ppu --nightly --require-nonempty --continue-on-error
          container_options: |
            privileged: true
            host_ipc: true
            host_network: false
            shm_size: 8Gi
          timeout_minutes: 140
          cleanup_policy: always

  nightly-4-ppu:
    needs: [prepare, nightly-2-ppu]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 2
      - name: Resolve the base image digest
        run: bash scripts/ci/ppu/resolve_image_digest.sh
      - name: Run 4-GPU PPU nightly tests via K8s
        uses: flytiger-eco/shared-workflows/cluster-task@4692d51c552e8cdf4f267adfdef1e484ca685a6a
        with:
          image: ${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }}
          nnodes: 0
          nproc_per_node: 4
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          job_suffix: ${{ github.job }}
          host_volumes: "/wl_nas/cache/sglang-jit-ci:/root/.cache/tvm-ffi,/wl_nas/cache/sglang-dg-cache:/root/.cache/sglang/deep_gemm,/wl_nas/cache/sglang-jit:/root/.cache/sglang/jit"
          extra_env: "PPU_EXPECTED_DEVICES=4,SGLANG_IS_IN_CI=true,SGLANG_JIT_KERNEL_RUN_FULL_TESTS=1,SGL_KERNEL_WHEEL_CACHE_DIR=/nas_aisw/cache/sgl-kernel-wheels,PPU_BASE_IMAGE_REF=${{ env.PPU_BASE_IMAGE_REF || env.PPU_BASE_IMAGE }},PPU_BASE_IMAGE_DIGEST=${{ env.PPU_BASE_IMAGE_DIGEST }},PPU_BASE_IMAGE=${{ env.PPU_BASE_IMAGE }},PPU_SDK_VERSION=${{ env.PPU_SDK_VERSION }},SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK=1,SGLANG_SAIL_PLA_CUDA=0,CPLUS_INCLUDE_PATH=/usr/local/PPU_SDK/targets/x86_64-linux/include,HF_HUB_OFFLINE=1,HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }},PPU_SUPPORTS_FP8=0,PIP_INDEX_URL=https://pypi.org/simple"
          command: |
            set -euo pipefail
            cd /workspace/source
            export GITHUB_WORKSPACE=/workspace/source
            git config --global --add safe.directory /workspace/source
            ulimit -l unlimited
            ulimit -s 65536
            export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:?Assigned devices are unavailable}"
            bash scripts/ci/warm_page_cache.sh \
              /nas_aisw/datasets/checkpoints/LLM/Llama/v3.2/Llama-3.2-1B-Instruct
            bash scripts/ci/ppu/ppu_install_dependency.sh
            cd test
            python3 run_suite.py --hw ppu --suite nightly-4-ppu --nightly --require-nonempty --continue-on-error
          container_options: |
            privileged: true
            host_ipc: true
            host_network: false
            shm_size: 8Gi
          timeout_minutes: 170
          cleanup_policy: always

  # Restore the 8-PPU job only after real 8-PPU registrations pass hardware validation.
  nightly-test-ppu-finish:
    needs: [prepare, nightly-1a-ppu, nightly-1b-ppu, nightly-2-ppu, nightly-4-ppu]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result != 'success':
                  failed.append(f'{job} ({result})')
          if failed:
              print(f"Failed jobs: {','.join(failed)}")
              sys.exit(1)
          print('All jobs completed successfully')
          PY
