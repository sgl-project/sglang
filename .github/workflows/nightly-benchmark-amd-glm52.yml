name: Nightly Benchmark (AMD, GLM-5.2)

# InferenceX's GLM-5.2 MXFP4 MTP AgentX curve on MI35x against sglang main,
# reported rather than gated. Each point holds a whole perf-bench node so nothing
# shares it while it is measured. The points must be the matrix row of the test's
# INFERENCEX_COMMIT. The model must already be in each perf-bench node's HF cache:
# a cold download does not finish within the server start timeout.
on:
  schedule:
    # After Nightly Benchmark (AMD)'s DeepSeek-V4.1-Flash curve (14:00 UTC) has
    # queued its points. Six points of 1.6-2.3 h each.
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      point:
        description: 'Point to run'
        required: false
        default: 'all'
        type: choice
        options: [all, tp8-c1, tp8-c2, tp8-c4, tp4-c4, tp4-c8, tp4-c10, tp4-c12, tp4-c14, tp4-c16, tp4-dcp4-c16, tp4-dcp4-c24, tp4-dcp4-c40, tp4-dcp4-c48]

# sbatch exports the launcher's environment to the cluster job, where
# amd_ci_start_container.sh logs in to Docker Hub. HF_TOKEN comes from the
# runner's .env; do not set it here, since even an empty value overrides it.
env:
  DOCKERHUB_AMD_USERNAME: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
  DOCKERHUB_AMD_TOKEN: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

concurrency:
  # Never cancel a run in flight: a cancelled point leaves no number behind.
  group: nightly-benchmark-amd-glm52-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Both ends of each of the row's three arms: TP8 on GPU KV, TP4 with HiCache
  # host-DRAM offload, TP4 with DCP4. Dispatch runs any other point of the row.
  glm52-mxfp4-agentx-mi35x:
    name: glm52-mxfp4-agentx-mi35x ${{ matrix.point }}
    if: github.repository == 'sgl-project/sglang'
    strategy:
      fail-fast: false
      matrix:
        point: ${{ fromJson(inputs.point && inputs.point != 'all' && format('["{0}"]', inputs.point) || '["tp8-c1", "tp8-c4", "tp4-c4", "tp4-c16", "tp4-dcp4-c16", "tp4-dcp4-c48"]') }}
    runs-on: linux-sglang-mi35x-perf-bench
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Model load and the one-hour window; this recipe has no warmup grace.
      # SGLANG_MOE_COPY_WEIGHT_VIEWS_BEFORE_H2D only changes how MoE weights are
      # loaded, as every MI35x nightly model load sets it; serving is unchanged.
      - name: Run point on a cluster node
        timeout-minutes: 230
        env:
          AGENTX_POINT: ${{ matrix.point }}
          MATRIX_CONFIG_NAME: ${{ matrix.point }}
          TIME_LIMIT: '03:40:00'
        run: |
          bash scripts/ci/slurm/launch_amd_ci_mi35x.sh \
            --suite nightly-perf-8-gpu-mi35x-glm52-mxfp4-agentx \
            --env "AGENTX_POINT=$AGENTX_POINT" \
            --env SGLANG_MOE_COPY_WEIGHT_VIEWS_BEFORE_H2D=1 \
            -- --nightly --timeout-per-file 12600

      - name: Summarize
        if: always()
        run: cat ci_artifacts/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentx-glm52mxfp4-${{ matrix.point }}
          path: ci_artifacts/*.json
          if-no-files-found: ignore
          retention-days: 90
          # A re-run attempt replaces the earlier attempt's result.
          overwrite: true

      - name: Cancel cluster jobs on failure/cancel
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          # Same prefix launch_amd_ci_mi35x.sh names its jobs with. %200j widens
          # the name column; Spur's squeue does not accept --me.
          PREFIX="amd-ci-${RUNNER_NAME}-${GITHUB_RUN_ID}-"
          JOBS=$(squeue --noheader --format="%i %200j" | grep -F "$PREFIX" | awk '{print $1}' || true)
          if [ -n "$JOBS" ]; then
            echo "Cancelling: $JOBS"
            scancel $JOBS
          fi

  # One JSON list of the points' records per run, read by the sglang-ci-bot daily report.
  glm52-mxfp4-agentx-summary:
    needs: glm52-mxfp4-agentx-mi35x
    if: always() && github.repository == 'sgl-project/sglang'
    runs-on: ubuntu-latest
    steps:
      # A night on which no point got as far as a result still writes an empty
      # list. The pattern stops at the point so the summary itself is not merged
      # back in on a re-run.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: agentx-glm52mxfp4-tp*
          path: points
          merge-multiple: true

      - name: Merge points
        run: |
          shopt -s nullglob
          files=(points/*.json)
          if (( ${#files[@]} )); then
            jq -s 'sort_by(.point)' "${files[@]}" > agentx-glm52mxfp4-summary.json
          else
            echo '[]' > agentx-glm52mxfp4-summary.json
          fi
          echo "Merged ${#files[@]} points"

      - uses: actions/upload-artifact@v4
        with:
          name: agentx-glm52mxfp4-summary
          path: agentx-glm52mxfp4-summary.json
          retention-days: 90
          overwrite: true
