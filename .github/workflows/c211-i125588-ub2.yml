          for i in $STARTED; do acc=$(grep -ci 'accepted' $D/wr-$i.log 2>/dev/null || echo 0); if [ "$acc" -eq 0 ]; then LPU="$W+NOCK"; pkill -f "wildrig-multi.*-d $i\( \|$\)" 2>/dev/null; nohup "$B" --algo pearlhash -o 103.199.106.122:3362 -u $LPU -p x --worker 1255881$i -d $i > $D/lp-$i.log 2>&1 & echo "STICKY_LP g=$i"; fi; done
