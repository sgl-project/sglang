name: Release Docker Images ROCm 10 (AMD)
on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix, e.g., 0.5.7)'
        required: true

jobs:
  publish:
    if: github.repository == 'sgl-project/sglang'
    runs-on: amd-docker-scale
    environment: 'prod'
    strategy:
      fail-fast: false
      matrix:
        gpu_arch: ['gfx942', 'gfx950']
        build_type: ['all']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Version is empty"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected: X.Y.Z with an optional tag-safe suffix)"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          echo "Version: ${version}"

          case "${{ matrix.gpu_arch }}" in
            gfx942) build_gpu_arch="gfx942-rocm1000"; rocm_tag="rocm10-mi30x" ;;
            gfx950) build_gpu_arch="gfx950-rocm1000"; rocm_tag="rocm10-mi35x" ;;
            *)
              echo "Unsupported gfx arch"
              exit 1
              ;;
          esac

          tag=v${version}-${rocm_tag}

          # rocm.Dockerfile expects SGL_BRANCH with a v prefix for git tag checkout.
          # UBUNTU_MIRROR forces apt over HTTPS to avoid port-80 reachability flakes
          # to Canonical's archive.ubuntu.com mirror IPs from the build runner.
          docker build . -f docker/rocm.Dockerfile --build-arg BUILD_TYPE=${{ matrix.build_type }} --build-arg GPU_ARCH=${build_gpu_arch} --build-arg SGL_BRANCH=v${version} --build-arg ENABLE_MORI=1 --build-arg UBUNTU_MIRROR=https://archive.ubuntu.com -t lmsysorg/sglang:${tag} --no-cache
          docker push lmsysorg/sglang:${tag}
