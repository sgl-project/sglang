name: AMD Image2lmsysorg

on:
  workflow_dispatch:
    inputs:
      ImageName:
        description: 'Image tag to copy from the private repository to lmsysorg/sglang-rocm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: amd-image2lmsysorg-${{ inputs.ImageName }}
  cancel-in-progress: false

jobs:
  image2lmsysorg:
    runs-on: amd-docker-scale
    environment: 'prod'
    env:
      SOURCE_IMAGE: henryx/xsgl
      TARGET_IMAGE: lmsysorg/sglang-rocm
      IMAGE_TAG: ${{ inputs.ImageName }}
    steps:
      - name: Validate ImageName
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag: $IMAGE_TAG"
            exit 1
          fi

      - name: Login to private Docker Hub repository
        uses: docker/login-action@v3
        with:
          username: henryx
          password: ${{ secrets.DOCKERHUB_PRIVATE_TOKEN }}

      - name: Pull private image
        run: docker pull "${SOURCE_IMAGE}:${IMAGE_TAG}"

      - name: Login to lmsysorg Docker Hub repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to lmsysorg/sglang-rocm
        run: |
          docker tag "${SOURCE_IMAGE}:${IMAGE_TAG}" "${TARGET_IMAGE}:${IMAGE_TAG}"
          docker push "${TARGET_IMAGE}:${IMAGE_TAG}"
