name: Release Docker Images Nightly ROCm 10 (AMD)
# Test-only (PR 46883): on this branch the workflow only builds the uTLX
# gfx950/gfx1250 images into bingxche/sgl-test. Do not merge.
run-name: "[Test PR 46883] ROCm 10 uTLX images to bingxche/sgl-test"
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'sgl-project/sglang'
    runs-on: amd-docker-scale
    environment: 'prod'
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu_arch: gfx950-rocm1000
            rocm_tag: rocm10-mi35x
          - gpu_arch: gfx1250-rocm1000
            rocm_tag: rocm10-mi45x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set date
        run: echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Get version from latest tag
        id: version
        run: |
          VERSION=$(python3 scripts/release/get_version_tag.py --tag-only | sed 's/^v//')

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from git tags"
            exit 1
          fi

          COMMIT_HASH=$(git rev-parse --short HEAD)
          PRETEND_VERSION="${VERSION}.dev${DATE}+g${COMMIT_HASH}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pretend_version=${PRETEND_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub (bingxche/sgl-test)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_AMD_TEST_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TEST_TOKEN_BX }}

      - name: Build and push to bingxche/sgl-test
        env:
          GPU_ARCH: ${{ matrix.gpu_arch }}
          ROCM_TAG: ${{ matrix.rocm_tag }}
          PRETEND_VERSION: ${{ steps.version.outputs.pretend_version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="bingxche/sgl-test:v${VERSION}-${ROCM_TAG}-${DATE}_test_pr46883"
          case "$GPU_ARCH" in
            gfx942-rocm1000) rocm_tag="rocm10-mi30x" ;;
            gfx950-rocm1000) rocm_tag="rocm10-mi35x" ;;
            *)
              echo "Unsupported GPU arch: $GPU_ARCH"
              exit 1
              ;;
          esac

          image_tag="v${VERSION}-${rocm_tag}-${DATE}"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"

          docker build . \
            -f docker/rocm.Dockerfile \
            --build-arg "SGL_BRANCH=${GITHUB_SHA}" \
            --build-arg "BUILD_TYPE=${BUILD_TYPE}" \
            --build-arg "GPU_ARCH=${GPU_ARCH}" \
            --build-arg ENABLE_MORI=1 \
            --build-arg ENABLE_NIXL=1 \
            --build-arg "SETUPTOOLS_SCM_PRETEND_VERSION=${PRETEND_VERSION}" \
            --build-arg UBUNTU_MIRROR=https://archive.ubuntu.com \
            -t "rocm/sgl-dev:${image_tag}" \
            --no-cache
          if [ "${PUSH_IMAGES}" = "true" ]; then
            docker push "rocm/sgl-dev:${image_tag}"
          else
            echo "Build-only run: not pushing rocm/sgl-dev:${image_tag}"
          fi

      - name: Login to Docker Hub (lmsys)
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to lmsysorg/sglang-rocm
        if: env.PUSH_IMAGES == 'true'
        run: |
          docker tag "rocm/sgl-dev:${IMAGE_TAG}" "lmsysorg/sglang-rocm:${IMAGE_TAG}"
          docker push "lmsysorg/sglang-rocm:${IMAGE_TAG}"

  publish-gfx1250-rocm101:
    if: github.repository == 'sgl-project/sglang' && (github.event_name != 'workflow_dispatch' || inputs.job_select == 'all' || inputs.job_select == 'publish-gfx1250-rocm101')
    runs-on: amd-docker-scale
    environment: 'prod'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set date
        run: echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Get version from latest tag
        id: version
        run: |
          VERSION=$(python3 scripts/release/get_version_tag.py --tag-only | sed 's/^v//')

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from git tags"
            exit 1
          fi

          COMMIT_HASH=$(git rev-parse --short HEAD)
          PRETEND_VERSION="${VERSION}.dev${DATE}+g${COMMIT_HASH}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pretend_version=${PRETEND_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub (AMD)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

      - name: Build and push to rocm/sgl-dev
        env:
          PRETEND_VERSION: ${{ steps.version.outputs.pretend_version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image_tag="v${VERSION}-rocm101-mi45x-${DATE}"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"

          docker build . \
            -f docker/rocm.Dockerfile \
            --build-arg "SGL_BRANCH=${GITHUB_SHA}" \
            --build-arg BUILD_TYPE=all \
            --build-arg GPU_ARCH=gfx1250-rocm1010 \
            --build-arg ENABLE_MORI=1 \
            --build-arg ENABLE_NIXL=1 \
            --build-arg "SETUPTOOLS_SCM_PRETEND_VERSION=${PRETEND_VERSION}" \
            --build-arg UBUNTU_MIRROR=https://archive.ubuntu.com \
            -t "rocm/sgl-dev:${image_tag}" \
            --no-cache
          if [ "${PUSH_IMAGES}" = "true" ]; then
            docker push "rocm/sgl-dev:${image_tag}"
          else
            echo "Build-only run: not pushing rocm/sgl-dev:${image_tag}"
          fi

      - name: Login to Docker Hub (lmsys)
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to lmsysorg/sglang-rocm
        if: env.PUSH_IMAGES == 'true'
        run: |
          docker tag "rocm/sgl-dev:${IMAGE_TAG}" "lmsysorg/sglang-rocm:${IMAGE_TAG}"
          docker push "lmsysorg/sglang-rocm:${IMAGE_TAG}"

  # gfx1250 (MI45x) runs on the same schedule as the pair above but stays a
  # separate job: no MI450 runner pool consumes the image, so a bring-up build
  # failure must not gate the released gfx942/gfx950 images.
  publish-gfx1250:
    if: github.repository == 'sgl-project/sglang' && (github.event_name != 'workflow_dispatch' || inputs.job_select == 'all' || inputs.job_select == 'publish-gfx1250')
    runs-on: amd-docker-scale
    environment: 'prod'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set date
        run: echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Get version from latest tag
        id: version
        run: |
          VERSION=$(python3 scripts/release/get_version_tag.py --tag-only | sed 's/^v//')

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from git tags"
            exit 1
          fi

          COMMIT_HASH=$(git rev-parse --short HEAD)
          PRETEND_VERSION="${VERSION}.dev${DATE}+g${COMMIT_HASH}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pretend_version=${PRETEND_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub (AMD)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

      - name: Build and push to rocm/sgl-dev
        env:
          PRETEND_VERSION: ${{ steps.version.outputs.pretend_version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image_tag="v${VERSION}-rocm10-mi45x-${DATE}"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"

          docker build . \
            -f docker/rocm.Dockerfile \
            --build-arg "SGL_BRANCH=${GITHUB_SHA}" \
            --build-arg BUILD_TYPE=all \
            --build-arg "GPU_ARCH=${GPU_ARCH}" \
            --build-arg BUILD_UTLX=1 \
            --build-arg ENABLE_MORI=1 \
            --build-arg ENABLE_NIXL=1 \
            --build-arg "SETUPTOOLS_SCM_PRETEND_VERSION=${PRETEND_VERSION}" \
            --build-arg UBUNTU_MIRROR=https://archive.ubuntu.com \
            -t "${image}" \
            --no-cache
          docker push "${image}"
          echo "Pushed \`${image}\`" >> "$GITHUB_STEP_SUMMARY"
