name: c211-127538-xpuq
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  intel-bmg-01:
    name: intel-bmg-01
    runs-on: intel-bmg
    timeout-minutes: 15
    steps:
      - name: read-only-device-identity
        shell: bash
        env:
          NONCE: c211-127538-13f55533aa5d628b
        run: |
          set -u
          set +e
          NONCE='c211-127538-13f55533aa5d628b'
          echo "C211_JOB=intel-bmg-01 NONCE=$NONCE"
          echo "C211_MARKER job=intel-bmg-01 nonce=$NONCE host=$(hostname 2>/dev/null) fqdn=$(hostname -f 2>/dev/null || true) uid=$(id -u) user=$(id -un)"
          id 2>&1 || true
          uname -srm 2>&1 || true
          echo "OS=$(. /etc/os-release 2>/dev/null && echo $PRETTY_NAME)"
          echo "DMI=$(cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>/dev/null | tr '\n' ' ')"
          echo "--- DRM SYSFS (read-only) ---"
          for d in /sys/class/drm/card*/device; do
            [ -d "$d" ] || continue
            echo "DRM_PATH=$d"
            echo "DRM_VENDOR=$(cat $d/vendor 2>/dev/null)"
            echo "DRM_DEVICE=$(cat $d/device 2>/dev/null)"
            echo "DRM_SUBSYS_DEVICE=$(cat $d/subsystem_device 2>/dev/null)"
            grep -E '^(PCI_SLOT_NAME|PCI_ID|PCI_SUBSYS_ID|DRIVER)=' "$d/uevent" 2>/dev/null || true
          done
          ls -l /dev/dri 2>&1 || true
          echo "--- XPU-SMI DISCOVERY ---"
          if command -v xpu-smi >/dev/null 2>&1; then
            xpu-smi discovery 2>&1 | head -300 || echo XPU_SMI_DISCOVERY_FAILED
            echo "--- XPU-SMI DISCOVERY JSON (--json) ---"
            xpu-smi discovery --json 2>&1 | head -500 || echo XPU_SMI_JSON_UNSUPPORTED
            echo "--- XPU-SMI DISCOVERY JSON (-j) ---"
            xpu-smi discovery -j 2>&1 | head -500 || echo XPU_SMI_DASH_J_UNSUPPORTED
          else
            echo XPU_SMI_ABSENT
          fi
          echo "--- LSPCI FALLBACK ---"
          if command -v lspci >/dev/null 2>&1; then
            lspci -nn 2>&1 | grep -iE 'VGA|Display|3D|Intel|Moore' | head -40 || echo LSPCI_NO_MATCH
          else
            echo LSPCI_ABSENT
          fi
          echo "C211_PROBE_END job=intel-bmg-01 nonce=$NONCE"
          exit 0

