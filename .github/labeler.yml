# Configuration for the GitHub Labeler action
# Automatically adds labels to PRs based on the files changed

# Router specific (Rust code in sgl-model-gateway)
model-gateway:
  - changed-files:
    - any-glob-to-any-file: 'sgl-model-gateway/**/*'

# Kernel specific
sgl-kernel:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/kernels/aot/**/*'

# JIT kernel specific
jit-kernel:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/kernels/!(*.md)'
      - 'python/sglang/kernels/!(aot)/**/*'

# Documentation
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.[mM][dD]'
      - '**/*.[mM][dD][xX]'
      - '**/*.[rR][sS][tT]'
      - 'docs/**/*'
      - '**/README*'
      - '**/CHANGELOG*'
      - '**/LICENSE*'
      - '**/NOTICE*'

# PPU selection groups. These labels describe changes; they never grant
# run-ci authorization. Keep patterns aligned with pr-test-ppu.yml filters
# (checked by scripts/ci/utils/tests/test_run_ci_workflows.py).
# Documentation is excluded even when it lives beside runtime code/tests.
ppu-runtime:
  - changed-files:
    - all-globs-to-any-file:
      - 'python/sglang/**'
      - '!python/sglang/multimodal_gen/**'
      - '!**/*.[mM][dD]'
      - '!**/*.[mM][dD][xX]'
      - '!**/*.[rR][sS][tT]'
      - '!**/{README*,CHANGELOG*,LICENSE*,NOTICE*}'

ppu-tests:
  - changed-files:
    - all-globs-to-any-file:
      - 'test/**'
      - '!**/*.[mM][dD]'
      - '!**/*.[mM][dD][xX]'
      - '!**/*.[rR][sS][tT]'
      - '!**/{README*,CHANGELOG*,LICENSE*,NOTICE*}'

ppu-ci:
  - changed-files:
    - all-globs-to-any-file:
      # One include union, AND each exclusion, for the same changed file.
      - '{.github/workflows/{ci.yaml,pr-test-ppu.yml,pr-gate.yml,labeler.yml},.github/labeler.yml,.github/actions/**,scripts/ci/{ppu,utils}/**,python/{pyproject*.toml,setup.py,setup.cfg,requirements*.{txt,in}},requirements*.{txt,in}}'
      - '!**/*.[mM][dD]'
      - '!**/*.[mM][dD][xX]'
      - '!**/*.[rR][sS][tT]'
      - '!**/{README*,CHANGELOG*,LICENSE*,NOTICE*}'

# Dependencies
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - '**/requirements*.txt'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pyproject*.toml'
      - '**/setup.py'
      - '**/poetry.lock'
      - '**/package.json'
      - '**/package-lock.json'

# Multi-modal
Multi-modal:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*multimodal*'
      - '**/*vision*'
      - '**/*vlm*'

# Diffusion
diffusion:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/multimodal_gen/**/*'

# LoRA
lora:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*lora*'

# Quantization
quant:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*quant*'
      - '**/*quantization*'

# Speculative decoding
speculative-decoding:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*speculative*'

# AMD specific
amd:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*amd*'
      - '**/*rocm*'

# NPU specific
npu:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*npu*'
      - '**/*ascend*'

# Blackwell
blackwell:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*nvfp4*'
      - 'python/sglang/kernels/aot/csrc/attention/cutlass_sm100_mla/**/*'
      - 'python/sglang/srt/layers/attention/trtllm_mla_backend.py'
      - 'python/sglang/srt/layers/attention/trtllm_mha_backend.py'

# DeepSeek specific
deepseek:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*deepseek*'

# HiCache
hicache:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*hicache*'

# Deterministic
deterministic:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/srt/batch_invariant_ops/**/*'

# Piecewise CUDA Graph
piecewise-cuda-graph:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/srt/compilation/**/*'

# Moore Threads specific
mthreads:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*mthreads*'
      - '**/*musa*'
      - '**/musa/**'

# Apple Silicon specific
apple-silicon:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*metal*'
      - '**/*mlx*'
      - '**/mlx/**'
      - '**/*mps*'
