# Configuration for the GitHub Labeler action
# Automatically adds labels to PRs based on the files changed

# Router specific (Rust code in sgl-model-gateway)
model-gateway:
  - changed-files:
    - any-glob-to-any-file: 'sgl-model-gateway/**/*'

# Kernel specific
sgl-kernel:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/kernels/aot/**/*'

# JIT kernel specific
jit-kernel:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/kernels/!(*.md)'
      - 'python/sglang/kernels/!(aot)/**/*'

# Documentation
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**/*'
      - 'README*'
      - 'docs/**/*'

# Dependencies
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - '**/requirements*.txt'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pyproject*.toml'
      - '**/setup.py'
      - '**/poetry.lock'
      - '**/package.json'
      - '**/package-lock.json'

# Multi-modal
Multi-modal:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*multimodal*'
      - '**/*vision*'
      - '**/*vlm*'

# Diffusion
diffusion:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/multimodal_gen/**/*'

# LoRA
lora:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*lora*'

# Quantization
quant:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*quant*'
      - '**/*quantization*'

# Speculative decoding
speculative-decoding:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*speculative*'

# AMD specific
amd:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*amd*'
      - '**/*rocm*'

# NPU specific
npu:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*npu*'
      - '**/*ascend*'

# Blackwell
blackwell:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*nvfp4*'
      - 'python/sglang/srt/layers/attention/trtllm_mla_backend.py'
      - 'python/sglang/srt/layers/attention/trtllm_mha_backend.py'

# DeepSeek specific
deepseek:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*deepseek*'

memory-pool:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/srt/mem_cache/pool/**/*'
      - 'python/sglang/srt/mem_cache/allocator/**/*'
      - 'python/sglang/srt/mem_cache/layout/**/*'
      - 'python/sglang/srt/mem_cache/**/*memory_pool*'
      - 'test/registered/mem_cache/**/*'

unified-radix-cache:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/srt/mem_cache/unified_cache/**/*'
      - 'python/sglang/srt/mem_cache/**/*radix*'
      - 'python/sglang/srt/mem_cache/evict_policy.py'
      - 'python/sglang/srt/mem_cache/base_prefix_cache.py'
      - 'test/registered/radix_cache/**/*'

hicache:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*hicache*'
      - '**/HiCache/**/*'
      - 'benchmark/hicache/**/*'
      - 'test/registered/hicache/**/*'
      - 'python/sglang/srt/managers/cache_controller.py'
      - 'python/sglang/srt/mem_cache/pool_host/**/*'
      - 'python/sglang/srt/mem_cache/hybrid_cache/**/*'
      - 'python/sglang/srt/mem_cache/storage/**/*'
      - 'python/sglang/srt/mem_cache/buffer_mode/**/*'
      - 'python/sglang/srt/mem_cache/**/*host*'
      - 'python/sglang/srt/mem_cache/**/*storage*'
      - 'python/sglang/srt/mem_cache/l2_transfer.py'

# Mooncake. Three labels, one per subsystem. Match owned paths only.
# A repo-wide *mooncake* glob also hits the serving-trace dataset
# (python/sglang/benchmark/datasets/mooncake.py) and reads as if every
# mention were the transfer stack.
#
# Left unlabeled on purpose:
# - python/sglang/srt/elastic_ep/elastic_ep.py (mooncake and nixl)
# - server args, models, scheduler, encoder, and docs that only select
#   mooncake as one backend
# - python/sglang/srt/mem_cache/utils.py (shared mem-cache helper)
# - radix-cache linker tests that launch MooncakeTestServices
# - test/registered/observability/test_tracing_disaggregation.py
# Store paths still match hicache via storage/**/*, so those PRs get both.

# PD KV transfer and the shared transfer engine.
mooncake-transfer:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/srt/disaggregation/mooncake/**/*'
      - 'python/sglang/srt/distributed/device_communicators/mooncake_transfer_engine.py'
      - 'python/sglang/srt/observability/mooncake_trace.py'
      - 'test/registered/unit/disaggregation/**/*mooncake*'
      - 'test/manual/kv_transfer/**/*mooncake*'

# HiCache storage backend (MooncakeDistributedStore).
mooncake-store:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/srt/mem_cache/storage/mooncake_store/**/*'
      - 'python/sglang/test/mooncake_utils.py'
      - 'test/registered/unit/mem_cache/**/*mooncake*'
      - 'test/registered/hicache/**/*mooncake*'

# MoE all-to-all and elastic-EP expert backup. elastic_ep.py stays out.
mooncake-ep:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/srt/layers/moe/token_dispatcher/mooncake.py'
      - 'python/sglang/srt/elastic_ep/expert_backup_client.py'
      - 'python/sglang/srt/elastic_ep/expert_backup_manager.py'
      - 'test/registered/ep/**/*mooncake*'
      - 'test/manual/ep/**/*mooncake*'

# Deterministic
deterministic:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/srt/batch_invariant_ops/**/*'

# Piecewise CUDA Graph
piecewise-cuda-graph:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/srt/compilation/**/*'

# Moore Threads specific
mthreads:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*mthreads*'
      - '**/*musa*'
      - '**/musa/**'

# Apple Silicon specific
apple-silicon:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*metal*'
      - '**/*mlx*'
      - '**/mlx/**'
      - '**/*mps*'

rust-processor:
  - changed-files:
    - any-glob-to-any-file:
      - 'rust/sglang-processor/**/*'
