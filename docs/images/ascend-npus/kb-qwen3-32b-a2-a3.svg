<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-label="Same 2-card configuration on A3 versus A2 (Qwen3-32B)">
<rect x="0" y="0" width="760" height="320" rx="12" fill="#f7f8fa"/>
<text x="24" y="40" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c2330">Same 2-card configuration on A3 versus A2 (Qwen3-32B)</text>
<text x="24" y="62" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">W8A8 INT8, 3.5k input + 1.5k output, PD mixed. Lower is better.</text>
<line x1="300" y1="86" x2="300" y2="250" stroke="#dfe3e9" stroke-width="1"/>
<text x="286" y="113.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">A3 Series</text>
<rect x="300" y="96.0" width="316.7" height="26" rx="4" fill="#2f6feb"/>
<text x="626.7" y="113.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1c2330">50 ms</text>
<text x="286" y="188.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">A2 Series</text>
<rect x="300" y="171.0" width="348.3" height="26" rx="4" fill="#8b93a1"/>
<text x="658.3" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1c2330">55 ms</text>
<text x="24" y="302" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a919e">Source: Qwen3-32B best practice. Both rows use the same model, precision, card count and dataset.</text>
</svg>