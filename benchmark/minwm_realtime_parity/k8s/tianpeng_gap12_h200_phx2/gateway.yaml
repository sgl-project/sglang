apiVersion: v1
kind: Service
metadata:
  name: minwm-tianpeng-realtime-backend
  namespace: default
  labels:
    app.kubernetes.io/name: minwm-tianpeng-realtime
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-realtime-serving
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minwm-tianpeng-realtime
  ports:
    - name: webui
      port: 18080
      targetPort: webui
      protocol: TCP
    - name: api
      port: 30000
      targetPort: api
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minwm-tianpeng-gateway-nginx
  namespace: default
  labels:
    app.kubernetes.io/name: minwm-tianpeng-gateway
data:
  nginx.conf: |
    user nginx;
    worker_processes 2;
    error_log /var/log/nginx/error.log notice;
    pid /var/run/nginx.pid;
    events { worker_connections 2048; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
      access_log /var/log/nginx/access.log main;
      sendfile on;
      keepalive_timeout 65;
      include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      "" close;
    }
    upstream minwm_api {
      server minwm-tianpeng-realtime-backend.default.svc.cluster.local:30000;
      keepalive 8;
    }
    upstream minwm_webui {
      server minwm-tianpeng-realtime-backend.default.svc.cluster.local:18080;
      keepalive 8;
    }
    server {
      listen 8080;
      # The pre-existing NLB target groups use a fixed 30000 health-check
      # port. Keep that port available while both public listeners forward
      # normal traffic to 8080.
      listen 30000;
      server_name _;
      client_max_body_size 64m;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }
      location = /health {
        proxy_pass http://minwm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
      }
      location ^~ /v1/ {
        proxy_pass http://minwm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
      }
      location / {
        proxy_pass http://minwm_webui;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minwm-tianpeng-gateway
  namespace: default
  labels:
    app.kubernetes.io/name: minwm-tianpeng-gateway
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-realtime-serving
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-tianpeng-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-tianpeng-gateway
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: minwm-realtime-serving
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: c6a.large
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: minwm-tianpeng-gateway-nginx
