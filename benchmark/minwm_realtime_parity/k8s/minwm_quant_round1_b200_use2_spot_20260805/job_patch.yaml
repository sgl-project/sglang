apiVersion: batch/v1
kind: Job
metadata:
  name: minwm-quant-r1-b200-20260805-01
  labels:
    app.kubernetes.io/name: minwm-quant-r1-b200-use2-20260805-02
    seedleap.ai/run-id: minwm-quant-r1-b200-use2-20260805-02
  annotations:
    seedleap.ai/cluster: leap-world-use2
    seedleap.ai/instance-type: p6-b200.48xlarge
spec:
