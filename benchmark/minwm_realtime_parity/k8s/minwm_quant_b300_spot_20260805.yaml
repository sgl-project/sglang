apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minwm-quant-b300-results-20260805
  namespace: default
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/purpose: minwm-realtime-quantization
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: minwm-dmd-0724-p6-gp3
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minwm-quant-matrix-b300-20260805-01
  namespace: default
  labels:
    app.kubernetes.io/name: minwm-quant-matrix-b300-20260805-01
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-realtime-quantization
    seedleap.ai/run-id: minwm-quant-matrix-b300-20260805-01
  annotations:
    seedleap.ai/capacity-type: spot
    seedleap.ai/repo: seedleap/sglang
    seedleap.ai/branch: codex/minwm-realtime-api
    seedleap.ai/sglang-git-ref: "9aed9e1f36928baa4a854adf08b7ed9a55ff5a6e"
    seedleap.ai/minwm-git-ref: "2efc6485f65e8fcab506665efde79bc41406385e"
    seedleap.ai/checkpoint-version-id: "wduScksw2f3yPErnG9lBioOuE2AToyAP"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-quant-matrix-b300-20260805-01
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: minwm-realtime-quantization
        seedleap.ai/run-id: minwm-quant-matrix-b300-20260805-01
      annotations:
        seedleap.ai/repo: seedleap/sglang
        seedleap.ai/branch: codex/minwm-realtime-api
        seedleap.ai/sglang-git-ref: "9aed9e1f36928baa4a854adf08b7ed9a55ff5a6e"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: seedleap.ai/capacity-pool
          operator: Equal
          value: minwm-sp12-usw2d-karpenter
          effect: NoSchedule
      nodeSelector:
        karpenter.sh/capacity-type: spot
        karpenter.sh/nodepool: minwm-sp12-usw2d-p6-spot
        node.kubernetes.io/instance-type: p6-b300.48xlarge
        topology.kubernetes.io/zone: us-west-2d
      containers:
        - name: benchmark
          image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-training@sha256:bedc07ea3ba55059a8c1c569c3b177c4d00d41f37d4fa9105375531534ef5f2a
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: SGLANG_GIT_REF
              value: "9aed9e1f36928baa4a854adf08b7ed9a55ff5a6e"
            - name: MINWM_GIT_REF
              value: "2efc6485f65e8fcab506665efde79bc41406385e"
            - name: MINWM_BENCHMARK_MODE
              value: profiles
            - name: MINWM_INCLUDE_COMPILE_PROFILE
              value: "false"
            - name: MINWM_THROUGHPUT_PROFILES
              value: dense-optimized-components-kv45
            - name: MINWM_STAGE_FROM_MOUNT
              value: "1"
            - name: MINWM_CHECKPOINT_MOUNT_PATH
              value: /s3/world-model/evals/minwm/checkpoint-staging/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_PRETRAINED_MOUNT_PATH
              value: /s3/world-model/checkpoints/minWM/Wan2.2-TI2V-5B-from-diffusers
            - name: MINWM_CHECKPOINT_S3_EAST
              value: s3://leap-world-us-east-2/world-model/evals/minwm/checkpoint-staging/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_CHECKPOINT_VERSION_EAST
              value: wduScksw2f3yPErnG9lBioOuE2AToyAP
            - name: MINWM_CHECKPOINT_SOURCE_URI
              value: s3://leap-world-us-west-2/world-model/minwm/checkpoints/run-archive/rolling/Wan21/Action2V/dmd/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_CHECKPOINT_SOURCE_VERSION
              value: x.2zYaRRNzyqngI7O_cYSrsK3NvgPKKt
            - name: MINWM_CHECKPOINT_SOURCE_ETAG
              value: 5c29d614972e06fd0df859abfd1d6f4d-191
            - name: MINWM_CHECKPOINT_BYTES
              value: "10007171771"
            - name: MINWM_CHECKPOINT_CRC64
              value: I0IQ+p0pREI=
            - name: MINWM_PRETRAINED_S3
              value: s3://leap-world-us-east-2/world-model/checkpoints/minWM/Wan2.2-TI2V-5B-from-diffusers
            - name: MINWM_RESULTS_ROOT
              value: /results/quantization/20260805/results
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              clone_at() {
                local repository="$1" destination="$2" revision="$3"
                git clone --no-checkout \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/${repository}.git" \
                  "${destination}"
                git -C "${destination}" checkout --detach "${revision}"
                [[ "$(git -C "${destination}" rev-parse HEAD)" == "${revision}" ]]
              }
              clone_at minWM /workspace/minWM "${MINWM_GIT_REF}"
              clone_at sglang /workspace/sglang "${SGLANG_GIT_REF}"
              git -C /workspace/sglang rev-parse HEAD

              export MINWM_RUN_ID=minwm-quant-bf16-b300-20260805-01
              unset MINWM_PROFILE_QUANTIZATION
              bash /workspace/sglang/benchmark/minwm_realtime_parity/aws_b200_entrypoint.sh

              export MINWM_RUN_ID=minwm-quant-fp8-b300-20260805-01
              export MINWM_REUSE_INPUT_RUN_ID=minwm-quant-bf16-b300-20260805-01
              export MINWM_REUSE_MODEL_RUN_ID=minwm-quant-bf16-b300-20260805-01
              export MINWM_SKIP_INSTALL=1
              export MINWM_PROFILE_QUANTIZATION=fp8
              bash /workspace/sglang/benchmark/minwm_realtime_parity/aws_b200_entrypoint.sh
          resources:
            requests:
              cpu: "32"
              memory: 200Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "64"
              memory: 400Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: s3
              mountPath: /s3
              readOnly: true
            - name: work
              mountPath: /work
            - name: results
              mountPath: /results
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: s3
          persistentVolumeClaim:
            claimName: s3-claim
        - name: work
          emptyDir: {}
        - name: results
          persistentVolumeClaim:
            claimName: minwm-quant-b300-results-20260805
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
