apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: minwm-tianpeng-rtx6000-spot
  labels:
    seedleap.ai/task: minwm-realtime-benchmark
    seedleap.ai/owner: chenshengdong
spec:
  limits:
    nvidia.com/gpu: "1"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
  template:
    metadata:
      labels:
        seedleap.ai/capacity-pool: minwm-tianpeng-rtx6000-spot
        seedleap.ai/task: minwm-realtime-benchmark
    spec:
      expireAfter: 2h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ray-gpu-ec2-all
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-2a
            - us-east-2b
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g7e.4xlarge
      taints:
        - key: seedleap.ai/capacity-pool
          value: minwm-tianpeng-rtx6000-spot
          effect: NoSchedule
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: minwm-tianpeng-rtx6000-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: minwm-tianpeng-rtx6000-device-plugin
    seedleap.ai/task: minwm-realtime-benchmark
    seedleap.ai/owner: chenshengdong
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-tianpeng-rtx6000-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-tianpeng-rtx6000-device-plugin
        seedleap.ai/task: minwm-realtime-benchmark
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        seedleap.ai/capacity-pool: minwm-tianpeng-rtx6000-spot
      tolerations:
        - key: seedleap.ai/capacity-pool
          operator: Equal
          value: minwm-tianpeng-rtx6000-spot
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.19.1
          imagePullPolicy: IfNotPresent
          command:
            - nvidia-device-plugin
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: kubelet-device-plugins
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: kubelet-device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
