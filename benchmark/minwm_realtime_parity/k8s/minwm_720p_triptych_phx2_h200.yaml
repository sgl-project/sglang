              value: s3://leap-world-us-east-2/world-model/checkpoints/minWM/Wan2.2-TI2V-5B-from-diffusers
            - name: MINWM_RESULTS_ROOT
              value: /work/export-results
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              [[ -n "${GITHUB_TOKEN:-}" ]] || {
                echo "Private seedleap repositories require github-token." >&2
                exit 2
              }
              clone_at() {
                local repository="$1" destination="$2" revision="$3"
                git clone --no-checkout \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/${repository}.git" \
                  "${destination}"
                git -C "${destination}" checkout --detach "${revision}"
                [[ "$(git -C "${destination}" rev-parse HEAD)" == "${revision}" ]]
              }
              clone_at minWM /workspace/minWM "${MINWM_GIT_REF}"
              clone_at sglang /workspace/sglang "${SGLANG_GIT_REF}"
              set +e
              bash /workspace/sglang/benchmark/minwm_realtime_parity/aws_b200_entrypoint.sh
              benchmark_status=$?
              set -e
              echo "MINWM_ARTIFACT_HOLD seconds=${MINWM_ARTIFACT_HOLD_SECONDS}"
              sleep "${MINWM_ARTIFACT_HOLD_SECONDS}"
              exit "${benchmark_status}"
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: s3
              mountPath: /s3
              readOnly: true
            - name: work
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: s3
          persistentVolumeClaim:
            claimName: s3-claim
            readOnly: true
        - name: work
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
