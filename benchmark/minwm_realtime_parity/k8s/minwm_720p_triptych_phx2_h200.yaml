          workingDir: /workspace
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  optional: true
            - name: SGLANG_GIT_REF
              value: "e74a3a3a8a184e81c2f60b2da13c4e71339c141e"
            - name: MINWM_GIT_REF
              value: "2efc6485f65e8fcab506665efde79bc41406385e"
            - name: MINWM_BENCHMARK_MODE
              value: triptych720p
