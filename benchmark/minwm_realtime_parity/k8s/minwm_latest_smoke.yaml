    spec:
      restartPolicy: Never
      schedulerName: volcano
      tolerations:
        - operator: Exists
      nodeSelector:
        seedleap.ai/capacity-pool: minwm-ondemand-karpenter
      containers:
        - name: benchmark
          image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-training:minwm-training-slim-torch2121-fa4-20260705-90d393e-3fa8ad2ecf42
