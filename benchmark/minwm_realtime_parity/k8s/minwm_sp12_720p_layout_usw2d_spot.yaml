          values:
            - p6-b300.48xlarge
            - p6-b200.48xlarge
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-west-2d
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
      taints:
