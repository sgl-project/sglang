          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  optional: true
            - name: SGLANG_GIT_REF
              value: "58c4de3887b6ca5c3c74e80b5f06e0e8017e3428"
            - name: MINWM_GIT_REF
              value: "2efc6485f65e8fcab506665efde79bc41406385e"
            - name: MINWM_BENCHMARK_MODE
              value: spmatrix720p
            - name: MINWM_RUN_ID
              value: minwm-sp12-layout-720p-usw2d-v2-20260731
            - name: MINWM_SP_WARMUP_RUNS
              value: "1"
            - name: MINWM_SP_DEGREES
              value: "1 2"
            - name: MINWM_SP_LOCATION
              value: us-west-2d
            - name: MINWM_CUDA_LAUNCH_BLOCKING
              value: "0"
            - name: MINWM_STAGE_FROM_MOUNT
              value: "1"
            - name: MINWM_S3_MOUNT
              value: /s3
            - name: MINWM_CHECKPOINT_MOUNT_PATH
