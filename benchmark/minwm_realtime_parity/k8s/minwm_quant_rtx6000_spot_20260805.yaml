apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: minwm-quant-rtx6000-spot
  labels:
    seedleap.ai/task: minwm-realtime-quantization
    seedleap.ai/owner: chenshengdong
spec:
  limits:
    nvidia.com/gpu: "1"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
  template:
    metadata:
      labels:
        seedleap.ai/capacity-pool: minwm-quant-rtx6000-spot
        seedleap.ai/task: minwm-realtime-quantization
    spec:
      expireAfter: 4h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ray-gpu-ec2-all
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-2a
            - us-east-2b
            - us-east-2c
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g7e.4xlarge
      taints:
        - key: seedleap.ai/capacity-pool
          value: minwm-quant-rtx6000-spot
          effect: NoSchedule
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: minwm-quant-rtx6000-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: minwm-quant-rtx6000-device-plugin
    seedleap.ai/task: minwm-realtime-quantization
    seedleap.ai/owner: chenshengdong
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-quant-rtx6000-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-quant-rtx6000-device-plugin
        seedleap.ai/task: minwm-realtime-quantization
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        seedleap.ai/capacity-pool: minwm-quant-rtx6000-spot
      tolerations:
        - key: seedleap.ai/capacity-pool
          operator: Equal
          value: minwm-quant-rtx6000-spot
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.19.1
          imagePullPolicy: IfNotPresent
          command:
            - nvidia-device-plugin
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: kubelet-device-plugins
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: kubelet-device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minwm-quant-fp8-rtx6000-20260805-05
  namespace: ray
  labels:
    app.kubernetes.io/name: minwm-quant-fp8-rtx6000-20260805-05
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-realtime-quantization
    seedleap.ai/run-id: minwm-quant-fp8-rtx6000-20260805-05
  annotations:
    seedleap.ai/capacity-type: spot
    seedleap.ai/repo: seedleap/sglang
    seedleap.ai/branch: codex/minwm-realtime-api
    seedleap.ai/sglang-git-ref: "7512868e32776a96f68cabcc8c80c89527419614"
    seedleap.ai/minwm-git-ref: "2efc6485f65e8fcab506665efde79bc41406385e"
    seedleap.ai/checkpoint-version-id: "wduScksw2f3yPErnG9lBioOuE2AToyAP"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-quant-fp8-rtx6000-20260805-05
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: minwm-realtime-quantization
        seedleap.ai/run-id: minwm-quant-fp8-rtx6000-20260805-05
      annotations:
        seedleap.ai/repo: seedleap/sglang
        seedleap.ai/branch: codex/minwm-realtime-api
        seedleap.ai/sglang-git-ref: "7512868e32776a96f68cabcc8c80c89527419614"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        seLinuxOptions:
          type: spc_t
      nodeSelector:
        seedleap.ai/capacity-pool: minwm-quant-rtx6000-spot
        karpenter.sh/capacity-type: spot
        node.kubernetes.io/instance-type: g7e.4xlarge
      tolerations:
        - key: seedleap.ai/capacity-pool
          operator: Equal
          value: minwm-quant-rtx6000-spot
          effect: NoSchedule
      containers:
        - name: benchmark
          image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-training@sha256:bedc07ea3ba55059a8c1c569c3b177c4d00d41f37d4fa9105375531534ef5f2a
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: SGLANG_GIT_REF
              value: "7512868e32776a96f68cabcc8c80c89527419614"
            - name: MINWM_GIT_REF
              value: "2efc6485f65e8fcab506665efde79bc41406385e"
            - name: MINWM_BENCHMARK_MODE
              value: profiles
            - name: MINWM_INCLUDE_COMPILE_PROFILE
              value: "false"
            - name: MINWM_THROUGHPUT_PROFILES
              value: dense-optimized-components-kv45
            - name: MINWM_PRESERVE_IMAGE_GPU_STACK
              value: "1"
            - name: MINWM_BUILD_SGLANG_KERNEL_FROM_SOURCE
              value: "1"
            - name: MINWM_SGLANG_KERNEL_WHEEL_PATH
              value: /s3/world-model/evals/minwm/quantization/20260805/artifacts/sglang_kernel-0.4.4-torch2.12.1-cu130-sm120.whl
            - name: MINWM_STAGE_FROM_MOUNT
              value: "1"
            - name: MINWM_CHECKPOINT_MOUNT_PATH
              value: /s3/world-model/evals/minwm/checkpoint-staging/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_PRETRAINED_MOUNT_PATH
              value: /s3/world-model/checkpoints/minWM/Wan2.2-TI2V-5B-from-diffusers
            - name: MINWM_CHECKPOINT_S3_EAST
              value: s3://leap-world-us-east-2/world-model/evals/minwm/checkpoint-staging/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_CHECKPOINT_VERSION_EAST
              value: wduScksw2f3yPErnG9lBioOuE2AToyAP
            - name: MINWM_CHECKPOINT_SOURCE_URI
              value: s3://leap-world-us-west-2/world-model/minwm/checkpoints/run-archive/rolling/Wan21/Action2V/dmd/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_CHECKPOINT_SOURCE_VERSION
              value: x.2zYaRRNzyqngI7O_cYSrsK3NvgPKKt
            - name: MINWM_CHECKPOINT_SOURCE_ETAG
              value: 5c29d614972e06fd0df859abfd1d6f4d-191
            - name: MINWM_CHECKPOINT_BYTES
              value: "10007171771"
            - name: MINWM_CHECKPOINT_CRC64
              value: I0IQ+p0pREI=
            - name: MINWM_PRETRAINED_S3
              value: s3://leap-world-us-east-2/world-model/checkpoints/minWM/Wan2.2-TI2V-5B-from-diffusers
            - name: MINWM_RESULTS_ROOT
              value: /s3/world-model/evals/minwm/quantization/20260805/results
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              clone_at() {
                local repository="$1" destination="$2" revision="$3"
                git clone --no-checkout \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/${repository}.git" \
                  "${destination}"
                git -C "${destination}" checkout --detach "${revision}"
                [[ "$(git -C "${destination}" rev-parse HEAD)" == "${revision}" ]]
              }
              clone_at minWM /workspace/minWM "${MINWM_GIT_REF}"
              clone_at sglang /workspace/sglang "${SGLANG_GIT_REF}"
              git -C /workspace/sglang rev-parse HEAD

              export MINWM_RUN_ID=minwm-quant-fp8-rtx6000-20260805-05
              export MINWM_PROFILE_QUANTIZATION=fp8
              bash /workspace/sglang/benchmark/minwm_realtime_parity/aws_b200_entrypoint.sh
          resources:
            requests:
              cpu: "8"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "14"
              memory: 112Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: s3
              mountPath: /s3
            - name: work
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: s3
          persistentVolumeClaim:
            claimName: s3-claim
        - name: work
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
