apiVersion: batch/v1
kind: Job
metadata:
  name: minwm-static-fp8-exact-vae-overlap-b200-20260806-06
  namespace: ray
  labels:
    app.kubernetes.io/name: minwm-static-fp8-exact-vae-overlap-b200-20260806-06
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-static-fp8-2x
    seedleap.ai/run-id: minwm-static-fp8-exact-vae-overlap-b200-20260806-06
  annotations:
    seedleap.ai/capacity-type: spot
    seedleap.ai/repo: seedleap/sglang
    seedleap.ai/branch: codex/minwm-realtime-api
    seedleap.ai/sglang-git-ref: "1ad71533009d72c04b4fc20c16ad73c1cd3d9540"
    seedleap.ai/minwm-git-ref: "2efc6485f65e8fcab506665efde79bc41406385e"
    seedleap.ai/checkpoint-version-id: "wduScksw2f3yPErnG9lBioOuE2AToyAP"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-static-fp8-exact-vae-overlap-b200-20260806-06
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: minwm-static-fp8-2x
        seedleap.ai/run-id: minwm-static-fp8-exact-vae-overlap-b200-20260806-06
      annotations:
        seedleap.ai/repo: seedleap/sglang
        seedleap.ai/branch: codex/minwm-realtime-api
        seedleap.ai/sglang-git-ref: "1ad71533009d72c04b4fc20c16ad73c1cd3d9540"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      nodeSelector:
        karpenter.sh/capacity-type: spot
        karpenter.sh/nodepool: minwm-test-b200-spot
        node.kubernetes.io/instance-type: p6-b200.48xlarge
        seedleap.ai/capacity-pool: minwm-test-b200-karpenter
      tolerations:
        - key: seedleap.ai/workload
          operator: Equal
          value: wan22-ti2v
          effect: NoSchedule
      containers:
        - name: benchmark
          image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-training@sha256:bedc07ea3ba55059a8c1c569c3b177c4d00d41f37d4fa9105375531534ef5f2a
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MATRIX_ID
              value: minwm-static-fp8-exact-vae-overlap-b200-20260806-06
            - name: SGLANG_GIT_REF
              value: "1ad71533009d72c04b4fc20c16ad73c1cd3d9540"
            - name: MINWM_GIT_REF
              value: "2efc6485f65e8fcab506665efde79bc41406385e"
            - name: MINWM_STAGE_FROM_MOUNT
              value: "1"
            - name: MINWM_CHECKPOINT_MOUNT_PATH
              value: /s3/world-model/evals/minwm/checkpoint-staging/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_PRETRAINED_MOUNT_PATH
              value: /s3/world-model/checkpoints/minWM/Wan2.2-TI2V-5B-from-diffusers
            - name: MINWM_CHECKPOINT_S3_EAST
              value: s3://leap-world-us-east-2/world-model/evals/minwm/checkpoint-staging/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_CHECKPOINT_VERSION_EAST
              value: wduScksw2f3yPErnG9lBioOuE2AToyAP
            - name: MINWM_CHECKPOINT_SOURCE_URI
              value: s3://leap-world-us-west-2/world-model/minwm/checkpoints/run-archive/rolling/Wan21/Action2V/dmd/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_CHECKPOINT_SOURCE_VERSION
              value: x.2zYaRRNzyqngI7O_cYSrsK3NvgPKKt
            - name: MINWM_CHECKPOINT_SOURCE_ETAG
              value: 5c29d614972e06fd0df859abfd1d6f4d-191
            - name: MINWM_CHECKPOINT_BYTES
              value: "10007171771"
            - name: MINWM_CHECKPOINT_CRC64
              value: I0IQ+p0pREI=
            - name: MINWM_PRETRAINED_S3
              value: s3://leap-world-us-east-2/world-model/checkpoints/minWM/Wan2.2-TI2V-5B-from-diffusers
            - name: MINWM_RESULTS_ROOT
              value: /s3/world-model/evals/minwm/quantization/20260805/static-fp8-2x/e2e-exact-vae-overlap-06
            - name: MINWM_CASES_PATH
              value: /workspace/sglang/benchmark/minwm_realtime_parity/cases_720p_compile_smoke.json
            - name: MINWM_THROUGHPUT_CASES_PATH
              value: /workspace/sglang/benchmark/minwm_realtime_parity/cases_720p_compile_smoke.json
            - name: MINWM_THROUGHPUT_CASE
              value: 00_forward_080_pottery_720p
            - name: MINWM_THROUGHPUT_WARMUP_CHUNKS
              value: "20"
            - name: MINWM_THROUGHPUT_MEASURED_CHUNKS
              value: "200"
            - name: MINWM_INCLUDE_COMPILE_PROFILE
              value: "false"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              clone_at() {
                local repository="$1" destination="$2" revision="$3"
                git clone --no-checkout \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/${repository}.git" \
                  "${destination}"
                git -C "${destination}" checkout --detach "${revision}"
                [[ "$(git -C "${destination}" rev-parse HEAD)" == "${revision}" ]]
              }
              clone_at minWM /workspace/minWM "${MINWM_GIT_REF}"
              clone_at sglang /workspace/sglang "${SGLANG_GIT_REF}"

              result_root="${MINWM_RESULTS_ROOT%/}"
              mkdir -p "${result_root}"
              exec > >(tee -a "${result_root}/${MATRIX_ID}-job.log") 2>&1
              {
                echo "matrix=${MATRIX_ID}"
                echo "pod=${POD_NAME}"
                echo "node=${NODE_NAME}"
                echo "capacity=spot"
                echo "gpu_request=2"
                echo "sglang=${SGLANG_GIT_REF}"
                echo "minwm=${MINWM_GIT_REF}"
                date -Iseconds
              } > "${result_root}/${MATRIX_ID}-provenance.txt"
              nvidia-smi -q > "${result_root}/${MATRIX_ID}-nvidia-smi.txt"

              entrypoint=/workspace/sglang/benchmark/minwm_realtime_parity/aws_b200_entrypoint.sh
              profile=dense-optimized-components-kv45
              setup_run="${MATRIX_ID}-setup"
              bf16_local="${MATRIX_ID}-bf16-local"
              static_local="${MATRIX_ID}-static-local"
              bf16_overlap="${MATRIX_ID}-bf16-exact-vae-overlap"
              static_overlap="${MATRIX_ID}-static-exact-vae-overlap"

              echo "MINWM_STATIC_FP8_2X_LANE_START lane=setup timestamp=$(date -Iseconds)"
              env \
                CUDA_VISIBLE_DEVICES=0 \
                MINWM_RUN_ID="${setup_run}" \
                MINWM_BENCHMARK_MODE=setup_only \
                bash "${entrypoint}"
              echo "MINWM_STATIC_FP8_2X_LANE_END lane=setup status=0 timestamp=$(date -Iseconds)"

              PYTHONPATH=/workspace/sglang/python python3 -m pytest -q \
                /workspace/sglang/python/sglang/multimodal_gen/test/unit/realtime/test_realtime_vae.py \
                /workspace/sglang/python/sglang/multimodal_gen/test/unit/realtime/test_minwm_realtime.py \
                /workspace/sglang/python/sglang/multimodal_gen/test/unit/realtime/test_realtime_output_transport.py \
                /workspace/sglang/python/sglang/multimodal_gen/test/unit/test_minwm_static_fp8_transformer.py \
                /workspace/sglang/test/registered/jit/diffusion/test_diffusion_modelopt_fp8_scaled_mm.py \
                | tee "${result_root}/${MATRIX_ID}-remote-vae-pytest.log"

              echo "MINWM_STATIC_FP8_2X_LANE_START lane=bf16-local timestamp=$(date -Iseconds)"
              env \
                CUDA_VISIBLE_DEVICES=0 \
                MINWM_RUN_ID="${bf16_local}" \
                MINWM_REUSE_INPUT_RUN_ID="${setup_run}" \
                MINWM_REUSE_MODEL_RUN_ID="${setup_run}" \
                MINWM_SKIP_INSTALL=1 \
                MINWM_BENCHMARK_MODE=profiles \
                MINWM_PROFILE_QUANTIZATION_LABEL=bf16 \
                MINWM_THROUGHPUT_PROFILES="${profile}" \
                bash "${entrypoint}"
              echo "MINWM_STATIC_FP8_2X_LANE_END lane=bf16-local status=0 timestamp=$(date -Iseconds)"

              echo "MINWM_STATIC_FP8_2X_LANE_START lane=static-local timestamp=$(date -Iseconds)"
              env \
                CUDA_VISIBLE_DEVICES=0 \
                MINWM_RUN_ID="${static_local}" \
                MINWM_REUSE_INPUT_RUN_ID="${setup_run}" \
                MINWM_REUSE_MODEL_RUN_ID="${setup_run}" \
                MINWM_SKIP_INSTALL=1 \
                MINWM_BENCHMARK_MODE=calibratedfp8 \
                MINWM_STATIC_FP8_SCOPE=ffn \
                MINWM_PROFILE_QUANTIZATION_LABEL=static_fp8_ffn_sm100_cublaslt_jit_quant \
                MINWM_THROUGHPUT_PROFILES="${profile}" \
                bash "${entrypoint}"
              echo "MINWM_STATIC_FP8_2X_LANE_END lane=static-local status=0 timestamp=$(date -Iseconds)"

              vae_log_local="/work/${MATRIX_ID}-exact-vae-server.log"
              vae_log="${result_root}/${MATRIX_ID}-exact-vae-server.log"
              CUDA_VISIBLE_DEVICES=1 \
                MINWM_NATIVE_COMPONENTS= \
                PYTHONPATH=/workspace/sglang/python \
                python3 -m sglang.multimodal_gen.runtime.entrypoints.vae_decode_server \
                  --vae-path "/work/minwm-realtime/${setup_run}/sglang-model/vae" \
                  --model-path "/work/minwm-realtime/${setup_run}/sglang-model" \
                  --pipeline-class-name MinWMCausalDMDPipeline \
                  --num-gpus 1 \
                  --attention-backend fa \
                  --performance-mode speed \
                  --enable-torch-compile false \
                  --warmup-mode off \
                  --vae-decoder-host 127.0.0.1 \
                  --vae-decoder-port 31000 \
                  > "${vae_log_local}" 2>&1 &
              vae_pid=$!
              cleanup_vae() {
                kill "${vae_pid}" 2>/dev/null || true
                wait "${vae_pid}" 2>/dev/null || true
                cp "${vae_log_local}" "${vae_log}" 2>/dev/null || true
              }
              trap cleanup_vae EXIT INT TERM
              for _ in $(seq 1 300); do
                curl --fail --silent http://127.0.0.1:31000/health >/dev/null && break
                if ! kill -0 "${vae_pid}" 2>/dev/null; then
                  tail -300 "${vae_log_local}" >&2
                  exit 1
                fi
                sleep 2
              done
              curl --fail --silent http://127.0.0.1:31000/health >/dev/null
              if ! grep -Fq \
                'Loaded vae: AutoencoderKLWan (sgl-diffusion version)' \
                "${vae_log_local}"; then
                echo 'exact VAE server did not load the profile-matched SGLang VAE' >&2
                tail -300 "${vae_log_local}" >&2
                exit 1
              fi

              echo "MINWM_STATIC_FP8_2X_LANE_START lane=bf16-exact-vae-overlap timestamp=$(date -Iseconds)"
              env \
                CUDA_VISIBLE_DEVICES=0 \
                SGLANG_REALTIME_REMOTE_VAE_URL=http://127.0.0.1:31000 \
                MINWM_RUN_ID="${bf16_overlap}" \
                MINWM_REUSE_INPUT_RUN_ID="${setup_run}" \
                MINWM_REUSE_MODEL_RUN_ID="${setup_run}" \
                MINWM_SKIP_INSTALL=1 \
                MINWM_BENCHMARK_MODE=profiles \
                MINWM_PROFILE_QUANTIZATION_LABEL=bf16_exact_vae_overlap \
                MINWM_THROUGHPUT_PROFILES="${profile}" \
                bash "${entrypoint}"
              echo "MINWM_STATIC_FP8_2X_LANE_END lane=bf16-exact-vae-overlap status=0 timestamp=$(date -Iseconds)"

              echo "MINWM_STATIC_FP8_2X_LANE_START lane=static-exact-vae-overlap timestamp=$(date -Iseconds)"
              env \
                CUDA_VISIBLE_DEVICES=0 \
                SGLANG_REALTIME_REMOTE_VAE_URL=http://127.0.0.1:31000 \
                MINWM_RUN_ID="${static_overlap}" \
                MINWM_REUSE_INPUT_RUN_ID="${setup_run}" \
                MINWM_REUSE_MODEL_RUN_ID="${setup_run}" \
                MINWM_REUSE_STATIC_FP8_RUN_ID="${static_local}" \
                MINWM_SKIP_INSTALL=1 \
                MINWM_BENCHMARK_MODE=calibratedfp8 \
                MINWM_STATIC_FP8_SCOPE=ffn \
                MINWM_PROFILE_QUANTIZATION_LABEL=static_fp8_ffn_exact_vae_overlap \
                MINWM_THROUGHPUT_PROFILES="${profile}" \
                bash "${entrypoint}"
              echo "MINWM_STATIC_FP8_2X_LANE_END lane=static-exact-vae-overlap status=0 timestamp=$(date -Iseconds)"
          resources:
            requests:
              cpu: "48"
              memory: 300Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "96"
              memory: 600Gi
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: s3
              mountPath: /s3
            - name: work
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: s3
          persistentVolumeClaim:
            claimName: s3-claim
        - name: work
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 96Gi
