kind: Service
metadata:
  name: minwm-dmd-0724-p6-open
  namespace: default
  labels:
    app: minwm-dmd-0724-p6
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-realtime-serving
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-0b6a784859ea30d13,subnet-02296f99e90de96b2,subnet-05f94519b218b0f37
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: project=seed-leap,environment=dev,managed_by=kubernetes,service=minwm-dmd-0724-open
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "30000"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /health
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  allocateLoadBalancerNodePorts: false
  selector:
    app: minwm-dmd-0724-p6
  ports:
    - name: webui
      port: 80
      targetPort: webui
      protocol: TCP
    - name: api
      port: 30000
      targetPort: api
      protocol: TCP
---
