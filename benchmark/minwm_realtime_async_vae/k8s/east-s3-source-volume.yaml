apiVersion: v1
kind: PersistentVolume
metadata:
  name: minwm-async-east-s3-source-pv
  labels:
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  capacity:
    storage: 1200Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  csi:
    driver: s3.csi.aws.com
    volumeHandle: minwm-async-east-s3-source-20260807
    volumeAttributes:
      bucketName: leap-world-us-east-2
      mount-timeout-seconds: "300"
  mountOptions:
    - region us-east-2
    - --read-part-size 25165824
    - --maximum-throughput-gbps 100
    - --metadata-ttl 3600
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minwm-async-east-s3-source
  namespace: minwm-realtime
  labels:
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: minwm-async-east-s3-source-pv
  resources:
    requests:
      storage: 1200Gi
