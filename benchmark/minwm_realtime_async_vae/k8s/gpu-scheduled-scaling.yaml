apiVersion: v1
kind: ServiceAccount
metadata:
  name: minwm-realtime-gpu-scaler
  namespace: minwm-realtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minwm-realtime-gpu-scaler
  namespace: minwm-realtime
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [minwm-async-denoiser, minwm-async-vae]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minwm-realtime-gpu-scaler
  namespace: minwm-realtime
subjects:
  - kind: ServiceAccount
    name: minwm-realtime-gpu-scaler
    namespace: minwm-realtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minwm-realtime-gpu-scaler
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minwm-realtime-gpu-scale-up
  namespace: minwm-realtime
spec:
  schedule: REPLACE_WITH_GPU_SCALE_UP_SCHEDULE
  suspend: REPLACE_WITH_GPU_SCALE_UP_SUSPEND
  timeZone: REPLACE_WITH_GPU_SCALE_TIME_ZONE
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: minwm-realtime-gpu-scaler
            app.kubernetes.io/part-of: minwm-realtime
        spec:
          serviceAccountName: minwm-realtime-gpu-scaler
          restartPolicy: Never
          nodeSelector:
            karpenter.sh/nodepool: minwm-realtime-cpu
          tolerations:
            - key: seedleap.ai/task
              operator: Equal
              value: minwm-realtime-cpu
              effect: NoSchedule
          containers:
            - name: scaler
              image: REPLACE_WITH_GATEWAY_IMAGE_DIGEST
              command: [python]
              args:
                - -m
                - sglang.multimodal_gen.runtime.entrypoints.realtime_gpu_scaler
                - --denoiser-replicas=REPLACE_WITH_DENOISER_PEAK_REPLICAS
                - --vae-replicas=REPLACE_WITH_VAE_PEAK_REPLICAS
              env:
                - name: POD_NAMESPACE
                  valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minwm-realtime-gpu-scale-down
  namespace: minwm-realtime
spec:
  schedule: REPLACE_WITH_GPU_SCALE_DOWN_SCHEDULE
  suspend: REPLACE_WITH_GPU_SCALE_DOWN_SUSPEND
  timeZone: REPLACE_WITH_GPU_SCALE_TIME_ZONE
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: minwm-realtime-gpu-scaler
            app.kubernetes.io/part-of: minwm-realtime
        spec:
          serviceAccountName: minwm-realtime-gpu-scaler
          restartPolicy: Never
          nodeSelector:
            karpenter.sh/nodepool: minwm-realtime-cpu
          tolerations:
            - key: seedleap.ai/task
              operator: Equal
              value: minwm-realtime-cpu
              effect: NoSchedule
          containers:
            - name: scaler
              image: REPLACE_WITH_GATEWAY_IMAGE_DIGEST
              command: [python]
              args:
                - -m
                - sglang.multimodal_gen.runtime.entrypoints.realtime_gpu_scaler
                - --denoiser-replicas=0
                - --vae-replicas=0
              env:
                - name: POD_NAMESPACE
                  valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 64Mi}
