apiVersion: v1
kind: ServiceAccount
metadata:
  name: minwm-realtime-worker-discovery
  namespace: minwm-realtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minwm-realtime-worker-discovery
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: minwm-realtime-worker-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: minwm-realtime-worker-discovery
subjects:
  - kind: ServiceAccount
    name: minwm-realtime-worker-discovery
    namespace: minwm-realtime
