apiVersion: v1
kind: Service
metadata:
  name: minwm-async-denoiser-headless
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: minwm-async-denoiser
    app.kubernetes.io/part-of: minwm-realtime
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: minwm-async-denoiser
  ports:
    - {name: api, port: 30000, targetPort: api}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minwm-async-denoiser
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: minwm-async-denoiser
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  replicas: REPLACE_WITH_DENOISER_BASE_REPLICAS
  revisionHistoryLimit: 1
  serviceName: minwm-async-denoiser-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-async-denoiser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-async-denoiser
        app.kubernetes.io/part-of: minwm-realtime
        seedleap.ai/test-run: minwm-async-vae-benchmark
    spec:
      serviceAccountName: minwm-realtime-worker-discovery
      restartPolicy: Always
      terminationGracePeriodSeconds: 90
      nodeSelector:
        karpenter.sh/nodepool: REPLACE_WITH_DENOISER_NODEPOOL
        karpenter.sh/capacity-type: spot
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        seLinuxOptions:
          type: spc_t
      containers:
        - name: denoiser
          image: REPLACE_WITH_DENOISER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          workingDir: /opt/sglang
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: MODEL_REVISION, value: wan22-5b-stage3-dmd-30-gs1800}
            - {name: REALTIME_MAX_SESSIONS, value: "4"}
            - name: REALTIME_UI_CONFIG_JSON
              value: '{"generationModes":["i2v","t2v"],"defaultGenerationMode":"i2v","t2vFrameStep":4,"t2vDefaultNumFrames":121}'
            - name: MINWM_MODEL
              value: /checkpoint-archive/world-model/minwm/serving-artifacts/wan22-5b-stage3-dmd-30-gs1800/REPLACE_WITH_MODEL_ARTIFACT_REVISION/model
            - {name: TAEHV_CHECKPOINT_PATH, value: /opt/taehv/taew2_2.pth}
            - {name: MINWM_ATTENTION_IMPL, value: packed}
            - {name: MINWM_PACKED_ATTENTION_DETERMINISTIC, value: "false"}
            - {name: MINWM_NATIVE_COMPONENTS, value: "text_encoder,vae"}
            - {name: SGLANG_DIFFUSION_VAE_CHANNELS_LAST_3D, value: "false"}
            - {name: OTEL_SERVICE_NAME, value: minwm-realtime-denoiser}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://minwm-realtime-adot:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=minwm,deployment.environment=production,worker.role=denoiser
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              test -f "${MINWM_MODEL}/_READY"
              test -f "${MINWM_MODEL}/model_index.json"
              test -d "${MINWM_MODEL}/transformer"
              exec 9>/var/run/minwm-startup-lock/denoiser.lock
              flock -x 9
              python3 -m sglang.multimodal_gen.runtime.launch_server \
                --model-path "${MINWM_MODEL}" \
                --pipeline-class-name MinWMCausalDMDPipeline \
                --attention-backend fa \
                --performance-mode speed \
                --num-gpus 1 \
                --sp-degree 1 \
                --enable-cfg-parallel false \
                --enable-torch-compile false \
                --warmup-mode off \
                --batching-max-size 4 \
                --batching-delay-ms 2 \
                --realtime-max-sessions "${REALTIME_MAX_SESSIONS}" \
                --realtime-max-sessions-per-worker "${REALTIME_MAX_SESSIONS}" \
                --realtime-session-idle-timeout-s 60 \
                --realtime-session-max-lifetime-s 600 \
                --realtime-admission-wait-s 10 \
                --realtime-causal-sink-size 8 \
                --realtime-causal-kv-cache-num-frames 32 \
                --enable-trace \
                --otlp-traces-endpoint "${OTEL_EXPORTER_OTLP_ENDPOINT}" \
                --host 0.0.0.0 \
                --port 30000 &
              child=$!
              terminate() {
                kill -TERM "${child}" 2>/dev/null || true
                wait "${child}" || true
                exit 143
              }
              trap terminate TERM INT
              until curl --fail --silent --max-time 2 http://127.0.0.1:30000/health >/dev/null; do
                if ! kill -0 "${child}" 2>/dev/null; then
                  wait "${child}"
                  exit $?
                fi
                sleep 2
              done
              flock -u 9
              wait "${child}"
          ports:
            - {name: api, containerPort: 30000}
          startupProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 270
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: api}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "6"
              memory: 160Gi
              ephemeral-storage: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "7"
              memory: 220Gi
              ephemeral-storage: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: checkpoint-archive, mountPath: /checkpoint-archive, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
            - {name: startup-lock, mountPath: /var/run/minwm-startup-lock}
        - name: denoiser-heartbeat
          image: REPLACE_WITH_DENOISER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - >-
              exec python3 -m sglang.multimodal_gen.runtime.entrypoints.realtime_worker_heartbeat
              --coordinator-url=http://minwm-realtime-coordinator:18081
              --health-url=http://127.0.0.1:30000/health
              --worker-id=$(POD_UID)
              --role=denoiser
              --endpoint=ws://$(POD_IP):30000/v1/realtime_video/generate
              --node-name=$(NODE_NAME)
              --capacity=4
              --model-revision=wan22-5b-stage3-dmd-30-gs1800
              --vae-fingerprint=taew2_2-d053e216
              --interval-s=5
          env:
            - {name: SGLANG_LIGHTWEIGHT_RUNTIME, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
      volumes:
        - name: checkpoint-archive
          persistentVolumeClaim: {claimName: minwm-async-west-s3, readOnly: true}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 64Gi}
        - name: startup-lock
          hostPath:
            path: /var/run/minwm-startup-lock
            type: DirectoryOrCreate
