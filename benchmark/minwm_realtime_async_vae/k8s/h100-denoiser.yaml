apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: minwm-async-denoiser-h100
  labels:
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  limits:
    cpu: "128"
    nvidia.com/gpu: "8"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
  template:
    metadata:
      labels:
        seedleap.ai/capacity-pool: minwm-async-denoiser-h100
        seedleap.ai/denoiser-worker: "true"
        seedleap.ai/test-run: minwm-async-vae-benchmark
    spec:
      expireAfter: 24h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: minwm-test-h100-single-ec2
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [p5.4xlarge]
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
---
