apiVersion: v1
kind: ServiceAccount
metadata:
  name: minwm-model-artifact-publisher
  namespace: minwm-realtime
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_MODEL_ARTIFACT_PUBLISHER_ROLE_ARN
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: minwm-model-artifact-publisher
  labels:
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - name: amazon-eks-node-al2023-x86_64-standard-*
      owner: amazon
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        iops: 3000
        throughput: 125
        volumeSize: 300Gi
        volumeType: gp3
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  role: KarpenterNodeRole-leap-world
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: leap-world}
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: leap-world}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: minwm-model-artifact-publisher
  labels:
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
  template:
    metadata:
      labels:
        seedleap.ai/model-artifact-publisher: "true"
        seedleap.ai/test-run: minwm-async-vae-benchmark
    spec:
      expireAfter: 6h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: minwm-model-artifact-publisher
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [r7i.8xlarge]
      taints:
        - key: seedleap.ai/task
          value: minwm-model-artifact-publisher
          effect: NoSchedule
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minwm-model-artifact-publisher
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 10800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-model-artifact-publisher
        app.kubernetes.io/part-of: minwm-realtime
    spec:
      serviceAccountName: minwm-model-artifact-publisher
      restartPolicy: Never
      nodeSelector:
        karpenter.sh/nodepool: minwm-model-artifact-publisher
      tolerations:
        - key: seedleap.ai/task
          operator: Equal
          value: minwm-model-artifact-publisher
          effect: NoSchedule
      containers:
        - name: publisher
          image: REPLACE_WITH_DENOISER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/sglang/benchmark/minwm_realtime_async_vae/publish_model_artifact.py]
          args:
            - --source-checkpoint=/checkpoint-archive/world-model/minwm/checkpoints/run-archive/rolling/Wan21/Action2V/dmd/wan22-5B-stage3-dmd-30-0731-acfd622962df/global_step_001800/ema_student/model.pt
            - --source-uri=s3://leap-world-us-west-2/world-model/minwm/checkpoints/run-archive/rolling/Wan21/Action2V/dmd/wan22-5B-stage3-dmd-30-0731-acfd622962df/global_step_001800/ema_student/model.pt
            - --source-version-id=ghDNCSQtQ2OJ1LnrxtMKLXtqNWDK0CsR
            - --donor-dir=/checkpoint-archive/world-model/checkpoints/minWM/Wan2.2-TI2V-5B-from-diffusers
            - --converter-script=/opt/sglang/python/sglang/multimodal_gen/tools/convert_minwm_checkpoint.py
            - --converter-git-sha=REPLACE_WITH_CONVERTER_GIT_SHA
            - --revision=REPLACE_WITH_MODEL_ARTIFACT_REVISION
            - --output-bucket=leap-world-us-west-2
            - --output-region=us-west-2
            - --output-prefix=world-model/minwm/serving-artifacts/wan22-5b-stage3-dmd-30-gs1800
            - --upload-concurrency=16
          resources:
            requests: {cpu: "24", memory: 128Gi, ephemeral-storage: 100Gi}
            limits: {cpu: "31", memory: 220Gi, ephemeral-storage: 220Gi}
          volumeMounts:
            - {name: checkpoint-archive, mountPath: /checkpoint-archive, readOnly: true}
      volumes:
        - name: checkpoint-archive
          persistentVolumeClaim: {claimName: minwm-async-west-s3, readOnly: true}
