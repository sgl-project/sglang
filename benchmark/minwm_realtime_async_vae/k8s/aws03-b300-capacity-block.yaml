    app.kubernetes.io/name: minwm-b300-coordinator
  ports:
    - name: http
      port: 18081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minwm-b300-coordinator
  namespace: default
  labels:
    app.kubernetes.io/name: minwm-b300-coordinator
    app.kubernetes.io/part-of: minwm-b300-realtime
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-b300-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-b300-coordinator
        app.kubernetes.io/part-of: minwm-b300-realtime
    spec:
      serviceAccountName: minwm-b300-gateway
      nodeSelector:
        kubernetes.io/hostname: ip-172-31-44-14.us-west-2.compute.internal
      terminationGracePeriodSeconds: 30
      containers:
        - name: coordinator
          image: 107014413969.dkr.ecr.us-west-2.amazonaws.com/leap-world/minwm-realtime@sha256:4ac3891b446b46e2f37ddd94d6d4fdc936a267521128ea17056312ce679efee9
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          env:
            - {name: PYTHONPATH, value: /opt/sglang/python}
            - {name: SGLANG_LIGHTWEIGHT_RUNTIME, value: "1"}
          args:
            - >-
              exec python -m sglang.multimodal_gen.runtime.entrypoints.realtime_coordinator_server
              --host=0.0.0.0
              --port=18081
              --backend=memory
              --ttl-s=30
              --worker-ttl-s=15
              --wait-timeout-s=10
              --candidate-limit=64
          ports:
            - name: http
              containerPort: 18081
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: minwm-b300-gateway
  namespace: default
spec:
