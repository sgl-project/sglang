apiVersion: apps/v1
kind: Deployment
metadata:
  name: minwm-realtime-gpu-capacity-scaler
  namespace: minwm-realtime
spec:
  replicas: REPLACE_WITH_GPU_EVENT_SCALER_REPLICAS
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-realtime-gpu-capacity-scaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-realtime-gpu-capacity-scaler
        app.kubernetes.io/part-of: minwm-realtime
    spec:
      serviceAccountName: minwm-realtime-gpu-scaler
      nodeSelector:
        karpenter.sh/nodepool: minwm-realtime-cpu
      tolerations:
        - key: seedleap.ai/task
          operator: Equal
          value: minwm-realtime-cpu
          effect: NoSchedule
      containers:
        - name: scaler
          image: REPLACE_WITH_GATEWAY_IMAGE_DIGEST
          command: [python]
          args:
            - -m
            - sglang.multimodal_gen.runtime.entrypoints.realtime_gpu_scaler
            - --coordinator-url=http://minwm-realtime-coordinator:18081
            - --poll-interval-s=5
            - --denoiser-min-replicas=REPLACE_WITH_DENOISER_BASE_REPLICAS
            - --denoiser-max-replicas=REPLACE_WITH_DENOISER_PEAK_REPLICAS
            - --denoiser-sessions-per-replica=4
            - --vae-min-replicas=REPLACE_WITH_VAE_BASE_REPLICAS
            - --vae-max-replicas=REPLACE_WITH_VAE_PEAK_REPLICAS
            - --vae-sessions-per-replica=16
            - --idle-observations-before-scale-down=24
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
