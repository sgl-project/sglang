apiVersion: v1
kind: ServiceAccount
metadata:
  name: minwm-realtime-coordinator
  namespace: minwm-realtime
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_COORDINATOR_ROLE_ARN
---
apiVersion: v1
kind: Service
metadata:
  name: minwm-realtime-coordinator
  namespace: minwm-realtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minwm-realtime-coordinator
  ports:
    - name: http
      port: 18081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minwm-realtime-coordinator
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: minwm-realtime-coordinator
    app.kubernetes.io/part-of: minwm-realtime
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-realtime-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-realtime-coordinator
        app.kubernetes.io/part-of: minwm-realtime
    spec:
      serviceAccountName: minwm-realtime-coordinator
      terminationGracePeriodSeconds: 30
      nodeSelector:
        karpenter.sh/nodepool: minwm-realtime-cpu
      tolerations:
        - key: seedleap.ai/task
          operator: Equal
          value: minwm-realtime-cpu
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: minwm-realtime-coordinator
      containers:
        - name: coordinator
          image: REPLACE_WITH_COORDINATOR_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - >-
              exec python -m sglang.multimodal_gen.runtime.entrypoints.realtime_coordinator_server
              --host=0.0.0.0
              --port=18081
              --backend=dynamodb
              --table-name=$(COORDINATOR_TABLE)
              --region=$(AWS_REGION)
              --ttl-s=30
              --worker-ttl-s=15
              --wait-timeout-s=10
              --candidate-limit=64
          env:
            - name: COORDINATOR_TABLE
              value: REPLACE_WITH_COORDINATOR_TABLE
            - name: AWS_REGION
              value: REPLACE_WITH_AWS_REGION
            - name: OTEL_SERVICE_NAME
              value: minwm-realtime-coordinator
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://minwm-realtime-adot:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=minwm,deployment.environment=production
          ports:
            - name: http
              containerPort: 18081
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: minwm-realtime-coordinator
  namespace: minwm-realtime
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-realtime-coordinator
