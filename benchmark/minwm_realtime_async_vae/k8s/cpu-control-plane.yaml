apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: minwm-realtime-cpu
  labels:
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
  template:
    metadata:
      labels:
        seedleap.ai/control-plane: minwm-realtime
        seedleap.ai/test-run: minwm-async-vae-benchmark
    spec:
      expireAfter: 168h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: platform-ec2-all
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-2a, us-east-2b, us-east-2c]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [m6a.xlarge, m7a.xlarge, m7i-flex.xlarge]
      taints:
        - key: seedleap.ai/task
          value: minwm-realtime-cpu
          effect: NoSchedule
