# PyPI packaging for the sgl-router binary: `pip install sgl-router` puts the
# `sgl-router` executable on PATH. The wheel holds only the binary (no Python
# module); its version is the crate version in Cargo.toml. Built and published
# by .github/workflows/release-sgl-router.yml on `router-v*` tags.

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "sgl-router"
dynamic = ["version"]
# maturin does not carry these over from Cargo.toml once [project] is present.
description = "Slim KV-aware OpenAI-compatible router for SGLang workers"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/sgl-project/sglang/tree/main/sgl-router"
Repository = "https://github.com/sgl-project/sglang"

[tool.maturin]
bindings = "bin"
