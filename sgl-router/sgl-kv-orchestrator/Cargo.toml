[package]
name = "sgl-kv-orchestrator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Session KV orchestration and Engine control"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jsonschema = { version = "0.58.6", default-features = false }
anyhow = "1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls", "http2"], default-features = false }
tokio = { version = "1.42", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
