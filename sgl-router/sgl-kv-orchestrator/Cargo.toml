[package]
name = "sgl-kv-orchestrator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pure versioned KV control protocol and orchestration models"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jsonschema = { version = "0.58.6", default-features = false }
tokio = { version = "1.42", features = ["rt", "sync", "time", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "test-util", "net", "io-util"] }
